<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — settings</title>
  <link rel="stylesheet" href="/css/style.css?v=202609052012">
</head>
<body>

<div id="view">
  <div style="max-width:560px;">
    <div class="wv-page-title" style="margin-bottom:4px;">Settings</div>
    <div style="color:var(--text-2);font-size:13px;margin-bottom:28px;">Manage your profile and preferences</div>

    <div id="alert-container" style="margin-bottom:16px;"></div>

    <!-- Appearance -->
    <div class="wv-settings-section">
      <div class="wv-settings-title">Appearance</div>
      <div class="wv-card" style="padding:18px 20px;display:flex;gap:10px;flex-wrap:wrap;">
        <label class="wv-pill" style="cursor:pointer;"><input type="radio" name="wv-theme" value="dark" style="width:auto;margin:0 4px 0 0;" onchange="setTheme('dark')"> Dark</label>
        <label class="wv-pill" style="cursor:pointer;"><input type="radio" name="wv-theme" value="light" style="width:auto;margin:0 4px 0 0;" onchange="setTheme('light')"> Light</label>
        <script>document.currentScript.parentNode.querySelector('input[value="' + (localStorage.getItem('wv_theme')==='light'?'light':'dark') + '"]').checked = true;</script>
      </div>
    </div>

    <!-- Profile section -->
    <div class="wv-settings-section">
      <div class="wv-settings-title">Artist Profile</div>
      <div class="wv-card" style="padding:24px;">

        <!-- Avatar preview + upload -->
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
          <div style="width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--brand);" id="avatar-preview-wrap">
            <span id="avatar-initials">?</span>
          </div>
          <div>
            <input type="file" id="profile-img-file" accept="image/*" style="display:none" onchange="uploadProfileImage('profile-img-file','profile_image_url')">
            <button class="wv-pill" onclick="document.getElementById('profile-img-file').click()">Upload photo</button>
            <span id="profile_image_url-status" style="font-size:12px;color:var(--text-2);margin-left:8px;"></span>
          </div>
        </div>

        <div class="wv-form-field">
          <label class="wv-form-label">Display name *</label>
          <input class="wv-input" type="text" id="edit-name" placeholder="Your name">
        </div>

        <div class="wv-form-field">
          <label class="wv-form-label">Bio</label>
          <textarea class="wv-input" id="edit-bio" rows="3" placeholder="Tell people about yourself…" style="border-radius:var(--r-md);resize:vertical;"></textarea>
        </div>

        <div class="wv-form-field">
          <label class="wv-form-label">Location</label>
          <input class="wv-input" type="text" id="edit-location" placeholder="City, Country">
        </div>

        <div class="wv-form-field">
          <label class="wv-form-label">Website</label>
          <input class="wv-input" type="url" id="edit-website" placeholder="https://…">
        </div>

        <!-- Hidden fields updated by image uploads -->
        <input type="hidden" id="edit-avatar">
        <input type="hidden" id="edit-banner">

        <div class="wv-form-field">
          <label class="wv-form-label">Banner image</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input class="wv-input" type="url" id="edit-banner-url" placeholder="https://…" style="flex:1;" oninput="document.getElementById('edit-banner').value=this.value">
            <input type="file" id="banner-img-file" accept="image/*" style="display:none" onchange="uploadProfileImage('banner-img-file','banner_url')">
            <button class="wv-pill" onclick="document.getElementById('banner-img-file').click()">Upload</button>
          </div>
          <span id="banner_url-status" style="font-size:12px;color:var(--text-2);"></span>
        </div>

        <div id="profile-alert" style="margin-top:4px;"></div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button class="wv-pill brand" style="padding:10px 24px;" onclick="saveProfile()">Save changes</button>
          <button class="wv-pill" onclick="loadSettings()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Account section -->
    <div class="wv-settings-section">
      <div class="wv-settings-title">Account</div>
      <div class="wv-card" style="padding:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:14px;font-weight:500;" id="settings-username">Username</div>
            <div style="font-size:12px;color:var(--text-2);">Your login username</div>
          </div>
        </div>

        <!-- Change password — hidden for OAuth-only accounts -->
        <div id="change-password-section" style="display:none;margin-top:20px;padding-top:20px;border-top:1px solid var(--hair);">
          <div style="font-size:14px;font-weight:600;margin-bottom:14px;">Change Password</div>
          <div class="wv-form-field" style="margin-bottom:10px;">
            <input class="wv-input" type="password" id="cp-current" placeholder="Current password" autocomplete="current-password">
          </div>
          <div class="wv-form-field" style="margin-bottom:10px;">
            <input class="wv-input" type="password" id="cp-new" placeholder="New password (min 6 chars)" autocomplete="new-password">
          </div>
          <div class="wv-form-field" style="margin-bottom:14px;">
            <input class="wv-input" type="password" id="cp-confirm" placeholder="Confirm new password" autocomplete="new-password">
          </div>
          <div id="cp-alert" style="font-size:13px;margin-bottom:10px;"></div>
          <button class="wv-pill brand" onclick="changePassword()">Update Password</button>
        </div>

        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hair);">
          <button class="wv-pill" style="color:var(--red);" onclick="if(confirm('Log out?'))logout()">Log out</button>
        </div>
      </div>
    </div>

    <!-- Connected accounts -->
    <div class="wv-settings-section">
      <div class="wv-settings-title">Connected Accounts</div>
      <div class="wv-card" style="padding:24px;">
        <div id="connections-loading" style="color:var(--text-2);font-size:13px;">Loading…</div>
        <div id="connections-content" style="display:none;">

          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.054a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
              <div>
                <div style="font-size:14px;font-weight:500;">Discord</div>
                <div id="discord-status-label" style="font-size:12px;color:var(--text-2);">Not connected</div>
              </div>
            </div>
            <button id="discord-action-btn" class="wv-pill" onclick="toggleConnection('discord')"></button>
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              <div>
                <div style="font-size:14px;font-weight:500;">Google</div>
                <div id="google-status-label" style="font-size:12px;color:var(--text-2);">Not connected</div>
              </div>
            </div>
            <button id="google-action-btn" class="wv-pill" onclick="toggleConnection('google')"></button>
          </div>

        </div>
        <div id="connections-alert" style="margin-top:12px;font-size:13px;"></div>
      </div>
    </div>

    <!-- Theme section -->
</div>
</div><!-- /view -->

<script src="/js/api.js?v=202609052012"></script>
<script src="/js/layout.js?v=202609052012"></script>
<script src="/js/player.js?v=202609052012"></script>
<script src="/js/router.js?v=202609052012"></script>
<script>
  if (!isLoggedIn()) navigate('/login.html');
  initPlayer();

  var me = null;
  var artist = null;

  function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  async function loadSettings() {
    try {
      me = await api('/auth/me');
      artist = me.artist;
      if (!artist) throw new Error('No artist profile. Try logging out and back in.');

      document.getElementById('edit-name').value = artist.display_name || '';
      document.getElementById('edit-bio').value = artist.bio || '';
      document.getElementById('edit-location').value = artist.location || '';
      document.getElementById('edit-website').value = artist.website || '';
      document.getElementById('edit-avatar').value = artist.profile_image_url || '';
      document.getElementById('edit-banner').value = artist.banner_url || '';
      document.getElementById('edit-banner-url').value = artist.banner_url || '';
      document.getElementById('settings-username').textContent = '@' + (me.username || '');
      if (me.has_password) document.getElementById('change-password-section').style.display = '';

      // Avatar display
      const wrap = document.getElementById('avatar-preview-wrap');
      if (artist.profile_image_url) {
        wrap.innerHTML = '<img src="'+escHtml(artist.profile_image_url)+'" alt="" style="width:100%;height:100%;object-fit:cover;">';
      } else {
        const initials = (artist.display_name || me.username || '?').charAt(0).toUpperCase();
        document.getElementById('avatar-initials').textContent = initials;
      }
    } catch (err) {
      if (err.message.includes('401')) return navigate('/login.html');
      showAlert('alert-container', 'Failed to load: ' + err.message);
    }
  }

  async function saveProfile() {
    clearAlert('profile-alert');
    const updates = {
      display_name: document.getElementById('edit-name').value.trim(),
      bio: document.getElementById('edit-bio').value.trim(),
      profile_image_url: document.getElementById('edit-avatar').value.trim() || null,
      banner_url: document.getElementById('edit-banner').value.trim() || null,
      location: document.getElementById('edit-location').value.trim() || null,
      website: document.getElementById('edit-website').value.trim() || null,
    };
    if (!updates.display_name) return showAlert('profile-alert', 'Display name is required');
    try {
      artist = await api('/artists/'+artist.id, { method: 'PUT', body: JSON.stringify(updates) });
      showAlert('profile-alert', '✓ Profile saved', 'success');
    } catch (err) {
      showAlert('profile-alert', err.message);
    }
  }

  async function uploadProfileImage(inputId, field) {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return;
    const statusEl = document.getElementById(field+'-status');
    if (statusEl) statusEl.textContent = 'Uploading…';
    try {
      const form = new FormData();
      form.append('image', file);
      const result = await apiUpload('/upload/image', form);
      const url = result.url;
      if (field === 'profile_image_url') {
        document.getElementById('edit-avatar').value = url;
        const wrap = document.getElementById('avatar-preview-wrap');
        wrap.innerHTML = '<img src="'+escHtml(url)+'" alt="" style="width:100%;height:100%;object-fit:cover;">';
      } else if (field === 'banner_url') {
        document.getElementById('edit-banner').value = url;
        document.getElementById('edit-banner-url').value = url;
      }
      if (statusEl) statusEl.textContent = '✓ Uploaded';
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Upload failed';
    }
  }

  var _connections = { discord: false, google: false };

  async function loadConnections() {
    try {
      _connections = await api('/oauth/connections');
      renderConnections();
      document.getElementById('connections-loading').style.display = 'none';
      document.getElementById('connections-content').style.display = '';
    } catch (_) {
      // Hide the whole section if the endpoint isn't ready yet
      var section = document.getElementById('connections-loading').closest('.wv-settings-section');
      if (section) section.style.display = 'none';
    }
  }

  function renderConnections() {
    for (var p of ['discord', 'google']) {
      var connected = _connections[p];
      document.getElementById(p + '-status-label').textContent = connected ? 'Connected' : 'Not connected';
      var btn = document.getElementById(p + '-action-btn');
      btn.textContent = connected ? 'Disconnect' : 'Connect';
      btn.style.color = connected ? 'var(--red)' : '';
    }
  }

  async function toggleConnection(provider) {
    if (_connections[provider]) {
      if (!confirm('Disconnect ' + provider.charAt(0).toUpperCase() + provider.slice(1) + '?')) return;
      try {
        await api('/oauth/' + provider + '/unlink', { method: 'DELETE' });
        _connections[provider] = false;
        renderConnections();
        document.getElementById('connections-alert').textContent = provider.charAt(0).toUpperCase() + provider.slice(1) + ' disconnected.';
      } catch (err) {
        document.getElementById('connections-alert').textContent = 'Error: ' + err.message;
      }
    } else {
      var token = localStorage.getItem('token');
      location.href = API_BASE + '/oauth/' + provider + '/link?token=' + encodeURIComponent(token);
    }
  }

  async function changePassword() {
    var current = document.getElementById('cp-current').value;
    var newPw = document.getElementById('cp-new').value;
    var confirm = document.getElementById('cp-confirm').value;
    var alertEl = document.getElementById('cp-alert');
    alertEl.style.color = 'var(--red)'; alertEl.textContent = '';
    if (!current || !newPw || !confirm) { alertEl.textContent = 'All fields are required.'; return; }
    if (newPw !== confirm) { alertEl.textContent = 'New passwords do not match.'; return; }
    if (newPw.length < 6) { alertEl.textContent = 'New password must be at least 6 characters.'; return; }
    try {
      await api('/auth/change-password', { method: 'POST', body: JSON.stringify({ currentPassword: current, newPassword: newPw }) });
      alertEl.style.color = 'var(--green)';
      alertEl.textContent = '✓ Password updated.';
      document.getElementById('cp-current').value = '';
      document.getElementById('cp-new').value = '';
      document.getElementById('cp-confirm').value = '';
    } catch (err) {
      alertEl.style.color = 'var(--red)';
      alertEl.textContent = err.message || 'Failed to update password.';
    }
  }

  loadSettings();
  loadConnections();
</script>
</body>
</html>
