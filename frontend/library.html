    .lib-when { font-size: 12.5px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

    .lib-pill { position: absolute; left: 18px; top: 18px; z-index: 2; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 8px; border-radius: var(--r-pill); background: rgba(0,0,0,0.62); color: #fff; pointer-events: none; display: inline-flex; gap: 4px; align-items: center; }

      .lib-cheart { opacity: 1; }
      .lib-rail { grid-auto-columns: 132px; }

    }

  // ── Now playing highlight ──────────────────────────────────────────────
  function markNow() {
    var root = $('lib-body');
    if (!root) return;
    var n = nowIds();
    root.querySelectorAll('.is-now').forEach(function (el) { el.classList.remove('is-now'); });
    root.classList.toggle('lib-live', !!n.on);
    if (n.t) root.querySelectorAll('[data-tid="' + CSS.escape(n.t) + '"]').forEach(function (el) { if (!el.classList.contains('lib-cplay')) el.classList.add('is-now'); });
    if (n.a) root.querySelectorAll('[data-aid="' + CSS.escape(n.a) + '"]').forEach(function (el) { el.classList.add('is-now'); });
  }

  // ── Actions ────────────────────────────────────────────────────────────
  function findTrack(id) { return ((S.lib && S.lib.tracks) || []).filter(function (t) { return t.id === id; })[0]; }
  function findAlbum(id) { return ((S.lib && S.lib.albums) || []).filter(function (a) { return a.id === id; })[0]; }

  function playList(list, startId, shuffle) {
    list = list.filter(function (t) { return t.ia_url; });
    if (!list.length) { toast('nothing here can play rn', 'error'); return; }
    var q = list.map(trackObj);
    var idx = 0;
    if (shuffle) {
      for (var i = q.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = q[i]; q[i] = q[j]; q[j] = x; }
    } else if (startId) {
      for (var k = 0; k < q.length; k++) if (q[k].id === startId) { idx = k; break; }
    }
    if (typeof setPlayerQueue === 'function' && typeof playQueueIndex === 'function') {
      setPlayerQueue(q, idx);
      playQueueIndex(idx);
    } else if (typeof playTrack === 'function') playTrack(q[idx]);
    setTimeout(markNow, 60);
  }

  function unlikeTrack(id) {
    var list = S.lib.tracks || [];
    var idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    var t = list[idx];
    list.splice(idx, 1);
    refreshAfterChange();
    api('/tracks/' + encodeURIComponent(id) + '/like', { method: 'POST' }).then(function (r) {
      if (r && r.liked === true) {
        api('/tracks/' + encodeURIComponent(id) + '/like', { method: 'POST' }).catch(function () {});
      }
      if (typeof window.refreshSidebarLibrary === 'function') { try { window.refreshSidebarLibrary(); } catch (_) {} }
      toast('removed from liked edits', '', 6000, {
        title: 'removed from liked edits', body: t.title || '', action: 'Undo',
        onClick: function () {
          api('/tracks/' + encodeURIComponent(id) + '/like', { method: 'POST' }).then(function () {
            if (!findTrack(id)) { (S.lib.tracks || []).splice(Math.min(idx, S.lib.tracks.length), 0, t); refreshAfterChange(); }
            if (typeof window.refreshSidebarLibrary === 'function') { try { window.refreshSidebarLibrary(); } catch (_) {} }
            toast('back in your liked edits');
          }).catch(function () { toast('couldnt undo that...try liking it again', 'error'); });
        }
      });
    }).catch(function () {
      if (!findTrack(id)) { list.splice(Math.min(idx, list.length), 0, t); refreshAfterChange(); }
      toast('couldnt update that like...try again', 'error');
    });
  }

  function unlikeComp(id) {
    var list = S.lib.albums || [];
    var idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    var a = list[idx];
    list.splice(idx, 1);
    refreshAfterChange();
    api('/albums/' + encodeURIComponent(id) + '/like', { method: 'POST' }).then(function (r) {
      if (r && r.liked === true) api('/albums/' + encodeURIComponent(id) + '/like', { method: 'POST' }).catch(function () {});
      toast('removed from liked comps', '', 6000, {
        title: 'removed from liked comps', body: a.title || '', action: 'Undo',
        onClick: function () {
          api('/albums/' + encodeURIComponent(id) + '/like', { method: 'POST' }).then(function () {
            if (!findAlbum(id)) { S.lib.albums.splice(Math.min(idx, S.lib.albums.length), 0, a); refreshAfterChange(); }
            toast('back in your liked comps');
          }).catch(function () { toast('couldnt undo that...try liking it again', 'error'); });
        }
      });
    }).catch(function () {
      if (!findAlbum(id)) { list.splice(Math.min(idx, list.length), 0, a); refreshAfterChange(); }
      toast('couldnt update that like...try again', 'error');
    });
  }

  function refreshAfterChange() {
    if (S.lib && S.lib.counts) {
      S.lib.counts.tracks = (S.lib.tracks || []).length;
      S.lib.counts.albums = (S.lib.albums || []).length;
    }
    renderHero(false);
    renderTabs();
    if (S.tab === 'tracks' && !playableTracks().length) renderToolbar();
    renderBody();
  }

  function playRecent(id, type) {
    if (type === 'album') { if (typeof playCompById === 'function') playCompById(id); return; }
    var it = recent().filter(function (x) { return x.id === id; })[0];
    if (!it) { var t = tally()[id]; it = t; }
    if (it && it.ia_url && typeof playTrack === 'function') playTrack({ id: it.id, title: it.title, ia_url: it.ia_url, cover_url: it.cover_url, artist_name: it.artist_name });
    else if (typeof navigate === 'function') navigate('/track?id=' + encodeURIComponent(id));
  }

  function playRated(id) {
    var r = S.ratings && S.ratings.items.filter(function (x) { return x.entity_id === id; })[0];
    if (!r) return;
    if (r.entity_type === 'album') { if (typeof playCompById === 'function') playCompById(id); return; }
    if (r.ia_url && typeof playTrack === 'function') playTrack({ id: r.entity_id, title: r.title, ia_url: r.ia_url, cover_url: r.cover_url, artist_name: r.creator || '' });
    setTimeout(markNow, 60);
  }

  function setTab(tab, push) {
    if (!visibleTabs().some(function (t) { return t.k === tab; })) tab = 'tracks';
    if (S.tab !== tab) S.q = '';
    S.tab = tab;
    ls('wv_lib_tab', tab);
    if (push) {
      try {
        var u = new URL(location.href);
        if (tab === 'tracks') u.searchParams.delete('tab'); else u.searchParams.set('tab', tab);
        history.replaceState(history.state, '', u.pathname + u.search);
      } catch (_) {}
    }
    renderTabs();
    renderToolbar();
    renderBody();
  }

  function onClick(e) {
    var el = e.target.closest('[data-act], [data-nav]');
    if (!el || !$('lib-root') || !$('lib-root').contains(el)) return;
    var act = el.getAttribute('data-act');
    if (!act && el.hasAttribute('data-nav')) {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      if (typeof navigate === 'function') navigate(el.getAttribute('data-nav')); else location.href = el.getAttribute('data-nav');
      return;
    }
    var id = el.getAttribute('data-id');
    if (el.tagName === 'A' && act) e.preventDefault();
    if (act !== 'open' && act !== 'rowplay') e.stopPropagation();
    switch (act) {
      case 'tab': setTab(el.getAttribute('data-tab'), true); break;
      case 'view':
        ls('wv_lib_view_' + S.tab, el.getAttribute('data-view'));
        renderToolbar(); renderBody(); break;
      case 'star': S.star = +el.getAttribute('data-star') || 0; renderToolbar(); renderBody(); break;
      case 'playall': playList(currentTracks(), null, false); break;
      case 'shuffle': playList(currentTracks(), null, true); break;
      case 'rowplay': {
        e.stopPropagation();
        var tid = el.getAttribute('data-tid');
        var t = findTrack(tid);
        if (t && t.ia_url) playList(currentTracks(), tid, false);
        else if (typeof navigate === 'function') navigate('/track?id=' + encodeURIComponent(tid));
        break;
      }
      case 'queue': { var tq = findTrack(id); if (tq && typeof addToQueue === 'function') addToQueue(trackObj(tq)); break; }
      case 'addpl': {
        var ta = findTrack(id);
        if (ta && typeof window.openAddToPlaylist === 'function') window.openAddToPlaylist(trackObj(ta));
        else toast('playlists arent working rn...try again later', 'error');
        break;
      }
      case 'unlike': unlikeTrack(id); break;
      case 'unlikecomp': unlikeComp(id); break;
      case 'playcomp': { var al = findAlbum(id); if (typeof playCompById === 'function') playCompById(id, al ? { album: al } : undefined); break; }
      case 'queuecomp': if (typeof addAlbumToQueue === 'function') addAlbumToQueue(id); break;
      case 'playrated': playRated(id); break;
      case 'playrecent': playRecent(id, el.getAttribute('data-type')); break;
      case 'retryrated': S.ratingsErr = false; renderBody(); break;
      case 'newpl': if (typeof window.wvNewPlaylist === 'function') window.wvNewPlaylist(); else if (typeof navigate === 'function') navigate('/playlist-builder'); break;
      case 'open': {
        if (e.target.closest('a[href]') && e.target.closest('a[href]') !== el) return;
        var href = el.getAttribute('data-href');
        if (href && typeof navigate === 'function') navigate(href);
        break;
      }
    }
  }
  function onKey(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target;
    if (!el || !el.classList || !el.classList.contains('lib-row')) return;
    e.preventDefault();
    el.click();
  }

  // ── Data ───────────────────────────────────────────────────────────────
  function loadRatings() {
    if (S.ratingsLoading || S.ratings) return;
    S.ratingsLoading = true;
    var gen = S.gen;
    api('/library/ratings').then(function (d) {
      if (gen !== S.gen) return;
      S.ratingsLoading = false;
      S.ratings = { items: (d && d.items) || [], dist: (d && d.dist) || [0, 0, 0, 0, 0] };
      renderTabs();
      if (S.tab === 'rated') { renderToolbar(); renderBody(); }
    }).catch(function (err) {
      if (err && err.navAborted) return;
      S.ratingsLoading = false;
      S.ratingsErr = true;
      if (S.tab === 'rated') renderBody();
    });
  }

  function loggedOut() {
    renderHero(false);
    $('lib-hero').querySelector('.lib-stats').innerHTML = '';
    $('lib-tabs').innerHTML = '';
    $('lib-toolbar').innerHTML = '';
    $('lib-body').innerHTML = empty(ICON.lock, 'log in to see your library', 'your liked edits, comps, ratings and playlists live here', '<a class="lib-btn pri" href="/login">Log in</a>');
  }

  function load() {
    S.gen++;
    var gen = S.gen;
    var want = null;
    try { want = new URLSearchParams(location.search).get('tab'); } catch (_) {}
    S.tab = want || ls('wv_lib_tab') || 'tracks';
    if (!TABS.some(function (t) { return t.k === S.tab; })) S.tab = 'tracks';

    if (typeof isLoggedIn === 'function' && !isLoggedIn()) { loggedOut(); return; }
    renderHero(true);
    renderTabs();
    renderToolbar();
    renderBody();

    api('/library').then(function (d) {
      if (gen !== S.gen || !$('lib-root')) return;
      d = d || {};
      d.tracks = d.tracks || []; d.albums = d.albums || []; d.playlists = d.playlists || []; d.counts = d.counts || {};
      S.lib = d;
      if (typeof window.setPageBgImage === 'function') {
        var art = d.albums.filter(function (a) { return a.cover_url; })[0] || d.tracks.filter(function (t) { return t.cover_url; })[0];
        window.setPageBgImage(art ? art.cover_url : '');
      }
      if (S.tab === 'rated' && !hasRatings()) S.tab = 'tracks';
      renderHero(false);
      renderTabs();
      renderToolbar();
      renderBody();
      if (hasRatings() && S.tab !== 'rated') loadRatings();
    }).catch(function (err) {
      if (err && err.navAborted) return;
      if (err && err.status === 401) { loggedOut(); return; }
      renderHero(false);
      $('lib-body').innerHTML = empty(ICON.stack, 'couldnt load your library', (err && err.message) || 'try again in a sec', '<button type="button" class="lib-btn" data-act="reload">Try again</button>');
      var b = $('lib-body').querySelector('[data-act="reload"]');
      if (b) b.addEventListener('click', load);
    });
  }

  var root = $('lib-root');
  root.addEventListener('click', onClick);
  root.addEventListener('keydown', onKey);
  var onMedia = function () { setTimeout(markNow, 30); };
  document.addEventListener('play', onMedia, true);
  document.addEventListener('pause', onMedia, true);
  document.addEventListener('ended', onMedia, true);
  document.addEventListener('loadstart', onMedia, true);
  window._pageCleanup.push(function () {
    document.removeEventListener('loadstart', onMedia, true);
    document.removeEventListener('play', onMedia, true);
    document.removeEventListener('pause', onMedia, true);
    document.removeEventListener('ended', onMedia, true);
    S.gen++;
  });

  load();
})();
</script>
</body>
</html>
