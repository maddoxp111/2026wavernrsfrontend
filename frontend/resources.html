<style>

  .yt-desc { background:var(--surface); border-radius:14px; padding:14px 16px; margin-bottom:18px; font-size:14px; line-height:1.6; color:var(--text-2); }

<script>
initPlayer();
(function () {
  var m0 = document.getElementById('ye-mode'); if (m0 && typeof wvArchiveMode === 'function') m0.outerHTML = wvArchiveMode('ye');
  var root = document.getElementById('yt-root');
  var P = new URLSearchParams(location.search);
  var S = { tabs: [], tab: null, cache: {}, d: null, era: P.get('era') || null, q: (P.get('q') || '').trim(), limit: 250, keyDefs: {}, playList: [], playIdx: -1, art: { era: '', type: '', use: '' } };

  // ── small helpers ────────────────────────────────────────────
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, ''); }
  function lines(s) { return String(s || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }
  function first(s) { return lines(s)[0] || ''; }
  function img(u, w, whole) {
    if (!u) return '';
    if (/sheets-images|googleusercontent/.test(u)) return u.replace(/=[wshp]\d[^=\/]*$/, '') + '=w' + (w || 400);
    return typeof wvImg === 'function' ? wvImg(u, w || 400, { square: !whole }) : u;
  }
  function grad(seed) { return typeof coverGradient === 'function' ? coverGradient(seed || '') : 'linear-gradient(135deg,#333,#111)'; }
  function initials(n) { var w = String(n || '').replace(/[^\w\s]/g, '').trim().split(/\s+/); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 2)).toUpperCase(); }
  function cover(url, seed, cls, w) {
    return '<div class="yt-cover ' + (cls || '') + '" style="background:' + grad(seed) + ';"><div class="yt-ini">' + esc(initials(seed)) + '</div>' +
      (url ? '<img src="' + esc(img(url, w)) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>';
  }
  function empty(t, sub) { return '<div class="yt-empty"><b>' + esc(t) + '</b>' + esc(sub || '') + '</div>'; }
  function setUrl() {
    var q = new URLSearchParams();
    if (S.tab) q.set('tab', S.tab.name);
    if (S.era) q.set('era', S.era);
    var u = location.pathname + (q.toString() ? '?' + q.toString() : '');
    try { history.replaceState(history.state, '', u); } catch (_) {}
  }

  // Tags the tracker puts in front of names, explained by the Key tab.
  var MARKS = [['⭐', 'best of'], ['🏆', 'grail'], ['🥇', 'wanted'], ['🏅', 'wanted'], ['✨', 'special'], ['🗑️', 'worst of'], ['🗑', 'worst of'], ['🤖', 'AI'], ['⁉️', 'lost'], ['⁉', 'lost']];
  function splitMarks(t) {
    var tags = [], s = String(t || '').trim(), again = true;
    while (again) {
      again = false;
      for (var i = 0; i < MARKS.length; i++) {
        if (s.indexOf(MARKS[i][0]) === 0) { if (tags.indexOf(MARKS[i]) === -1 && !tags.some(function (x) { return x[1] === MARKS[i][1]; })) tags.push(MARKS[i]); s = s.slice(MARKS[i][0].length).replace(/^[\s️]+/, ''); again = true; }
      }
    }
    return { title: s, tags: tags };
  }

  // ── badges ───────────────────────────────────────────────────
  var COLORS = {
    avail: [[/^og file/, '#a78bfa'], [/^full/, '#4ade80'], [/^tagged/, '#60a5fa'], [/^partial/, '#fbbf24'], [/^snippet/, '#fb923c'], [/^beat only/, '#fb923c'], [/^stem bounce/, '#c4b5fd'], [/^confirmed/, '#2dd4bf'], [/^rumou?red/, '#94a3b8'], [/^conflicting/, '#94a3b8']],
    quality: [[/lossless/, '#34d399'], [/cd quality/, '#4ade80'], [/high quality|high-res|clear/, '#86efac'], [/low quality|blurry/, '#fbbf24'], [/recording/, '#fb923c'], [/not available|n\/a/, '#94a3b8'], [/fake/, '#f87171']],
  };
  function badge(kind, v) {
    var t = first(v); if (!t) return '';
    var n = t.toLowerCase(), c = '#94a3b8';
    (COLORS[kind] || []).some(function (p) { if (p[0].test(n)) { c = p[1]; return true; } return false; });
    var def = S.keyDefs[norm(t)] || '';
    return '<span class="yt-b" style="background:' + c + '22;color:' + c + ';border:1px solid ' + c + '44;"' + (def ? ' title="' + esc(def) + '"' : '') + '>' + esc(t) + '</span>';
  }

  // ── links ────────────────────────────────────────────────────
  var IS_APPLE = /iPad|iPhone|iPod/.test(navigator.platform || '') || (/Mac/.test(navigator.userAgent) && 'ontouchend' in document) || /iPhone|iPad|iPod/.test(navigator.userAgent);
  function pillowId(u) { var m = String(u || '').match(/(?:pillows|pillowcase)\.su\/f\/([a-z0-9]+)/i); return m ? m[1] : null; }
  function audioOf(u) {
    if (!u) return null;
    var p = pillowId(u); if (p) return API_BASE + '/resources/audio/' + p.toLowerCase() + (IS_APPLE ? '?ios=1' : '');
    if (/\.(mp3|m4a|wav|flac|ogg|aac|opus)(\?|#|$)/i.test(u)) return u;
    if (/(cdn\.samply\.app|archive\.org\/download|\.b-cdn\.net)/i.test(u)) return u;
    return null;
  }
  function hostLabel(u) {
    var h = ''; try { h = new URL(u).hostname.replace(/^www\./, ''); } catch (_) { return 'link'; }
    var MAP = { 'pillows.su': 'pillows', 'pillowcase.su': 'pillows', 'youtube.com': 'YouTube', 'youtu.be': 'YouTube', 'music.youtube.com': 'YouTube', 'open.spotify.com': 'Spotify', 'soundcloud.com': 'SoundCloud', 'music.apple.com': 'Apple Music', 'twitter.com': 'Twitter', 'x.com': 'X', 'instagram.com': 'Instagram', 'tiktok.com': 'TikTok', 'archive.org': 'Archive', 'mega.nz': 'MEGA', 'drive.google.com': 'Drive', 'reddit.com': 'Reddit', 'ibb.co': 'image', 'imgur.com': 'image', 'krakenfiles.com': 'Kraken', 'genius.com': 'Genius', 'discord.com': 'Discord', 'facebook.com': 'Facebook', 'vimeo.com': 'Vimeo', 'samply.app': 'Samply', 'untitled.stream': 'untitled' };
    return MAP[h] || h.split('.').slice(-2, -1)[0] || 'link';
  }
  function urlsIn(v) { return (String(v || '').match(/https?:\/\/[^\s|,]+/g) || []).map(function (u) { return u.replace(/[)\].,]+$/, ''); }); }

  // ── reading a tab ────────────────────────────────────────────
  function findCol(h, re) { return h.find(function (x) { return re.test(String(x).trim()); }) || null; }
  function model(d, tabName) {
    var h = d.headers || [];
    var C = {
      era: h[0],
      name: findCol(h, /^(name|song name|main content)$/i) || h[1],
      notes: findCol(h, /^notes?\b/i) || findCol(h, /^tracklist$/i),
      links: findCol(h, /^(link\(s\)|links?|snippet\(s\))$/i),
      length: findCol(h, /^(track length|length|copy length|full length|image \/ length)$/i),
      date: findCol(h, /^(leak date|release date|date made|date|start date)$/i),
      fileDate: findCol(h, /^file date$/i),
      avail: findCol(h, /^available length$/i),
      quality: findCol(h, /^quality$/i),
    };
    var used = {}; Object.keys(C).forEach(function (k) { if (C[k]) used[C[k]] = 1; });
    C.extra = h.filter(function (x) { return !used[x] && !/^col\d+$/.test(x) && !/^image$/i.test(x); });
    var rows = d.rows || [], imgs = d.row_images || {};
    var count = {};
    rows.forEach(function (r) { var e = (r[C.era] || '').trim(); if (e) count[e] = (count[e] || 0) + 1; });
    var eras = [], byEra = {}, byNorm = {};
    Object.keys(count).forEach(function (e) { if (count[e] >= 2 || (rows.length < 40 && count[e] >= 1)) byNorm[norm(e)] = e; });
    var items = [];
    rows.forEach(function (r, i) {
      var e = (r[C.era] || '').trim();
      var real = byNorm[norm(e)] === e && e;
      var nameFirst = first(r[C.name]);
      if (!real) {
        // An era summary row: the era name sits in Name, stats in the Era column.
        var hit = byNorm[norm(nameFirst)];
        if (hit) {
          var g = byEra[hit] || (byEra[hit] = { name: hit, rows: [], info: null });

    else if (e.key === 'ArrowRight' && LB.idx < LB.list.length - 1) { LB.idx++; paintLb(); e.preventDefault(); e.stopPropagation(); }
  }
  function closeLb() { var el = document.getElementById('yt-lb'); if (el) el.remove(); LB = null; document.removeEventListener('keydown', lbKey); }

  // ── key tab ──────────────────────────────────────────────────
  function keySections(d) {
    var h = d.h, rows = d.raw || [];
    var L = [h[0], h[1]], R = [h[2], h[3]];
    var secs = [{ t: 'how much of it there is', p: 'what the "available length" badges mean', kind: 'avail', items: [] }, { t: 'quality', p: 'what the quality badges mean', kind: 'quality', items: [] }, { t: 'type', p: 'what kind of file it is', kind: '', items: [] }, { t: 'tags & emojis', p: 'the little markers next to song names', kind: 'tag', items: [] }];
    var left = 0, right = 1;
    rows.forEach(function (r) {
      var lt = String(r[L[0]] || '').trim(), ld = String(r[L[1]] || '').trim(), rt = String(r[R[0]] || '').trim(), rd = String(r[R[1]] || '').trim();
      if (lt && !ld && /^type$/i.test(lt)) left = 2; else if (lt) secs[left].items.push([lt, ld]);
      if (rt && !rd && /^track tags$/i.test(rt)) right = 3; else if (rt) secs[right].items.push([rt, rd]);
    });
    return secs;
  }
  function renderKey() {
    var secs = keySections(S.d);
    root.innerHTML = '<div class="yt-key">' + secs.map(function (s) {
      return '<div class="yt-key-c"><h3>' + esc(s.t) + '</h3><p>' + esc(s.p) + '</p>' + s.items.map(function (it) {
        var label = s.kind === 'avail' || s.kind === 'quality' ? badge(s.kind, it[0]) : '<span class="yt-tag" style="font-size:12px;">' + esc(it[0]) + '</span>';
        return '<div class="yt-key-r">' + label + '<div>' + esc(it[1]) + '</div></div>';
      }).join('') + '</div>';
    }).join('') + '</div>';
  }
  // Key definitions power the tooltips on badges everywhere.
  async function loadKeyDefs() {
    var kt = S.tabs.find(function (t) { return /^key$/i.test(t.name); }); if (!kt) return;
    try {
      var d = await api('/resources/tracker?gid=' + encodeURIComponent(kt.gid));
      var h = d.headers || [];
      (d.rows || []).forEach(function (r) {
        [[h[0], h[1]], [h[2], h[3]]].forEach(function (p) {
          var t = String(r[p[0]] || '').trim(), v = String(r[p[1]] || '').trim();
          if (!t || !v) return;
          if (norm(t)) S.keyDefs[norm(t)] = v;
          S.keyDefs['mark:' + t.replace(/\uFE0F/g, '')] = v;
        });
      });
    } catch (_) {}
  }

  // pillows hosts almost every song here. When it's down, say so instead of silently failing.
  function checkPillows() {
    fetch(API_BASE + '/resources/pillows-status').then(function (r) { return r.json(); }).then(function (d) {
      var el = document.getElementById('yt-down'); if (!el) return;
      el.innerHTML = d && d.up === false ? '<div class="yt-down"><span>⚠️</span><div><b>pillows is down rn.</b> almost every song here is hosted on pillows, so most wont play till its back. anything thats been played on wavernrs before still works.</div></div>' : '';
    }).catch(function () {});
  }
  var _lastErrToast = 0;
  function onAudioErr() {
    if (!currentTrack || String(currentTrack.id || '').indexOf('yt-') !== 0) return;
    if (Date.now() - _lastErrToast < 4000) return;
    _lastErrToast = Date.now();
    if (typeof wvToast === 'function') wvToast('that song wont load rn...pillows might be down', 'error');
    checkPillows();
  }
  if (typeof audio !== 'undefined' && audio) { audio.addEventListener('error', onAudioErr); window._pageCleanup.push(function () { audio.removeEventListener('error', onAudioErr); }); }
  checkPillows();

  // ── boot ─────────────────────────────────────────────────────
  (async function boot() {
    try { S.tabs = (await api('/resources/tabs')).tabs || []; } catch (_) { S.tabs = []; }
    if (!S.tabs.length) { root.innerHTML = empty('no tracker connected', 'an admin has to link the tracker sheet in the admin panel first'); return; }
    var want = P.get('tab');
    var t = (want && S.tabs.find(function (x) { return x.name.toLowerCase() === want.toLowerCase(); })) || S.tabs[0];
    loadKeyDefs().then(function () { if (S.d && !S.d.isKey && !S.d.isArt && document.getElementById('yt-body')) renderBody(); });
    openTab(t, false);
  })();
})();
</script>
