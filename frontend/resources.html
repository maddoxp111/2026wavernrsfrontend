<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources — wavernrs</title>
  <link rel="stylesheet" href="/css/style.css?v=202609051938">
  <style>
    /* Standard tracker (artistgrid-style) rows */
    .tstd-row { display:flex; gap:12px; align-items:flex-start; padding:10px 14px; }
    .tstd-main { flex:1; min-width:0; }
    .tstd-sub { font-size:11.5px; color:var(--text-3); white-space:normal; line-height:1.4; margin-top:1px; }
    .tstd-notes { font-size:12px; color:var(--text-3); margin-top:4px; line-height:1.45; white-space:normal;
                  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
    .tstd-notes.open { display:block; -webkit-line-clamp:unset; overflow:visible; }
    .tstd-meta { display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; max-width:48%; }
    .tstd-col { font-size:12px; color:var(--text-3); white-space:nowrap; }
    .tstd-badge { font-size:10.5px; font-weight:700; padding:2.5px 9px; border-radius:6px; white-space:nowrap; letter-spacing:.02em; }
    @media (max-width: 720px) {
      .tstd-col { display:none; }
      .tstd-meta { max-width:none; }
    }

    /* Art tab */
    .art-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:16px; }
    .art-card { cursor:pointer; }
    .art-card-img { position:relative; width:100%; aspect-ratio:1; border-radius:var(--r-md);
                    overflow:hidden; background:var(--surface-2); display:grid; place-items:center; }
    .art-card-img img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
                        transition:opacity 260ms var(--ease); }
    .art-card-fallback { font-size:11px; color:var(--text-3); }
    .art-card.no-img img { display:none; }
    .art-card-cap { font-size:12.5px; font-weight:600; margin-top:8px; line-height:1.3;
                    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .art-card-sub { font-size:11px; color:var(--text-3); margin-top:2px; }

    /* Key / glossary tab */
    .gloss-row { padding:10px 0; border-bottom:1px solid var(--hair); }
    .gloss-term { font-size:13.5px; font-weight:650; }
    .gloss-def { font-size:12.5px; color:var(--text-2); margin-top:2px; line-height:1.45; }
  </style>
</head>
<body>

<div id="view">
<div class="container" style="max-width:1000px;">
  <div style="padding:28px 0 8px;">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:6px;">Resources</div>
    <div class="wv-title" style="font-size:32px;font-weight:800;letter-spacing:-0.04em;line-height:1.05;">Tracker</div>
    <p style="margin-top:8px;font-size:14px;color:var(--text-2);">Live from the community tracker sheet — every era, every leak, every link.</p>
  </div>

  <!-- Tab bar (dynamically populated) -->
  <div id="rtab-bar" style="display:flex;gap:8px;border-bottom:1px solid var(--hair);margin:18px 0 22px;flex-wrap:wrap;"></div>

  <!-- Content area -->
  <div id="tracker-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>
</div><!-- /view -->

<script src="/js/api.js?v=202609051938"></script>
<script src="/js/layout.js?v=202609051938"></script>
<script src="/js/player.js?v=202609051938"></script>
<script src="/js/router.js?v=202609051938"></script>
<script>
  initPlayer();

  // ── Global state ─────────────────────────────────────────────
  var trackerTabs = [];       // [{name, url}] from /api/resources/tabs
  var activeTabIdx = -1;
  var tabCache = {};          // idx → {data, analysis, groups}
  var activeData = null;
  var activeAnalysis = null;
  var activeGroups = null;    // grouped by era (or null if flat)
  var playable = [];
  var playIndex = -1;
  var renderLimit = 300;
  var eraOpenState = {};      // eraName → bool

  // ── Utilities ────────────────────────────────────────────────
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function firstLine(v) {
    var s = String(v == null ? '' : v).trim();
    var nl = s.indexOf('\n');
    return nl === -1 ? s : s.slice(0, nl).trim();
  }
  function truncate(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trim() + '…' : s; }

  // ── URL helpers ───────────────────────────────────────────────
  function pillowDirect(v) {
    var m = String(v || '').match(/(?:pillows|pillowcase)\.su\/f\/([a-z0-9]+)/i);
    return m ? 'https://api.pillows.su/api/download/' + m[1] : null;
  }
  function audioUrl(v) {
    if (!v || !/^https?:\/\//i.test(v)) return null;
    var pc = pillowDirect(v);
    if (pc) return pc;
    if (/\.(mp3|m4a|wav|flac|ogg|aac|opus|mp4)(\?|#|$)/i.test(v)) return v;
    if (/(cdn\.samply\.app|archive\.org\/download|googleusercontent\.com|\.b-cdn\.net)/i.test(v)) return v;
    return null;
  }
  function isUrl(v) { return !!(v && /^https?:\/\//i.test(v)); }
  // A URL that can go straight into an <img>.
  function isDirectImageUrl(v) {
    if (!v || !isUrl(v)) return false;
    return /\.(jpg|jpeg|png|webp|gif|avif)(\?|#|$)/i.test(v) ||
      /(googleusercontent|lh[0-9]\.google|cloudinary|i\.imgur\.com|i\.redd\.it|pbs\.twimg|cdn\.discordapp|media\.discordapp|i\.ibb\.co)/i.test(v);
  }
  // An image-host *page* — the art is there, but the URL points at the viewer,
  // not the file. The backend reads the page's og:image to get the real one.
  function isResolvableImageUrl(v) {
    if (!v || !isUrl(v)) return false;
    return /^https:\/\/(www\.)?(ibb\.co|imgur\.com|postimg\.cc|postimages\.org|gyazo\.com|lensdump\.com|imgbox\.com)\//i.test(v);
  }
  function isImageUrl(v) { return isDirectImageUrl(v) || isResolvableImageUrl(v); }

  // Resolve the page URLs after paint so the grid appears immediately and
  // fills in. Cached per URL, and capped so a 400-row Art tab doesn't open
  // 400 sockets at once.
  var _imgCache = {};
  function resolveArtImages(root) {
    var pending = Array.prototype.slice.call(
      (root || document).querySelectorAll('img[data-resolve]'));
    var inFlight = 0;
    function next() {
      if (!pending.length || inFlight >= 4) return;
      var el = pending.shift();
      var page = el.getAttribute('data-resolve');
      el.removeAttribute('data-resolve');
      if (!page) { next(); return; }
      if (_imgCache[page]) { el.src = _imgCache[page]; el.style.opacity = 1; next(); return; }
      inFlight++;
      fetch(API_BASE + '/imageproxy/resolve?url=' + encodeURIComponent(page))
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(d) {
          if (d && d.url) { _imgCache[page] = d.url; el.src = d.url; el.style.opacity = 1; }
          else { el.closest('.art-card') && el.closest('.art-card').classList.add('no-img'); }
        })
        .catch(function() {})
        .then(function() { inFlight--; next(); });
      next();
    }
    for (var i = 0; i < 4; i++) next();
  }

  // Any image found anywhere in a row — the Art tab's dedicated Image column is
  // empty in practice, with the art actually sitting in Link(s).
  function rowImage(r, an) {
    if (an && an.imageKey && isImageUrl(r[an.imageKey])) return r[an.imageKey];
    for (var k in r) { if (isImageUrl(r[k])) return r[k]; }
    return null;
  }

  // ── Column analysis ───────────────────────────────────────────
  function analyzeColumns(headers, rows) {
    // Title: header match → col1 → col0
    var titleKey = headers.find(function(h) { return /\b(name|title|song|track)\b/i.test(h); })
      || headers[1] || headers[0];

    // Era: header match or col0 high-repetition detection
    var eraKey = headers.find(function(h) {
      return /\b(era|category|section|group|period|phase)\b/i.test(h);
    });
    if (!eraKey) {
      var col0 = headers[0];
      if (col0 && col0 !== titleKey) {
        var runs = 0, maxRun = 0, curVal = null, curRun = 0;
        rows.forEach(function(r) {
          var v = (r[col0] || '').trim();
          if (v && v === curVal) { curRun++; }
          else { if (curRun >= 3) runs++; maxRun = Math.max(maxRun, curRun); curRun = 1; curVal = v || null; }
        });
        if (curRun >= 3) runs++;
        if (runs >= 2 || maxRun >= 5) eraKey = col0;
      }
    }

    // Description: header match
    var descKey = headers.find(function(h) {
      return /\b(note|notes|description|desc|info|comment|detail)\b/i.test(h);
    }) || null;

    // Image: header match only (content detection picks up random tweet screenshots etc.)
    var imageKey = headers.find(function(h) {
      return /\b(image|img|cover|art|photo|picture|pic|artwork)\b/i.test(h);
    }) || null;
    var imageKeyIsExplicit = !!imageKey;

    // For art tab only, also try content detection if no explicit column
    if (!imageKey) {
      imageKey = headers.find(function(h) {
        if (h === titleKey || h === eraKey || h === descKey) return false;
        var vals = rows.map(function(r) { return r[h]; }).filter(Boolean);
        if (vals.length < 2) return false;
        return vals.filter(isImageUrl).length >= Math.max(1, vals.length * 0.3);
      }) || null;
    }

    // Link columns: mostly URLs (≥50% of non-empty values)
    var linkKeys = headers.filter(function(h) {
      if (h === titleKey || h === eraKey || h === descKey || h === imageKey) return false;
      var vals = rows.map(function(r) { return r[h]; }).filter(Boolean);
      if (!vals.length) return false;
      return vals.filter(isUrl).length >= Math.max(1, vals.length * 0.5);
    });

    // Meta: everything else
    var metaKeys = headers.filter(function(h) {
      return h !== titleKey && h !== eraKey && h !== descKey && h !== imageKey
        && linkKeys.indexOf(h) === -1;
    });

    // Art tab: tab name contains "art" OR many image URLs in the sheet
    var tabName = (trackerTabs[activeTabIdx] || {}).name || '';
    var isArtTab = /\bart\b/i.test(tabName) || (imageKey != null && (function() {
      var total = 0, imgs = 0;
      headers.forEach(function(h) {
        rows.forEach(function(r) { var v = r[h]; if (v && v.trim()) { total++; if (isImageUrl(v)) imgs++; } });
      });
      return total > 0 && imgs / total > 0.15;
    })());

    // Standard tracker-sheet schema (Era / Name / Notes / Length / File Date /
    // Leak Date / Available Length / Quality / Link(s)) — when detected, rows
    // render as a proper tracker table with quality/availability badges
    // instead of the generic list.
    var findH = function(re) { return headers.find(function(h) { return re.test(String(h).trim()); }) || null; };
    var std = {
      era:      findH(/^era\b/i),
      name:     findH(/^name\b/i),
      notes:    findH(/^notes?\b/i),
      length:   findH(/^(track\s*)?length$/i),
      fileDate: findH(/^file\s*date/i),
      leakDate: findH(/^leak\s*date/i),
      avail:    findH(/^available/i),
      quality:  findH(/^quality/i),
      links:    findH(/^links?\b|^link\(s\)/i),
    };
    var isStd = !!(std.name && std.era && (std.quality || std.avail));
    if (isStd) {
      titleKey = std.name;
      eraKey = std.era;
      if (std.notes) descKey = std.notes;
    }

    return { titleKey: titleKey, eraKey: eraKey, descKey: descKey,
             imageKey: imageKey, imageKeyIsExplicit: imageKeyIsExplicit,
             linkKeys: linkKeys, metaKeys: metaKeys, isArtTab: isArtTab,
             isGlossary: isGlossaryTab(headers, rows),
             std: isStd ? std : null };
  }

  // ── Badge colors for the standard tracker ─────────────────────
  function _badge(text, color) {
    return '<span class="tstd-badge" style="background:' + color + '22;color:' + color + ';border:1px solid ' + color + '44;">' + escHtml(text) + '</span>';
  }
  function qualityBadge(v) {
    var s = String(v || '').trim();
    if (!s) return '';
    var n = s.toLowerCase();
    var color = 'var(--purple)';
    if (/high quality|cd quality|lossless/.test(n)) color = 'var(--green)';
    else if (/low quality/.test(n)) color = 'var(--yellow)';
    else if (/recording/.test(n)) color = 'var(--orange)';
    else if (/fake/.test(n)) color = 'var(--red)';
    else if (/not available|unavailable|n\/a/.test(n)) color = 'var(--text-3)';
    return _badge(firstLine(s), color);
  }
  function availBadge(v) {
    var s = String(v || '').trim();
    if (!s) return '';
    var n = s.toLowerCase();
    var color = 'var(--text-3)';
    if (/^full/.test(n)) color = 'var(--green)';
    else if (/tagged/.test(n)) color = 'var(--blue)';
    else if (/partial/.test(n)) color = 'var(--yellow)';
    else if (/snippet/.test(n)) color = 'var(--orange)';
    else if (/og file/.test(n)) color = 'var(--purple)';
    else if (/stem bounce/.test(n)) color = 'var(--purple-light)';
    else if (/confirmed/.test(n)) color = 'var(--teal)';
    return _badge(firstLine(s), color);
  }

  // ── Era grouping ──────────────────────────────────────────────
  function groupByEra(rows, an) {
    var eraKey = an.eraKey;
    if (!eraKey) return null;

    // Count how many rows each era-column value appears in.
    // Values that appear fewer than 3 times are summary/stats/changelog rows,
    // not real eras — skip them entirely.
    var counts = {};
    rows.forEach(function(r) {
      var v = (r[eraKey] || '').trim();
      if (v) counts[v] = (counts[v] || 0) + 1;
    });

    var groups = [];
    var eraMap = {};

    rows.forEach(function(r) {
      var eraName = (r[eraKey] || '').trim();
      if (!eraName || (counts[eraName] || 0) < 3) return; // skip non-era rows

      if (!eraMap[eraName]) {
        var g = { eraName: eraName, coverUrl: null, rows: [] };
        eraMap[eraName] = g;
        groups.push(g);
      }
      var g = eraMap[eraName];
      if (!g.coverUrl) {
        var img = rowImage(r, an);
        // Only direct URLs: an era header can't wait on a resolve round-trip.
        if (img && isDirectImageUrl(img)) g.coverUrl = img;
      }
      g.rows.push(r);
    });

    return groups.length ? groups : null;
  }

  // ── Audio helpers ─────────────────────────────────────────────
  function firstAudio(r) {
    if (!activeAnalysis) return null;
    for (var i = 0; i < activeAnalysis.linkKeys.length; i++) {
      var a = audioUrl(r[activeAnalysis.linkKeys[i]]);
      if (a) return a;
    }
    return null;
  }
  function rowToTrack(r) {
    return {
      title: r[activeAnalysis.titleKey] || 'Untitled',
      ia_url: firstAudio(r),
      artist_name: 'Tracker',
      cover_url: null,
    };
  }
  function shortLabel(h) {
    var s = String(h || 'Link').trim();
    return s.length > 14 ? s.slice(0, 13) + '…' : s;
  }

  // ── Tab loading ───────────────────────────────────────────────
  async function loadTabs() {
    var container = document.getElementById('tracker-container');
    try {
      var data = await api('/resources/tabs');
      trackerTabs = data.tabs || [];
    } catch (e) {
      trackerTabs = [];
    }
    renderTabBar();
    if (trackerTabs.length) {
      switchTab(0);
    } else {
      document.getElementById('tracker-container').innerHTML =
        emptyState('No tracker connected', 'An admin can link the tracker sheet in the admin panel.');
    }
  }

  function renderTabBar() {
    var bar = document.getElementById('rtab-bar');
    var html = trackerTabs.map(function(t, i) {
      return '<button class="wv-admin-tab' + (i === activeTabIdx ? ' active' : '') +
        '" id="rtab-' + i + '" onclick="switchTab(' + i + ')">' + escHtml(t.name || ('Tab ' + (i+1))) + '</button>';
    }).join('');
    bar.innerHTML = html;
  }

  function _deactivateAllTabs() {
    activeTabIdx = -1;
    trackerTabs.forEach(function(_, i) {
      var btn = document.getElementById('rtab-' + i);
      if (btn) btn.classList.remove('active');
    });
  }

  async function switchTab(idx) {
    if (idx === activeTabIdx && tabCache[idx]) {
      trackerTabs.forEach(function(_, i) {
        var btn = document.getElementById('rtab-' + i);
        if (btn) btn.classList.toggle('active', i === idx);
      });
      return;
    }
    _deactivateAllTabs();
    activeTabIdx = idx;
    trackerTabs.forEach(function(_, i) {
      var btn = document.getElementById('rtab-' + i);
      if (btn) btn.classList.toggle('active', i === idx);
    });

    if (tabCache[idx]) {
      activeData = tabCache[idx].data;
      activeAnalysis = tabCache[idx].analysis;
      activeGroups = tabCache[idx].groups;
      playable = tabCache[idx].playable;
      renderTracker('');
      return;
    }

    var container = document.getElementById('tracker-container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    try {
      // Auto-discovered tabs carry a gid (a tab of the tracker sheet itself);
      // admin-configured tabs are addressed by index.
      var t = trackerTabs[idx] || {};
      var q = t.gid ? ('gid=' + encodeURIComponent(t.gid)) : ('tab=' + idx);
      var data = await api('/resources/tracker?' + q);
      if (data.error) { container.innerHTML = emptyState('Tab unavailable', data.error); return; }
      if (!data.url) { container.innerHTML = emptyState('No sheet configured', 'An admin can connect a Google Sheet in the admin panel.'); return; }
      if (!data.rows || !data.rows.length) { container.innerHTML = emptyState('Tab is empty', 'The connected sheet has no data.'); return; }

      activeData = data;
      activeAnalysis = analyzeColumns(data.headers, data.rows);
      activeGroups = activeAnalysis.eraKey ? groupByEra(data.rows, activeAnalysis) : null;
      playable = data.rows.map(function(r, i) { return { r: r, i: i }; })
        .filter(function(x) { return firstAudio(x.r); });

      tabCache[idx] = { data: data, analysis: activeAnalysis, groups: activeGroups, playable: playable };
      renderTracker('');
    } catch (e) {
      container.innerHTML = emptyState('Couldn\'t load tab', 'Try again in a moment.');
    }
  }

  // ── Rendering: outer shell ────────────────────────────────────
  function emptyState(title, sub) {
    return '<div class="empty-state" style="text-align:center;padding:60px 20px;">' +
      '<div style="font-size:18px;font-weight:700;margin-bottom:6px;">' + escHtml(title) + '</div>' +
      '<div style="font-size:14px;color:var(--text-3);">' + escHtml(sub) + '</div></div>';
  }

  function renderTracker(query) {
    var rows = activeData.rows;
    var html = '';

    html += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;">';
    if (playable.length) {
      html += '<button class="btn btn-primary" onclick="playAllTracker()">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;margin-right:4px;"><path d="M8 5v14l11-7z"/></svg>Play All</button>';
    }
    html += '<div class="wv-input wv-search-wrap" style="flex:1;min-width:200px;display:flex;align-items:center;gap:8px;padding:9px 14px;">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>' +
      '<input id="tracker-search" placeholder="Search…" value="' + escHtml(query || '') + '" oninput="onTrackerSearch(this.value)" ' +
      'style="flex:1;background:transparent;border:none;outline:none;font-size:13.5px;color:inherit;font-family:inherit;"></div>';
    html += '<a href="' + escHtml(activeData.view_url || activeData.url) + '" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="text-decoration:none;">Open Sheet ↗</a>';
    html += '</div>';
    html += '<div id="tracker-count" style="font-size:12.5px;color:var(--text-3);margin-bottom:14px;"></div>';
    html += '<div id="tracker-rows"></div>';

    document.getElementById('tracker-container').innerHTML = html;
    renderRows(query || '');
  }

  var _searchTimer = null;
  function onTrackerSearch(v) {
    renderLimit = 300;
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(function() { renderRows(v); }, 120);
  }
  function showMoreTracker() {
    renderLimit += 300;
    var q = (document.getElementById('tracker-search') || {}).value || '';
    renderRows(q);
  }

  function renderRows(query) {
    var rows = activeData.rows;
    var an = activeAnalysis;
    var q = (query || '').toLowerCase().trim();

    var filtered = !q ? rows : rows.filter(function(r) {
      return Object.keys(r).some(function(k) { return (r[k] || '').toLowerCase().indexOf(q) !== -1; });
    });

    var countEl = document.getElementById('tracker-count');
    if (countEl) countEl.textContent = filtered.length.toLocaleString() + ' of ' + rows.length.toLocaleString() + ' entries';

    var container = document.getElementById('tracker-rows');
    if (!container) return;

    if (!filtered.length) { container.innerHTML = emptyState('No matches', 'Try a different search.'); return; }

    if (an.isGlossary) {
      renderGlossary(filtered, activeData.headers, container);
    } else if (an.isArtTab) {
      renderArtGrid(filtered, rows, container);
    } else if (an.eraKey && (an.std || !q)) {
      // Standard tracker tabs keep their era grouping even while searching —
      // sections just come pre-opened so the matches are visible.
      _forceOpenAll = !!q;
      renderEraGroups(filtered, rows, container);
      _forceOpenAll = false;
    } else {
      renderFlatList(filtered, rows, container);
    }
  }
  var _forceOpenAll = false;

  // ── Art grid ──────────────────────────────────────────────────
  function renderArtGrid(filtered, allRows, container) {
    var an = activeAnalysis;
    var shown = filtered.slice(0, renderLimit);
    var html = '<div class="art-grid">';
    var count = 0;
    shown.forEach(function(r) {
      var imgUrl = rowImage(r, an);
      if (!imgUrl) return;
      count++;
      var caption = an.titleKey ? firstLine(r[an.titleKey] || '') : '';
      var sub = [];
      ['Designer', 'Art Type', 'Project Type', 'Use'].forEach(function(k) {
        if (r[k] && String(r[k]).trim()) sub.push(String(r[k]).trim());
      });
      // Direct URLs load now; page URLs get resolved after paint.
      var imgTag = isDirectImageUrl(imgUrl)
        ? '<img src="' + escHtml(imgUrl) + '" alt="' + escHtml(caption) + '" loading="lazy" onerror="this.closest(\'.art-card\').classList.add(\'no-img\')">'
        : '<img data-resolve="' + escHtml(imgUrl) + '" alt="' + escHtml(caption) + '" style="opacity:0" loading="lazy">';
      html += '<div class="art-card" onclick="window.open(\'' + escHtml(imgUrl) + '\',\'_blank\')">' +
        '<div class="art-card-img">' + imgTag + '<div class="art-card-fallback">no preview</div></div>' +
        (caption ? '<div class="art-card-cap">' + escHtml(caption) + '</div>' : '') +
        (sub.length ? '<div class="art-card-sub">' + escHtml(sub.slice(0, 2).join(' · ')) + '</div>' : '') +
        '</div>';
    });
    html += '</div>';
    if (!count) {
      container.innerHTML = emptyState('No art on this tab', 'None of these rows carry an image link.');
      return;
    }
    if (filtered.length > shown.length) {
      html += '<div style="text-align:center;margin:18px 0 8px;"><button class="wv-btn-ghost" onclick="showMoreTracker()">Show more (' + (filtered.length - shown.length) + ' more)</button></div>';
    }
    container.innerHTML = html;
    resolveArtImages(container);
  }

  // ── Key / glossary tabs ───────────────────────────────────────
  // The Key tab isn't a track list — it's paired term/definition columns with
  // blank headers ("Portion,,Quality,"). Run through the track renderer it
  // produced rows of nonsense, so detect it and render what it actually is.
  function isGlossaryTab(headers, rows) {
    var tabName = (trackerTabs[activeTabIdx] || {}).name || '';
    if (/^key$/i.test(tabName.trim())) return true;
    var blanks = headers.filter(function(h) { return /^col\d+$/.test(h); }).length;
    var anyUrl = rows.some(function(r) {
      return Object.keys(r).some(function(k) { return isUrl(r[k]); });
    });
    return blanks >= 2 && !anyUrl && rows.length < 60;
  }

  function renderGlossary(rows, headers, container) {
    // Columns pair up as (term, definition).
    var pairs = [];
    for (var i = 0; i + 1 < headers.length; i += 2) {
      pairs.push({ term: headers[i], def: headers[i + 1] });
    }
    var html = '<div class="wv-cols2">';
    pairs.forEach(function(p) {
      var label = /^col\d+$/.test(p.term) ? '' : p.term;
      var items = rows.map(function(r) {
        var t = (r[p.term] || '').trim(), d = (r[p.def] || '').trim();
        if (!t && !d) return '';
        return '<div class="gloss-row"><div class="gloss-term">' + escHtml(t) + '</div>' +
               (d ? '<div class="gloss-def">' + escHtml(d) + '</div>' : '') + '</div>';
      }).join('');
      if (!items.replace(/\s/g, '')) return;
      html += '<div>' + (label ? '<div class="wv-colhead">' + escHtml(label) + '</div>' : '') + items + '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  // ── Era-grouped rendering ─────────────────────────────────────
  function renderEraGroups(filtered, allRows, container) {
    var an = activeAnalysis;
    // Re-group the filtered rows (for when filters are applied later)
    var groups = groupByEra(filtered, an);
    if (!groups || !groups.length) { renderFlatList(filtered, allRows, container); return; }

    var html = '';
    groups.forEach(function(group, gi) {
      var playableCount = group.rows.filter(function(r) { return firstAudio(r); }).length;
      var isOpen = _forceOpenAll || !!(eraOpenState[group.eraName]);

      html += '<details class="era-section" id="era-' + gi + '"' + (isOpen ? ' open' : '') +
        ' ontoggle="eraToggled(this,' + gi + ')">';

      // Summary (always rendered)
      html += '<summary class="era-summary">';
      html += '<div class="era-cover-thumb">';
      if (group.coverUrl) {
        html += '<img src="' + escHtml(group.coverUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
      } else {
        html += '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="color:var(--text-3);"><path d="M9 18V5l12-2v13M9 9l12-2M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>';
      }
      html += '</div>';
      html += '<div style="flex:1;min-width:0;">';
      html += '<div style="font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(group.eraName) + '</div>';
      html += '<div style="font-size:12px;color:var(--text-3);margin-top:2px;">' + group.rows.length + ' track' + (group.rows.length !== 1 ? 's' : '');
      if (playableCount) html += ' · ' + playableCount + ' playable';
      html += '</div>';
      html += '</div>';
      html += '<svg class="era-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
      html += '</summary>';

      // Tracks: lazy — render a placeholder; filled in eraToggled when opened
      html += '<div class="era-tracks" id="era-tracks-' + gi + '">';
      if (isOpen) {
        html += renderTrackRowsHtml(group.rows, allRows, an);
      } else {
        html += '<div class="era-placeholder" style="display:none;"></div>';
      }
      html += '</div>';

      html += '</details>';
    });

    // Store groups for lazy-open use
    container._groups = groups;
    container._allRows = allRows;
    container.innerHTML = html;
    // Re-attach groups reference after innerHTML overwrites it
    document.getElementById('tracker-rows')._groups = groups;
    document.getElementById('tracker-rows')._allRows = allRows;

    highlightPlaying();
  }

  function eraToggled(el, gi) {
    var eraName = null;
    var rowsEl = document.getElementById('tracker-rows');
    var groups = rowsEl ? rowsEl._groups : null;
    if (groups && groups[gi]) eraName = groups[gi].eraName;
    if (eraName) eraOpenState[eraName] = el.open;

    if (el.open) {
      var tracksEl = document.getElementById('era-tracks-' + gi);
      if (tracksEl && tracksEl.querySelector('.era-placeholder')) {
        var group = groups && groups[gi];
        if (group) {
          var an = activeAnalysis;
          var allRows = rowsEl ? rowsEl._allRows : (activeData ? activeData.rows : []);
          tracksEl.innerHTML = renderTrackRowsHtml(group.rows, allRows, an);
          highlightPlaying();
        }
      }
    }
  }

  function renderTrackRowsHtml(groupRows, allRows, an) {
    if (!groupRows.length) return '<div style="padding:12px;font-size:13px;color:var(--text-3);">No tracks.</div>';
    return groupRows.map(function(r) {
      var gi = allRows.indexOf(r);
      return an.std ? renderStdRow(r, gi, an) : renderOneRow(r, gi, an);
    }).join('');
  }

  // ── Flat list ─────────────────────────────────────────────────
  function renderFlatList(filtered, allRows, container) {
    var an = activeAnalysis;
    var shown = filtered.slice(0, renderLimit);
    var html = '<div class="wv-card" style="padding:8px;">';
    shown.forEach(function(r) {
      var gi = allRows.indexOf(r);
      html += an.std ? renderStdRow(r, gi, an) : renderOneRow(r, gi, an);
    });
    html += '</div>';
    if (filtered.length > shown.length) {
      html += '<div style="text-align:center;margin:18px 0 8px;"><button class="btn btn-secondary" onclick="showMoreTracker()">Show more (' + (filtered.length - shown.length) + ' more)</button></div>';
    }
    container.innerHTML = html;
    highlightPlaying();
  }

  // ── Standard tracker row (artistgrid-style) ───────────────────
  // Name (bold, with feature/prod sublines) + expandable notes on the left;
  // length · leak date · availability + quality badges + play/link on the right.
  function renderStdRow(r, globalIdx, an) {
    var std = an.std;
    var nameRaw = String(r[std.name] || '').trim();
    var nameLines = nameRaw.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
    var title = nameLines[0] || 'Untitled';
    var subLines = nameLines.slice(1);

    var audio = firstAudio(r);
    var notes = std.notes ? String(r[std.notes] || '').trim() : '';
    var len = std.length ? firstLine(r[std.length]) : '';
    var leak = std.leakDate ? firstLine(r[std.leakDate]) : '';
    var fileD = std.fileDate ? firstLine(r[std.fileDate]) : '';

    var html = '<div class="track-row tstd-row" id="trk-row-' + globalIdx + '">';

    html += '<div class="tstd-main">';
    html += '<div class="track-row-title" style="white-space:normal;">' + escHtml(title) + '</div>';
    if (subLines.length) {
      html += '<div class="tstd-sub">' + subLines.map(function(l) { return escHtml(l); }).join('<br>') + '</div>';
    }
    if (notes) {
      html += '<div class="tstd-notes" onclick="this.classList.toggle(\'open\')" title="Click to expand">' + escHtml(notes) + '</div>';
    }
    html += '</div>';

    html += '<div class="tstd-meta">';
    if (len) html += '<span class="tstd-col">' + escHtml(len) + '</span>';
    if (leak) html += '<span class="tstd-col" title="Leak date">💧 ' + escHtml(leak) + '</span>';
    else if (fileD) html += '<span class="tstd-col" title="File date">📁 ' + escHtml(fileD) + '</span>';
    if (std.avail) html += availBadge(r[std.avail]);
    if (std.quality) html += qualityBadge(r[std.quality]);

    if (audio) {
      html += '<button class="btn btn-secondary btn-sm" title="Play" onclick="playTrackerRow(' + globalIdx + ')">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;"><path d="M8 5v14l11-7z"/></svg></button>';
      html += '<a class="btn btn-secondary btn-sm" title="Download" href="' + escHtml(audio) + '" download target="_blank" rel="noopener" style="text-decoration:none;">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></a>';
    }
    // Any extra non-audio URLs in the links cell (up to 2)
    if (std.links) {
      var urls = String(r[std.links] || '').match(/https?:\/\/\S+/g) || [];
      var shownLinks = 0;
      for (var u = 0; u < urls.length && shownLinks < 2; u++) {
        if (audioUrl(urls[u]) === audio && audio) continue;
        html += '<a class="btn btn-secondary btn-sm" href="' + escHtml(urls[u]) + '" target="_blank" rel="noopener" style="text-decoration:none;">🔗</a>';
        shownLinks++;
      }
    }
    html += '</div>';

    html += '</div>';
    return html;
  }

  // ── Single row ────────────────────────────────────────────────
  function renderOneRow(r, globalIdx, an) {
    var title = firstLine(r[an.titleKey] || '') || 'Untitled';
    var audio = firstAudio(r);
    var desc = (an.descKey ? r[an.descKey] : '') || '';
    desc = desc.trim();

    var meta = an.metaKeys.map(function(k) { return firstLine(r[k]); })
      .filter(function(v) { return v && v.length <= 40; })
      .slice(0, 5).join('  ·  ');
    meta = truncate(meta, 130);

    var html = '<div class="track-row" id="trk-row-' + globalIdx + '" style="cursor:default;align-items:flex-start;padding:10px 14px;">';

    // Icon
    html += '<div class="track-row-cover" style="margin-top:2px;">' +
      (audio
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13M9 9l12-2M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>') +
      '</div>';

    // Info
    html += '<div class="track-row-info">';
    html += '<div class="track-row-title">' + escHtml(title) + '</div>';
    if (desc) {
      html += '<div class="track-row-artist" style="white-space:normal;line-height:1.4;margin-top:2px;">' + escHtml(truncate(desc, 180)) + '</div>';
    }
    if (meta) {
      html += '<div style="font-size:11.5px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(meta) + '</div>';
    }
    html += '</div>';

    // Actions
    html += '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;margin-top:2px;">';
    if (audio) {
      html += '<button class="btn btn-secondary btn-sm" title="Play" onclick="playTrackerRow(' + globalIdx + ')">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;"><path d="M8 5v14l11-7z"/></svg></button>';
      html += '<a class="btn btn-secondary btn-sm" title="Download" href="' + escHtml(audio) + '" download target="_blank" rel="noopener" style="text-decoration:none;">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></a>';
    }
    an.linkKeys.forEach(function(k) {
      var v = r[k];
      if (!isUrl(v) || audioUrl(v) === audio) return;
      var label = an.linkKeys.length > 1 ? shortLabel(k) : 'Open';
      html += '<a class="btn btn-secondary btn-sm" href="' + escHtml(v) + '" target="_blank" rel="noopener" style="text-decoration:none;">' + escHtml(label) + ' ↗</a>';
    });
    html += '</div>';

    html += '</div>';
    return html;
  }

  // ── Player ────────────────────────────────────────────────────
  function playTrackerRow(globalIdx) {
    var r = activeData.rows[globalIdx];
    if (!r || !firstAudio(r)) return;
    playIndex = playable.findIndex(function(x) { return x.i === globalIdx; });
    playTrack(rowToTrack(r));
    highlightPlaying();
  }
  function playAllTracker() {
    if (!playable.length) return;
    playIndex = 0;
    playTrack(rowToTrack(playable[0].r));
    highlightPlaying();
  }
  function highlightPlaying() {
    document.querySelectorAll('.track-row.playing').forEach(function(el) { el.classList.remove('playing'); });
    if (playIndex >= 0 && playable[playIndex]) {
      var el = document.getElementById('trk-row-' + playable[playIndex].i);
      if (el) el.classList.add('playing');
    }
  }

  var _onNext = function() {
    if (playIndex >= 0 && playIndex < playable.length - 1) {
      playIndex++; playTrack(rowToTrack(playable[playIndex].r)); highlightPlaying();
    } else { playIndex = -1; highlightPlaying(); }
  };
  var _onPrev = function() {
    if (playIndex > 0) { playIndex--; playTrack(rowToTrack(playable[playIndex].r)); highlightPlaying(); }
  };
  document.addEventListener('playerSkipNext', _onNext);
  document.addEventListener('playerSkipPrev', _onPrev);
  window._pageCleanup.push(function() {
    document.removeEventListener('playerSkipNext', _onNext);
    document.removeEventListener('playerSkipPrev', _onPrev);
  });

  loadTabs();
</script>
</body>
</html>
