      var secName = ((st.meta && st.meta.sections) || []).find(function (s) { return s.id === x.section; });
      var row = function (k, v) { return v ? '<div class="yz-k">' + esc(k) + '</div><div class="yz-v">' + v + '</div>' : ''; };
      wrap.querySelector('.yz-box').innerHTML = '<button class="yz-x" title="close">✕</button>' +
        '<div class="yz-gal"><div class="yz-main"><img id="yz-main" src="' + esc(thumb(x.images[0], 900)) + '" alt=""></div>' +
        (x.images.length > 1 ? '<div class="yz-thumbs">' + x.images.slice(0, 12).map(function (u, i) { return '<img src="' + esc(thumb(u, 160)) + '" data-full="' + esc(thumb(u, 900)) + '" class="' + (i ? '' : 'on') + '" alt="" loading="lazy">'; }).join('') + '</div>' : '') + '</div>' +
        '<div class="yz-info"><div class="yz-sec">' + esc(secName ? secName.title : x.section) + (x.venueName ? ' · ' + esc(x.venueName) : '') + '</div><h3>' + esc(x.title) + '</h3>' + (x.sub ? '<div class="yz-sub">' + esc(x.sub) + '</div>' : '') +
        '<div class="yz-grid2">' + row('price', x.price ? '$' + esc(x.price) : '') + row('year', esc(x.year || '')) + row('released', esc(x.date || '')) + row('kind', esc(x.type || '')) +
        row('sizes', (x.sizes || []).length ? x.sizes.map(function (z) { return '<span class="yz-size">' + esc(z) + '</span>'; }).join('') : '') +
        row('in', (x.collections || []).length ? esc(x.collections.join(', ')) : '') + '</div>' +
        (x.desc ? '<div class="yz-desc">' + esc(x.desc) + '</div>' : '') +
        '<a class="yt-l" href="' + esc(x.url || 'https://yeezyarchive.net') + '" target="_blank" rel="noopener" style="display:inline-block;margin-top:14px;">view on YEEZY ARCHIVE ↗</a></div>';
      wrap.querySelector('.yz-x').onclick = closeIt;
      wrap.querySelectorAll('.yz-thumbs img').forEach(function (t) { t.onclick = function () { document.getElementById('yz-main').src = t.getAttribute('data-full'); wrap.querySelectorAll('.yz-thumbs img').forEach(function (o) { o.classList.toggle('on', o === t); }); }; });
    }
    window._pageCleanup.push(function () { document.querySelectorAll('.yz-modal').forEach(function (m) { m.remove(); }); });
    return { open: function () { if (st.started) return; st.started = true; shell(); load(false); if (P.get('item')) detail(P.get('item')); } };
  })();


  // ── Tours (from YE TOUR ARCHIVE) ───────────────────────────────
  var TR = (function () {
    var root = document.getElementById('ye-tours');
    var st = { year: P.get('year') || '', sec: P.get('sec') || 'shows', music: 'videos', venue: '', yshow: '', ykind: '', d: null, ymedia: [], ytotal: 0, started: false, pending: P.get('show') ? { id: P.get('show'), time: P.get('at') || '' } : null };
    function secs(d) {
      return [['shows', 'Shows', d.shows.length], ['music', 'Music', d.videos.length + d.audio.length + d.visualizers.length], ['merch', 'Merch', d.merch.length], ['yedia', 'Yedia', d.yedia_count], ['songs', 'Most played', 'every tour']].filter(function (x) { return typeof x[2] === 'string' || x[2] > 0; });
    }
    function url() {
      var q = new URLSearchParams(); q.set('view', 'tours'); if (st.year) q.set('year', st.year); if (st.sec !== 'shows') q.set('sec', st.sec);
      try { history.replaceState(history.state, '', location.pathname + '?' + q.toString()); } catch (_) {}
    }
    function toSec(t) { var p = String(t || '').split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : 0; }
    function pauseSite() { if (typeof pausePlayer === 'function') pausePlayer(); }
    async function load() {
      root.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try { st.d = await api('/ye/tour' + (st.year ? '?year=' + st.year : '')); }
      catch (e) { root.innerHTML = '<div class="yt-empty"><b>couldnt load the tour archive</b>' + esc(e.message || 'try again in a sec') + '</div>'; return; }
      st.year = st.d.year;
      if (!secs(st.d).some(function (x) { return x[0] === st.sec; })) st.sec = 'shows';
      url();
      paint();
      if (st.pending) {
        var pd = st.pending; st.pending = null;
        var x = st.d.shows.find(function (s) { return String(s.id) === String(pd.id); });
        if (x) { var w = videoModal(x); var v = w && w.querySelector('video'); if (v && pd.time) { var go = function () { try { v.currentTime = toSec(pd.time); } catch (_) {} }; if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, { once: true }); } }
      }
    }
    async function songsSec(el) {
      el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try { if (!st.songs) st.songs = await api('/ye/tour/songs'); }
      catch (e) { el.innerHTML = '<div class="yt-empty"><b>couldnt load the setlists</b></div>'; return; }
      if (st.sec !== 'songs' || !document.getElementById('tr-body')) return;
      var d = st.songs, max = (d.songs[0] || {}).plays || 1;
      el.innerHTML = '<div class="yt-count">' + d.songs.length + ' songs across ' + d.shows + ' shows with setlists. tap a song to see where he played it</div><div class="tr-top">' + d.songs.slice(0, 80).map(function (x, i) {
        var yrs = x.years.length > 1 ? x.years[0] + '–' + x.years[x.years.length - 1] : x.years[0];
        return '<details class="tr-song-row"><summary><span class="n">' + (i + 1) + '</span><span class="t"><b>' + esc(x.song) + '</b><i style="width:' + Math.round(x.plays / max * 100) + '%"></i></span><span class="c">' + x.plays + '</span></summary>' +
          '<div class="tr-song-more"><div class="yt-sub">played at ' + x.plays + ' of ' + d.shows + ' shows · ' + esc(yrs) + (x.opener ? ' · opened ' + x.opener : '') + (x.closer ? ' · closed ' + x.closer : '') + '</div>' +
          '<div class="ye-chips" style="margin:8px 0 6px;">' + x.shows.map(function (sh) { return '<button class="ye-chip" data-show="' + esc(sh.id) + '" data-sy="' + esc(sh.year) + '" data-st="' + esc(sh.time || '') + '">' + esc(sh.year + ' · ' + String(sh.show).toLowerCase()) + (sh.time ? ' <span style="opacity:.6;">' + esc(sh.time) + '</span>' : '') + '</button>'; }).join('') + '</div>' +
          '<button class="yt-l" data-hubsong="' + esc(x.song) + '" style="border:0;cursor:pointer;font-family:inherit;">every version of ' + esc(x.song) + ' ›</button></div></details>';
      }).join('') + '</div>';
      el.querySelectorAll('[data-show]').forEach(function (b) { b.onclick = function () { st.pending = { id: b.getAttribute('data-show'), time: b.getAttribute('data-st') }; var y = b.getAttribute('data-sy'); if (y === st.year) { st.sec = 'shows'; url(); load(); } else { st.year = y; st.sec = 'shows'; url(); load(); } }; });
      el.querySelectorAll('[data-hubsong]').forEach(function (b) { b.onclick = function () { navigate('/resources?view=song&t=' + encodeURIComponent(b.getAttribute('data-hubsong'))); }; });
    }
    function paint() {
      var d = st.d;
      root.innerHTML = '<div class="yt-tabs" id="tr-years">' + d.years.map(function (y) { return '<button class="yt-tab' + (y.year === st.year ? ' on' : '') + '" data-y="' + y.year + '">' + y.year + '</button>'; }).join('') + '</div>' +
        '<div class="ye-chips" id="tr-secs">' + secs(d).map(function (x) { return '<button class="ye-chip' + (st.sec === x[0] ? ' on' : '') + '" data-s="' + x[0] + '">' + x[1] + ' · ' + x[2] + '</button>'; }).join('') + '</div>' +
        '<div id="tr-body"></div><div class="ye-credit">from the <a href="https://yetour.xyz" target="_blank" rel="noopener">YE TOUR ARCHIVE</a> ❤️</div>';
      root.querySelectorAll('[data-y]').forEach(function (b) { b.onclick = function () { st.year = b.getAttribute('data-y'); st.venue = ''; st.yshow = ''; url(); load(); }; });
      root.querySelectorAll('[data-s]').forEach(function (b) { b.onclick = function () { st.sec = b.getAttribute('data-s'); url(); paint(); }; });
      body();
    }
    function vcard(x, sub, i, kind) {
      return '<div class="tr-v" data-k="' + kind + '" data-i="' + i + '"><div class="tr-thumb">' + (x.image ? '<img src="' + esc(thumb(x.image, 640)) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '<span class="tr-play">▶</span></div>' +
        '<div class="tr-vt">' + esc(x.name) + '</div><div class="tr-vs">' + esc(sub || '') + '</div></div>';
    }
    function body() {
      var d = st.d, el = document.getElementById('tr-body'); if (!el) return;
      if (st.sec === 'songs') { songsSec(el); return; }
      if (st.sec === 'shows') {
        el.innerHTML = '<div class="tr-grid">' + d.shows.map(function (x, i) { return vcard(x, [x.spec, x.setlist.length ? x.setlist.length + ' songs' : ''].filter(Boolean).join(' · '), i, 'shows'); }).join('') + '</div>';
      } else if (st.sec === 'music') {
        var opts = [['videos', 'music videos', d.videos.length], ['visualizers', 'visualizers', d.visualizers.length], ['audio', 'audio', d.audio.length]].filter(function (x) { return x[2]; });
        if (!opts.some(function (x) { return x[0] === st.music; })) st.music = (opts[0] || [])[0];
        el.innerHTML = '<div class="ye-chips">' + opts.map(function (x) { return '<button class="ye-chip' + (st.music === x[0] ? ' on' : '') + '" data-m="' + x[0] + '">' + x[1] + ' · ' + x[2] + '</button>'; }).join('') + '</div>' +
          (st.music === 'audio'
            ? '<div class="tr-audio">' + d.audio.map(function (x, i) { return '<div class="tr-arow" data-a="' + i + '"><div class="tr-acov">' + (x.image ? '<img src="' + esc(thumb(x.image, 120)) + '" alt="" onerror="this.remove()">' : '') + '</div><div class="tr-ai"><div class="tr-vt" style="margin:0;">' + esc(x.name) + '</div><div class="tr-vs">' + esc(x.spec || 'audio') + '</div></div><button class="lp-cbtn tr-ap" title="play">▶</button></div>'; }).join('') + '</div>'
            : '<div class="tr-grid">' + (st.music === 'videos' ? d.videos : d.visualizers).map(function (x, i) { return vcard(x, x.spec, i, st.music); }).join('') + '</div>');
        el.querySelectorAll('[data-m]').forEach(function (b) { b.onclick = function () { st.music = b.getAttribute('data-m'); body(); }; });
        el.querySelectorAll('[data-a]').forEach(function (r) {
          r.onclick = function () {
            var i = +r.getAttribute('data-a');
            var q = d.audio.map(function (x) { return { id: 'tour-' + x.id, title: x.name, artist_name: 'Ye · live', ia_url: x.audio, cover_url: x.image || null }; });
            if (typeof setPlayerQueue === 'function' && typeof playQueueIndex === 'function') { setPlayerQueue(q, i); playQueueIndex(i); } else playTrack(q[i]);
          };
        });
      } else if (st.sec === 'merch') {
        var venues = []; d.merch.forEach(function (m) { if (venues.indexOf(m.venue) === -1) venues.push(m.venue); });
        var list = st.venue ? d.merch.filter(function (m) { return m.venue === st.venue; }) : d.merch;
        el.innerHTML = (venues.length > 1 ? '<div class="ye-chips"><button class="ye-chip' + (!st.venue ? ' on' : '') + '" data-vn="">every venue</button>' + venues.map(function (v) { return '<button class="ye-chip' + (st.venue === v ? ' on' : '') + '" data-vn="' + esc(v) + '">' + esc(v.toLowerCase()) + '</button>'; }).join('') + '</div>' : '') +
          '<div class="yz-grid">' + list.map(function (m, i) { return '<div class="yz-c" data-mi="' + i + '"><div class="yz-img">' + (m.images[0] ? '<img src="' + esc(thumb(m.images[0], 400)) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') + '</div><div class="yz-t">' + esc(m.name) + '</div><div class="yz-m">' + esc([m.venue, m.price].filter(Boolean).join(' · ').toLowerCase()) + '</div></div>'; }).join('') + '</div>';
        el.querySelectorAll('[data-vn]').forEach(function (b) { b.onclick = function () { st.venue = b.getAttribute('data-vn'); body(); }; });
        el.querySelectorAll('[data-mi]').forEach(function (c) { c.onclick = function () { merchModal(list[+c.getAttribute('data-mi')]); }; });
      } else if (st.sec === 'yedia') {
        el.innerHTML = '<div class="yt-bar"><select class="ye-sel" id="tr-ys"><option value="">every show</option>' + d.yedia_shows.map(function (x) { return '<option value="' + esc(x.name) + '"' + (st.yshow === x.name ? ' selected' : '') + '>' + esc(x.name.toLowerCase()) + ' (' + x.count + ')</option>'; }).join('') + '</select>' +
          '<div class="ye-chips" style="margin:0;">' + [['', 'all'], ['photos', 'photos'], ['videos', 'videos']].map(function (k) { return '<button class="ye-chip' + (st.ykind === k[0] ? ' on' : '') + '" data-yk="' + k[0] + '">' + k[1] + '</button>'; }).join('') + '</div></div>' +
          '<div class="yt-count" id="tr-yc"></div><div class="tr-ygrid" id="tr-yg"></div><div id="tr-ym"></div>' +
          '<div class="tr-note">yedia is fan photos and videos from the shows, sent in to the ye tour archive</div>';
        var ys = document.getElementById('tr-ys'); ys.onchange = function () { st.yshow = ys.value; loadYedia(false); };
        el.querySelectorAll('[data-yk]').forEach(function (b) { b.onclick = function () { st.ykind = b.getAttribute('data-yk'); el.querySelectorAll('[data-yk]').forEach(function (x) { x.classList.toggle('on', x === b); }); loadYedia(false); }; });
        loadYedia(false);
      }
      el.querySelectorAll('.tr-v').forEach(function (c) {
        c.onclick = function () { var k = c.getAttribute('data-k'), i = +c.getAttribute('data-i'); videoModal((k === 'shows' ? d.shows : k === 'videos' ? d.videos : d.visualizers)[i]); };
      });
    }
    async function loadYedia(more) {
      var g = document.getElementById('tr-yg'); if (!g) return;
      if (!more) g.innerHTML = '<div class="loading" style="grid-column:1/-1;"><div class="spinner"></div></div>';
      try {
        var r = await api('/ye/tour/yedia?year=' + st.year + '&limit=48&offset=' + (more ? st.ymedia.length : 0) + (st.yshow ? '&show=' + encodeURIComponent(st.yshow) : '') + (st.ykind ? '&kind=' + st.ykind : ''));
        st.ymedia = more ? st.ymedia.concat(r.items) : r.items; st.ytotal = r.total;
      } catch (e) { g.innerHTML = '<div class="yt-empty" style="grid-column:1/-1;"><b>couldnt load yedia</b></div>'; return; }
      document.getElementById('tr-yc').textContent = st.ytotal + ' photo' + (st.ytotal === 1 ? '' : 's') + ' & videos';
      g.innerHTML = st.ymedia.map(function (m, i) { return '<div class="tr-yi" data-yi="' + i + '">' + (m.thumb ? '<img src="' + esc(m.video ? m.thumb : thumb(m.thumb, 360)) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + (m.video ? '<span class="tr-play sm">▶</span>' : '') + '</div>'; }).join('') || '<div class="yt-empty" style="grid-column:1/-1;"><b>nothing here yet</b></div>';
      g.querySelectorAll('[data-yi]').forEach(function (c) { c.onclick = function () { mediaModal(+c.getAttribute('data-yi')); }; });
      document.getElementById('tr-ym').innerHTML = st.ymedia.length < st.ytotal ? '<div class="yt-more"><button class="wv-btn-ghost" id="tr-ymb">show more</button></div>' : '';
      var mb = document.getElementById('tr-ymb'); if (mb) mb.onclick = function () { mb.disabled = true; loadYedia(true); };
    }
    function modal(html) {
      var wrap = document.createElement('div'); wrap.className = 'yz-modal'; wrap.innerHTML = '<div class="yz-box tr-box">' + html + '<button class="yz-x" title="close">✕</button></div>';
      document.body.appendChild(wrap);
      var closeIt = function () { wrap.querySelectorAll('video').forEach(function (v) { try { v.pause(); } catch (_) {} }); wrap.remove(); document.removeEventListener('keydown', onKey); };
      var onKey = function (e) { if (e.key === 'Escape') closeIt(); if (wrap._key) wrap._key(e); };
      document.addEventListener('keydown', onKey);
      wrap.addEventListener('click', function (e) { if (e.target === wrap) closeIt(); });
      wrap.querySelector('.yz-x').onclick = closeIt;
      wrap.querySelectorAll('video').forEach(function (v) { v.addEventListener('play', pauseSite); });
      return wrap;
    }
    function videoModal(x) {
      if (!x) return;
      var w = modal('<div class="tr-vid"><video controls autoplay playsinline preload="metadata" poster="' + esc(x.image || '') + '" src="' + esc(x.video) + '"></video></div>' +
        '<div class="tr-vinfo"><h3>' + esc(x.name) + '</h3><div class="yz-sub">' + esc([st.year, x.spec].filter(Boolean).join(' · ')) + '</div>' +
        (x.setlist && x.setlist.length ? '<div class="yz-k" style="margin-top:14px;">SETLIST</div><div class="tr-set">' + x.setlist.map(function (t, i) { return '<button class="tr-song" data-t="' + toSec(t.time) + '"><span>' + esc(t.time) + '</span>' + esc(t.song) + '</button>'; }).join('') + '</div>' : '') +
        '<div class="yt-links" style="justify-content:flex-start;margin-top:14px;">' + (x.download ? '<a class="yt-l" href="' + esc(x.download) + '" target="_blank" rel="noopener">download ↗</a>' : '') + (x.credits && /^https?:/.test(x.credits) ? '<a class="yt-l" href="' + esc(x.credits) + '" target="_blank" rel="noopener">source ↗</a>' : '') + '</div></div>');
      var v = w.querySelector('video');
      w.querySelectorAll('.tr-song').forEach(function (b) { b.onclick = function () { try { v.currentTime = +b.getAttribute('data-t'); v.play(); } catch (_) {} }; });
      return w;
    }
    function merchModal(m) {
      var w = modal('<div class="yz-gal"><div class="yz-main"><img id="tr-mm" src="' + esc(thumb(m.images[0], 900)) + '" alt=""></div>' +
        (m.images.length > 1 ? '<div class="yz-thumbs">' + m.images.map(function (u, i) { return '<img src="' + esc(thumb(u, 160)) + '" data-full="' + esc(thumb(u, 900)) + '" class="' + (i ? '' : 'on') + '" alt="">'; }).join('') + '</div>' : '') + '</div>' +
        '<div class="yz-info"><div class="yz-sec">' + esc(st.year + ' tour · ' + m.venue) + '</div><h3>' + esc(m.name) + '</h3>' + (m.price ? '<div class="yz-sub">' + esc(m.price) + '</div>' : '') + '<div class="yz-desc">' + m.images.length + ' photo' + (m.images.length === 1 ? '' : 's') + '</div></div>');
      w.querySelectorAll('.yz-thumbs img').forEach(function (t) { t.onclick = function () { w.querySelector('#tr-mm').src = t.getAttribute('data-full'); w.querySelectorAll('.yz-thumbs img').forEach(function (o) { o.classList.toggle('on', o === t); }); }; });
    }
    function mediaModal(i) {
      var w = modal('<div class="tr-media" id="tr-media"></div>');
      w.querySelector('.yz-box').classList.add('tr-mbox');
      function show() {
        var m = st.ymedia[i]; if (!m) return;
        var box = w.querySelector('#tr-media');
        box.innerHTML = (m.video ? '<video controls autoplay playsinline src="' + esc(m.full) + '" poster="' + esc(m.thumb || '') + '"></video><a class="yt-l" href="' + esc(m.original) + '" target="_blank" rel="noopener" style="margin-top:8px;display:inline-block;">video not playing? open it ↗</a>' : '<img src="' + esc(m.full) + '" alt="">') +
          '<div class="tr-mcap">' + esc((m.show || '').toLowerCase()) + (m.comment ? ' · ' + esc(m.comment) : '') + '</div>' +
          (i > 0 ? '<button class="yt-lb-nav p" title="previous">‹</button>' : '') + (i < st.ymedia.length - 1 ? '<button class="yt-lb-nav n" title="next">›</button>' : '');
        box.querySelectorAll('video').forEach(function (v) { v.addEventListener('play', pauseSite); });
        var p = box.querySelector('.yt-lb-nav.p'), n = box.querySelector('.yt-lb-nav.n');
        if (p) p.onclick = function () { i--; show(); };
        if (n) n.onclick = function () { i++; show(); };
      }
      w._key = function (e) { if (e.key === 'ArrowLeft' && i > 0) { i--; show(); } else if (e.key === 'ArrowRight' && i < st.ymedia.length - 1) { i++; show(); } };
      show();
    }
    return { open: function () { if (st.started) return; st.started = true; load(); } };
  })();

  setView(cur, false);
})();
</script>
</body>
</html>
