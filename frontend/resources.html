<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources — wavernrs</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="view">
<div class="container" style="max-width:1000px;">
  <div style="padding:28px 0 8px;">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:6px;">Resources</div>
    <div class="wv-title" style="font-size:32px;font-weight:800;letter-spacing:-0.04em;line-height:1.05;">Resources</div>
    <p style="margin-top:8px;font-size:14px;color:var(--text-2);">Trackers, sheets, and other community resources.</p>
  </div>

  <!-- Tab bar -->
  <div style="display:flex;gap:8px;border-bottom:1px solid var(--hair);margin:18px 0 22px;">
    <button class="wv-admin-tab active" id="rtab-tracker" onclick="showResourceTab('tracker')">Tracker</button>
  </div>

  <!-- Tracker tab -->
  <div id="rtab-content-tracker">
    <div id="tracker-container">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>
</div>
</div><!-- /view -->

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  initPlayer();

  var trackerData = null;     // { url, headers, rows, error }
  var trackerTitleKey = null;
  var trackerLinkKeys = [];
  var trackerMetaKeys = [];
  var playable = [];          // rows that have a playable audio url, in display order
  var playIndex = -1;

  function showResourceTab(tab) {
    // Single tab for now; structured so more can be added later.
    document.getElementById('rtab-tracker').classList.toggle('active', tab === 'tracker');
    if (tab === 'tracker') loadTracker();
  }

  // Is this cell value a directly-playable audio URL?
  function audioUrl(v) {
    if (!v || !/^https?:\/\//i.test(v)) return null;
    if (/\.(mp3|m4a|wav|flac|ogg|aac|opus|mp4)(\?|#|$)/i.test(v)) return v;
    if (/(cdn\.samply\.app|archive\.org\/download|googleusercontent\.com|\.b-cdn\.net)/i.test(v)) return v;
    return null;
  }
  function isUrl(v) { return v && /^https?:\/\//i.test(v); }

  function analyzeColumns(headers, rows) {
    // Title column: prefer a name/title/song/track header, else first column.
    trackerTitleKey = headers.find(function(h) { return /\b(name|title|song|track)\b/i.test(h); }) || headers[0];
    // Link columns: any column where most non-empty values look like URLs.
    trackerLinkKeys = headers.filter(function(h) {
      if (h === trackerTitleKey) return false;
      var vals = rows.map(function(r) { return r[h]; }).filter(Boolean);
      if (!vals.length) return false;
      var urls = vals.filter(isUrl).length;
      return urls >= Math.max(1, vals.length * 0.5);
    });
    // Everything else is metadata.
    trackerMetaKeys = headers.filter(function(h) {
      return h !== trackerTitleKey && trackerLinkKeys.indexOf(h) === -1;
    });
  }

  async function loadTracker() {
    var el = document.getElementById('tracker-container');
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      trackerData = await api('/resources/tracker');
    } catch (e) {
      el.innerHTML = emptyState('Couldn\'t load the tracker', 'Try again in a moment.');
      return;
    }
    if (trackerData.error) { el.innerHTML = emptyState('Tracker unavailable', trackerData.error); return; }
    if (!trackerData.url) { el.innerHTML = emptyState('No tracker set up yet', 'An admin can connect a Google Sheet in the admin panel.'); return; }
    if (!trackerData.rows || !trackerData.rows.length) { el.innerHTML = emptyState('Tracker is empty', 'The connected sheet has no rows yet.'); return; }

    analyzeColumns(trackerData.headers, trackerData.rows);
    renderTracker('');
  }

  function emptyState(title, sub) {
    return '<div class="empty-state" style="text-align:center;padding:60px 20px;">' +
      '<div class="empty-title" style="font-size:18px;font-weight:700;margin-bottom:6px;">' + escHtml(title) + '</div>' +
      '<div style="font-size:14px;color:var(--text-3);">' + escHtml(sub) + '</div></div>';
  }

  function renderTracker(query) {
    var q = (query || '').toLowerCase().trim();
    var rows = trackerData.rows;
    var filtered = !q ? rows : rows.filter(function(r) {
      return Object.keys(r).some(function(k) { return (r[k] || '').toLowerCase().indexOf(q) !== -1; });
    });

    // Build the playable list (for Play All / auto-advance) from the FULL set
    // in display order, so the queue is stable regardless of filtering.
    playable = rows.map(function(r, i) { return { r: r, i: i }; })
      .filter(function(x) { return firstAudio(x.r); });

    var html = '';
    // Toolbar
    html += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;">';
    if (playable.length) {
      html += '<button class="btn btn-primary" onclick="playAllTracker()">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;margin-right:4px;"><path d="M8 5v14l11-7z"/></svg>Play All</button>';
    }
    html += '<div class="wv-input wv-search-wrap" style="flex:1;min-width:200px;display:flex;align-items:center;gap:8px;padding:9px 14px;">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>' +
      '<input id="tracker-search" placeholder="Search the tracker…" value="' + escHtml(query || '') + '" oninput="renderTracker(this.value)" ' +
      'style="flex:1;background:transparent;border:none;outline:none;font-size:13.5px;color:inherit;font-family:inherit;"></div>';
    html += '<a href="' + escHtml(trackerData.url) + '" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="text-decoration:none;">Open Sheet ↗</a>';
    html += '</div>';

    html += '<div style="font-size:12.5px;color:var(--text-3);margin-bottom:12px;">' + filtered.length + ' of ' + rows.length + ' entries</div>';

    if (!filtered.length) {
      html += emptyState('No matches', 'Try a different search.');
      document.getElementById('tracker-container').innerHTML = html;
      return;
    }

    // Rows
    html += '<div class="wv-card" style="padding:8px;">';
    filtered.forEach(function(r) {
      var globalIdx = rows.indexOf(r);
      var title = r[trackerTitleKey] || 'Untitled';
      var audio = firstAudio(r);
      var meta = trackerMetaKeys.map(function(k) { return r[k]; }).filter(Boolean).slice(0, 4).join(' · ');

      html += '<div class="track-row" id="trk-row-' + globalIdx + '" style="cursor:default;">';
      html += '<div class="track-row-cover">' +
        (audio
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13M9 9l12-2M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>') +
        '</div>';
      html += '<div class="track-row-info">' +
        '<div class="track-row-title">' + escHtml(title) + '</div>' +
        (meta ? '<div class="track-row-artist">' + escHtml(meta) + '</div>' : '') +
        '</div>';

      // Actions
      html += '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">';
      if (audio) {
        html += '<button class="btn btn-secondary btn-sm" title="Play" onclick="playTrackerRow(' + globalIdx + ')">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;"><path d="M8 5v14l11-7z"/></svg></button>';
        html += '<a class="btn btn-secondary btn-sm" title="Download" href="' + escHtml(audio) + '" download target="_blank" rel="noopener" style="text-decoration:none;">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></a>';
      }
      // Open buttons for each link column that has a URL
      trackerLinkKeys.forEach(function(k) {
        var v = r[k];
        if (!isUrl(v) || v === audio) return;
        var label = trackerLinkKeys.length > 1 ? shortLabel(k) : 'Open';
        html += '<a class="btn btn-secondary btn-sm" href="' + escHtml(v) + '" target="_blank" rel="noopener" style="text-decoration:none;">' + escHtml(label) + ' ↗</a>';
      });
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';

    document.getElementById('tracker-container').innerHTML = html;
    highlightPlaying();
  }

  function shortLabel(h) {
    var s = String(h || 'Link').trim();
    return s.length > 14 ? s.slice(0, 13) + '…' : s;
  }

  function firstAudio(r) {
    for (var i = 0; i < trackerLinkKeys.length; i++) {
      var a = audioUrl(r[trackerLinkKeys[i]]);
      if (a) return a;
    }
    return null;
  }

  function rowToTrack(r) {
    return {
      title: r[trackerTitleKey] || 'Untitled',
      ia_url: firstAudio(r),
      artist_name: 'Tracker',
      cover_url: null,
    };
  }

  function playTrackerRow(globalIdx) {
    var r = trackerData.rows[globalIdx];
    if (!r) return;
    var audio = firstAudio(r);
    if (!audio) return;
    // Position within the playable queue for auto-advance.
    playIndex = playable.findIndex(function(x) { return x.i === globalIdx; });
    playTrack(rowToTrack(r));
    highlightPlaying();
  }

  function playAllTracker() {
    if (!playable.length) return;
    playIndex = 0;
    playTrack(rowToTrack(playable[0].r));
    highlightPlaying();
  }

  function highlightPlaying() {
    document.querySelectorAll('.track-row.playing').forEach(function(el) { el.classList.remove('playing'); });
    if (playIndex >= 0 && playable[playIndex]) {
      var el = document.getElementById('trk-row-' + playable[playIndex].i);
      if (el) el.classList.add('playing');
    }
  }

  // The player fires playerSkipNext on BOTH the manual next button and natural
  // track end, so listening to it alone handles auto-advance + manual skip.
  var _onNext = function() {
    if (playIndex >= 0 && playIndex < playable.length - 1) {
      playIndex++; playTrack(rowToTrack(playable[playIndex].r)); highlightPlaying();
    } else { playIndex = -1; highlightPlaying(); }
  };
  var _onPrev = function() {
    if (playIndex > 0) { playIndex--; playTrack(rowToTrack(playable[playIndex].r)); highlightPlaying(); }
  };
  document.addEventListener('playerSkipNext', _onNext);
  document.addEventListener('playerSkipPrev', _onPrev);
  window._pageCleanup.push(function() {
    document.removeEventListener('playerSkipNext', _onNext);
    document.removeEventListener('playerSkipPrev', _onPrev);
  });

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  loadTracker();
</script>
</body>
</html>
