      --c1: hsl(262 60% 40%); --c2: hsl(222 60% 30%); --c3: hsl(262 40% 14%); --c4: hsl(250 45% 7%);

    .hr-mosaic { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-content: center; }
    .hr-mosaic .big { grid-column: span 2; grid-row: span 2; border-radius: 12px; }
    .hr-tile { aspect-ratio: 1; position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 12px 28px -12px rgba(0,0,0,.7); cursor: pointer; background: rgba(255,255,255,.08); min-height: 0; }
    .hr-tile > img, .hr-tile > .gr { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

    .hr-tile.big .rk { min-width: 28px; height: 28px; font-size: 14px; left: 10px; top: 10px; }
    .hr-tile:hover > img { transform: scale(1.04); }

    .hr-sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 30px 0 12px; flex-wrap: wrap; }

    .hr-rail { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 14px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; scrollbar-width: thin; }
    .hr-card { scroll-snap-align: start; cursor: pointer; min-width: 0; border-radius: 10px; }
    .hr-card .cv { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); box-shadow: 0 8px 20px -12px rgba(0,0,0,.5); }
    .hr-card .cv img, .hr-card .cv .gr { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hr-card .cnt { position: absolute; right: 7px; bottom: 7px; padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.66); color: #fff; font-size: 11.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }

    .hr-filter input { width: 100%; padding-left: 36px; min-height: 40px; box-sizing: border-box; }
    .hr-group { font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 18px 0 6px; display: flex; align-items: center; gap: 8px; }
    .hr-group span { font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--text-3); opacity: .8; }

    @media (hover: none) { .hr-x { opacity: .7; } }
    .hr-empty { text-align: center; padding: 56px 20px 64px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); }
    .hr-empty .ic { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; background: var(--brand-bg); color: var(--brand); }
    .hr-empty h3 { margin: 0 0 6px; font-size: 20px; font-weight: 800; color: var(--text); }

    .hr-modal { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.66); display: grid; place-items: center; padding: 20px; animation: hr-fade .18s ease-out; }
    .hr-modal .pn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 18px; padding: 18px; width: min(380px, 100%); max-height: calc(100dvh - 40px); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); }
    .hr-modal .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  </style>

<script>
(function () {
  if (typeof initPlayer === 'function') initPlayer();
  if (typeof window.setPageWash === 'function') window.setPageWash('history');
  if (window._hr && typeof window._hr.teardown === 'function') { try { window._hr.teardown(); } catch (_) {} }
  var H = window._hr = { alive: true, q: '', cardURL: null, cardBlob: null };
  window._pageCleanup = window._pageCleanup || [];
  var MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function num(n) { n = Number(n) || 0; return n.toLocaleString('en-US'); }
  function img(url, w) { return url ? (typeof wvImg === 'function' ? wvImg(url, w || 160) : url) : ''; }
  function grad(seed) { return typeof coverGradient === 'function' ? coverGradient(seed || '') : 'linear-gradient(135deg,#5b3fa8,#1d1433)'; }
  function cov(url, seed, w) { return '<div class="gr" style="background:' + grad(seed) + '"></div>' + (url ? '<img src="' + esc(img(url, w)) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : ''); }
  function plural(n, a, b) { return n === 1 ? a : (b || a + 's'); }
  function badName(n) { var s = String(n || '').trim().toLowerCase(); return !s || s === 'unknown' || s === 'wvarchivebot'; }
  function svg(d, size, sw) { return '<svg width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; }
  var I_PLAY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg>';
  var I_X = svg('M6 6l12 12M18 6L6 18', 15, 2.4);

  function hist() { try { var r = JSON.parse(localStorage.getItem('recently_played') || '[]'); return Array.isArray(r) ? r.filter(function (t) { return t && t.id; }) : []; } catch (e) { return []; } }
  function tally() { try { var t = JSON.parse(localStorage.getItem('wv_play_tally') || '{}'); return t && typeof t === 'object' ? t : {}; } catch (e) { return {}; } }
  function hrefOf(t) { return t._type === 'album' ? '/album?id=' + encodeURIComponent(t.id) : '/track?id=' + encodeURIComponent(t.id); }
  function ago(ts) {
    if (!ts) return '';
    var m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24);
    if (d < 7) return d + 'd ago';
    var dt = new Date(ts);
    return MONTHS[dt.getMonth()] + ' ' + dt.getDate();
  }

  function summary() {
    var all = tally();
    var list = Object.keys(all).map(function (k) { var e = all[k]; if (e && !e.id) e.id = k; return e; }).filter(function (e) { return e && e.id && (Number(e.n) || 0) > 0; });
    var total = 0, comps = 0;
    list.forEach(function (e) { total += Number(e.n) || 0; if (e._type === 'album') comps++; });
    var top = list.slice().sort(function (a, b) { return (b.n - a.n) || ((b.last || 0) - (a.last || 0)); });
    var cm = {};
    list.forEach(function (e) {
      if (badName(e.artist_name)) return;
      var nm = String(e.artist_name).split(/\s*(?:,|&)\s*/)[0];
      if (!nm) return;
      var k = nm.toLowerCase();
      (cm[k] || (cm[k] = { name: nm, n: 0 })).n += Number(e.n) || 0;
    });
    var creators = Object.keys(cm).map(function (k) { return cm[k]; }).sort(function (a, b) { return b.n - a.n; });
    var first = list.reduce(function (m, e) { return e.last && e.last > m ? e.last : m; }, 0);
    return { list: list, total: total, unique: list.length, comps: comps, edits: list.length - comps, top: top, creators: creators, first: first, map: all };
  }

  function renderHero(S) {
    var el = $('hr-hero');
    if (!el) return;
    if (!S.total) { el.innerHTML = ''; return; }
    var t5 = S.top.slice(0, 5);
    var tile = function (e, i, cls) {
      if (!e) return '<div class="hr-tile ' + (cls || '') + '" style="cursor:default"></div>';
      return '<div class="hr-tile ' + (cls || '') + '" role="link" tabindex="0" data-href="' + esc(hrefOf(e)) + '" aria-label="' + esc((i + 1) + '. ' + (e.title || 'Untitled')) + '">' + cov(e.cover_url, e.title, cls === 'big' ? 480 : 200) + '<span class="rk">' + (i + 1) + '</span></div>';
    };
    var cr = S.creators.slice(0, 3);
    el.innerHTML = '<section class="hr-hero" id="hr-hero-card" aria-label="Your listening recap">' +
      '<div>' +
        '<div class="hr-kick">your recap &middot; all time on this device</div>' +
        '<div class="hr-big">' + num(S.total) + '</div>' +
        '<div class="hr-bigsub">' + plural(S.total, 'listen') + (S.first ? ' &middot; last one ' + esc(ago(S.first)) : '') + '</div>' +
        '<div class="hr-stats">' +
          '<div class="hr-stat"><b>' + num(S.unique) + '</b><span>' + plural(S.unique, 'release') + '</span></div>' +
          '<div class="hr-stat"><b>' + num(S.comps) + '</b><span>' + plural(S.comps, 'comp') + '</span></div>' +
          '<div class="hr-stat"><b>' + num(S.edits) + '</b><span>' + plural(S.edits, 'edit') + '</span></div>' +
        '</div>' +
        (cr.length ? '<div class="hr-creators"><div class="hr-kick">top creators</div><div class="hr-cr">' + cr.map(function (c, i) {
          return '<span><i>' + (i + 1) + '</i>' + esc(c.name) + ' <em>' + num(c.n) + '</em></span>';
        }).join('') + '</div></div>' : '') +
        '<div class="hr-hero-acts">' +
          '<a class="hr-hbtn w" href="/wrapped" data-nav="/wrapped">' + svg('M5 4l14 8-14 8z', 14, 2.4) + 'Watch your recap</a>' +
          '<button type="button" class="hr-hbtn g" id="hr-share">' + svg('M12 15V4m0 0L8 8m4-4l4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7', 15, 2.2) + 'Share card</button>' +
        '</div>' +
      '</div>' +
      '<div class="hr-mosaic">' + tile(t5[0], 0, 'big') + [1, 2, 3, 4].map(function (i) { return tile(t5[i], i); }).join('') + '</div>' +
    '</section>';
    var top = t5[0];
    if (top && top.cover_url && typeof extractCoverHues === 'function') {
      extractCoverHues(top.cover_url, top.title || '', function (c) {
        if (!H.alive) return;
        var card = $('hr-hero-card');
        if (!card || !c) return;
        var d = ((c.h2 - c.h1 + 540) % 360) - 180;
        var h2 = Math.abs(d) > 55 ? (c.h1 + 320) % 360 : c.h2;
        H.hue = { h1: c.h1, s1: c.s1, h2: h2 };
        card.style.setProperty('--c1', 'hsl(' + c.h1 + ' 62% 40%)');
        card.style.setProperty('--c2', 'hsl(' + h2 + ' 55% 30%)');
        card.style.setProperty('--c3', 'hsl(' + c.h1 + ' 40% 15%)');
        card.style.setProperty('--c4', 'hsl(' + h2 + ' 45% 7%)');
      });
    }
  }

  function renderRepeat() {
    var el = $('hr-repeat');
    if (!el) return;
    var list = typeof getPlayTally === 'function' ? getPlayTally({ days: 7, min: 2, limit: 12 }) : [];
    if (!list.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="hr-sec"><div><h2>On repeat this week</h2><div class="sub">what you kept coming back to in the last 7 days</div></div></div>' +
      '<div class="hr-rail" role="list">' + list.map(function (e) {
        return '<div class="hr-card" role="listitem" tabindex="0" data-href="' + esc(hrefOf(e)) + '" aria-label="' + esc(e.title || 'Untitled') + '">' +
          '<div class="cv">' + cov(e.cover_url, e.title, 320) + '<span class="cnt">' + svg('M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4', 11, 2.4) + num(e.n) + '</span></div>' +
          '<div class="t">' + esc(e.title || 'Untitled') + '</div>' +
          '<div class="s">' + (e._type === 'album' ? 'Comp' : 'Edit') + (badName(e.artist_name) ? '' : ' · ' + esc(e.artist_name)) + '</div>' +
        '</div>';
      }).join('') + '</div>';
  }

  function renderTop() {
    var el = $('hr-top');
    if (!el) return;
    var top = typeof getPlayTally === 'function' ? getPlayTally({ min: 2, limit: 10 }) : [];
    if (!top.length) { el.innerHTML = ''; return; }
    var max = top[0].n || 1;
    el.innerHTML = '<div class="hr-sec"><div><h2>Your most played</h2><div class="sub">all time on this device</div></div></div>' +
      '<div class="wv-top-list">' + top.map(function (e) {
        var pct = Math.max(8, Math.round((e.n / max) * 100));
        return '<div class="wv-top-row" role="link" tabindex="0" data-href="' + esc(hrefOf(e)) + '">' +
          '<div class="wv-trow-art" style="background:' + grad(e.title || '') + ';">' +
            (e.cover_url ? '<img src="' + esc(img(e.cover_url, 96)) + '" loading="lazy" alt="" onerror="this.remove()">' : '') + '</div>' +
