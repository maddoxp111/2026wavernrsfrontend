<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — sign up</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wv-auth-page theme-light" id="auth-root">
  <div class="wv-auth-card wv-card">
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.04em;color:var(--brand);margin-bottom:24px;">wavernrs</div>
    <div class="wv-auth-title">Create account</div>
    <div class="wv-auth-sub">Upload and share your music</div>

    <div id="alert-container"></div>

    <div class="wv-form-field">
      <label class="wv-form-label" for="username">Username</label>
      <input class="wv-input" type="text" id="username" placeholder="yourname" autocomplete="username">
      <div style="font-size:11px;color:var(--text-3);margin-top:4px;">Letters, numbers, underscores. Min 3 characters.</div>
    </div>
    <div class="wv-form-field">
      <label class="wv-form-label" for="password">Password</label>
      <input class="wv-input" type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password">
    </div>
    <div class="wv-form-field">
      <label class="wv-form-label" for="password2">Confirm password</label>
      <input class="wv-input" type="password" id="password2" placeholder="••••••••" autocomplete="new-password">
    </div>

    <button class="wv-pill brand" style="width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:8px;" id="register-btn" onclick="doRegister()">Create account</button>

    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-2);">
      Already have an account? <a href="/login.html" style="color:var(--brand);font-weight:500;">Log in</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  var _t = localStorage.getItem('wv-theme') || 'light';
  document.getElementById('auth-root').className = 'wv-auth-page theme-' + _t;

  if (isLoggedIn()) location.href = '/index.html';

  function showAlert(containerId, msg) {
    const el = document.getElementById(containerId);
    if (el) el.innerHTML = '<div class="wv-form-error">' + msg + '</div>';
  }
  function clearAlert(containerId) {
    const el = document.getElementById(containerId);
    if (el) el.innerHTML = '';
  }

  document.getElementById('password2').addEventListener('keydown', e => {
    if (e.key === 'Enter') doRegister();
  });

  async function doRegister() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    clearAlert('alert-container');

    if (!username || !password || !password2) return showAlert('alert-container', 'Please fill in all fields');
    if (password !== password2) return showAlert('alert-container', 'Passwords do not match');
    if (!/^[a-z0-9_]{3,}$/i.test(username)) return showAlert('alert-container', 'Username can only contain letters, numbers, and underscores (min 3 chars)');

    const btn = document.getElementById('register-btn');
    btn.textContent = 'Creating account…';
    btn.disabled = true;

    try {
      const { token, user } = await api('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(user));
      location.href = '/dashboard.html';
    } catch (err) {
      showAlert('alert-container', err.message);
      btn.textContent = 'Create account';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
