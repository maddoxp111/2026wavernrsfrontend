<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — comp</title>
  <link rel="stylesheet" href="/css/style.css?v=202609051856">
</head>
<body>

<div id="view">
<div class="container" style="max-width:1100px;">
  <div id="album-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>
</div><!-- /view -->

<script src="/js/api.js?v=202609051856"></script>
<script src="/js/layout.js?v=202609051856"></script>
<script src="/js/player.js?v=202609051856"></script>
<script src="/js/router.js?v=202609051856"></script>
<script src="/js/playlists.js?v=202609051856"></script>
<script src="/js/ratings.js?v=202609051856"></script>
<script>
  initPlayer();

  var albumId = new URLSearchParams(location.search).get('id');
  if (!albumId) navigate('/index.html');

  var album = null;
  var albumTracks = [];
  var currentTrackIndex = -1;

  async function loadAlbum() {
    // Only a failed fetch should show "not found". Everything after is
    // best-effort so a hiccup in a secondary call can't blank the page.
    try {
      album = await api(`/albums/${albumId}`);
    } catch (err) {
      document.getElementById('album-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">Comp not found</div><a href="/index.html" class="btn btn-primary" style="margin-top:16px">Go home</a></div>`;
      return;
    }
    try {
      albumTracks = (album.album_tracks || []).sort((a, b) => a.position - b.position);
      document.title = `${album.title} — wavernrs stream`;
      await renderAlbum();
      if (new URLSearchParams(location.search).get('play') === '1' && albumTracks.length) { try { playAll(); } catch (_) {} }
    loadAlbumComments();
      loadMoreLikeThis();
      if (typeof loadRatings === 'function') loadRatings('album', album.id);
    } catch (err) {
      console.error('album render error', err);
    }
  }

  async function renderAlbum() {
    const artist = album.artists || {};
    const eraName = album.era_tag?.name || album.genre || '';
    const badges = await getBadgeData().catch(() => ({ verified_artists: [], highlighted_albums: [], exclusive_albums: [] }));
    const isHighlighted = badges.highlighted_albums && badges.highlighted_albums.indexOf(album.id) !== -1;
    const isExclusive   = badges.exclusive_albums   && badges.exclusive_albums.indexOf(album.id) !== -1;
    const isVerified    = artist.id && badges.verified_artists && badges.verified_artists.indexOf(artist.id) !== -1;
    const badgePills = (isExclusive   ? '<span class="wv-badge-pill wv-badge-exclusive" style="margin-right:4px;">◆ Wavernrs Exclusive</span>' : '') +
                       (isHighlighted ? '<span class="wv-badge-pill wv-badge-highlight" style="margin-right:4px;">★ Highlighted by Wavernrs</span>' : '');
    const verifiedBadge = isVerified ? '<span class="wv-verified-icon" title="Verified Artist">✓</span>' : '';

    // Pre-render 5 empty stars so the widget is immediately visible.
    // loadRatings() will overwrite this with real data once the API responds.
    const starEmpty = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.6"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
    const starPlaceholder = [1,2,3,4,5].map(i =>
      `<button type="button" data-s="${i}" style="background:none;border:none;cursor:pointer;padding:2px;line-height:0;">${starEmpty}</button>`
    ).join('');
    const ratingPlaceholder = `<div style="display:flex;align-items:center;gap:6px;"><div id="wv-stars" style="display:flex;align-items:center;">${starPlaceholder}</div><span style="font-size:13px;color:var(--text-3);">No ratings yet</span></div>`;

    // Freshly created comps (e.g. just imported) live on Internet Archive,
    // which takes a few minutes to process the item before tracks will play.
    // Show a heads-up banner for the first ~15 minutes after creation.
    let freshBanner = '';
    if (album.created_at) {
      const ageMs = Date.now() - new Date(album.created_at).getTime();
      if (ageMs >= 0 && ageMs < 15 * 60 * 1000) {
        freshBanner = `
          <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 16px;margin-bottom:20px;border-radius:12px;background:var(--purple-bg,rgba(139,92,246,0.12));border:1px solid var(--purple-light,rgba(139,92,246,0.35));">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0;margin-top:1px;color:var(--purple);"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div style="font-size:13px;line-height:1.5;color:var(--text-2);">
              <b style="color:var(--text-1);">Just uploaded — give it a few minutes.</b>
              The tracks are still processing and may not play right away. Refresh in a bit if they don't start.
            </div>
          </div>`;
      }
    }

    const coverBg = (typeof coverGradient === 'function') ? coverGradient(album.title || '') : 'linear-gradient(135deg,#1a0a2e,#2d1b6e)';
    const coverInner = album.cover_url
      ? `<img src="${escHtml(album.cover_url)}" alt="cover" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;object-fit:cover;">`
      : '';

    // Blurred album cover as the page background (like the home hero).
    if (typeof window.setPageBgImage === 'function') {
      window.setPageBgImage(album.cover_url || '');
    }

    document.getElementById('album-container').innerHTML = `
      <div style="padding:28px 0;">
        ${freshBanner}
        <div class="wv-hero">
          <div class="wv-hero-art" style="background:${coverBg};">
            ${coverInner}
          </div>
          <div class="wv-hero-body">
            <div class="wv-kind">${album.is_archive ? 'Archived compilation' : 'Compilation'}</div>
            ${badgePills ? `<div style="margin:6px 0 2px;">${badgePills}</div>` : ''}
            <div class="wv-hero-title">${escHtml(album.title)}</div>
            <div class="wv-hero-sub">
              ${album.is_archive
                ? `<a href="/archive-artist.html?a=${encodeURIComponent(archiveArtistSlug(album.archive_artist_name || 'Unknown'))}">${escHtml(album.archive_artist_name || 'Unknown')}</a>`
                : `<a href="/artist.html?id=${artist.id}">${escHtml(artist.display_name || 'Unknown')}${verifiedBadge}</a>`}
            </div>
            <div class="wv-hero-meta">${eraName ? escHtml(eraName) + ' · ' : ''}${albumTracks.length} edit${albumTracks.length !== 1 ? 's' : ''}${album.play_count ? ' · ' + fmtNum(album.play_count) + ' plays' : ''}</div>
            <div class="wv-hero-actions">
              <button class="wv-btn-play" onclick="playAll()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg>Play
              </button>
              <button class="wv-btn-ghost" onclick="shuffleAll()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.2 4.4 21 8.2l-3.8 3.8V9.4h-2.1c-1 0-1.6.4-2.3 1.4l-.9 1.3-1.5-2.1.7-1c1.1-1.6 2.4-2.4 4-2.4h2.1Zm0 8.1 3.8 3.8-3.8 3.8v-2.6h-2.1c-1.6 0-2.9-.8-4-2.4l-3-4.3c-.7-1-1.3-1.4-2.3-1.4H3.2V9.4h2.6c1.6 0 2.9.8 4 2.4l3 4.3c.7 1 1.3 1.4 2.3 1.4h2.1Zm-11.4 2.1c.6 0 1.1-.15 1.55-.5l1.45 2.05c-.85.6-1.85.9-3 .9H3.2v-2.45Z"/></svg>Shuffle
              </button>
              <button class="wv-icon-btn" id="like-btn" onclick="toggleLike()" title="Like">${album.user_liked ? '♥' : '♡'}</button>
              <div id="rating-widget">${ratingPlaceholder}</div>
            </div>
            <div class="wv-hero-actions" style="margin-top:10px;">
              <a href="${API_BASE}/albums/${albumId}/download" class="wv-btn-ghost" id="download-comp-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                Download Zip
              </a>
              <button class="wv-btn-ghost" id="share-btn" onclick="copyLink()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z"/></svg>
                Share
              </button>
              ${album.is_archive && album.source_url ? `<a href="${escHtml(album.source_url)}" target="_blank" rel="noopener noreferrer" class="wv-btn-ghost">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>
                Direct Link
              </a>` : ''}
            </div>
          </div>
        </div>

        <h2 class="section-title">Tracklist</h2>
        <div class="track-list" id="tracklist">
          ${albumTracks.length === 0 ? `<div class="empty-state"><div class="empty-icon">🎵</div><div class="empty-title">No edits yet</div></div>` :
            albumTracks.map((t, i) => {
              const td = t.tracks || t;
              const tdCoverBg = (typeof coverGradient === 'function') ? coverGradient(td.title || '') : '#333';
              const tdCoverStyle = `width:40px;height:40px;border-radius:8px;flex-shrink:0;background:${tdCoverBg};position:relative;overflow:hidden;`;
              const trackCover = td.cover_url || album.cover_url || '';
              const tdCoverImg = trackCover ? `<img src="${escHtml(trackCover)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">` : '';
              // Encode the track object for a double-quoted onclick attribute:
              // JSON's own double quotes would otherwise close the attribute early
              // and break the button. &quot; is decoded back to " when the browser
              // parses the attribute (same approach as track.html).
              const tdObjAttr = JSON.stringify({
                id: td.id,
                title: td.title || '',
                cover_url: td.cover_url || '',
                ia_url: td.ia_url || '',
                artist_name: album.is_archive ? (album.archive_artist_name || 'Unknown') : (td.artists?.display_name || artist.display_name || ''),
              }).replace(/"/g, '&quot;');
              return `
                <div class="track-row" id="trow-${i}" onclick="playAtIndex(${i})">
                  <div class="track-row-num">${i + 1}</div>
                  <div style="${tdCoverStyle}">${tdCoverImg}</div>
                  <div class="track-row-info">
                    <div class="track-row-title">${escHtml(td.title || 'Unknown')}</div>
                    <div class="track-row-artist">${escHtml(album.is_archive ? (album.archive_artist_name || 'Unknown') : (td.artists?.display_name || artist.display_name || 'Unknown'))}</div>
                  </div>
                  <span class="track-row-plays">${fmtNum(td.play_count)} plays</span>
                  <button onclick="event.stopPropagation();openAddToPlaylist(${tdObjAttr})"
                    style="background:none;border:none;cursor:pointer;padding:4px 8px;font-size:18px;color:var(--text-3);flex-shrink:0;line-height:1;" title="Save to playlist">＋</button>
                  <a href="/track.html?id=${td.id}" onclick="event.stopPropagation()" style="font-size:12px;color:var(--text-3);padding:4px 8px;white-space:nowrap;">Open</a>
                </div>`;
            }).join('')}
        </div>

        <div style="margin-top:40px;">
          <h2 class="section-title">Comments</h2>
          <div id="album-comment-form" style="margin-bottom:24px;">
            ${isLoggedIn() ? `
              <div style="display:flex;flex-direction:column;gap:10px;">
                <textarea id="album-comment-input" class="wv-input" placeholder="Add a comment…"
                  style="min-height:72px;resize:vertical;line-height:1.5;"
                  onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))postAlbumComment()"></textarea>
                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
                  <button id="ac-ts-toggle" onclick="toggleAcTsComment()" title="Pin this comment to the moment you're at in the playing track"
                    style="display:none;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1px solid var(--hair-strong);background:transparent;color:var(--text-3);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;">⏱ at 0:00</button>
                  <button class="btn btn-primary btn-sm" onclick="postAlbumComment()" style="margin-left:auto;">Post</button>
                </div>
              </div>
            ` : `<p style="font-size:14px;color:var(--text-2);">
              <a href="/login.html" style="color:var(--brand);font-weight:500;">Log in</a> to leave a comment.
            </p>`}
          </div>
          <div id="album-comments-list"><div class="loading"><div class="spinner"></div></div></div>
        </div>

        <div id="more-like-this" style="margin-top:48px;padding-bottom:40px;"></div>
      </div>`;

    // Wire IA CDN retry on all cover images (they may take 1-3 min to propagate)
    if (typeof wireIACoverRetry === 'function') {
      document.querySelectorAll('#album-container img').forEach(wireIACoverRetry);
    }
  }

  var albumLiked = false;

  async function toggleLike() {
    if (!isLoggedIn()) { navigate('/login.html'); return; }
    try {
      const res = await api(`/albums/${albumId}/like`, { method: 'POST' });
      albumLiked = res.liked;
      const btn = document.getElementById('like-btn');
      if (!btn) return;
      const countText = btn.textContent.replace(/[♥♡]/,'').trim();
      let count = parseInt(countText.replace(/,/g,''), 10) || 0;
      count = albumLiked ? count + 1 : Math.max(0, count - 1);
      btn.innerHTML = `${albumLiked ? '♥' : '♡'} ${fmtNum(count)}`;
    } catch (e) {}
  }

  function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(function() {
      var btn = document.getElementById('share-btn');
      if (!btn) return;
      var orig = btn.innerHTML;
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.innerHTML = orig; }, 2000);
    }).catch(function() {});
  }

  function playAll() {
    if (!albumTracks.length) return;
    playAtIndex(0);
  }

  function _buildAlbumQueue() {
    return albumTracks.map((item) => {
      const td = item.tracks || item;
      return {
        ...td,
        cover_url: td.cover_url || album.cover_url || '',
        artist_name: album.is_archive ? (album.archive_artist_name || 'Unknown') : (td.artists?.display_name || album.artists?.display_name),
        _album_id: album.id,
        _album_title: album.title,
        _album_cover: album.cover_url || null,
      };
    });
  }

  function _highlightAlbumRow(index) {
    document.querySelectorAll('#tracklist .track-row').forEach((row, i) => {
      row.classList.toggle('playing', i === index);
    });
  }

  function shuffleAll() {
    if (!albumTracks.length) return;
    var order = albumTracks.map(function(_, i) { return i; });
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    var q = _buildAlbumQueue();
    var shuffled = order.map(function(i) { return q[i]; }).filter(Boolean);
    if (!shuffled.length) return;
    setPlayerQueue(shuffled, 0, function(idx) { _highlightAlbumRow(order[idx]); });
    playQueueIndex(0);
  }

  function playAtIndex(index) {
    if (!albumTracks[index]) return;
    currentTrackIndex = index;
    // Hand the full ordered list to the player so skip/prev (incl. OS media
    // controls) work even after navigating away from this page.
    setPlayerQueue(_buildAlbumQueue(), index, _highlightAlbumRow);
    playQueueIndex(index);
    _highlightAlbumRow(index);
  }

  async function loadMoreLikeThis() {
    var el = document.getElementById('more-like-this');
    if (!el || !album) return;
    try {
      var artist = album.artists || {};
      var artistId = artist.id;
      var eraTagId = album.era_tag ? album.era_tag.id : album.era_tag_id;

      var results = await Promise.all([
        artistId ? api('/albums/by-artist/' + artistId).catch(function() { return []; }) : Promise.resolve([]),
        artistId ? api('/artists/' + artistId + '/tracks').catch(function() { return []; }) : Promise.resolve([]),
        eraTagId ? api('/discover/era/' + eraTagId).catch(function() { return []; }) : Promise.resolve([]),
      ]);
      var artistAlbums = results[0];
      var artistTracks = results[1];
      var eraItems = results[2];

      var byArtist = [].concat(
        artistAlbums.filter(function(a) { return a.id !== album.id; }).slice(0, 2).map(function(a) { return Object.assign({}, a, {_type:'album'}); }),
        artistTracks.slice(0, 2).map(function(t) { return Object.assign({}, t, {_type:'track'}); })
      ).slice(0, 4);

      var byEra = eraTagId
        ? eraItems.filter(function(t) { return t.id !== album.id && !byArtist.find(function(x) { return x.id === t.id; }); })
            .slice(0, 4).map(function(t) { return Object.assign({}, t, {_type:'track'}); })
        : [];

      var html = '';
      if (byArtist.length) {
        html += '<h2 class="section-title" style="margin-top:0;">More by ' + escHtml(artist.display_name || 'this artist') + '</h2>';
        html += '<div class="wv-comp-grid wv-comp-grid-4">' + byArtist.map(function(item) { return renderMoreCard(item); }).join('') + '</div>';
      }
      if (byEra.length) {
        var eraName = album.era_tag ? album.era_tag.name : '';
        html += '<h2 class="section-title" style="margin-top:32px;">More' + (eraName ? ' from ' + escHtml(eraName) : ' like this') + '</h2>';
        html += '<div class="wv-comp-grid wv-comp-grid-4">' + byEra.map(function(item) { return renderMoreCard(item); }).join('') + '</div>';
      }
      el.innerHTML = html;
    } catch (_) {}
  }

  function renderMoreCard(item) {
    var isAlbum = item._type === 'album';
    var bg = (typeof coverGradient === 'function') ? coverGradient(item.title || '') : '#333';
    var coverImg = item.cover_url
      ? '<img src="' + escHtml(item.cover_url) + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">'
      : '';
    var clickAction = isAlbum
      ? "navigate('/album.html?id=" + item.id + "')"
      : "navigate('/track.html?id=" + item.id + "')";
    var artistName = item.artists ? (item.artists.display_name || '') : '';
    return '<div class="wv-comp-card" onclick="' + clickAction + '">' +
      '<div class="wv-comp-card-cover">' +
        '<div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
          '' +
          (isAlbum ? '' : '') +
          coverImg +
          (!isAlbum ? '<button class="wv-cover-play-btn" onclick="event.stopPropagation();navigate(\'/track.html?id=' + item.id + '\')">'+
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
          '</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="wv-comp-card-title">' + escHtml(item.title || 'Untitled') + '</div>' +
      '<div class="wv-comp-card-artist">' + escHtml(artistName) + '</div>' +
    '</div>';
  }

  // ── Album comments ────────────────────────────────────────────────────────
  var albumMyVotes = {};
  var _acMe = null;
  try { _acMe = JSON.parse(localStorage.getItem('user')); } catch(_) {}

  function _acAvatar(uname) {
    return '<div style="width:32px;height:32px;border-radius:50%;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:var(--purple);">' + (uname.charAt(0).toUpperCase() || '?') + '</div>';
  }

  function _acBuildRow(c, isReply) {
    var uname = escHtml((c.users && c.users.username) || 'Unknown');
    var uv = albumMyVotes[c.id] || 0;
    var upActive = uv === 1 ? 'color:var(--brand);font-weight:700;' : 'color:var(--text-3);';
    var downActive = uv === -1 ? 'color:var(--red);font-weight:700;' : 'color:var(--text-3);';
    var timeStr = c.created_at ? new Date(c.created_at).toLocaleDateString() : '';
    var editedMark = c.edited_at ? '<span style="font-size:10px;color:var(--text-3);margin-left:4px;">(edited)</span>' : '';
    var isMine = _acMe && c.user_id === _acMe.id;

    var actionBtns = '<button onclick="acShowReply(\'' + escHtml(c.id) + '\')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3);padding:2px 6px;font-family:inherit;">Reply</button>';
    if (isMine) {
      actionBtns +=
        '<button onclick="acStartEdit(\'' + escHtml(c.id) + '\')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3);padding:2px 6px;font-family:inherit;">Edit</button>' +
        '<button onclick="deleteAlbumComment(\'' + escHtml(c.id) + '\')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3);padding:2px 6px;font-family:inherit;">Delete</button>';
    }

    var indent = isReply ? 'margin-left:44px;' : '';
    return '<div id="albumcomment-' + escHtml(c.id) + '" style="' + indent + '">' +
      '<div style="display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:12px;transition:background 0.12s;" onmouseenter="this.style.background=\'var(--hair)\'" onmouseleave="this.style.background=\'transparent\'">' +
        _acAvatar(uname) +
        '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;">' +
            '<span style="font-size:13px;font-weight:600;color:var(--text);">' + uname + '</span>' +
            '<span style="font-size:11px;color:var(--text-3);">' + timeStr + '</span>' +
            editedMark +
          '</div>' +
          '<div id="acbody-' + escHtml(c.id) + '" style="font-size:14px;color:var(--text-2);line-height:1.5;word-break:break-word;">' + _acTsChip(c) + escHtml(c.body || '') + '</div>' +
          '<div style="display:flex;align-items:center;gap:2px;margin-top:6px;flex-wrap:wrap;">' +
            '<button id="acvote-up-btn-' + escHtml(c.id) + '" onclick="voteAlbumComment(\'' + escHtml(c.id) + '\',1)" style="background:none;border:none;cursor:pointer;padding:2px 4px;font-size:12px;' + upActive + '">▲</button>' +
            '<span id="acvote-up-' + escHtml(c.id) + '" style="font-size:11px;color:var(--text-3);min-width:14px;text-align:center;">' + (c.upvotes || 0) + '</span>' +
            '<button id="acvote-down-btn-' + escHtml(c.id) + '" onclick="voteAlbumComment(\'' + escHtml(c.id) + '\',-1)" style="background:none;border:none;cursor:pointer;padding:2px 4px;font-size:12px;' + downActive + '">▼</button>' +
            '<span id="acvote-down-' + escHtml(c.id) + '" style="font-size:11px;color:var(--text-3);min-width:14px;text-align:center;">' + (c.downvotes || 0) + '</span>' +
            '<span style="width:6px;"></span>' +
            actionBtns +
          '</div>' +
          '<div id="acreply-box-' + escHtml(c.id) + '" style="display:none;margin-top:10px;"></div>' +
          '<div id="acedit-box-' + escHtml(c.id) + '" style="display:none;margin-top:10px;"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  async function loadAlbumComments() {
    var el = document.getElementById('album-comments-list');
    if (!el) return;
    try {
      var allComments = await api('/albums/' + albumId + '/comments');
      if (!allComments.length) {
        el.innerHTML = '<div class="empty-state" style="padding:24px 0;"><div class="empty-icon">💬</div><div class="empty-title" style="font-size:14px;">No comments yet. Be the first!</div></div>';
        return;
      }
      for (var c of allComments) albumMyVotes[c.id] = c.user_vote || 0;
      _acTsComments = allComments.filter(function(c) { return c.track_time != null && c.track_ref_id; });

      // Split into top-level and replies, build reply map
      var topLevel = allComments.filter(function(c) { return !c.parent_id; });
      var replyMap = {};
      allComments.filter(function(c) { return !!c.parent_id; }).forEach(function(c) {
        if (!replyMap[c.parent_id]) replyMap[c.parent_id] = [];
        replyMap[c.parent_id].push(c);
      });

      el.innerHTML = topLevel.map(function(c) {
        var html = _acBuildRow(c, false);
        var replies = replyMap[c.id] || [];
        if (replies.length) {
          html += replies.map(function(r) { return _acBuildRow(r, true); }).join('');
        }
        return html;
      }).join('');
    } catch(err) {
      el.innerHTML = '<div class="empty-state" style="padding:16px;"><div class="empty-desc">Failed to load comments</div></div>';
    }
  }

  // ── Timestamped comp comments ─────────────────────────────────────────────
  // A comp comment can be pinned to a moment in whichever track of THIS comp is
  // currently playing. Clicking the chip plays that track and seeks there.
  var acTsEnabled = false;
  var acTsTime = null;
  var acTsTrackId = null;

  function fmtT(s) {
    s = Math.max(0, Math.floor(Number(s) || 0));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // Index of the currently-playing track within THIS comp, or -1.
  function _playingCompIndex() {
    if (typeof currentTrack === 'undefined' || !currentTrack) return -1;
    if (typeof audio === 'undefined' || !audio || !audio.src) return -1;
    // Queue objects built by _buildAlbumQueue carry _album_id; trust that first.
    if (currentTrack._album_id && currentTrack._album_id !== album.id) return -1;
    for (var i = 0; i < albumTracks.length; i++) {
      var td = albumTracks[i].tracks || albumTracks[i];
      if (td.id === currentTrack.id) return i;
    }
    return -1;
  }

  function _trackTitleById(id) {
    for (var i = 0; i < albumTracks.length; i++) {
      var td = albumTracks[i].tracks || albumTracks[i];
      if (td.id === id) return td.title || 'Track ' + (i + 1);
    }
    return 'this track';
  }

  function toggleAcTsComment() {
    var idx = _playingCompIndex();
    if (idx < 0) { acTsEnabled = false; acTsTime = null; acTsTrackId = null; _updateAcTsChip(); return; }
    acTsEnabled = !acTsEnabled;
    if (acTsEnabled) {
      acTsTime = Math.round(audio.currentTime * 10) / 10;
      var td = albumTracks[idx].tracks || albumTracks[idx];
      acTsTrackId = td.id;
    } else {
      acTsTime = null; acTsTrackId = null;
    }
    _updateAcTsChip();
  }

  function _updateAcTsChip() {
    var chip = document.getElementById('ac-ts-toggle');
    if (!chip) return;
    var idx = _playingCompIndex();
    if (idx < 0) {
      chip.style.display = 'none';
      acTsEnabled = false; acTsTime = null; acTsTrackId = null;
      return;
    }
    chip.style.display = 'inline-flex';
    if (acTsEnabled && acTsTime != null) {
      chip.textContent = '⏱ ' + fmtT(acTsTime) + ' on “' + (_trackTitleById(acTsTrackId)) + '” ✓';
      chip.style.borderColor = 'var(--brand)';
      chip.style.background = 'var(--brand-bg)';
      chip.style.color = 'var(--brand)';
    } else {
      chip.textContent = '⏱ at ' + fmtT(audio.currentTime);
      chip.style.borderColor = 'var(--hair-strong)';
      chip.style.background = 'transparent';
      chip.style.color = 'var(--text-3)';
    }
  }

  function _acTsChip(c) {
    if (c.track_time == null || !c.track_ref_id) return '';
    var label = '@ ' + fmtT(c.track_time) + ' · ' + escHtml(_trackTitleById(c.track_ref_id));
    return '<button onclick="seekToCompComment(\'' + escHtml(c.track_ref_id) + '\',' + Number(c.track_time) + ')" ' +
      'title="Jump to this moment" ' +
      'style="display:inline-flex;align-items:center;padding:1px 8px;margin-right:6px;border-radius:12px;border:1px solid var(--brand);background:var(--brand-bg);color:var(--brand);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;vertical-align:middle;">' +
      label + '</button>';
  }

  function seekToCompComment(trackRefId, t) {
    var idx = -1;
    for (var i = 0; i < albumTracks.length; i++) {
      var td = albumTracks[i].tracks || albumTracks[i];
      if (td.id === trackRefId) { idx = i; break; }
    }
    if (idx < 0) return;
    if (_playingCompIndex() === idx) {
      audio.currentTime = t;
      audio.play().catch(function(){});
      return;
    }
    playAtIndex(idx);
    var onCan = function() {
      audio.removeEventListener('canplay', onCan);
      audio.currentTime = t;
    };
    audio.addEventListener('canplay', onCan);
  }

  // ── Live surfacing: pop a comp comment when playback reaches its moment ────
  var _acTsComments = [];
  var _acLastTime = 0;
  var _acLastTrackId = null;
  var _acToastUntil = 0;

  function _acToastEl() {
    var el = document.getElementById('ac-ts-toast');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'ac-ts-toast';
    el.style.cssText = 'display:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:400;' +
      'max-width:min(420px,92vw);background:var(--surface-2,#1a1a1a);border:1px solid var(--brand);border-radius:14px;' +
      'padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,0.5);';
    el.innerHTML =
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">' +
        '<span id="ac-toast-user" style="font-size:12px;font-weight:700;color:var(--brand);"></span>' +
        '<span id="ac-toast-meta" style="font-size:10.5px;color:var(--text-3);"></span>' +
      '</div>' +
      '<div id="ac-toast-text" style="font-size:13px;color:var(--text);line-height:1.4;word-break:break-word;"></div>';
    document.body.appendChild(el);
    return el;
  }

  function _acShowToast(c) {
    var el = _acToastEl();
    document.getElementById('ac-toast-user').textContent = (c.users && c.users.username) || 'unknown';
    document.getElementById('ac-toast-meta').textContent = '@ ' + fmtT(c.track_time) + ' · ' + _trackTitleById(c.track_ref_id);
    document.getElementById('ac-toast-text').textContent = c.body || c.content || '';
    el.style.display = 'block';
    _acToastUntil = Date.now() + 4500;
  }

  function _acCheckCrossing() {
    var idx = _playingCompIndex();
    if (idx < 0) { _acLastTrackId = null; return; }
    var td = albumTracks[idx].tracks || albumTracks[idx];
    var curId = td.id;
    var now = audio.currentTime;
    // Reset the crossing baseline when the playing track changes.
    if (curId !== _acLastTrackId) { _acLastTrackId = curId; _acLastTime = now; return; }
    if (audio.paused) { _acLastTime = now; return; }
    var crossed = null;
    for (var i = 0; i < _acTsComments.length; i++) {
      var c = _acTsComments[i];
      if (c.track_ref_id !== curId) continue;
      var t = Number(c.track_time);
      if (t > _acLastTime && t <= now) {
        if (!crossed || t > Number(crossed.track_time)) crossed = c;
      }
    }
    if (crossed) _acShowToast(crossed);
    _acLastTime = now;
  }

  // Keep the chip label fresh and surface comments live while a comp track plays.
  var _acTsTimer = setInterval(function() {
    // album-comments-list always exists on this page (chip is login-gated, so
    // don't key the timer's lifetime to it — logged-out users surface too).
    if (!document.getElementById('album-comments-list')) {
      clearInterval(_acTsTimer);
      var stale = document.getElementById('ac-ts-toast'); // lives on body, outside #view
      if (stale) stale.remove();
      return;
    }
    _updateAcTsChip();
    _acCheckCrossing();
    var toast = document.getElementById('ac-ts-toast');
    if (toast && toast.style.display !== 'none' && Date.now() > _acToastUntil) toast.style.display = 'none';
  }, 300);

  async function postAlbumComment() {
    var input = document.getElementById('album-comment-input');
    var body = input ? input.value.trim() : '';
    if (!body) return;
    try {
      var payload = { body: body };
      if (acTsEnabled && acTsTime != null && acTsTrackId) {
        payload.track_time = acTsTime;
        payload.track_ref_id = acTsTrackId;
      }
      await api('/albums/' + albumId + '/comments', { method: 'POST', body: JSON.stringify(payload) });
      input.value = '';
      acTsEnabled = false; acTsTime = null; acTsTrackId = null;
      loadAlbumComments();
    } catch(err) {
      alert(err.message || 'Failed to post comment');
    }
  }

  function acShowReply(parentId) {
    // Close any other open reply boxes
    document.querySelectorAll('[id^="acreply-box-"]').forEach(function(el) {
      if (el.id !== 'acreply-box-' + parentId) el.style.display = 'none';
    });
    var box = document.getElementById('acreply-box-' + parentId);
    if (!box) return;
    if (box.style.display !== 'none') { box.style.display = 'none'; return; }
    if (!isLoggedIn()) { navigate('/login.html'); return; }
    box.style.display = '';
    box.innerHTML =
      '<div style="display:flex;gap:8px;">' +
        '<textarea id="acreply-input-' + escHtml(parentId) + '" class="wv-input" rows="2" placeholder="Write a reply…" style="flex:1;resize:vertical;"></textarea>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:6px;">' +
        '<button class="btn btn-primary btn-sm" onclick="submitReply(\'' + escHtml(parentId) + '\')">Reply</button>' +
        '<button class="btn btn-secondary btn-sm" onclick="document.getElementById(\'acreply-box-' + escHtml(parentId) + '\').style.display=\'none\'">Cancel</button>' +
      '</div>';
    var ta = document.getElementById('acreply-input-' + parentId);
    if (ta) setTimeout(function() { ta.focus(); }, 50);
  }

  async function submitReply(parentId) {
    var ta = document.getElementById('acreply-input-' + parentId);
    var body = ta ? ta.value.trim() : '';
    if (!body) return;
    var btn = document.querySelector('#acreply-box-' + parentId + ' .btn-primary');
    if (btn) { btn.disabled = true; btn.textContent = 'Posting…'; }
    try {
      await api('/albums/' + albumId + '/comments', { method: 'POST', body: JSON.stringify({ body: body, parent_id: parentId }) });
      loadAlbumComments();
    } catch(err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Reply'; }
      alert(err.message || 'Failed to post reply');
    }
  }

  function acStartEdit(commentId) {
    var bodyEl = document.getElementById('acbody-' + commentId);
    var editBox = document.getElementById('acedit-box-' + commentId);
    if (!bodyEl || !editBox) return;
    var current = bodyEl.textContent || '';
    bodyEl.style.display = 'none';
    editBox.style.display = '';
    editBox.innerHTML =
      '<textarea id="acedit-input-' + escHtml(commentId) + '" class="wv-input" rows="3" style="width:100%;resize:vertical;">' + escHtml(current) + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:6px;">' +
        '<button class="btn btn-primary btn-sm" onclick="submitEdit(\'' + escHtml(commentId) + '\')">Save</button>' +
        '<button class="btn btn-secondary btn-sm" onclick="acCancelEdit(\'' + escHtml(commentId) + '\')">Cancel</button>' +
      '</div>';
    var ta = document.getElementById('acedit-input-' + commentId);
    if (ta) { setTimeout(function() { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }, 50); }
  }

  function acCancelEdit(commentId) {
    var bodyEl = document.getElementById('acbody-' + commentId);
    var editBox = document.getElementById('acedit-box-' + commentId);
    if (bodyEl) bodyEl.style.display = '';
    if (editBox) editBox.style.display = 'none';
  }

  async function submitEdit(commentId) {
    var ta = document.getElementById('acedit-input-' + commentId);
    var body = ta ? ta.value.trim() : '';
    if (!body) return;
    var btn = document.querySelector('#acedit-box-' + commentId + ' .btn-primary');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
      var updated = await api('/albums/' + albumId + '/comments/' + commentId, { method: 'PATCH', body: JSON.stringify({ body: body }) });
      var bodyEl = document.getElementById('acbody-' + commentId);
      var editBox = document.getElementById('acedit-box-' + commentId);
      if (bodyEl) { bodyEl.textContent = updated.body || body; bodyEl.style.display = ''; }
      if (editBox) editBox.style.display = 'none';
      // Show edited mark if not already there
      var row = document.getElementById('albumcomment-' + commentId);
      if (row && !row.querySelector('.ac-edited')) {
        var meta = row.querySelector('[style*="margin-bottom:4px"]');
        if (meta) {
          var mark = document.createElement('span');
          mark.className = 'ac-edited';
          mark.style.cssText = 'font-size:10px;color:var(--text-3);margin-left:4px;';
          mark.textContent = '(edited)';
          meta.appendChild(mark);
        }
      }
    } catch(err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
      alert(err.message || 'Failed to save');
    }
  }

  async function voteAlbumComment(commentId, vote) {
    try {
      var res = await api('/albums/' + albumId + '/comments/' + commentId + '/vote', { method: 'POST', body: JSON.stringify({ vote: vote }) });
      albumMyVotes[commentId] = albumMyVotes[commentId] === vote ? 0 : vote;
      var upEl = document.getElementById('acvote-up-' + commentId);
      var downEl = document.getElementById('acvote-down-' + commentId);
      if (upEl) upEl.textContent = res.upvotes || 0;
      if (downEl) downEl.textContent = res.downvotes || 0;
      var upBtn = document.getElementById('acvote-up-btn-' + commentId);
      var downBtn = document.getElementById('acvote-down-btn-' + commentId);
      if (upBtn) upBtn.style.cssText = upBtn.style.cssText.replace(/color:[^;]+/, albumMyVotes[commentId] === 1 ? 'color:var(--brand)' : 'color:var(--text-3)');
      if (downBtn) downBtn.style.cssText = downBtn.style.cssText.replace(/color:[^;]+/, albumMyVotes[commentId] === -1 ? 'color:var(--red)' : 'color:var(--text-3)');
    } catch(err) {}
  }

  async function deleteAlbumComment(commentId) {
    if (!confirm('Delete this comment?')) return;
    try {
      await api('/albums/' + albumId + '/comments/' + commentId, { method: 'DELETE' });
      // Remove the comment row and any reply rows beneath it
      var el = document.getElementById('albumcomment-' + commentId);
      if (el) el.remove();
    } catch(err) { alert(err.message || 'Failed to delete'); }
  }

  loadAlbum();
</script>
</body>
</html>
