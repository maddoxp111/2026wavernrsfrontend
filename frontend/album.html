<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — comp</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/discover.html">Discover</a>
    <a href="/charts.html">Charts</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();navSearch(q);}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="view">
<div class="container" style="max-width:760px;">
  <div id="album-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>
</div><!-- /view -->

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg></span>
    <span>Discover</span>
  </a>
  <a href="/charts.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></span>
    <span>Charts</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
    <span>Dashboard</span>
  </a>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script src="/js/playlists.js"></script>
<script>
  updateNav();
  initPlayer();

  var albumId = new URLSearchParams(location.search).get('id');
  if (!albumId) navigate('/index.html');

  var album = null;
  var albumTracks = [];
  var currentTrackIndex = -1;

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadAlbum() {
    try {
      album = await api(`/albums/${albumId}`);
      albumTracks = (album.album_tracks || []).sort((a, b) => a.position - b.position);
      document.title = `${album.title} — wavernrs stream`;
      renderAlbum();
    } catch (err) {
      document.getElementById('album-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">Comp not found</div><a href="/index.html" class="btn btn-primary" style="margin-top:16px">Go home</a></div>`;
    }
  }

  function renderAlbum() {
    const artist = album.artists || {};
    const eraName = album.era_tag?.name || album.genre || '';
    const cover = album.cover_url
      ? `<img src="${album.cover_url}" alt="cover" style="width:100%;height:100%;object-fit:cover;">`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px;">💿</div>`;

    document.getElementById('album-container').innerHTML = `
      <div style="padding:32px 0;">
        <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;">
          <div style="width:200px;height:200px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1a0a2e,#2d1b6e);flex-shrink:0;">
            ${cover}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);margin-bottom:6px;">Comp</div>
            <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;">${escHtml(album.title)}</div>
            <a href="/artist.html?id=${artist.id}" style="font-size:15px;color:var(--text-secondary);font-weight:500;">${escHtml(artist.display_name || 'Unknown')}</a>
            ${eraName ? `<div style="margin-top:10px;"><span class="badge">${escHtml(eraName)}</span></div>` : ''}
            ${album.description ? `<p style="margin-top:10px;font-size:14px;color:var(--text-secondary);line-height:1.6;">${escHtml(album.description)}</p>` : ''}
            <div style="margin-top:10px;font-size:13px;color:var(--text-tertiary);">${albumTracks.length} edit${albumTracks.length !== 1 ? 's' : ''}</div>
            <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="playAll()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Play All
              </button>
              <a href="${API_BASE}/albums/${albumId}/download" class="btn btn-secondary" id="download-comp-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 8h14v2H5z"/></svg>
                Download Zip
              </a>
            </div>
          </div>
        </div>

        <div style="margin-top:32px;">
          <h2 class="section-title">Tracklist</h2>
          <div class="track-list" id="tracklist">
            ${albumTracks.length === 0 ? `<div class="empty-state" style="padding:24px;"><div class="empty-desc">No edits in this comp yet.</div></div>` :
              albumTracks.map((t, i) => {
                const trackData = t.tracks || t;
                const cover = trackData.cover_url ? `<img src="${trackData.cover_url}" alt="">` : '🎵';
                return `
                  <div class="track-row" onclick="playAtIndex(${i})">
                    <div class="track-row-num">${i + 1}</div>
                    <div class="track-row-cover">${cover}</div>
                    <div class="track-row-info">
                      <div class="track-row-title">${escHtml(trackData.title || 'Unknown')}</div>
                      <div class="track-row-artist">${escHtml(trackData.artists?.display_name || artist.display_name || 'Unknown')}</div>
                    </div>
                    <span class="track-row-plays">${fmtNum(trackData.play_count)} plays</span>
                    <button onclick="event.stopPropagation();openAddToPlaylist({id:'${trackData.id}',title:${JSON.stringify(trackData.title || '')},cover_url:${JSON.stringify(trackData.cover_url || '')},ia_url:${JSON.stringify(trackData.ia_url || '')},artist_name:${JSON.stringify(trackData.artists?.display_name || artist.display_name || '')}})"
                      style="background:none;border:none;cursor:pointer;padding:4px 6px;font-size:16px;color:var(--text-secondary);flex-shrink:0;" title="Save to playlist">＋</button>
                    <a href="/track.html?id=${trackData.id}" onclick="event.stopPropagation()" style="font-size:12px;color:var(--text-tertiary);padding:4px 8px;">Open</a>
                  </div>`;
              }).join('')}
          </div>
        </div>
      </div>`;
  }

  function playAll() {
    if (!albumTracks.length) return;
    playAtIndex(0);
  }

  function playAtIndex(index) {
    const item = albumTracks[index];
    if (!item) return;
    const trackData = item.tracks || item;
    currentTrackIndex = index;
    playTrack({
      ...trackData,
      artist_name: trackData.artists?.display_name || album.artists?.display_name,
    });
    // Highlight active row
    document.querySelectorAll('#tracklist .track-row').forEach((row, i) => {
      row.style.background = i === index ? 'var(--purple-bg)' : '';
    });
  }

  // Auto-advance when track ends (register cleanup so it doesn't fire on other pages)
  var _onTrackEnded = () => {
    if (currentTrackIndex >= 0 && currentTrackIndex < albumTracks.length - 1) {
      playAtIndex(currentTrackIndex + 1);
    } else {
      currentTrackIndex = -1;
    }
  };
  document.addEventListener('trackEnded', _onTrackEnded);
  window._pageCleanup.push(() => document.removeEventListener('trackEnded', _onTrackEnded));

  loadAlbum();
</script>
</body>
</html>
