<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — comp</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="view">
<div class="container" style="max-width:760px;">
  <div id="album-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>
</div><!-- /view -->

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script src="/js/playlists.js"></script>
<script>
  initPlayer();
  pausePlayer(); // stop whatever was playing before arriving on this page

  var albumId = new URLSearchParams(location.search).get('id');
  if (!albumId) navigate('/index.html');

  var album = null;
  var albumTracks = [];
  var currentTrackIndex = -1;

  async function loadAlbum() {
    try {
      album = await api(`/albums/${albumId}`);
      albumTracks = (album.album_tracks || []).sort((a, b) => a.position - b.position);
      document.title = `${album.title} — wavernrs stream`;
      renderAlbum();
      loadMoreLikeThis();
    } catch (err) {
      document.getElementById('album-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">Comp not found</div><a href="/index.html" class="btn btn-primary" style="margin-top:16px">Go home</a></div>`;
    }
  }

  function renderAlbum() {
    const artist = album.artists || {};
    const eraName = album.era_tag?.name || album.genre || '';
    const coverBg = (typeof coverGradient === 'function') ? coverGradient(album.title || '') : 'linear-gradient(135deg,#1a0a2e,#2d1b6e)';
    const coverInner = album.cover_url
      ? `<img src="${album.cover_url}" alt="cover" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;object-fit:cover;">`
      : '';

    // Update page background gradient from actual cover image colors
    if (typeof extractCoverHues === 'function') {
      extractCoverHues(album.cover_url, album.title || '', function(c) {
        var bg = document.getElementById('wv-page-bg');
        if (!bg) return;
        var isDark = document.getElementById('wv-root') && document.getElementById('wv-root').classList.contains('theme-dark');
        bg.style.background =
          'radial-gradient(ellipse 130% 90% at -5% 0%, hsla(' + c.h1 + ',85%,' + (isDark ? 36 : 54) + '%,0.90) 0%, transparent 52%),' +
          'radial-gradient(ellipse 110% 130% at 105% 100%, hsla(' + c.h2 + ',80%,' + (isDark ? 30 : 48) + '%,0.80) 0%, transparent 58%),' +
          'radial-gradient(ellipse 70% 60% at 50% 50%, hsla(' + c.h1 + ',70%,' + (isDark ? 25 : 60) + '%,0.35) 0%, transparent 70%),' +
          'var(--page-bg)';
      });
    }

    document.getElementById('album-container').innerHTML = `
      <div style="padding:28px 0;">
        <div style="display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin-bottom:32px;">
          <div style="width:200px;height:200px;border-radius:18px;overflow:hidden;background:${coverBg};position:relative;flex-shrink:0;box-shadow:0 8px 32px rgba(0,0,0,0.25);">
            <div aria-hidden style="position:absolute;inset:0;background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,0.22) 0%,transparent 45%),radial-gradient(80% 80% at 80% 90%,rgba(0,0,0,0.28) 0%,transparent 60%);z-index:1;"></div>
            ${coverInner}
            <div style="position:absolute;top:10px;left:10px;padding:2px 8px;background:rgba(255,255,255,0.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,0.96);font-size:9px;font-weight:700;letter-spacing:0.06em;border-radius:4px;text-transform:uppercase;z-index:2;">comp</div>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:6px;">Compilation</div>
            <div style="font-size:32px;font-weight:800;letter-spacing:-0.04em;line-height:1.05;margin-bottom:6px;">${escHtml(album.title)}</div>
            <a href="/artist.html?id=${artist.id}" style="font-size:16px;color:var(--text-2);font-weight:500;">${escHtml(artist.display_name || 'Unknown')}</a>
            ${eraName ? `<div style="margin-top:10px;"><span class="badge">${escHtml(eraName)}</span></div>` : ''}
            ${album.description ? `<p style="margin-top:10px;font-size:14px;color:var(--text-2);line-height:1.6;">${escHtml(album.description)}</p>` : ''}
            <div style="margin-top:8px;font-size:13px;color:var(--text-3);">${albumTracks.length} edit${albumTracks.length !== 1 ? 's' : ''}</div>
            <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="playAll()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Play All
              </button>
              <a href="${API_BASE}/albums/${albumId}/download" class="btn btn-secondary" id="download-comp-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                Download Zip
              </a>
            </div>
          </div>
        </div>

        <h2 class="section-title">Tracklist</h2>
        <div class="track-list" id="tracklist">
          ${albumTracks.length === 0 ? `<div class="empty-state"><div class="empty-icon">🎵</div><div class="empty-title">No edits yet</div></div>` :
            albumTracks.map((t, i) => {
              const td = t.tracks || t;
              const tdCoverBg = (typeof coverGradient === 'function') ? coverGradient(td.title || '') : '#333';
              const tdCoverStyle = `width:40px;height:40px;border-radius:8px;flex-shrink:0;background:${tdCoverBg};position:relative;overflow:hidden;`;
              const tdCoverImg = td.cover_url ? `<img src="${td.cover_url}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-fit:cover;">` : '';
              return `
                <div class="track-row" id="trow-${i}" onclick="playAtIndex(${i})">
                  <div class="track-row-num">${i + 1}</div>
                  <div style="${tdCoverStyle}">${tdCoverImg}</div>
                  <div class="track-row-info">
                    <div class="track-row-title">${escHtml(td.title || 'Unknown')}</div>
                    <div class="track-row-artist">${escHtml(td.artists?.display_name || artist.display_name || 'Unknown')}</div>
                  </div>
                  <span class="track-row-plays">${fmtNum(td.play_count)} plays</span>
                  <button onclick="event.stopPropagation();openAddToPlaylist({id:'${td.id}',title:${JSON.stringify(td.title||'')},cover_url:${JSON.stringify(td.cover_url||'')},ia_url:${JSON.stringify(td.ia_url||'')},artist_name:${JSON.stringify(td.artists?.display_name||artist.display_name||'')}})"
                    style="background:none;border:none;cursor:pointer;padding:4px 8px;font-size:18px;color:var(--text-3);flex-shrink:0;line-height:1;" title="Save to playlist">＋</button>
                  <a href="/track.html?id=${td.id}" onclick="event.stopPropagation()" style="font-size:12px;color:var(--text-3);padding:4px 8px;white-space:nowrap;">Open</a>
                </div>`;
            }).join('')}
        </div>

        <div id="more-like-this" style="margin-top:48px;padding-bottom:40px;"></div>
      </div>`;
  }

  function playAll() {
    if (!albumTracks.length) return;
    playAtIndex(0);
  }

  function playAtIndex(index) {
    const item = albumTracks[index];
    if (!item) return;
    const trackData = item.tracks || item;
    currentTrackIndex = index;
    playTrack({
      ...trackData,
      artist_name: trackData.artists?.display_name || album.artists?.display_name,
    });
    // Highlight active row
    document.querySelectorAll('#tracklist .track-row').forEach((row, i) => {
      row.classList.toggle('playing', i === index);
    });
  }

  // Auto-advance when track ends (register cleanup so it doesn't fire on other pages)
  var _onTrackEnded = () => {
    if (currentTrackIndex >= 0 && currentTrackIndex < albumTracks.length - 1) {
      playAtIndex(currentTrackIndex + 1);
    } else {
      currentTrackIndex = -1;
    }
  };
  document.addEventListener('trackEnded', _onTrackEnded);
  window._pageCleanup.push(() => document.removeEventListener('trackEnded', _onTrackEnded));

  async function loadMoreLikeThis() {
    var el = document.getElementById('more-like-this');
    if (!el || !album) return;
    try {
      var artist = album.artists || {};
      var artistId = artist.id;
      var eraTagId = album.era_tag ? album.era_tag.id : album.era_tag_id;

      var results = await Promise.all([
        artistId ? api('/albums/by-artist/' + artistId).catch(function() { return []; }) : Promise.resolve([]),
        artistId ? api('/artists/' + artistId + '/tracks').catch(function() { return []; }) : Promise.resolve([]),
        eraTagId ? api('/discover/era/' + eraTagId).catch(function() { return []; }) : Promise.resolve([]),
      ]);
      var artistAlbums = results[0];
      var artistTracks = results[1];
      var eraItems = results[2];

      var byArtist = [].concat(
        artistAlbums.filter(function(a) { return a.id !== album.id; }).slice(0, 2).map(function(a) { return Object.assign({}, a, {_type:'album'}); }),
        artistTracks.slice(0, 2).map(function(t) { return Object.assign({}, t, {_type:'track'}); })
      ).slice(0, 4);

      var byEra = eraTagId
        ? eraItems.filter(function(t) { return t.id !== album.id && !byArtist.find(function(x) { return x.id === t.id; }); })
            .slice(0, 4).map(function(t) { return Object.assign({}, t, {_type:'track'}); })
        : [];

      var html = '';
      if (byArtist.length) {
        html += '<h2 class="section-title" style="margin-top:0;">More by ' + escHtml(artist.display_name || 'this artist') + '</h2>';
        html += '<div class="wv-comp-grid wv-comp-grid-4">' + byArtist.map(function(item) { return renderMoreCard(item); }).join('') + '</div>';
      }
      if (byEra.length) {
        var eraName = album.era_tag ? album.era_tag.name : '';
        html += '<h2 class="section-title" style="margin-top:32px;">More' + (eraName ? ' from ' + escHtml(eraName) : ' like this') + '</h2>';
        html += '<div class="wv-comp-grid wv-comp-grid-4">' + byEra.map(function(item) { return renderMoreCard(item); }).join('') + '</div>';
      }
      el.innerHTML = html;
    } catch (_) {}
  }

  function renderMoreCard(item) {
    var isAlbum = item._type === 'album';
    var bg = (typeof coverGradient === 'function') ? coverGradient(item.title || '') : '#333';
    var coverImg = item.cover_url
      ? '<img src="' + escHtml(item.cover_url) + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.remove()">'
      : '';
    var clickAction = isAlbum
      ? "navigate('/album.html?id=" + item.id + "')"
      : "navigate('/track.html?id=" + item.id + "')";
    var artistName = item.artists ? (item.artists.display_name || '') : '';
    return '<div class="wv-comp-card" onclick="' + clickAction + '">' +
      '<div class="wv-comp-card-cover">' +
        '<div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
          '<div aria-hidden style="position:absolute;inset:0;background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0) 45%),radial-gradient(80% 80% at 80% 90%,rgba(0,0,0,0.28) 0%,rgba(0,0,0,0) 60%);pointer-events:none;border-radius:14px;"></div>' +
          (isAlbum ? '<div style="position:absolute;top:8px;left:8px;padding:2px 8px;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,0.96);font-size:9px;font-weight:700;letter-spacing:0.06em;border-radius:4px;text-transform:uppercase;">comp</div>' : '') +
          coverImg +
          (!isAlbum ? '<button class="wv-cover-play-btn" onclick="event.stopPropagation();navigate(\'/track.html?id=' + item.id + '\')">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
          '</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="wv-comp-card-title">' + escHtml(item.title || 'Untitled') + '</div>' +
      '<div class="wv-comp-card-artist">' + escHtml(artistName) + '</div>' +
    '</div>';
  }

  loadAlbum();
</script>
</body>
</html>
