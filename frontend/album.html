<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — comp</title>
  <link rel="stylesheet" href="/css/style.css?v=dcfb38c6c547">
  <script src="/js/status-card.js?v=dcfb38c6c547"></script>
  <script src="/js/down.js?v=dcfb38c6c547"></script>
  <style>
    /* ── comp page: skeleton ─────────────────────────────── */
    .alb-sk { padding: 28px 0; }
    .alb-sk-hero { display: flex; gap: 24px; align-items: flex-end; padding: 4px 0 20px; }
    .alb-sk-b, .alb-sk-art { background: var(--surface-2); border-radius: 8px; position: relative; overflow: hidden; }
    .alb-sk-art { width: 176px; height: 176px; flex-shrink: 0; border-radius: var(--r-md, 6px); }
    .alb-sk-b::after, .alb-sk-art::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 7%, transparent), transparent); animation: albSk 1.3s ease-in-out infinite; }
    @keyframes albSk { to { transform: translateX(100%); } }
    .alb-sk-body { flex: 1; min-width: 0; display: grid; gap: 10px; padding-bottom: 4px; }
    .alb-sk-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
    @media (max-width: 640px) { .alb-sk-hero { flex-direction: column; align-items: center; } .alb-sk-art { width: min(72vw, 260px); height: min(72vw, 260px); } .alb-sk-body { width: 100%; justify-items: center; } }

    /* ── tracklist rows ──────────────────────────────────── */
    #tracklist .track-row { position: relative; outline: none; }
    #tracklist .track-row:focus-visible { box-shadow: inset 0 0 0 2px var(--brand); }
    #tracklist .track-row.alb-flash { animation: albFlash 1.6s ease-out; }
    @keyframes albFlash { 0%, 30% { background: var(--brand-bg); } 100% { background: transparent; } }
    .alb-num { position: relative; width: 24px; height: 20px; display: grid; place-items: center end; font-variant-numeric: tabular-nums; }
    .alb-num > * { grid-area: 1 / 1; }
    .alb-num .alb-pl { width: 14px; height: 14px; color: var(--text); opacity: 0; justify-self: end; }
    .alb-eq { display: none; align-items: flex-end; gap: 2px; height: 14px; justify-self: end; }
    .alb-eq i { display: block; width: 3px; height: 100%; border-radius: 1px; background: var(--brand); transform-origin: bottom; animation: albEq 1s ease-in-out infinite; }
    .alb-eq i:nth-child(2) { animation-duration: .8s; animation-delay: -.35s; }
    .alb-eq i:nth-child(3) { animation-duration: 1.15s; animation-delay: -.6s; }
    @keyframes albEq { 0%, 100% { transform: scaleY(.3); } 30% { transform: scaleY(1); } 60% { transform: scaleY(.55); } }
    .track-row.playing .alb-eq { display: flex; }
    .track-row.playing .alb-n { visibility: hidden; }
    .track-row.playing.is-paused .alb-eq i { animation-play-state: paused; }
    @media (hover: hover) {
      #tracklist .track-row:not(.is-locked):hover .alb-n,
      #tracklist .track-row:not(.is-locked):hover .alb-eq { visibility: hidden; }
      #tracklist .track-row:not(.is-locked):hover .alb-pl { opacity: 1; }
      #tracklist .track-row.playing:not(.is-paused):hover .alb-pl { opacity: 0; }
      #tracklist .track-row.playing:not(.is-paused):hover .alb-pz { opacity: 1; }
    }
    .alb-num .alb-pz { width: 14px; height: 14px; color: var(--text); opacity: 0; justify-self: end; }
    #tracklist .track-row:focus-visible .alb-n { visibility: hidden; }
    #tracklist .track-row:focus-visible .alb-pl { opacity: 1; }
    #tracklist .track-row .alb-cv .alb-eq-cv { display: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; align-items: center; justify-content: center; gap: 2px; background: rgba(0,0,0,.5); z-index: 1; }
    .alb-cv .alb-eq-cv i { height: 14px; background: #fff; }
    .track-row.playing .track-row-title { color: var(--brand); }
    .alb-dur { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 34px; text-align: right; }
    .alb-dur:empty { visibility: hidden; }
    .alb-ib { width: 36px; height: 36px; flex-shrink: 0; display: inline-grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--text-3); cursor: pointer; font: inherit; padding: 0; transition: background .12s, color .12s, opacity .12s; }
    .alb-ib:hover { background: var(--glass-pill-bg); color: var(--text); }
    .alb-ib:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; color: var(--text); }
    .alb-ib svg { width: 18px; height: 18px; }
    .alb-open { font-size: 12px; color: var(--text-3); padding: 4px 8px; white-space: nowrap; text-decoration: none; border-radius: 6px; }
    .alb-open:hover { color: var(--text); }
    @media (hover: hover) and (min-width: 769px) {
      #tracklist .track-row .alb-save, #tracklist .track-row .alb-more, #tracklist .track-row .alb-open { opacity: 0; }
      #tracklist .track-row:hover .alb-save, #tracklist .track-row:hover .alb-more, #tracklist .track-row:hover .alb-open,
      #tracklist .track-row:focus-within .alb-save, #tracklist .track-row:focus-within .alb-more, #tracklist .track-row:focus-within .alb-open,
      #tracklist .track-row .alb-more[aria-expanded="true"] { opacity: 1; }
    }
    @media (max-width: 768px) {
      .alb-save, .alb-open { display: none !important; }
      #tracklist .track-row.playing .alb-cv .alb-eq-cv { display: flex; }
      #tracklist .alb-num { display: none; }
      #tracklist .track-row { gap: 10px; padding-right: 0; }
      .alb-ib.alb-more { width: 40px; height: 44px; margin-left: -4px; }
      #tracklist .track-row-plays { display: none; }
    }

    /* ── hero runtime + deep link ─────────────────────────── */
    .alb-rt { white-space: nowrap; }
    .wv-btn-play .alb-pi { width: 12px; height: 12px; }
    #alb-play { min-width: 118px; justify-content: center; }
    #like-btn.wv-icon-btn { width: auto; min-width: 36px; height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ── sticky compact header ────────────────────────────── */
    .alb-stk-wrap { position: sticky; top: 0; height: 0; z-index: 40; }
    .alb-stk { position: absolute; left: -12px; right: -12px; top: 0; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 0 0 16px 16px;
      background: color-mix(in srgb, var(--page-bg, var(--bg)) 78%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
      border: 1px solid var(--hair); border-top: 0; box-shadow: 0 10px 30px rgba(0,0,0,.18);
      transform: translateY(-110%); opacity: 0; pointer-events: none; transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
    .alb-stk.show { transform: none; opacity: 1; pointer-events: auto; }
    .alb-stk-play { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--brand); color: var(--on-brand, #14121c); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: transform .12s, filter .12s; }
    .alb-stk-play:hover { filter: brightness(1.1); transform: scale(1.04); }
    .alb-stk-play:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .alb-stk-play svg { width: 16px; height: 16px; }
    .alb-stk-cv { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; flex-shrink: 0; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .alb-stk-cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .alb-stk-tx { min-width: 0; flex: 1; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; }
    .alb-stk-t { font-size: 15px; font-weight: 750; letter-spacing: -.01em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alb-stk-s { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alb-stk-s .on { color: var(--brand); font-weight: 600; }
    @media (max-width: 768px) { .alb-stk { left: -16px; right: -16px; border-radius: 0 0 14px 14px; border-left: 0; border-right: 0; padding: 8px 16px; } }

    /* ── row menu ─────────────────────────────────────────── */
    .alb-menu-ov { position: fixed; inset: 0; z-index: 9400; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .18s ease; }
    .alb-menu-ov.in { opacity: 1; }
    .alb-menu { position: fixed; z-index: 9401; min-width: 232px; max-width: calc(100vw - 24px); padding: 6px; border-radius: 14px; background: var(--elevated, var(--surface)); color: var(--text);
      border: 1px solid var(--hair-strong, var(--border)); box-shadow: 0 18px 50px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.2);
      opacity: 0; transform: scale(.97); transform-origin: top right; transition: opacity .14s ease, transform .16s cubic-bezier(.2,.9,.3,1.2); }
    .alb-menu.in { opacity: 1; transform: none; }
    .alb-menu-hd { display: none; }
    .alb-menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--text); font: inherit; font-size: 14px; font-weight: 550; text-align: left; cursor: pointer; }
    .alb-menu button svg { width: 18px; height: 18px; color: var(--text-2); flex-shrink: 0; }
    .alb-menu button:hover, .alb-menu button:focus-visible { background: var(--surface-hover, var(--surface-2)); outline: none; }
    .alb-menu hr { border: 0; border-top: 1px solid var(--hair); margin: 5px 6px; }
    @media (max-width: 768px) {
      .alb-menu { left: 8px !important; right: 8px !important; top: auto !important; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: none; min-width: 0; padding: 8px; border-radius: 20px; transform: translateY(24px); transform-origin: bottom center; }
      .alb-menu.in { transform: none; }
      .alb-menu-hd { display: flex; align-items: center; gap: 12px; padding: 6px 8px 12px; margin-bottom: 4px; border-bottom: 1px solid var(--hair); }
      .alb-menu-hd .cv { width: 48px; height: 48px; border-radius: 9px; overflow: hidden; position: relative; flex-shrink: 0; }
      .alb-menu-hd .cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .alb-menu-hd .t { font-weight: 750; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .alb-menu-hd .s { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .alb-menu button { min-height: 48px; font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .alb-eq i, .alb-sk-b::after, .alb-sk-art::after, #tracklist .track-row.alb-flash { animation: none !important; }
      .alb-eq i { transform: scaleY(.6); }
      .alb-stk, .alb-menu, .alb-menu-ov { transition: none !important; }
    }
  </style>
</head>
<body>

<div id="view">
<div class="container" style="max-width:1100px;">
  <div id="album-container">
    <div class="alb-sk" aria-busy="true" aria-label="loading comp">
      <div class="alb-sk-hero"><div class="alb-sk-art"></div><div class="alb-sk-body"><div class="alb-sk-b" style="width:90px;height:10px;"></div><div class="alb-sk-b" style="width:min(420px,80%);height:30px;"></div><div class="alb-sk-b" style="width:160px;height:13px;"></div><div class="alb-sk-b" style="width:220px;height:11px;"></div><div style="display:flex;gap:9px;margin-top:6px;"><div class="alb-sk-b" style="width:92px;height:38px;border-radius:99px;"></div><div class="alb-sk-b" style="width:104px;height:38px;border-radius:99px;"></div></div></div></div>
      <div class="alb-sk-b" style="width:110px;height:18px;margin:14px 0 10px;"></div>
      <div class="alb-sk-row"><div class="alb-sk-b" style="width:40px;height:40px;flex-shrink:0;"></div><div style="flex:1;display:grid;gap:7px;"><div class="alb-sk-b" style="width:46%;height:12px;"></div><div class="alb-sk-b" style="width:22%;height:10px;"></div></div></div><div class="alb-sk-row"><div class="alb-sk-b" style="width:40px;height:40px;flex-shrink:0;"></div><div style="flex:1;display:grid;gap:7px;"><div class="alb-sk-b" style="width:58%;height:12px;"></div><div class="alb-sk-b" style="width:30%;height:10px;"></div></div></div><div class="alb-sk-row"><div class="alb-sk-b" style="width:40px;height:40px;flex-shrink:0;"></div><div style="flex:1;display:grid;gap:7px;"><div class="alb-sk-b" style="width:38%;height:12px;"></div><div class="alb-sk-b" style="width:18%;height:10px;"></div></div></div><div class="alb-sk-row"><div class="alb-sk-b" style="width:40px;height:40px;flex-shrink:0;"></div><div style="flex:1;display:grid;gap:7px;"><div class="alb-sk-b" style="width:52%;height:12px;"></div><div class="alb-sk-b" style="width:26%;height:10px;"></div></div></div><div class="alb-sk-row"><div class="alb-sk-b" style="width:40px;height:40px;flex-shrink:0;"></div><div style="flex:1;display:grid;gap:7px;"><div class="alb-sk-b" style="width:44%;height:12px;"></div><div class="alb-sk-b" style="width:20%;height:10px;"></div></div></div><div class="alb-sk-row"><div class="alb-sk-b" style="width:40px;height:40px;flex-shrink:0;"></div><div style="flex:1;display:grid;gap:7px;"><div class="alb-sk-b" style="width:60%;height:12px;"></div><div class="alb-sk-b" style="width:28%;height:10px;"></div></div></div>
    </div>
  </div>
</div>

<script src="/js/api.js?v=dcfb38c6c547"></script>
<script src="/js/layout.js?v=dcfb38c6c547"></script>
<script src="/js/player.js?v=dcfb38c6c547"></script>
<script src="/js/router.js?v=dcfb38c6c547"></script>
<script src="/js/playlists.js?v=dcfb38c6c547"></script>
<script src="/js/ratings.js?v=dcfb38c6c547"></script>
<script>
  // The comp's own date: for uploads the upload date; for archive comps the
  // date the source gave (Reddit post, last edit on untitled/Samply, file
  // time on MEGA, Discord message), or N/A when the source had none.
  function compDateLabel(album) {
    var d = album.original_date || (album.is_archive ? null : album.created_at);
    if (!d) return 'N/A';
    var dt = new Date(d); if (isNaN(dt)) return 'N/A';
    return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  initPlayer();

  var albumId = new URLSearchParams(location.search).get('id');
  // Without an id there is nothing to load; go home instead of asking the
  // server for a record that cannot exist.
  var _missingId = !albumId;
  if (!albumId) navigate('/index');

  var album = null;
  var albumTracks = [];
  var _credits = {};
  var currentTrackIndex = -1;

  async function loadAlbum() {
    // Only a failed fetch should show "not found". Everything after is
    // best-effort so a hiccup in a secondary call can't blank the page.
    try {
      album = await api(`/albums/${albumId}`);
      if (album && album.id && album.id !== albumId) {
        albumId = album.id;
        try { history.replaceState(null, '', '/album?id=' + albumId + location.hash); } catch (_) {}
      }
    } catch (err) {
      document.getElementById('album-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">couldnt find this comp</div><a href="/index" class="btn btn-primary" style="margin-top:16px">Go home</a></div>`;
      return;
    }
    try {
      albumTracks = (album.album_tracks || []).sort((a, b) => a.position - b.position);
      _credits = (typeof wvAlbumCredits === 'function' && wvAlbumCredits(album)) || {};
      document.title = `${album.title} — wavernrs stream`;
      await renderAlbum();
      if (new URLSearchParams(location.search).get('play') === '1' && albumTracks.length) { try { playAll(); } catch (_) {} }
      else { try { albumDeepLink(); } catch (_) {} }
    loadAlbumComments();
      loadMoreLikeThis();
      loadVsOfficial();
      if (typeof loadRatings === 'function') loadRatings('album', album.id);
      loadTrackerPills(album.id);
      if (typeof wvClampDesc === 'function') wvClampDesc(document.querySelector('.wv-hero-desc'));
      startCountdown();
      loadAwardPills(album.id);
      showDisown(album);
      showAddCover(album);
    } catch (err) {
      console.error('album render error', err);
    }
  }

  async function renderAlbum() {
    const artist = album.artists || {};
    const _me = (typeof getUser === 'function' && getUser()) || null;
    const _isOwner = !!(_me && artist.user_id && _me.id === artist.user_id && !album.is_archive);
    const _releaseAt = album.release_at ? new Date(album.release_at) : null;
    const _isDraft = album.release_status === 'draft';
    const _isUpcoming = album.release_status === 'upcoming' && _releaseAt && _releaseAt > new Date();
    const _lockedForMe = _isUpcoming && albumTracks.length > 0 && albumTracks.every(function (t) { return !(t.tracks || t).ia_url; });
    const _playable = albumTracks.length > 0 && !_lockedForMe;
    window._albumLocked = _lockedForMe;
    const _outLabel = _releaseAt ? _releaseAt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: _releaseAt.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }) + ' at ' + _releaseAt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '';
    const _sides = (Array.isArray(album.sides) ? album.sides : []).filter(function (sd, k, all) { return sd.start < albumTracks.length && !all.slice(k + 1).some(function (o) { return o.start === sd.start; }); });
    const _collabs = Array.isArray(album.collaborators) ? album.collaborators : [];
    const _collabHtml = _collabs.length ? ' <span style="color:var(--text-3);font-weight:400;">with</span> ' + _collabs.map(function (c) { return '<a href="/artist?id=' + encodeURIComponent(c.artist_id) + '">' + escHtml(c.name) + '</a>'; }).join(', ').replace(/, ([^,]*)$/, ' & $1') : '';
    const eraName = album.era_tag?.name || album.genre || '';
    const badges = await getBadgeData().catch(() => ({ verified_artists: [], highlighted_albums: [], exclusive_albums: [] }));
    const isHighlighted = badges.highlighted_albums && badges.highlighted_albums.indexOf(album.id) !== -1;
    window._albHl = !!isHighlighted;
    const isExclusive   = badges.exclusive_albums   && badges.exclusive_albums.indexOf(album.id) !== -1;
    const isVerified    = artist.id && badges.verified_artists && badges.verified_artists.indexOf(artist.id) !== -1;
    const isOnyxWeek = badges.onyx_week_albums && badges.onyx_week_albums.indexOf(album.id) !== -1;
    const isOnyxHl   = badges.onyx_highlight_albums && badges.onyx_highlight_albums.indexOf(album.id) !== -1;
    const isYeditsEotw = badges.yedits_eotw_albums && badges.yedits_eotw_albums.indexOf(album.id) !== -1;
    const isLowQualityCover = badges.low_quality_covers && badges.low_quality_covers.indexOf(album.id) !== -1;
    const badgePills = (isExclusive   ? '<span class="wv-badge-pill wv-badge-exclusive" style="margin-right:4px;">◆ wavernrs exclusive</span>' : '') +
                       (isHighlighted ? '<span class="wv-badge-pill wv-badge-highlight" id="alb-hl-pill" style="margin-right:4px;">★ Highlighted by wavernrs</span>' : '') +
                       (isOnyxWeek    ? '<span class="wv-badge-pill wv-badge-highlight" style="margin-right:4px;">🏆 Onyx Yedit of the Week</span>' : '') +
                       (isOnyxHl      ? '<span class="wv-badge-pill wv-badge-highlight" style="margin-right:4px;">★ Onyx Highlighted Yedit</span>' : '') +
                       (isYeditsEotw  ? '<span class="wv-badge-pill wv-badge-highlight" style="margin-right:4px;">🏆 Yedits Discord Edit of the Week</span>' : '');
    const verifiedBadge = isVerified ? '<span class="wv-verified-icon" title="verified artist">✓</span>' : '';

    // Pre-render 5 empty stars so the widget is immediately visible.
    // loadRatings() will overwrite this with real data once the API responds.
    const starEmpty = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.6"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
    const starPlaceholder = [1,2,3,4,5].map(i =>
      `<button type="button" data-s="${i}" style="background:none;border:none;cursor:pointer;padding:2px;line-height:0;">${starEmpty}</button>`
    ).join('');
    const ratingPlaceholder = `<div style="display:flex;align-items:center;gap:6px;"><div id="wv-rating-stars" style="display:flex;align-items:center;">${starPlaceholder}</div><span style="font-size:13px;color:var(--text-3);">no ratings yet</span></div>`;

    // Freshly created comps (e.g. just imported) live on Internet Archive,
    // which takes a few minutes to process the item before tracks will play.
    // Show a heads-up banner for the first ~15 minutes after creation.
    let freshBanner = '';
    if (album.created_at && !_isUpcoming && !_isDraft && albumTracks.length) {
      const ageMs = Date.now() - new Date(album.created_at).getTime();
      if (ageMs >= 0 && ageMs < 15 * 60 * 1000) {
        freshBanner = `
          <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 16px;margin-bottom:20px;border-radius:12px;background:var(--purple-bg,rgba(139,92,246,0.12));border:1px solid var(--purple-light,rgba(139,92,246,0.35));">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0;margin-top:1px;color:var(--purple);"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div style="font-size:13px;line-height:1.5;color:var(--text-2);">
              <b style="color:var(--text-1);">just uploaded...give it a few minutes.</b>
              the tracks are still processing so they might not play yet. refresh in a bit if they dont start
            </div>

  var albumLiked = false;

  var _albumLikeCount = 0;
  async function toggleLike() {
    if (!isLoggedIn()) { navigate('/login'); return; }
    try {
      const res = await api(`/albums/${albumId}/like`, { method: 'POST' });
      albumLiked = res.liked;

  }

  // Staff can pull a missing cover from where the comp was imported from

  function renderStaffCoverButton() {
    var slot = document.getElementById('staff-cover-slot');
    if (!slot || slot.dataset.done) return;
    var a = album;
    var staff = false;
    try { staff = sessionStorage.getItem('wv_is_mod') === 'true' || sessionStorage.getItem('wv_is_archiver') === 'true'; } catch (_) {}
    if (!a || !a.is_archive || a.cover_url || !a.source_url || !staff) return;
    slot.dataset.done = '1';
    slot.innerHTML = '<button class="wv-btn-ghost" id="staff-cover-btn" onclick="fetchCoverFromSource()" title="staff only...looks for a cover where this comp was imported from">Get cover from source</button>';
  }

  // Staff can rebuild a comp that came in from a Discord thread, keeping only
  // the actual release: the first post's files, the owner's full upload, or
  // the download link they posted. It shows what it found before changing it.
  function renderStaffThreadButton() {
    renderStaffBar();
    var slot = document.getElementById('staff-bar-rebuild') || document.getElementById('staff-thread-slot');
    if (!slot || slot.dataset.done) return;
    var a = album;
    var staff = false;
    try { staff = sessionStorage.getItem('wv_is_mod') === 'true' || sessionStorage.getItem('wv_is_archiver') === 'true'; } catch (_) {}
    if (!a || !a.is_archive || !staff || !/^discord:\/\/thread\//.test(a.source_url || '')) return;
    slot.dataset.done = '1';
    slot.innerHTML = '<button class="wv-btn-ghost" id="staff-thread-btn" onclick="rebuildFromThread()" title="staff only...rebuilds this comp from its discord thread and only keeps the actual release">Rebuild from Discord</button>';
    watchRebuild(true);
  }

  // Shows a queued/running rebuild on the button, and keeps doing so after a refresh.
  var _rbTimer = null;
  async function watchRebuild(quiet) {
    if (_rbTimer) { clearTimeout(_rbTimer); _rbTimer = null; }
    var btn = document.getElementById('staff-thread-btn');
    if (!btn || !album) return;
    var st;
    try { st = await api('/import/rebuild-status/' + album.id); } catch (_) { return; }
    if (!st || !st.state) return;
    var fresh = st.finished_at && Date.now() - new Date(st.finished_at).getTime() < 10 * 60 * 1000;
    if (st.state === 'queued' || st.state === 'importing') {
      btn.disabled = true;
      btn.title = 'importing from ' + (st.url || 'the link');
      btn.textContent = st.state === 'importing'
        ? (st.total ? 'Importing ' + st.done + '/' + st.total + '…' : 'Importing…')
        : (st.position ? 'Queued (#' + st.position + ')…' : 'Queued…');
      _rbTimer = setTimeout(function () { watchRebuild(false); }, 4000);
      return;
    }
    btn.disabled = false; btn.textContent = 'Rebuild from Discord';
    if (st.state === 'done' && !quiet) { if (typeof wvToast === 'function') wvToast('rebuilt from the link'); setTimeout(function () { location.reload(); }, 800); }
    else if (st.state === 'failed' && (!quiet || fresh)) { if (typeof wvToast === 'function') wvToast('rebuild didnt work... ' + (st.error || 'import failed'), 'error'); }
  }

  // Lets staff choose which picture from the thread becomes the cover.
  function pickThreadCover(s, gptLine) {
    return new Promise(function (resolve) {
      var imgs = s.images || [];
      var wrap = document.createElement('div');
      wrap.className = 'wv-vp-wrap';
      var clears = s.had > 0;
      wrap.innerHTML = '<div class="wv-vp" style="max-width:640px;text-align:left;">' +
        '<div class="wv-vp-title">' + (clears ? 'No download link: make it Upcoming' : 'Pick the cover') + '</div>' +
        '<div class="wv-vp-body">' + (clears ? 'theres no download link in this thread so its ' + s.had + ' songs get cleared (they go to the recycle bin) and it stays Upcoming...likes and stars stay. ' : 'this comp has no songs yet. ') +
          (imgs.length ? 'pick the picture you want as the cover' : 'theres no pictures in the thread so the cover stays the same') +
          (gptLine ? '<div style="margin-top:6px;font-size:12px;color:var(--text-3);white-space:pre-wrap;">' + escHtml(gptLine.trim()) + '</div>' : '') + '</div>' +
        (imgs.length ? '<div class="wv-cover-pick">' + imgs.map(function (im, k) {
          return '<label class="wv-cover-opt"><input type="radio" name="wv-cover-opt" value="' + escHtml(im.id || '') + '"' + (k === 0 ? ' checked' : '') + '>' +
            '<img src="' + escHtml(im.url) + '" alt="" loading="lazy" onerror="this.parentNode.style.display=\'none\'">' +
            '<span>' + escHtml(im.from) + (im.author ? ' · ' + escHtml(im.author) : '') + '</span></label>';
        }).join('') + '</div>' : '') +
        '<div class="wv-vp-actions" style="margin-top:14px;"><button class="wv-pill" id="wv-cp-cancel">Cancel</button><button class="wv-pill brand" id="wv-cp-ok">' + (clears ? 'Clear songs and use this cover' : (imgs.length ? 'Use this cover' : 'OK')) + '</button></div>' +
      '</div>';

    var seenOff = Object.create(null), order = [];
    off.forEach(function (t) { var k = _vsNorm(t.title); if (!k) return; if (!seenOff[k]) { order.push(k); seenOff[k] = t; } else if (t.title.length < seenOff[k].title.length) seenOff[k] = t; });
    off = order.map(function (k) { return seenOff[k]; });
    var mine = albumTracks.map(function (t) { var td = t.tracks || t; return { title: td.title, ks: String(td.title || '').split(/\s+[_\/+]\s+|\s+x\s+(?=[A-Z])/).map(_vsNorm).filter(Boolean) }; }).filter(function (t) { return t.ks.length; });
    var mineK = Object.create(null); mine.forEach(function (t) { t.ks.forEach(function (k) { mineK[k] = 1; }); });
    var kept = off.filter(function (t) { return mineK[_vsNorm(t.title)]; });
    var missing = off.filter(function (t) { return !mineK[_vsNorm(t.title)]; });
    var extra = mine.filter(function (t) { return !t.ks.some(function (k) { return seenOff[k]; }); });
    var pct = Math.round(kept.length / off.length * 100);
    var li = function (t, cls) { return '<li class="' + cls + '">' + escHtml(t.title) + '</li>'; };
    var cover = typeof wvImg === 'function' ? wvImg(hit.cover_sm, 160) : hit.cover_sm;
    el.innerHTML = '<h2 class="section-title" style="margin-top:0;">vs the released album</h2>' +
      '<div class="vs-card"><div class="vs-top" onclick="navigate(\'/resources?view=disco&album=' + encodeURIComponent(hit.slug) + '\')">' +
        '<div class="vs-cv" style="background:' + coverGradient(hit.title) + ';"><img src="' + escHtml(cover) + '" alt="" onerror="this.remove()"></div>' +
        '<div style="min-width:0;flex:1;"><div class="vs-t">' + escHtml(hit.title) + ' <span>' + escHtml(hit.year) + '</span></div>' +
        '<div class="vs-s">this comp keeps <b>' + kept.length + '</b> of ' + off.length + ' songs' + (extra.length ? ' and adds <b>' + extra.length + '</b> that aren’t on it' : '') + '</div>' +
        '<div class="vs-meter"><i style="width:' + pct + '%"></i></div></div></div>' +
        '<div class="vs-cols">' +
          (kept.length ? '<div><h4>kept</h4><ul>' + kept.map(function (t) { return li(t, 'k'); }).join('') + '</ul></div>' : '') +
          (missing.length ? '<div><h4>left off</h4><ul>' + missing.map(function (t) { return li(t, 'm'); }).join('') + '</ul></div>' : '') +
          (extra.length ? '<div><h4>not on the album</h4><ul>' + extra.map(function (t) { return li(t, 'e'); }).join('') + '</ul></div>' : '') +
        '</div></div>';
  }

  async function loadMoreLikeThis() {
    var el = document.getElementById('more-like-this');
    if (!el || !album) return;

      var rel = await api('/albums/' + album.id + '/related');
      var html = '';

  // Versions of the same comp differ in ways that matter to this community —
  // which edits made the cut. This lines two tracklists up side by side.
  var _versions = [];
  var _cmpCache = {};

  function _cmpKey(t) {
    return String(t || '').toLowerCase()
      .replace(/\.(mp3|m4a|flac|wav|aiff?|ogg|opus)$/i, '')
      .replace(/^\s*\d{1,2}[\s.\-_)]+/, '')
      .replace(/[\(\[][^\)\]]*[\)\]]/g, ' ')
      .replace(/\b(feat|ft|prod|remix|edit|version|mix)\b.*$/i, ' ')
      .replace(/[^a-z0-9]+/g, '')
      .trim();
  }

  async function _cmpTracks(id) {
    if (_cmpCache[id]) return _cmpCache[id];
    var rows = await api('/albums/' + id + '/tracks');
    var list = (rows || []).map(function (r) { return r.tracks || r; }).filter(Boolean);
    _cmpCache[id] = list;
    return list;
  }

  window.openCompare = async function () {
    if (!_versions.length) return;
    var wrap = document.createElement('div');
    wrap.className = 'wv-cmp-overlay';
    wrap.id = 'wv-cmp';
    wrap.innerHTML = '<div class="wv-cmp-card" role="dialog" aria-label="Compare tracklists">' +
      '<div class="wv-cmp-head"><span>Compare with</span>' +
        '<select id="wv-cmp-pick" class="wv-input" style="padding:7px 10px;font-size:13px;width:auto;max-width:100%;">' +
          _versions.map(function (v, i) {
            var who = v.archive_artist_name || (v.artists && v.artists.display_name) || '';
            return '<option value="' + i + '">' + escHtml(v.title) + (who ? ' — ' + escHtml(who) : '') + '</option>';
          }).join('') +
        '</select>' +
        '<button class="wv-cmp-close" type="button" aria-label="Close">×</button>' +
      '</div>' +
      '<div class="wv-cmp-body" id="wv-cmp-body"><div class="loading"><div class="spinner"></div></div></div>' +
    '</div>';
    wrap.addEventListener('click', function (e) {
      if (e.target === wrap || e.target.classList.contains('wv-cmp-close')) wrap.remove();
    });
    document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { wrap.remove(); document.removeEventListener('keydown', esc); } });
    document.body.appendChild(wrap);
    document.getElementById('wv-cmp-pick').addEventListener('change', function () { renderCompare(this.value); });
    renderCompare(0);
  };

  async function renderCompare(i) {
    var body = document.getElementById('wv-cmp-body');
    if (!body) return;
    var other = _versions[Number(i) || 0];
    if (!other) return;
    body.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var mine = albumTracks.map(function (td) { return td.tracks || td; });
      var theirs = await _cmpTracks(other.id);
      var mineKeys = {}, theirKeys = {};
      mine.forEach(function (t) { var k = _cmpKey(t.title); if (k) mineKeys[k] = t.title; });
      theirs.forEach(function (t) { var k = _cmpKey(t.title); if (k) theirKeys[k] = t.title; });
      var shared = Object.keys(mineKeys).filter(function (k) { return theirKeys[k]; });
      var onlyMine = Object.keys(mineKeys).filter(function (k) { return !theirKeys[k]; });
      var onlyTheirs = Object.keys(theirKeys).filter(function (k) { return !mineKeys[k]; });
      var col = function (title, keys, src, cls) {
        return '<div class="wv-cmp-col">' +
          '<div class="wv-cmp-col-head ' + cls + '">' + escHtml(title) + ' <span>' + keys.length + '</span></div>' +

            ? '<ol class="wv-cmp-list">' + keys.map(function (k) { return '<li>' + escHtml(src[k]) + '</li>'; }).join('') + '</ol>'
            : '<div class="wv-cmp-none">none</div>') +
        '</div>';
      };
      body.innerHTML =
        '<div class="wv-cmp-summary">' +
          '<b>' + escHtml(album.title) + '</b> has ' + mine.length + ' track' + (mine.length === 1 ? '' : 's') + ' · ' +
          '<b>' + escHtml(other.title) + '</b> has ' + theirs.length + ' track' + (theirs.length === 1 ? '' : 's') + ' · ' +
          shared.length + ' in common' +
        '</div>' +
        '<div class="wv-cmp-cols">' +
          col('Only on this one', onlyMine, mineKeys, 'add') +
          col('Only on ' + other.title, onlyTheirs, theirKeys, 'rem') +
          col('On both', shared, mineKeys, 'same') +
        '</div>' +
        '<div class="wv-cmp-foot">' +
          '<button class="wv-btn-ghost" onclick="playCompById(\'' + other.id + '\')">Play ' + escHtml(other.title) + '</button>' +
          '<a class="wv-btn-ghost" href="/album?id=' + other.id + '" onclick="document.getElementById(\'wv-cmp\').remove();">Open it →</a>' +
        '</div>';

  // Everything /related returns is a comp row, so these always open album.html.
  function renderMoreCard(item) {
    var bg = (typeof coverGradient === 'function') ? coverGradient(item.title || '') : '#333';
    var coverImg = item.cover_url
      ? '<img src="' + escHtml(item.cover_url) + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">'

          coverImg +
          '<button class="wv-cover-play-btn" title="Play" aria-label="Play ' + escHtml(item.title || '') + '" onclick="event.stopPropagation();playCompById(\'' + item.id + '\')">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
          '</button>' +

  // ── Album comments ────────────────────────────────────────────────────────
  var albumMyVotes = {};
  var _acMe = null;
  try { _acMe = JSON.parse(localStorage.getItem('user')); } catch(_) {}

  function _acAvatar(uname) {
    return '<div style="width:32px;height:32px;border-radius:50%;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:var(--purple);">' + (uname.charAt(0).toUpperCase() || '?') + '</div>';
  }

  function _acBuildRow(c, isReply) {
    var uname = escHtml((c.users && c.users.username) || 'Unknown');
    var uv = albumMyVotes[c.id] || 0;
    var upActive = uv === 1 ? 'color:var(--brand);font-weight:700;' : 'color:var(--text-3);';
    var downActive = uv === -1 ? 'color:var(--red);font-weight:700;' : 'color:var(--text-3);';
    var timeStr = c.created_at ? new Date(c.created_at).toLocaleDateString() : '';
    var editedMark = c.edited_at ? '<span style="font-size:10px;color:var(--text-3);margin-left:4px;">(edited)</span>' : '';
    var isMine = _acMe && c.user_id === _acMe.id;

    var actionBtns = '<button onclick="acShowReply(\'' + escHtml(c.id) + '\')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3);padding:2px 6px;font-family:inherit;">Reply</button>';
    if (isMine) {
      actionBtns +=
        '<button onclick="acStartEdit(\'' + escHtml(c.id) + '\')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3);padding:2px 6px;font-family:inherit;">Edit</button>' +
        '<button onclick="deleteAlbumComment(\'' + escHtml(c.id) + '\')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3);padding:2px 6px;font-family:inherit;">Delete</button>';
    }

    var indent = isReply ? 'margin-left:44px;' : '';
    return '<div id="albumcomment-' + escHtml(c.id) + '" style="' + indent + '">' +
      '<div style="display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:12px;transition:background 0.12s;" onmouseenter="this.style.background=\'var(--hair)\'" onmouseleave="this.style.background=\'transparent\'">' +
        _acAvatar(uname) +
        '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;">' +
            '<span data-wv-uid="' + escHtml(c.user_id || '') + '" style="font-size:13px;font-weight:600;color:var(--text);">' + uname + '</span>' +
            '<span style="font-size:11px;color:var(--text-3);">' + timeStr + '</span>' +
            editedMark +
          '</div>' +
          '<div id="acbody-' + escHtml(c.id) + '" style="font-size:14px;color:var(--text-2);line-height:1.5;word-break:break-word;">' + _acTsChip(c) + escHtml(c.body || '') + '</div>' +
          '<div style="display:flex;align-items:center;gap:2px;margin-top:6px;flex-wrap:wrap;">' +
            '<button id="acvote-up-btn-' + escHtml(c.id) + '" onclick="voteAlbumComment(\'' + escHtml(c.id) + '\',1)" style="background:none;border:none;cursor:pointer;padding:2px 4px;font-size:12px;' + upActive + '">▲</button>' +
            '<span id="acvote-up-' + escHtml(c.id) + '" style="font-size:11px;color:var(--text-3);min-width:14px;text-align:center;">' + (c.upvotes || 0) + '</span>' +
            '<button id="acvote-down-btn-' + escHtml(c.id) + '" onclick="voteAlbumComment(\'' + escHtml(c.id) + '\',-1)" style="background:none;border:none;cursor:pointer;padding:2px 4px;font-size:12px;' + downActive + '">▼</button>' +
            '<span id="acvote-down-' + escHtml(c.id) + '" style="font-size:11px;color:var(--text-3);min-width:14px;text-align:center;">' + (c.downvotes || 0) + '</span>' +
            '<span style="width:6px;"></span>' +
            actionBtns +
          '</div>' +
          '<div id="acreply-box-' + escHtml(c.id) + '" style="display:none;margin-top:10px;"></div>' +
          '<div id="acedit-box-' + escHtml(c.id) + '" style="display:none;margin-top:10px;"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  async function loadAlbumComments() {
    var el = document.getElementById('album-comments-list');
    if (!el) return;
    try {
      var allComments = await api('/albums/' + albumId + '/comments');
      if (!allComments.length) {
        el.innerHTML = '<div class="empty-state" style="padding:24px 0;"><div class="empty-icon">💬</div><div class="empty-title" style="font-size:14px;">no comments yet...be the first!!</div></div>';
        return;
      }
      for (var c of allComments) albumMyVotes[c.id] = c.user_vote || 0;
      _acTsComments = allComments.filter(function(c) { return c.track_time != null && c.track_ref_id; });

      // Split into top-level and replies, build reply map
      var topLevel = allComments.filter(function(c) { return !c.parent_id; });
      var replyMap = {};
      allComments.filter(function(c) { return !!c.parent_id; }).forEach(function(c) {
        if (!replyMap[c.parent_id]) replyMap[c.parent_id] = [];
        replyMap[c.parent_id].push(c);
      });

      el.innerHTML = topLevel.map(function(c) {
        var html = _acBuildRow(c, false);
        var replies = replyMap[c.id] || [];
        if (replies.length) {
          html += replies.map(function(r) { return _acBuildRow(r, true); }).join('');
        }
        return html;
      }).join('');
    } catch(err) {
      el.innerHTML = '<div class="empty-state" style="padding:16px;"><div class="empty-desc">comments didnt load</div></div>';
    }
  }

  // ── Timestamped comp comments ─────────────────────────────────────────────
  // A comp comment can be pinned to a moment in whichever track of THIS comp is
  // currently playing. Clicking the chip plays that track and seeks there.
  var acTsEnabled = false;
  var acTsTime = null;
  var acTsTrackId = null;

  function fmtT(s) {
    s = Math.max(0, Math.floor(Number(s) || 0));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // Index of the currently-playing track within THIS comp, or -1.
  function _playingCompIndex() {
    if (typeof currentTrack === 'undefined' || !currentTrack) return -1;
    if (typeof audio === 'undefined' || !audio || !audio.src) return -1;
    // Queue objects built by _buildAlbumQueue carry _album_id; trust that first.
    if (currentTrack._album_id && currentTrack._album_id !== album.id) return -1;
    for (var i = 0; i < albumTracks.length; i++) {
      var td = albumTracks[i].tracks || albumTracks[i];
      if (td.id === currentTrack.id) return i;
    }
    return -1;
  }

  function _trackTitleById(id) {
    for (var i = 0; i < albumTracks.length; i++) {
      var td = albumTracks[i].tracks || albumTracks[i];
      if (td.id === id) return td.title || 'Track ' + (i + 1);
    }
    return 'this track';
  }

  function toggleAcTsComment() {
    var idx = _playingCompIndex();
    if (idx < 0) { acTsEnabled = false; acTsTime = null; acTsTrackId = null; _updateAcTsChip(); return; }
    acTsEnabled = !acTsEnabled;
    if (acTsEnabled) {
      acTsTime = Math.round(audio.currentTime * 10) / 10;
      var td = albumTracks[idx].tracks || albumTracks[idx];
      acTsTrackId = td.id;
    } else {
      acTsTime = null; acTsTrackId = null;
    }
    _updateAcTsChip();
  }

  function _updateAcTsChip() {
    var chip = document.getElementById('ac-ts-toggle');
    if (!chip) return;
    var idx = _playingCompIndex();
    if (idx < 0) {
      chip.style.display = 'none';
      acTsEnabled = false; acTsTime = null; acTsTrackId = null;
      return;
    }
    chip.style.display = 'inline-flex';
    if (acTsEnabled && acTsTime != null) {
      chip.textContent = '⏱ ' + fmtT(acTsTime) + ' on “' + (_trackTitleById(acTsTrackId)) + '” ✓';
      chip.style.borderColor = 'var(--brand)';
      chip.style.background = 'var(--brand-bg)';
      chip.style.color = 'var(--brand)';
    } else {
      chip.textContent = '⏱ at ' + fmtT(audio.currentTime);
      chip.style.borderColor = 'var(--hair-strong)';
      chip.style.background = 'transparent';
      chip.style.color = 'var(--text-3)';
    }
  }

  function _acTsChip(c) {
    if (c.track_time == null || !c.track_ref_id) return '';
    var label = '@ ' + fmtT(c.track_time) + ' · ' + escHtml(_trackTitleById(c.track_ref_id));
    return '<button onclick="seekToCompComment(\'' + escHtml(c.track_ref_id) + '\',' + Number(c.track_time) + ')" ' +
      'title="jump to this part" ' +
      'style="display:inline-flex;align-items:center;padding:1px 8px;margin-right:6px;border-radius:12px;border:1px solid var(--brand);background:var(--brand-bg);color:var(--brand);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;vertical-align:middle;">' +
      label + '</button>';
  }

  function seekToCompComment(trackRefId, t) {
    var idx = -1;
    for (var i = 0; i < albumTracks.length; i++) {
      var td = albumTracks[i].tracks || albumTracks[i];
      if (td.id === trackRefId) { idx = i; break; }
    }
    if (idx < 0) return;
    if (_playingCompIndex() === idx) {
      audio.currentTime = t;
      audio.play().catch(function(){});
      return;
    }
    playAtIndex(idx);
    var onCan = function() {
      audio.removeEventListener('canplay', onCan);
      audio.currentTime = t;
    };
    audio.addEventListener('canplay', onCan);
  }

  // ── Live surfacing: pop a comp comment when playback reaches its moment ────
  var _acTsComments = [];
  var _acLastTime = 0;
  var _acLastTrackId = null;
  var _acToastUntil = 0;

  function _acToastEl() {
    var el = document.getElementById('ac-ts-toast');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'ac-ts-toast';
    el.style.cssText = 'display:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:400;' +
      'max-width:min(420px,92vw);background:var(--surface-2,#1a1a1a);border:1px solid var(--brand);border-radius:14px;' +
      'padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,0.5);';
    el.innerHTML =
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">' +
        '<span id="ac-toast-user" style="font-size:12px;font-weight:700;color:var(--brand);"></span>' +
        '<span id="ac-toast-meta" style="font-size:10.5px;color:var(--text-3);"></span>' +
      '</div>' +
      '<div id="ac-toast-text" style="font-size:13px;color:var(--text);line-height:1.4;word-break:break-word;"></div>';
    document.body.appendChild(el);
    return el;
  }

  function _acShowToast(c) {
    var el = _acToastEl();
    document.getElementById('ac-toast-user').textContent = (c.users && c.users.username) || 'unknown';
    document.getElementById('ac-toast-meta').textContent = '@ ' + fmtT(c.track_time) + ' · ' + _trackTitleById(c.track_ref_id);
    document.getElementById('ac-toast-text').textContent = c.body || c.content || '';
    el.style.display = 'block';
    _acToastUntil = Date.now() + 4500;
  }

  function _acCheckCrossing() {
    var idx = _playingCompIndex();
    if (idx < 0) { _acLastTrackId = null; return; }
    var td = albumTracks[idx].tracks || albumTracks[idx];
    var curId = td.id;
    var now = audio.currentTime;
    // Reset the crossing baseline when the playing track changes.
    if (curId !== _acLastTrackId) { _acLastTrackId = curId; _acLastTime = now; return; }
    if (audio.paused) { _acLastTime = now; return; }
    var crossed = null;
    for (var i = 0; i < _acTsComments.length; i++) {
      var c = _acTsComments[i];
      if (c.track_ref_id !== curId) continue;
      var t = Number(c.track_time);
      if (t > _acLastTime && t <= now) {
        if (!crossed || t > Number(crossed.track_time)) crossed = c;
      }
    }
    if (crossed) _acShowToast(crossed);

    var state = cur ? (playing ? 'pause' : 'resume') : 'play';
