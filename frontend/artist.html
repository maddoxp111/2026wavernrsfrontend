<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — artist</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/discover.html">Discover</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q.length>=2)navigate('/search.html?q='+encodeURIComponent(q));}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="view">
<div id="page-container">
  <div class="loading" style="padding:80px;"><div class="spinner"></div></div>
</div>
</div><!-- /view -->

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg></span>
    <span>Discover</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
    <span>Dashboard</span>
  </a>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  updateNav();
  initPlayer();

  const artistId = new URLSearchParams(location.search).get('id');
  if (!artistId) navigate('/index.html');

  let artist = null;
  let uploads = [];
  let isFollowing = false;
  let followerCount = 0;

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadPage() {
    try {
      const [artistData, allTracks, allAlbums] = await Promise.all([
        api(`/artists/${artistId}`),
        api(`/artists/${artistId}/tracks`),
        api(`/albums/by-artist/${artistId}`).catch(() => []),
      ]);
      artist = artistData;
      uploads = [
        ...allTracks.map(t => ({ ...t, _type: 'track' })),
        ...allAlbums.map(a => ({ ...a, _type: 'album' })),
      ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      // Load follow status (fails silently if table doesn't exist)
      try {
        const followData = await api(`/artists/${artistId}/follow`);
        isFollowing = followData.following || false;
        followerCount = followData.follower_count || 0;
      } catch {}
      document.title = `${artist.display_name} — wavernrs stream`;
      render();
    } catch (_) {
      document.getElementById('page-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">Artist not found</div></div>`;
    }
  }

  async function toggleFollow() {
    if (!isLoggedIn()) return location.href = '/login.html';
    try {
      const res = await api(`/artists/${artistId}/follow`, { method: 'POST' });
      isFollowing = res.following;
      followerCount = res.follower_count;
      const btn = document.getElementById('follow-btn');
      if (btn) {
        btn.textContent = isFollowing ? 'Following' : 'Follow';
        btn.className = `btn ${isFollowing ? 'btn-secondary' : 'btn-primary'} btn-sm`;
      }
      const countEl = document.getElementById('follower-count');
      if (countEl) countEl.textContent = fmtNum(followerCount);
    } catch (err) {
      alert(err.message);
    }
  }

  function render() {
    const me = JSON.parse(localStorage.getItem('user') || 'null');
    const isOwner = me && artist.user_id === me.id;
    const avatarContent = artist.profile_image_url
      ? `<img src="${artist.profile_image_url}" alt="avatar">`
      : `<span>${escHtml(artist.display_name?.[0]?.toUpperCase() || '?')}</span>`;

    const totalPlays = uploads.filter(u => u._type === 'track').reduce((sum, t) => sum + (t.play_count || 0), 0);

    document.getElementById('page-container').innerHTML = `
      <!-- Banner -->
      <div class="artist-banner">
        ${artist.banner_url ? `<img src="${artist.banner_url}" alt="banner">` : ''}
      </div>

      <!-- Avatar -->
      <div class="artist-avatar-wrap">
        <div class="artist-avatar">${avatarContent}</div>
      </div>

      <!-- Meta -->
      <div class="artist-meta">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <div class="artist-name">${escHtml(artist.display_name)}</div>
          ${isOwner ? `<a href="/dashboard.html" class="btn btn-secondary btn-sm">Edit profile</a>` : ''}
          ${!isOwner ? `<button class="btn ${isFollowing ? 'btn-secondary' : 'btn-primary'} btn-sm" id="follow-btn" onclick="toggleFollow()">${isFollowing ? 'Following' : 'Follow'}</button>` : ''}
        </div>
        ${artist.bio ? `<div class="artist-bio">${escHtml(artist.bio)}</div>` : ''}
        <div class="artist-stats">
          <div class="artist-stat"><strong>${uploads.length}</strong> uploads</div>
          <div class="artist-stat"><strong>${fmtNum(totalPlays)}</strong> total plays</div>
          <div class="artist-stat"><strong id="follower-count">${fmtNum(followerCount)}</strong> followers</div>
          ${artist.location ? `<div class="artist-stat">📍 ${escHtml(artist.location)}</div>` : ''}
          ${artist.website ? `<div class="artist-stat"><a href="${escHtml(artist.website)}" target="_blank" rel="noopener" style="color:var(--purple-light);">Website ↗</a></div>` : ''}
        </div>
      </div>

      <div class="container" style="padding-top:8px;padding-bottom:40px;">
        <h2 class="section-title">Uploads</h2>
        <div id="uploads-list"></div>
      </div>`;

    renderUploads();
  }

  function renderUploads() {
    const el = document.getElementById('uploads-list');
    if (!uploads.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">🎵</div><div class="empty-title">No uploads yet</div></div>`;
      return;
    }

    el.innerHTML = `<div class="track-grid">` + uploads.map((item, i) => {
      const isAlbum = item._type === 'album';
      const cover = item.cover_url ? `<img src="${item.cover_url}" alt="" onerror="this.style.display='none'">` : `<span class="track-cover-placeholder">🎵</span>`;
      const eraName = item.era_tag?.name || item.genre || '';
      const clickAction = isAlbum
        ? `location.href='/album.html?id=${item.id}'`
        : `playFromList(${i})`;
      return `
        <div class="track-card" onclick="${clickAction}" style="cursor:pointer;">
          <div class="track-cover">
            ${cover}
            ${isAlbum
              ? `<div style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.65);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:0.05em;">COMP</div>`
              : `<div class="track-play-overlay">
                  <button class="play-btn-overlay" onclick="event.stopPropagation();playFromList(${i})">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--purple)"><path d="M8 5v14l11-7z"/></svg>
                  </button>
                </div>`}
          </div>
          <div class="track-info">
            <div class="track-title">${escHtml(item.title)}</div>
            <div class="track-artist">${escHtml(artist.display_name)}</div>
            <div class="track-meta">
              ${!isAlbum && item.play_count !== undefined ? `<span>${fmtNum(item.play_count)} plays</span>` : ''}
              ${eraName ? `<span class="badge">${escHtml(eraName)}</span>` : ''}
            </div>
          </div>
        </div>`;
    }).join('') + `</div>`;
  }

  function playFromList(index) {
    const item = uploads[index];
    if (!item || item._type !== 'track') return;
    playTrack({ ...item, artist_name: artist.display_name });
  }

  loadPage();
</script>
</body>
</html>
