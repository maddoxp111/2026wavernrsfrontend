<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — artist</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/discover.html">Discover</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q.length>=2)location.href='/search.html?q='+encodeURIComponent(q);}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="page-container">
  <div class="loading" style="padding:80px;"><div class="spinner"></div></div>
</div>

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">🏠</span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">🔍</span>
    <span>Discover</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">🔎</span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">🎛️</span>
    <span>Dashboard</span>
  </a>
</div>

<!-- Player -->
<div id="player" class="hidden">
  <div class="player-track">
    <div class="player-cover" id="player-cover">🎵</div>
    <div>
      <div class="player-title" id="player-title">—</div>
      <div class="player-artist" id="player-artist">—</div>
    </div>
  </div>
  <div class="player-controls">
    <button class="player-btn player-btn-play" onclick="togglePlay()" id="player-play-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
  <div class="player-progress">
    <span class="player-time" id="time-elapsed">0:00</span>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="player-time" id="time-total">0:00</span>
  </div>
  <div class="player-volume">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text-secondary)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script>
  updateNav();
  initPlayer();

  const artistId = new URLSearchParams(location.search).get('id');
  if (!artistId) location.href = '/index.html';

  let artist = null;
  let tracks = [];
  let comps = [];
  let isFollowing = false;
  let followerCount = 0;

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadPage() {
    try {
      [artist, tracks, comps] = await Promise.all([
        api(`/artists/${artistId}`),
        api(`/artists/${artistId}/tracks`),
        api(`/albums/by-artist/${artistId}`).catch(() => []),
      ]);
      // Load follow status (fails silently if table doesn't exist)
      try {
        const followData = await api(`/artists/${artistId}/follow`);
        isFollowing = followData.following || false;
        followerCount = followData.follower_count || 0;
      } catch {}
      document.title = `${artist.display_name} — wavernrs stream`;
      render();
    } catch (_) {
      document.getElementById('page-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">Artist not found</div></div>`;
    }
  }

  async function toggleFollow() {
    if (!isLoggedIn()) return location.href = '/login.html';
    try {
      const res = await api(`/artists/${artistId}/follow`, { method: 'POST' });
      isFollowing = res.following;
      followerCount = res.follower_count;
      const btn = document.getElementById('follow-btn');
      if (btn) {
        btn.textContent = isFollowing ? 'Following' : 'Follow';
        btn.className = `btn ${isFollowing ? 'btn-secondary' : 'btn-primary'} btn-sm`;
      }
      const countEl = document.getElementById('follower-count');
      if (countEl) countEl.textContent = fmtNum(followerCount);
    } catch (err) {
      alert(err.message);
    }
  }

  function render() {
    const me = JSON.parse(localStorage.getItem('user') || 'null');
    const isOwner = me && artist.user_id === me.id;
    const avatarContent = artist.profile_image_url
      ? `<img src="${artist.profile_image_url}" alt="avatar">`
      : `<span>${escHtml(artist.display_name?.[0]?.toUpperCase() || '?')}</span>`;

    const totalPlays = tracks.reduce((sum, t) => sum + (t.play_count || 0), 0);

    document.getElementById('page-container').innerHTML = `
      <!-- Banner -->
      <div class="artist-banner">
        ${artist.banner_url ? `<img src="${artist.banner_url}" alt="banner">` : ''}
      </div>

      <!-- Avatar -->
      <div class="artist-avatar-wrap">
        <div class="artist-avatar">${avatarContent}</div>
      </div>

      <!-- Meta -->
      <div class="artist-meta">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <div class="artist-name">${escHtml(artist.display_name)}</div>
          ${isOwner ? `<a href="/dashboard.html" class="btn btn-secondary btn-sm">Edit profile</a>` : ''}
          ${!isOwner ? `<button class="btn ${isFollowing ? 'btn-secondary' : 'btn-primary'} btn-sm" id="follow-btn" onclick="toggleFollow()">${isFollowing ? 'Following' : 'Follow'}</button>` : ''}
        </div>
        ${artist.bio ? `<div class="artist-bio">${escHtml(artist.bio)}</div>` : ''}
        <div class="artist-stats">
          <div class="artist-stat"><strong>${tracks.length}</strong> edits</div>
          <div class="artist-stat"><strong>${comps.length}</strong> comps</div>
          <div class="artist-stat"><strong>${fmtNum(totalPlays)}</strong> total plays</div>
          <div class="artist-stat"><strong id="follower-count">${fmtNum(followerCount)}</strong> followers</div>
          ${artist.location ? `<div class="artist-stat">📍 ${escHtml(artist.location)}</div>` : ''}
          ${artist.website ? `<div class="artist-stat"><a href="${escHtml(artist.website)}" target="_blank" rel="noopener" style="color:var(--purple-light);">Website ↗</a></div>` : ''}
        </div>
      </div>

      <div class="container" style="padding-top:8px;padding-bottom:40px;">
        <h2 class="section-title">Edits</h2>
        <div id="tracks-list"></div>

        ${comps.length ? `
        <h2 class="section-title" style="margin-top:32px;">Comps</h2>
        <div id="comps-list"></div>
        ` : ''}
      </div>`;

    renderTracks();
    if (comps.length) renderComps();
  }

  function renderTracks() {
    const el = document.getElementById('tracks-list');
    if (!tracks.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">🎵</div><div class="empty-title">No edits yet</div></div>`;
      return;
    }

    el.innerHTML = `<div class="track-list">` + tracks.map((t, i) => {
      const cover = t.cover_url ? `<img src="${t.cover_url}" alt="">` : `🎵`;
      const eraName = t.era_tag?.name || t.genre || '';
      return `
        <div class="track-row" onclick="playFromList(${i})">
          <div class="track-row-num">${i + 1}</div>
          <div class="track-row-cover">${cover}</div>
          <div class="track-row-info">
            <div class="track-row-title">${escHtml(t.title)}</div>
            ${eraName ? `<div class="track-row-artist">${escHtml(eraName)}</div>` : ''}
          </div>
          <span class="track-row-plays">${fmtNum(t.play_count)} plays</span>
          <a href="/track.html?id=${t.id}" onclick="event.stopPropagation()" style="font-size:12px;color:var(--text-tertiary);padding:4px 8px;">Open</a>
        </div>`;
    }).join('') + `</div>`;
  }

  function renderComps() {
    const el = document.getElementById('comps-list');
    if (!el || !comps.length) return;
    el.innerHTML = `<div class="scroll-row">` + comps.map(c => {
      const coverHtml = c.cover_url
        ? `<img src="${c.cover_url}" alt="" onerror="this.style.display='none'">`
        : '';
      return `
        <div class="scroll-card" onclick="location.href='/album.html?id=${c.id}'">
          <div class="scroll-card-cover">
            ${coverHtml}
            <div class="scroll-card-overlay">
              <div class="play-btn-overlay">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--purple)"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
          </div>
          <div class="scroll-card-title">${escHtml(c.title)}</div>
          <div class="scroll-card-sub">${c.track_count || 0} edits</div>
        </div>`;
    }).join('') + `</div>`;
  }

  function playFromList(index) {
    const t = tracks[index];
    if (!t) return;
    playTrack({ ...t, artist_name: artist.display_name });
  }

  loadPage();
</script>
</body>
</html>
