<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stream — artist</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">stream</a>
  <div class="nav-links">
    <a href="/index.html">Discover</a>
    <a href="/index.html?tab=trending">Trending</a>
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="page-container">
  <div class="loading" style="padding:80px;"><div class="spinner"></div></div>
</div>

<!-- Player -->
<div id="player" class="hidden">
  <div class="player-track">
    <div class="player-cover" id="player-cover">🎵</div>
    <div>
      <div class="player-title" id="player-title">—</div>
      <div class="player-artist" id="player-artist">—</div>
    </div>
  </div>
  <div class="player-controls">
    <button class="player-btn player-btn-play" onclick="togglePlay()" id="player-play-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
  <div class="player-progress">
    <span class="player-time" id="time-elapsed">0:00</span>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="player-time" id="time-total">0:00</span>
  </div>
  <div class="player-volume">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text-secondary)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script>
  updateNav();
  initPlayer();

  const artistId = new URLSearchParams(location.search).get('id');
  if (!artistId) location.href = '/index.html';

  let artist = null;
  let tracks = [];

  async function loadPage() {
    try {
      [artist, tracks] = await Promise.all([
        api(`/artists/${artistId}`),
        api(`/artists/${artistId}/tracks`),
      ]);
      document.title = `${artist.display_name} — stream`;
      render();
    } catch (_) {
      document.getElementById('page-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">Artist not found</div></div>`;
    }
  }

  function render() {
    const me = JSON.parse(localStorage.getItem('user') || 'null');
    const isOwner = me && artist.user_id === me.id;
    const avatarContent = artist.profile_image_url
      ? `<img src="${artist.profile_image_url}" alt="avatar">`
      : `<span>${artist.display_name?.[0]?.toUpperCase() || '?'}</span>`;

    const totalPlays = tracks.reduce((sum, t) => sum + (t.play_count || 0), 0);

    document.getElementById('page-container').innerHTML = `
      <!-- Banner -->
      <div class="artist-banner">
        ${artist.banner_url ? `<img src="${artist.banner_url}" alt="banner">` : ''}
      </div>

      <!-- Avatar -->
      <div class="artist-avatar-wrap">
        <div class="artist-avatar">${avatarContent}</div>
      </div>

      <!-- Meta -->
      <div class="artist-meta">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <div class="artist-name">${artist.display_name}</div>
          ${isOwner ? `<a href="/dashboard.html" class="btn btn-secondary btn-sm">Edit profile</a>` : ''}
        </div>
        ${artist.bio ? `<div class="artist-bio">${artist.bio}</div>` : ''}
        <div class="artist-stats">
          <div class="artist-stat"><strong>${tracks.length}</strong> tracks</div>
          <div class="artist-stat"><strong>${fmtNum(totalPlays)}</strong> total plays</div>
          ${artist.location ? `<div class="artist-stat">📍 ${artist.location}</div>` : ''}
          ${artist.website ? `<div class="artist-stat"><a href="${artist.website}" target="_blank" style="color:var(--purple);">Website ↗</a></div>` : ''}
        </div>
      </div>

      <div class="container" style="padding-top:8px;padding-bottom:40px;">
        <h2 class="section-title">Tracks</h2>
        <div id="tracks-list"></div>
      </div>`;

    renderTracks();
  }

  function renderTracks() {
    const el = document.getElementById('tracks-list');
    if (!tracks.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">🎵</div><div class="empty-title">No tracks yet</div></div>`;
      return;
    }

    el.innerHTML = `<div class="track-list">` + tracks.map((t, i) => {
      const cover = t.cover_url
        ? `<img src="${t.cover_url}" alt="">`
        : `🎵`;
      return `
        <div class="track-row" onclick="playFromList(${i})">
          <div class="track-row-num">${i + 1}</div>
          <div class="track-row-cover">${cover}</div>
          <div class="track-row-info">
            <div class="track-row-title">${t.title}</div>
            ${t.genre ? `<div class="track-row-artist">${t.genre}</div>` : ''}
          </div>
          <span class="track-row-plays">${fmtNum(t.play_count)} plays</span>
          <a href="/track.html?id=${t.id}" onclick="event.stopPropagation()" style="font-size:12px;color:var(--text-tertiary);padding:4px 8px;">Open</a>
        </div>`;
    }).join('') + `</div>`;
  }

  function playFromList(index) {
    const t = tracks[index];
    if (!t) return;
    playTrack({ ...t, artist_name: artist.display_name });
  }

  loadPage();
</script>
</body>
</html>
