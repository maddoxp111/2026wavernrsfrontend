<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — artist</title>
  <link rel="stylesheet" href="/css/style.css?v=31217628fb78">
  <script src="/js/status-card.js?v=31217628fb78"></script>
  <script src="/js/down.js?v=31217628fb78"></script>
</head>
<body>

<div id="view">
  <div class="loading" style="padding:80px;"><div class="spinner"></div></div>
</div>

<script src="/js/api.js?v=31217628fb78"></script>
<script src="/js/layout.js?v=31217628fb78"></script>
<script src="/js/player.js?v=31217628fb78"></script>
<script src="/js/router.js?v=31217628fb78"></script>
<script src="/js/playlists.js?v=31217628fb78"></script>
<script>
  initPlayer();

  var artistId = new URLSearchParams(location.search).get('id');
  if (!artistId || artistId === 'null' || artistId === 'undefined') navigate('/index');

  var artist = null;
  var uploads = [];
  var isFollowing = false;
  var followerCount = 0;

  // Play the artist's whole catalogue: standalone edits plus every comp track.
  async function artistPlayAll(shuffle) {
    var singles = uploads.filter(function (u) { return u._type === 'track' && u.ia_url; });
    var albums = uploads.filter(function (u) { return u._type === 'album'; });
    if (!singles.length && !albums.length) { if (typeof wvToast === 'function') wvToast('nothing to play here yet'); return; }
    if (typeof wvToast === 'function') wvToast('setting up the queue...');
    var who = artist.display_name || '';
    var queue = singles.map(function (t) {
      return { id: t.id, title: t.title, ia_url: t.ia_url, cover_url: t.cover_url || null, artist_name: who, album_id: null, artist_id: artistId };
    });
    var batches = await Promise.all(albums.slice(0, 12).map(function (a) {
      return api('/albums/' + a.id + '/tracks').catch(function () { return []; });
    }));
    batches.forEach(function (rows, i) {
      var a = albums[i];
      (rows || []).map(function (r) { return r.tracks || r; }).filter(function (t) { return t && t.ia_url; }).forEach(function (t) {
        queue.push({ id: t.id, title: t.title, ia_url: t.ia_url, cover_url: t.cover_url || a.cover_url || null, artist_name: who, album_id: a.id, artist_id: artistId, _album_id: a.id, _album_title: a.title, _album_cover: a.cover_url || null });
      });
    });
    if (!queue.length) { if (typeof wvToast === 'function') wvToast('nothing playable here yet', 'error'); return; }
    if (shuffle) for (var i = queue.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = queue[i]; queue[i] = queue[j]; queue[j] = t; }
    setPlayerQueue(queue, 0);
    playQueueIndex(0);
    if (typeof wvToast === 'function') wvToast((shuffle ? 'shuffling ' : 'playing ') + queue.length + ' track' + (queue.length === 1 ? '' : 's'));
  }

  function artistPlayTrack(id) {
    var t = uploads.find(function (u) { return u.id === id; });
    if (!t || !t.ia_url) { if (typeof wvToast === 'function') wvToast('that edit has no audio yet'); return; }
    var idx = uploads.filter(function (u) { return u._type === 'track' && u.ia_url; }).findIndex(function (u) { return u.id === id; });
    var list = uploads.filter(function (u) { return u._type === 'track' && u.ia_url; }).map(function (u) {
      return { id: u.id, title: u.title, ia_url: u.ia_url, cover_url: u.cover_url || null, artist_name: artist.display_name || '', artist_id: artistId };
    });
    setPlayerQueue(list, Math.max(0, idx));
    playQueueIndex(Math.max(0, idx));
  }

  async function loadPage() {
    try {
      var results = await Promise.all([
        api('/artists/' + artistId),
        api('/artists/' + artistId + '/tracks'),
        api('/albums/by-artist/' + artistId).catch(function() { return []; }),
      ]);
      artist = results[0];
      var allTracks = results[1];
      var allAlbums = results[2];

      uploads = allTracks.map(function(t) { return Object.assign({}, t, { _type: 'track' }); })
        .concat(allAlbums.map(function(a) { return Object.assign({}, a, { _type: 'album' }); }))
        .sort(function(a, b) { return new Date(b.original_date || b.created_at) - new Date(a.original_date || a.created_at); });

      try {
        var followData = await api('/artists/' + artistId + '/follow');
        isFollowing = followData.following || false;
        followerCount = followData.follower_count || 0;
      } catch (_) {}

      document.title = (artist.display_name || 'Artist') + ' — wavernrs';

      // Blurred profile image as the page background (like the home hero).
      if (typeof window.setPageBgImage === 'function') {
        window.setPageBgImage(artist.profile_image_url || artist.banner_url || '');
      }

      render();
    } catch (err) {
      document.getElementById('view').innerHTML =
        '<div class="empty-state"><div class="empty-title">couldnt find this artist</div></div>';
    }
  }

  async function toggleFollow() {
    if (!isLoggedIn()) { location.href = '/login'; return; }
    try {
      var res = await api('/artists/' + artistId + '/follow', { method: 'POST' });
      isFollowing = res.following;
      followerCount = res.follower_count;
      var btn = document.getElementById('follow-btn');
      if (btn) {
        btn.textContent = isFollowing ? 'Following' : 'Follow';
        btn.className = 'btn ' + (isFollowing ? 'btn-secondary' : 'btn-primary') + ' btn-sm';
      }
      var countEl = document.getElementById('follower-count');
      if (countEl) countEl.textContent = fmtNum(followerCount);
    } catch (err) { alert(err.message); }
  }

  async function render() {
    var me = null;
    try { me = JSON.parse(localStorage.getItem('user') || 'null'); } catch (_) {}
    var isOwner = !!(me && artist.user_id === me.id);
    var totalPlays = uploads.filter(function(u) { return u._type === 'track'; })
      .reduce(function(sum, t) { return sum + (t.play_count || 0); }, 0);

    var badges = await getBadgeData().catch(function() { return { verified_artists: [] }; });
    var isVerified = badges.verified_artists && badges.verified_artists.indexOf(artist.id) !== -1;
    var verifiedBadge = isVerified ? '<span class="wv-verified-icon" title="verified artist" style="margin-left:6px;width:18px;height:18px;font-size:11px;">✓</span>' : '';
    var verifiedPill = isVerified ? '<span class="wv-badge-pill wv-badge-verified-pill" style="margin-left:6px;">✓ Verified Artist</span>' : '';

    var avatarBg = coverGradient(artist.display_name || '');
    var avatarInner = artist.profile_image_url
      ? '<img src="' + escHtml(artist.profile_image_url) + '" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;" onerror="this.style.opacity=0">'
      : '<span style="font-size:48px;font-weight:800;color:rgba(255,255,255,0.9);">' + escHtml((artist.display_name || '?')[0].toUpperCase()) + '</span>';

    var html =
      '<div style="padding:28px 0 0;">' +
        (artist.banner_url
          ? '<div style="width:100%;height:180px;border-radius:20px;overflow:hidden;margin-bottom:-60px;position:relative;">' +
              '<img src="' + escHtml(artist.banner_url) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.closest(\'div\').remove()">' +
              '<div aria-hidden style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.5));"></div>' +
            '</div>'
          : '') +

        '<div class="wv-art-hero" style="display:flex;align-items:flex-end;gap:24px;padding:0 4px;margin-bottom:20px;flex-wrap:wrap;position:relative;z-index:1;">' +
          '<div class="wv-art-avatar" style="width:110px;height:110px;border-radius:50%;background:' + (artist.profile_image_url ? 'var(--surface-2)' : avatarBg) + ';flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,0.25);">' +
            avatarInner +
          '</div>' +
          '<div style="flex:1;min-width:0;padding-bottom:4px;">' +
            '<div class="wv-art-name" style="font-size:28px;font-weight:800;letter-spacing:-0.04em;line-height:1.1;margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;"><span data-wv-uid="' + escHtml(artist.user_id || '') + '" data-wv-nocolor="1">' + escHtml(artist.display_name || 'Unknown') + '</span>' + verifiedPill + '</div>' +
            '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
              '<button class="btn btn-primary btn-sm" onclick="artistPlayAll(false)">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px;"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg>Play all</button>' +
              '<button class="btn btn-secondary btn-sm" onclick="artistPlayAll(true)">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:5px;"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>Shuffle</button>' +
              (isOwner
                ? '<a href="/dashboard" class="btn btn-secondary btn-sm">Manage music</a>'
                : '<button class="btn ' + (isFollowing ? 'btn-secondary' : 'btn-primary') + ' btn-sm" id="follow-btn" onclick="toggleFollow()">' + (isFollowing ? 'Following' : 'Follow') + '</button>') +
            '</div>' +
          '</div>' +
        '</div>' +

        (artist.bio ? '<p style="font-size:14px;color:var(--text-2);line-height:1.65;margin:0 0 16px;max-width:560px;">' + escHtml(artist.bio) + '</p>' : '') +

        '<div class="wv-art-stats" style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:28px;font-size:13.5px;color:var(--text-2);">' +
          '<span><strong style="color:var(--text);">' + uploads.length + '</strong> uploads</span>' +
          '<span><strong style="color:var(--text);">' + fmtNum(totalPlays) + '</strong> total plays</span>' +
          '<span><strong style="color:var(--text);" id="follower-count">' + fmtNum(followerCount) + '</strong> followers</span>' +
          (artist.location ? '<span>📍 ' + escHtml(artist.location) + '</span>' : '') +
          (/^https?:\/\//i.test(String(artist.website || '')) ? '<span><a href="' + escHtml(artist.website) + '" target="_blank" rel="noopener noreferrer" style="color:var(--brand);">Website ↗</a></span>' : '') +
        '</div>' +

        '<div id="uploads-empty"></div>' +
        '<div id="comps-section" style="display:none;"><h2 class="wv-section-title">Comps</h2><div id="comps-list"></div></div>' +
        '<div id="edits-section" style="display:none;"><h2 class="wv-section-title">Edits</h2><div id="edits-list"></div></div>' +
      '</div>';

    document.getElementById('view').innerHTML = html;
    var isEdit = function(u) { return u._type === 'track' || Number(u.track_count) === 1; };
    var comps = uploads.filter(function(u) { return !isEdit(u); });
    var edits = uploads.filter(isEdit);
    if (!uploads.length) document.getElementById('uploads-empty').innerHTML = '<div class="empty-state"><div class="empty-icon">🎵</div><div class="empty-title">no uploads yet</div></div>';
    if (comps.length) { document.getElementById('comps-section').style.display = ''; renderUploads(comps, 'comps-list'); }
    if (edits.length) { document.getElementById('edits-section').style.display = ''; renderUploads(edits, 'edits-list'); }
  }

  function renderUploads(list, elId) {
    var el = document.getElementById(elId);
    if (!el) return;

    el.innerHTML = '<div class="wv-comp-grid wv-comp-grid-4" style="padding-bottom:32px;">' +
      list.map(function(item, i) {
        var isAlbum = item._type === 'album';
        var coverBg = coverGradient(item.title || '');
        var coverImg = item.cover_url
          ? '<img src="' + escHtml(item.cover_url) + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">'
          : '';
        var clickAction = isAlbum
          ? "navigate('/album?id=" + item.id + "')"
          : "navigate('/track?id=" + item.id + "')";
        var eraName = (item.era_tag && item.era_tag.name) || item.genre || '';
        var isDraft = isAlbum && item.release_status === 'draft';
        var upAt = isAlbum && item.release_status === 'upcoming' && item.release_at ? new Date(item.release_at) : null;
        var isUpcoming = !!(upAt && upAt > new Date());
        var statusTag = isDraft ? '<div class="wv-upcoming-badge" style="background:var(--surface-3);color:var(--text);border:1px dashed var(--text-3);">Draft</div>'
          : isUpcoming ? '<div class="wv-upcoming-badge">Out ' + escHtml(upAt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })) + '</div>' : '';
        var byName = item.collab && item.artists ? item.artists.display_name : artist.display_name;

        return '<div class="wv-comp-card" onclick="' + clickAction + '">' +
          '<div class="wv-comp-card-cover">' +
            '<div class="wv-comp-card-cover-inner" style="background:' + coverBg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
              '' +
              (isAlbum ? '' : '') +
              coverImg + statusTag +
              (item.locked ? '' : '<button class="wv-cover-play-btn" title="Play" aria-label="Play ' + escHtml(item.title || '') + '" onclick="event.stopPropagation();' +
                (isAlbum ? "playCompById('" + item.id + "')" : "artistPlayTrack('" + item.id + "')") + '">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
              '</button>') +
            '</div>' +
          '</div>' +
          '<div class="wv-comp-card-title">' + escHtml(item.title || 'Untitled') + '</div>' +
          '<div class="wv-comp-card-artist" style="display:flex;align-items:center;gap:6px;">' +
            escHtml(byName || '') + (item.collab ? ' · <span class="badge" style="font-size:10px;">Collab</span>' : '') +
            (eraName ? ' · <span class="badge" style="font-size:10px;">' + escHtml(eraName) + '</span>' : '') +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';

    if (typeof wireIACoverRetry === 'function') {
      document.querySelectorAll('#' + elId + ' img').forEach(wireIACoverRetry);
    }
  }

  loadPage();
</script>
</body>
</html>
