<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — signing in…</title>
  <link rel="stylesheet" href="/css/style.css?v=261967381b39">
  <link rel="icon" type="image/x-icon" href="/icon.ico">
  <script src="/js/status-card.js?v=261967381b39"></script>
  <script src="/js/down.js?v=261967381b39"></script>
</head>
<body>
<div class="wv-auth-page" id="auth-root">
  <div class="wv-auth-card wv-card" style="text-align:center;">
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.04em;color:var(--brand);margin-bottom:24px;">wavernrs</div>
    <div id="cb-status" style="color:var(--text-2);font-size:15px;">Finishing sign-in…</div>
    <div id="cb-error" style="display:none;margin-top:16px;">
      <div class="wv-form-error" id="cb-error-msg"></div>
      <a href="/login" style="display:inline-block;margin-top:12px;color:var(--brand);font-size:13px;">Back to login</a>
    </div>
  </div>
</div>

<script src="/js/api.js?v=261967381b39"></script>
<script>
  try {
    if (localStorage.getItem('wv_theme_dark_default') !== '1') {
      localStorage.setItem('wv_theme_dark_default', '1');
      localStorage.setItem('wv_theme', 'dark');
    }
  } catch (_) {}
  var _t = (localStorage.getItem('wv_theme') === 'light' ? 'light' : 'dark');
  document.getElementById('auth-root').className = 'wv-auth-page theme-' + _t;

  var params = new URLSearchParams(location.search);
  var hashParams = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var token   = hashParams.get('token') || params.get('token');
  var isNew   = (hashParams.get('new') || params.get('new')) === '1';
  var linked  = params.get('linked');
  var errCode = params.get('error');
  if (token) { try { history.replaceState(null, '', '/auth-callback'); } catch (_) {} }

  var errorMessages = {
    invalid_state:   'login took too long...try again',
    cancelled:       'sign in was cancelled',
    oauth_failed:    'sign in didnt work...try again',
    create_failed:   'couldnt make your account...try again',
    already_linked:  'that account is already linked to someone else',
    not_set_up:      'last.fm linking isnt set up yet',
  };

  function _nextTarget() {
    var next = null;
    try { next = sessionStorage.getItem('wv_next'); sessionStorage.removeItem('wv_next'); } catch (_) {}
    if (next) {
      try {
        var u = new URL(next, location.origin);
        if (u.origin === location.origin && !/^\/(login|register|auth-callback)(\.html)?$/.test(u.pathname)) return u.pathname + u.search + u.hash;
      } catch (_) {}
    }
    return '/index';
  }

  function _tokenName(t) {
    try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).username || ''; } catch (_) { return ''; }
  }

  function showNewAccount(name, target) {
    var status = document.getElementById('cb-status');
    status.innerHTML = '<div style="text-align:left;line-height:1.55;">we made you a new account' + (name ? ' (@' + escHtml(name) + ')' : '') +
      '. already have a wavernrs account? log out, log in with your password and connect Discord/Google in Settings</div>' +
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;">' +
      '<button class="wv-pill brand" id="cb-continue">Continue</button>' +
      '<button class="wv-pill" id="cb-other">Use my other account</button></div>';
    document.getElementById('cb-continue').onclick = function () { location.replace(target); };
    document.getElementById('cb-other').onclick = function () {
      try { localStorage.removeItem('token'); localStorage.removeItem('user'); } catch (_) {}
      location.replace('/login?next=%2Fsettings');
    };
  }

  (async function () {
    if (errCode) {
      document.getElementById('cb-status').style.display = 'none';
      document.getElementById('cb-error').style.display = '';
      var reason = params.get('reason');
      document.getElementById('cb-error-msg').textContent = (errorMessages[errCode] || 'something went wrong') +
        (reason ? ' (' + reason + ')' : '');
      return;
    }

    if (linked) {
      document.getElementById('cb-status').textContent = (linked === 'discord' ? 'Discord' : linked === 'reddit' ? 'Reddit' : linked === 'lastfm' ? 'Last.fm' : 'Google') + ' account linked!!';
      var dest = (linked === 'discord' || linked === 'reddit') ? '/settings#claimable-box' : '/settings';
      setTimeout(function () { location.replace(dest); }, 1200);
      return;
    }

    if (token) {
      localStorage.setItem('token', token);
      var me = null;
      try {
        me = await api('/auth/me');
        localStorage.setItem('user', JSON.stringify({ id: me.id, username: me.username }));
      } catch (_) {}
      var target = _nextTarget();
      if (isNew) {
        showNewAccount((me && me.username) || _tokenName(token), target);
        return;
      }
      document.getElementById('cb-status').textContent = 'Signed in! Redirecting…';
      setTimeout(function () { location.replace(target); }, 600);
      return;
    }

    // No token and no error — shouldn't happen
    document.getElementById('cb-status').style.display = 'none';
    document.getElementById('cb-error').style.display = '';
    document.getElementById('cb-error-msg').textContent = 'something broke while signing in...try again';
  })();
</script>
</body>
</html>
