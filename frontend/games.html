<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>wavernrs · games</title>
  <link rel="stylesheet" href="/css/style.css?v=6288d60cd337">
  <style>
    /* Everything here is self-contained: the games are drawn on a canvas by
       this page, so there are no third-party iframes to be refused, no CDN to
       go down, and nothing to load but this file. */
    html { height:auto; overflow-x:hidden; overflow-y:auto; }
    body { margin:0; height:auto; min-height:100%; overflow:visible; background:var(--page-bg-base); color:var(--text); font-family:var(--font-sans); }
    .g-wrap { max-width:1080px; margin:0 auto; padding:calc(26px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
    button { font-family:inherit; }
    :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

    /* Code gate */
    .g-gate { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .g-gate-card {
      width:100%; max-width:320px; text-align:center; padding:32px 26px;
      background:var(--glass-large-bg); border:1px solid var(--glass-large-border);
      border-radius:var(--r-lg); backdrop-filter:blur(var(--lg-frost-large)) saturate(180%);
      -webkit-backdrop-filter:blur(var(--lg-frost-large)) saturate(180%);
    }
    .g-dots { display:flex; gap:9px; justify-content:center; margin:18px 0 20px; }
    .g-dot { width:12px; height:12px; border-radius:50%; background:var(--glass-pill-bg); border:1px solid var(--hair-strong); transition:background 140ms; }
    .g-dot.on { background:var(--brand); border-color:transparent; }
    .g-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .g-key {
      font-family:inherit; font-size:19px; font-weight:600; padding:14px 0; cursor:pointer;
      border-radius:var(--r-md); border:1px solid var(--glass-small-border);
      background:var(--glass-pill-bg); color:var(--text);
    }
    .g-key:active { background:var(--glass-pill-bg-active); }
    .g-key.wide { grid-column:span 2; }
    .g-err { color:var(--red); font-size:13px; min-height:18px; margin-top:12px; }

    /* Launcher: header */
    .g-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:22px; }
    .g-head > div:first-child { min-width:0; }
    .g-eyebrow { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--text-3); }
    .g-h1 { margin:4px 0 0; font-size:32px; font-weight:800; letter-spacing:-.035em; }
    .g-sub { margin:6px 0 0; font-size:13px; color:var(--text-3); }
    .g-backlink { flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border-radius:var(--r-pill); font-size:13px; font-weight:600; color:var(--text-2); background:var(--glass-pill-bg); text-decoration:none; }
    .g-backlink:hover { color:var(--text); }
    .g-sec { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin:0 0 10px; }

    /* Launcher: featured hero */
    .g-hero {
      position:relative; display:grid; grid-template-columns:1fr auto; align-items:center; gap:18px;
      width:100%; text-align:left; cursor:pointer; overflow:hidden; isolation:isolate;
      padding:26px 28px; margin:0 0 26px; border:0; border-radius:14px; color:#fff;
      background:#1a1230; min-height:190px;
    }
    .g-hero::before {
      content:''; position:absolute; inset:-40%; z-index:-2;
      background:
        radial-gradient(closest-side at 30% 35%, rgba(167,139,250,.75), transparent),
        radial-gradient(closest-side at 70% 65%, rgba(236,72,153,.55), transparent),
        radial-gradient(closest-side at 55% 20%, rgba(56,189,248,.45), transparent),
        linear-gradient(135deg, #24164a, #110b22);
      animation:gDrift 16s ease-in-out infinite alternate;
    }
    .g-hero::after { content:''; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg, rgba(10,6,20,.55), rgba(10,6,20,0) 70%); }
    .g-hero-kicker { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.8); }
    .g-hero-new { padding:3px 8px; border-radius:var(--r-pill); background:#fff; color:#1a1230; letter-spacing:.06em; }
    .g-hero-title { font-size:clamp(24px, 4vw, 36px); font-weight:850; letter-spacing:-.035em; line-height:1.02; margin:10px 0 8px; }
    .g-hero-desc { font-size:14px; color:rgba(255,255,255,.78); max-width:420px; line-height:1.45; }
    .g-hero-cta { display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:10px 18px; border-radius:var(--r-pill); background:#fff; color:#1a1230; font-weight:750; font-size:14px; transition:transform 160ms var(--ease); }
    .g-hero:hover .g-hero-cta { transform:translateX(3px); }
    .g-hero-best { margin-left:10px; font-size:12.5px; color:rgba(255,255,255,.75); font-weight:600; }
    .g-fan { position:relative; width:230px; height:150px; margin-right:18px; }
    .g-fan > div {
      position:absolute; top:10px; width:128px; height:128px; border-radius:10px; overflow:hidden;
      background:linear-gradient(140deg, rgba(255,255,255,.18), rgba(255,255,255,.04));
      box-shadow:0 18px 40px rgba(0,0,0,.45); transition:transform 380ms var(--ease);
    }
    .g-fan img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity 300ms; }
    .g-fan img.ok { opacity:1; }
    .g-fan > div:nth-child(1) { left:0; transform:rotate(-12deg) translateY(8px); }
    .g-fan > div:nth-child(2) { left:52px; transform:rotate(0deg); z-index:2; }
    .g-fan > div:nth-child(3) { left:104px; transform:rotate(11deg) translateY(8px); }
    .g-hero:hover .g-fan > div:nth-child(1) { transform:rotate(-17deg) translate(-10px, 10px); }
    .g-hero:hover .g-fan > div:nth-child(3) { transform:rotate(16deg) translate(10px, 10px); }
    .g-hero:hover .g-fan > div:nth-child(2) { transform:translateY(-6px); }

    /* Launcher: recently played */
    .g-recent { display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; margin:0 -18px 24px; padding:2px 18px 4px; }
    .g-recent::-webkit-scrollbar { display:none; }
    .g-rp {
      flex:0 0 auto; display:flex; align-items:center; gap:10px; min-height:52px; padding:6px 14px 6px 6px;
      border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text);
      cursor:pointer; text-align:left; transition:transform 160ms var(--ease), background 160ms;
    }
    .g-rp:hover { background:var(--surface-2); transform:translateY(-1px); }
    .g-rp-ico { width:40px; height:40px; border-radius:9px; display:grid; place-items:center; font-size:20px; color:#fff; }
    .g-rp-name { font-size:13px; font-weight:700; white-space:nowrap; }
    .g-rp-best { font-size:11.5px; color:var(--text-3); white-space:nowrap; font-variant-numeric:tabular-nums; }

    /* Launcher: filters */
    .g-filters { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -18px 16px; padding:2px 18px; }
    .g-filters::-webkit-scrollbar { display:none; }
    .g-fchip {
      flex:0 0 auto; min-height:36px; padding:0 14px; border-radius:var(--r-pill); cursor:pointer;
      border:1px solid var(--border); background:transparent; color:var(--text-2); font-size:13px; font-weight:600;
      transition:background 140ms, color 140ms;
    }
    .g-fchip:hover { color:var(--text); background:var(--glass-pill-bg); }
    .g-fchip[aria-pressed="true"] { background:var(--text); color:var(--page-bg-base); border-color:transparent; }
    .g-fchip .n { opacity:.55; font-weight:600; margin-left:4px; font-variant-numeric:tabular-nums; }

    /* Launcher: cards */
    .g-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(188px,1fr)); gap:16px; perspective:1200px; }
    .g-card {
      position:relative; display:flex; flex-direction:column; cursor:pointer; border-radius:12px; overflow:hidden; text-align:left;
      padding:0; color:var(--text); background:var(--surface); border:1px solid var(--border);
      transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));
      transition:transform 220ms var(--ease), box-shadow 220ms var(--ease), border-color 220ms;
      will-change:transform; animation:gIn 420ms var(--ease) both; animation-delay:calc(var(--i,0) * 22ms);
    }
    .g-card:hover { --ty:-4px; box-shadow:0 16px 36px rgba(0,0,0,.28); border-color:var(--hair-strong); }
    .g-card.tilting { transition:transform 60ms linear, box-shadow 220ms var(--ease); }
    .g-card::after {
      content:''; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 200ms;
      background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.14), transparent 45%);
    }
    .g-card:hover::after { opacity:1; }
    .g-thumb { position:relative; width:100%; aspect-ratio:16/10; display:grid; place-items:center; overflow:hidden; isolation:isolate; }
    .g-thumb::before {
      content:''; position:absolute; inset:-60%; z-index:-1;
      background:radial-gradient(closest-side at 35% 35%, rgba(255,255,255,.28), transparent 70%),
                 radial-gradient(closest-side at 70% 70%, rgba(0,0,0,.35), transparent 70%);
      animation:gDrift 11s ease-in-out infinite alternate; animation-delay:calc(var(--i,0) * -1.3s);
    }
    .g-ico { font-size:46px; line-height:1; filter:drop-shadow(0 6px 14px rgba(0,0,0,.35)); transition:transform 260ms var(--ease); }
    .g-ico svg { width:50px; height:50px; display:block; color:#fff; }
    .g-card:hover .g-ico { transform:scale(1.1) rotate(-4deg); }
    .g-tag {
      position:absolute; top:10px; left:10px; padding:3px 8px; border-radius:var(--r-pill);
      font-size:10.5px; font-weight:750; letter-spacing:.06em; text-transform:uppercase;
      color:#fff; background:rgba(0,0,0,.32); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    }
    .g-newtag { position:absolute; top:10px; right:10px; padding:3px 8px; border-radius:var(--r-pill); font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; background:#fff; color:#1a1230; }
    .g-card-body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:3px; flex:1; }
    .g-card-name { font-size:15px; font-weight:750; letter-spacing:-.01em; }
    .g-card-desc { font-size:12px; color:var(--text-3); line-height:1.4; }
    .g-card-foot { margin-top:auto; padding-top:10px; }
    .g-bestchip {
      flex:0 0 auto; display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:var(--r-pill);
      font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums;
      background:var(--brand-bg); color:var(--brand-text);
    }
    .g-bestchip svg { width:12px; height:12px; }
    .g-bestchip[hidden] { display:none; }
    .g-bestchip { white-space:nowrap; }
    .g-bestchip.none { background:transparent; color:var(--text-3); padding-left:0; font-weight:600; }
    .g-empty { grid-column:1/-1; padding:30px; text-align:center; color:var(--text-3); font-size:13px; }

    /* Stage */
    .g-stage { display:none; }
    .g-stage.on { display:block; }
    .g-bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    .g-titlecol { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; padding:0 4px; }
    .g-titlerow { display:flex; align-items:center; gap:8px; min-width:0; }
    .g-titlerow .g-bestchip { padding:2px 8px; font-size:11px; }
    #gtitle { font-weight:800; font-size:17px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .g-score { font-size:13px; color:var(--text-2); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .g-ib {
      flex:0 0 auto; width:40px; height:40px; display:grid; place-items:center; border-radius:var(--r-pill);
      border:0; cursor:pointer; background:var(--glass-pill-bg); color:var(--text); transition:background 140ms, transform 140ms;
    }
    .g-ib:hover { background:var(--glass-pill-bg-active, var(--surface-3)); }
    .g-ib:active { transform:scale(.94); }
    .g-ib svg { width:18px; height:18px; }
    .g-ib[hidden] { display:none; }
    .g-mountwrap { position:relative; }
    #gmount canvas {
      display:block; width:auto; height:auto; max-width:100%; max-height:calc(100vh - 210px); max-height:calc(100svh - 210px);
      margin:0 auto; border-radius:12px; background:#0d0c12; touch-action:none; box-shadow:0 10px 30px rgba(0,0,0,.16);
    }
    .g-hint { font-size:12.5px; color:var(--text-3); margin-top:12px; text-align:center; }
    .g-keys { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--text-3); }
    .g-keys kbd { display:inline-block; min-width:18px; padding:1px 6px; margin-right:4px; border-radius:5px; border:1px solid var(--border); background:var(--surface); font:600 11px var(--font-sans); color:var(--text-2); text-align:center; }
    @media (pointer:coarse) { .g-keys { display:none; } }
    #g2048, #gmines { display:grid; gap:8px; margin:0 auto; touch-action:none; }
    .cell {
      display:grid; place-items:center; border-radius:var(--r-sm); font-weight:800;
      background:var(--glass-pill-bg); aspect-ratio:1; font-size:clamp(14px,4.5vw,26px);
      user-select:none;
    }
    .mcell { font-size:clamp(11px,3.4vw,17px); cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -2px 0 rgba(0,0,0,.14); }
    .mcell.open { cursor:default; box-shadow:inset 0 0 0 1px var(--border); }
    .g-over2048 { position:absolute; inset:0; display:grid; place-items:center; border-radius:var(--r-md); background:rgba(10,8,18,.62); color:#fff; font-weight:800; font-size:20px; text-align:center; }
    .g-calls { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
    .g-call {
      min-height:44px; padding:0 18px; border-radius:var(--r-pill); border:1px solid var(--border); cursor:pointer;
      background:var(--surface); color:var(--text); font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:8px;
    }
    .g-call:hover:not(:disabled) { background:var(--surface-2); }
    .g-call:disabled { opacity:.4; cursor:default; }
    .g-call kbd { font:700 11px var(--font-sans); padding:1px 6px; border-radius:5px; background:var(--glass-pill-bg); color:var(--text-2); }
    @media (pointer:coarse) { .g-call kbd { display:none; } }

    /* Pause */
    .g-pause {
      position:absolute; inset:0; z-index:5; display:none; place-items:center; border-radius:12px;
      background:rgba(8,6,14,.58); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#fff;
    }
    .g-pause.on { display:grid; animation:gFade 180ms ease both; }
    .g-pause-in { text-align:center; }
    .g-pause-t { font-size:26px; font-weight:850; letter-spacing:-.03em; }
    .g-pause-s { font-size:13px; opacity:.75; margin:4px 0 16px; }
    .g-pause-btn { min-height:44px; padding:0 22px; border:0; border-radius:var(--r-pill); background:#fff; color:#15101f; font-weight:750; font-size:14px; cursor:pointer; }

    /* Fullscreen */
    #stage:fullscreen { background:var(--page-bg-base); padding:18px max(18px, env(safe-area-inset-left)); overflow:auto; }
    #stage:fullscreen #gmount canvas { max-height:calc(100vh - 150px); }
    #stage:-webkit-full-screen { background:var(--page-bg-base); padding:18px; overflow:auto; width:100%; height:100%; box-sizing:border-box; }

    /* New best */
    #gCelebrate { position:fixed; inset:0; z-index:9998; pointer-events:none; }
    .g-nb {
      position:fixed; left:50%; top:22%; z-index:9999; pointer-events:none; text-align:center;
      padding:16px 28px 18px; border-radius:18px; color:#fff;
      background:linear-gradient(135deg, #7c5cff, #d946ef); box-shadow:0 24px 60px rgba(124,92,255,.45);
      transform:translate(-50%, 0) scale(.6); opacity:0;
    }
    .g-nb.on { animation:gPop 2600ms var(--ease) both; }
    .g-nb-k { font-size:11px; font-weight:850; letter-spacing:.16em; text-transform:uppercase; opacity:.9; }
    .g-nb-v { font-size:30px; font-weight:900; letter-spacing:-.03em; margin-top:2px; font-variant-numeric:tabular-nums; }
    .g-nb-g { font-size:12px; opacity:.85; margin-top:2px; }

    /* Higher or Lower */
    .hl { max-width:640px; margin:0 auto; }
    .hl-q { text-align:center; font-size:15px; color:var(--text-2); margin:0 0 16px; line-height:1.4; }
    .hl-q b { color:var(--text); }
    .hl-arena { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .hl-vs {
      position:absolute; left:50%; top:calc(50% - 30px); transform:translate(-50%,-50%); z-index:3;
      width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
      background:var(--page-bg-base); color:var(--text); font-size:13px; font-weight:900; letter-spacing:.04em;
      box-shadow:0 0 0 6px var(--page-bg-base), 0 0 0 7px var(--border);
    }
    .hl-card {
      position:relative; display:flex; flex-direction:column; min-width:0; border-radius:14px; padding:10px;
      background:var(--surface); border:1px solid var(--border);
      transition:border-color 240ms, box-shadow 240ms, transform 240ms var(--ease), opacity 240ms;
      animation:gIn 420ms var(--ease) both;
    }
    .hl-card[data-side="1"] { animation-delay:70ms; }
    .hl-card.out { animation:hlOut 260ms var(--ease) both; }
    .hl-art {
      position:relative; display:block; aspect-ratio:1; border-radius:10px; overflow:hidden; cursor:pointer;
      background:linear-gradient(140deg, var(--surface-2), var(--surface-3)); color:var(--text);
      -webkit-tap-highlight-color:transparent;
    }
    .hl-art img { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; display:block; transition:transform 400ms var(--ease), opacity 300ms; opacity:0; }
    .hl-art img.ok { opacity:1; }
    .hl-art .ph { position:absolute; inset:0; display:grid; place-items:center; font-size:34px; font-weight:900; letter-spacing:-.04em; color:var(--text-3); }
    .hl-card.pickable .hl-art:hover img { transform:scale(1.04); }
    .hl-pickcue {
      position:absolute; z-index:2; left:50%; bottom:12px; transform:translate(-50%, 6px); opacity:0; white-space:nowrap;
      padding:7px 14px; border-radius:var(--r-pill); background:rgba(0,0,0,.6); color:#fff; font-size:12.5px; font-weight:750;
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:opacity 180ms, transform 180ms var(--ease); pointer-events:none;
    }
    .hl-card.pickable .hl-art:hover .hl-pickcue, .hl-card.pickable .hl-art:focus-visible .hl-pickcue { opacity:1; transform:translate(-50%, 0); }
    .hl-open {
      position:absolute; z-index:2; top:8px; right:8px; display:none; align-items:center; gap:5px; padding:6px 10px; border-radius:var(--r-pill);
      background:rgba(0,0,0,.6); color:#fff; font-size:11.5px; font-weight:750; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    }
    .hl-open svg { width:12px; height:12px; }
    .hl-card.revealed .hl-open { display:inline-flex; }
    .hl-meta { padding:10px 4px 12px; min-width:0; }
    .hl-title { font-size:15px; font-weight:800; letter-spacing:-.015em; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.5em; }
    .hl-by { font-size:12.5px; color:var(--text-3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hl-era { display:inline-block; max-width:100%; margin-top:8px; padding:3px 8px; border-radius:var(--r-pill); background:var(--glass-pill-bg); color:var(--text-2); font-size:11px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:top; }
    .hl-plate { margin-top:auto; height:58px; perspective:600px; }
    .hl-plate-in { position:relative; height:100%; transform-style:preserve-3d; transition:transform 620ms cubic-bezier(.3,1.35,.5,1); }
    .hl-card.revealed .hl-plate-in { transform:rotateX(180deg); }
    .hl-card[data-side="1"].revealed .hl-plate-in { transition-delay:110ms; }
    .hl-f, .hl-b {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:10px;
      backface-visibility:hidden; -webkit-backface-visibility:hidden; font-variant-numeric:tabular-nums;
    }
    .hl-f { background:var(--glass-pill-bg); color:var(--text-3); font-size:13px; font-weight:700; }
    .hl-f b { font-size:22px; font-weight:900; color:var(--text-2); }
    .hl-b { transform:rotateX(180deg); background:var(--surface-2); color:var(--text); }
    .hl-b .r { font-size:28px; font-weight:900; letter-spacing:-.03em; }
    .hl-b .o { font-size:12px; color:var(--text-3); font-weight:650; }
    .hl-card.win { border-color:rgba(74,222,128,.7); box-shadow:0 0 0 3px rgba(74,222,128,.18); }
    .hl-card.win .hl-b { background:rgba(74,222,128,.16); }
    .hl-card.win .hl-b .r { color:var(--green); }
    .hl-card.lose { opacity:.72; }
