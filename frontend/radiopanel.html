<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — radio panel</title>
  <link rel="stylesheet" href="/css/style.css?v=202609072002">
  <style>
    .rp-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:var(--surface-2); margin-bottom:6px; }
    .rp-row img, .rp-row .ph { width:36px; height:36px; border-radius:6px; object-fit:cover; background:var(--surface); flex-shrink:0; }
    .rp-row .t { font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rp-row .a { font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rp-row.playing { outline:2px solid var(--brand); }
    .rp-btn { background:transparent; border:1px solid var(--hair); color:var(--text); border-radius:8px; padding:5px 9px; font-size:12px; cursor:pointer; white-space:nowrap; }
    .rp-btn:hover { background:var(--surface); }
    .rp-btn.brand { background:var(--brand); color:var(--on-brand); border-color:transparent; font-weight:700; }
    .rp-btn.danger { color:var(--red); }
    .rp-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width: 860px) { .rp-col { grid-template-columns:1fr; } }
    .rp-res { max-height:340px; overflow:auto; }
    .rp-actions { display:flex; gap:6px; margin-left:auto; flex-shrink:0; }
  </style>
</head>
<body>
<div id="view"><div class="wv-empty">Loading…</div></div>

<script src="/js/api.js?v=202609072002"></script>
<script src="/js/layout.js?v=202609072002"></script>
<script src="/js/player.js?v=202609072002"></script>
<script>
var _mine = null, _stId = new URLSearchParams(location.search).get('s'), _st = null, _isMod = false, _playlist = [], _queue = [], _search = { tracks: [], albums: [] }, _durCache = {};

function fmtN(n) { n = Number(n || 0); return n.toLocaleString(); }
function fmtDur(s) { if (!s) return '—'; s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

async function init() {
  var view = document.getElementById('view');
  if (!isLoggedIn()) { view.innerHTML = '<div class="wv-empty">Log in to manage a station.</div>'; return; }
  try {
    _mine = await api('/radio/mine');
    _isMod = !!_mine.is_mod;
    if (!_mine.available) { view.innerHTML = '<h1 class="wv-page-title">Radio panel</h1><div class="wv-empty">Radio is not set up on the server yet (run RADIO_SQL.md).</div>'; return; }
    if (!_stId && _mine.stations.length === 1) _stId = _mine.stations[0].id;
    renderShell();
    if (_stId) await openStation(_stId);
  } catch (e) { view.innerHTML = '<div class="wv-empty">' + escHtml(e.message) + '</div>'; }
}

function renderShell() {
  var view = document.getElementById('view');
  var list = _mine.stations.map(function(s) {
    return '<button class="wv-pill' + (s.id === _stId ? ' brand' : '') + '" onclick="openStation(\'' + s.id + '\')">' + escHtml(s.name) + (s.owner && _isMod ? ' <span style="opacity:.6;font-weight:500;">· ' + escHtml(s.owner.name) + '</span>' : '') + '</button>';
  }).join(' ');
  view.innerHTML =
    '<h1 class="wv-page-title">Radio panel</h1>' +
    '<div style="color:var(--text-2);font-size:14px;margin:-6px 0 16px;">Your station plays around the clock: anything you queue plays first, then the playlist loops.</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">' + (list || '<span style="color:var(--text-3);font-size:13px;">You don\'t have a station yet.</span>') +
      (_isMod ? '<button class="wv-pill" onclick="createStation()">+ New station</button>' : '') + '</div>' +
    '<div id="station"></div>';
}

async function createStation() {
  var name = prompt('Station name'); if (!name) return;
  var username = prompt('Give it to which wavernrs username? (blank = you)') || '';
  try { var d = await api('/radio/stations', { method: 'POST', body: JSON.stringify({ name: name, username: username.trim() || undefined }) }); _mine = await api('/radio/mine'); _stId = d.station.id; renderShell(); openStation(_stId); }
  catch (e) { alert(e.message); }
}

async function openStation(id) {
  _stId = id;
  history.replaceState(null, '', '/radiopanel.html?s=' + encodeURIComponent(id));
  var d = await api('/radio/stations/' + id);
  _st = d.station; _st._now = d.now; _st._up = d.up_next;
  renderShell();
  document.getElementById('station').innerHTML =
    '<div class="wv-card" style="padding:20px;margin-bottom:16px;">' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">' +
        '<div style="flex:1;min-width:240px;">' +
          '<div style="font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">Station</div>' +
          '<input class="wv-input" id="st-name" value="' + escHtml(_st.name) + '" placeholder="Station name" style="font-size:16px;font-weight:700;margin-bottom:8px;">' +
          '<textarea class="wv-input" id="st-desc" rows="2" placeholder="Description (optional)" style="margin-bottom:8px;">' + escHtml(_st.description || '') + '</textarea>' +
          '<input class="wv-input" id="st-cover" value="' + escHtml(_st.cover_url || '') + '" placeholder="Cover image URL (optional, falls back to the playing track\'s cover)" style="margin-bottom:8px;">' +
          '<label style="font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:8px;margin-bottom:10px;"><input type="checkbox" id="st-shuffle"' + (_st.shuffle ? ' checked' : '') + '> Shuffle the playlist</label>' +
          (_isMod ? '<input class="wv-input" id="st-owner" placeholder="Hand to username (mods)" style="margin-bottom:8px;">' : '') +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="wv-pill brand" onclick="saveStation()">Save</button>' +
          '<a class="wv-pill" href="/radio.html?s=' + encodeURIComponent(_st.slug) + '">Open station</a>' +
          (_isMod ? '<button class="wv-pill" style="color:var(--red);" onclick="deleteStation()">Delete</button>' : '') + '</div>' +
          '<div id="st-msg" style="font-size:12px;color:var(--text-3);margin-top:8px;"></div>' +
        '</div>' +
        '<div style="width:260px;max-width:100%;">' +
          '<div style="font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">On air now</div>' +
          '<div id="st-now" style="font-size:14px;"></div>' +
          '<div style="display:flex;gap:6px;margin-top:10px;"><button class="rp-btn" onclick="skip()">Skip ⏭</button></div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-top:10px;">♥ ' + fmtN(_st.likes) + ' likes</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="wv-card" style="padding:20px;margin-bottom:16px;">' +
      '<div style="font-size:15px;font-weight:700;margin-bottom:10px;">Add music</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:10px;"><input class="wv-input" id="q" placeholder="Search tracks and comps…" oninput="searchDebounced()" style="flex:1;"></div>' +
      '<div class="rp-res" id="results"><div style="font-size:13px;color:var(--text-3);">Search for a track or a whole comp, then add it to the playlist, queue it, or play it right now.</div></div>' +
    '</div>' +
    '<div class="rp-col">' +
      '<div class="wv-card" style="padding:20px;"><div style="display:flex;align-items:center;margin-bottom:10px;"><div style="font-size:15px;font-weight:700;">Queue <span id="q-count" style="color:var(--text-3);font-weight:500;"></span></div><div class="rp-actions"><button class="rp-btn danger" onclick="clearList(\'queue\')">Clear</button></div></div><div style="font-size:12px;color:var(--text-3);margin-bottom:8px;">Plays next, in order, before going back to the playlist.</div><div id="queue"></div></div>' +
      '<div class="wv-card" style="padding:20px;"><div style="display:flex;align-items:center;margin-bottom:10px;"><div style="font-size:15px;font-weight:700;">Playlist <span id="p-count" style="color:var(--text-3);font-weight:500;"></span></div><div class="rp-actions"><button class="rp-btn danger" onclick="clearList(\'playlist\')">Clear</button></div></div><div style="font-size:12px;color:var(--text-3);margin-bottom:8px;">Loops forever. Drag handles to reorder.</div><div id="playlist"></div></div>' +
    '</div>';
  renderNow();
  await Promise.all([loadList('queue'), loadList('playlist')]);
  clearInterval(window._rpPoll); window._rpPoll = setInterval(refreshNow, 10000);
}

function renderNow() {
  var n = _st._now;
  document.getElementById('st-now').innerHTML = n && n.track
    ? '<div style="display:flex;gap:10px;align-items:center;">' + (n.track.cover_url ? '<img src="' + escHtml(n.track.cover_url) + '" style="width:48px;height:48px;border-radius:8px;object-fit:cover;">' : '') + '<div style="min-width:0;"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(n.track.title) + '</div><div style="font-size:12px;color:var(--text-2);">' + escHtml(n.track.artist) + ' · ' + (n.source === 'queue' ? 'from queue' : 'playlist') + '</div></div></div>'
    : '<div style="color:var(--text-3);">Nothing playing. Add tracks to the playlist.</div>';
}
async function refreshNow() { try { var d = await api('/radio/stations/' + _stId + '/now'); _st._now = d.now; renderNow(); } catch (e) {} }

async function saveStation() {
  var msg = document.getElementById('st-msg'); msg.textContent = 'Saving…';
  var body = { name: document.getElementById('st-name').value, description: document.getElementById('st-desc').value, cover_url: document.getElementById('st-cover').value, shuffle: document.getElementById('st-shuffle').checked };
  var ow = document.getElementById('st-owner'); if (ow && ow.value.trim()) body.owner_username = ow.value.trim();
  try { var d = await api('/radio/stations/' + _stId, { method: 'PATCH', body: JSON.stringify(body) }); _st = Object.assign(_st, d.station); msg.textContent = 'Saved.'; _mine = await api('/radio/mine'); renderShellKeep(); }
  catch (e) { msg.textContent = e.message; }
}
function renderShellKeep() { var keep = document.getElementById('station').innerHTML; renderShell(); document.getElementById('station').innerHTML = keep; }
async function deleteStation() { if (!confirm('Delete this station for good?')) return; await api('/radio/stations/' + _stId, { method: 'DELETE' }); _stId = null; _mine = await api('/radio/mine'); renderShell(); }
async function skip() { try { await api('/radio/stations/' + _stId + '/skip', { method: 'POST' }); await refreshNow(); loadList('queue'); loadList('playlist'); } catch (e) { alert(e.message); } }

var _sT = null;
function searchDebounced() { clearTimeout(_sT); _sT = setTimeout(doSearch, 300); }
async function doSearch() {
  var q = document.getElementById('q').value.trim();
  var box = document.getElementById('results');
  if (!q) { box.innerHTML = ''; return; }
  try {
    _search = await api('/radio/search?q=' + encodeURIComponent(q));
    var html = '';
    _search.albums.forEach(function(a) {
      html += '<div class="rp-row">' + (a.cover_url ? '<img src="' + escHtml(a.cover_url) + '">' : '<span class="ph"></span>') + '<div style="min-width:0;flex:1;"><div class="t">' + escHtml(a.title) + ' <span style="font-size:10px;color:var(--brand);font-weight:800;">COMP</span></div><div class="a">' + escHtml(a.artist) + (a.track_count ? ' · ' + a.track_count + ' tracks' : '') + '</div></div>' +
        '<div class="rp-actions"><button class="rp-btn" onclick="addAlbum(\'' + a.id + '\',\'playlist\')">+ Playlist</button><button class="rp-btn" onclick="addAlbum(\'' + a.id + '\',\'queue\')">+ Queue</button></div></div>';
    });
    _search.tracks.forEach(function(t) {
      html += '<div class="rp-row">' + (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '">' : '<span class="ph"></span>') + '<div style="min-width:0;flex:1;"><div class="t">' + escHtml(t.title) + '</div><div class="a">' + escHtml(t.artist) + (t.album_title ? ' · ' + escHtml(t.album_title) : '') + '</div></div>' +
        '<div class="rp-actions"><button class="rp-btn brand" onclick="playNow(\'' + t.id + '\')">Play now</button><button class="rp-btn" onclick="addTrack(\'' + t.id + '\',\'queue\')">+ Queue</button><button class="rp-btn" onclick="addTrack(\'' + t.id + '\',\'playlist\')">+ Playlist</button></div></div>';
    });
    box.innerHTML = html || '<div style="font-size:13px;color:var(--text-3);">Nothing found.</div>';
  } catch (e) { box.innerHTML = '<div style="font-size:13px;color:var(--red);">' + escHtml(e.message) + '</div>'; }
}

function measure(url) {
  return new Promise(function(res) {
    if (!url) return res(null);
    var a = new Audio(); a.preload = 'metadata';
    var done = false; var fin = function(v) { if (!done) { done = true; res(v); a.src = ''; } };
    a.addEventListener('loadedmetadata', function() { fin(isFinite(a.duration) ? a.duration : null); });
    a.addEventListener('error', function() { fin(null); });
    setTimeout(function() { fin(null); }, 15000);
    a.src = url;
  });
}
async function addTrack(id, kind) {
  var t = _search.tracks.find(function(x) { return x.id === id; });
  var durations = {};
  if (t && t.url) { var d = await measure(t.url); if (d) durations[id] = d; }
  try { await api('/radio/stations/' + _stId + '/items', { method: 'POST', body: JSON.stringify({ track_id: id, kind: kind, durations: durations }) }); toast('Added to ' + kind); loadList(kind); if (!_st._now) setTimeout(refreshNow, 2500); }
  catch (e) { alert(e.message); }
}
async function addAlbum(id, kind) {
  try { var d = await api('/radio/stations/' + _stId + '/items', { method: 'POST', body: JSON.stringify({ album_id: id, kind: kind }) }); toast(d.added + ' tracks added to ' + kind); loadList(kind); fillDurations(kind); if (!_st._now) setTimeout(refreshNow, 2500); }
  catch (e) { alert(e.message); }
}
async function playNow(trackId) {
  try { await api('/radio/stations/' + _stId + '/play-now', { method: 'POST', body: JSON.stringify({ track_id: trackId }) }); toast('Playing now'); refreshNow(); loadList('queue'); }
  catch (e) { alert(e.message); }
}
async function playItemNow(itemId) {
  try { await api('/radio/stations/' + _stId + '/play-now', { method: 'POST', body: JSON.stringify({ item_id: itemId }) }); toast('Playing now'); refreshNow(); loadList('queue'); loadList('playlist'); }
  catch (e) { alert(e.message); }
}
async function removeItem(itemId, kind) { try { await api('/radio/stations/' + _stId + '/items/' + itemId, { method: 'DELETE' }); loadList(kind); } catch (e) { alert(e.message); } }
async function clearList(kind) { if (!confirm('Clear the whole ' + kind + '?')) return; try { await api('/radio/stations/' + _stId + '/clear', { method: 'POST', body: JSON.stringify({ kind: kind }) }); loadList(kind); } catch (e) { alert(e.message); } }

async function loadList(kind) {
  var d = await api('/radio/stations/' + _stId + '/items?kind=' + kind);
  var items = d.items || [];
  if (kind === 'queue') _queue = items; else _playlist = items;
  document.getElementById(kind === 'queue' ? 'q-count' : 'p-count').textContent = items.length ? '(' + items.length + ')' : '';
  var box = document.getElementById(kind);
  if (!items.length) { box.innerHTML = '<div style="font-size:13px;color:var(--text-3);">' + (kind === 'queue' ? 'Queue is empty.' : 'Playlist is empty. Search above and add tracks or whole comps.') + '</div>'; return; }
  box.innerHTML = items.map(function(it, i) {
    var t = it.track || { title: '(missing track)', artist: '' };
    return '<div class="rp-row' + (it.playing ? ' playing' : '') + '" draggable="true" data-id="' + it.id + '" ondragstart="dragStart(event)" ondragover="event.preventDefault()" ondrop="dropOn(event,\'' + kind + '\')">' +
      '<span style="cursor:grab;color:var(--text-3);font-size:14px;">⋮⋮</span>' +
      (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '">' : '<span class="ph"></span>') +
      '<div style="min-width:0;flex:1;"><div class="t">' + (i + 1) + '. ' + escHtml(t.title) + (it.playing ? ' <span style="font-size:10px;color:var(--brand);font-weight:800;">ON AIR</span>' : '') + '</div><div class="a">' + escHtml(t.artist) + ' · ' + fmtDur(it.duration_sec) + '</div></div>' +
      '<div class="rp-actions"><button class="rp-btn" onclick="playItemNow(\'' + it.id + '\')">▶ Now</button><button class="rp-btn danger" onclick="removeItem(\'' + it.id + '\',\'' + kind + '\')">✕</button></div></div>';
  }).join('');
}
var _dragId = null;
function dragStart(e) { _dragId = e.currentTarget.dataset.id; e.dataTransfer.effectAllowed = 'move'; }
async function dropOn(e, kind) {
  e.preventDefault(); var target = e.currentTarget.dataset.id; if (!_dragId || _dragId === target) return;
  var list = (kind === 'queue' ? _queue : _playlist).map(function(x) { return x.id; });
  var from = list.indexOf(_dragId), to = list.indexOf(target); if (from < 0 || to < 0) return;
  list.splice(from, 1); list.splice(to, 0, _dragId); _dragId = null;
  try { await api('/radio/stations/' + _stId + '/items/order', { method: 'PUT', body: JSON.stringify({ ids: list }) }); loadList(kind); } catch (err) { alert(err.message); }
}
async function fillDurations(kind) {
  var items = (kind === 'queue' ? _queue : _playlist).filter(function(x) { return !x.duration_sec && x.track && x.track.url; }).slice(0, 40);
  for (var i = 0; i < items.length; i++) {
    var d = await measure(items[i].track.url);
    if (d) { try { await api('/radio/stations/' + _stId + '/items/' + items[i].id, { method: 'PATCH', body: JSON.stringify({ duration_sec: d }) }); } catch (e) {} }
  }
  if (items.length) loadList(kind);
}
function toast(msg) { if (typeof showToast === 'function') return showToast(msg); var t = document.createElement('div'); t.textContent = msg; t.style.cssText = 'position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--surface-2);color:var(--text);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.4);'; document.body.appendChild(t); setTimeout(function() { t.remove(); }, 1800); }
init();
</script>
</body>
</html>
