<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — songs</title>
  <link rel="stylesheet" href="/css/style.css?v=c716d7787bcc">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>
<script src="/js/api.js?v=c716d7787bcc"></script>
<script src="/js/layout.js?v=c716d7787bcc"></script>
<script src="/js/player.js?v=c716d7787bcc"></script>
<script src="/js/router.js?v=c716d7787bcc"></script>
<script src="/js/playlists.js?v=c716d7787bcc"></script>
<script>
var _songs = [];
var _songFilter = '';

function _songKeyFromUrl() {
  var m = /[?&]s=([^&]+)/.exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}

function _songCard(a) {
  var bg = (typeof coverGradient === 'function') ? coverGradient(a.album_title || '') : '#333';
  var img = a.cover_url
    ? '<img src="' + escHtml(a.cover_url) + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">'
    : '';
  var sub = (a.creator || 'Unknown') + (a.track_count > 1 ? ' · ' + a.track_count + ' tracks' : '');
  return '<div class="wv-comp-card" onclick="navigate(\'/album.html?id=' + a.album_id + '\')">' +
    '<div class="wv-comp-card-cover">' +
      '<div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
        img +
        '<button class="wv-cover-play-btn" title="Play" aria-label="Play" onclick="event.stopPropagation();playCompById(\'' + a.album_id + '\')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="wv-comp-card-title">' + escHtml(a.album_title || 'Untitled') + '</div>' +
    '<div class="wv-comp-card-artist">' + escHtml(sub) + '</div>' +
  '</div>';
}

function renderSongList() {
  var q = _songFilter.toLowerCase().replace(/[^a-z0-9]+/g, '');
  var list = q ? _songs.filter(function(s) {
    return s.key.indexOf(q) !== -1 || String(s.name).toLowerCase().replace(/[^a-z0-9]+/g, '').indexOf(q) !== -1;
  }) : _songs;
  var el = document.getElementById('song-list');
  if (!el) return;
  if (!list.length) { el.innerHTML = '<p style="color:var(--text-3);">No song matches that.</p>'; return; }
  el.innerHTML = list.map(function(s) {
    return '<a class="wv-songrow" href="/songs.html?s=' + encodeURIComponent(s.key) + '"' +
      ' onclick="navigate(this.getAttribute(\'href\'));return false;">' +
      '<span class="wv-songrow-name">' + escHtml(s.name) + '</span>' +
      '<span class="wv-songrow-count">' + s.comps + ' comps</span>' +
    '</a>';
  }).join('');
}

async function loadSongs() {
  var view = document.getElementById('view');
  view.innerHTML =
    '<div style="display:flex;flex-direction:column;gap:20px;">' +
      '<div>' +
        '<h1 class="wv-page-title">Songs</h1>' +
        '<div style="font-size:15px;font-weight:600;color:var(--text-2);margin-top:4px;">Every Ye song in the archive, and how many comps put it on the tracklist.</div>' +
      '</div>' +
      '<input id="song-q" class="wv-input" placeholder="Filter songs…" style="max-width:340px;">' +
      '<div id="song-list" class="wv-songgrid"><div class="loading"><div class="spinner"></div></div></div>' +
    '</div>';
  var box = document.getElementById('song-q');
  if (box) box.addEventListener('input', function() { _songFilter = box.value; renderSongList(); });
  try {
    var d = await api('/tracks/songs?limit=600');
    _songs = d.items || [];
    renderSongList();
  } catch (e) {
    document.getElementById('song-list').innerHTML = '<p style="color:var(--text-3);">Could not load the song list.</p>';
  }
}

async function loadOneSong(key) {
  var view = document.getElementById('view');
  view.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    var d = await api('/tracks/songs/' + encodeURIComponent(key));
    var items = d.items || [];
    view.innerHTML =
      '<div style="display:flex;flex-direction:column;gap:20px;">' +
        '<div>' +
          '<a href="/songs.html" onclick="navigate(\'/songs.html\');return false;" style="font-size:13px;font-weight:600;color:var(--text-2);text-decoration:none;">← All songs</a>' +
          '<h1 class="wv-page-title" style="margin-top:8px;">' + escHtml(d.song || key) + '</h1>' +
          '<div style="font-size:15px;font-weight:600;color:var(--text-2);margin-top:4px;">On ' + items.length + ' comp' + (items.length === 1 ? '' : 's') + ' in the archive.</div>' +
        '</div>' +
        '<div class="wv-comp-grid wv-comp-grid-4">' + items.map(_songCard).join('') + '</div>' +
      '</div>';
  } catch (e) {
    view.innerHTML = '<p style="color:var(--text-3);">Could not load that song.</p>';
  }
}

(function() {
  var k = _songKeyFromUrl();
  if (k) loadOneSong(k); else loadSongs();
})();
</script>
</body>
</html>
