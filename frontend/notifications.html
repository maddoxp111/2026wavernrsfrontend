<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notifications — wavernrs</title>
  <meta name="description" content="Likes, new followers, milestones, replies, leaks of songs you follow and listening parties, all in one place.">
  <link rel="stylesheet" href="/css/style.css?v=22a4399b3d96">
  <script src="/js/status-card.js?v=22a4399b3d96"></script>
  <script src="/js/down.js?v=22a4399b3d96"></script>
  <style>
    .nf-page { max-width: 920px; margin: 0 auto; padding: 8px 0 24px; }
    .nf-page [hidden] { display: none !important; }
    .nf-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 6px 0 18px; }
    .nf-head-main { flex: 1; min-width: 0; }
    .nf-title { margin: 0 0 6px !important; }
    .nf-sub { margin: 0; font-size: 14px; color: var(--text-2); display: flex; align-items: center; gap: 8px; min-height: 20px; }
    .nf-sub .nf-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 20%, transparent); }
    .nf-actions { display: flex; gap: 8px; align-items: center; }
    .nf-btn {
      display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px;
      border: 0; border-radius: 999px; background: var(--surface-2); color: var(--text);
      font: 600 13px var(--font-sans); cursor: pointer; white-space: nowrap;
      transition: background 120ms var(--ease), color 120ms var(--ease), transform 80ms var(--ease), opacity 120ms var(--ease);
    }
    .nf-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nf-btn:hover:not(:disabled) { background: var(--surface-3); }
    .nf-btn:active:not(:disabled) { transform: scale(.97); }
    .nf-btn:disabled { opacity: .45; cursor: default; }
    .nf-btn.primary { background: var(--text); color: var(--page-bg-base); }
    .nf-btn.primary:hover:not(:disabled) { background: var(--text); opacity: .88; }
    .nf-btn.danger { color: var(--red); }
    .nf-btn.confirm { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }

    .nf-chips { display: flex; flex-wrap: wrap; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; margin: 0 0 8px; -webkit-overflow-scrolling: touch; }
    .nf-chips::-webkit-scrollbar { display: none; }
    .nf-chip {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px;
      border: 0; border-radius: 999px; background: var(--surface-2); color: var(--text-2);
      font: 600 13px var(--font-sans); cursor: pointer; white-space: nowrap;
      transition: background 120ms var(--ease), color 120ms var(--ease);
    }
    .nf-chip:hover { color: var(--text); background: var(--surface-3); }
    .nf-chip.on { background: var(--text); color: var(--page-bg-base); }
    .nf-chip .c { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 10.5px; font-weight: 800; line-height: 18px; text-align: center; }
    .nf-chip .c:empty { display: none; }

    .nf-new {
      position: sticky; top: 8px; z-index: 3; display: flex; justify-content: center; height: 0; overflow: visible;
    }
    .nf-new button {
      display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; margin-top: 4px;
      border: 0; border-radius: 999px; background: var(--brand); color: var(--on-brand);
      font: 700 12.5px var(--font-sans); cursor: pointer; box-shadow: 0 10px 28px rgba(0,0,0,.35);
      animation: nf-drop .25s var(--ease);
    }
    .nf-new button svg { width: 14px; height: 14px; }
    @keyframes nf-drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    .nf-list { min-height: 200px; }
    .nf-day { display: flex; align-items: center; gap: 10px; padding: 18px 12px 8px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
    .nf-day::after { content: ''; flex: 1; height: 1px; background: var(--hair); }
    .nf-row {
      position: relative; display: flex; align-items: center; gap: 4px;
      border-radius: 12px; margin-bottom: 2px; transition: background 120ms var(--ease), opacity 200ms var(--ease);
    }
    .nf-row:hover { background: var(--surface-2); }
    .nf-row.unread { background: color-mix(in srgb, var(--brand) 7%, transparent); }
    .nf-row.unread:hover { background: color-mix(in srgb, var(--brand) 12%, transparent); }
    .nf-row::before {
      content: ''; position: absolute; left: 3px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%;
      background: var(--brand); opacity: 0; transform: scale(.4); transition: opacity 160ms var(--ease), transform 160ms var(--ease);
    }
    .nf-row.unread::before { opacity: 1; transform: none; }
    .nf-hit {
      flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 14px; padding: 14px 8px 14px 16px;
      color: inherit; text-decoration: none; border-radius: 12px; cursor: pointer;
    }
    .nf-hit:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
    .nf-hit .wvn-ic { width: 42px; height: 42px; }
    .nf-hit .wvn-ic svg { width: 20px; height: 20px; }
    .nf-txt { flex: 1; min-width: 0; padding-top: 1px; }
    .nf-t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14.5px; line-height: 1.38; font-weight: 500; color: var(--text-2); }
    .nf-row.unread .nf-t { color: var(--text); font-weight: 650; }
    .nf-b { margin-top: 3px; font-size: 13px; line-height: 1.45; color: var(--text-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nf-m { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--text-3); }
    .nf-m .wvn-k { color: var(--tone, var(--brand)); font-weight: 650; }
    .nf-m time { cursor: default; }
    .nf-acts { display: flex; gap: 2px; padding-right: 10px; opacity: 0; transition: opacity 120ms var(--ease); }
    .nf-row:hover .nf-acts, .nf-row:focus-within .nf-acts { opacity: 1; }
    .nf-act {
      width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%;
      background: transparent; color: var(--text-3); cursor: pointer; transition: background 120ms var(--ease), color 120ms var(--ease);
    }
    .nf-act svg { width: 17px; height: 17px; }
    .nf-act:hover { background: var(--surface-3); color: var(--text); }
    .nf-act.del:hover { color: var(--red); }
    .nf-row.out { opacity: 0; pointer-events: none; }

    .nf-sk { display: flex; gap: 14px; padding: 16px 16px; align-items: flex-start; }
    .nf-sk i { display: block; border-radius: 6px; background: var(--surface-2); animation: nf-pulse 1.1s ease-in-out infinite alternate; }
    .nf-sk .c { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; }
    .nf-sk .l { flex: 1; display: grid; gap: 9px; padding-top: 3px; }
    @keyframes nf-pulse { from { opacity: .45; } to { opacity: 1; } }

    .nf-empty { text-align: center; padding: 64px 20px 72px; }
    .nf-empty-art { position: relative; width: 96px; height: 96px; margin: 0 auto 20px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-bg); color: var(--brand); }
    .nf-empty-art svg { width: 40px; height: 40px; }
    .nf-empty-art::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--brand) 35%, transparent); }
    .nf-empty h2 { margin: 0 0 8px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
    .nf-empty p { margin: 0 auto; max-width: 400px; font-size: 14px; line-height: 1.55; color: var(--text-2); }
    .nf-empty .nf-cta { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    .nf-empty .nf-cta a { text-decoration: none; }

    .nf-foot { display: flex; justify-content: center; padding: 18px 0 8px; min-height: 40px; }
    .nf-end { font-size: 12.5px; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
    .nf-end::before, .nf-end::after { content: ''; width: 28px; height: 1px; background: var(--hair-strong); }

    @media (hover: none) {
      .nf-acts { opacity: 1; }
      .nf-act { width: 40px; height: 40px; color: var(--text-3); }
    }
    @media (max-width: 768px) {
      .nf-page { padding-top: 4px; }
      .nf-head { align-items: flex-start; gap: 12px; margin-bottom: 14px; }
      .nf-actions { width: 100%; }
      .nf-btn { height: 40px; }
      .nf-chip { height: 40px; }
      .nf-chips { flex-wrap: nowrap; margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; scroll-padding: 0 16px; }
      .nf-hit { gap: 12px; padding: 13px 4px 13px 14px; }
      .nf-hit .wvn-ic { width: 40px; height: 40px; }
      .nf-t { font-size: 14px; }
      .nf-b { font-size: 12.5px; }
      .nf-acts { padding-right: 2px; flex-direction: column; gap: 0; }
      .nf-day { padding-left: 8px; padding-right: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nf-sk i, .nf-new button { animation: none; }
      .nf-row, .nf-row::before { transition: none; }
    }
  </style>
</head>
<body>
<div id="view">
  <div class="nf-page">
    <div class="nf-head"><div class="nf-head-main"><h1 class="wv-page-title nf-title">Notifications</h1><p class="nf-sub">&nbsp;</p></div></div>
    <div class="nf-list" aria-busy="true"></div>
  </div>
</div>
<script src="/js/api.js?v=22a4399b3d96"></script>
<script src="/js/layout.js?v=22a4399b3d96"></script>
<script src="/js/player.js?v=22a4399b3d96"></script>
<script src="/js/router.js?v=22a4399b3d96"></script>
<script>
(function () {
  if (typeof initPlayer === 'function') initPlayer();
  window._pageCleanup = window._pageCleanup || [];

  var N = window.wvNotif;
  var S = window._nf = { filter: 'all', items: [], cursor: null, more: false, legacy: false, loading: false, gen: 0, confirmClear: null };

  var IC = {
    trash: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.6 2.8h4.8a1.6 1.6 0 0 1 1.6 1.6v.8h3.4a1.1 1.1 0 1 1 0 2.2h-.66l-.85 11.38A2.6 2.6 0 0 1 15.3 21.2H8.7a2.6 2.6 0 0 1-2.59-2.42L5.26 7.4H4.6a1.1 1.1 0 1 1 0-2.2H8v-.8a1.6 1.6 0 0 1 1.6-1.6Zm.6 2.2v.2h3.6V5Zm-.1 5a1 1 0 0 0-1 1.07l.35 5.5a1 1 0 1 0 2-.13l-.35-5.5a1 1 0 0 0-1-.94Zm3.8 0a1 1 0 0 0-1 .94l-.35 5.5a1 1 0 1 0 2 .13l.35-5.5a1 1 0 0 0-1-1.07Z"/></svg>',
    unread: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>',
  };
  var EMPTY = {
    all: ['No notifications yet', 'when someone likes your comps, follows your page, replies to you, or a song you follow leaks, it shows up here'],
    unread: ['You’re all caught up', 'nothing new since you last checked'],
    likes: ['No likes yet', 'when someone likes one of your comps or edits it shows up here'],
    followers: ['No followers yet', 'new followers of your artist page show up here'],
    milestones: ['No milestones yet', 'stream, like and follower milestones you hit show up here'],
    community: ['Nothing from the community yet', 'replies to your posts and comments show up here'],
    leaks: ['No leaks or tracker news yet', 'follow songs in the Ye archive to hear the moment they leak, and see when your comps land on a tracker'],
    lp: ['No listening parties yet', 'when an artist you follow goes live with a listening party, you’ll hear about it here'],
  };

  function esc(s) { return N ? N.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function view() { return document.getElementById('view'); }
  function $(id) { return document.getElementById(id); }

  function initialFilter() {
    var f = '';
    try { f = new URLSearchParams(location.search).get('f') || ''; } catch (_) {}
    var ok = N ? N.filters.some(function (x) { return x[0] === f; }) : false;
    return ok ? f : 'all';
  }

  function relTime(iso) {
    var a = N.ago(iso);
    if (a === 'now') return 'just now';
    return /^\d+[mhd]$/.test(a) ? a + ' ago' : a;
  }

  function groupLabel(iso) {
    var d = N.day(iso);
    if (d !== 'Earlier') return d;
    var dt = new Date(iso);
    if (isNaN(dt.getTime())) return 'Earlier';
    var o = { month: 'long' };
    if (dt.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    try { return dt.toLocaleDateString(undefined, o); } catch (_) { return 'Earlier'; }
  }

  function unreadIn(group) {
    var st = N.state;
    if (group === 'all') return 0;
    if (group === 'unread') return st.unread || 0;
    var types = N.typesFor(group);
    if (!st.byType) {
      return (st.items || []).filter(function (n) { return !n.read && types.indexOf(n.type) >= 0; }).length;
    }
    return types.reduce(function (sum, t) { return sum + (st.byType[t] || 0); }, 0);
  }

  function shellHTML() {
    return '<div class="nf-page">' +
      '<header class="nf-head">' +
        '<div class="nf-head-main"><h1 class="wv-page-title nf-title">Notifications</h1><p class="nf-sub" id="nf-sub" aria-live="polite">&nbsp;</p></div>' +
        '<div class="nf-actions">' +
          '<button type="button" class="nf-btn primary" id="nf-readall" onclick="window._nfReadAll()" disabled>' + N.icons.checks + '<span>Mark all read</span></button>' +
          '<button type="button" class="nf-btn" id="nf-clear" onclick="window._nfClear()" hidden>' + IC.trash + '<span>Clear read</span></button>' +
        '</div>' +
      '</header>' +
      '<div class="nf-chips" id="nf-chips" role="tablist" aria-label="Filter notifications">' +
        N.filters.map(function (f) {
          return '<button type="button" class="nf-chip" role="tab" aria-selected="false" data-f="' + f[0] + '" onclick="window._nfFilter(\'' + f[0] + '\')">' +
            esc(f[1]) + '<span class="c"></span></button>';
        }).join('') +
      '</div>' +
      '<div class="nf-new" id="nf-new" hidden></div>' +
      '<div class="nf-list" id="nf-list" role="list" aria-busy="true"></div>' +
      '<div class="nf-foot" id="nf-foot"></div>' +
    '</div>';
  }

  function skeleton(n) {
    var h = '';
    for (var i = 0; i < n; i++) {
      h += '<div class="nf-sk" aria-hidden="true"><i class="c"></i><span class="l">' +
        '<i style="height:13px;width:' + (72 - (i % 3) * 15) + '%"></i>' +
        '<i style="height:11px;width:' + (48 + (i % 2) * 20) + '%"></i>' +
        '<i style="height:9px;width:22%"></i></span></div>';
    }
    return h;
  }

  function rowHTML(n) {
    var m = N.meta(n.type);
    var href = N.href(n);
    var open = href
      ? '<a class="nf-hit" href="' + esc(href) + '">'
      : '<div class="nf-hit" role="button" tabindex="0">';
    var acts = '';
    if (!n.read) acts += '<button type="button" class="nf-act" data-act="read" aria-label="Mark as read" title="Mark as read">' + N.icons.check + '</button>';
    else if (N.state.manage) acts += '<button type="button" class="nf-act" data-act="unread" aria-label="Mark as unread" title="Mark as unread">' + IC.unread + '</button>';
    if (N.state.manage) acts += '<button type="button" class="nf-act del" data-act="del" aria-label="Delete notification" title="Delete">' + IC.trash + '</button>';
    return '<div class="nf-row' + (n.read ? '' : ' unread') + '" role="listitem" data-id="' + esc(n.id) + '" data-wvn-tone="' + m.tone + '">' +
      open + N.iconHTML(n.type) +
        '<span class="nf-txt">' +
          '<span class="nf-t">' + esc(n.title || m.label) + '</span>' +
          (n.body ? '<span class="nf-b">' + esc(n.body) + '</span>' : '') +
          '<span class="nf-m"><span class="wvn-k">' + esc(m.label) + '</span><span aria-hidden="true">·</span>' +
            '<time datetime="' + esc(n.created_at) + '" title="' + esc(N.abs(n.created_at)) + '">' + esc(relTime(n.created_at)) + '</time></span>' +
        '</span>' +
      (href ? '</a>' : '</div>') +
      (acts ? '<span class="nf-acts">' + acts + '</span>' : '') +
    '</div>';
  }

  function listHTML(items) {
    var html = '', last = '';
    items.forEach(function (n) {
      var g = groupLabel(n.created_at);
      if (g !== last) { html += '<div class="nf-day" role="presentation">' + esc(g) + '</div>'; last = g; }
      html += rowHTML(n);
    });
    return html;
  }

  function emptyHTML() {
    var e = EMPTY[S.filter] || EMPTY.all;
    var art = S.filter === 'unread' ? N.icons.check : (S.filter === 'all' ? N.icons.bell : (N.icons[N.meta(N.typesFor(S.filter)[0]).ic] || N.icons.bell));
    var cta = S.filter === 'all'
      ? '<div class="nf-cta"><a class="nf-btn primary" href="/browse">Browse music</a><a class="nf-btn" href="/resources">Follow songs in the Ye archive</a></div>'
      : '<div class="nf-cta"><button type="button" class="nf-btn" onclick="window._nfFilter(\'all\')">See all notifications</button></div>';
    return '<div class="nf-empty"><div class="nf-empty-art">' + art + '</div><h2>' + esc(e[0]) + '</h2><p>' + esc(e[1]) + '</p>' + cta + '</div>';
  }

  function paintHead() {
    var st = N.state;
    var sub = $('nf-sub');
    if (sub) {
      if (!st.countKnown && N.state.items === null) sub.innerHTML = '&nbsp;';
      else if (st.unread) sub.innerHTML = '<span class="nf-pulse" aria-hidden="true"></span>' + st.unread + ' unread';
      else sub.textContent = 'you’re all caught up';
    }
    var ra = $('nf-readall');
    if (ra) {
      var scoped = st.manage && S.filter !== 'all' && S.filter !== 'unread';
      var n = scoped ? unreadIn(S.filter) : st.unread;
      var anyUnreadRow = S.items.some(function (x) { return !x.read; });
      ra.disabled = !(n || anyUnreadRow);
      ra.querySelector('span').textContent = scoped ? 'Mark these read' : 'Mark all read';
    }
    var cl = $('nf-clear');
    if (cl) {
      cl.hidden = !st.manage;
      var anyRead = S.items.some(function (x) { return x.read; });
      if (!S.confirmClear) cl.disabled = !anyRead;
    }
    document.querySelectorAll('#nf-chips .nf-chip').forEach(function (c) {
      var f = c.getAttribute('data-f');
      var on = f === S.filter;
      c.classList.toggle('on', on);
      c.setAttribute('aria-selected', on ? 'true' : 'false');
      var cnt = unreadIn(f);
      var el = c.querySelector('.c');
      if (el) el.textContent = cnt ? (cnt > 99 ? '99+' : String(cnt)) : '';
    });
  }

  function paintList() {
    var list = $('nf-list'), foot = $('nf-foot');
    if (!list) return;
    list.setAttribute('aria-busy', 'false');
    if (!S.items.length) { list.innerHTML = emptyHTML(); if (foot) foot.innerHTML = ''; paintHead(); return; }
    list.innerHTML = listHTML(S.items);
    paintFoot();
    paintHead();
  }

  function paintFoot() {
    var foot = $('nf-foot');
    if (!foot) return;
    if (S.loading && S.items.length) foot.innerHTML = '<div class="spinner" style="width:22px;height:22px;"></div>';
    else if (S.more) foot.innerHTML = '<button type="button" class="nf-btn" id="nf-more" onclick="window._nfMore()">Load more</button>';
    else if (S.items.length > 6) foot.innerHTML = '<div class="nf-end">that’s everything</div>';
    else foot.innerHTML = '';
    watchMore();
  }

  function typesForFilter() {
    if (S.filter === 'all' || S.filter === 'unread') return null;
    return N.typesFor(S.filter);
  }

  function load(append) {
    var gen = ++S.gen;
    S.loading = true;
    var list = $('nf-list');
    if (!append) {
      S.items = []; S.cursor = null; S.more = false;
      if (list) { list.setAttribute('aria-busy', 'true'); list.innerHTML = skeleton(7); }
      var foot = $('nf-foot'); if (foot) foot.innerHTML = '';
    } else paintFoot();
    return N.list({ limit: 30, before: append ? S.cursor : null, types: typesForFilter(), unread: S.filter === 'unread' })
      .then(function (res) {
        if (gen !== S.gen || !$('nf-list')) return;
        S.loading = false;
        S.legacy = res.legacy;
        var seen = {};
        S.items.forEach(function (n) { seen[n.id] = 1; });
        res.items.forEach(function (n) { if (!seen[n.id]) S.items.push(n); });
        S.more = res.more && res.items.length > 0;
        var last = S.items[S.items.length - 1];
        S.cursor = last ? last.created_at : null;
        paintList();
      })
      .catch(function (err) {
        if (gen !== S.gen || !$('nf-list')) return;
        S.loading = false;
        if (append) {
          paintFoot();
          if (typeof wvToast === 'function') wvToast('couldn’t load more...try again', 'error');
          return;
        }
        var l = $('nf-list');
        if (l) { l.setAttribute('aria-busy', 'false'); l.innerHTML = typeof wvErrorHTML === 'function' ? wvErrorHTML(err, 'window._nfReload()') : 'Couldn’t load notifications'; }
      });
  }

  var io = null;
  function watchMore() {
    if (io) { io.disconnect(); io = null; }
    var btn = $('nf-more');
    if (!btn || !('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(function (es) {
      if (es.some(function (e) { return e.isIntersecting; }) && S.more && !S.loading) window._nfMore();
    }, { rootMargin: '300px 0px' });
    io.observe(btn);
  }

  function rowEl(id) {
    var rows = document.querySelectorAll('#nf-list .nf-row');
    for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute('data-id') === id) return rows[i];
    return null;
  }
  function item(id) {
    for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) return S.items[i];
    return null;
  }
  function repaintRow(n) {
    var el = rowEl(n.id);
    if (!el) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = rowHTML(n);
    var fresh = tmp.firstChild;
    var hadFocus = el.contains(document.activeElement);
    el.parentNode.replaceChild(fresh, el);
    if (hadFocus) { var h = fresh.querySelector('.nf-hit'); if (h) h.focus({ preventScroll: true }); }
  }
  function dropRow(id) {
    S.items = S.items.filter(function (n) { return n.id !== id; });
    var el = rowEl(id);
    if (!el) { paintHead(); return; }
    el.classList.add('out');
    setTimeout(function () {
      if (!S.items.length) { paintList(); return; }
      var prev = el.previousElementSibling, next = el.nextElementSibling;
      el.remove();
      if (prev && prev.classList.contains('nf-day') && (!next || next.classList.contains('nf-day'))) prev.remove();
      paintHead();
      paintFoot();
    }, 200);
  }

  function onNotif(e) {
    var d = e.detail || {};
    if (!$('nf-list')) return;
    if (d.op === 'read' || d.op === 'unread') {
      (d.ids || []).forEach(function (id) {
        var n = item(id);
        if (n) { n.read = d.op === 'read'; repaintRow(n); }
      });
    } else if (d.op === 'readall') {
      S.items.forEach(function (n) {
        if (!n.read && (!d.types || d.types.indexOf(n.type) >= 0)) { n.read = true; repaintRow(n); }
      });
    } else if (d.op === 'remove') {
      (d.ids || []).forEach(dropRow);
    } else if (d.op === 'clear') {
      S.items.filter(function (n) { return n.read; }).forEach(function (n) { dropRow(n.id); });
    } else if (d.op === 'new') {
      showNew((d.items || []).length);
    }
    if (!S.confirmClear) paintHead();
  }

  var _newCount = 0;
  function showNew(k) {
    var el = $('nf-new');
    if (!el || !k) return;
    if (!S.items.length && !S.loading) { load(false); return; }
    _newCount += k;
    el.hidden = false;
    el.innerHTML = '<button type="button" onclick="window._nfShowNew()">' + IC.up + _newCount + ' new notification' + (_newCount === 1 ? '' : 's') + '</button>';
  }

  window._nfShowNew = function () {
    _newCount = 0;
    var el = $('nf-new'); if (el) { el.hidden = true; el.innerHTML = ''; }
    var sc = document.getElementById('wv-content');
    if (sc) sc.scrollTo({ top: 0, behavior: 'smooth' });
    load(false);
  };
  window._nfReload = function () { load(false); };
  window._nfMore = function () { if (S.more && !S.loading) load(true); };
  window._nfFilter = function (f) {
    if (f === S.filter && S.items.length) return;
    S.filter = f;
    S.confirmClear = null;
    try {
      var u = new URL(location.href);
      if (f === 'all') u.searchParams.delete('f'); else u.searchParams.set('f', f);
      history.replaceState(history.state, '', u.pathname + u.search);
    } catch (_) {}
    paintHead();
    var chip = document.querySelector('#nf-chips .nf-chip.on');
    if (chip && chip.scrollIntoView) { try { chip.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); } catch (_) {} }
    load(false);
  };
  window._nfReadAll = function () {
    var scoped = N.state.manage && S.filter !== 'all' && S.filter !== 'unread';
    var p = N.markAll(scoped ? typesForFilter() : null);
    if (p && p.catch) p.catch(function () { if (typeof wvToast === 'function') wvToast('couldn’t mark them read...try again', 'error'); N.poll(); });
  };
  window._nfClear = function () {
    var btn = $('nf-clear');
    if (!btn) return;
    if (!S.confirmClear) {
      btn.classList.add('confirm');
      btn.querySelector('span').textContent = 'Clear all read?';
      S.confirmClear = setTimeout(function () {
        S.confirmClear = null;
        var b = $('nf-clear');
        if (b) { b.classList.remove('confirm'); b.querySelector('span').textContent = 'Clear read'; }
      }, 3500);
      return;
    }
    clearTimeout(S.confirmClear);
    S.confirmClear = null;
    btn.classList.remove('confirm');
    btn.querySelector('span').textContent = 'Clear read';
    btn.disabled = true;
    N.clearRead().then(function () {
      if (typeof wvToast === 'function') wvToast('cleared your read notifications', 'success');
    }).catch(function (err) {
      btn.disabled = false;
      if (typeof wvToast === 'function') wvToast((err && err.message) || 'couldn’t clear them...try again', 'error');
    });
  };

  function onClick(e) {
    var act = e.target.closest('.nf-act');
    var row = e.target.closest('.nf-row');
    if (!row) return;
    var n = item(row.getAttribute('data-id'));
    if (!n) return;
    if (act) {
      e.preventDefault();
      e.stopPropagation();
      var a = act.getAttribute('data-act');
      if (a === 'read') N.markRead(n);
      else if (a === 'unread') N.markUnread(n).catch(function () { N.poll(); });
      else if (a === 'del') {
        row.classList.add('out');
        N.remove(n).catch(function (err) {
          row.classList.remove('out');
          if (typeof wvToast === 'function') wvToast((err && err.message) || 'couldn’t delete that...try again', 'error');
        });
      }
      return;
    }
    var hit = e.target.closest('.nf-hit');
    if (!hit) return;
    var href = hit.getAttribute('href');
    if (href && (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1)) { N.markRead(n); return; }
    e.preventDefault();
    N.markRead(n);
    if (href && typeof navigate === 'function') navigate(href);
  }
  function onKey(e) {
    var hit = e.target.closest && e.target.closest('.nf-hit[role="button"]');
    if (hit && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); hit.click(); }
  }

  function signedOut() {
    view().innerHTML = '<div class="nf-page"><div class="nf-head"><div class="nf-head-main"><h1 class="wv-page-title nf-title">Notifications</h1></div></div>' +
      '<div class="nf-empty"><div class="nf-empty-art">' + (N ? N.icons.bell : '') + '</div>' +
      '<h2>Sign in to see your notifications</h2>' +
      '<p>likes on your comps, new followers, milestones, replies and leaks of songs you follow, all in one place</p>' +
      '<div class="nf-cta"><a class="nf-btn primary" href="/login">Log in</a><a class="nf-btn" href="/register">Create an account</a></div></div></div>';
  }

  function init() {
    if (typeof isLoggedIn === 'function' && !isLoggedIn()) { signedOut(); return; }
    if (!N) {
      view().innerHTML = '<div class="nf-page"><div class="nf-empty"><h2>Almost there</h2><p>wavernrs just updated...reload to open your notifications</p>' +
        '<div class="nf-cta"><button type="button" class="nf-btn primary" onclick="location.reload()">Reload</button></div></div></div>';
      return;
    }
    S.filter = initialFilter();
    view().innerHTML = shellHTML();
    paintHead();
    var listEl = $('nf-list');
    listEl.addEventListener('click', onClick);
    listEl.addEventListener('keydown', onKey);
    window.addEventListener('wv-notif', onNotif);
    window._pageCleanup.push(function () {
      window.removeEventListener('wv-notif', onNotif);
      if (io) { io.disconnect(); io = null; }
      if (S.confirmClear) clearTimeout(S.confirmClear);
      S.gen++;
    });
    if (typeof window.wvNotif.closePanel === 'function') window.wvNotif.closePanel();
    load(false);
    N.poll();
  }

  init();
})();
</script>
</body>
</html>
