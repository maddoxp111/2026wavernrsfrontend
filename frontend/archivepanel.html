<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — archive panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  initPlayer();

  // ── Auth + archiver check ────────────────────────────────────────────────────
  (function init() {
    var token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login.html'; return; }

    fetch(API_BASE + '/archive/check', {
      headers: { 'Authorization': 'Bearer ' + token },
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || !d.is_archiver) {
          document.getElementById('view').innerHTML =
            '<div style="padding:48px 24px;text-align:center;">' +
            '<div style="font-size:18px;font-weight:700;color:var(--red);margin-bottom:8px;">Access denied</div>' +
            '<div style="font-size:14px;color:var(--text-2);">You do not have archiver permissions.</div>' +
            '</div>';
          setTimeout(function() { window.location.href = '/index.html'; }, 2500);
          return;
        }
        renderShell();
      })
      .catch(function() {
        document.getElementById('view').innerHTML =
          '<div style="padding:48px 24px;text-align:center;color:var(--red);">Failed to verify archiver status.</div>';
      });
  })();

  function renderShell() {
    document.getElementById('view').innerHTML =
      '<div style="max-width:720px;">' +
        '<h1 style="font-size:28px;font-weight:800;margin:0 0 4px;">Archive Panel</h1>' +
        '<p style="font-size:14px;color:var(--text-2);margin:0 0 28px;line-height:1.55;">Upload archive comps — great releases by artists not on wavernrs, preserved for the community.</p>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--purple);">' +
          '<div style="font-size:13px;font-weight:700;color:var(--purple-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Archive uploads</div>' +
          '<p style="margin:0;font-size:14px;color:var(--text-2);line-height:1.6;">' +
            'Archive comps are comps by artists who are <strong style="color:var(--text-1);">not on the site</strong> but are too good to be lost. ' +
            'They do not create an artist account — the name you enter is display-only. ' +
            'Archive comps appear ONLY on the Archive page and in the Archived section of search.' +
          '</p>' +
        '</div>' +

        '<div style="margin-bottom:14px;">' +
          '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Artist name (display only) *</label>' +
          '<input type="text" id="arc-artist" class="wv-input" placeholder="e.g. Lil Uzi Vert" style="max-width:400px;">' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;">Import from link</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">Paste a public <b>untitled.stream</b>, <b>Samply</b>, or <b>mega.nz folder</b> link — pulls every track and the cover art. Mega folders: each audio file becomes a track (sorted by filename), and an image in the folder becomes the cover. Mega downloads route through Tor (rotating IP every 2 comps) so they\'re slower and an occasional track may fail — just re-import to pick up any that didn\'t.</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<input id="arc-import-url" class="wv-input" placeholder="untitled.stream/library/project/…, samply.app/p/…, or mega.nz/folder/…" style="flex:1;min-width:220px;">' +
            '<button class="wv-pill brand" id="arc-import-btn" onclick="startArchiveImport()">Import</button>' +
          '</div>' +
          '<div id="arc-import-status" style="margin-top:10px;font-size:13px;display:none;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:10px;">Manual upload</div>' +
          '<div class="wv-form-field" style="margin-bottom:10px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Comp title *</label>' +
            '<input type="text" id="arc-title" class="wv-input" placeholder="Comp name" style="max-width:400px;">' +
          '</div>' +
          '<div class="wv-form-field" style="margin-bottom:10px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Description</label>' +
            '<textarea id="arc-desc" class="wv-input" rows="2" placeholder="Optional…" style="resize:vertical;max-width:400px;"></textarea>' +
          '</div>' +
          '<div class="wv-form-field" style="margin-bottom:12px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Cover image</label>' +
            '<input type="file" id="arc-cover" accept="image/*" class="wv-input" style="padding:8px 12px;max-width:400px;">' +
          '</div>' +
          '<div class="wv-form-field" style="margin-bottom:12px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Audio files *</label>' +
            '<input type="file" id="arc-files" accept="audio/*" multiple class="wv-input" style="padding:8px 12px;max-width:400px;" onchange="arcRenderQueue()">' +
          '</div>' +
          '<div id="arc-queue" style="margin-bottom:14px;"></div>' +
          '<button class="wv-pill brand" id="arc-upload-btn" onclick="startArchiveUpload()">Upload Archive Comp</button>' +
          '<div id="arc-upload-status" style="margin-top:12px;font-size:13px;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-top:20px;">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;">Bulk import</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px;">Queue several comps at once — each row needs an <b>untitled.stream</b>, <b>Samply</b>, or <b>mega.nz folder</b> link and an artist name. Comps upload one at a time with a 5 second pause between each so Internet Archive doesn\'t rate-limit us.</div>' +
          '<div id="arc-bulk-rows"></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">' +
            '<button class="wv-pill" onclick="arcBulkAddRow()">+ Add row</button>' +
            '<button class="wv-pill brand" id="arc-bulk-btn" onclick="startArchiveBulk()">Upload All</button>' +
          '</div>' +
          '<div id="arc-bulk-status" style="margin-top:12px;font-size:13px;display:none;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-top:20px;border-left:4px solid var(--purple);">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;">MEGA folder bulk import</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px;">' +
            'Paste a <b>root MEGA folder</b> whose top-level sub-folders are each one comp. ' +
            'Every sub-folder is imported as a separate archive comp, sequentially. ' +
            'Folder names like <em>Artist – Title</em> automatically set the archive artist name — ' +
            'the fallback artist name below is used when the folder name has no dash separator. ' +
            'Already-imported folders (by URL) are skipped automatically so you can safely re-run.' +
          '</div>' +
          '<div style="margin-bottom:10px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:5px;">Root MEGA folder URL *</label>' +
            '<input id="arc-mega-bulk-url" class="wv-input" placeholder="https://mega.nz/folder/…#…" style="width:100%;max-width:540px;">' +
          '</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">' +
            '<div style="flex:1;min-width:180px;">' +
              '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:5px;">Fallback artist name *</label>' +
              '<input id="arc-mega-bulk-artist" class="wv-input" placeholder="e.g. Various Artists">' +
            '</div>' +
          '</div>' +
          '<button class="wv-pill" id="arc-mega-bulk-btn" onclick="scanMegaBulkFolder()">Scan Folder</button>' +
          '<div id="arc-mega-bulk-status" style="margin-top:12px;font-size:13px;display:none;"></div>' +
          '<div id="arc-mega-bulk-queue" style="margin-top:14px;display:none;"></div>' +
          '<button class="wv-pill brand" id="arc-mega-bulk-start-btn" style="display:none;margin-top:10px;" onclick="startMegaBulkImport()">Start Import</button>' +
          '<div id="arc-mega-bulk-log" style="margin-top:10px;max-height:280px;overflow-y:auto;font-size:12px;color:var(--text-3);font-family:monospace;display:none;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;" id="arc-audit-card">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;">Audit the archive</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">Checks every archive comp for duplicate tracks inside one comp, missing audio, empty comps, blank or format-looking artist names, and titles that still carry a format tag. Run it after a bulk import.</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="wv-pill" onclick="runArchiveAudit()">Run audit</button>' +
            '<button class="wv-pill" id="arc-fix-dupes-btn" style="display:none;" onclick="fixArchiveDuplicates()">Delete duplicate tracks</button>' +
          '</div>' +
          '<div id="arc-audit-status" style="margin-top:10px;font-size:13px;display:none;"></div>' +
          '<div id="arc-audit-out" style="margin-top:12px;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--red);">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;">Reset the archive</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">Deletes <b>every</b> archive comp and its tracks. Cannot be undone. Files already on Internet Archive are not touched. Use this before re-importing a whole collection from MEGA.</div>' +
          '<div id="arc-wipe-preview" style="font-size:13px;margin-bottom:10px;color:var(--text-2);">Loading count…</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +
            '<input id="arc-wipe-confirm" class="wv-input" placeholder="Type WIPE ARCHIVE" style="max-width:240px;">' +
            '<button class="wv-pill" style="background:var(--red);color:#fff;" onclick="runArchiveWipe()">Wipe archive</button>' +
          '</div>' +
          '<div id="arc-wipe-status" style="margin-top:10px;font-size:13px;display:none;"></div>' +
        '</div>' +
      '</div>';

    arcBulkAddRow();
    arcBulkAddRow();
    arcBulkAddRow();
    loadWipePreview();
  }

  // ── Audit ────────────────────────────────────────────────────────────────
  var _auditIssueIds = [];
  var ISSUE_LABEL = { empty: 'Empty comp', duplicate_tracks: 'Duplicate tracks', missing_audio: 'Missing audio', no_cover: 'No cover', no_artist: 'No artist', artist_looks_like_format: 'Artist looks like a format tag', title_needs_cleanup: 'Title needs cleanup', untitled_tracks: 'Untitled tracks' };
  window.runArchiveAudit = async function() {
    _arcStatus('arc-audit-status', 'Scanning every archive comp…');
    var out = document.getElementById('arc-audit-out'); out.innerHTML = '';
    try {
      var d = await api('/archive/audit');
      var bad = d.comps.filter(function(c) { return c.issues.length; });
      _auditIssueIds = bad.filter(function(c) { return c.issues.indexOf('duplicate_tracks') !== -1; }).map(function(c) { return c.id; });
      _arcStatus('arc-audit-status', d.total + ' comps · ' + d.tracks + ' tracks · ' + d.with_issues + ' with issues', d.with_issues ? 'var(--orange)' : 'var(--green)');
      document.getElementById('arc-fix-dupes-btn').style.display = _auditIssueIds.length ? '' : 'none';
      if (!bad.length) { out.innerHTML = '<div style="font-size:13px;color:var(--green);">Everything checks out.</div>'; return; }
      out.innerHTML = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">' +
        Object.keys(d.counts).map(function(k) { return '<span class="wv-chip">' + escHtml(ISSUE_LABEL[k] || k) + ' ' + d.counts[k] + '</span>'; }).join('') + '</div>' +
        '<div style="max-height:420px;overflow:auto;">' + bad.map(function(c) {
          return '<div style="padding:9px 0;border-top:1px solid var(--hair);font-size:13px;">' +
            '<a href="/album.html?id=' + escHtml(c.id) + '" style="font-weight:700;">' + escHtml(c.title || 'Untitled') + '</a>' +
            '<span style="color:var(--text-3);"> · ' + escHtml(c.artist || 'no artist') + ' · ' + c.track_count + ' tracks</span>' +
            '<div style="margin-top:4px;display:flex;gap:5px;flex-wrap:wrap;">' + c.issues.map(function(i) { return '<span class="wv-chip warn">' + escHtml(ISSUE_LABEL[i] || i) + '</span>'; }).join('') + '</div>' +
            (c.duplicates.length ? '<div style="font-size:12px;color:var(--text-3);margin-top:4px;">Dupes: ' + c.duplicates.map(function(x) { return escHtml(x.title); }).join(', ') + '</div>' : '') +
            (c.missing_audio.length ? '<div style="font-size:12px;color:var(--text-3);margin-top:2px;">No audio: ' + c.missing_audio.map(escHtml).join(', ') + '</div>' : '') +
          '</div>';
        }).join('') + '</div>';
    } catch (e) { _arcStatus('arc-audit-status', 'Audit failed: ' + (e.message || e), 'var(--red)'); }
  };
  window.fixArchiveDuplicates = async function() {
    if (!_auditIssueIds.length) return;
    if (!confirm('Delete the duplicate copies in ' + _auditIssueIds.length + ' comp(s)? The first copy of each track is kept.')) return;
    try {
      var r = await api('/archive/audit/fix-duplicates', { method: 'POST', body: JSON.stringify({ album_ids: _auditIssueIds }) });
      _arcStatus('arc-audit-status', 'Deleted ' + r.deleted + ' duplicate track(s). Re-running audit…', 'var(--green)');
      runArchiveAudit();
    } catch (e) { _arcStatus('arc-audit-status', 'Fix failed: ' + (e.message || e), 'var(--red)'); }
  };

  // ── Wipe ─────────────────────────────────────────────────────────────────
  var _wipePoll = null;
  async function loadWipePreview() {
    var el = document.getElementById('arc-wipe-preview'); if (!el) return;
    try {
      var d = await api('/archive/wipe/preview');
      el.textContent = 'Currently ' + d.albums + ' archive comp' + (d.albums === 1 ? '' : 's') + ' and ' + d.tracks + ' tracks.';
      if (d.running) pollWipe();
    } catch (e) { el.textContent = 'Could not count the archive: ' + (e.message || e); }
  }
  window.runArchiveWipe = async function() {
    var phrase = (document.getElementById('arc-wipe-confirm') || {}).value || '';
    if (phrase !== 'WIPE ARCHIVE') { _arcStatus('arc-wipe-status', 'Type WIPE ARCHIVE exactly to confirm.', 'var(--red)'); return; }
    if (!confirm('This deletes every archive comp. There is no undo. Continue?')) return;
    try {
      var r = await api('/archive/wipe', { method: 'POST', body: JSON.stringify({ confirm: phrase }) });
      _arcStatus('arc-wipe-status', 'Wiping ' + r.total + ' comps…', 'var(--orange)');
      document.getElementById('arc-wipe-confirm').value = '';
      pollWipe();
    } catch (e) { _arcStatus('arc-wipe-status', 'Wipe failed: ' + (e.message || e), 'var(--red)'); }
  };
  function pollWipe() {
    clearInterval(_wipePoll);
    _wipePoll = setInterval(async function() {
      try {
        var w = await api('/archive/wipe/status');
        if (w.status === 'running') { _arcStatus('arc-wipe-status', 'Wiping… ' + w.done + ' of ' + w.total + ' deleted' + (w.failed ? ', ' + w.failed + ' failed' : ''), 'var(--orange)'); return; }
        clearInterval(_wipePoll);
        if (w.status === 'done') _arcStatus('arc-wipe-status', 'Done. ' + w.done + ' comps deleted' + (w.failed ? ', ' + w.failed + ' failed: ' + w.errors.map(function(e) { return e.error; }).join('; ') : '') + '. Now paste the MEGA link above and start the bulk import.', w.failed ? 'var(--orange)' : 'var(--green)');
        else if (w.status === 'error') _arcStatus('arc-wipe-status', 'Wipe error: ' + (w.errors[0] && w.errors[0].error), 'var(--red)');
        loadWipePreview();
      } catch (e) {}
    }, 2000);
  }

  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function arcRenderQueue() {
    var input = document.getElementById('arc-files');
    var el = document.getElementById('arc-queue');
    if (!input || !el) return;
    var files = Array.from(input.files || []);
    if (!files.length) { el.innerHTML = ''; return; }
    el.innerHTML = files.map(function(f, i) {
      return '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface-2);border-radius:8px;margin-bottom:6px;">' +
        '<span style="font-size:12px;color:var(--text-3);min-width:20px;">' + (i + 1) + '.</span>' +
        '<span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(f.name) + '</span>' +
        '<span style="font-size:11px;color:var(--text-3);">' + (f.size / 1024 / 1024).toFixed(1) + 'MB</span>' +
      '</div>';
    }).join('') +
    '<div style="font-size:11.5px;color:var(--text-3);margin-top:4px;">Track titles are taken from the filenames. Files upload in the order shown.</div>';
  }

  function _arcCleanTitle(name) {
    return name.replace(/\.[^.]+$/, '').replace(/^\s*\d+\s*[-_.]\s*/, '').trim() || name;
  }

  function _arcStatus(elId, msg, color) {
    var el = document.getElementById(elId);
    if (!el) return;
    el.style.display = '';
    el.style.color = color || 'var(--text-2)';
    el.textContent = msg;
  }

  function _arcValidateCommon() {
    var artist = (document.getElementById('arc-artist') || {}).value || '';
    if (!artist.trim()) return { error: 'Artist name is required for archive comps.' };
    return { artist: artist.trim() };
  }

  function _arcImportEndpoint(url) {
    if (/^https?:\/\/untitled\.stream\/library\/project\/[A-Za-z0-9_-]+\/?$/.test(url)) return '/import/untitled';
    if (/^https?:\/\/(www\.)?samply\.app\/p\/[A-Za-z0-9_-]+(\?.*)?$/.test(url)) return '/import/samply';
    if (/^https?:\/\/mega(\.co)?\.nz\/(folder\/[\w-]+#[\w-]+(\/folder\/[\w-]+)?|#F![\w-]+![\w-]+)\/?$/.test(url)) return '/import/mega';
    return null;
  }

  // Specific error for unsupported link shapes (returns null when the generic
  // "not a valid link" message is fine).
  function _arcBadLinkMessage(url) {
    if (/mega(\.co)?\.nz\/(file\/|#!)/.test(url)) return "Mega single-file links aren't supported — paste a folder link (the whole folder becomes one comp).";
    if (/mega(\.co)?\.nz\/folder\/[\w-]+$/.test(url)) return 'That mega folder link is missing its key — copy the full link including the part after #.';
    return null;
  }

  // Follow an import job's SSE stream. Resolves with the `done` event,
  // rejects on an `error` event or a dropped connection.
  async function _arcStreamJob(jobId, onStatus) {
    var token = localStorage.getItem('token');
    var siteAccess = localStorage.getItem('wv_site_access');
    var streamHeaders = { 'Authorization': 'Bearer ' + token };
    if (siteAccess) streamHeaders['X-Site-Access'] = siteAccess;
    var resp = await fetch(API_BASE + '/import/jobs/' + jobId + '/events', { headers: streamHeaders });
    if (!resp.ok || !resp.body) throw new Error('stream failed');
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buf = '';
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      var parts = buf.split('\n\n');
      buf = parts.pop();
      for (var i = 0; i < parts.length; i++) {
        var line = parts[i].trim();
        if (!line.startsWith('data:')) continue;
        var evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
        if (evt.type === 'status') onStatus(evt.message);
        else if (evt.type === 'track') onStatus('Importing track ' + evt.i + ' of ' + evt.n + ': ' + evt.title);
        else if (evt.type === 'done') return evt;
        else if (evt.type === 'error') throw new Error(evt.message);
      }
    }
    throw new Error('Connection closed before the import finished');
  }

  async function startArchiveImport() {
    var common = _arcValidateCommon();
    if (common.error) { _arcStatus('arc-import-status', common.error, 'var(--red)'); return; }
    var url = ((document.getElementById('arc-import-url') || {}).value || '').trim();
    var endpoint = _arcImportEndpoint(url);
    if (!endpoint) { _arcStatus('arc-import-status', _arcBadLinkMessage(url) || 'That doesn\'t look like an untitled.stream, Samply, or mega.nz folder link.', 'var(--red)'); return; }

    var btn = document.getElementById('arc-import-btn');
    btn.disabled = true;
    _arcStatus('arc-import-status', 'Starting archive import…');
    try {
      var resp = await api(endpoint, { method: 'POST', body: JSON.stringify({
        url: url, archive_artist_name: common.artist,
      }) });
      var evt = await _arcStreamJob(resp.jobId, function(msg) { _arcStatus('arc-import-status', msg); });
      var msg = 'Archived ' + evt.imported + ' track' + (evt.imported === 1 ? '' : 's') + '.';
      if (evt.failed && evt.failed.length) msg += ' ' + evt.failed.length + ' failed.';
      _arcStatus('arc-import-status', msg + ' Opening…', 'var(--green)');
      setTimeout(function() { navigate('/album.html?id=' + evt.albumId); }, 900);
    } catch (err) {
      _arcStatus('arc-import-status', 'Error: ' + err.message, 'var(--red)');
      btn.disabled = false;
    }
  }

  // ── Bulk import ─────────────────────────────────────────────────────────────
  function arcBulkAddRow() {
    var wrap = document.getElementById('arc-bulk-rows');
    if (!wrap) return;
    var row = document.createElement('div');
    row.className = 'arc-bulk-row';
    row.style.cssText = 'padding:12px;background:var(--surface-2);border-radius:10px;margin-bottom:10px;';
    row.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +
        '<input class="wv-input arc-bulk-link" placeholder="untitled.stream, samply.app, or mega.nz/folder link" style="flex:2;min-width:220px;padding:8px 12px;">' +
        '<input class="wv-input arc-bulk-artist" placeholder="Artist name" style="flex:1;min-width:130px;padding:8px 12px;">' +
        '<button class="wv-icon-circle" title="Remove row" onclick="this.closest(\'.arc-bulk-row\').remove()" style="flex-shrink:0;">✕</button>' +
      '</div>' +
      '<div class="arc-bulk-status" style="margin-top:7px;font-size:12.5px;color:var(--text-3);display:none;"></div>';
    wrap.appendChild(row);
  }

  function _arcBulkRowStatus(row, msg, color) {
    var el = row.querySelector('.arc-bulk-status');
    if (!el) return;
    el.style.display = '';
    el.style.color = color || 'var(--text-3)';
    el.textContent = msg;
  }

  async function startArchiveBulk() {
    var rows = Array.from(document.querySelectorAll('.arc-bulk-row'));
    var jobs = [];
    var hasInvalid = false;

    rows.forEach(function(row) {
      var url = (row.querySelector('.arc-bulk-link') || {}).value || '';
      var artist = (row.querySelector('.arc-bulk-artist') || {}).value || '';
      url = url.trim(); artist = artist.trim();
      if (!url && !artist) return; // fully blank row — ignore
      var endpoint = _arcImportEndpoint(url);
      if (!endpoint) { _arcBulkRowStatus(row, _arcBadLinkMessage(url) || 'Not a valid untitled.stream, Samply, or mega.nz folder link.', 'var(--red)'); hasInvalid = true; return; }
      if (!artist) { _arcBulkRowStatus(row, 'Artist name is required.', 'var(--red)'); hasInvalid = true; return; }
      jobs.push({ row: row, url: url, artist: artist, endpoint: endpoint });
    });

    if (hasInvalid) { _arcStatus('arc-bulk-status', 'Fix the highlighted rows, then press Upload All again.', 'var(--red)'); return; }
    if (!jobs.length) { _arcStatus('arc-bulk-status', 'Add at least one comp link.', 'var(--red)'); return; }

    var btn = document.getElementById('arc-bulk-btn');
    btn.disabled = true;
    var done = 0, failed = 0;

    for (var i = 0; i < jobs.length; i++) {
      // 5s gap between comps so Internet Archive doesn't rate-limit us
      if (i > 0) {
        _arcStatus('arc-bulk-status', 'Waiting 5 seconds before the next comp…');
        await new Promise(function(r) { setTimeout(r, 5000); });
      }
      var j = jobs[i];
      _arcStatus('arc-bulk-status', 'Uploading comp ' + (i + 1) + ' of ' + jobs.length + '…');
      _arcBulkRowStatus(j.row, 'Starting import…');
      try {
        var resp = await api(j.endpoint, { method: 'POST', body: JSON.stringify({
          url: j.url, archive_artist_name: j.artist,
        }) });
        var evt = await _arcStreamJob(resp.jobId, function(msg) { _arcBulkRowStatus(j.row, msg); });
        var msg = '✓ Archived ' + evt.imported + ' track' + (evt.imported === 1 ? '' : 's') + '.';
        if (evt.failed && evt.failed.length) msg += ' ' + evt.failed.length + ' failed.';
        _arcBulkRowStatus(j.row, msg, 'var(--green)');
        done++;
      } catch (err) {
        _arcBulkRowStatus(j.row, 'Failed: ' + (err.message || 'Import error'), 'var(--red)');
        failed++;
      }
    }

    _arcStatus('arc-bulk-status',
      'Done — ' + done + ' comp' + (done === 1 ? '' : 's') + ' archived' + (failed ? ', ' + failed + ' failed.' : '.'),
      failed ? 'var(--red)' : 'var(--green)');
    btn.disabled = false;
  }

  async function startArchiveUpload() {
    var common = _arcValidateCommon();
    if (common.error) { _arcStatus('arc-upload-status', common.error, 'var(--red)'); return; }
    var title = ((document.getElementById('arc-title') || {}).value || '').trim();
    if (!title) { _arcStatus('arc-upload-status', 'Comp title is required.', 'var(--red)'); return; }
    var filesInput = document.getElementById('arc-files');
    var files = Array.from((filesInput && filesInput.files) || []);
    if (!files.length) { _arcStatus('arc-upload-status', 'Add at least one audio file.', 'var(--red)'); return; }

    var btn = document.getElementById('arc-upload-btn');
    btn.disabled = true;
    try {
      _arcStatus('arc-upload-status', 'Creating archive comp…');
      var albumForm = new FormData();
      albumForm.append('title', title);
      albumForm.append('is_archive', '1');
      albumForm.append('archive_artist_name', common.artist);
      var desc = ((document.getElementById('arc-desc') || {}).value || '').trim();
      if (desc) albumForm.append('description', desc);
      var coverInput = document.getElementById('arc-cover');
      if (coverInput && coverInput.files && coverInput.files[0]) albumForm.append('cover_file', coverInput.files[0]);
      var album = await apiUpload('/albums', albumForm);

      for (var i = 0; i < files.length; i++) {
        _arcStatus('arc-upload-status', 'Uploading ' + (i + 1) + '/' + files.length + ': ' + files[i].name + '…');
        var form = new FormData();
        form.append('file', files[i]);
        form.append('title', _arcCleanTitle(files[i].name));
        form.append('album_id', album.id);
        form.append('track_position', String(i));
        await apiUpload('/tracks', form);
      }

      _arcStatus('arc-upload-status', '✓ Archive comp uploaded. Opening…', 'var(--green)');
      setTimeout(function() { navigate('/album.html?id=' + album.id); }, 900);
    } catch (err) {
      _arcStatus('arc-upload-status', 'Failed: ' + (err.message || 'Upload error'), 'var(--red)');
      btn.disabled = false;
    }
  }

  // ── MEGA folder bulk import ──────────────────────────────────────────────────
  var _mbQueueFolders = []; // [{ id, name, compCount }] in current order
  var _mbDragSrcIdx = null;

  function _mbStatus(msg, color) {
    var el = document.getElementById('arc-mega-bulk-status');
    if (!el) return;
    el.style.display = '';
    el.style.color = color || 'var(--text-2)';
    el.textContent = msg;
  }

  function _mbLog(msg) {
    var el = document.getElementById('arc-mega-bulk-log');
    if (!el) return;
    el.style.display = '';
    var line = document.createElement('div');
    line.textContent = new Date().toLocaleTimeString() + '  ' + msg;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  function _mbRenderQueue() {
    var el = document.getElementById('arc-mega-bulk-queue');
    if (!el) return;
    if (!_mbQueueFolders.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    el.innerHTML =
      '<div style="font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px;user-select:none;">Import order — drag to reorder, × to exclude</div>' +
      _mbQueueFolders.map(function(f, idx) {
        return '<div draggable="true" data-idx="' + idx + '" ' +
          'style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-radius:10px;margin-bottom:6px;cursor:grab;" ' +
          'ondragstart="window._mbDragStart(event,' + idx + ')" ' +
          'ondragover="event.preventDefault();event.currentTarget.style.opacity=\'0.6\';" ' +
          'ondragleave="event.currentTarget.style.opacity=\'1\';" ' +
          'ondrop="event.currentTarget.style.opacity=\'1\';window._mbDrop(event,' + idx + ')">' +
          '<span style="color:var(--text-3);font-size:18px;user-select:none;line-height:1;">⠿</span>' +
          '<span style="flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(f.name) + '</span>' +
          '<span style="font-size:11px;color:var(--text-3);white-space:nowrap;">' + f.compCount + ' comp' + (f.compCount === 1 ? '' : 's') + '</span>' +
          '<button onclick="window._mbRemove(' + idx + ')" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;">×</button>' +
        '</div>';
      }).join('');
  }

  window._mbDragStart = function(e, idx) { _mbDragSrcIdx = idx; e.dataTransfer.effectAllowed = 'move'; };
  window._mbDrop = function(e, targetIdx) {
    e.preventDefault();
    if (_mbDragSrcIdx === null || _mbDragSrcIdx === targetIdx) return;
    var moved = _mbQueueFolders.splice(_mbDragSrcIdx, 1)[0];
    _mbQueueFolders.splice(targetIdx, 0, moved);
    _mbDragSrcIdx = null;
    _mbRenderQueue();
  };
  window._mbRemove = function(idx) {
    _mbQueueFolders.splice(idx, 1);
    _mbRenderQueue();
    var startBtn = document.getElementById('arc-mega-bulk-start-btn');
    if (!_mbQueueFolders.length && startBtn) startBtn.style.display = 'none';
  };

  async function scanMegaBulkFolder() {
    var url = ((document.getElementById('arc-mega-bulk-url') || {}).value || '').trim();
    var artist = ((document.getElementById('arc-mega-bulk-artist') || {}).value || '').trim();
    if (!url) { _mbStatus('Root MEGA folder URL is required.', 'var(--red)'); return; }
    if (!artist) { _mbStatus('Fallback artist name is required.', 'var(--red)'); return; }
    if (!/mega(\.co)?\.nz\/folder\/[\w-]+#[\w-]+/.test(url)) {
      _mbStatus('That doesn\'t look like a valid MEGA folder URL (needs the key after #).', 'var(--red)');
      return;
    }
    var btn = document.getElementById('arc-mega-bulk-btn');
    var startBtn = document.getElementById('arc-mega-bulk-start-btn');
    btn.disabled = true;
    if (startBtn) startBtn.style.display = 'none';
    _mbQueueFolders = [];
    _mbRenderQueue();
    _mbStatus('Scanning folder…');
    try {
      var resp = await api('/import/mega-bulk/preview', {
        method: 'POST',
        body: JSON.stringify({ url: url }),
      });
      _mbQueueFolders = resp.folders || [];
      _mbRenderQueue();
      if (_mbQueueFolders.length) {
        _mbStatus('Found ' + _mbQueueFolders.length + ' artist folder' + (_mbQueueFolders.length === 1 ? '' : 's') + ' — reorder if needed, then click Start Import.');
        if (startBtn) startBtn.style.display = '';
      } else {
        _mbStatus('No artist folders found in this MEGA folder.', 'var(--red)');
      }
    } catch (err) {
      _mbStatus('Error: ' + (err.message || 'Unknown error'), 'var(--red)');
    }
    btn.disabled = false;
  }

  async function startMegaBulkImport() {
    var url = ((document.getElementById('arc-mega-bulk-url') || {}).value || '').trim();
    var artist = ((document.getElementById('arc-mega-bulk-artist') || {}).value || '').trim();

    if (!url) { _mbStatus('Root MEGA folder URL is required.', 'var(--red)'); return; }
    if (!artist) { _mbStatus('Fallback artist name is required.', 'var(--red)'); return; }
    if (!_mbQueueFolders.length) { _mbStatus('Scan the folder first to build the queue.', 'var(--red)'); return; }

    var btn = document.getElementById('arc-mega-bulk-btn');
    var startBtn = document.getElementById('arc-mega-bulk-start-btn');
    btn.disabled = true;
    if (startBtn) startBtn.disabled = true;
    document.getElementById('arc-mega-bulk-log').innerHTML = '';
    _mbStatus('Starting…');

    var artistOrder = _mbQueueFolders.map(function(f) { return f.id; });

    var jobId;
    try {
      var resp = await api('/import/mega-bulk', {
        method: 'POST',
        body: JSON.stringify({ url: url, archive_artist_name: artist, artist_order: artistOrder }),
      });
      jobId = resp.jobId;
      _mbStatus('Bulk import job started — streaming progress…');
      _mbLog('Job ' + jobId + ' started');
    } catch (err) {
      _mbStatus('Error: ' + (err.message || 'Unknown error'), 'var(--red)');
      btn.disabled = false;
      return;
    }

    // The import runs entirely on the server. The SSE stream can drop (idle
    // proxies, sleep, flaky wifi) without affecting the job — so on a drop we
    // just reconnect to the same job. The server replays past events on
    // connect, so a "seen" set keeps the log from doubling up.
    var seen = {};
    var token = localStorage.getItem('token');
    var evtUrl = API_BASE + '/import/jobs/' + jobId + '/events';

    function _logOnce(key, msg) { if (!seen[key]) { seen[key] = 1; _mbLog(msg); } }

    // Returns 'done' | 'error' | 'dropped'
    async function streamOnce() {
      var response = await fetch(evtUrl, { headers: { 'Authorization': 'Bearer ' + token } });
      if (response.status === 404) return 'error'; // job expired/gone
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      while (true) {
        var result = await reader.read();
        if (result.done) return 'dropped';
        buf += decoder.decode(result.value, { stream: true });
        var parts = buf.split('\n\n');
        buf = parts.pop();
        for (var i = 0; i < parts.length; i++) {
          var line = parts[i].trim();
          if (!line.startsWith('data:')) continue; // skip ': ping' heartbeats
          var evt;
          try { evt = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }

          if (evt.type === 'status') {
            _mbStatus(evt.message);
            _logOnce('s:' + evt.message, evt.message);
          } else if (evt.type === 'comp_start') {
            var who = evt.artist ? (evt.name + '  ·  ' + evt.artist) : evt.name;
            _mbStatus('Importing ' + evt.index + ' / ' + evt.total + ': ' + who);
            _logOnce('cs:' + evt.index, '▶ ' + evt.index + '/' + evt.total + '  ' + who);
          } else if (evt.type === 'comp_progress') {
            _mbStatus('  ↳ ' + evt.name + ' — track ' + evt.i + '/' + evt.n + ': ' + evt.track);
          } else if (evt.type === 'comp_done') {
            _logOnce('cd:' + evt.name, '✓ ' + evt.name + ' (' + evt.imported + ' tracks)');
          } else if (evt.type === 'comp_failed') {
            _logOnce('cf:' + evt.name, '✗ ' + evt.name + ': ' + (evt.error || 'failed'));
          } else if (evt.type === 'comp_skip') {
            _logOnce('ck:' + evt.name, '⏭ ' + evt.name + ' (already imported, skipping)');
          } else if (evt.type === 'done') {
            var doneMsg = 'Done — ' + evt.imported + ' comp' + (evt.imported === 1 ? '' : 's') + ' archived' +
              (evt.failed ? ', ' + evt.failed + ' failed.' : '.');
            _mbStatus(doneMsg, evt.failed ? 'var(--red)' : 'var(--green)');
            _mbLog(doneMsg);
            return 'done';
          } else if (evt.type === 'error') {
            _mbStatus('Error: ' + evt.message, 'var(--red)');
            _mbLog('Error: ' + evt.message);
            return 'error';
          }
        }
      }
    }

    var drops = 0;
    while (true) {
      var outcome;
      try { outcome = await streamOnce(); }
      catch (e) { outcome = 'dropped'; }
      if (outcome === 'done' || outcome === 'error') break;
      // dropped — the job is still running on the server; reconnect.
      drops++;
      if (drops > 60) {
        _mbStatus('Lost connection to the progress stream, but the import is still running on the server. Re-run the same URL later to see final results (already-done comps are skipped).', 'var(--yellow)');
        break;
      }
      _mbStatus('Reconnecting to progress stream… (' + drops + ')', 'var(--yellow)');
      await new Promise(function(r) { setTimeout(r, 3000); });
    }
    btn.disabled = false;
    if (startBtn) startBtn.disabled = false;
  }
</script>
</body>
</html>
