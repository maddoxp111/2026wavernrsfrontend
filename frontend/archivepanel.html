<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — archive panel</title>
  <link rel="stylesheet" href="/css/style.css?v=0f5af83a1673">
  <style>
    /* Narrow screens: the source cards (Discord servers, subreddits, MEGA
       jobs) put name + chips on the left and the big count on the right.
       Under 640px the count drops to its own row and button rows wrap. */
    @media (max-width: 640px) {
      #view [style*="display:flex;gap:12px;align-items:center;"] { flex-wrap: wrap; }
      #view [style*="text-align:right;flex-shrink:0;"] { flex-basis: 100%; text-align: left !important; display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
      #view [style*="display:flex;gap:6px;align-items:center;"] { flex-wrap: wrap; }
      #view [style*="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"] { grid-template-columns: 1fr 1fr !important; }
      #view h1 { font-size: 30px !important; }
    }
  </style>
  <script src="/js/status-card.js?v=0f5af83a1673"></script>
  <script src="/js/down.js?v=0f5af83a1673"></script>
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script src="/js/api.js?v=0f5af83a1673"></script>
<script src="/js/layout.js?v=0f5af83a1673"></script>
<script src="/js/player.js?v=0f5af83a1673"></script>
<script src="/js/router.js?v=0f5af83a1673"></script>
<script>
  initPlayer();

  // ── Auth + archiver check ────────────────────────────────────────────────────
  (function init() {
    var token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; return; }

    fetch(API_BASE + '/archive/check', {
      headers: { 'Authorization': 'Bearer ' + token },
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || !d.is_archiver) {
          document.getElementById('view').innerHTML =
            '<div style="padding:48px 24px;text-align:center;">' +
            '<div style="font-size:18px;font-weight:700;color:var(--red);margin-bottom:8px;">Access denied</div>' +
            '<div style="font-size:14px;color:var(--text-2);">you dont have archiver perms</div>' +
            '</div>';
          setTimeout(function() { window.location.href = '/index'; }, 2500);
          return;
        }
        renderShell();
      })
      .catch(function() {
        document.getElementById('view').innerHTML =
          '<div style="padding:48px 24px;text-align:center;color:var(--red);">couldnt check if youre an archiver...try again</div>';
      });
  })();

  function renderShell() {
    document.getElementById('view').innerHTML =
      '<div style="max-width:720px;">' +
        '<h1 style="font-size:28px;font-weight:800;margin:0 0 4px;">Archive Panel</h1>' +
        '<p style="font-size:14px;color:var(--text-2);margin:0 0 28px;line-height:1.55;">upload archive comps here...good stuff by artists who arent on wavernrs, saved so it doesnt get lost.</p>' +

        '<div class="wv-card" style="padding:18px 22px;margin-bottom:16px;">' +
          '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;">' +
            '<div><div class="k" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);">Everything left to import</div>' +
            '<div id="ov-total" style="font-size:38px;font-weight:900;letter-spacing:-.03em;line-height:1.05;">…</div>' +
            '<div id="ov-eta" style="font-size:12.5px;color:var(--text-2);">estimating</div></div>' +
            '<div style="text-align:right;"><div id="ov-live" style="font-size:12px;color:var(--text-3);"></div>' +
            '<div id="ov-tracked" style="font-size:11.5px;color:var(--text-3);margin-top:2px;"></div></div>' +
          '</div>' +
          '<div id="ov-bars" style="display:flex;flex-direction:column;gap:10px;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:14px 22px;margin-bottom:16px;">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);">Imports per hour, last 12 hours</div>' +
          '<div id="ov-hourly" style="display:flex;align-items:flex-end;gap:4px;height:72px;margin-top:10px;"></div>' +
          '<div id="ov-hourly-sub" style="font-size:12px;color:var(--text-3);margin-top:6px;"></div>' +
        '</div>' +

        '<div class="wv-card" id="arc-now" style="padding:14px 22px;margin-bottom:16px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);">Importing right now</div>' +
          '<div id="ov-queue" style="font-size:12px;color:var(--text-3);"></div></div>' +
          '<div id="ov-now" style="display:flex;flex-direction:column;gap:6px;font-size:13px;">…</div>' +
        '</div>' +

        '<div class="wv-card" id="ov-shards-card" style="padding:14px 22px;margin-bottom:16px;display:none;">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);">Folder jobs</div>' +
          '<div id="ov-shards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:8px;"></div>' +
        '</div>' +

        '<div class="wv-card" id="ov-scans-card" style="padding:14px 22px;margin-bottom:16px;display:none;">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);">Scanning for new links</div>' +
          '<div id="ov-scans" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;font-size:13px;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:14px 22px;margin-bottom:16px;">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);">Time left by source</div>' +
          '<div id="ov-types" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;font-size:13px;margin-top:8px;">…</div>' +
        '</div>' +

        '<div class="wv-card" id="ov-fail-card" style="padding:14px 22px;margin-bottom:16px;display:none;">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);">Why imports failed</div>' +
          '<div id="ov-fails" style="display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:12.5px;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:14px 22px;margin-bottom:16px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;"><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);">Just imported</div>' +
          '<button class="wv-see-all" onclick="dcShowLog(\'\',\'all sources\')">Full import log</button></div>' +
          '<div id="ov-recent" style="display:flex;flex-direction:column;gap:4px;">…</div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--purple);">' +
          '<div style="font-size:13px;font-weight:700;color:var(--purple-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Archive uploads</div>' +
          '<p style="margin:0;font-size:14px;color:var(--text-2);line-height:1.6;">' +
            'archive comps are comps by artists who are <strong style="color:var(--text-1);">not on the site</strong> but are too good to lose. ' +
            'they dont make an artist account...the name you type is just for show. ' +
            'archive comps ONLY show on the Archive page and in the Archived part of search.' +
          '</p>' +
        '</div>' +

        '<div style="margin-bottom:14px;">' +
          '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Artist name (display only) *</label>' +
          '<input type="text" id="arc-artist" class="wv-input" placeholder="like Lil Uzi Vert" style="max-width:400px;">' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;">Import from link</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">paste a public <b>untitled.stream</b>, <b>Samply</b> or <b>mega.nz folder</b> link and it grabs every track plus the cover. for mega folders each audio file becomes a track (sorted by filename) and any image in there becomes the cover. mega downloads go through Tor (new IP every 2 comps) so theyre slower and sometimes a track fails...just import it again to grab the ones that didnt make it.</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<input id="arc-import-url" class="wv-input" placeholder="untitled.stream/library/project/..., samply.app/p/... or mega.nz/folder/..." style="flex:1;min-width:220px;">' +
            '<button class="wv-pill brand" id="arc-import-btn" onclick="startArchiveImport()">Import</button>' +
          '</div>' +
          '<div id="arc-import-status" style="margin-top:10px;font-size:13px;display:none;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:10px;">Manual upload</div>' +
          '<div class="wv-form-field" style="margin-bottom:10px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Comp title *</label>' +
            '<input type="text" id="arc-title" class="wv-input" placeholder="Comp name" style="max-width:400px;">' +
          '</div>' +
          '<div class="wv-form-field" style="margin-bottom:10px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Description</label>' +
            '<textarea id="arc-desc" class="wv-input" rows="2" placeholder="optional..." style="resize:vertical;max-width:400px;"></textarea>' +
          '</div>' +
          '<div class="wv-form-field" style="margin-bottom:12px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Cover image</label>' +
            '<input type="file" id="arc-cover" accept="image/*" class="wv-input" style="padding:8px 12px;max-width:400px;">' +
          '</div>' +
          '<div class="wv-form-field" style="margin-bottom:12px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Audio files *</label>' +
            '<input type="file" id="arc-files" accept="audio/*" multiple class="wv-input" style="padding:8px 12px;max-width:400px;" onchange="arcRenderQueue()">' +
          '</div>' +
          '<div id="arc-queue" style="margin-bottom:14px;"></div>' +
          '<button class="wv-pill brand" id="arc-upload-btn" onclick="startArchiveUpload()">Upload Archive Comp</button>' +
          '<div id="arc-upload-status" style="margin-top:12px;font-size:13px;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-top:20px;">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;">Bulk import</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px;">queue a bunch of comps at once...each row needs an <b>untitled.stream</b>, <b>Samply</b> or <b>mega.nz folder</b> link and an artist name. comps upload one at a time with a 5 second wait between each so Internet Archive doesnt rate limit us.</div>' +
          '<div id="arc-bulk-rows"></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">' +
            '<button class="wv-pill" onclick="arcBulkAddRow()">+ Add row</button>' +
            '<button class="wv-pill brand" id="arc-bulk-btn" onclick="startArchiveBulk()">Upload All</button>' +
          '</div>' +
          '<div id="arc-bulk-status" style="margin-top:12px;font-size:13px;display:none;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-top:20px;border-left:4px solid var(--purple);">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;">MEGA folder bulk import</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px;">' +
            'paste a <b>main MEGA folder</b> where each folder inside it is one comp. ' +
            'every folder inside gets imported as its own archive comp, one after another. ' +
            'folder names like <em>Artist - Title</em> set the archive artist name on their own...' +
            'if a folder name has no dash it uses the backup artist name below. ' +
            'folders that were already imported (same url) get skipped so its fine to run it again.' +
          '</div>' +
          '<div style="margin-bottom:10px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:5px;">Root MEGA folder URL *</label>' +
            '<input id="arc-mega-bulk-url" class="wv-input" placeholder="https://mega.nz/folder/...#..." style="width:100%;max-width:540px;">' +
          '</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">' +
            '<div style="flex:1;min-width:180px;">' +
              '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:5px;">Fallback artist name *</label>' +
              '<input id="arc-mega-bulk-artist" class="wv-input" placeholder="like Various Artists">' +
            '</div>' +
          '</div>' +
          '<button class="wv-pill" id="arc-mega-bulk-btn" onclick="scanMegaBulkFolder()">Scan Folder</button>' +
          '<div id="arc-mega-bulk-status" style="margin-top:12px;font-size:13px;display:none;"></div>' +
          '<div id="arc-mega-bulk-queue" style="margin-top:14px;display:none;"></div>' +
          '<button class="wv-pill brand" id="arc-mega-bulk-start-btn" style="display:none;margin-top:10px;" onclick="startMegaBulkImport()">Start Import</button>' +
          '<div id="arc-mega-bulk-log" style="margin-top:10px;max-height:280px;overflow-y:auto;font-size:12px;color:var(--text-3);font-family:monospace;display:none;"></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;" id="arc-mega-jobs-card">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;">' +
            '<div><div style="font-size:14px;font-weight:700;">MEGA imports in progress</div>' +
            '<div style="font-size:12px;color:var(--text-3);">every bulk MEGA run on the server, live...refreshes every 5 seconds</div></div>' +
            '<span id="mj-summary" class="wv-chip">…</span>' +
          '</div>' +
          '<div id="mj-list" style="display:flex;flex-direction:column;gap:10px;"><div class="loading"><div class="spinner"></div></div></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;" id="arc-reddit-card">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;">' +
            '<div><div style="font-size:14px;font-weight:700;">Reddit</div>' +
            '<div style="font-size:12px;color:var(--text-3);">grabs every post and comment in a subreddit (full history) and checks for new ones every 10 minutes. links hidden in base64 get decoded. comps go in the archive under the reddit username.</div></div>' +
          '</div>' +
          '<div id="rd-sweep" style="display:none;font-size:12.5px;color:var(--text-2);margin:0 0 12px;padding:8px 12px;background:var(--surface-2);border-radius:var(--r-md);"></div>' +
          '<div id="rd-list" style="display:flex;flex-direction:column;gap:10px;"><div class="loading"><div class="spinner"></div></div></div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;" id="arc-discord-card">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;">' +
            '<div><div style="font-size:14px;font-weight:700;">Discord servers</div>' +
            '<div style="font-size:12px;color:var(--text-3);">every server the bot is in. it reads every channel it can see and imports each untitled.stream / Samply / MEGA / Drive link plus every audio file posted straight in chat (each forum thread becomes one comp). it never posts anything. add it with <b>View Channels</b> and <b>Read Message History</b> only.</div></div>' +
            '<div style="display:flex;gap:6px;align-items:center;">' +
              '<span id="dc-bot-state" class="wv-chip">…</span>' +
              '<button class="wv-pill" style="font-size:12px;padding:5px 12px;" onclick="dcGlobal(\'stop\')">Stop queue</button>' +
              '<button class="wv-pill" style="font-size:12px;padding:5px 12px;" onclick="dcGlobal(\'resume\')">Resume</button>' +
              '<button class="wv-pill brand" style="font-size:12px;padding:5px 12px;" onclick="dcRetryWorking()" title="checks every failed link (discord and reddit). links that still load get queued again...links that got taken down get marked gone">Retry links that still work</button>' +
              '<button class="wv-pill" style="font-size:12px;padding:5px 12px;" onclick="dcLoad()">↻</button>' +
            '</div>' +
          '</div>' +
          '<div id="dc-queue" style="font-size:12.5px;color:var(--text-2);margin:8px 0 12px;"></div>' +
          '<div id="dc-sweep" style="display:none;font-size:12.5px;color:var(--text-2);margin:-4px 0 12px;padding:8px 12px;background:var(--surface-2);border-radius:var(--r-md);"></div>' +
          '<div id="dc-servers" style="display:flex;flex-direction:column;gap:10px;"><div class="loading"><div class="spinner"></div></div></div>' +
          '<div id="dc-log-wrap" style="margin-top:14px;display:none;">' +
            '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">' +
              '<div style="font-size:13px;font-weight:700;" id="dc-log-title">Imports</div>' +
              '<div class="wv-seg" id="dc-log-filter">' +
                '<button class="on" data-s="" onclick="dcFilter(\'\')">All</button><button data-s="running" onclick="dcFilter(\'running\')">Running</button><button data-s="queued" onclick="dcFilter(\'queued\')">Queued</button><button data-s="done" onclick="dcFilter(\'done\')">Done</button><button data-s="failed" onclick="dcFilter(\'failed\')">Failed</button>' +
              '</div>' +
              '<input class="wv-input" id="dc-log-q" placeholder="search links" style="max-width:220px;padding:6px 12px;font-size:12.5px;" oninput="dcLogDebounce()">' +
            '</div>' +
            '<div id="dc-log" style="display:flex;flex-direction:column;gap:4px;max-height:520px;overflow:auto;"></div>' +
          '</div>' +
        '</div>' +

        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;" id="arc-claims-card">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
            '<div><div style="font-size:14px;font-weight:700;">Comp claims</div>' +
            '<div style="font-size:12px;color:var(--text-3);">these come from the Claim your comps page. check the proof, fix the comps with the manager below, then approve or decline with a note they can see.</div></div>' +
            '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><button class="wv-pill" id="cl-ai-all" style="font-size:12px;padding:6px 12px;" onclick="clAiAll()" title="has GPT look at every open claim and show what it would do on each one">✨ AI review all open</button>' +
            '<div class="wv-seg"><button class="on" id="cl-tab-open" onclick="clLoad(\'open\')">Open</button><button id="cl-tab-approved" onclick="clLoad(\'approved\')">Approved</button><button id="cl-tab-rejected" onclick="clLoad(\'rejected\')">Declined</button></div></div>' +
          '</div>' +
          '<div id="cl-list" style="display:flex;flex-direction:column;gap:8px;"></div>' +
        '</div>' +
        '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;" id="arc-manage-card">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
            '<div><div style="font-size:14px;font-weight:700;">Manage the archive</div>' +
            '<div style="font-size:12px;color:var(--text-3);">find any comp and fix it...title, whose profile its on, description, cover, tracks. you can move comps between profiles, merge comps, and rename or merge profiles. select a few to do stuff in bulk.</div></div>' +
            '<div class="wv-seg"><button class="on" id="mg-tab-comps" onclick="mgTab(\'comps\')">Comps</button><button id="mg-tab-artists" onclick="mgTab(\'artists\')">Artists</button><button id="mg-tab-trackers" onclick="mgTab(\'trackers\')">Trackers</button><button id="mg-tab-top" onclick="mgTab(\'top\')">Top 150</button><button id="mg-tab-otw" onclick="mgTab(\'otw\')">Of the Week</button><button id="mg-tab-cleanup" onclick="mgTab(\'cleanup\')">Cleanup</button><button id="mg-tab-deleted" onclick="mgTab(\'deleted\')">Deleted</button>' +
            '</div>' +
          '</div>' +
          '<div id="mg-comps">' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">' +
              '<input id="mg-q" class="wv-input" placeholder="search comps by title or artist..." style="flex:1;min-width:200px;max-width:380px;padding:8px 12px;font-size:13.5px;" oninput="mgSearchInput()">' +
              '<select id="mg-sort" class="wv-input" style="width:auto;padding:8px 10px;font-size:13px;" onchange="mgLoad()"><option value="newest">Newest</option><option value="title">Title A–Z</option><option value="artist">Artist A–Z</option></select>' +
              '<span id="mg-count" style="font-size:12px;color:var(--text-3);"></span>' +
            '</div>' +
            '<div id="mg-bulk" style="display:none;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:8px 12px;background:var(--surface-2);border-radius:var(--r-md);font-size:12.5px;">' +
              '<b id="mg-selcount">0 selected</b>' +
              '<button class="wv-pill" style="font-size:12px;padding:4px 10px;" onclick="mgBulk(\'set_artist\')">Set artist name</button>' +
              '<button class="wv-pill" style="font-size:12px;padding:4px 10px;" onclick="mgBulkProfile()">Move to profile</button>' +
              '<button class="wv-pill" style="font-size:12px;padding:4px 10px;" onclick="mgBulkMerge()">Merge into one</button>' +

  // ── Archive import helpers (shared by Import from link, Manual upload and Bulk import) ──
  function _arcCleanTitle(name) {
    return name.replace(/\.[^.]+$/, '').replace(/^\s*\d+\s*[-_.]\s*/, '').trim() || name;
  }

  function _arcStatus(elId, msg, color) {
    var el = document.getElementById(elId);
    if (!el) return;
    el.style.display = '';
    el.style.color = color || 'var(--text-2)';
    el.textContent = msg;
  }

  function _arcValidateCommon() {
    var artist = ((document.getElementById('arc-artist') || {}).value || '').trim();
    var era = (document.getElementById('arc-era') || {}).value || '';
    if (!artist) return { error: 'archive comps need an artist name' };
    return { artist: artist, era: era || null };
  }

  function _arcImportEndpoint(url) {
    url = String(url || '').trim();
    if (/^https?:\/\/untitled\.stream\/library\/project\/[A-Za-z0-9_-]+\/?(\?.*)?$/.test(url)) return '/import/untitled';
    if (/^https?:\/\/(www\.)?samply\.app\/p\/[A-Za-z0-9_-]+\/?(\?.*)?$/.test(url)) return '/import/samply';
    if (/^https?:\/\/mega(\.co)?\.nz\/(folder\/[\w-]+#[\w-]+|#F![\w-]+![\w-]+)(\/folder\/[\w-]+)?\/?$/.test(url)) return '/import/mega';
    return null;
  }

  function _arcBadLinkMessage(url) {
    url = String(url || '').trim();
    if (!url) return 'paste a link first';
    if (/mega(\.co)?\.nz\/(file\/|#!)/.test(url)) return 'single file mega links dont work...paste a folder link (the whole folder becomes one comp)';
    if (/mega(\.co)?\.nz\/folder\/[\w-]+$/.test(url)) return 'that mega folder link is missing its key...copy the whole link including the part after #';
    if (/untitled\.stream/.test(url)) return 'use the project link, it looks like untitled.stream/library/project/...';
    if (/samply\.app/.test(url)) return 'use the project link, it looks like samply.app/p/...';
    return 'that doesnt look like an untitled.stream, Samply or mega.nz folder link';
  }

  // Follows an import job's event stream until it finishes. Resolves with the
  // "done" event, rejects with the error message. (EventSource cant send auth headers.)
  async function _arcStreamJob(jobId, onStatus) {
    var token = localStorage.getItem('token');
    var siteAccess = localStorage.getItem('wv_site_access');
    var headers = { 'Authorization': 'Bearer ' + token };
    if (siteAccess) headers['X-Site-Access'] = siteAccess;
    var resp = await fetch(API_BASE + '/import/jobs/' + jobId + '/events', { headers: headers });
    if (!resp.ok || !resp.body) throw new Error('couldnt follow the import');
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buf = '';
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      var parts = buf.split('\n\n');
      buf = parts.pop();
      for (var i = 0; i < parts.length; i++) {
        var line = parts[i].trim();
        if (line.indexOf('data:') !== 0) continue;
        var evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
        if (evt.type === 'status' && onStatus) onStatus(evt.message);
        else if (evt.type === 'track' && onStatus) onStatus('importing track ' + evt.i + ' of ' + evt.n + ': ' + evt.title);
        else if (evt.type === 'done') return evt;
        else if (evt.type === 'error') throw new Error(evt.message || 'import failed');
      }
    }
    throw new Error('lost connection to the import');
  }

  function arcRenderQueue() {
    var input = document.getElementById('arc-files');
    var el = document.getElementById('arc-queue');
    if (!input || !el) return;
    var files = Array.from(input.files || []);
    if (!files.length) { el.innerHTML = ''; return; }
    el.innerHTML = files.map(function(f, i) {
      return '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface-2);border-radius:8px;margin-bottom:6px;">' +
        '<span style="font-size:12px;color:var(--text-3);min-width:20px;">' + (i + 1) + '.</span>' +
        '<span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(f.name) + '</span>' +
        '<span style="font-size:11px;color:var(--text-3);">' + (f.size / 1024 / 1024).toFixed(1) + 'MB</span>' +
      '</div>';
    }).join('') +
    '<div style="font-size:11.5px;color:var(--text-3);margin-top:4px;">track titles come from the filenames (numbers and file extension get cut off). files upload in the order shown.</div>';
  }

  async function startArchiveImport() {
    var common = _arcValidateCommon();
    if (common.error) { _arcStatus('arc-import-status', common.error, 'var(--red)'); return; }
    var url = ((document.getElementById('arc-import-url') || {}).value || '').trim();
    var endpoint = _arcImportEndpoint(url);
    if (!endpoint) { _arcStatus('arc-import-status', _arcBadLinkMessage(url), 'var(--red)'); return; }
    var btn = document.getElementById('arc-import-btn');
    btn.disabled = true;
    _arcStatus('arc-import-status', 'starting the import...');
    try {
      var body = { url: url, archive_artist_name: common.artist };
      if (common.era) body.era_tag_id = common.era;
      var resp = await api(endpoint, { method: 'POST', body: JSON.stringify(body) });
      var evt = await _arcStreamJob(resp.jobId, function(msg) { _arcStatus('arc-import-status', msg); });
      var msg = 'archived ' + evt.imported + ' track' + (evt.imported === 1 ? '' : 's') + (evt.failed && evt.failed.length ? ', ' + evt.failed.length + ' failed' : '') + '...opening it';
      _arcStatus('arc-import-status', msg, 'var(--green)');
      setTimeout(function() { navigate('/album?id=' + evt.albumId); }, 900);
    } catch (err) {
      _arcStatus('arc-import-status', 'import failed: ' + (err.message || 'something went wrong'), 'var(--red)');
      btn.disabled = false;
    }
  }

  function _arcBulkRowStatus(row, msg, color) {
    var el = row.querySelector('.arc-bulk-status');
    if (!el) return;
    el.style.display = '';
    el.style.color = color || 'var(--text-3)';
    el.textContent = msg;
  }

  async function startArchiveBulk() {
    var rows = Array.from(document.querySelectorAll('.arc-bulk-row'));
    var jobs = [];
    var hasInvalid = false;

    rows.forEach(function(row) {
      var url = (row.querySelector('.arc-bulk-link') || {}).value || '';
      var artist = (row.querySelector('.arc-bulk-artist') || {}).value || '';
      url = url.trim(); artist = artist.trim();
      if (!url && !artist) return; // fully blank row — ignore
      var endpoint = _arcImportEndpoint(url);
      if (!endpoint) { _arcBulkRowStatus(row, _arcBadLinkMessage(url) || 'thats not a real untitled.stream, Samply or mega.nz folder link', 'var(--red)'); hasInvalid = true; return; }
      if (!artist) { _arcBulkRowStatus(row, 'needs an artist name', 'var(--red)'); hasInvalid = true; return; }
      jobs.push({ row: row, url: url, artist: artist, endpoint: endpoint });
    });

    if (hasInvalid) { _arcStatus('arc-bulk-status', 'fix the rows in red then hit Upload All again', 'var(--red)'); return; }
    if (!jobs.length) { _arcStatus('arc-bulk-status', 'add at least one comp link', 'var(--red)'); return; }

    var btn = document.getElementById('arc-bulk-btn');
    btn.disabled = true;
    var done = 0, failed = 0;

    for (var i = 0; i < jobs.length; i++) {
      // 5s gap between comps so Internet Archive doesn't rate-limit us
      if (i > 0) {
        _arcStatus('arc-bulk-status', 'waiting 5 seconds before the next comp...');
        await new Promise(function(r) { setTimeout(r, 5000); });
      }
      var j = jobs[i];
      _arcStatus('arc-bulk-status', 'Uploading comp ' + (i + 1) + ' of ' + jobs.length + '…');
      _arcBulkRowStatus(j.row, 'starting import...');
      try {
        var resp = await api(j.endpoint, { method: 'POST', body: JSON.stringify({
          url: j.url, archive_artist_name: j.artist,
        }) });
        var evt = await _arcStreamJob(resp.jobId, function(msg) { _arcBulkRowStatus(j.row, msg); });
        var msg = '✓ Archived ' + evt.imported + ' track' + (evt.imported === 1 ? '' : 's') + '.';
        if (evt.failed && evt.failed.length) msg += ' ' + evt.failed.length + ' failed.';
        _arcBulkRowStatus(j.row, msg, 'var(--green)');
        done++;
      } catch (err) {
        _arcBulkRowStatus(j.row, 'Failed: ' + (err.message || 'Import error'), 'var(--red)');
        failed++;
      }
    }

    _arcStatus('arc-bulk-status',
      'done...' + done + ' comp' + (done === 1 ? '' : 's') + ' archived' + (failed ? ', ' + failed + ' failed' : ''),
      failed ? 'var(--red)' : 'var(--green)');
    btn.disabled = false;
  }

  async function startArchiveUpload() {
    var common = _arcValidateCommon();
    if (common.error) { _arcStatus('arc-upload-status', common.error, 'var(--red)'); return; }
    var title = ((document.getElementById('arc-title') || {}).value || '').trim();
    if (!title) { _arcStatus('arc-upload-status', 'comp needs a title', 'var(--red)'); return; }
    var filesInput = document.getElementById('arc-files');
    var files = Array.from((filesInput && filesInput.files) || []);
    if (!files.length) { _arcStatus('arc-upload-status', 'add at least one audio file', 'var(--red)'); return; }

    var btn = document.getElementById('arc-upload-btn');
    btn.disabled = true;
    try {
      _arcStatus('arc-upload-status', 'making the archive comp...');
      var albumForm = new FormData();
      albumForm.append('title', title);
      albumForm.append('is_archive', '1');
      albumForm.append('archive_artist_name', common.artist);
      var desc = ((document.getElementById('arc-desc') || {}).value || '').trim();
      if (desc) albumForm.append('description', desc);
      var coverInput = document.getElementById('arc-cover');
      if (coverInput && coverInput.files && coverInput.files[0]) albumForm.append('cover_file', coverInput.files[0]);
      var album = await apiUpload('/albums', albumForm);

      for (var i = 0; i < files.length; i++) {
        _arcStatus('arc-upload-status', 'Uploading ' + (i + 1) + '/' + files.length + ': ' + files[i].name + '…');
        var form = new FormData();
        form.append('file', files[i]);
        form.append('title', _arcCleanTitle(files[i].name));
        form.append('album_id', album.id);
        form.append('track_position', String(i));
        await apiUpload('/tracks', form);
      }

      _arcStatus('arc-upload-status', '✓ archive comp uploaded...opening it', 'var(--green)');
      setTimeout(function() { navigate('/album?id=' + album.id); }, 900);
    } catch (err) {
      _arcStatus('arc-upload-status', 'Failed: ' + (err.message || 'Upload error'), 'var(--red)');
      btn.disabled = false;
    }
  }

  // ── MEGA folder bulk import ──────────────────────────────────────────────────
  var _mbQueueFolders = []; // [{ id, name, compCount }] in current order
  var _mbDragSrcIdx = null;

  function _mbRenderQueue() {
    var el = document.getElementById('arc-mega-bulk-queue');
    if (!el) return;
    if (!_mbQueueFolders.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    el.innerHTML =
      '<div style="font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px;user-select:none;">import order...drag to move stuff around, hit × to skip one</div>' +
      _mbQueueFolders.map(function(f, idx) {
        return '<div draggable="true" data-idx="' + idx + '" ' +
          'style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-radius:10px;margin-bottom:6px;cursor:grab;" ' +
          'ondragstart="window._mbDragStart(event,' + idx + ')" ' +
          'ondragover="event.preventDefault();event.currentTarget.style.opacity=\'0.6\';" ' +
          'ondragleave="event.currentTarget.style.opacity=\'1\';" ' +
          'ondrop="event.currentTarget.style.opacity=\'1\';window._mbDrop(event,' + idx + ')">' +
          '<span style="color:var(--text-3);font-size:18px;user-select:none;line-height:1;">⠿</span>' +
          '<span style="flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(f.name) + '</span>' +
          '<span style="font-size:11px;color:var(--text-3);white-space:nowrap;">' + f.compCount + ' comp' + (f.compCount === 1 ? '' : 's') + '</span>' +
          '<button onclick="window._mbRemove(' + idx + ')" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;">×</button>' +
        '</div>';
      }).join('');

  window._mbDragStart = function(e, idx) { _mbDragSrcIdx = idx; e.dataTransfer.effectAllowed = 'move'; };
  window._mbDrop = function(e, targetIdx) {
    e.preventDefault();
    if (_mbDragSrcIdx === null || _mbDragSrcIdx === targetIdx) return;
    var moved = _mbQueueFolders.splice(_mbDragSrcIdx, 1)[0];
    _mbQueueFolders.splice(targetIdx, 0, moved);
    _mbDragSrcIdx = null;
    _mbRenderQueue();
  };
  window._mbRemove = function(idx) {
    _mbQueueFolders.splice(idx, 1);

  async function scanMegaBulkFolder() {
    var url = ((document.getElementById('arc-mega-bulk-url') || {}).value || '').trim();
    var artist = ((document.getElementById('arc-mega-bulk-artist') || {}).value || '').trim();
    if (!url) { _mbStatus('needs the main MEGA folder url', 'var(--red)'); return; }
    if (!artist) { _mbStatus('needs a backup artist name', 'var(--red)'); return; }
    if (!/mega(\.co)?\.nz\/folder\/[\w-]+#[\w-]+/.test(url)) {
      _mbStatus('that doesnt look like a real MEGA folder url (it needs the key after #)', 'var(--red)');
      return;
    }
    var btn = document.getElementById('arc-mega-bulk-btn');
    var startBtn = document.getElementById('arc-mega-bulk-start-btn');

    _mbRenderQueue();
    _mbStatus('scanning folder...');
    try {
      var resp = await api('/import/mega-bulk/preview', {
        method: 'POST',

        _mbStatus('Found ' + _mbQueueFolders.length + ' artist folder' + (_mbQueueFolders.length === 1 ? '' : 's') + '...move them around if you want then hit Start Import');

  async function startMegaBulkImport() {
    var url = ((document.getElementById('arc-mega-bulk-url') || {}).value || '').trim();
    var artist = ((document.getElementById('arc-mega-bulk-artist') || {}).value || '').trim();

    if (!url) { _mbStatus('needs the main MEGA folder url', 'var(--red)'); return; }
    if (!artist) { _mbStatus('needs a backup artist name', 'var(--red)'); return; }
    if (!_mbQueueFolders.length) { _mbStatus('scan the folder first to make the queue', 'var(--red)'); return; }

    var btn = document.getElementById('arc-mega-bulk-btn');
    var startBtn = document.getElementById('arc-mega-bulk-start-btn');
    btn.disabled = true;
    if (startBtn) startBtn.disabled = true;
    document.getElementById('arc-mega-bulk-log').innerHTML = '';
    _mbStatus('Starting…');

    var artistOrder = _mbQueueFolders.map(function(f) { return f.id; });

    var jobId;
    try {
      var resp = await api('/import/mega-bulk', {
        method: 'POST',
        body: JSON.stringify({ url: url, archive_artist_name: artist, artist_order: artistOrder }),
      });
      jobId = resp.jobId;
      _mbStatus('bulk import started...showing progress live');
      _mbLog('Job ' + jobId + ' started');
    } catch (err) {
      _mbStatus('Error: ' + (err.message || 'Unknown error'), 'var(--red)');
      btn.disabled = false;
      return;
    }

    // The import runs entirely on the server. The SSE stream can drop (idle
    // proxies, sleep, flaky wifi) without affecting the job — so on a drop we
    // just reconnect to the same job. The server replays past events on
    // connect, so a "seen" set keeps the log from doubling up.
    var seen = {};
    var token = localStorage.getItem('token');
    var evtUrl = API_BASE + '/import/jobs/' + jobId + '/events';

    function _logOnce(key, msg) { if (!seen[key]) { seen[key] = 1; _mbLog(msg); } }

    // Returns 'done' | 'error' | 'dropped'
    async function streamOnce() {
      var response = await fetch(evtUrl, { headers: { 'Authorization': 'Bearer ' + token } });
      if (response.status === 404) return 'error'; // job expired/gone
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      while (true) {
        var result = await reader.read();
        if (result.done) return 'dropped';
        buf += decoder.decode(result.value, { stream: true });
        var parts = buf.split('\n\n');
        buf = parts.pop();
        for (var i = 0; i < parts.length; i++) {
          var line = parts[i].trim();
          if (!line.startsWith('data:')) continue; // skip ': ping' heartbeats
          var evt;
          try { evt = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }

          if (evt.type === 'status') {
            _mbStatus(evt.message);
            _logOnce('s:' + evt.message, evt.message);
          } else if (evt.type === 'comp_start') {
            var who = evt.artist ? (evt.name + '  ·  ' + evt.artist) : evt.name;
            _mbStatus('Importing ' + evt.index + ' / ' + evt.total + ': ' + who);
            _logOnce('cs:' + evt.index, '▶ ' + evt.index + '/' + evt.total + '  ' + who);
          } else if (evt.type === 'comp_progress') {
            _mbStatus('  ↳ ' + evt.name + ' · track ' + evt.i + '/' + evt.n + ': ' + evt.track);
          } else if (evt.type === 'comp_done') {
            _logOnce('cd:' + evt.name, '✓ ' + evt.name + ' (' + evt.imported + ' tracks)');
          } else if (evt.type === 'comp_failed') {
            _logOnce('cf:' + evt.name, '✗ ' + evt.name + ': ' + (evt.error || 'failed'));
          } else if (evt.type === 'comp_skip') {
            _logOnce('ck:' + evt.name, '⏭ ' + evt.name + ' (already imported, skipping it)');
          } else if (evt.type === 'done') {
            var doneMsg = 'done...' + evt.imported + ' comp' + (evt.imported === 1 ? '' : 's') + ' archived' +
              (evt.failed ? ', ' + evt.failed + ' failed' : '');
            _mbStatus(doneMsg, evt.failed ? 'var(--red)' : 'var(--green)');
            _mbLog(doneMsg);
            return 'done';
          } else if (evt.type === 'error') {
            _mbStatus('Error: ' + evt.message, 'var(--red)');
            _mbLog('Error: ' + evt.message);
            return 'error';
          }
        }
      }
    }

    var drops = 0;
    while (true) {
      var outcome;
      try { outcome = await streamOnce(); }
      catch (e) { outcome = 'dropped'; }
      if (outcome === 'done' || outcome === 'error') break;
      // dropped — the job is still running on the server; reconnect.
      drops++;
      if (drops > 60) {
        _mbStatus('lost connection to the progress, but the import is still going on the server. run the same url again later to see how it ended (comps that are already done get skipped)', 'var(--yellow)');
        break;
      }
      _mbStatus('reconnecting to the progress... (' + drops + ')', 'var(--yellow)');
      await new Promise(function(r) { setTimeout(r, 3000); });
    }
    btn.disabled = false;
    if (startBtn) startBtn.disabled = false;
  }

  // ── Fix Discord thread comps in batches ──────────────────────────────
  var DX_KIND = { linked_queued: 'Import from its link', linked_existing: 'Merge into the copy from its link', rebuild: 'Swap in the right files', not_a_comp: 'No link found', made_upcoming: 'Made Upcoming', renamed: 'Title or creator fix', untouched: 'Looks right', unreadable: 'Thread unreadable', failed: 'Failed' };
  function _dxOffset() { try { return +(localStorage.getItem('wv_dx_offset') || 0); } catch (e) { return 0; } }
  function _dxSetOffset(n) { try { localStorage.setItem('wv_dx_offset', String(n)); } catch (e) {} }

  async function _dxRun(body) {
    await api('/import/thread-repair', { method: 'POST', body: JSON.stringify(body) });
    var st = null;
    for (var i = 0; i < 900; i++) {
      await new Promise(function(r) { setTimeout(r, 2500); });
      st = await api('/import/thread-repair');
      var m = document.getElementById('dx-msg'); if (m) m.textContent = (body.apply ? 'Fixing' : 'Checking') + '… ' + (st.scanned || 0) + ' done' + (st.current ? ' · ' + st.current : '');
      if (!st || st.status !== 'running') break;
    }
    return st;
  }
  window.dxCheck = async function() {
    var btn = document.getElementById('dx-check'); btn.disabled = true;
    var off = _dxOffset();
    try {
      var st = await _dxRun({ limit: 50, offset: off, ai: !!(document.getElementById('dx-ai') || {}).checked });
      _dxSetOffset(off + 50);
      document.getElementById('dx-pos').textContent = 'Checked ' + Math.min(off + 50, st.total || off + 50) + ' of ' + (st.total || '?') + ' thread comps';
      var rows = (st.samples || []).filter(function(x) { return x.kind !== 'gpt'; });
      var gpt = {}; (st.samples || []).forEach(function(x) { if (x.kind === 'gpt') gpt[x.id] = x; });
      var counts = {}; rows.forEach(function(x) { counts[x.kind] = (counts[x.kind] || 0) + 1; });
      document.getElementById('dx-msg').textContent = Object.keys(counts).map(function(k) { return (DX_KIND[k] || k) + ': ' + counts[k]; }).join(' · ');
      var fixable = { linked_queued: 1, linked_existing: 1, rebuild: 1, renamed: 1 };
      document.getElementById('dx-out').innerHTML = rows.length ? '<div style="display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:520px;overflow:auto;">' + rows.map(function(x) {
        var can = !!fixable[x.kind] || (x.kind === 'not_a_comp' && x.to_upcoming);
        var detail = x.kind === 'linked_queued' ? (x.link || '') : x.kind === 'linked_existing' ? 'already on the site' : x.kind === 'rebuild' ? (x.files + ' songs instead of ' + (x.had || 0))
          : x.kind === 'not_a_comp' ? (x.to_upcoming ? 'GPT agrees...clear its songs, use the first pic posted as the cover and mark it Upcoming' + (x.first_image ? '' : ' (no pic in the thread)') : x.needs_gpt ? 'tick "Ask GPT too" and check again to make sure' : 'GPT wasnt sure so it got left alone') : (x.why || '');
        var g = gpt[x.id];
        return '<label style="display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;background:var(--surface-2);font-size:12.5px;">' +
          '<input type="checkbox" class="dx-pick" value="' + x.id + '"' + (x.kind === 'not_a_comp' ? ' data-upcoming="1"' : '') + (can ? ' checked' : ' disabled') + ' style="width:auto;margin:0;">' +
          '<span style="flex:1;min-width:0;"><a href="/album?id=' + encodeURIComponent(x.id) + '" target="_blank" style="color:var(--text);font-weight:700;">' + escHtml(x.title || '') + '</a>' +
          ' <span style="color:var(--text-3);">⭐ ' + (x.stars || 0) + ' · ' + (x.tracks_now || 0) + ' songs now</span><br>' +
          '<span style="color:' + (can ? 'var(--brand)' : 'var(--text-3)') + ';">' + escHtml(DX_KIND[x.kind] || x.kind) + '</span> <span style="color:var(--text-3);word-break:break-all;">' + escHtml(detail) + '</span>' +
          (g && g.reason ? '<br><span style="color:var(--text-3);font-style:italic;">GPT: ' + escHtml(g.reason) + '</span>' : '') + '</span></label>';
      }).join('') + '</div><button class="wv-pill brand" style="margin-top:10px;font-size:12.5px;padding:7px 16px;" onclick="dxFix()">Fix the ticked comps</button>' : '<div class="wv-empty">no thread comps left to check</div>';
    } catch (e) { document.getElementById('dx-msg').textContent = e.message || 'Check failed'; }

  };
  window.dxFix = async function() {
    var ids = Array.prototype.map.call(document.querySelectorAll('.dx-pick:checked'), function(c) { return c.value; });

  window.mgTrackMove = async function(aid, tid, dir) {
    var rows = Array.prototype.slice.call(document.querySelectorAll('#mg-tracks [data-tid]')); var ids = rows.map(function(r) { return r.getAttribute('data-tid'); });
    var i = ids.indexOf(tid), j = i + dir; if (i < 0 || j < 0 || j >= ids.length) return;
    ids.splice(i, 1); ids.splice(j, 0, tid);
    try { await api('/archive-manage/comps/' + aid + '/tracklist', { method: 'PUT', body: JSON.stringify({ tracks: ids.map(function(x, k) { return { track_id: x, position: k }; }) }) }); mgOpen(aid); } catch (e) { alert(e.message || 'Failed'); }
  };
  window.mgTrackToComp = async function(tid) { var into = await _mgPickComp('move this track to which comp?'); if (!into) return; try { await api('/archive-manage/tracks/move', { method: 'POST', body: JSON.stringify({ track_ids: [tid], to_album_id: into.id }) }); mgOpen(_mg.editing); } catch (e) { alert(e.message || 'Failed'); } };

  // Artists tab
  window.mgArtistsInput = function() { clearTimeout(_mg.atimer); _mg.atimer = setTimeout(mgArtistsLoad, 250); };
  window.mgArtistsLoad = async function() {
    var list = document.getElementById('mg-alist'); if (!list) return;
    var q = (document.getElementById('mg-aq') || {}).value || '';
    list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try { var d = await api('/archive-manage/artists' + (q ? '?q=' + encodeURIComponent(q) : '')); _mg.artists = d.artists || []; document.getElementById('mg-acount').textContent = (d.total || 0).toLocaleString() + ' archive artists'; }
    catch (e) { list.innerHTML = '<div class="wv-empty">' + escHtml(e.message) + '</div>'; return; }
    list.innerHTML = _mg.artists.length ? _mg.artists.map(function(g) {
      var sp = Object.keys(g.spellings); var acc = Object.keys(g.accounts);
      return '<div style="display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-md);background:var(--surface-2);">' +
        '<input type="checkbox" ' + (_mg.asel[g.key] ? 'checked' : '') + ' onchange="mgAToggle(\'' + escHtml(g.key) + '\', this.checked)" style="width:16px;height:16px;flex:0 0 auto;margin:0;padding:0;accent-color:var(--brand);">' +
        '<div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:700;">' + escHtml(g.name) + ' <span style="font-size:11.5px;color:var(--text-3);font-weight:500;">' + g.comps + ' comp' + (g.comps === 1 ? '' : 's') + '</span></div>' +
        '<div style="font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (sp.length > 1 ? 'spellings: ' + sp.map(escHtml).join(', ') : '') + '</div></div>' +
        '<button class="wv-see-all" onclick="mgArtistRename(\'' + escHtml(g.key) + '\')">Rename</button>' +
        '<button class="wv-see-all" onclick="document.getElementById(\'mg-q\').value=' + JSON.stringify(g.name).replace(/"/g, '&quot;') + ';mgTab(\'comps\');mgLoad();">Comps</button></div>';
    }).join('') : '<div class="wv-empty">no artists match</div>';
    mgASelRender();
  };
  window.mgAToggle = function(k, on) { if (on) _mg.asel[k] = true; else delete _mg.asel[k]; mgASelRender(); };
  window.mgAClearSel = function() { _mg.asel = {}; mgArtistsLoad(); };
  function mgASelRender() { var n = Object.keys(_mg.asel).length; var b = document.getElementById('mg-abulk'); if (b) b.style.display = n ? 'flex' : 'none'; var c = document.getElementById('mg-aselcount'); if (c) c.textContent = n + ' selected'; }
  function _mgSelSpellings() { var out = []; Object.keys(_mg.asel).forEach(function(k) { var g = _mg.artists.find(function(x) { return x.key === k; }); if (g) out = out.concat(Object.keys(g.spellings)); }); return out; }
  window.mgArtistRename = async function(key) { var g = _mg.artists.find(function(x) { return x.key === key; }); if (!g) return; var to = prompt('rename "' + g.name + '" (' + g.comps + ' comps) to what?', g.name); if (!to || to === g.name) return; try { var r = await api('/archive-manage/artists/rename', { method: 'POST', body: JSON.stringify({ from: Object.keys(g.spellings), to: to }) }); mgArtistsLoad(); } catch (e) { alert(e.message || 'Failed'); } };
  window.mgArtistMerge = async function() { var from = _mgSelSpellings(); if (!from.length) return; var to = prompt('merge ' + Object.keys(_mg.asel).length + ' artist(s) into one name. every comp under them will show this name', from[0]); if (!to) return; try { var r = await api('/archive-manage/artists/rename', { method: 'POST', body: JSON.stringify({ from: from, to: to }) }); _mg.asel = {}; mgArtistsLoad(); alert(r.updated + ' comps are under "' + r.to + '" now'); } catch (e) { alert(e.message || 'Failed'); } };
  window.mgArtistAssign = async function() { var names = _mgSelSpellings(); if (!names.length) return; var acc = await _mgPickAccount(); if (!acc) return; try { var r = await api('/archive-manage/artists/assign', { method: 'POST', body: JSON.stringify({ names: names, artist_id: acc.id }) }); _mg.asel = {}; mgArtistsLoad(); alert(r.comps + ' comps moved under ' + acc.display_name); } catch (e) { alert(e.message || 'Failed'); } };
  mgLoad();

  // ── Comp claims ──────────────────────────────────────────────────────────
  var CL_LABEL = { rename: 'Wrong name, rename', transfer: 'Move to their account', stolen: 'Posted by someone else', remove: 'Take down', other: 'Other' };
  window.clLoad = async function(status) {
    status = status || 'open';
    ['open', 'approved', 'rejected'].forEach(function(t) { var b = document.getElementById('cl-tab-' + t); if (b) b.classList.toggle('on', t === status); });
    var list = document.getElementById('cl-list'); if (!list) return;
    list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    var d; try { d = await api('/claims?status=' + status); } catch (e) { list.innerHTML = '<div class="wv-empty">' + escHtml(e.message) + '</div>'; return; }
    var c = d.counts || {};
    var ob = document.getElementById('cl-tab-open'); if (ob) ob.textContent = 'Open' + (c.open ? ' (' + c.open + ')' : '');
    if (!d.claims.length) { list.innerHTML = '<div class="wv-empty">no ' + (status === 'open' ? 'open' : status) + ' claims</div>'; return; }
    list.innerHTML = d.claims.map(function(k) {
      var links = String(k.comp_links || '').split(/\s+/).filter(Boolean);
      return '<div style="background:var(--surface-2);border-radius:var(--r-lg);padding:14px 16px;" id="cl-' + k.id + '">' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;"><b>' + escHtml(CL_LABEL[k.claim_type] || k.claim_type) + '</b><span class="wv-chip">' + escHtml(k.username || 'user') + '</span><span style="font-size:12px;color:var(--text-3);">' + new Date(k.created_at).toLocaleString() + '</span>' + (k.status !== 'open' ? '<span class="wv-chip ' + (k.status === 'approved' ? 'acc' : 'bad') + '">' + k.status + '</span>' : '') + '</div>' +
        '<div style="font-size:12.5px;color:var(--text-2);display:grid;gap:4px;">' +
          '<div><span style="color:var(--text-3);">Comps:</span> ' + links.map(function(u) { return /^https?:/.test(u) ? '<a href="' + escHtml(u) + '" target="_blank" style="color:var(--brand);">' + escHtml(u.replace(/^https?:\/\/(www\.)?/, '')) + '</a>' : escHtml(u); }).join(' · ') + '</div>' +
          (k.listed_as ? '<div><span style="color:var(--text-3);">Listed as:</span> ' + escHtml(k.listed_as) + (k.wanted_name ? ' → <b>' + escHtml(k.wanted_name) + '</b>' : '') + '</div>' : (k.wanted_name ? '<div><span style="color:var(--text-3);">Wants:</span> <b>' + escHtml(k.wanted_name) + '</b></div>' : '')) +
          '<div><span style="color:var(--text-3);">Proof:</span> <span style="white-space:pre-wrap;">' + escHtml(k.proof).replace(/https?:\/\/\S+/g, function(u) { return /\.(jpe?g|png|webp|gif)(\?|$)/i.test(u) ? '<a href="' + u + '" target="_blank"><img src="' + u + '" style="max-width:160px;max-height:120px;border-radius:8px;vertical-align:middle;margin:2px 4px 2px 0;"></a>' : '<a href="' + u + '" target="_blank" style="color:var(--brand);">' + u + '</a>'; }) + '</span></div>' +
          (k.message ? '<div><span style="color:var(--text-3);">Note:</span> <span style="white-space:pre-wrap;">' + escHtml(k.message) + '</span></div>' : '') +
          (k.contact ? '<div><span style="color:var(--text-3);">Contact:</span> ' + escHtml(k.contact) + '</div>' : '') +
          (k.staff_note ? '<div><span style="color:var(--text-3);">Staff note:</span> ' + escHtml(k.staff_note) + '</div>' : '') +
        '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">' +
          (k.status === 'open' ? '<button class="wv-pill" style="font-size:12px;padding:5px 12px;" onclick="clAiReview(\'' + k.id + '\')">✨ AI resolve</button>' : '') +
          '<button class="wv-pill" style="font-size:12px;padding:5px 12px;" onclick="clOpenComps(\'' + k.id + '\')">Open these comps in the manager</button>' +
          (k.claim_type === 'transfer' || k.claim_type === 'stolen' ? '<button class="wv-pill" style="font-size:12px;padding:5px 12px;" onclick="clTransfer(\'' + k.id + '\')">Move comps to their account</button>' : '') +
          (k.status !== 'approved' ? '<button class="wv-pill brand" style="font-size:12px;padding:5px 12px;" onclick="clSet(\'' + k.id + '\',\'approved\')">Approve</button>' : '') +
          (k.status !== 'rejected' ? '<button class="wv-pill" style="font-size:12px;padding:5px 12px;color:var(--red);" onclick="clSet(\'' + k.id + '\',\'rejected\')">Decline</button>' : '') +
          (k.status !== 'open' ? '<button class="wv-see-all" onclick="clSet(\'' + k.id + '\',\'open\')">Reopen</button>' : '') +
        '</div><div id="cl-ai-' + k.id + '"></div></div>';
    }).join('');
  };
  var CL_ACT = { move_to_account: 'Move to their account', set_creator_name: 'Credit as', set_title: 'Rename to', take_down: 'Take down' };
  function _clAiBox(id, html) { var b = document.getElementById('cl-ai-' + id); if (b) b.innerHTML = html; return b; }
  function _clAiRender(id, rv) {
    var dec = rv.decision === 'approve' ? '<span class="wv-chip acc">AI: approve</span>' : rv.decision === 'decline' ? '<span class="wv-chip bad">AI: decline</span>' : '<span class="wv-chip warn">AI: needs a person</span>';
    var titles = {}; (rv.comps || []).forEach(function(c) { titles[c.id] = c.title + (c.credited_as ? ' (' + c.credited_as + ')' : ''); });
    var acts = (rv.actions || []).map(function(a) {
      return '<li><b>' + escHtml(CL_ACT[a.type] || a.type) + (a.value ? ' ' + escHtml(a.value) : '') + '</b> · <a href="/album?id=' + encodeURIComponent(a.album_id) + '" target="_blank" style="color:var(--brand);">' + escHtml(titles[a.album_id] || a.album_id) + '</a></li>';
    }).join('');
    var canAuto = rv.decision !== 'needs_human' && !(rv.actions || []).some(function(a) { return a.type === 'take_down'; });
    _clAiBox(id, '<div style="margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--hair);">' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">' + dec + '<span style="font-size:11.5px;color:var(--text-3);">' + escHtml(rv.confidence || '') + ' confidence</span></div>' +
      '<div style="font-size:12.5px;color:var(--text);margin-bottom:6px;">' + escHtml(rv.summary || '') + '</div>' +
      (acts ? '<div style="font-size:12px;color:var(--text-3);">if you approve it, it will:</div><ul style="margin:4px 0 8px 18px;padding:0;font-size:12.5px;color:var(--text-2);">' + acts + '</ul>' : '<div style="font-size:12px;color:var(--text-3);margin-bottom:8px;">no changes to comps</div>') +
      (rv.dropped ? '<div style="font-size:11.5px;color:var(--text-3);margin-bottom:6px;">' + rv.dropped + ' suggested change(s) ignored cause they pointed at comps that arent in this claim</div>' : '') +
      '<div style="font-size:12px;color:var(--text-3);margin-bottom:4px;">note they will see:</div>' +
      '<textarea id="cl-ai-note-' + id + '" class="wv-input" rows="2" style="width:100%;font-size:12.5px;padding:7px 10px;resize:vertical;">' + escHtml(rv.user_note || '') + '</textarea>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' +
        '<button class="wv-pill brand" style="font-size:12px;padding:5px 12px;" onclick="clAiApply(\'' + id + '\',\'approve\')">Approve' + (acts ? ' and make these changes' : '') + '</button>' +
        '<button class="wv-pill" style="font-size:12px;padding:5px 12px;color:var(--red);" onclick="clAiApply(\'' + id + '\',\'decline\')">Decline</button>' +
        (canAuto ? '<button class="wv-pill" style="font-size:12px;padding:5px 12px;" onclick="clAiApply(\'' + id + '\',\'ai\')">Let AI decide (' + (rv.decision === 'approve' ? 'approve' : 'decline') + ')</button>' : '') +
      '</div></div>');
  }
  window.clAiReview = async function(id) {
    _clAiBox(id, '<div style="margin-top:10px;font-size:12.5px;color:var(--text-3);">✨ GPT is checking the comps, the proof and the database...</div>');
    try { var d = await api('/claims/' + id + '/ai-review', { method: 'POST', body: '{}' }); _clAiRender(id, d.review); }
    catch (e) { _clAiBox(id, '<div style="margin-top:10px;font-size:12.5px;color:var(--red);">' + escHtml(e.message || 'AI review failed') + '</div>'); }
  };
  window.clAiApply = async function(id, mode) {
    var noteEl = document.getElementById('cl-ai-note-' + id);
    var label = mode === 'approve' ? 'approve this claim and make the changes listed?' : mode === 'decline' ? 'decline this claim?' : 'go with what the AI picked?';
    if (!confirm(label)) return;
    try {
      var r = await api('/claims/' + id + '/ai-apply', { method: 'POST', body: JSON.stringify({ mode: mode, note: noteEl ? noteEl.value : '' }) });
      if (typeof wvToast === 'function') wvToast((r.decision === 'approve' ? 'Approved' : 'Declined') + (r.done && r.done.length ? ' · ' + r.done.length + ' change(s) made' : ''));
      clLoad('open'); if (typeof mgLoad === 'function') mgLoad();
    } catch (e) { alert(e.message || 'Failed'); }
  };
  window.clAiAll = async function() {
    var btn = document.getElementById('cl-ai-all');
    var ids = Array.prototype.map.call(document.querySelectorAll('#cl-list > [id^="cl-"]'), function(el) { return el.id.slice(3); }).filter(function(x) { return /^[0-9a-f-]{36}$/.test(x); });
    if (!ids.length) return;
    btn.disabled = true;
    for (var i = 0; i < ids.length; i++) { btn.textContent = '✨ Reviewing ' + (i + 1) + ' of ' + ids.length + '…'; await clAiReview(ids[i]); }
    btn.disabled = false; btn.textContent = '✨ AI review all open';
  };
  window.clSet = async function(id, status) {
    var note = prompt(status === 'approved' ? 'note for them (what you did)' : status === 'rejected' ? 'why it got declined (they will see this)' : 'note', '');
    if (note === null) return;
    try { await api('/claims/' + id, { method: 'PATCH', body: JSON.stringify({ status: status, staff_note: note }) }); clLoad(status === 'open' ? 'open' : 'open'); } catch (e) { alert(e.message || 'Failed'); }
  };
  window.clOpenComps = async function(id) {
    try { var d = await api('/claims/' + id + '/comps'); if (!d.comps.length) { alert('none of the pasted links go to a comp on the site'); return; }
      document.getElementById('mg-q').value = d.comps[0].title; mgTab('comps'); mgLoad(); document.getElementById('arc-manage-card').scrollIntoView({ behavior: 'smooth' }); if (d.comps.length === 1) mgOpen(d.comps[0].id);
    } catch (e) { alert(e.message || 'Failed'); }
  };
  window.clTransfer = async function(id) {
    try {
      var d = await api('/claims/' + id + '/comps');
      if (!d.comps.length) { alert('none of the pasted links go to a comp on the site'); return; }
      if (!d.claimant_artist) { alert('this user doesnt have an artist profile yet...they need to make one before comps can be moved to them'); return; }
      if (!confirm('move ' + d.comps.length + ' comp(s) to the account of ' + d.claimant_artist.display_name + ' as their own uploads?')) return;
      await api('/archive-manage/comps/bulk', { method: 'POST', body: JSON.stringify({ ids: d.comps.map(function(c) { return c.id; }), action: 'assign_account', value: d.claimant_artist.id }) });
      for (var i = 0; i < d.comps.length; i++) await api('/archive-manage/comps/' + d.comps[i].id, { method: 'PATCH', body: JSON.stringify({ is_archive: false, archive_artist_name: d.claimant_artist.display_name }) });
      alert('moved...now approve the claim with a note'); mgLoad();
    } catch (e) { alert(e.message || 'Failed'); }
  };
  clLoad('open');
</script>
</body>
</html>
