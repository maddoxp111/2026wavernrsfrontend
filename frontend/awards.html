<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>wavernrs — hall of fame</title>
  <meta name="description" content="Every Edit of the Week winner and honored yedit on wavernrs, in one place.">
  <link rel="stylesheet" href="/css/style.css?v=7e529adad8f3">
  <script src="/js/status-card.js?v=7e529adad8f3"></script>
  <script src="/js/down.js?v=7e529adad8f3"></script>
  <style>
    .aw-wrap {
      --aw-gold: #f2c14e; --aw-gold-2: #d99a2b; --aw-gold-ink: #2b1d00;
      --aw-gold-text: color-mix(in srgb, var(--aw-gold) 62%, var(--text));
      --aw-gold-soft: color-mix(in srgb, var(--aw-gold) 14%, transparent);
      container-type: inline-size; container-name: aw; display: flex; flex-direction: column; min-width: 0; padding-bottom: 32px;
    }
    .theme-light .aw-wrap { --aw-gold-text: color-mix(in srgb, #b07a09 80%, var(--text)); --aw-gold-soft: color-mix(in srgb, var(--aw-gold) 22%, transparent); }
    .aw-wrap :focus-visible { outline: 2px solid var(--aw-gold-text); outline-offset: 2px; }

    .aw-hero {
      position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: center;
      padding: 30px 32px; border-radius: 14px; border: 1px solid var(--hair); overflow: hidden; isolation: isolate;
      background:
        radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--aw-gold) 20%, transparent) 0%, transparent 60%),
        radial-gradient(70% 90% at 0% 100%, color-mix(in srgb, var(--aw-gold-2) 10%, transparent) 0%, transparent 70%),
        var(--surface);
    }
    .aw-hero::before {
      content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
      background-image: radial-gradient(color-mix(in srgb, var(--aw-gold) 26%, transparent) 1px, transparent 1.5px);
      background-size: 18px 18px;
      -webkit-mask-image: linear-gradient(100deg, transparent 30%, #000 100%); mask-image: linear-gradient(100deg, transparent 30%, #000 100%);
    }
    .aw-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--aw-gold-text); }
    .aw-title { font-size: clamp(34px, 5.4vw, 56px); font-weight: 900; letter-spacing: -.045em; line-height: 1; margin: 10px 0 10px; text-wrap: balance; }
    .aw-sub { margin: 0; max-width: 520px; font-size: 15px; line-height: 1.5; font-weight: 500; color: var(--text-2); }
    .aw-stats { display: flex; flex-wrap: wrap; gap: 10px 34px; margin: 24px 0 24px; }
    .aw-stat b { display: block; font-size: 32px; font-weight: 900; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
    .aw-stat span { display: block; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: lowercase; }
    .aw-stat.gold b { color: var(--aw-gold-text); }
    .aw-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .aw-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px;
      border-radius: var(--r-pill); border: 1px solid var(--hair-strong); background: transparent; color: var(--text);
      font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; white-space: nowrap; text-decoration: none;
      transition: transform 120ms var(--ease), background 140ms var(--ease), border-color 140ms var(--ease), filter 140ms var(--ease);
    }
    .aw-btn:hover { border-color: var(--text); }
    .aw-btn:active { transform: scale(.97); }
    .aw-btn.gold { border: 0; color: var(--aw-gold-ink); background: linear-gradient(135deg, #ffd978 0%, var(--aw-gold) 45%, var(--aw-gold-2) 100%); box-shadow: 0 6px 20px color-mix(in srgb, var(--aw-gold-2) 35%, transparent); }
    .aw-btn.gold:hover { filter: brightness(1.06); }
    .aw-btn[disabled] { opacity: .55; cursor: default; }
    .aw-btn.is-busy svg { animation: awSpin 900ms linear infinite; }
    @keyframes awSpin { to { transform: rotate(360deg); } }

    .aw-stack { position: relative; height: 250px; }
    .aw-stack-c {
      position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 10px; overflow: hidden;
      background: var(--surface-2); box-shadow: 0 14px 34px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06);
      transition: transform 420ms var(--ease);
    }
    .aw-stack-c img, .aw-stack-c .g { width: 100%; height: 100%; object-fit: cover; display: block; }
    .aw-stack-c:nth-child(1) { transform: translate(-112px, 18px) rotate(-14deg) scale(.86); }
    .aw-stack-c:nth-child(2) { transform: translate(-58px, 2px) rotate(-7deg) scale(.93); }
    .aw-stack-c:nth-child(3) { transform: translate(112px, 18px) rotate(14deg) scale(.86); }
    .aw-stack-c:nth-child(4) { transform: translate(58px, 2px) rotate(7deg) scale(.93); }
    .aw-stack-c:nth-child(5) { transform: translate(0, -10px); z-index: 2; box-shadow: 0 18px 44px rgba(0,0,0,.45), 0 0 0 2px var(--aw-gold); }
    .aw-hero:hover .aw-stack-c:nth-child(1) { transform: translate(-130px, 22px) rotate(-18deg) scale(.86); }
    .aw-hero:hover .aw-stack-c:nth-child(3) { transform: translate(130px, 22px) rotate(18deg) scale(.86); }
    .aw-hero:hover .aw-stack-c:nth-child(5) { transform: translate(0, -18px) scale(1.03); }
    .aw-stack-trophy {
      position: absolute; z-index: 3; left: 50%; top: 50%; width: 46px; height: 46px; margin: 44px 0 0 50px; border-radius: 50%;
      display: grid; place-items: center; color: var(--aw-gold-ink); background: linear-gradient(135deg, #ffe39a, var(--aw-gold) 50%, var(--aw-gold-2));
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
    }
    .aw-stack.skel .aw-stack-c { animation: awPulse 1.4s ease-in-out infinite; }

    .aw-sec { margin-top: 34px; }
    .aw-sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .aw-sec-head h2 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
    .aw-sec-head p { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--text-3); }

    .aw-lb { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
    .aw-podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .aw-pod {
      position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0;
      padding: 20px 12px 16px; border-radius: 12px; border: 1px solid var(--hair); background: var(--surface); color: var(--text); text-decoration: none;
      transition: transform 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease);
    }
    .aw-pod:hover { transform: translateY(-2px); border-color: var(--hair-strong); background: var(--surface-hover); }
    .aw-pod.r1 { border-color: color-mix(in srgb, var(--aw-gold) 45%, var(--hair)); background: linear-gradient(180deg, var(--aw-gold-soft), var(--surface) 70%); }
    .aw-pod .medal {
      position: absolute; top: 10px; left: 10px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      font-size: 12px; font-weight: 900; color: #1c1400; background: linear-gradient(135deg, #ffe39a, var(--aw-gold) 55%, var(--aw-gold-2));
    }
    .aw-pod.r2 .medal { background: linear-gradient(135deg, #f4f6f8, #c3c9d1 55%, #98a0ab); color: #1d2228; }
    .aw-pod.r3 .medal { background: linear-gradient(135deg, #f3c9a1, #cd8b55 55%, #9c5f2f); color: #2a1406; }
    .aw-av { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--surface-2); display: grid; place-items: center; font-size: 22px; font-weight: 900; color: #fff; }
    .aw-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .aw-pod.r1 .aw-av { width: 84px; height: 84px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--aw-gold); }
    .aw-pod .nm { max-width: 100%; margin-top: 6px; font-size: 15px; font-weight: 800; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .aw-pod .tot { font-size: 26px; font-weight: 900; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
    .aw-pod.r1 .tot { color: var(--aw-gold-text); }
    .aw-pod .tot small { font-size: 12px; font-weight: 700; letter-spacing: 0; color: var(--text-3); margin-left: 3px; }
    .aw-brk { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 2px; }
    .aw-brk span { font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
    .aw-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 0 8px; align-content: start; border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); padding: 6px; min-width: 0; }
    .aw-lrow {
      display: grid; grid-template-columns: 26px 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 52px; padding: 6px 10px;
      border-radius: 8px; color: var(--text); text-decoration: none; transition: background 140ms var(--ease);
    }
    .aw-lrow:hover { background: var(--surface-hover); }
    .aw-lrow .rk { font-size: 14px; font-weight: 800; color: var(--text-3); text-align: center; font-variant-numeric: tabular-nums; }
    .aw-lrow .aw-av { width: 40px; height: 40px; font-size: 14px; }
    .aw-lrow .nm { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .aw-lrow .sm { font-size: 12px; color: var(--text-3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .aw-lrow .ct { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .aw-bar { height: 3px; border-radius: 3px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
    .aw-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--aw-gold-2), var(--aw-gold)); }

    .aw-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hair); margin: 38px 0 18px; overflow-x: auto; scrollbar-width: none; }
    .aw-tabs::-webkit-scrollbar { display: none; }
    .aw-tab {
      position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px;
      background: none; border: 0; color: var(--text-3); font: inherit; font-size: 15px; font-weight: 800; letter-spacing: -.01em;
      cursor: pointer; white-space: nowrap; transition: color 140ms var(--ease);
    }
    .aw-tab:hover { color: var(--text-2); }
    .aw-tab[aria-selected="true"] { color: var(--text); }
    .aw-tab[aria-selected="true"]::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, var(--aw-gold-2), var(--aw-gold)); }
    .aw-tab .n { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--text-2); font-variant-numeric: tabular-nums; }
    .aw-tab[aria-selected="true"] .n { background: var(--aw-gold-soft); color: var(--aw-gold-text); }
    .aw-tab[hidden] { display: none; }
    .aw-tab .sh { display: none; }
    .aw-about { margin: -6px 0 16px; font-size: 13.5px; line-height: 1.5; color: var(--text-2); font-weight: 500; max-width: 720px; }

    .aw-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 6px; }
    .aw-search { position: relative; flex: 1 1 240px; min-width: 0; max-width: 360px; }
    .aw-search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
    .aw-search input {
      width: 100%; box-sizing: border-box; min-height: 42px; padding: 0 40px 0 38px; border-radius: var(--r-pill);
      border: 1px solid var(--hair-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
    }
    .aw-search input::placeholder { color: var(--text-3); }
    .aw-search input:focus { outline: none; border-color: var(--aw-gold-text); box-shadow: 0 0 0 3px var(--aw-gold-soft); }
    .aw-search input::-webkit-search-cancel-button { display: none; }
    .aw-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--text-3); cursor: pointer; display: grid; place-items: center; }
    .aw-clear:hover { background: var(--surface-2); color: var(--text); }
    .aw-clear[hidden] { display: none; }
    .aw-seg { display: inline-flex; background: var(--glass-pill-bg); border-radius: var(--r-pill); padding: 3px; }
    .aw-seg button {
      font: inherit; font-size: 12.5px; font-weight: 700; border: 0; cursor: pointer; min-height: 36px; padding: 0 13px;
      border-radius: var(--r-pill); background: transparent; color: var(--text-2); white-space: nowrap;
      transition: background 140ms var(--ease), color 140ms var(--ease);
    }
    .aw-seg button[aria-pressed="true"] { background: var(--text); color: var(--page-bg-base); }
    .aw-ctl-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .aw-note { min-height: 18px; margin: 4px 0 8px; font-size: 12px; font-weight: 600; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
    .aw-note .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--aw-gold); animation: awPulse 1.2s ease-in-out infinite; }

    .aw-group { margin-top: 20px; }
    .aw-group:first-child { margin-top: 8px; }
    .aw-gh { display: flex; align-items: baseline; gap: 10px; padding: 10px 0; margin-bottom: 6px; background: var(--page-bg-base); border-bottom: 1px solid var(--hair); }
    .aw-gh h3 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
    .aw-gh span { font-size: 12.5px; font-weight: 700; color: var(--text-3); }
    .aw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 22px 18px; padding-top: 8px; }

    .aw-card { position: relative; min-width: 0; }
    .aw-art { position: relative; display: block; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); box-shadow: 0 1px 0 var(--hair); }
    .aw-art img, .aw-art .g { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 380ms var(--ease); }
    .aw-art .g { display: grid; place-items: center; color: rgba(255,255,255,.9); }
    .aw-art .g svg { opacity: .7; }
    .aw-card:hover .aw-art img, .aw-card:hover .aw-art .g { transform: scale(1.04); }
    .aw-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, transparent 34%, transparent 62%, rgba(0,0,0,.35) 100%); pointer-events: none; }
    .aw-rib {
      position: absolute; top: 8px; left: 8px; z-index: 1; display: inline-flex; align-items: center; gap: 5px; max-width: calc(100% - 16px);
      padding: 4px 9px 4px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; color: #231800;
      background: linear-gradient(135deg, #ffe7a3 0%, var(--aw-gold) 45%, var(--aw-gold-2) 100%); box-shadow: 0 3px 10px rgba(0,0,0,.3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .aw-multi { position: absolute; top: 8px; right: 8px; z-index: 1; display: inline-flex; align-items: center; gap: 3px; padding: 3px 7px; border-radius: var(--r-pill); font-size: 10.5px; font-weight: 900; color: #fff; background: rgba(0,0,0,.55); }
    .aw-multi svg { color: var(--aw-gold); }
    .aw-play {
      position: absolute; right: 10px; bottom: 10px; z-index: 2; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
      display: grid; place-items: center; color: var(--aw-gold-ink); background: linear-gradient(135deg, #ffe39a, var(--aw-gold) 50%, var(--aw-gold-2));
      box-shadow: 0 8px 22px rgba(0,0,0,.4); opacity: 0; transform: translateY(8px) scale(.92);
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    }
    .aw-play svg { margin-left: 2px; }
    .aw-card:hover .aw-play, .aw-play:focus-visible, .aw-play.is-busy { opacity: 1; transform: none; }
    .aw-play:active { transform: scale(.94); }
    .aw-play.is-busy svg { animation: awSpin 900ms linear infinite; margin-left: 0; }
    @media (hover: none) { .aw-play { opacity: 1; transform: none; width: 42px; height: 42px; } }
    .aw-meta { padding: 10px 2px 0; min-width: 0; }
    .aw-t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
    .aw-t:hover { text-decoration: underline; text-underline-offset: 2px; }
    .aw-o { margin-top: 3px; font-size: 12.5px; font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .aw-by { margin-top: 3px; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--text-3); }
    .aw-by a { color: var(--text-2); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .aw-by a:hover { color: var(--text); text-decoration: underline; }
    .aw-by .d { flex-shrink: 0; white-space: nowrap; }
    .aw-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .aw-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--text-2); font-variant-numeric: tabular-nums; }
    .aw-chip.vote { background: var(--aw-gold-soft); color: var(--aw-gold-text); }
    .aw-card.is-new { animation: awIn 380ms var(--ease) both; }
    @keyframes awIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .aw-sk { border-radius: 8px; background: var(--surface-2); animation: awPulse 1.4s ease-in-out infinite; }
    @keyframes awPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .aw-sk-card .aw-sk.a { aspect-ratio: 1 / 1; }
    .aw-sk-card .aw-sk.l1 { height: 13px; width: 80%; margin-top: 12px; border-radius: 4px; }
    .aw-sk-card .aw-sk.l2 { height: 11px; width: 50%; margin-top: 8px; border-radius: 4px; }
    .aw-sk-num { display: inline-block; width: 64px; height: 30px; border-radius: 6px; }

    .aw-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 56px 20px; border: 1px dashed var(--hair-strong); border-radius: 12px; color: var(--text-2); }
    .aw-empty .ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--aw-gold-soft); color: var(--aw-gold-text); margin-bottom: 4px; }
    .aw-empty h3 { margin: 0; font-size: 17px; font-weight: 800; color: var(--text); }
    .aw-empty p { margin: 0; font-size: 13.5px; max-width: 380px; line-height: 1.5; }
    .aw-empty .aw-btn { margin-top: 10px; }

    .aw-staff-eds { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 14px; }
    .aw-staff-eds::-webkit-scrollbar { display: none; }
    .aw-sed { display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-height: 52px; padding: 8px 16px 8px 8px; border-radius: var(--r-pill); border: 1px solid var(--hair); background: var(--surface); color: var(--text); text-decoration: none; }
    .aw-sed:hover { border-color: var(--hair-strong); }
    .aw-sed .aw-av { width: 36px; height: 36px; font-size: 13px; }
    .aw-sed .tx b { display: block; font-size: 13.5px; font-weight: 800; }
    .aw-sed .tx i { display: block; font-style: normal; font-size: 11.5px; color: var(--text-3); font-weight: 700; }

    @container aw (max-width: 1020px) {
      .aw-lb { grid-template-columns: minmax(0, 1fr); }
    }
    @container aw (max-width: 760px) {
      .aw-hero { grid-template-columns: minmax(0, 1fr); padding: 24px 20px; gap: 0; }
      .aw-stack { order: -1; height: 150px; margin: -6px 0 10px; }
      .aw-stack-c { width: 104px; height: 104px; margin: -52px 0 0 -52px; }
      .aw-stack-c:nth-child(1) { transform: translate(-96px, 12px) rotate(-14deg) scale(.84); }
      .aw-stack-c:nth-child(2) { transform: translate(-50px, 2px) rotate(-7deg) scale(.92); }
      .aw-stack-c:nth-child(3) { transform: translate(96px, 12px) rotate(14deg) scale(.84); }
      .aw-stack-c:nth-child(4) { transform: translate(50px, 2px) rotate(7deg) scale(.92); }
      .aw-hero:hover .aw-stack-c:nth-child(1) { transform: translate(-96px, 12px) rotate(-14deg) scale(.84); }
      .aw-hero:hover .aw-stack-c:nth-child(3) { transform: translate(96px, 12px) rotate(14deg) scale(.84); }
      .aw-hero:hover .aw-stack-c:nth-child(5) { transform: translate(0, -10px); }
      .aw-stack-trophy { width: 38px; height: 38px; margin: 26px 0 0 30px; }
      .aw-stats { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); justify-content: start; gap: 10px 24px; margin: 20px 0; }
      .aw-stat b { font-size: 26px; }
      .aw-stat span { font-size: 11.5px; }
    }
    @container aw (max-width: 560px) {
