<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — discover</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script src="/js/playlists.js"></script>
<script>
var params = new URLSearchParams(location.search);
var activeTab = params.get('tab') || 'recent';
var activeEra = params.get('era') || null;
var _discoverItems = [];
initPlayer();

async function initDiscover() {
  var view = document.getElementById('view');
  view.innerHTML =
    '<div style="display:flex;flex-direction:column;gap:22px;">' +
    '<h1 style="margin:0;font-size:38px;font-weight:800;letter-spacing:-0.035em;">Discover</h1>' +
    '<div id="era-filter" style="display:flex;gap:8px;flex-wrap:wrap;" class="no-scrollbar"><div class="loading"><div class="spinner" style="width:18px;height:18px;border-width:2px;"></div></div></div>' +
    '<div class="wv-utabs" id="disc-tabs">' +
    '<button class="wv-utab' + (activeTab==='recent'?' active':'') + '" onclick="setTab(\'recent\')">Recent</button>' +
    '<button class="wv-utab' + (activeTab==='trending'?' active':'') + '" onclick="setTab(\'trending\')">Trending</button>' +
    '</div>' +
    '<div id="disc-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px;"><div class="loading"><div class="spinner"></div></div></div>' +
    '</div>';
  loadEraTags();
  loadTracks();
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.wv-utab').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.toLowerCase().trim() === tab);
  });
  loadTracks();
  var u = new URL(location.href); u.searchParams.set('tab', tab); history.replaceState(null,'',u);
}

function setEra(eraId) {
  activeEra = eraId || null;
  document.querySelectorAll('.era-pill').forEach(function(p) { p.classList.toggle('is-active', p.dataset.era == eraId); });
  loadTracks();
  var u = new URL(location.href);
  if (eraId) u.searchParams.set('era', eraId); else u.searchParams.delete('era');
  history.replaceState(null,'',u);
}

async function loadEraTags() {
  var el = document.getElementById('era-filter'); if (!el) return;
  try {
    var tags = await api('/eratags');
    el.innerHTML = '<button class="wv-pill era-pill' + (!activeEra?' is-active':'') + '" style="font-size:12px;" data-era="" onclick="setEra(null)">All</button>' +
      tags.map(function(t) { return '<button class="wv-pill era-pill' + (activeEra==t.id?' is-active':'') + '" style="font-size:12px;" data-era="' + t.id + '" onclick="setEra(\'' + t.id + '\')">' + escHtml(t.name) + '</button>'; }).join('');
  } catch(_) { el.innerHTML = ''; }
}

async function loadTracks() {
  var grid = document.getElementById('disc-grid'); if (!grid) return;
  grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    var items = [];
    if (activeTab === 'trending') { items = await api('/discover/trending'); }
    else if (activeEra) { var d = await api('/discover/era/' + activeEra); items = Array.isArray(d) ? d : []; }
    else { var d = await api('/discover'); items = d.recent || []; }
    _discoverItems = items;
    if (!items.length) { grid.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">Nothing here yet</div>'; return; }
    grid.innerHTML = items.map(compCardHTML).join('');
  } catch(err) { grid.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">Failed: ' + escHtml(err.message) + '</div>'; }
}

function compCardHTML(item) {
  var seed = item.title||'', isAlbum = item._type==='album', artist = item.artists ? item.artists.display_name : 'Unknown';
  var action = isAlbum ? "navigate('/album.html?id="+item.id+"')" : "navigate('/track.html?id="+item.id+"')";
  var bg = coverGradient(seed);
  return '<div class="wv-comp-card" onclick="'+action+'">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:'+bg+';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
    '<div aria-hidden style="position:absolute;inset:0;background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0) 45%),radial-gradient(80% 80% at 80% 90%,rgba(0,0,0,0.28) 0%,rgba(0,0,0,0) 60%);pointer-events:none;border-radius:14px;"></div>' +
    (isAlbum?'<div style="position:absolute;top:8px;left:8px;padding:2px 8px;background:rgba(255,255,255,0.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:rgba(255,255,255,0.96);font-size:9px;font-weight:700;letter-spacing:0.06em;border-radius:4px;text-transform:uppercase;">comp</div>':'') +
    (item.cover_url?'<img src="'+escHtml(item.cover_url)+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.display='none'">':'') +
    '<button class="wv-cover-play-btn" onclick="event.stopPropagation();playDiscover(\''+item.id+'\')">' +
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg></button>' +
    '</div></div>' +
    '<div class="wv-comp-card-title">'+escHtml(item.title)+'</div>' +
    '<div class="wv-comp-card-artist">'+escHtml(artist)+'</div></div>';
}

function playDiscover(id) {
  var item = _discoverItems.find(function(i){return i.id===id;});
  if (!item) return;
  if (item._type==='album') navigate('/album.html?id='+id);
  else playTrack({id:item.id,title:item.title,artist_name:item.artists?item.artists.display_name:'',ia_url:item.ia_url,cover_url:item.cover_url});
}

initDiscover();
</script>
</body>
</html>
