<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — discover</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/discover.html" class="active">Discover</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" id="nav-search" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q.length>=2)location.href='/search.html?q='+encodeURIComponent(q);}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div class="container">
  <div class="page-header" style="padding-bottom:20px;">
    <h1 class="page-title">Discover</h1>
  </div>

  <!-- Era tag filter pills -->
  <div id="era-filter" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;">
    <div class="loading" style="padding:4px;"><div class="spinner" style="width:18px;height:18px;border-width:2px;"></div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" style="margin-bottom:24px;">
    <button class="tab" id="tab-recent" onclick="setTab('recent')">Recent</button>
    <button class="tab" id="tab-trending" onclick="setTab('trending')">Trending</button>
  </div>

  <div id="tracks-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">🏠</span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item active">
    <span class="mobile-nav-icon">🔍</span>
    <span>Discover</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">🔎</span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item">
    <span class="mobile-nav-icon">🎛️</span>
    <span>Dashboard</span>
  </a>
</div>

<!-- Player -->
<div id="player" class="hidden">
  <div class="player-track">
    <div class="player-cover" id="player-cover">🎵</div>
    <div>
      <div class="player-title" id="player-title">—</div>
      <div class="player-artist" id="player-artist">—</div>
    </div>
  </div>
  <div class="player-controls">
    <button class="player-btn player-btn-play" onclick="togglePlay()" id="player-play-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
  <div class="player-progress">
    <span class="player-time" id="time-elapsed">0:00</span>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="player-time" id="time-total">0:00</span>
  </div>
  <div class="player-volume">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text-secondary)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let activeTab = params.get('tab') || 'recent';
  let activeEra = params.get('era') || null;

  updateNav();
  initPlayer();
  renderSiteBanners();

  // Set active tab styles
  function setTab(tab) {
    activeTab = tab;
    document.getElementById('tab-recent').classList.toggle('active', tab === 'recent');
    document.getElementById('tab-trending').classList.toggle('active', tab === 'trending');
    loadTracks();
    // Update URL without reload
    const u = new URL(location.href);
    u.searchParams.set('tab', tab);
    history.replaceState(null, '', u);
  }

  function setEra(eraId) {
    activeEra = eraId;
    document.querySelectorAll('.era-pill').forEach(p => {
      p.classList.toggle('active', p.dataset.era == eraId);
    });
    loadTracks();
    // Update URL
    const u = new URL(location.href);
    if (eraId) u.searchParams.set('era', eraId);
    else u.searchParams.delete('era');
    history.replaceState(null, '', u);
  }

  // Init tab state
  setTab(activeTab);

  async function loadEraTags() {
    const el = document.getElementById('era-filter');
    try {
      const tags = await api('/eratags');
      el.innerHTML = `<button class="era-pill ${!activeEra ? 'active' : ''}" data-era="" onclick="setEra(null)">All</button>` +
        tags.map(t => `<button class="era-pill ${activeEra == t.id ? 'active' : ''}" data-era="${t.id}" onclick="setEra(${t.id})">${escHtml(t.name)}</button>`).join('');
    } catch (_) {
      el.innerHTML = '';
    }
  }

  async function loadTracks() {
    const container = document.getElementById('tracks-container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      let tracks = [];
      if (activeTab === 'trending') {
        tracks = await api('/discover/trending');
      } else if (activeEra) {
        tracks = await api(`/discover/era/${activeEra}`);
        if (!Array.isArray(tracks)) tracks = [];
      } else {
        const data = await api('/discover');
        tracks = data.recent || [];
      }

      if (!tracks.length) {
        container.innerHTML = `<div class="empty-state">
          <div class="empty-icon">🎵</div>
          <div class="empty-title">No edits yet</div>
          <div class="empty-desc">Be the first to upload something.</div>
        </div>`;
        return;
      }

      container.innerHTML = `<div class="track-grid">${tracks.map(trackCard).join('')}</div>`;
    } catch (err) {
      container.innerHTML = `<div class="empty-state"><div class="empty-title">Failed to load</div><div class="empty-desc">${escHtml(err.message)}</div></div>`;
    }
  }

  function trackCard(t) {
    const cover = t.cover_url
      ? `<img src="${t.cover_url}" alt="cover" onerror="this.style.display='none'">`
      : `<span class="track-cover-placeholder">🎵</span>`;
    const eraName = t.era_tag?.name || t.genre || '';
    return `
      <div class="track-card" onclick="openTrack('${t.id}')">
        <div class="track-cover">
          ${cover}
          <div class="track-play-overlay">
            <button class="play-btn-overlay" onclick="event.stopPropagation();playThis(${JSON.stringify(t).replace(/"/g,'&quot;')})">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--purple)"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
        </div>
        <div class="track-info">
          <div class="track-title">${escHtml(t.title)}</div>
          <div class="track-artist">${escHtml(t.artists?.display_name || 'Unknown')}</div>
          <div class="track-meta">
            <span>${fmtNum(t.play_count)} plays</span>
            ${eraName ? `<span class="badge">${escHtml(eraName)}</span>` : ''}
          </div>
        </div>
      </div>`;
  }

  function playThis(track) {
    playTrack({ ...track, artist_name: track.artists?.display_name });
  }

  function openTrack(id) {
    location.href = `/track.html?id=${id}`;
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadEraTags();
</script>
</body>
</html>
