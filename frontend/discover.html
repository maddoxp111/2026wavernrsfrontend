<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — discover</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="view">
  <div class="scroll-section-title" style="margin-bottom:8px;">Discover</div>
  <div class="scroll-section-sub" style="color:var(--text-2);font-size:13px;margin-bottom:20px;">Find your next favourite edit</div>

  <!-- Era tag filter pills -->
  <div id="era-filter" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;">
    <div class="loading" style="padding:4px;"><div class="spinner" style="width:18px;height:18px;border-width:2px;"></div></div>
  </div>

  <!-- Tabs -->
  <div class="wv-tabs">
    <button class="wv-tab active" id="tab-recent" onclick="setTab('recent')">Recent</button>
    <button class="wv-tab" id="tab-trending" onclick="setTab('trending')">Trending</button>
  </div>

  <div id="tracks-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div><!-- /view -->

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script src="/js/playlists.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var activeTab = params.get('tab') || 'recent';
  var activeEra = params.get('era') || null;

  initPlayer();

  function setTab(tab) {
    if (tab === 'comps') tab = 'recent';
    activeTab = tab;
    document.getElementById('tab-recent').classList.toggle('active', tab === 'recent');
    document.getElementById('tab-trending').classList.toggle('active', tab === 'trending');
    loadTracks();
    const u = new URL(location.href);
    u.searchParams.set('tab', tab);
    history.replaceState(null, '', u);
  }

  function setEra(eraId) {
    activeEra = eraId;
    document.querySelectorAll('.era-pill').forEach(p => {
      p.classList.toggle('is-active', p.dataset.era == eraId);
    });
    loadTracks();
    const u = new URL(location.href);
    if (eraId) u.searchParams.set('era', eraId);
    else u.searchParams.delete('era');
    history.replaceState(null, '', u);
  }

  setTab(activeTab);

  async function loadEraTags() {
    const el = document.getElementById('era-filter');
    try {
      const tags = await api('/eratags');
      el.innerHTML = `<button class="wv-pill ${!activeEra ? 'is-active' : ''}" style="font-size:12px;" data-era="" onclick="setEra(null)">All</button>` +
        tags.map(t => `<button class="wv-pill era-pill ${activeEra == t.id ? 'is-active' : ''}" style="font-size:12px;" data-era="${t.id}" onclick="setEra('${t.id}')">${escHtml(t.name)}</button>`).join('');
    } catch (_) {
      el.innerHTML = '';
    }
  }

  async function loadTracks() {
    const container = document.getElementById('tracks-container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      let items = [];
      if (activeTab === 'trending') {
        items = await api('/discover/trending');
      } else if (activeEra) {
        items = await api(`/discover/era/${activeEra}`);
        if (!Array.isArray(items)) items = [];
      } else {
        const data = await api('/discover');
        items = data.recent || [];
      }

      if (!items.length) {
        container.innerHTML = `<div class="wv-empty">🎵<br><br>Nothing here yet</div>`;
        return;
      }

      container.innerHTML = `<div class="wv-grid-4">${items.map(trackCard).join('')}</div>`;
    } catch (err) {
      container.innerHTML = `<div class="wv-empty">Failed to load: ${escHtml(err.message)}</div>`;
    }
  }

  function trackCard(item) {
    const isAlbum = item._type === 'album';
    const coverHtml = item.cover_url
      ? `<img src="${item.cover_url}" alt="cover" onerror="this.style.display='none'">`
      : `<div class="wv-cover-placeholder">🎵</div>`;
    const eraName = item.era_tag?.name || item.genre || '';
    const clickAction = isAlbum ? `navigate('/album.html?id=${item.id}')` : `openTrack('${item.id}')`;
    return `
      <div class="wv-music-card" onclick="${clickAction}">
        <div class="wv-cover-wrap">
          ${coverHtml}
          ${isAlbum ? `<div class="wv-card-badge">COMP</div>` :
            `<button class="wv-card-play" onclick="event.stopPropagation();playThis(${JSON.stringify(item).replace(/"/g,'&quot;')})">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </button>`}
        </div>
        <div class="wv-card-title">${escHtml(item.title)}</div>
        <div class="wv-card-sub">${escHtml(item.artists?.display_name || 'Unknown')}${eraName ? ` · ${escHtml(eraName)}` : ''}</div>
      </div>`;
  }

  function playThis(track) { playTrack({ ...track, artist_name: track.artists?.display_name }); }
  function openTrack(id) { navigate(`/track.html?id=${id}`); }
  function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  loadEraTags();
</script>
</body>
</html>
