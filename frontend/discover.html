<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — discover</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/discover.html" class="active">Discover</a>
    <a href="/charts.html">Charts</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" id="nav-search" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q.length>=2)navigate('/search.html?q='+encodeURIComponent(q));}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="view">
<div class="container">
  <div class="page-header" style="padding-bottom:20px;">
    <h1 class="page-title">Discover</h1>
  </div>

  <!-- Era tag filter pills -->
  <div id="era-filter" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;">
    <div class="loading" style="padding:4px;"><div class="spinner" style="width:18px;height:18px;border-width:2px;"></div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" style="margin-bottom:24px;">
    <button class="tab" id="tab-recent" onclick="setTab('recent')">Recent</button>
    <button class="tab" id="tab-trending" onclick="setTab('trending')">Trending</button>
  </div>

  <div id="tracks-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>
</div><!-- /view -->

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item active">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg></span>
    <span>Discover</span>
  </a>
  <a href="/charts.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></span>
    <span>Charts</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <span>Search</span>
  </a>

    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
    <span>Dashboard</span>
  </a>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var activeTab = params.get('tab') || 'recent';
  var activeEra = params.get('era') || null;

  updateNav();
  initPlayer();
  renderSiteBanners();

  // Set active tab styles
  function setTab(tab) {
    if (tab === 'comps') tab = 'recent'; // redirect legacy comps tab to recent
    activeTab = tab;
    document.getElementById('tab-recent').classList.toggle('active', tab === 'recent');
    document.getElementById('tab-trending').classList.toggle('active', tab === 'trending');
    loadTracks();
    // Update URL without reload
    const u = new URL(location.href);
    u.searchParams.set('tab', tab);
    history.replaceState(null, '', u);
  }

  function setEra(eraId) {
    activeEra = eraId;
    document.querySelectorAll('.era-pill').forEach(p => {
      p.classList.toggle('active', p.dataset.era == eraId);
    });
    loadTracks();
    // Update URL
    const u = new URL(location.href);
    if (eraId) u.searchParams.set('era', eraId);
    else u.searchParams.delete('era');
    history.replaceState(null, '', u);
  }

  // Init tab state
  setTab(activeTab);

  async function loadEraTags() {
    const el = document.getElementById('era-filter');
    try {
      const tags = await api('/eratags');
      el.innerHTML = `<button class="era-pill ${!activeEra ? 'active' : ''}" data-era="" onclick="setEra(null)">All</button>` +
        tags.map(t => `<button class="era-pill ${activeEra == t.id ? 'active' : ''}" data-era="${t.id}" onclick="setEra('${t.id}')">${escHtml(t.name)}</button>`).join('');
    } catch (_) {
      el.innerHTML = '';
    }
  }

  async function loadTracks() {
    const container = document.getElementById('tracks-container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      let items = [];
      if (activeTab === 'trending') {
        items = await api('/discover/trending');
      } else if (activeEra) {
        items = await api(`/discover/era/${activeEra}`);
        if (!Array.isArray(items)) items = [];
      } else {
        const data = await api('/discover');
        items = data.recent || [];
      }

      if (!items.length) {
        container.innerHTML = `<div class="empty-state">
          <div class="empty-icon">🎵</div>
          <div class="empty-title">Nothing here yet</div>
          <div class="empty-desc">Be the first to upload something.</div>
        </div>`;
        return;
      }

      container.innerHTML = `<div class="track-grid">${items.map(trackCard).join('')}</div>`;
    } catch (err) {
      container.innerHTML = `<div class="empty-state"><div class="empty-title">Failed to load</div><div class="empty-desc">${escHtml(err.message)}</div></div>`;
    }
  }

  function trackCard(item) {
    const isAlbum = item._type === 'album';
    const cover = item.cover_url
      ? `<img src="${item.cover_url}" alt="cover" onerror="this.style.display='none'">`
      : `<span class="track-cover-placeholder">🎵</span>`;
    const eraName = item.era_tag?.name || item.genre || '';
    const clickAction = isAlbum ? `navigate('/album.html?id=${item.id}')` : `openTrack('${item.id}')`;
    return `
      <div class="track-card" onclick="${clickAction}" style="cursor:pointer;">
        <div class="track-cover">
          ${cover}
          ${isAlbum
            ? `<div style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.65);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:0.05em;">COMP</div>`
            : `<div class="track-play-overlay">
                <button class="play-btn-overlay" onclick="event.stopPropagation();playThis(${JSON.stringify(item).replace(/"/g,'&quot;')})">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--purple)"><path d="M8 5v14l11-7z"/></svg>
                </button>
              </div>`}
        </div>
        <div class="track-info">
          <div class="track-title">${escHtml(item.title)}</div>
          <div class="track-artist">${escHtml(item.artists?.display_name || 'Unknown')}</div>
          <div class="track-meta">
            ${item.play_count !== undefined ? `<span>${fmtNum(item.play_count)} plays</span>` : ''}
            ${eraName ? `<span class="badge">${escHtml(eraName)}</span>` : ''}
          </div>
        </div>
      </div>`;
  }

  function playThis(track) {
    playTrack({ ...track, artist_name: track.artists?.display_name });
  }

  function openTrack(id) {
    navigate(`/track.html?id=${id}`);
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadEraTags();
</script>
</body>
</html>
