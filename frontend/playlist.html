<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — playlist</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="view">
<div id="playlist-container">
  <div class="loading"><div class="spinner"></div></div>
</div>
</div><!-- /view -->

<!-- Edit Playlist Modal -->
<div class="modal-overlay" id="edit-playlist-modal">
  <div class="modal" style="max-width:460px;">
    <div class="modal-title">Edit Playlist</div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="ep-title" placeholder="Playlist name">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="ep-desc" rows="2" placeholder="Optional…"></textarea>
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="ep-public"> Public
      </label>
    </div>
    <div id="ep-alert" style="margin-top:10px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('edit-playlist-modal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="savePlaylistEdit()">Save</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script src="/js/playlists.js"></script>
<script>
  initPlayer();

  var playlistId = new URLSearchParams(location.search).get('id');
  if (!playlistId) navigate('/index.html');

  var playlist = null;
  var tracks = [];
  var currentIndex = -1;
  var isOwner = false;

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadPlaylist() {
    try {
      playlist = await api('/playlists/' + playlistId);
      tracks = playlist.tracks || [];
      document.title = playlist.title + ' — wavernrs stream';
      isOwner = isLoggedIn() && playlist.owner && playlist.owner.username &&
        typeof getToken === 'function'; // refined below after we have user
      // Determine ownership by comparing user from /auth/me if logged in
      if (isLoggedIn()) {
        try {
          var me = await api('/auth/me');
          isOwner = me && me.id === playlist.owner.id;
        } catch (_) { isOwner = false; }
      }
      renderPlaylist();
    } catch (err) {
      document.getElementById('playlist-container').innerHTML =
        '<div class="empty-state"><div class="empty-title">Playlist not found</div>' +
        '<a href="/index.html" class="btn btn-primary" style="margin-top:16px">Go home</a></div>';
    }
  }

  function renderPlaylist() {
    var owner = playlist.owner || {};
    var firstCover = tracks.length && tracks[0].cover_url ? tracks[0].cover_url : '';
    if (typeof window.setPageBgImage === 'function') window.setPageBgImage(firstCover);
    var coverHtml = firstCover
      ? '<img src="' + escHtml(firstCover) + '" alt="cover" style="width:100%;height:100%;object-fit:cover;">'
      : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px;">🎵</div>';

    var ownerHtml = owner.username
      ? 'by <a href="#" style="color:var(--text-secondary);font-weight:500;">' + escHtml(owner.username) + '</a>'
      : '';

    var privacyBadge = playlist.is_public ? '' :
      '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--border);' +
      'border-radius:4px;font-size:11px;padding:2px 8px;color:var(--text-secondary);margin-left:8px;">🔒 Private</span>';

    var actionBtns = '';
    if (isOwner) {
      actionBtns = '<button class="wv-pill" onclick="openEditModal()" style="margin-right:8px;">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Edit' +
        '</button>' +
        '<button class="wv-pill" onclick="deletePlaylist()">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Delete' +
        '</button>';
    }

    var trackListHtml;
    if (!tracks.length) {
      trackListHtml = '<div class="empty-state" style="padding:24px;"><div class="empty-desc">No tracks in this playlist yet.</div></div>';
    } else {
      trackListHtml = tracks.map(function(t, i) {
        var cover = t.cover_url
          ? '<img src="' + escHtml(t.cover_url) + '" alt="">'
          : '🎵';
        var removeBtn = isOwner
          ? '<button class="btn btn-danger btn-sm remove-track-btn" onclick="event.stopPropagation();removeTrack(\'' + escHtml(t.id) + '\', ' + i + ')">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
            '</button>'
          : '';
        return '<div class="wv-track-row' + (i === currentIndex ? ' playing' : '') + '" onclick="playAtIndex(' + i + ')">' +
          '<div class="track-row-num">' + (i + 1) + '</div>' +
          '<div class="track-row-cover">' + cover + '</div>' +
          '<div class="track-row-info">' +
            '<div class="track-row-title">' + escHtml(t.title || 'Unknown') + '</div>' +
            '<div class="track-row-artist">' + escHtml(t.artist_name || 'Unknown') + '</div>' +
          '</div>' +
          '<span class="track-row-plays">' + fmtNum(t.play_count) + ' plays</span>' +
          removeBtn +
        '</div>';
      }).join('');
    }

    document.getElementById('playlist-container').innerHTML =
      '<div style="padding:32px 0;">' +
        '<div class="playlist-header">' +
          '<div class="playlist-cover">' + coverHtml + '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);margin-bottom:6px;">Playlist</div>' +
            '<div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px;">' + escHtml(playlist.title) + privacyBadge + '</div>' +
            '<div style="font-size:14px;color:var(--text-secondary);margin-bottom:4px;">' + ownerHtml + '</div>' +
            (playlist.description ? '<p style="margin:8px 0;font-size:14px;color:var(--text-secondary);line-height:1.6;">' + escHtml(playlist.description) + '</p>' : '') +
            '<div style="font-size:13px;color:var(--text-tertiary);margin-bottom:16px;">' + tracks.length + ' track' + (tracks.length !== 1 ? 's' : '') + '</div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
              '<button class="wv-pill" onclick="playAll()">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play All' +
              '</button>' +
              actionBtns +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:32px;">' +
          '<h2 class="section-title">Tracks</h2>' +
          '<div class="track-list" id="pl-tracklist">' + trackListHtml + '</div>' +
        '</div>' +
      '</div>';
  }

  function playAll() {
    if (!tracks.length) return;
    playAtIndex(0);
  }

  function _highlightPlRow(index) {
    document.querySelectorAll('#pl-tracklist .wv-track-row').forEach(function(row, i) {
      row.classList.toggle('playing', i === index);
    });
  }

  function playAtIndex(index) {
    if (!tracks[index]) return;
    currentIndex = index;
    var q = tracks.map(function(t) { return Object.assign({}, t, { artist_name: t.artist_name }); });
    setPlayerQueue(q, index, _highlightPlRow);
    playQueueIndex(index);
    _highlightPlRow(index);
  }

  async function removeTrack(trackId, index) {
    try {
      await api('/playlists/' + playlistId + '/tracks/' + trackId, { method: 'DELETE' });
      tracks.splice(index, 1);
      if (currentIndex >= index) currentIndex--;
      invalidatePlaylistCache();
      renderPlaylist();
    } catch (err) {
      alert('Failed to remove track: ' + (err.message || 'error'));
    }
  }

  // Skip/auto-advance is handled by the player's global queue (set in
  // playAtIndex), so it keeps working from the OS media controls too.

  // ── Edit modal ─────────────────────────────────────────────────────────────
  function openEditModal() {
    document.getElementById('ep-title').value = playlist.title || '';
    document.getElementById('ep-desc').value = playlist.description || '';
    document.getElementById('ep-public').checked = !!playlist.is_public;
    document.getElementById('ep-alert').innerHTML = '';
    document.getElementById('edit-playlist-modal').classList.add('open');
  }

  async function savePlaylistEdit() {
    var title = document.getElementById('ep-title').value.trim();
    if (!title) { document.getElementById('ep-alert').innerHTML = '<span style="color:#f87171;">Title is required</span>'; return; }
    try {
      var updated = await api('/playlists/' + playlistId, {
        method: 'PUT',
        body: JSON.stringify({
          title: title,
          description: document.getElementById('ep-desc').value.trim() || null,
          is_public: document.getElementById('ep-public').checked,
        }),
      });
      playlist.title = updated.title;
      playlist.description = updated.description;
      playlist.is_public = updated.is_public;
      document.title = playlist.title + ' — wavernrs stream';
      invalidatePlaylistCache();
      document.getElementById('edit-playlist-modal').classList.remove('open');
      renderPlaylist();
    } catch (err) {
      document.getElementById('ep-alert').innerHTML = '<span style="color:#f87171;">' + escHtml(err.message || 'Save failed') + '</span>';
    }
  }

  // ── Delete ─────────────────────────────────────────────────────────────────
  async function deletePlaylist() {
    if (!confirm('Delete this playlist? This cannot be undone.')) return;
    try {
      await api('/playlists/' + playlistId, { method: 'DELETE' });
      invalidatePlaylistCache();
      navigate('/dashboard.html');
    } catch (err) {
      alert('Failed to delete playlist: ' + (err.message || 'error'));
    }
  }

  loadPlaylist();
</script>
</body>
</html>
