  <style>
    .plp { --plp-h: 262; --plp-h2: 300; position: relative; }
    .plp-sk { background: var(--surface-2); border-radius: 8px; position: relative; overflow: hidden; }
    .plp-sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--hair-strong), transparent); animation: plp-shine 1.4s ease-in-out infinite; }
    @keyframes plp-shine { to { transform: translateX(100%); } }

    .plp-top { position: relative; isolation: isolate; }
    .plp-glow { position: absolute; z-index: -1; inset: -40px -28px -60px; pointer-events: none; transition: opacity .6s ease;
      background:
        radial-gradient(52% 70% at 14% 40%, hsla(var(--plp-h), 70%, 54%, .36), transparent 72%),
        radial-gradient(40% 56% at 64% 8%, hsla(var(--plp-h2), 70%, 52%, .18), transparent 72%); }
    .theme-light .plp-glow { opacity: .55; }
    .plp-hero { display: flex; gap: 32px; align-items: flex-end; padding: 36px 0 24px; }
    .plp-cover { width: 232px; height: 232px; flex-shrink: 0; border-radius: 10px; overflow: hidden; position: relative; background: var(--surface-2);
      box-shadow: 0 30px 60px -20px hsla(var(--plp-h), 65%, 30%, .75), 0 12px 28px rgba(0,0,0,.34); }
    .theme-light .plp-cover { box-shadow: 0 28px 54px -22px hsla(var(--plp-h), 60%, 40%, .5), 0 8px 22px rgba(0,0,0,.12); }
    .plp-cover .wv-plc { border-radius: 0; }
    .plp-cover-play { position: absolute; right: 12px; bottom: 12px; width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
      background: var(--brand); color: var(--on-brand, #fff); box-shadow: 0 10px 24px rgba(0,0,0,.4); opacity: 0; transform: translateY(8px) scale(.94);
      transition: opacity .2s ease, transform .25s cubic-bezier(.16,1,.3,1); }
    .plp-cover-play svg { width: 22px; height: 22px; }
    .plp-cover:hover .plp-cover-play, .plp-cover-play:focus-visible { opacity: 1; transform: none; }
    .plp-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
    .plp-eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--text-2); }
    .plp-eyebrow .plp-lock { display: inline-flex; align-items: center; gap: 5px; text-transform: none; letter-spacing: 0; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--glass-pill-bg); color: var(--text-2); }
    .plp-title { margin: 0; font-size: clamp(30px, 5vw, 64px); font-weight: 900; letter-spacing: -.045em; line-height: 1.02; color: var(--text); text-wrap: balance; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding-bottom: .04em; }
    .plp-desc { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--text-2); max-width: 680px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .plp-byline { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 13.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .plp-owner { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 700; font-size: 14px; text-decoration: none; min-height: 32px; }
    a.plp-owner:hover span[data-wv-uid] { text-decoration: underline; text-underline-offset: 3px; }
    .plp-avatar { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; flex-shrink: 0; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: rgba(255,255,255,.92); background: var(--surface-2); }
    .plp-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .plp-stats { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 0; }
    .plp-stats > span + span::before { content: "•"; margin: 0 8px; opacity: .7; }
    .plp-stats b { color: var(--text-2); font-weight: 700; }

    .plp-sentinel { height: 1px; margin-bottom: -1px; }
    .plp-bar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 10px; margin: 0 -28px; padding: 12px 28px; transition: background .2s ease, box-shadow .2s ease; }
    .plp-bar.is-stuck { background: var(--page-bg); background: color-mix(in srgb, var(--page-bg) 86%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); box-shadow: 0 1px 0 var(--hair), 0 10px 30px -18px rgba(0,0,0,.5); }
    .plp-play { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 48px; min-width: 112px; padding: 0 24px 0 18px; border-radius: 999px; border: 0; cursor: pointer; flex-shrink: 0;
      background: var(--brand); color: var(--on-brand, #fff); font: inherit; font-size: 15px; font-weight: 800; letter-spacing: -.01em;
      box-shadow: 0 10px 26px -10px color-mix(in srgb, var(--brand) 80%, transparent); transition: transform .18s cubic-bezier(.16,1,.3,1), filter .15s ease; }
    .plp-play:hover { filter: brightness(1.07); transform: scale(1.03); }
    .plp-play:active { transform: scale(.97); }
    .plp-play svg { width: 20px; height: 20px; flex-shrink: 0; }
    .plp-play .ic-pause { display: none; }
    .plp.is-live .plp-play .ic-play { display: none; }
    .plp.is-live .plp-play .ic-pause { display: block; }
    .plp-mini { display: none; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .plp-bar.is-stuck .plp-mini { display: flex; animation: plp-fade .2s ease; }
    @keyframes plp-fade { from { opacity: 0; } to { opacity: 1; } }
    .plp-mini-c { position: relative; width: 34px; height: 34px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: var(--surface-2); }
    .plp-mini-c .wv-plc-empty svg { width: 50%; height: 50%; }
    .plp-mini span { font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
    .plp-bar.is-stuck .plp-hide-stuck { display: none; }
    .plp-ib { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--hair-strong); background: transparent; color: var(--text); display: inline-grid; place-items: center; cursor: pointer; padding: 0;
      transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    .plp-ib:hover { background: var(--glass-pill-bg-hover, var(--surface-hover)); border-color: transparent; }
    .plp-ib:active { transform: scale(.94); }
    .plp-ib svg { width: 19px; height: 19px; }
    .plp-ib.is-danger:hover { color: var(--red); }
    .plp-pill { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--hair-strong); background: transparent; color: var(--text);
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; flex-shrink: 0; white-space: nowrap; transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    .plp-pill:hover { background: var(--glass-pill-bg-hover, var(--surface-hover)); border-color: transparent; }
    .plp-pill:active { transform: scale(.97); }
    .plp-pill svg { width: 17px; height: 17px; flex-shrink: 0; }
    .plp-pill.is-done { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 50%, transparent); background: var(--brand-bg); }
    .plp-pill[disabled] { opacity: .7; cursor: default; }
    .plp-spacer { flex: 1; }
    .plp-bar button:focus-visible, .plp-row:focus-visible, .plp-cover-play:focus-visible, .plp-tool:focus-visible, .plp a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

    .plp-list { margin-top: 8px; }
    .plp-row, .plp-head { display: grid; grid-template-columns: 36px 44px minmax(0, 1.4fr) minmax(0, 1fr) 96px 64px 112px; align-items: center; gap: 14px; padding: 0 12px; }
    .plp-head { height: 36px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--hair); margin-bottom: 8px; }
    .plp-head .r, .plp-row .r { text-align: right; }
    .plp-row { min-height: 58px; border-radius: 8px; cursor: pointer; position: relative; transition: background .12s ease; }
    .plp-row:hover { background: var(--surface-hover); }
    .plp-row.playing { background: var(--brand-bg); }
    .plp-num { position: relative; width: 36px; height: 36px; display: grid; place-items: center; font-size: 14px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .plp-num .ic { display: none; width: 16px; height: 16px; color: var(--text); }
    .plp-row:hover .plp-num .n, .plp-row:focus-visible .plp-num .n { display: none; }
    .plp-row:hover .plp-num .ic, .plp-row:focus-visible .plp-num .ic { display: block; }
    .plp-eq { display: none; align-items: flex-end; gap: 2px; height: 14px; color: var(--brand); }
    .plp-eq i { width: 3px; border-radius: 1px; background: currentColor; transform-origin: bottom; animation: plp-eq 1s ease-in-out infinite; }
    .plp-eq i:nth-child(1) { height: 60%; } .plp-eq i:nth-child(2) { height: 100%; animation-delay: -.35s; } .plp-eq i:nth-child(3) { height: 45%; animation-delay: -.7s; }
    @keyframes plp-eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .plp-row.playing .plp-num .n { display: none; }
    .plp-row.playing .plp-num .plp-eq { display: inline-flex; }
    .plp-row.playing.paused .plp-eq i { animation-play-state: paused; }
    .plp-row.playing:hover .plp-num .plp-eq { display: none; }
    .plp-tc { position: relative; width: 44px; height: 44px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
    .plp-tc img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .plp-row.is-clip .plp-tc img { object-fit: cover; }
    .plp-live { display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; padding: 1px 6px; border-radius: 99px; font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, transparent); vertical-align: 1px; }
    .plp-live::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .plp-tc .plp-eq { position: absolute; inset: 0; justify-content: center; align-items: center; background: rgba(0,0,0,.45); height: auto; padding: 0 12px; color: #fff; }
    .plp-tc .plp-eq i { max-height: 16px; }
    .plp-ti { min-width: 0; }
    .plp-tt { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plp-row.playing .plp-tt { color: var(--brand); }
    .plp-ta, .plp-alb, .plp-added, .plp-plays { font-size: 13.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plp-added, .plp-plays { color: var(--text-3); font-variant-numeric: tabular-nums; }
    .plp-ta a, .plp-alb a { color: inherit; text-decoration: none; }
    .plp-ta a:hover, .plp-alb a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .plp-tools { display: flex; justify-content: flex-end; gap: 2px; }
    .plp-tool { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; cursor: pointer; padding: 0; opacity: 0; transition: opacity .12s ease, background .12s ease, color .12s ease; }
    .plp-tool svg { width: 17px; height: 17px; }
    .plp-row:hover .plp-tool, .plp-row:focus-within .plp-tool { opacity: 1; }
    .plp-tool:hover:not(:disabled) { background: var(--glass-pill-bg-hover, var(--surface-hover)); color: var(--text); }
    .plp-tool:disabled { opacity: 0 !important; cursor: default; }
    .plp-tool.is-danger:hover { color: var(--red); }

    .plp-empty { margin: 18px 0 8px; padding: 34px 20px; border: 1px dashed var(--hair-strong); border-radius: 14px; text-align: center; color: var(--text-2); }
    .plp-empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
    .plp-empty .plp-pill { margin-top: 16px; }
    .plp-addmore { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); color: var(--text-2); font-size: 14px; }
    .plp-addmore b { color: var(--text); }
    .plp-addmore .plp-pill { margin-left: auto; }

    .plp-more { margin-top: 44px; }
    .plp-more-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .plp-more-head h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
    .plp-more-head a { font-size: 13px; font-weight: 700; color: var(--text-2); text-decoration: none; }
    .plp-more-head a:hover { color: var(--text); text-decoration: underline; }
    .plp-more .wv-rail { grid-auto-columns: 176px; gap: 4px; }
    .plp-more .wv-comp-card { padding: 10px; }

    @media (max-width: 1100px) {
      .plp-row, .plp-head { grid-template-columns: 36px 44px minmax(0, 1fr) 96px 64px 112px; }
      .plp-alb, .plp-head .h-alb { display: none; }
    }
    @media (max-width: 768px) {
      .plp-glow { inset: -40px -16px -20px; }
      .plp-hero { flex-direction: column; align-items: flex-start; gap: 18px; padding: 16px 0 8px; }
      .plp-cover { width: min(64vw, 240px); height: min(64vw, 240px); align-self: center; }
      .plp-cover-play { display: none; }
      .plp-title { font-size: clamp(26px, 8vw, 36px); }
      .plp-bar { margin: 0 -16px; padding: 10px 16px; gap: 8px; }
      .plp-desk { display: none !important; }
      .plp-play { min-width: 92px; height: 46px; padding: 0 18px 0 14px; }
      .plp-ib { width: 40px; height: 40px; }
      .plp-pill { height: 40px; padding: 0 14px; }
      .plp-bar .plp-pill.is-owner-edit { width: 40px; padding: 0; justify-content: center; }
      .plp-bar .plp-pill.is-owner-edit span { display: none; }
      .plp-bar.is-stuck .plp-play { min-width: 48px; width: 48px; padding: 0; }
      .plp-bar.is-stuck .plp-play span { display: none; }
      .plp-pill .lbl-long { display: none; }
      .plp-head { display: none; }
      .plp-row { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; padding: 4px 4px; min-height: 60px; }
      .plp-num, .plp-alb, .plp-added, .plp-plays { display: none; }
      .plp-tc { width: 48px; height: 48px; }
      .plp-row.playing .plp-tc .plp-eq { display: inline-flex; }
      .plp-tool { opacity: 1; width: 40px; height: 40px; }
      .plp-tool.plp-move { display: none; }
      .plp-addmore { flex-wrap: wrap; }
      .plp-addmore .plp-pill { margin-left: 0; }
      .plp-more .wv-rail { grid-auto-columns: 148px; }
    }
    @media (min-width: 769px) { .plp-tc .plp-eq { display: none !important; } }
    @media (prefers-reduced-motion: reduce) {
      .plp-sk::after, .plp-eq i, .plp-bar.is-stuck .plp-mini { animation: none !important; }
      .plp-play, .plp-cover-play, .plp-bar, .plp-glow, .plp-pill, .plp-ib, .plp-tool { transition: none !important; }
    }
  </style>
</head>

  function plDate(s) {
    var d = new Date(s);
    if (isNaN(d)) return '';
    var o = { month: 'short', day: 'numeric' };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    return d.toLocaleDateString('en-US', o);
  }
  function plAgo(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d)) return '';
    var days = Math.floor((Date.now() - d) / 86400000);
    if (days < 30 && typeof timeAgo === 'function') return timeAgo(s);
    return plDate(s);
  }
  function plStillHere() { return window._plSeq === plSeq && !!document.getElementById('playlist-container'); }

  async function loadPlaylist() {
    try {
      var meP = isLoggedIn() ? api('/auth/me').catch(function () { return null; }) : Promise.resolve(null);
      playlist = await api('/playlists/' + plPid);
      if (!plStillHere()) return;
      tracks = Array.isArray(playlist.items) ? playlist.items.filter(function (x) { return x && (x.type === 'clip' ? x.clip_id : x.id); }) : (playlist.tracks || []);
      document.title = playlist.title + ' — wavernrs stream';
      var me = await meP;
      var owner = playlist.owner || {};
      isOwner = !!(me && owner.id && me.id === owner.id);
      renderPlaylist();
      loadOwnerExtras();
    } catch (err) {
      if (!plStillHere()) return;
      var priv = (err && err.status === 403) || /private/i.test(String(err && err.message || ''));
      document.getElementById('playlist-container').innerHTML =
        '<div class="empty-state"><div class="empty-title">' +
        (priv ? 'this playlist is private' : 'couldnt find this playlist') + '</div>' +
        '<div class="empty-desc">' + (priv
          ? (isLoggedIn() ? 'only the person who made it can open it' : 'if its yours, log in to open it')
          : 'it might have been deleted') + '</div>' +
        (priv && !isLoggedIn()
          ? '<a href="/login?next=' + encodeURIComponent(location.pathname + location.search) + '" class="btn btn-primary" style="margin-top:16px">Log in</a>'
          : '<a href="/playlists" class="btn btn-primary" style="margin-top:16px" onclick="navigate(\'/playlists\');return false;">Browse playlists</a>') +
        '</div>';
    }
  }

  function loadOwnerExtras() {
    var owner = (playlist && playlist.owner) || {};
    if (!owner.id) return;
    api('/artists/by-user/' + encodeURIComponent(owner.id)).then(function (a) {
      if (!plStillHere() || !a || !a.id) return;
      plOwnerArtist = a;
      paintOwner();
    }).catch(function () {});
    api('/playlists/by-user/' + encodeURIComponent(owner.id)).then(function (d) {
      return (d && d.items) || [];
    }).catch(function () {
      return api('/playlists/published?sort=new&limit=48').then(function (d) {
        return ((d && d.items) || []).filter(function (p) { return p.owner && p.owner.id === owner.id; });
      }).catch(function () { return []; });
    }).then(function (items) {
      if (!plStillHere()) return;
      plMore = (items || []).filter(function (p) { return p && p.id && p.id !== playlistId; });
      paintMore();
    });
  }

  function ownerHtml() {
    var owner = (playlist && playlist.owner) || {};
    if (!owner.username) return '';
    var a = plOwnerArtist;
    var name = owner.username;
    var av = a && a.profile_image_url
      ? '<img src="' + escHtml(a.profile_image_url) + '" alt="" width="26" height="26" loading="lazy" onerror="this.remove()">'
      : escHtml(name.charAt(0).toUpperCase());
    var avStyle = a && a.profile_image_url ? '' : ' style="background:' + coverGradient(name) + '"';
    var inner = '<span class="plp-avatar"' + avStyle + '>' + av + '</span><span data-wv-uid="' + escHtml(owner.id || '') + '">' + escHtml(name) + '</span>';
    if (a && a.id) {
      var href = '/artist?id=' + encodeURIComponent(a.id);
      return '<a class="plp-owner" href="' + href + '" onclick="navigate(\'' + href + '\');return false;">' + inner + '</a>';
    }
    return '<span class="plp-owner">' + inner + '</span>';
  }

  function paintOwner() {
    var el = document.getElementById('plp-owner-slot');
    if (el) el.innerHTML = ownerHtml();
  }

  function statsHtml() {
    var nc = tracks.filter(function (t) { return t.type === 'clip'; }).length;
    var n = tracks.length - nc;
    var parts = ['<span><b>' + n + '</b> song' + (n === 1 ? '' : 's') + '</span>'];
    if (nc) parts.push('<span><b>' + nc + '</b> live clip' + (nc === 1 ? '' : 's') + '</span>');
    if (playlist.play_count) parts.push('<span><b>' + plNum(playlist.play_count) + '</b> play' + (playlist.play_count === 1 ? '' : 's') + '</span>');
    if (playlist.published_at) parts.push('<span>published ' + escHtml(plDate(playlist.published_at)) + '</span>');
    else if (playlist.created_at) parts.push('<span>made ' + escHtml(plDate(playlist.created_at)) + '</span>');
    var upd = playlist.updated_at;
    if (upd && (!playlist.published_at || new Date(upd) - new Date(playlist.published_at) > 3600000)) parts.push('<span>updated ' + escHtml(plAgo(upd)) + '</span>');
    return '<span class="plp-stats">' + parts.join('') + '</span>';
  }

  function coverHtml() {
    return typeof window.wvPlaylistCover === 'function'
      ? window.wvPlaylistCover({ title: playlist.title, cover_url: playlist.cover_url, mosaic: playlist.mosaic })
      : '';
  }

  function plClipLen(t) { return t.end != null && t.end > t.start ? Math.round(t.end - t.start) : null; }
  function plClipTools(t, i) {
    if (isOwner) {
      return '<button class="plp-tool plp-move" title="Move up" aria-label="Move ' + escHtml(t.song || 'clip') + ' up"' + (i === 0 ? ' disabled' : '') + ' onclick="event.stopPropagation();movePlTrack(' + i + ',-1)">' + PL_IC.up + '</button>' +
        '<button class="plp-tool plp-move" title="Move down" aria-label="Move ' + escHtml(t.song || 'clip') + ' down"' + (i === tracks.length - 1 ? ' disabled' : '') + ' onclick="event.stopPropagation();movePlTrack(' + i + ',1)">' + PL_IC.down + '</button>' +
        '<button class="plp-tool is-danger" title="Remove" aria-label="Remove ' + escHtml(t.song || 'clip') + '" onclick="event.stopPropagation();removeTrack(' + i + ')">' + PL_IC.x + '</button>';
    }
    return '<button class="plp-tool" title="Save to a playlist" aria-label="Save ' + escHtml(t.song || 'clip') + ' to a playlist" onclick="event.stopPropagation();plSaveOne(' + i + ')">' + PL_IC.addto + '</button>';
  }
  function clipRowHtml(t, i) {
    var cover = t.cover ? '<img src="' + escHtml(t.cover) + '" alt="" loading="lazy" width="44" height="44" onerror="this.style.visibility=\'hidden\'">' : '';
    var eq = '<span class="plp-eq" aria-hidden="true"><i></i><i></i><i></i></span>';
    var len = plClipLen(t);
    var sh = '/resources?view=tours&year=' + encodeURIComponent(t.year || '') + '&show=' + encodeURIComponent(t.show_id || '');
    var showLink = '<a href="' + escHtml(sh) + '" onclick="event.stopPropagation();navigate(this.getAttribute(\'href\'));return false;">' + escHtml(t.show_name || 'live show') + '</a>';
    return '<div class="plp-row is-clip' + (i === currentIndex ? ' playing' : '') + '" role="button" tabindex="0" data-i="' + i + '" aria-label="Play ' + escHtml(t.song || 'clip') + ' live at ' + escHtml(t.show_name || 'a show') + '">' +
      '<div class="plp-num"><span class="n">' + (i + 1) + '</span>' + eq + '<span class="ic">' + PL_IC.play + '</span></div>' +
      '<div class="plp-tc" style="background:' + (typeof coverGradient === 'function' ? coverGradient(t.show_name || '') : 'var(--surface-2)') + '">' + cover + eq + '</div>' +
      '<div class="plp-ti"><div class="plp-tt"><span class="plp-live">live</span>' + escHtml(t.song || 'Untitled') + '</div><div class="plp-ta">Ye · live at ' + showLink + (t.by ? ' · ' + escHtml(t.by) : '') + '</div></div>' +
      '<div class="plp-alb">' + showLink + (t.year ? ' · ' + escHtml(t.year) : '') + '</div>' +
      '<div class="plp-added r" title="' + escHtml(t.added_at ? new Date(t.added_at).toLocaleString() : '') + '">' + escHtml(plAgo(t.added_at)) + '</div>' +
      '<div class="plp-plays r">' + (len ? escHtml(plDur(len)) : '') + '</div>' +
      '<div class="plp-tools">' + plClipTools(t, i) + '</div>' +
    '</div>';
  }
  function plDur(s) { s = Math.max(0, Math.round(s)); var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }

  function rowHtml(t, i) {
    if (t && t.type === 'clip') return clipRowHtml(t, i);
    var cover = t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" alt="" loading="lazy" width="44" height="44" onerror="this.style.visibility=\'hidden\'">' : '';
    var eq = '<span class="plp-eq" aria-hidden="true"><i></i><i></i><i></i></span>';
    var artist = escHtml(t.artist_name || 'Unknown');
    if (!t.is_archive && t.artists && t.artists.id && t.artists.display_name === t.artist_name) {
      var ah = '/artist?id=' + encodeURIComponent(t.artists.id);
      artist = '<a href="' + ah + '" onclick="event.stopPropagation();navigate(\'' + ah + '\');return false;">' + artist + '</a>';
    }
    var album = '';
    if (t.album_id && t.album_title) {
      var alh = '/album?id=' + encodeURIComponent(t.album_id);
      album = '<a href="' + alh + '" onclick="event.stopPropagation();navigate(\'' + alh + '\');return false;">' + escHtml(t.album_title) + '</a>';
    } else if (t.id) {
      var th = '/track?id=' + encodeURIComponent(t.id);
      album = '<a href="' + th + '" onclick="event.stopPropagation();navigate(\'' + th + '\');return false;">Single</a>';
    }
    var tools;
    if (isOwner) {
      tools = '<button class="plp-tool plp-move" title="Move up" aria-label="Move ' + escHtml(t.title || 'track') + ' up"' + (i === 0 ? ' disabled' : '') + ' onclick="event.stopPropagation();movePlTrack(' + i + ',-1)">' + PL_IC.up + '</button>' +
        '<button class="plp-tool plp-move" title="Move down" aria-label="Move ' + escHtml(t.title || 'track') + ' down"' + (i === tracks.length - 1 ? ' disabled' : '') + ' onclick="event.stopPropagation();movePlTrack(' + i + ',1)">' + PL_IC.down + '</button>' +
        '<button class="plp-tool is-danger" title="Remove" aria-label="Remove ' + escHtml(t.title || 'track') + '" onclick="event.stopPropagation();removeTrack(' + i + ')">' + PL_IC.x + '</button>';
    } else {
      tools = '<button class="plp-tool" title="Add to queue" aria-label="Add ' + escHtml(t.title || 'track') + ' to queue" onclick="event.stopPropagation();plQueueOne(' + i + ')">' + PL_IC.queue + '</button>' +
        '<button class="plp-tool" title="Save to a playlist" aria-label="Save ' + escHtml(t.title || 'track') + ' to a playlist" onclick="event.stopPropagation();plSaveOne(' + i + ')">' + PL_IC.addto + '</button>';
    }
    return '<div class="plp-row' + (i === currentIndex ? ' playing' : '') + '" role="button" tabindex="0" data-i="' + i + '" aria-label="Play ' + escHtml(t.title || 'track') + ' by ' + escHtml(t.artist_name || 'Unknown') + '">' +
      '<div class="plp-num"><span class="n">' + (i + 1) + '</span>' + eq + '<span class="ic">' + PL_IC.play + '</span></div>' +
      '<div class="plp-tc">' + cover + eq + '</div>' +
      '<div class="plp-ti"><div class="plp-tt">' + escHtml(t.title || 'Unknown') + '</div><div class="plp-ta">' + artist + '</div></div>' +
      '<div class="plp-alb">' + album + '</div>' +
      '<div class="plp-added r" title="' + escHtml(t.added_at ? new Date(t.added_at).toLocaleString() : '') + '">' + escHtml(plAgo(t.added_at)) + '</div>' +
      '<div class="plp-plays r">' + plNum(t.play_count) + '</div>' +
      '<div class="plp-tools">' + tools + '</div>' +
    '</div>';
  }

  function listHtml() {
    if (!tracks.length) {
      return '<div class="plp-empty"><b>nothing in here yet</b>' +
        (isOwner ? 'search songs and comps in the builder and drop them in'
                 : 'the owner hasnt added any songs yet') +
        (isOwner ? '<br><button class="plp-pill" onclick="plOpenBuilder()">' + PL_IC.copy + 'Add songs</button>' : '') +
        '</div>';
    }
    return '<div class="plp-head" aria-hidden="true"><span style="text-align:center">#</span><span></span><span>Title</span><span class="h-alb">Album</span><span class="r">Added</span><span class="r">Plays</span><span></span></div>' +
      tracks.map(rowHtml).join('') +
      (isOwner ? '<div class="plp-addmore"><span><b>want more in here?</b> search songs and whole comps in the builder</span><button class="plp-pill" onclick="plOpenBuilder()">' + PL_IC.copy + 'Add songs</button></div>' : '');
  }

  function renderPlaylist() {
    var firstCover = playlist.cover_url || (playlist.mosaic && playlist.mosaic[0]) || (tracks.length && (tracks[0].cover_url || tracks[0].cover) ? (tracks[0].cover_url || tracks[0].cover) : '');
    if (typeof window.setPageBgImage === 'function') window.setPageBgImage(firstCover);

    var eyebrow = playlist.published_at ? 'Community playlist' : 'Playlist';
    var badge = playlist.is_public ? '' : '<span class="plp-lock">' + PL_IC.lock + ' Private</span>';
    if (playlist.is_public && !playlist.published_at && isOwner) badge = '<span class="plp-lock">Link only</span>';

    var bar = '<button class="plp-play" onclick="plPlayToggle()" aria-label="Play ' + escHtml(playlist.title) + '"><span class="ic-play" style="display:contents">' + PL_IC.play + '</span><span class="ic-pause" style="display:none">' + PL_IC.pause + '</span><span>Play</span></button>' +
      '<div class="plp-mini" aria-hidden="true"><div class="plp-mini-c">' + coverHtml() + '</div><span>' + escHtml(playlist.title) + '</span></div>' +
      '<button class="plp-ib plp-hide-stuck" onclick="shufflePlaylist()" title="Shuffle" aria-label="Shuffle play">' + PL_IC.shuffle + '</button>';
    if (!isOwner) {
      bar += '<button class="plp-pill plp-hide-stuck" id="plp-savecopy" onclick="plSaveCopy()" title="Save a copy to your playlists">' + PL_IC.copy + '<span>Save<span class="lbl-long"> a copy</span></span></button>';
    } else {
      bar += '<button class="plp-pill plp-hide-stuck is-owner-edit" onclick="plOpenBuilder()" aria-label="Edit in builder">' + PL_IC.edit + '<span>Edit<span class="lbl-long"> in builder</span></span></button>';
    }
    bar += '<button class="plp-ib plp-hide-stuck" onclick="plQueueAll()" title="Add all to queue" aria-label="Add all to queue">' + PL_IC.queue + '</button>' +
      '<button class="plp-ib plp-hide-stuck" onclick="sharePlaylist()" title="Share" aria-label="Share">' + PL_IC.share + '</button>' +
      (tracks.length ? '<button class="plp-ib plp-hide-stuck plp-desk" onclick="exportPlaylist()" title="Download the tracklist as a text file" aria-label="Download tracklist">' + PL_IC.download + '</button>' : '') +
      (isOwner ? '<button class="plp-ib is-danger plp-hide-stuck" onclick="deletePlaylist()" title="Delete playlist" aria-label="Delete playlist">' + PL_IC.trash + '</button>' : '');

    document.getElementById('playlist-container').innerHTML =
      '<div class="plp" id="plp-root">' +
        '<div class="plp-top">' +
          '<div class="plp-glow" aria-hidden="true"></div>' +
          '<div class="plp-hero">' +
            '<div class="plp-cover">' + coverHtml() +
              (tracks.length ? '<button class="plp-cover-play" onclick="playAll()" aria-label="Play">' + PL_IC.play + '</button>' : '') +
            '</div>' +
            '<div class="plp-info">' +
              '<div class="plp-eyebrow"><span>' + eyebrow + '</span>' + badge + '</div>' +
              '<h1 class="plp-title">' + escHtml(playlist.title) + '</h1>' +
              (playlist.description ? '<p class="plp-desc">' + escHtml(playlist.description) + '</p>' : '') +
              '<div class="plp-byline"><span id="plp-owner-slot">' + ownerHtml() + '</span>' + statsHtml() + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="plp-sentinel" id="plp-sentinel"></div>' +
        '<div class="plp-bar" id="plp-bar">' + bar + '</div>' +
        '<div class="plp-list" id="pl-tracklist">' + listHtml() + '</div>' +
        '<div id="plp-more-slot"></div>' +
      '</div>';

    extractCoverHues(firstCover, playlist.title || '', function (c) {
      var root = document.getElementById('plp-root');
      if (!root || !c) return;
      root.style.setProperty('--plp-h', c.h1);
      root.style.setProperty('--plp-h2', c.h2);
    });
    paintMore();
    plBindPage();
    plSync();
  }

  function renderList() {
    var el = document.getElementById('pl-tracklist');
    if (el) el.innerHTML = listHtml();
    plSync();
  }

  function paintMore() {
    var slot = document.getElementById('plp-more-slot');
    if (!slot) return;
    var owner = (playlist && playlist.owner) || {};
    if (!plMore || !plMore.length || !owner.username) { slot.innerHTML = ''; return; }
    slot.innerHTML = '<section class="plp-more" aria-label="More playlists by ' + escHtml(owner.username) + '">' +
      '<div class="plp-more-head"><h2>More by ' + escHtml(owner.username) + '</h2></div>' +
      '<div class="wv-rail">' + plMore.map(function (p) { return window.wvPlaylistCardHTML(p); }).join('') + '</div>' +
    '</section>';
  }

  function plBindPage() {
    var list = document.getElementById('pl-tracklist');
    if (list && !list._plBound) {
      list._plBound = true;
      list.addEventListener('click', function (e) {
        if (e.target.closest('a, button')) return;
        var row = e.target.closest('.plp-row');
        if (row) playAtIndex(+row.getAttribute('data-i'));
      });
      list.addEventListener('keydown', function (e) {
        var row = e.target.closest('.plp-row');
        if (!row || e.target !== row) return;
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playAtIndex(+row.getAttribute('data-i')); }
        else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          var sib = e.key === 'ArrowDown' ? row.nextElementSibling : row.previousElementSibling;
          if (sib && sib.classList.contains('plp-row')) { e.preventDefault(); sib.focus(); }
        }
      });
    }
    var sentinel = document.getElementById('plp-sentinel');
    var bar = document.getElementById('plp-bar');
    if (window._plIO) { try { window._plIO.disconnect(); } catch (_) {} window._plIO = null; }
    if (sentinel && bar && typeof IntersectionObserver === 'function') {
      var root = document.getElementById('wv-content');
      var io = new IntersectionObserver(function (entries) {
        var e = entries[0];
        if (!e) return;
        var top = e.rootBounds ? e.rootBounds.top : 0;
        bar.classList.toggle('is-stuck', !e.isIntersecting && e.boundingClientRect.top < top + 1);
      }, { root: root && root.contains(sentinel) ? root : null, threshold: 0 });
      io.observe(sentinel);
      window._plIO = io;
    }
    if (!window._plTicker) {
      window._plTicker = setInterval(plSync, 800);
      window._pageCleanup.push(function () {
        clearInterval(window._plTicker); window._plTicker = null;
        if (window._plIO) { try { window._plIO.disconnect(); } catch (_) {} window._plIO = null; }
      });
    }
  }

  function plCurIndex() {
    if (window.wvShow && wvShow.active()) {
      var ss = wvShow.state();
      if (ss.ctx && ss.ctx.clip_id) for (var k = 0; k < tracks.length; k++) if (tracks[k].type === 'clip' && tracks[k].clip_id === ss.ctx.clip_id) return k;
      return -1;
    }
    var cur = typeof currentTrack !== 'undefined' ? currentTrack : null;
    if (!cur || !cur.id) return -1;
    if (currentIndex >= 0 && tracks[currentIndex] && tracks[currentIndex].id === cur.id) return currentIndex;
    for (var i = 0; i < tracks.length; i++) if (tracks[i].id === cur.id) return i;
    return -1;
  }

  function plSync() {
    if (!playlist || !document.getElementById('plp-root')) return;
    var idx = plCurIndex();
    var paused = window.wvShow && wvShow.active() ? !wvShow.state().playing : (typeof audio === 'undefined' || !audio || audio.paused);
    var rows = document.querySelectorAll('#pl-tracklist .plp-row');
    for (var i = 0; i < rows.length; i++) {
      var on = i === idx;
      rows[i].classList.toggle('playing', on);
      rows[i].classList.toggle('paused', on && paused);
    }
    var root = document.getElementById('plp-root');
    var live = idx >= 0 && !paused;
    if (root.classList.contains('is-live') !== live) {
      root.classList.toggle('is-live', live);
      var btn = root.querySelector('.plp-play');
      if (btn) {
        btn.querySelector('.ic-play').style.display = live ? 'none' : 'contents';
        btn.querySelector('.ic-pause').style.display = live ? 'contents' : 'none';
        btn.lastElementChild.textContent = live ? 'Pause' : 'Play';
      }
    }
  }

  function plQueueItem(t) {
    if (t.type === 'clip') {
      return {
        id: 'clip:' + t.clip_id, title: t.song || 'Live clip', ia_url: null, cover_url: t.cover || null,
        artist_name: 'Ye · live at ' + (t.show_name || 'a show'),
        _clip: {
          show: { id: t.show_id, year: t.year, name: t.show_name }, youtube: t.youtube || null, video: t.youtube ? null : t.video,
          offset: 0, cover: t.cover || null, setlist: [], start: t.start, end: t.end, title: t.song,
          ctx: { pl: playlistId, clip_id: t.clip_id }
        }
      };
    }
    return {
      id: t.id, title: t.title, ia_url: t.ia_url, cover_url: t.cover_url || null,
      artist_name: t.artist_name || '', album_id: t.album_id || null,
      artist_id: (t.artists && t.artists.id) || null,
      _archive_artist: t.is_archive ? (t.artist_name || null) : null
    };
  }
  function plCanClip() { return !!(window.wvShow && typeof window.playQueueIndex === 'function'); }
  function plPlayable() { return tracks.filter(function (t) { return t && (t.type === 'clip' ? plCanClip() && (t.youtube || t.video) : t.ia_url); }); }

  function plLoaded() { return !!((window.wvShow && wvShow.active()) || (typeof audio !== 'undefined' && audio && audio.src)); }
  function plPlayToggle() {
    if (plCurIndex() >= 0 && plLoaded() && typeof togglePlay === 'function') { togglePlay(); setTimeout(plSync, 60); return; }
    playAll();
  }

  function playAll() {
    if (!tracks.length) { plToast('nothing in this playlist yet'); return; }
    playAtIndex(0);
  }

  function shufflePlaylist() {
    var q = plPlayable().map(plQueueItem);
    if (!q.length) { plToast('nothing in this playlist can play yet'); return; }
    for (var i = q.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = q[i]; q[i] = q[j]; q[j] = tmp; }
    countPlaylistPlay();
    currentIndex = -1;
    setPlayerQueue(q, 0);
    playQueueIndex(0);
    plToast('shuffling ' + q.length + ' song' + (q.length === 1 ? '' : 's'));
    setTimeout(plSync, 120);
  }

  function plQueueAll() {
    var add = plPlayable().map(plQueueItem);
    if (!add.length) { plToast('nothing in this playlist can play yet'); return; }
    var cur = typeof currentTrack !== 'undefined' ? currentTrack : null;
    if (!cur && typeof window.getPlayerQueue === 'function' && !window.getPlayerQueue().list.length) { playAll(); return; }
    var q = typeof window.getPlayerQueue === 'function' ? window.getPlayerQueue() : { list: [], idx: -1 };
    var list = q.list.slice();
    var idx = q.idx;
    if (!list.length && cur) { list = [cur]; idx = 0; }
    var at = list.length;
    for (var k = Math.max(0, idx + 1); k < list.length; k++) if (list[k] && list[k]._autoplay) { at = k; break; }
    list.splice.apply(list, [at, 0].concat(add));
    setPlayerQueue(list, idx, _highlightPlRow);
    plToast('added ' + add.length + ' song' + (add.length === 1 ? '' : 's') + ' to your queue', 'success');
  }

  function plQueueOne(i) {
    var t = tracks[i];
    if (t && t.type === 'clip') return;
    if (t && typeof window.addToQueue === 'function') window.addToQueue(plQueueItem(t));
  }

  function plSaveOne(i) {
    var t = tracks[i];
    if (!t) return;
    if (!isLoggedIn()) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
    if (t.type === 'clip') {
      if (typeof window.openAddToPlaylist === 'function') window.openAddToPlaylist({ title: t.song, cover_url: t.cover, clip: { show_id: t.show_id, year: t.year, show_name: t.show_name, song: t.song, by: t.by || null, start: t.start, end: t.end, youtube: t.youtube || null, video: t.video || null, cover: t.cover || null } });
      return;
    }
    if (typeof window.openAddToPlaylist === 'function') window.openAddToPlaylist({ id: t.id, title: t.title, cover_url: t.cover_url });
  }

  function plOpenBuilder() { navigate('/playlist-builder?id=' + encodeURIComponent(playlistId)); }

  var _plSaving = false;
  async function plSaveCopy() {
    if (!isLoggedIn()) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
    if (_plSaving || !playlist) return;
    var ids = tracks.filter(function (t) { return t.type !== 'clip'; }).map(function (t) { return t.id; }).filter(Boolean);
    if (!ids.length) { plToast('theres nothing to copy yet'); return; }
    var btn = document.getElementById('plp-savecopy');
    _plSaving = true;
    if (btn) { btn.disabled = true; btn.lastElementChild.textContent = 'Saving…'; }
    try {
      var who = playlist.owner && playlist.owner.username ? ' by @' + playlist.owner.username : '';
      var created = await api('/playlists', {
        method: 'POST',
        body: JSON.stringify({
          title: String(playlist.title || 'Playlist').slice(0, 120),
          description: ('saved from "' + (playlist.title || 'a playlist') + '"' + who + (playlist.description ? ' — ' + playlist.description : '')).slice(0, 1000),
          is_public: false
        })
      });
      await api('/playlists/' + encodeURIComponent(created.id) + '/tracks', { method: 'POST', body: JSON.stringify({ track_ids: ids }) });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
      if (btn) { btn.classList.add('is-done'); btn.innerHTML = PL_IC.check + '<span>Saved</span>'; }
      var href = '/playlist-builder?id=' + encodeURIComponent(created.id);
      plToast('saved to your playlists', 'success', 5200, {
        title: 'saved to your playlists', body: 'its private until you publish it', action: 'Open',
        onClick: function () { navigate(href); }
      });
    } catch (e) {
      if (btn) { btn.disabled = false; btn.innerHTML = PL_IC.copy + '<span>Save<span class="lbl-long"> a copy</span></span>'; }
      plToast((e && e.message) || 'couldnt save a copy...try again', 'error');
    } finally {
      _plSaving = false;
    }
  }

  function sharePlaylist() {
    var url = location.origin + '/playlist?id=' + plPid;
    if (!playlist.is_public && isOwner) plToast('this playlist is private...make it public if you want other people to open it');
    if (typeof window.wvShare === 'function') {
      try {
        window.wvShare({ kind: 'playlist', id: playlistId, url: url, title: playlist.title || 'Playlist',
          artist: playlist.owner && playlist.owner.username ? '@' + playlist.owner.username : '',
          cover: playlist.cover_url || (playlist.mosaic && playlist.mosaic[0]) || '' });
        return;
      } catch (_) {}
    }
    if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
      navigator.share({ title: playlist.title || 'Playlist', url: url }).catch(function () {});
      return;
    }
    if (!navigator.clipboard) { plToast(url); return; }
    navigator.clipboard.writeText(url).then(function () { plToast('link copied'); })
      .catch(function () { plToast('couldnt copy the link', 'error'); });
  }

  function exportPlaylist() {
    var lines = [playlist.title || 'Playlist', ''];
    tracks.forEach(function (t, i) { lines.push((i + 1) + '. ' + (t.type === 'clip' ? (t.song || 'Unknown') + ' (live) — Ye at ' + (t.show_name || 'a show') : (t.title || 'Unknown') + ' — ' + (t.artist_name || 'Unknown'))); });
    lines.push('', location.origin + '/playlist?id=' + plPid);
    var blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (playlist.title || 'playlist').replace(/[^\w -]+/g, '').trim().slice(0, 60) + '.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    plToast('tracklist downloaded');
  }

  async function movePlTrack(i, dir) {
    var j = i + dir;
    if (j < 0 || j >= tracks.length) return;
    var before = tracks.slice();
    var moved = tracks.splice(i, 1)[0];
    tracks.splice(j, 0, moved);
    if (currentIndex === i) currentIndex = j;
    else if (currentIndex === j) currentIndex = i;
    renderList();
    var btns = document.querySelectorAll('#pl-tracklist .plp-row[data-i="' + j + '"] .plp-move');
    var b = btns[dir < 0 ? 0 : 1];
    if (b && !b.disabled) b.focus();
    try {
      await api('/playlists/' + plPid + '/order', {
        method: 'PUT',
        body: JSON.stringify(tracks.some(function (t) { return t.type === 'clip'; })
          ? { items: tracks.map(function (t) { return t.type === 'clip' ? { type: 'clip', id: t.clip_id } : { type: 'track', id: t.id }; }) }
          : { track_ids: tracks.map(function (t) { return t.id; }) }),
      });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
    } catch (e) {
      tracks = before;
      renderList();
      plToast('couldnt save the new order...try again', 'error');
    }
  }

  var _countedPlay = false;
  function countPlaylistPlay() {
    if (_countedPlay || !playlist || !playlist.is_public) return;
    _countedPlay = true;
    api('/playlists/' + plPid + '/play', { method: 'POST' }).catch(function () {});
  }

  function _highlightPlRow(index) {
    var t = window.getPlayerQueue ? window.getPlayerQueue().list[index] : null;
    currentIndex = -1;
    if (t) for (var i = 0; i < tracks.length; i++) if ((tracks[i].type === 'clip' ? 'clip:' + tracks[i].clip_id : tracks[i].id) === t.id) { currentIndex = i; break; }
    plSync();
  }

  function playAtIndex(index) {
    var t = tracks[index];
    if (!t) return;
    if (t.type === 'clip' && !plCanClip()) { plToast('live clips are still loading...try again in a sec'); return; }
    if (t.type !== 'clip' && !t.ia_url) { plToast('that song doesnt have audio yet'); return; }
    if (index === plCurIndex() && plLoaded() && typeof togglePlay === 'function') { togglePlay(); setTimeout(plSync, 60); return; }
    countPlaylistPlay();
    var playable = plPlayable();
    var q = playable.map(plQueueItem);
    var qi = playable.indexOf(t);
    currentIndex = index;
    setPlayerQueue(q, qi, _highlightPlRow);
    playQueueIndex(qi);
    setTimeout(plSync, 60);
  }

  async function removeTrack(index) {
    var t = tracks[index];
    if (!t) return;
    var before = tracks.slice();
    tracks.splice(index, 1);
    if (currentIndex === index) currentIndex = -1;
    else if (currentIndex > index) currentIndex--;
    renderList();
    try {
      if (t.type === 'clip') await api('/playlists/' + plPid + '/clips/' + encodeURIComponent(t.clip_id), { method: 'DELETE' });
      else await api('/playlists/' + plPid + '/tracks/' + encodeURIComponent(t.id), { method: 'DELETE' });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
      var st = document.querySelector('.plp-stats');
      if (st) st.outerHTML = statsHtml();
      plToast('removed ' + (t.type === 'clip' ? (t.song || 'that clip') : (t.title || 'that song')));
    } catch (err) {
      tracks = before;
      renderList();
      plToast('couldnt remove that song...' + ((err && err.message) || 'try again'), 'error');
    }
  }

  async function deletePlaylist() {
    if (!confirm('delete "' + (playlist.title || 'this playlist') + '"? you cant undo this')) return;
    try {
      await api('/playlists/' + plPid, { method: 'DELETE' });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
      plToast('playlist deleted');
      navigate('/playlists?tab=mine');
    } catch (err) {
      plToast('couldnt delete the playlist...' + ((err && err.message) || 'try again'), 'error');
    }
  }

  if (playlistId) loadPlaylist();
</script>
</body>
</html>
