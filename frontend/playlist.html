<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — playlist</title>
  <link rel="stylesheet" href="/css/style.css?v=202609052305">
</head>
<body>

<div id="view">
<div id="playlist-container">
  <div class="loading"><div class="spinner"></div></div>
</div>
</div><!-- /view -->

<!-- Edit Playlist Modal -->
<div class="modal-overlay" id="edit-playlist-modal">
  <div class="modal" style="max-width:460px;">
    <div class="modal-title">Edit Playlist</div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="ep-title" placeholder="Playlist name">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="ep-desc" rows="2" placeholder="Optional…"></textarea>
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="ep-public"> Public
      </label>
    </div>
    <div id="ep-alert" style="margin-top:10px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('edit-playlist-modal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="savePlaylistEdit()">Save</button>
    </div>
  </div>
</div>

<script src="/js/api.js?v=202609052305"></script>
<script src="/js/layout.js?v=202609052305"></script>
<script src="/js/player.js?v=202609052305"></script>
<script src="/js/router.js?v=202609052305"></script>
<script src="/js/playlists.js?v=202609052305"></script>
<script>
  initPlayer();

  var playlistId = new URLSearchParams(location.search).get('id');
  if (!playlistId) navigate('/index.html');

  var playlist = null;
  var tracks = [];
  var currentIndex = -1;
  var isOwner = false;

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadPlaylist() {
    try {
      playlist = await api('/playlists/' + playlistId);
      tracks = playlist.tracks || [];
      document.title = playlist.title + ' — wavernrs stream';
      isOwner = isLoggedIn() && playlist.owner && playlist.owner.username &&
        typeof getToken === 'function'; // refined below after we have user
      // Determine ownership by comparing user from /auth/me if logged in
      if (isLoggedIn()) {
        try {
          var me = await api('/auth/me');
          isOwner = me && me.id === playlist.owner.id;
        } catch (_) { isOwner = false; }
      }
      renderPlaylist();
    } catch (err) {
      document.getElementById('playlist-container').innerHTML =
        '<div class="empty-state"><div class="empty-title">Playlist not found</div>' +
        '<a href="/index.html" class="btn btn-primary" style="margin-top:16px">Go home</a></div>';
    }
  }

  function renderPlaylist() {
    var owner = playlist.owner || {};
    var firstCover = tracks.length && tracks[0].cover_url ? tracks[0].cover_url : '';
    if (typeof window.setPageBgImage === 'function') window.setPageBgImage(firstCover);
    var coverHtml = firstCover
      ? '<img src="' + escHtml(firstCover) + '" alt="cover" style="width:100%;height:100%;object-fit:cover;">'
      : '';

    var ownerHtml = owner.username
      ? 'by <a href="#" style="color:var(--text-secondary);font-weight:500;">' + escHtml(owner.username) + '</a>'
      : '';

    var privacyBadge = playlist.is_public ? '' :
      '';

    var actionBtns = '';
    if (isOwner) {
      actionBtns = '<button class="wv-btn-ghost" onclick="openEditModal()">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Edit' +
        '</button>' +
        '<button class="wv-btn-ghost" onclick="deletePlaylist()">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Delete' +
        '</button>';
    }

    var trackListHtml;
    if (!tracks.length) {
      trackListHtml = '<div class="empty-state" style="padding:24px;"><div class="empty-desc">No tracks in this playlist yet.</div></div>';
    } else {
      trackListHtml = tracks.map(function(t, i) {
        var cover = t.cover_url
          ? '<img src="' + escHtml(t.cover_url) + '" alt="">'
          : '🎵';
        var removeBtn = isOwner
          ? '<button class="btn btn-danger btn-sm remove-track-btn" onclick="event.stopPropagation();removeTrack(\'' + escHtml(t.id) + '\', ' + i + ')">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
            '</button>'
          : '';
        return '<div class="wv-track-row' + (i === currentIndex ? ' playing' : '') + '" onclick="playAtIndex(' + i + ')">' +
          '<div class="track-row-num">' + (i + 1) + '</div>' +
          '<div class="track-row-cover">' + cover + '</div>' +
          '<div class="track-row-info">' +
            '<div class="track-row-title">' + escHtml(t.title || 'Unknown') + '</div>' +
            '<div class="track-row-artist">' + escHtml(t.artist_name || 'Unknown') + '</div>' +
          '</div>' +
          '<span class="track-row-plays">' + fmtNum(t.play_count) + ' plays</span>' +
          removeBtn +
        '</div>';
      }).join('');
    }

    var searchSection = isOwner
      ? '<div style="margin-top:36px;">' +
          '<h2 class="section-title">Add Tracks</h2>' +
          '<div style="position:relative;margin-bottom:12px;">' +
            '<input type="text" id="pl-search-input" placeholder="Search edits and album tracks…" ' +
              'style="width:100%;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);' +
              'border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;" ' +
              'autocomplete="off">' +
            '<div id="pl-search-spinner" style="display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);">' +
              '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div>' +
            '</div>' +
          '</div>' +
          '<div id="pl-search-results"></div>' +
        '</div>'
      : '';

    document.getElementById('playlist-container').innerHTML =
      '<div style="padding:8px 0 0;">' +
        '<div class="wv-hero">' +
          '<div class="wv-hero-art" style="background:' + coverGradient(playlist.title || '') + ';">' + coverHtml + '</div>' +
          '<div class="wv-hero-body">' +
            '<div class="wv-kind">Playlist' + (playlist.is_public ? '' : ' · Private') + '</div>' +
            '<div class="wv-hero-title">' + escHtml(playlist.title) + '</div>' +
            '<div class="wv-hero-sub">' + ownerHtml + '</div>' +
            (playlist.description ? '<div class="wv-hero-meta" style="max-width:640px;line-height:1.5;">' + escHtml(playlist.description) + '</div>' : '') +
            '<div class="wv-hero-meta">' + tracks.length + ' track' + (tracks.length !== 1 ? 's' : '') + '</div>' +
            '<div class="wv-hero-actions">' +
              '<button class="wv-btn-play" onclick="playAll()">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg>Play' +
              '</button>' +
              actionBtns +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:32px;">' +
          '<h2 class="section-title">Tracks</h2>' +
          '<div class="track-list" id="pl-tracklist">' + trackListHtml + '</div>' +
        '</div>' +
        searchSection +
      '</div>';

    if (isOwner) initSearchSection();
  }

  function playAll() {
    if (!tracks.length) return;
    playAtIndex(0);
  }

  function _highlightPlRow(index) {
    document.querySelectorAll('#pl-tracklist .wv-track-row').forEach(function(row, i) {
      row.classList.toggle('playing', i === index);
    });
  }

  function playAtIndex(index) {
    if (!tracks[index]) return;
    currentIndex = index;
    var q = tracks.map(function(t) { return Object.assign({}, t, { artist_name: t.artist_name }); });
    setPlayerQueue(q, index, _highlightPlRow);
    playQueueIndex(index);
    _highlightPlRow(index);
  }

  async function removeTrack(trackId, index) {
    try {
      await api('/playlists/' + playlistId + '/tracks/' + trackId, { method: 'DELETE' });
      tracks.splice(index, 1);
      if (currentIndex >= index) currentIndex--;
      invalidatePlaylistCache();
      renderPlaylist();
    } catch (err) {
      alert('Failed to remove track: ' + (err.message || 'error'));
    }
  }

  // Skip/auto-advance is handled by the player's global queue (set in
  // playAtIndex), so it keeps working from the OS media controls too.

  // ── Edit modal ─────────────────────────────────────────────────────────────
  function openEditModal() {
    document.getElementById('ep-title').value = playlist.title || '';
    document.getElementById('ep-desc').value = playlist.description || '';
    document.getElementById('ep-public').checked = !!playlist.is_public;
    document.getElementById('ep-alert').innerHTML = '';
    document.getElementById('edit-playlist-modal').classList.add('open');
  }

  async function savePlaylistEdit() {
    var title = document.getElementById('ep-title').value.trim();
    if (!title) { document.getElementById('ep-alert').innerHTML = '<span style="color:var(--red);">Title is required</span>'; return; }
    try {
      var updated = await api('/playlists/' + playlistId, {
        method: 'PUT',
        body: JSON.stringify({
          title: title,
          description: document.getElementById('ep-desc').value.trim() || null,
          is_public: document.getElementById('ep-public').checked,
        }),
      });
      playlist.title = updated.title;
      playlist.description = updated.description;
      playlist.is_public = updated.is_public;
      document.title = playlist.title + ' — wavernrs stream';
      invalidatePlaylistCache();
      document.getElementById('edit-playlist-modal').classList.remove('open');
      renderPlaylist();
    } catch (err) {
      document.getElementById('ep-alert').innerHTML = '<span style="color:var(--red);">' + escHtml(err.message || 'Save failed') + '</span>';
    }
  }

  // ── Delete ─────────────────────────────────────────────────────────────────
  async function deletePlaylist() {
    if (!confirm('Delete this playlist? This cannot be undone.')) return;
    try {
      await api('/playlists/' + playlistId, { method: 'DELETE' });
      invalidatePlaylistCache();
      navigate('/dashboard.html');
    } catch (err) {
      alert('Failed to delete playlist: ' + (err.message || 'error'));
    }
  }

  // ── Track search (owner only) ───────────────────────────────────────────────
  var _searchTimer = null;

  function initSearchSection() {
    var input = document.getElementById('pl-search-input');
    if (!input) return;
    input.addEventListener('input', function () {
      clearTimeout(_searchTimer);
      var q = input.value.trim();
      if (!q) { document.getElementById('pl-search-results').innerHTML = ''; return; }
      if (q.length < 2) return;
      _searchTimer = setTimeout(function () { runSearch(q); }, 300);
    });
  }

  async function runSearch(q) {
    var spinner = document.getElementById('pl-search-spinner');
    var resultsEl = document.getElementById('pl-search-results');
    if (!resultsEl) return;
    if (spinner) spinner.style.display = '';
    resultsEl.innerHTML = '';
    try {
      var data = await api('/search?q=' + encodeURIComponent(q));
      if (spinner) spinner.style.display = 'none';
      var results = data.tracks || [];
      if (!results.length) {
        resultsEl.innerHTML = '<div style="padding:12px 0;font-size:13px;color:var(--text-tertiary);">No tracks found.</div>';
        return;
      }
      var existingIds = {};
      tracks.forEach(function (t) { existingIds[t.id] = true; });
      resultsEl.innerHTML = '<div class="track-list" style="margin-top:4px;">' +
        results.map(function (t) {
          var artistName = (t.artists && t.artists.display_name) ? t.artists.display_name : 'Unknown';
          var cover = t.cover_url || (t.albums && t.albums.cover_url) || '';
          var coverHtml = cover
            ? '<img src="' + escHtml(cover) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">'
            : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--surface-2);border-radius:4px;">🎵</div>';
          var already = existingIds[t.id];
          var btn = already
            ? '<span style="font-size:12px;color:var(--text-tertiary);padding:6px 10px;white-space:nowrap;">In playlist</span>'
            : '<button class="wv-pill" style="white-space:nowrap;font-size:12px;padding:6px 10px;" ' +
                'onclick="addSearchTrack(\'' + escHtml(t.id) + '\',\'' + escHtml(t.title) + '\',\'' + escHtml(artistName) + '\',\'' + escHtml(cover) + '\',\'' + escHtml(t.ia_url || '') + '\',this)">' +
                '+ Add</button>';
          return '<div class="wv-track-row" style="pointer-events:none;">' +
            '<div class="track-row-cover" style="pointer-events:none;">' + coverHtml + '</div>' +
            '<div class="track-row-info" style="flex:1;pointer-events:none;">' +
              '<div class="track-row-title">' + escHtml(t.title || 'Unknown') + '</div>' +
              '<div class="track-row-artist">' + escHtml(artistName) + '</div>' +
            '</div>' +
            '<div style="flex-shrink:0;pointer-events:auto;">' + btn + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    } catch (err) {
      if (spinner) spinner.style.display = 'none';
      resultsEl.innerHTML = '<div style="padding:12px 0;font-size:13px;color:var(--red);">Search failed.</div>';
    }
  }

  async function addSearchTrack(trackId, title, artistName, coverUrl, iaUrl, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
      await api('/playlists/' + playlistId + '/tracks', {
        method: 'POST',
        body: JSON.stringify({ track_id: trackId }),
      });
      // Add to local tracks array so it shows in the list and future searches show "In playlist"
      tracks.push({ id: trackId, title: title, artist_name: artistName, cover_url: coverUrl, ia_url: iaUrl, play_count: 0 });
      invalidatePlaylistCache();
      // Update button to "In playlist" and re-render tracklist
      var parent = btn.closest('div[style*="flex-shrink"]');
      if (parent) parent.innerHTML = '<span style="font-size:12px;color:var(--text-tertiary);padding:6px 10px;white-space:nowrap;">In playlist</span>';
      // Re-render just the tracklist section
      var tlEl = document.getElementById('pl-tracklist');
      if (tlEl) {
        tlEl.innerHTML = tracks.map(function(t, i) {
          var cover = t.cover_url
            ? '<img src="' + escHtml(t.cover_url) + '" alt="">'
            : '🎵';
          var removeBtn = isOwner
            ? '<button class="btn btn-danger btn-sm remove-track-btn" onclick="event.stopPropagation();removeTrack(\'' + escHtml(t.id) + '\', ' + i + ')">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
              '</button>'
            : '';
          return '<div class="wv-track-row' + (i === currentIndex ? ' playing' : '') + '" onclick="playAtIndex(' + i + ')">' +
            '<div class="track-row-num">' + (i + 1) + '</div>' +
            '<div class="track-row-cover">' + cover + '</div>' +
            '<div class="track-row-info">' +
              '<div class="track-row-title">' + escHtml(t.title || 'Unknown') + '</div>' +
              '<div class="track-row-artist">' + escHtml(t.artist_name || 'Unknown') + '</div>' +
            '</div>' +
            '<span class="track-row-plays">' + fmtNum(t.play_count) + ' plays</span>' +
            removeBtn +
          '</div>';
        }).join('');
      }
    } catch (err) {
      btn.disabled = false;
      if (err && err.message && err.message.includes('409')) {
        btn.textContent = 'Already added';
        tracks.push({ id: trackId }); // prevent double-click
      } else {
        btn.textContent = 'Failed';
        setTimeout(function () { btn.textContent = '+ Add'; btn.disabled = false; }, 2000);
      }
    }
  }

  loadPlaylist();
</script>
</body>
</html>
