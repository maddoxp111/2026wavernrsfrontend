<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — community</title>
  <link rel="stylesheet" href="/css/style.css?v=202609052314">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script src="/js/api.js?v=202609052314"></script>
<script src="/js/layout.js?v=202609052314"></script>
<script src="/js/player.js?v=202609052314"></script>
<script src="/js/router.js?v=202609052314"></script>
<script>
  // Inject community styles once (works on both hard refresh and SPA navigation)
  if (!document.getElementById('comm-styles')) {
    var _cs = document.createElement('style');
    _cs.id = 'comm-styles';
    _cs.textContent = [
      '.comm-post-card{background:var(--surface-2,#18181b);border:1px solid var(--border,#27272a);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color 0.15s,background 0.15s;}',
      '.comm-post-card:hover{border-color:var(--purple-light,var(--purple));background:var(--surface-3,#1c1c1f);}',
      '.comm-vote-col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:32px;}',
      '.comm-vote-btn{background:none;border:none;cursor:pointer;padding:3px 6px;font-size:14px;color:var(--text-3,#71717a);border-radius:4px;transition:color 0.12s,background 0.12s;line-height:1;}',
      '.comm-vote-btn.up:hover{color:var(--purple);background:rgba(139,92,246,0.1);}',
      '.comm-vote-btn.down:hover{color:var(--red);background:rgba(248,113,113,0.1);}',
      '.comm-vote-score{font-size:13px;font-weight:700;color:var(--text-2,#a1a1aa);min-width:20px;text-align:center;line-height:1.2;}',
      '.comm-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}',
      '.comm-meta-item{font-size:12px;color:var(--text-3,#71717a);display:flex;align-items:center;gap:3px;}',
      '.comm-avatar{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}',
      '.comm-dot{font-size:12px;color:var(--text-3,#71717a);}',
      '.comm-comment-block{background:var(--surface-2,#18181b);border:1px solid var(--border,#27272a);border-radius:10px;padding:12px 14px;margin-bottom:8px;}',
      '.comm-reply-btn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3,#71717a);padding:2px 6px;border-radius:4px;font-family:inherit;transition:color 0.12s;}',
      '.comm-reply-btn:hover{color:var(--text,#fafafa);}',
      '.comm-format-bar{display:flex;gap:4px;margin-bottom:6px;padding:4px 0;}',
      '.comm-fmt-btn{background:none;border:1px solid var(--border,#27272a);border-radius:5px;padding:3px 9px;cursor:pointer;font-size:12px;color:var(--text-2,#a1a1aa);font-family:inherit;transition:border-color 0.12s,color 0.12s;}',
      '.comm-fmt-btn:hover{border-color:var(--purple-light,var(--purple));color:var(--purple);}',
    ].join('');
    document.head.appendChild(_cs);
  }

  initPlayer();

  var currentView = 'list';
  var posts = [];
  var currentPost = null;
  var currentComments = [];
  var me = null;
  var isMod = false;
  var _sort = 'trending'; // trending | top | latest

  try { me = JSON.parse(localStorage.getItem('user') || 'null'); } catch(_) {}
  isMod = sessionStorage.getItem('wv_is_mod') === 'true';
  // Fetch the full artist profile to get profile_image_url for the page background.
  if (typeof window.setPageBgImage === 'function' && isLoggedIn()) {
    api('/auth/me').then(function(full) {
      var img = full && full.artist && (full.artist.profile_image_url || full.artist.banner_url);
      window.setPageBgImage(img || '');
    }).catch(function() {});
  }

  // ── Formatting ────────────────────────────────────────────────────────────
  function wrapFormat(tid, pre, suf) {
    var ta = document.getElementById(tid);
    if (!ta) return;
    var s = ta.selectionStart, e = ta.selectionEnd;
    var word = ta.value.substring(s, e) || 'text';
    ta.value = ta.value.substring(0, s) + pre + word + suf + ta.value.substring(e);
    ta.focus();
    ta.setSelectionRange(s + pre.length, s + pre.length + word.length);
  }

  function formatBar(tid) {
    return '<div class="comm-format-bar">' +
      '<button class="comm-fmt-btn" type="button" style="font-weight:800;" onclick="wrapFormat(\'' + tid + '\',\'**\',\'**\')" title="Bold">B</button>' +
      '<button class="comm-fmt-btn" type="button" style="text-decoration:line-through;" onclick="wrapFormat(\'' + tid + '\',\'~~\',\'~~\')" title="Strike">S</button>' +
      '<button class="comm-fmt-btn" type="button" style="text-decoration:underline;" onclick="wrapFormat(\'' + tid + '\',\'__\',\'__\')" title="Underline">U</button>' +
      '<button type="button" style="background:none;border:none;padding:2px 8px;cursor:pointer;color:var(--text-3);font-size:12px;font-family:inherit;margin-left:auto;" onclick="var ta=document.getElementById(\'' + tid + '\');if(ta)ta.value=\'\';" title="Clear">Clear</button>' +
    '</div>';
  }

  function renderMd(text) {
    if (!text) return '';
    var s = escHtml(text);
    s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/~~([^~\n]+?)~~/g, '<s>$1</s>');
    s = s.replace(/__([^_\n]+?)__/g, '<u>$1</u>');
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  function netScore(item) {
    if (item.net_votes !== undefined) return item.net_votes;
    return (item.upvotes || 0) - (item.downvotes || 0);
  }

  function userInitial(username) {
    return (username || '?')[0].toUpperCase();
  }

  function avatarHTML(username, profileImageUrl) {
    var colors = ['var(--purple)','#06b6d4','#10b981','var(--orange)','#ec4899','#3b82f6'];
    var idx = (username || '').charCodeAt(0) % colors.length;
    if (profileImageUrl) {
      return '<span class="comm-avatar" style="background:' + colors[idx] + ';overflow:hidden;padding:0;">' +
        '<img src="' + escHtml(profileImageUrl) + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.style.display=\'none\'">' +
        '</span>';
    }
    return '<span class="comm-avatar" style="background:' + colors[idx] + ';">' + escHtml(userInitial(username)) + '</span>';
  }

  function usernameLink(username, artistId) {
    var name = '@' + escHtml(username || 'unknown');
    if (artistId) {
      return '<a onclick="event.stopPropagation();navigate(\'/artist.html?id=' + escHtml(artistId) + '\')" style="font-weight:600;color:var(--text-2);text-decoration:none;cursor:pointer;" onmouseenter="this.style.textDecoration=\'underline\'" onmouseleave="this.style.textDecoration=\'none\'">' + name + '</a>';
    }
    return '<span style="font-weight:600;color:var(--text-2);">' + name + '</span>';
  }

  function _sortedPosts() {
    var now = Date.now();
    var weekMs = 7 * 24 * 60 * 60 * 1000;
    if (_sort === 'latest') {
      return posts.slice().sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    }
    if (_sort === 'top') {
      return posts.slice().sort(function(a, b) {
        var diff = netScore(b) - netScore(a);
        return diff !== 0 ? diff : new Date(b.created_at) - new Date(a.created_at);
      });
    }
    // trending: recent posts weighted by engagement
    return posts.slice().sort(function(a, b) {
      var aRecent = (now - new Date(a.created_at)) < weekMs ? 1 : 0;
      var bRecent = (now - new Date(b.created_at)) < weekMs ? 1 : 0;
      if (aRecent !== bRecent) return bRecent - aRecent;
      var aScore = netScore(a) + (a.comment_count || 0) * 0.5;
      var bScore = netScore(b) + (b.comment_count || 0) * 0.5;
      var diff = bScore - aScore;
      return diff !== 0 ? diff : new Date(b.created_at) - new Date(a.created_at);
    });
  }

  function setSort(sort) {
    _sort = sort;
    var listEl = document.getElementById('posts-list');
    if (!listEl) return;
    var sorted = _sortedPosts();
    listEl.innerHTML = sorted.length
      ? '<div style="display:flex;flex-direction:column;gap:12px;">' + sorted.map(postRowHTML).join('') + '</div>'
      : '<div class="empty-state" style="padding:60px 0;"><div style="font-size:32px;margin-bottom:12px;">💬</div><div class="empty-title">No posts yet</div></div>';
    // Update pill active state
    document.querySelectorAll('.comm-sort-btn').forEach(function(btn) {
      btn.classList.toggle('is-active', btn.dataset.sort === sort);
    });
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  (function init() {
    var params = new URLSearchParams(location.search);
    var postId = params.get('post');
    if (postId) loadPost(postId); else loadPosts();
  })();

  // ── List view ─────────────────────────────────────────────────────────────
  async function loadPosts() {
    currentView = 'list';
    var view = document.getElementById('view');
    if (!view) return;
    view.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var data = await api('/community/posts');
      posts = Array.isArray(data) ? data : [];
      posts.sort(function(a, b) {
        var diff = netScore(b) - netScore(a);
        return diff !== 0 ? diff : new Date(b.created_at) - new Date(a.created_at);
      });
      renderList();
    } catch (err) {
      document.getElementById('view').innerHTML =
        '<div style="padding:60px 20px;text-align:center;color:var(--text-2);">Failed to load posts: ' + escHtml(err.message) + '</div>';
    }
  }

  function renderList() {
    var view = document.getElementById('view');
    if (!view) return;

    var newPostForm =
      '<div id="new-post-form" style="display:none;margin-bottom:20px;">' +
        '<div class="wv-card" style="padding:22px;display:flex;flex-direction:column;gap:14px;">' +
          '<div style="font-size:16px;font-weight:800;letter-spacing:-0.02em;">New Post</div>' +
          '<div>' +
            '<label class="wv-form-label">Title *</label>' +
            '<input id="np-title" type="text" class="wv-input" placeholder="What\'s the topic?" style="width:100%;box-sizing:border-box;" maxlength="300">' +
          '</div>' +
          '<div>' +
            '<label class="wv-form-label">Body</label>' +
            formatBar('np-body') +
            '<textarea id="np-body" class="wv-input" placeholder="Share your thoughts…" rows="4" style="width:100%;box-sizing:border-box;resize:vertical;min-height:90px;"></textarea>' +
          '</div>' +
          '<div id="np-error" style="font-size:13px;color:var(--red);display:none;"></div>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
            '<button class="wv-pill" onclick="hideNewPostForm()">Cancel</button>' +
            '<button class="wv-pill brand" onclick="submitNewPost()">Post</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var sortPills =
      '<div style="display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px;">' +
        ['trending','top','latest'].map(function(s) {
          var label = s[0].toUpperCase() + s.slice(1);
          return '<button class="comm-sort-btn wv-seg' + (s === _sort ? ' is-active' : '') + '" data-sort="' + s + '" onclick="setSort(\'' + s + '\')" style="background:none;border:none;cursor:pointer;padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-2);transition:background 0.15s,color 0.15s;">' + label + '</button>';
        }).join('') +
      '</div>';
    if (!document.getElementById('comm-seg-styles')) {
      var _ss = document.createElement('style');
      _ss.id = 'comm-seg-styles';
      _ss.textContent = '.comm-sort-btn.is-active{background:var(--purple,#7c3aed)!important;color:#fff!important;}';
      document.head.appendChild(_ss);
    }
    var header =
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;">' +
        '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">' +
          '<div>' +
            '<h1 style="margin:0 0 4px;font-size:30px;font-weight:800;letter-spacing:-0.035em;">Community</h1>' +
            '<p style="margin:0;font-size:13.5px;color:var(--text-2);">Connect with others.</p>' +
          '</div>' +
          sortPills +
        '</div>' +
        (me ? '<button class="wv-pill brand" onclick="showNewPostForm()" style="flex-shrink:0;gap:6px;">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>' +
          ' New Post</button>' : '') +
      '</div>';

    var _sorted = _sortedPosts();
    var postsHTML = !_sorted.length
      ? '<div class="empty-state" style="padding:60px 0;">' +
          '<div style="font-size:32px;margin-bottom:12px;">💬</div>' +
          '<div class="empty-title">No posts yet</div>' +
          '<div class="empty-desc">Be the first to start a conversation.</div>' +
        '</div>'
      : '<div style="display:flex;flex-direction:column;gap:12px;">' +
          _sorted.map(postRowHTML).join('') +
        '</div>';

    view.innerHTML =
      '<div style="max-width:740px;margin:0 auto;padding:28px 16px 80px;">' +
        header + newPostForm +
        '<div id="posts-list">' + postsHTML + '</div>' +
      '</div>';
  }

  function postRowHTML(p) {
    var s = netScore(p);
    var isOwner = me && me.id === p.user_id;
    var bodyPreview = p.body ? p.body.replace(/\*\*|~~|__/g, '').slice(0, 140) + (p.body.length > 140 ? '…' : '') : '';

    var actionBtns = '';
    if (isOwner) {
      actionBtns += '<button onclick="event.stopPropagation();deletePost(\'' + escHtml(p.id) + '\')" class="comm-reply-btn" style="color:var(--red);" title="Delete your post">Delete</button>';
    }
    if (isMod && !isOwner) {
      actionBtns += '<button onclick="event.stopPropagation();modTakeDownPost(\'' + escHtml(p.id) + '\')" class="comm-reply-btn" style="color:var(--red);" title="Mod: take down post">Take down</button>';
    }

    return (
      '<div class="comm-post-card" id="post-row-' + escHtml(p.id) + '" onclick="openPost(\'' + escHtml(p.id) + '\')">' +
        '<div style="display:flex;gap:14px;">' +
          // Vote column
          '<div class="comm-vote-col" style="padding-top:2px;">' +
            '<button class="comm-vote-btn up" onclick="event.stopPropagation();votePost(\'' + escHtml(p.id) + '\',1)" title="Upvote">▲</button>' +
            '<span class="comm-vote-score" id="post-score-' + escHtml(p.id) + '">' + s + '</span>' +
            '<button class="comm-vote-btn down" onclick="event.stopPropagation();votePost(\'' + escHtml(p.id) + '\',-1)" title="Downvote">▼</button>' +
          '</div>' +
          // Content
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:16px;font-weight:700;color:var(--text);letter-spacing:-0.02em;line-height:1.3;margin-bottom:' + (bodyPreview ? '6px' : '8px') + ';">' +
              escHtml(p.title) +
            '</div>' +
            (bodyPreview ? '<div style="font-size:13px;color:var(--text-3);line-height:1.55;margin-bottom:10px;">' + escHtml(bodyPreview) + '</div>' : '') +
            '<div class="comm-meta">' +
              avatarHTML(p.username, p.profile_image_url) +
              '<span class="comm-meta-item">' + usernameLink(p.username, p.artist_id) + '</span>' +
              '<span class="comm-dot">·</span>' +
              '<span class="comm-meta-item">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155"/></svg>' +
                (p.comment_count || 0) + ' ' + ((p.comment_count || 0) === 1 ? 'comment' : 'comments') +
              '</span>' +
              '<span class="comm-dot">·</span>' +
              '<span class="comm-meta-item">' + timeAgo(p.created_at) + '</span>' +
              (actionBtns ? '<span style="margin-left:auto;">' + actionBtns + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function showNewPostForm() {
    var form = document.getElementById('new-post-form');
    if (form) {
      form.style.display = '';
      var inp = document.getElementById('np-title');
      if (inp) setTimeout(function() { inp.focus(); }, 50);
    }
  }
  function hideNewPostForm() {
    var form = document.getElementById('new-post-form');
    if (form) form.style.display = 'none';
    var errEl = document.getElementById('np-error');
    if (errEl) errEl.style.display = 'none';
  }

  async function submitNewPost() {
    var titleEl = document.getElementById('np-title');
    var bodyEl = document.getElementById('np-body');
    var errEl = document.getElementById('np-error');
    var title = titleEl ? titleEl.value.trim() : '';
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!title) {
      if (errEl) { errEl.textContent = 'Title is required.'; errEl.style.display = ''; }
      if (titleEl) titleEl.focus();
      return;
    }
    if (errEl) errEl.style.display = 'none';
    try {
      var newPost = await api('/community/posts', { method: 'POST', body: JSON.stringify({ title, body }) });
      newPost.comment_count = 0;
      posts.unshift(newPost);
      hideNewPostForm();
      if (titleEl) titleEl.value = '';
      if (bodyEl) bodyEl.value = '';
      var listEl = document.getElementById('posts-list');
      if (listEl) listEl.innerHTML = '<div style="display:flex;flex-direction:column;gap:12px;">' + posts.map(postRowHTML).join('') + '</div>';
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ''; }
    }
  }

  async function deletePost(id) {
    if (!confirm('Delete this post? This cannot be undone.')) return;
    try {
      await api('/community/posts/' + id, { method: 'DELETE' });
      posts = posts.filter(function(p) { return p.id !== id; });
      if (currentView === 'post' && currentPost && currentPost.id === id) {
        goBackToList();
      } else {
        var listEl = document.getElementById('posts-list');
        if (listEl) listEl.innerHTML = posts.length
          ? '<div style="display:flex;flex-direction:column;gap:12px;">' + posts.map(postRowHTML).join('') + '</div>'
          : '<div class="empty-state"><div class="empty-title">No posts yet</div></div>';
      }
    } catch (err) { alert('Could not delete: ' + err.message); }
  }

  async function modTakeDownPost(id) {
    if (!confirm('Take down this post? This cannot be undone.')) return;
    try {
      await api('/mod/community-posts/' + id, { method: 'DELETE' });
      posts = posts.filter(function(p) { return p.id !== id; });
      if (currentView === 'post' && currentPost && currentPost.id === id) {
        goBackToList();
      } else {
        var listEl = document.getElementById('posts-list');
        if (listEl) listEl.innerHTML = posts.length
          ? '<div style="display:flex;flex-direction:column;gap:12px;">' + posts.map(postRowHTML).join('') + '</div>'
          : '<div class="empty-state"><div class="empty-title">No posts</div></div>';
      }
    } catch (err) { alert('Could not take down: ' + err.message); }
  }

  async function votePost(id, vote) {
    if (!isLoggedIn()) { navigate('/login.html'); return; }
    var post = posts.find(function(p) { return p.id === id; }) || (currentPost && currentPost.id === id ? currentPost : null);
    if (!post) return;
    var prev = netScore(post);
    post.net_votes = prev + vote;
    _updatePostScore(id);
    try {
      var result = await api('/community/posts/' + id + '/vote', { method: 'POST', body: JSON.stringify({ vote }) });
      if (result) post.net_votes = result.net_votes !== undefined ? result.net_votes : (result.upvotes - result.downvotes);
      _updatePostScore(id);
    } catch (err) {
      post.net_votes = prev;
      _updatePostScore(id);
      if (err.message && err.message.includes('401')) navigate('/login.html');
    }
  }
  function _updatePostScore(id) {
    var el = document.getElementById('post-score-' + id);
    var post = posts.find(function(p) { return p.id === id; }) || currentPost;
    if (el && post) el.textContent = netScore(post);
  }

  function openPost(id) {
    history.pushState(null, '', location.pathname + '?post=' + encodeURIComponent(id));
    loadPost(id);
  }
  function goBackToList() {
    history.pushState(null, '', location.pathname);
    loadPosts();
  }

  // ── Post view ─────────────────────────────────────────────────────────────
  async function loadPost(id) {
    currentView = 'post';
    var view = document.getElementById('view');
    if (!view) return;
    view.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var data = await api('/community/posts/' + id);
      currentPost = data.post || data;
      currentComments = Array.isArray(data.comments) ? data.comments : [];
      renderPost();
    } catch (err) {
      document.getElementById('view').innerHTML =
        '<div style="max-width:740px;margin:0 auto;padding:28px 16px;">' +
          '<button class="wv-pill" onclick="goBackToList()" style="margin-bottom:20px;">← Community</button>' +
          '<div style="color:var(--text-2);">Failed to load post.</div>' +
        '</div>';
    }
  }

  function renderPost() {
    var view = document.getElementById('view');
    if (!view || !currentPost) return;
    var p = currentPost;
    var s = netScore(p);
    var isOwner = me && me.id === p.user_id;

    var modBtn = isMod && !isOwner
      ? '<button onclick="modTakeDownPost(\'' + escHtml(p.id) + '\')" class="wv-pill" style="font-size:12px;color:var(--red);border-color:var(--red);padding:5px 12px;">Take down</button>'
      : '';
    var deleteBtn = isOwner
      ? '<button onclick="deletePost(\'' + escHtml(p.id) + '\')" class="wv-pill" style="font-size:12px;color:var(--red);border-color:var(--red);padding:5px 12px;">Delete post</button>'
      : '';

    var commentForm = isLoggedIn()
      ? '<div style="margin-bottom:28px;">' +
          '<div style="font-size:14px;font-weight:600;margin-bottom:10px;">Add a comment</div>' +
          formatBar('top-comment-body') +
          '<textarea id="top-comment-body" class="wv-input" rows="3" placeholder="Write something…" style="width:100%;box-sizing:border-box;resize:vertical;min-height:74px;"></textarea>' +
          '<div id="top-comment-error" style="font-size:12px;color:var(--red);display:none;margin-top:4px;"></div>' +
          '<div style="display:flex;justify-content:flex-end;margin-top:8px;">' +
            '<button class="wv-pill brand" onclick="submitTopComment()">Comment</button>' +
          '</div>' +
        '</div>'
      : '<div style="margin-bottom:24px;font-size:13px;color:var(--text-2);">' +
          '<a href="/login.html" style="color:var(--brand,var(--purple));">Log in</a> to comment.' +
        '</div>';

    view.innerHTML =
      '<div style="max-width:740px;margin:0 auto;padding:28px 16px 80px;">' +
        // Back
        '<button class="wv-pill" onclick="goBackToList()" style="margin-bottom:20px;gap:6px;">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>' +
          ' Community' +
        '</button>' +

        // Post card
        '<div class="wv-card" style="padding:24px;margin-bottom:20px;">' +
          '<div style="display:flex;gap:16px;">' +
            // Vote
            '<div class="comm-vote-col">' +
              '<button class="comm-vote-btn up" onclick="votePost(\'' + escHtml(p.id) + '\',1)" title="Upvote">▲</button>' +
              '<span class="comm-vote-score" id="post-score-' + escHtml(p.id) + '" style="font-size:16px;">' + s + '</span>' +
              '<button class="comm-vote-btn down" onclick="votePost(\'' + escHtml(p.id) + '\',-1)" title="Downvote">▼</button>' +
            '</div>' +
            // Content
            '<div style="flex:1;min-width:0;">' +
              '<h1 style="margin:0 0 10px;font-size:22px;font-weight:800;letter-spacing:-0.025em;line-height:1.25;">' + escHtml(p.title) + '</h1>' +
              (p.body ? '<div style="font-size:14px;line-height:1.7;color:var(--text-2);margin-bottom:14px;">' + renderMd(p.body) + '</div>' : '') +
              '<div class="comm-meta">' +
                avatarHTML(p.username, p.profile_image_url) +
                '<span style="font-size:12.5px;">' + usernameLink(p.username, p.artist_id) + '</span>' +
                '<span class="comm-dot">·</span>' +
                '<span class="comm-meta-item">' + timeAgo(p.created_at) + '</span>' +
                (deleteBtn || modBtn ? '<div style="margin-left:auto;display:flex;gap:6px;">' + deleteBtn + modBtn + '</div>' : '') +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        // Comments
        '<div>' +
          '<div style="font-size:15px;font-weight:700;letter-spacing:-0.02em;margin-bottom:16px;" id="comment-heading">' +
            currentComments.length + (currentComments.length === 1 ? ' Comment' : ' Comments') +
          '</div>' +
          commentForm +
          '<div id="comments-tree">' + buildCommentTree() + '</div>' +
        '</div>' +
      '</div>';
  }

  // ── Comments ──────────────────────────────────────────────────────────────
  function buildCommentTree() {
    if (!currentComments.length) {
      return '<div style="text-align:center;padding:32px 0;color:var(--text-3);font-size:14px;">No comments yet — be the first!</div>';
    }
    var childrenOf = {}, roots = [];
    currentComments.forEach(function(c) {
      var pid = c.parent_id || null;
      if (pid) { (childrenOf[pid] = childrenOf[pid] || []).push(c); }
      else { roots.push(c); }
    });
    roots.sort(function(a, b) { return netScore(b) - netScore(a); });
    Object.keys(childrenOf).forEach(function(pid) {
      childrenOf[pid].sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); });
    });

    function renderNode(c, depth) {
      var s = netScore(c);
      var indent = Math.min(depth, 3) * 20;
      var isOwner = me && me.id === c.user_id;
      var children = (childrenOf[c.id] || []).map(function(ch) { return renderNode(ch, depth + 1); }).join('');

      var actionBtns = '';
      if (isLoggedIn()) actionBtns += '<button class="comm-reply-btn" onclick="toggleReplyForm(\'' + escHtml(c.id) + '\')">Reply</button>';
      if (isOwner) actionBtns += '<button class="comm-reply-btn" style="color:var(--red);" onclick="deleteComment(\'' + escHtml(c.id) + '\')">Delete</button>';
      if (isMod && !isOwner) actionBtns += '<button class="comm-reply-btn" style="color:var(--red);" onclick="modDeleteComment(\'' + escHtml(c.id) + '\')">Take down</button>';

      var replyForm =
        '<div id="reply-form-' + escHtml(c.id) + '" style="display:none;margin-top:10px;">' +
          formatBar('reply-body-' + c.id) +
          '<textarea id="reply-body-' + escHtml(c.id) + '" class="wv-input" rows="2" placeholder="Reply…" ' +
            'style="width:100%;box-sizing:border-box;resize:vertical;min-height:56px;font-size:13px;"></textarea>' +
          '<div id="reply-error-' + escHtml(c.id) + '" style="font-size:12px;color:var(--red);display:none;margin-top:3px;"></div>' +
          '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:7px;">' +
            '<button class="wv-pill" style="font-size:12px;padding:4px 12px;" onclick="toggleReplyForm(\'' + escHtml(c.id) + '\')">Cancel</button>' +
            '<button class="wv-pill brand" style="font-size:12px;padding:4px 12px;" onclick="submitReply(\'' + escHtml(c.id) + '\')">Reply</button>' +
          '</div>' +
        '</div>';

      return (
        '<div style="margin-left:' + indent + 'px;" id="comment-node-' + escHtml(c.id) + '">' +
          '<div class="comm-comment-block">' +
            '<div style="display:flex;align-items:center;gap:7px;margin-bottom:6px;">' +
              avatarHTML(c.username, c.profile_image_url) +
              '<span style="font-size:12.5px;">' + usernameLink(c.username, c.artist_id) + '</span>' +
              '<span class="comm-meta-item">' + timeAgo(c.created_at) + '</span>' +
            '</div>' +
            '<div style="font-size:13.5px;line-height:1.65;color:var(--text);margin-bottom:8px;">' + renderMd(c.body) + '</div>' +
            '<div style="display:flex;align-items:center;gap:2px;">' +
              '<button class="comm-vote-btn up" style="font-size:13px;padding:2px 5px;" onclick="voteComment(\'' + escHtml(c.id) + '\',1)">▲</button>' +
              '<span id="comment-score-' + escHtml(c.id) + '" style="font-size:12px;font-weight:600;color:var(--text-3);min-width:18px;text-align:center;">' + Math.max(0, s) + '</span>' +
              '<button class="comm-vote-btn down" style="font-size:13px;padding:2px 5px;" onclick="voteComment(\'' + escHtml(c.id) + '\',-1)">▼</button>' +
              '<span style="width:8px;"></span>' +
              actionBtns +
            '</div>' +
            replyForm +
          '</div>' +
          children +
        '</div>'
      );
    }

    return roots.map(function(c) { return renderNode(c, 0); }).join('');
  }

  function rerenderComments() {
    var el = document.getElementById('comments-tree');
    if (el) el.innerHTML = buildCommentTree();
    var h = document.getElementById('comment-heading');
    if (h) h.textContent = currentComments.length + (currentComments.length === 1 ? ' Comment' : ' Comments');
  }

  async function submitTopComment() {
    var bodyEl = document.getElementById('top-comment-body');
    var errEl = document.getElementById('top-comment-error');
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!body) {
      if (errEl) { errEl.textContent = 'Write something first.'; errEl.style.display = ''; }
      return;
    }
    if (errEl) errEl.style.display = 'none';
    try {
      var c = await api('/community/posts/' + currentPost.id + '/comments', { method: 'POST', body: JSON.stringify({ body }) });
      currentComments.push(c);
      if (bodyEl) bodyEl.value = '';
      rerenderComments();
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ''; }
    }
  }

  function toggleReplyForm(commentId) {
    var form = document.getElementById('reply-form-' + commentId);
    if (!form) return;
    var hidden = form.style.display === 'none' || !form.style.display;
    form.style.display = hidden ? '' : 'none';
    if (hidden) { var ta = document.getElementById('reply-body-' + commentId); if (ta) setTimeout(function() { ta.focus(); }, 50); }
  }

  async function submitReply(parentId) {
    var bodyEl = document.getElementById('reply-body-' + parentId);
    var errEl = document.getElementById('reply-error-' + parentId);
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!body) {
      if (errEl) { errEl.textContent = 'Write something first.'; errEl.style.display = ''; }
      return;
    }
    if (errEl) errEl.style.display = 'none';
    try {
      var c = await api('/community/posts/' + currentPost.id + '/comments', { method: 'POST', body: JSON.stringify({ body, parent_id: parentId }) });
      currentComments.push(c);
      if (bodyEl) bodyEl.value = '';
      rerenderComments();
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ''; }
    }
  }

  async function voteComment(id, vote) {
    if (!isLoggedIn()) { navigate('/login.html'); return; }
    var c = currentComments.find(function(x) { return x.id === id; });
    if (!c) return;
    var prev = netScore(c);
    c.net_votes = prev + vote;
    var el = document.getElementById('comment-score-' + id);
    if (el) el.textContent = Math.max(0, netScore(c));
    try {
      var result = await api('/community/comments/' + id + '/vote', { method: 'POST', body: JSON.stringify({ vote }) });
      if (result) c.net_votes = result.net_votes !== undefined ? result.net_votes : (result.upvotes - result.downvotes);
      if (el) el.textContent = Math.max(0, netScore(c));
    } catch (err) {
      c.net_votes = prev;
      if (el) el.textContent = Math.max(0, netScore(c));
    }
  }

  async function deleteComment(id) {
    if (!confirm('Delete this comment?')) return;
    try {
      await api('/community/comments/' + id, { method: 'DELETE' });
      currentComments = currentComments.filter(function(c) { return c.id !== id; });
      rerenderComments();
    } catch (err) { alert('Could not delete: ' + err.message); }
  }

  async function modDeleteComment(id) {
    if (!confirm('Take down this comment?')) return;
    try {
      await api('/community/comments/' + id, { method: 'DELETE' });
      currentComments = currentComments.filter(function(c) { return c.id !== id; });
      rerenderComments();
    } catch (err) { alert('Could not take down: ' + err.message); }
  }
</script>
</body>
</html>
