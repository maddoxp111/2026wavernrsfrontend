<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — community</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  initPlayer();

  // ── Top-level state ───────────────────────────────────────────────────────
  var currentView = 'list';
  var posts = [];
  var currentPost = null;
  var currentComments = [];
  var me = null;

  try { me = JSON.parse(localStorage.getItem('user') || 'null'); } catch(_) {}

  // ── Text formatting ───────────────────────────────────────────────────────
  function wrapFormat(textareaId, prefix, suffix) {
    var ta = document.getElementById(textareaId);
    if (!ta) return;
    var start = ta.selectionStart, end = ta.selectionEnd;
    var selected = ta.value.substring(start, end);
    var word = selected || 'text';
    ta.value = ta.value.substring(0, start) + prefix + word + suffix + ta.value.substring(end);
    ta.focus();
    ta.setSelectionRange(start + prefix.length, start + prefix.length + word.length);
  }

  function clearBody(textareaId) {
    var ta = document.getElementById(textareaId);
    if (ta) { ta.value = ''; ta.focus(); }
  }

  function formatToolbar(textareaId) {
    var btn = 'type="button" style="background:var(--glass-pill-bg);border:1px solid var(--glass-small-border);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--text-2);font-size:12px;font-family:inherit;line-height:1.4;"';
    return '<div style="display:flex;gap:4px;margin-bottom:6px;align-items:center;">' +
      '<button ' + btn + ' style="background:var(--glass-pill-bg);border:1px solid var(--glass-small-border);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--text-2);font-size:12px;font-family:inherit;line-height:1.4;font-weight:800;" onclick="wrapFormat(\'' + textareaId + '\',\'**\',\'**\')" title="Bold"><b>B</b></button>' +
      '<button ' + btn + ' style="background:var(--glass-pill-bg);border:1px solid var(--glass-small-border);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--text-2);font-size:12px;font-family:inherit;line-height:1.4;text-decoration:line-through;" onclick="wrapFormat(\'' + textareaId + '\',\'~~\',\'~~\')" title="Strikethrough">S</button>' +
      '<button ' + btn + ' style="background:var(--glass-pill-bg);border:1px solid var(--glass-small-border);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--text-2);font-size:12px;font-family:inherit;line-height:1.4;text-decoration:underline;" onclick="wrapFormat(\'' + textareaId + '\',\'__\',\'__\')" title="Underline">U</button>' +
      '<button type="button" style="background:none;border:none;padding:3px 8px;cursor:pointer;color:var(--text-3);font-size:12px;font-family:inherit;margin-left:auto;" onclick="clearBody(\'' + textareaId + '\')" title="Clear body">Delete</button>' +
    '</div>';
  }

  function renderFormatted(text) {
    if (!text) return '';
    var s = escHtml(text);
    s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/~~([^~\n]+?)~~/g, '<s>$1</s>');
    s = s.replace(/__([^_\n]+?)__/g, '<u>$1</u>');
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  // ── Utility helpers ───────────────────────────────────────────────────────
  function score(item) {
    if (item.net_votes !== undefined) return Math.max(0, item.net_votes);
    return Math.max(0, (item.upvotes || 0) - (item.downvotes || 0));
  }

  // ── On load: check URL for ?post=<id> ────────────────────────────────────
  (function init() {
    var params = new URLSearchParams(location.search);
    var postId = params.get('post');
    if (postId) {
      loadPost(postId);
    } else {
      loadPosts();
    }
  })();

  // ── List view ─────────────────────────────────────────────────────────────
  async function loadPosts() {
    currentView = 'list';
    var view = document.getElementById('view');
    if (!view) return;
    view.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var data = await api('/community/posts');
      posts = Array.isArray(data) ? data : [];
      // Sort by score desc, then created_at desc
      posts.sort(function(a, b) {
        var sa = (a.upvotes || 0) - (a.downvotes || 0);
        var sb = (b.upvotes || 0) - (b.downvotes || 0);
        if (sb !== sa) return sb - sa;
        return new Date(b.created_at) - new Date(a.created_at);
      });
      renderList();
    } catch (err) {
      if (!view) return;
      view.innerHTML = '<div style="padding:40px 20px;color:var(--text-2);">Failed to load posts: ' + escHtml(err.message) + '</div>';
    }
  }

  function renderList() {
    var view = document.getElementById('view');
    if (!view) return;

    var newPostFormHTML =
      '<div id="new-post-form" style="display:none;margin-bottom:20px;">' +
        '<div class="wv-card" style="padding:20px;display:flex;flex-direction:column;gap:12px;">' +
          '<div style="font-size:15px;font-weight:700;letter-spacing:-0.01em;">New Post</div>' +
          '<div>' +
            '<label class="wv-form-label">Title</label>' +
            '<input id="np-title" type="text" class="wv-input" placeholder="Post title…" style="width:100%;box-sizing:border-box;" maxlength="300">' +
          '</div>' +
          '<div>' +
            '<label class="wv-form-label">Body</label>' +
            formatToolbar('np-body') +
            '<textarea id="np-body" class="wv-input" placeholder="What\'s on your mind?" rows="4" style="width:100%;box-sizing:border-box;resize:vertical;min-height:80px;"></textarea>' +
          '</div>' +
          '<div id="np-error" style="font-size:13px;color:var(--red,#ef4444);display:none;"></div>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
            '<button class="wv-pill" onclick="hideNewPostForm()">Cancel</button>' +
            '<button class="wv-pill brand" onclick="submitNewPost()">Post</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var headerHTML =
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;">' +
        '<div>' +
          '<h1 class="scroll-section-title" style="margin:0 0 4px;font-size:32px;font-weight:800;letter-spacing:-0.035em;">Community</h1>' +
          '<p style="margin:0;font-size:14px;color:var(--text-2);">Share your thoughts with fellow wavernrs</p>' +
        '</div>' +
        (me ? '<button class="wv-pill brand" onclick="showNewPostForm()" style="flex-shrink:0;margin-top:4px;">+ New Post</button>' : '') +
      '</div>';

    var postsHTML;
    if (!posts.length) {
      postsHTML =
        '<div class="empty-state">' +
          '<div class="empty-title">No posts yet</div>' +
          '<div class="empty-desc">Be the first to start a conversation.</div>' +
        '</div>';
    } else {
      postsHTML = '<div style="display:flex;flex-direction:column;gap:10px;">' +
        posts.map(function(p) { return postRowHTML(p); }).join('') +
      '</div>';
    }

    view.innerHTML =
      '<div style="max-width:720px;margin:0 auto;padding:28px 16px 60px;">' +
        headerHTML +
        newPostFormHTML +
        '<div id="posts-list" style="margin-top:20px;">' + postsHTML + '</div>' +
      '</div>';
  }

  function postRowHTML(p) {
    var s = score(p);
    var isOwner = me && me.id === p.user_id;
    var deleteBtn = isOwner
      ? '<button onclick="event.stopPropagation();deletePost(\'' + escHtml(p.id) + '\')" ' +
          'style="font-size:11px;color:var(--text-3);background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;flex-shrink:0;" ' +
          'title="Delete post">Delete</button>'
      : '';
    return (
      '<div class="wv-card" style="padding:14px 16px;cursor:default;" id="post-row-' + escHtml(p.id) + '">' +
        '<div style="display:flex;gap:12px;align-items:flex-start;">' +
          // Vote column
          '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;padding-top:2px;">' +
            '<button onclick="event.stopPropagation();votePost(\'' + escHtml(p.id) + '\',1)" ' +
              'style="background:none;border:none;cursor:pointer;color:var(--text-3);font-size:16px;line-height:1;padding:2px 4px;border-radius:4px;" ' +
              'title="Upvote">&#x25B2;</button>' +
            '<span id="post-score-' + escHtml(p.id) + '" style="font-size:13px;font-weight:700;color:var(--text-2);min-width:20px;text-align:center;">' + s + '</span>' +
            '<button onclick="event.stopPropagation();votePost(\'' + escHtml(p.id) + '\',-1)" ' +
              'style="background:none;border:none;cursor:pointer;color:var(--text-3);font-size:16px;line-height:1;padding:2px 4px;border-radius:4px;" ' +
              'title="Downvote">&#x25BC;</button>' +
          '</div>' +
          // Content column
          '<div style="flex:1;min-width:0;">' +
            '<div onclick="openPost(\'' + escHtml(p.id) + '\')" ' +
              'style="font-size:15px;font-weight:600;color:var(--text);cursor:pointer;letter-spacing:-0.01em;margin-bottom:4px;line-height:1.3;">' +
              escHtml(p.title) +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
              '<span style="font-size:12px;color:var(--text-3);">by @' + escHtml(p.username || 'unknown') + '</span>' +
              '<span style="font-size:12px;color:var(--text-3);">&middot;</span>' +
              '<span style="font-size:12px;color:var(--text-3);">' + (p.comment_count || 0) + ' comment' + ((p.comment_count || 0) !== 1 ? 's' : '') + '</span>' +
              '<span style="font-size:12px;color:var(--text-3);">&middot;</span>' +
              '<span style="font-size:12px;color:var(--text-3);">' + timeAgo(p.created_at) + '</span>' +
              deleteBtn +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function showNewPostForm() {
    var form = document.getElementById('new-post-form');
    if (form) {
      form.style.display = '';
      var inp = document.getElementById('np-title');
      if (inp) setTimeout(function() { inp.focus(); }, 50);
    }
  }

  function hideNewPostForm() {
    var form = document.getElementById('new-post-form');
    if (form) form.style.display = 'none';
    var errEl = document.getElementById('np-error');
    if (errEl) errEl.style.display = 'none';
  }

  async function submitNewPost() {
    var titleEl = document.getElementById('np-title');
    var bodyEl = document.getElementById('np-body');
    var errEl = document.getElementById('np-error');
    var title = titleEl ? titleEl.value.trim() : '';
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!title) {
      if (errEl) { errEl.textContent = 'Title is required.'; errEl.style.display = ''; }
      if (titleEl) titleEl.focus();
      return;
    }
    if (errEl) errEl.style.display = 'none';
    try {
      var newPost = await api('/community/posts', {
        method: 'POST',
        body: JSON.stringify({ title: title, body: body }),
      });
      // Prepend to local array and re-render
      newPost.comment_count = 0;
      posts.unshift(newPost);
      hideNewPostForm();
      var listEl = document.getElementById('posts-list');
      if (listEl) {
        listEl.innerHTML = '<div style="display:flex;flex-direction:column;gap:10px;">' +
          posts.map(function(p) { return postRowHTML(p); }).join('') +
        '</div>';
      }
      if (titleEl) titleEl.value = '';
      if (bodyEl) bodyEl.value = '';
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ''; }
    }
  }

  async function deletePost(id) {
    if (!confirm('Delete this post? This cannot be undone.')) return;
    try {
      await api('/community/posts/' + id, { method: 'DELETE' });
      posts = posts.filter(function(p) { return p.id !== id; });
      if (currentView === 'post' && currentPost && currentPost.id === id) {
        goBackToList();
      } else {
        var listEl = document.getElementById('posts-list');
        if (listEl) {
          if (!posts.length) {
            listEl.innerHTML = '<div class="empty-state"><div class="empty-title">No posts yet</div><div class="empty-desc">Be the first to start a conversation.</div></div>';
          } else {
            listEl.innerHTML = '<div style="display:flex;flex-direction:column;gap:10px;">' +
              posts.map(function(p) { return postRowHTML(p); }).join('') +
            '</div>';
          }
        }
      }
    } catch (err) {
      alert('Could not delete post: ' + err.message);
    }
  }

  async function votePost(id, vote) {
    if (!isLoggedIn()) { navigate('/login.html'); return; }
    // Find post — could be in list or currentPost
    var post = posts.find(function(p) { return p.id === id; });
    if (!post && currentPost && currentPost.id === id) post = currentPost;
    if (!post) return;

    var prevNetVotes = post.net_votes !== undefined ? post.net_votes : (post.upvotes || 0) - (post.downvotes || 0);

    // Optimistic: increment net_votes
    post.net_votes = prevNetVotes + vote;
    _updatePostScoreEl(id, score(post));

    try {
      var result = await api('/community/posts/' + id + '/vote', {
        method: 'POST',
        body: JSON.stringify({ vote: vote }),
      });
      // Sync with server response
      if (result) {
        post.net_votes = result.net_votes !== undefined ? result.net_votes : (result.upvotes - result.downvotes);
        post.upvotes = result.upvotes;
        post.downvotes = result.downvotes;
      }
      _updatePostScoreEl(id, score(post));
    } catch (err) {
      // Revert
      post.net_votes = prevNetVotes;
      _updatePostScoreEl(id, score(post));
      if (err.message && err.message.includes('401')) navigate('/login.html');
    }
  }

  function _updatePostScoreEl(id, s) {
    var el = document.getElementById('post-score-' + id);
    if (el) el.textContent = s;
  }

  function openPost(id) {
    var url = location.pathname + '?post=' + encodeURIComponent(id);
    history.pushState(null, '', url);
    loadPost(id);
  }

  function goBackToList() {
    history.pushState(null, '', location.pathname);
    loadPosts();
  }

  // ── Post view ─────────────────────────────────────────────────────────────
  async function loadPost(id) {
    currentView = 'post';
    var view = document.getElementById('view');
    if (!view) return;
    view.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var data = await api('/community/posts/' + id);
      currentPost = data.post || data;
      currentComments = Array.isArray(data.comments) ? data.comments : [];
      renderPost();
    } catch (err) {
      if (!view) return;
      view.innerHTML =
        '<div style="max-width:720px;margin:0 auto;padding:28px 16px 60px;">' +
          '<button class="wv-pill" onclick="goBackToList()" style="margin-bottom:20px;">&#8592; Community</button>' +
          '<div style="color:var(--text-2);">Failed to load post: ' + escHtml(err.message) + '</div>' +
        '</div>';
    }
  }

  function renderPost() {
    var view = document.getElementById('view');
    if (!view || !currentPost) return;

    var p = currentPost;
    var s = score(p);
    var isOwner = me && me.id === p.user_id;

    var deletePostBtn = isOwner
      ? '<button onclick="deletePost(\'' + escHtml(p.id) + '\')" class="wv-pill" ' +
          'style="font-size:12px;color:var(--red,#ef4444);border-color:var(--red,#ef4444);">Delete Post</button>'
      : '';

    var commentFormHTML = isLoggedIn()
      ? '<div style="margin-bottom:24px;">' +
          '<label class="wv-form-label">Leave a comment</label>' +
          formatToolbar('top-comment-body') +
          '<textarea id="top-comment-body" class="wv-input" rows="3" placeholder="Write something…" ' +
            'style="width:100%;box-sizing:border-box;resize:vertical;min-height:70px;"></textarea>' +
          '<div id="top-comment-error" style="font-size:13px;color:var(--red,#ef4444);display:none;margin-top:4px;"></div>' +
          '<div style="display:flex;justify-content:flex-end;margin-top:8px;">' +
            '<button class="wv-pill brand" onclick="submitTopComment()">Comment</button>' +
          '</div>' +
        '</div>'
      : '<div style="margin-bottom:20px;font-size:13px;color:var(--text-2);">' +
          '<a href="/login.html" style="color:var(--brand,#8b5cf6);">Log in</a> to comment.' +
        '</div>';

    var treeHTML = buildCommentTree();

    view.innerHTML =
      '<div style="max-width:720px;margin:0 auto;padding:28px 16px 60px;">' +
        // Back button
        '<button class="wv-pill" onclick="goBackToList()" style="margin-bottom:20px;">&#8592; Community</button>' +
        // Post card
        '<div class="wv-card" style="padding:20px 22px;margin-bottom:20px;">' +
          '<div style="display:flex;gap:14px;align-items:flex-start;">' +
            // Vote column
            '<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;padding-top:2px;">' +
              '<button onclick="votePost(\'' + escHtml(p.id) + '\',1)" ' +
                'style="background:none;border:none;cursor:pointer;color:var(--text-3);font-size:18px;line-height:1;padding:3px 5px;border-radius:4px;" ' +
                'title="Upvote">&#x25B2;</button>' +
              '<span id="post-score-' + escHtml(p.id) + '" style="font-size:14px;font-weight:700;color:var(--text-2);min-width:24px;text-align:center;">' + s + '</span>' +
              '<button onclick="votePost(\'' + escHtml(p.id) + '\',-1)" ' +
                'style="background:none;border:none;cursor:pointer;color:var(--text-3);font-size:18px;line-height:1;padding:3px 5px;border-radius:4px;" ' +
                'title="Downvote">&#x25BC;</button>' +
            '</div>' +
            // Post content
            '<div style="flex:1;min-width:0;">' +
              '<h2 style="margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-0.02em;line-height:1.3;">' + escHtml(p.title) + '</h2>' +
              (p.body ? '<p style="margin:0 0 12px;font-size:14px;line-height:1.65;color:var(--text-2);">' + renderFormatted(p.body) + '</p>' : '') +
              '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
                '<span style="font-size:12px;color:var(--text-3);">by @' + escHtml(p.username || 'unknown') + '</span>' +
                '<span style="font-size:12px;color:var(--text-3);">&middot;</span>' +
                '<span style="font-size:12px;color:var(--text-3);">' + timeAgo(p.created_at) + '</span>' +
                (deletePostBtn ? '<span style="font-size:12px;color:var(--text-3);">&middot;</span>' + deletePostBtn : '') +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        // Comments section
        '<div>' +
          '<div class="scroll-section-title" style="margin-bottom:16px;font-size:16px;">' +
            'Comments (' + currentComments.length + ')' +
          '</div>' +
          commentFormHTML +
          '<div id="comments-tree">' + treeHTML + '</div>' +
        '</div>' +
      '</div>';
  }

  // ── Comment tree ──────────────────────────────────────────────────────────
  function buildCommentTree() {
    if (!currentComments.length) {
      return '<div class="empty-state" style="padding:24px 0;">' +
        '<div class="empty-title" style="font-size:15px;">No comments yet</div>' +
        '<div class="empty-desc" style="font-size:13px;">Be the first to comment.</div>' +
      '</div>';
    }

    // Build parent-to-children map
    var childrenOf = {};
    var roots = [];
    currentComments.forEach(function(c) {
      var pid = c.parent_id || null;
      if (pid) {
        if (!childrenOf[pid]) childrenOf[pid] = [];
        childrenOf[pid].push(c);
      } else {
        roots.push(c);
      }
    });

    // Sort roots by score desc
    roots.sort(function(a, b) {
      return score(b) - score(a);
    });
    // Sort children by created_at asc
    Object.keys(childrenOf).forEach(function(pid) {
      childrenOf[pid].sort(function(a, b) {
        return new Date(a.created_at) - new Date(b.created_at);
      });
    });

    function renderNode(c, depth) {
      var indentPx = Math.min(depth, 3) * 22;
      var s = score(c);
      var isOwner = me && me.id === c.user_id;
      var children = childrenOf[c.id] || [];

      var deleteBtn = isOwner
        ? '<button onclick="deleteComment(\'' + escHtml(c.id) + '\')" ' +
            'style="font-size:11px;color:var(--text-3);background:none;border:none;cursor:pointer;padding:1px 5px;border-radius:3px;" ' +
            'title="Delete">Delete</button>'
        : '';

      var replyLink = isLoggedIn()
        ? '<button onclick="toggleReplyForm(\'' + escHtml(c.id) + '\')" ' +
            'style="font-size:11px;color:var(--text-3);background:none;border:none;cursor:pointer;padding:1px 5px;border-radius:3px;" ' +
            'id="reply-toggle-' + escHtml(c.id) + '">Reply</button>'
        : '';

      var replyForm =
        '<div id="reply-form-' + escHtml(c.id) + '" style="display:none;margin-top:8px;">' +
          formatToolbar('reply-body-' + c.id) +
          '<textarea id="reply-body-' + escHtml(c.id) + '" class="wv-input" rows="2" ' +
            'placeholder="Reply…" style="width:100%;box-sizing:border-box;resize:vertical;min-height:54px;font-size:13px;"></textarea>' +
          '<div id="reply-error-' + escHtml(c.id) + '" style="font-size:12px;color:var(--red,#ef4444);display:none;margin-top:2px;"></div>' +
          '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:6px;">' +
            '<button class="wv-pill" style="font-size:12px;padding:4px 12px;" ' +
              'onclick="toggleReplyForm(\'' + escHtml(c.id) + '\')">Cancel</button>' +
            '<button class="wv-pill brand" style="font-size:12px;padding:4px 12px;" ' +
              'onclick="submitReply(\'' + escHtml(c.id) + '\')">Reply</button>' +
          '</div>' +
        '</div>';

      var childrenHTML = children.map(function(child) {
        return renderNode(child, depth + 1);
      }).join('');

      return (
        '<div style="margin-left:' + indentPx + 'px;" id="comment-node-' + escHtml(c.id) + '">' +
          '<div style="border-left:2px solid var(--hair,rgba(128,128,128,0.15));padding-left:12px;padding-top:2px;padding-bottom:2px;margin-bottom:8px;">' +
            '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;">' +
              '<span style="font-size:12px;font-weight:600;color:var(--text-2);">@' + escHtml(c.username || 'unknown') + '</span>' +
              '<span style="font-size:11px;color:var(--text-3);">' + timeAgo(c.created_at) + '</span>' +
            '</div>' +
            '<div style="font-size:13.5px;line-height:1.6;color:var(--text);margin-bottom:6px;">' + renderFormatted(c.body) + '</div>' +
            '<div style="display:flex;align-items:center;gap:2px;">' +
              '<button onclick="voteComment(\'' + escHtml(c.id) + '\',1)" ' +
                'style="background:none;border:none;cursor:pointer;color:var(--text-3);font-size:13px;line-height:1;padding:2px 4px;border-radius:3px;" ' +
                'title="Upvote">&#x25B2;</button>' +
              '<span id="comment-score-' + escHtml(c.id) + '" style="font-size:12px;font-weight:600;color:var(--text-3);min-width:18px;text-align:center;">' + s + '</span>' +
              '<button onclick="voteComment(\'' + escHtml(c.id) + '\',-1)" ' +
                'style="background:none;border:none;cursor:pointer;color:var(--text-3);font-size:13px;line-height:1;padding:2px 4px;border-radius:3px;" ' +
                'title="Downvote">&#x25BC;</button>' +
              '<span style="display:inline-block;width:6px;"></span>' +
              replyLink +
              deleteBtn +
            '</div>' +
            replyForm +
          '</div>' +
          childrenHTML +
        '</div>'
      );
    }

    return roots.map(function(c) { return renderNode(c, 0); }).join('');
  }

  function rerenderComments() {
    var treeEl = document.getElementById('comments-tree');
    if (!treeEl) return;
    treeEl.innerHTML = buildCommentTree();
    // Update comment count heading
    var heading = document.querySelector('#view .scroll-section-title');
    if (heading) heading.textContent = 'Comments (' + currentComments.length + ')';
  }

  // ── Top-level comment submit ───────────────────────────────────────────────
  async function submitTopComment() {
    var bodyEl = document.getElementById('top-comment-body');
    var errEl = document.getElementById('top-comment-error');
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!body) {
      if (errEl) { errEl.textContent = 'Comment cannot be empty.'; errEl.style.display = ''; }
      if (bodyEl) bodyEl.focus();
      return;
    }
    if (errEl) errEl.style.display = 'none';
    try {
      var newComment = await api('/community/posts/' + currentPost.id + '/comments', {
        method: 'POST',
        body: JSON.stringify({ body: body }),
      });
      currentComments.push(newComment);
      if (bodyEl) bodyEl.value = '';
      rerenderComments();
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ''; }
    }
  }

  // ── Inline reply form ─────────────────────────────────────────────────────
  function toggleReplyForm(commentId) {
    var form = document.getElementById('reply-form-' + commentId);
    if (!form) return;
    var isHidden = form.style.display === 'none' || form.style.display === '';
    form.style.display = isHidden ? '' : 'none';
    if (isHidden) {
      var ta = document.getElementById('reply-body-' + commentId);
      if (ta) setTimeout(function() { ta.focus(); }, 50);
    }
  }

  async function submitReply(parentId) {
    var bodyEl = document.getElementById('reply-body-' + parentId);
    var errEl = document.getElementById('reply-error-' + parentId);
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!body) {
      if (errEl) { errEl.textContent = 'Reply cannot be empty.'; errEl.style.display = ''; }
      if (bodyEl) bodyEl.focus();
      return;
    }
    if (errEl) errEl.style.display = 'none';
    try {
      var newComment = await api('/community/posts/' + currentPost.id + '/comments', {
        method: 'POST',
        body: JSON.stringify({ body: body, parent_id: parentId }),
      });
      currentComments.push(newComment);
      if (bodyEl) bodyEl.value = '';
      rerenderComments();
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ''; }
    }
  }

  // ── Comment voting ────────────────────────────────────────────────────────
  async function voteComment(id, vote) {
    if (!isLoggedIn()) { navigate('/login.html'); return; }
    var comment = currentComments.find(function(c) { return c.id === id; });
    if (!comment) return;

    var prevNetVotes = comment.net_votes !== undefined ? comment.net_votes : (comment.upvotes || 0) - (comment.downvotes || 0);

    // Optimistic
    comment.net_votes = prevNetVotes + vote;
    var scoreEl = document.getElementById('comment-score-' + id);
    if (scoreEl) scoreEl.textContent = score(comment);

    try {
      var result = await api('/community/comments/' + id + '/vote', {
        method: 'POST',
        body: JSON.stringify({ vote: vote }),
      });
      if (result) {
        comment.net_votes = result.net_votes !== undefined ? result.net_votes : (result.upvotes - result.downvotes);
        comment.upvotes = result.upvotes;
        comment.downvotes = result.downvotes;
      }
      if (scoreEl) scoreEl.textContent = score(comment);
    } catch (err) {
      comment.net_votes = prevNetVotes;
      if (scoreEl) scoreEl.textContent = score(comment);
      if (err.message && err.message.includes('401')) navigate('/login.html');
    }
  }

  // ── Comment delete ────────────────────────────────────────────────────────
  async function deleteComment(id) {
    if (!confirm('Delete this comment?')) return;
    try {
      await api('/community/comments/' + id, { method: 'DELETE' });
      currentComments = currentComments.filter(function(c) { return c.id !== id; });
      rerenderComments();
    } catch (err) {
      alert('Could not delete comment: ' + err.message);
    }
  }
</script>
</body>
</html>
