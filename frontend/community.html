<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — community</title>
  <link rel="stylesheet" href="/css/style.css?v=dcfb38c6c547">
  <script src="/js/status-card.js?v=dcfb38c6c547"></script>
  <script src="/js/down.js?v=dcfb38c6c547"></script>
  <style id="cm-page-style">
    .cm-wrap { container-type: inline-size; max-width: 1180px; margin: 0 auto; padding: 14px 0 88px; }
    .cm-wrap *, .cm-wrap *::before, .cm-wrap *::after { box-sizing: border-box; }
    .cm-wrap [hidden] { display: none !important; }
    .cm-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
    .cm-main { min-width: 0; }
    .cm-rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .cm-rail .cm-online-card { display: none; }
    @container (min-width: 840px) {
      .cm-grid { grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; }
      .cm-rail .cm-online-card { display: block; }
      .cm-head-online { display: none !important; }
    }
    @container (min-width: 1040px) {
      .cm-grid { grid-template-columns: minmax(0, 1fr) 312px; gap: 28px; }
    }

    .cm-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 4px 0 22px; }
    .cm-title { margin: 0; font-size: clamp(30px, 4.4vw, 44px); font-weight: 900; letter-spacing: -0.04em; line-height: 1.02; color: var(--text); }
    .cm-sub { margin: 8px 0 0; font-size: 14px; color: var(--text-2); line-height: 1.45; }
    .cm-head-stats { display: flex; gap: 14px; margin-top: 12px; font-size: 12.5px; color: var(--text-3); flex-wrap: wrap; }
    .cm-head-stats b { color: var(--text); font-weight: 700; }
    .cm-head-online { display: flex; align-items: center; gap: 10px; min-height: 30px; }
    .cm-head-online:empty { display: none; }
    .cm-live { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
    .cm-live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent); animation: cm-pulse 2.2s var(--ease) infinite; flex-shrink: 0; }
    @keyframes cm-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    .cm-faces { display: flex; align-items: center; padding-left: 6px; }
    .cm-faces .wv-face { margin-left: -6px; border-color: var(--page-bg-base); }
    .cm-faces .wv-face:first-child { margin-left: 0; }
    .cm-wrap .wv-face img { position: absolute; inset: 0; }

    .cm-composer { background: var(--surface); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--hair); transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease); }
    .cm-composer.is-open { border-color: var(--hair-strong); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
    .cm-composer-bar { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 12px 12px 14px; background: none; border: 0; cursor: text; font-family: inherit; text-align: left; color: var(--text-3); border-radius: 12px; min-height: 60px; }
    .cm-composer-bar:hover .cm-fake-input { background: var(--surface-3); }
    .cm-fake-input { flex: 1; min-width: 0; background: var(--surface-2); border-radius: var(--r-pill); padding: 10px 16px; font-size: 14px; color: var(--text-3); transition: background 120ms var(--ease); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cm-fake-input b { color: var(--text-2); font-weight: 600; }
    .cm-composer-body { padding: 16px 16px 14px; }
    .cm-composer-who { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--text-3); }
    .cm-composer-who strong { color: var(--text); font-weight: 700; }
    .cm-field { width: 100%; background: transparent; border: 0; outline: none; color: var(--text); font-family: inherit; }
    .cm-title-input { font-size: 19px; font-weight: 750; letter-spacing: -0.02em; padding: 6px 0 10px; border-bottom: 1px solid var(--hair); }
    .cm-title-input::placeholder, .cm-textarea::placeholder { color: var(--text-3); font-weight: 500; }
    .cm-editor-tools { display: flex; align-items: center; gap: 4px; margin: 10px 0 6px; flex-wrap: wrap; }
    .cm-tab { font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-3); background: none; border: 0; padding: 7px 10px; border-radius: var(--r-pill); cursor: pointer; min-height: 32px; }
    .cm-tab:hover { color: var(--text); }
    .cm-tab.on { color: var(--text); background: var(--surface-2); }
    .cm-fmt { margin-left: auto; display: flex; gap: 2px; }
    .cm-fmt button { width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--text-2); font-family: inherit; font-size: 13.5px; cursor: pointer; display: grid; place-items: center; }
    .cm-fmt button:hover { background: var(--surface-2); color: var(--text); }
    .cm-textarea { width: 100%; min-height: 120px; max-height: 60vh; resize: vertical; background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.6; padding: 12px 14px; outline: none; transition: border-color 120ms var(--ease), background 120ms var(--ease); }
    .cm-textarea:focus { border-color: var(--hair-strong); background: var(--surface-3); }
    .cm-preview { min-height: 120px; background: var(--surface-2); border-radius: 10px; padding: 14px 16px; }
    .cm-preview-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; color: var(--text); overflow-wrap: anywhere; }
    .cm-preview-empty { color: var(--text-3); font-size: 13.5px; }
    .cm-composer-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .cm-meta-line { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
    .cm-count.warn { color: var(--orange); }
    .cm-count.over { color: var(--red); font-weight: 700; }
    .cm-saved { display: inline-flex; align-items: center; gap: 4px; opacity: 0; transition: opacity 200ms var(--ease); }
    .cm-saved.show { opacity: 1; }
    .cm-kbd { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--hair); }
    .cm-foot-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .cm-btn { font-family: inherit; font-size: 13px; font-weight: 700; border-radius: var(--r-pill); border: 0; cursor: pointer; padding: 0 18px; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: filter 120ms var(--ease), transform 90ms var(--ease), background 120ms var(--ease); white-space: nowrap; text-decoration: none; }
    .cm-btn:active { transform: scale(.97); }
    .cm-btn-primary { background: var(--brand); color: var(--on-brand); }
    .cm-btn-primary:hover { filter: brightness(1.08); }
    .cm-btn-primary[disabled] { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
    .cm-btn-quiet { background: transparent; color: var(--text-2); }
    .cm-btn-quiet:hover { color: var(--text); background: var(--surface-2); }
    .cm-btn-outline { background: transparent; color: var(--text); border: 1px solid var(--hair-strong); }
    .cm-btn-outline:hover { border-color: var(--text); }
    .cm-btn-danger { background: var(--red); color: #fff; }
    .cm-err { font-size: 12.5px; color: var(--red); margin-top: 8px; }
    .cm-err:empty { display: none; }

    .cm-join { display: flex; align-items: center; gap: 16px; padding: 18px 18px; background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .cm-join-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-bg); color: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
    .cm-join-t { font-size: 15px; font-weight: 750; color: var(--text); letter-spacing: -0.01em; }
    .cm-join-d { font-size: 13px; color: var(--text-2); margin-top: 2px; }
    .cm-join-actions { margin-left: auto; display: flex; gap: 8px; }

    .cm-toolbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; flex-wrap: wrap; }
    .cm-seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-pill); padding: 3px; flex-shrink: 0; }
    .cm-seg button { font-family: inherit; font-size: 12.5px; font-weight: 700; border: 0; cursor: pointer; padding: 0 14px; min-height: 34px; border-radius: var(--r-pill); background: transparent; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; transition: background 140ms var(--ease), color 140ms var(--ease); }
    .cm-seg button:hover { color: var(--text); }
    .cm-seg button.on { background: var(--text); color: var(--page-bg-base); }
    .cm-seg button svg { opacity: .9; }
    .cm-search { position: relative; flex: 1 1 200px; max-width: 320px; margin-left: auto; }
    .cm-search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
    .cm-search input { width: 100%; height: 40px; border-radius: var(--r-pill); border: 1px solid transparent; background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 13.5px; padding: 0 38px 0 36px; outline: none; transition: border-color 120ms var(--ease), background 120ms var(--ease); }
    .cm-search input:hover { background: var(--surface-3); }
    .cm-search input:focus { border-color: var(--hair-strong); background: var(--surface-3); }
    .cm-search input::placeholder { color: var(--text-3); }
    .cm-search input::-webkit-search-cancel-button { display: none; }
    .cm-search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: 0; background: none; color: var(--text-3); cursor: pointer; display: none; place-items: center; }
    .cm-search-clear:hover { color: var(--text); background: var(--surface-2); }
    .cm-search.has-q .cm-search-clear { display: grid; }
    .cm-search-kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .cm-search.has-q .cm-search-kbd, .cm-search input:focus ~ .cm-search-kbd { display: none; }
    @media (max-width: 640px) { .cm-search { max-width: none; flex-basis: 100%; margin-left: 0; order: 2; } .cm-search-kbd { display: none; } }
    .cm-search-note { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--text-3); margin: -4px 0 12px; flex-wrap: wrap; }
    .cm-search-note b { color: var(--text); }
    .cm-link-btn { background: none; border: 0; padding: 6px 4px; font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--brand); cursor: pointer; }
    .cm-link-btn:hover { text-decoration: underline; }

    .cm-list { display: flex; flex-direction: column; gap: 10px; }
    .cm-post { position: relative; background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px 10px; cursor: pointer; transition: border-color 140ms var(--ease), background 140ms var(--ease), transform 140ms var(--ease); outline: none; }
    .cm-post:hover { border-color: var(--hair-strong); background: color-mix(in srgb, var(--surface) 88%, var(--surface-2)); }
    .cm-post:focus-visible { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }
    .cm-post.is-fresh { animation: cm-fresh 2.4s var(--ease); }
    @keyframes cm-fresh { 0%, 30% { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .cm-post-meta { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--text-3); }
    .cm-post-meta .cm-name { font-weight: 700; color: var(--text); text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .cm-post-meta a.cm-name:hover, .cm-c-head a.cm-name:hover { text-decoration: underline; }
    .cm-sep { color: var(--text-4, var(--text-3)); }
    .cm-time { white-space: nowrap; }
    .cm-pill-new { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--on-brand); background: var(--brand); padding: 2px 7px; border-radius: var(--r-pill); line-height: 1.4; flex-shrink: 0; }
    .cm-hot { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--orange); background: color-mix(in srgb, var(--orange) 14%, transparent); padding: 2px 8px 2px 6px; border-radius: var(--r-pill); line-height: 1.4; flex-shrink: 0; }
    .cm-post-title { margin: 8px 0 0; font-size: 16.5px; font-weight: 750; letter-spacing: -0.018em; line-height: 1.32; color: var(--text); overflow-wrap: anywhere; }
    .cm-post-body { margin: 5px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; white-space: pre-line; }
    .cm-post mark, .cm-rail mark { background: color-mix(in srgb, var(--brand) 26%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
    .cm-unfurl { margin-top: 10px; min-height: 1px; }
    .cm-c-body + .cm-unfurl { margin-top: 8px; }
    .cm-mini { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 10px; background: var(--surface-2); color: var(--text); text-decoration: none; max-width: 440px; border: 1px solid transparent; transition: background 120ms var(--ease), border-color 120ms var(--ease); }
    .cm-mini:hover { background: var(--surface-3); border-color: var(--hair); }
    .cm-mini-art { width: 44px; height: 44px; border-radius: 6px; overflow: hidden; flex-shrink: 0; position: relative; display: grid; place-items: center; color: rgba(255,255,255,.9); }
    .cm-mini-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cm-mini-t { font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cm-mini-s { font-size: 12px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cm-mini-go { margin-left: auto; color: var(--text-3); flex-shrink: 0; }
    .cm-mini.is-plain { padding: 8px 12px; }
    .cm-mini-skel { height: 60px; max-width: 440px; border-radius: 10px; }

    .cm-actions { display: flex; align-items: center; gap: 4px; margin: 10px -6px 0; flex-wrap: wrap; }
    .cm-vote { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: var(--r-pill); padding: 0 2px; transition: background 140ms var(--ease); }
    .cm-vote.is-up { background: var(--brand-bg); }
    .cm-vote.is-down { background: color-mix(in srgb, var(--blue) 14%, transparent); }
    .cm-vote-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: none; color: var(--text-2); cursor: pointer; display: grid; place-items: center; transition: color 120ms var(--ease), background 120ms var(--ease), transform 120ms var(--ease); }
    .cm-vote-btn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
    .cm-vote-btn.up:hover { color: var(--brand); }
    .cm-vote-btn.down:hover { color: var(--blue); }
    .cm-vote-btn.on.up { color: var(--brand); }
    .cm-vote-btn.on.down { color: var(--blue); }
    .cm-vote-btn.on path { fill: currentColor; }
    .cm-vote-btn:active { transform: scale(.88); }
    .cm-score { min-width: 18px; text-align: center; font-size: 13px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; display: inline-block; }
    .cm-vote.is-up .cm-score { color: var(--brand); }
    .cm-vote.is-down .cm-score { color: var(--blue); }
    .cm-score.bump-up { animation: cm-bump-up 420ms var(--ease); }
    .cm-score.bump-down { animation: cm-bump-down 420ms var(--ease); }
    @keyframes cm-bump-up { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-5px) scale(1.3); } 100% { transform: translateY(0) scale(1); } }
    @keyframes cm-bump-down { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(5px) scale(1.3); } 100% { transform: translateY(0) scale(1); } }
    .cm-act { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: var(--r-pill); border: 0; background: none; color: var(--text-2); font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background 120ms var(--ease), color 120ms var(--ease); white-space: nowrap; text-decoration: none; }
    .cm-act:hover { background: var(--surface-2); color: var(--text); }
    .cm-act.danger:hover { color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); }
    .cm-act.done { color: var(--green); }
    .cm-act-new { font-size: 10.5px; font-weight: 800; color: var(--brand); background: var(--brand-bg); padding: 1px 7px; border-radius: var(--r-pill); }
    .cm-spacer { flex: 1; }
    @media (max-width: 640px) { .cm-textarea, .cm-search input { font-size: 16px; } }
    @media (hover: none) { .cm-kbd-hint { display: none !important; } }
    @media (max-width: 480px) { .cm-act .cm-act-label { display: none; } .cm-act { padding: 0 10px; } .cm-post { padding: 13px 14px 9px; } }

    .cm-more { display: flex; justify-content: center; margin: 18px 0 4px; }
    .cm-end { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 26px 0 4px; color: var(--text-3); font-size: 12.5px; }
    .cm-end::before, .cm-end::after { content: ''; height: 1px; flex: 1; max-width: 120px; background: var(--hair); }
    .cm-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: cm-spin .7s linear infinite; display: inline-block; }
    @keyframes cm-spin { to { transform: rotate(360deg); } }

    .cm-state { text-align: center; padding: 56px 20px; background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; }
    .cm-state-ic { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
    .cm-state-t { font-size: 16px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
    .cm-state-d { font-size: 13.5px; color: var(--text-2); margin: 6px auto 18px; max-width: 360px; line-height: 1.5; }

    .cm-card { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 16px; }
    .cm-card-h { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 800; color: var(--text); letter-spacing: -0.005em; margin: 0 0 12px; }
    .cm-card-h svg { color: var(--text-3); flex-shrink: 0; }
    .cm-card-h .cm-card-aside { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--text-3); }
    .cm-card-note { font-size: 12.5px; color: var(--text-3); line-height: 1.5; }
    .cm-online-faces { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .cm-online-faces .wv-face { margin-left: 0; border: 0; }
    .cm-online-more { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); color: var(--text-2); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
    .cm-row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; color: var(--text); text-decoration: none; min-width: 0; min-height: 44px; }
    a.cm-row:hover, .cm-row.is-link:hover { background: var(--surface-2); cursor: pointer; }
    .cm-row-rank { width: 16px; text-align: center; font-size: 12px; font-weight: 800; color: var(--text-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .cm-row-main { min-width: 0; flex: 1; }
    .cm-row-t { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .cm-row-s { font-size: 11.5px; color: var(--text-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cm-award-art { width: 42px; height: 42px; border-radius: 6px; overflow: hidden; position: relative; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-weight: 800; }
    .cm-award-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cm-award-chip { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; color: var(--brand); text-transform: uppercase; }
    .cm-rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: cmr; }
    .cm-rules li { counter-increment: cmr; display: flex; gap: 10px; font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
    .cm-rules li::before { content: counter(cmr); width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); color: var(--text-2); font-size: 10.5px; font-weight: 800; display: grid; place-items: center; flex-shrink: 0; margin-top: 0; }
    .cm-rules b { color: var(--text); }
    .cm-fmt-tip { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--text-3); line-height: 1.8; }
    .cm-fmt-tip code { font-family: var(--font-mono); font-size: 11px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--text-2); }

  function readVisits() { try { return JSON.parse(localStorage.getItem('wv_comm_visits') || '{}') || {}; } catch (_) { return {}; } }
  function writeVisit(id, n) {
    try {
      var v = readVisits();
      v[id] = { n: n, t: new Date().toISOString() };
      var keys = Object.keys(v);
      if (keys.length > 300) keys.sort(function (a, b) { return (v[a].t < v[b].t) ? -1 : 1; }).slice(0, keys.length - 300).forEach(function (k) { delete v[k]; });
      localStorage.setItem('wv_comm_visits', JSON.stringify(v));
    } catch (_) {}
  }
  function markListSeen() { try { localStorage.setItem('wv_comm_seen_at', new Date().toISOString()); } catch (_) {} }

  function isNew(p) {
    if (!_prevSeen || !p || !p.created_at) return false;
    if (me && p.user_id === me.id) return false;
    return Date.parse(p.created_at) > _prevSeen;
  }
  function isHot(p) {
    var ageDays = (Date.now() - Date.parse(p.created_at)) / 864e5;
    var e = netScore(p) + 2 * (p.comment_count || 0);
    return (e >= 5 && ageDays <= 21) || (e >= 12 && ageDays <= 60);
  }

  function firstSiteLink(text) {
    var m = String(text || '').match(/https?:\/\/(www\.)?wavernrs\.com\/[^\s<)]+/);
    return m ? m[0].replace(/[.,!?]+$/, '') : null;
  }
  function shortUrl(u) {
    var s = String(u).replace(/^https?:\/\/(www\.)?/, '');
    return s.length > 42 ? s.slice(0, 40) + '…' : s;
  }

  function resolveLink(url) {
    if (CM.links[url]) return CM.links[url];
    var p = (async function () {
      var u; try { u = new URL(url); } catch (_) { return null; }
      var q = u.searchParams, path = u.pathname.replace(/\.html$/, ''), c = null;
      try {
        if (path === '/album' && q.get('id')) { var a = await api('/albums/' + encodeURIComponent(q.get('id'))); a = a.album || a; if (a && a.title) c = { t: a.title, s: 'comp · ' + ((a.artists && a.artists.display_name) || a.archive_artist_name || ''), img: a.cover_url, href: '/album?id=' + encodeURIComponent(a.id) }; }
        else if (path === '/track' && q.get('id')) { var t = await api('/tracks/' + encodeURIComponent(q.get('id'))); if (t && t.title) c = { t: t.title, s: 'edit · ' + ((t.artists && t.artists.display_name) || ''), img: t.cover_url || (t.albums && t.albums.cover_url), href: '/track?id=' + encodeURIComponent(t.id) }; }
        else if (path === '/resources' && q.get('view') === 'song' && q.get('t')) { var sg = await api('/ye/song?t=' + encodeURIComponent(q.get('t'))); var r = sg.released && sg.released[0]; c = { t: sg.title, s: 'ye song · ' + (r ? r.album + ' ' + r.year : (sg.tracker || []).length + ' versions on the tracker'), img: r ? r.cover : ((sg.tracker || []).find(function (x) { return x.art; }) || {}).art, href: '/resources?view=song&t=' + encodeURIComponent(sg.title) }; }
        else if (path === '/resources' && q.get('view') === 'disco' && q.get('album')) { var al = (await api('/ye/disco/' + encodeURIComponent(q.get('album')))).album; c = { t: al.title, s: 'ye album · ' + al.year, img: al.cover_sm, href: '/resources?view=disco&album=' + encodeURIComponent(al.slug) }; }
        else if (path === '/resources' && q.get('view') === 'tweets' && q.get('tweet')) { var tw = (await api('/ye/tweets/' + encodeURIComponent(q.get('tweet')))).tweet; c = { t: String(tw.text || '').replace(/\s*https?:\/\/\S+/g, '').slice(0, 120), s: 'ye tweet · ' + new Date(tw.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }), img: null, href: '/resources?view=tweets&tweet=' + encodeURIComponent(tw.id) }; }
      } catch (e) { if (e && e.navAborted) { delete CM.links[url]; } c = null; }
      return c;
    })();
    CM.links[url] = p;
    return p;
  }

  function observeUnfurls() {
    if (_unfurlObs) { try { _unfurlObs.disconnect(); } catch (_) {} _unfurlObs = null; }
    var slots = document.querySelectorAll('.cm-unfurl[data-url]:not([data-done])');
    if (!slots.length) return;
    var fill = function (el) {
      if (el.hasAttribute('data-done')) return;
      el.setAttribute('data-done', '1');
      var url = el.getAttribute('data-url');
      el.innerHTML = '<div class="wv-skel cm-mini-skel"></div>';
      resolveLink(url).then(function (c) {
        if (!el.isConnected) return;
        if (!c && !el.hasAttribute('data-fallback')) { el.remove(); return; }
        el.innerHTML = miniCardHTML(c, url);
      });
    };
    if (!('IntersectionObserver' in window)) { slots.forEach(fill); return; }
    _unfurlObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { _unfurlObs && _unfurlObs.unobserve(en.target); fill(en.target); } });
    }, { rootMargin: '240px 0px' });
    slots.forEach(function (el) { _unfurlObs.observe(el); });
  }
  window._pageCleanup.push(function () { if (_unfurlObs) { try { _unfurlObs.disconnect(); } catch (_) {} _unfurlObs = null; } });

  function _sortedPosts() {
    var now = Date.now();
    var weekMs = 7 * 24 * 60 * 60 * 1000;
    var out;
    if (_sort === 'latest') {
      out = posts.slice().sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    } else if (_sort === 'top') {
      out = posts.slice().sort(function (a, b) {
        var diff = netScore(b) - netScore(a);
        return diff !== 0 ? diff : new Date(b.created_at) - new Date(a.created_at);
      });
    } else {
      out = posts.slice().sort(function (a, b) {
        var aRecent = (now - new Date(a.created_at)) < weekMs ? 1 : 0;
        var bRecent = (now - new Date(b.created_at)) < weekMs ? 1 : 0;
        if (aRecent !== bRecent) return bRecent - aRecent;
        var aScore = netScore(a) + (a.comment_count || 0) * 0.5;
        var bScore = netScore(b) + (b.comment_count || 0) * 0.5;
        var diff = bScore - aScore;
        return diff !== 0 ? diff : new Date(b.created_at) - new Date(a.created_at);
      });
    }
    var pinned = out.filter(function (p) { return CM.mine[p.id]; });
    if (!pinned.length) return out;
    return pinned.concat(out.filter(function (p) { return !CM.mine[p.id]; }));
  }

  function _filteredPosts() {
    var list = _sortedPosts();
    var q = _q.trim().toLowerCase();
    if (!q) return list;
    var terms = q.split(/\s+/);
    return list.filter(function (p) {
      var hay = (p.title + ' ' + (p.body || '') + ' ' + (p.username || '')).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    });
  }

  async function loadPosts(force) {
    currentView = 'list';
    currentPost = null;
    var view = document.getElementById('view');
    if (!view) return;
    var fresh = CM.posts && (Date.now() - CM.at < 120000);
    if (CM.posts && !force) {
      posts = CM.posts;
      renderList();
      var y = CM.listScroll || 0;
      var back = CM.restore || (Date.now() - (window._wvCommPopAt || 0) < 4000);
      CM.restore = false;
      if (y && back) requestAnimationFrame(function () { setTimeout(function () { var s = scroller(); if (s) s.scrollTop = y; }, 0); });
      if (fresh) { loadSide(); return; }
    } else {
      renderSkeleton();
    }
    loadSide();
    try {
      var data = await api('/community/posts?limit=' + PAGE_SIZE);
      var list = Array.isArray(data) ? data : [];
      var keep = (CM.posts || []).filter(function (p) { return CM.mine[p.id] && !list.some(function (x) { return x.id === p.id; }); });
      posts = keep.concat(list);
      CM.posts = posts;
      CM.hasMore = list.length === PAGE_SIZE;
      CM.at = Date.now();
      if (currentView !== 'list') return;
      if (document.getElementById('posts-list')) { renderFeed(); renderRail(); }
      else renderList();
    } catch (err) {
      if (err && err.navAborted) return;
      if (currentView !== 'list') return;

      var v = document.getElementById('view');

        '<button class="cm-btn cm-btn-primary" onclick="loadPosts(true)">Try again</button></div></div>';
    }
  }

  function openComposer() {
    if (!me) { navigate('/login'); return; }
    var bar = document.getElementById('cm-composer-bar');
    var body = document.getElementById('cm-composer-body');
    var box = document.getElementById('cm-composer');
    if (!bar || !body) {
      var s = scroller(); if (s) s.scrollTop = 0;
      return;
    }
    bar.hidden = true; bar.setAttribute('aria-expanded', 'true');
    body.hidden = false; box.classList.add('is-open');
    var d = readDraft();
    var t = document.getElementById('np-title'), b = document.getElementById('np-body');
    if (d && t && b && !t.value && !b.value) { t.value = d.title || ''; b.value = d.body || ''; }
    composerInput(true);
    setTimeout(function () { if (t) t.focus(); }, 30);
  }

  function closeComposer() {
    var bar = document.getElementById('cm-composer-bar');
    var body = document.getElementById('cm-composer-body');
    var box = document.getElementById('cm-composer');
    if (!bar || !body) return;
    saveDraftNow();
    body.hidden = true; bar.hidden = false; bar.setAttribute('aria-expanded', 'false');
    box.classList.remove('is-open');
    var fake = bar.querySelector('.cm-fake-input');
    var d = readDraft();
    if (fake) fake.innerHTML = hasDraft() ? '<b>continue your draft</b>' + (d.title && d.title.trim() ? ' · ' + esc(d.title.trim()) : '') : 'Start a post…';
    var err = document.getElementById('np-error'); if (err) err.textContent = '';
    setComposerTab('write');
    bar.focus();
  }

  var _draftTimer = null;
  function saveDraftNow() {
    var t = document.getElementById('np-title'), b = document.getElementById('np-body');
    if (!t || !b) return false;
    try {
      if (!t.value.trim() && !b.value.trim()) { localStorage.removeItem('wv_comm_draft'); return false; }
      localStorage.setItem('wv_comm_draft', JSON.stringify({ title: t.value, body: b.value, at: Date.now() }));
      return true;
    } catch (_) { return false; }
  }

  function setCount(el, n, max) {
    if (!el) return;
    el.textContent = n.toLocaleString() + '/' + max.toLocaleString();
    el.classList.toggle('warn', n >= max * 0.9 && n <= max);
    el.classList.toggle('over', n > max);
  }

  function composerInput(noSave) {
    var t = document.getElementById('np-title'), b = document.getElementById('np-body');
    if (!t || !b) return;
    setCount(document.getElementById('np-title-count'), t.value.length, 200);
    setCount(document.getElementById('np-body-count'), b.value.length, 10000);
    var btn = document.getElementById('np-submit');
    if (btn) btn.disabled = !t.value.trim() || t.value.length > 200 || b.value.length > 10000;
    autosize(b);
    var prev = document.getElementById('np-preview');
    if (prev && !prev.hidden) renderPreview();
    if (noSave === true) return;
    clearTimeout(_draftTimer);
    _draftTimer = setTimeout(function () {
      var ok = saveDraftNow();
      var s = document.getElementById('np-saved');
      if (s && ok) { s.classList.add('show'); clearTimeout(s._t); s._t = setTimeout(function () { s.classList.remove('show'); }, 1600); }
    }, 450);
  }

  function autosize(ta) {
    if (!ta || ta.offsetParent === null) return;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, Math.round(window.innerHeight * 0.6)) + 'px';
  }

  function renderPreview() {
    var t = document.getElementById('np-title'), b = document.getElementById('np-body'), prev = document.getElementById('np-preview');
    if (!prev) return;
    var title = t ? t.value.trim() : '', body = b ? b.value : '';
    prev.innerHTML = (title || body.trim())
      ? (title ? '<div class="cm-preview-title">' + esc(title) + '</div>' : '') + '<div class="cm-md" style="color:var(--text-2);">' + renderMd(body) + '</div>'
      : '<div class="cm-preview-empty">nothing to preview yet</div>';
  }

  function setComposerTab(tab) {
    var b = document.getElementById('np-body'), prev = document.getElementById('np-preview');
    var tw = document.getElementById('np-tab-write'), tp = document.getElementById('np-tab-preview');
    if (!b || !prev) return;
    var isPrev = tab === 'preview';
    if (isPrev) { prev.style.minHeight = Math.max(120, b.offsetHeight) + 'px'; renderPreview(); }
    b.hidden = isPrev; prev.hidden = !isPrev;
    if (tw) { tw.classList.toggle('on', !isPrev); tw.setAttribute('aria-pressed', String(!isPrev)); }
    if (tp) { tp.classList.toggle('on', isPrev); tp.setAttribute('aria-pressed', String(isPrev)); }
    if (!isPrev) { autosize(b); b.focus(); }
  }

  function wrapFormat(tid, pre, suf) {
    var ta = document.getElementById(tid);
    if (!ta) return;
    if (tid === 'np-body' && ta.hidden) setComposerTab('write');
    var s = ta.selectionStart, e = ta.selectionEnd;
    var word = ta.value.substring(s, e) || 'text';
    ta.value = ta.value.substring(0, s) + pre + word + suf + ta.value.substring(e);
    ta.focus();
    ta.setSelectionRange(s + pre.length, s + pre.length + word.length);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }

  async function submitNewPost() {
    var titleEl = document.getElementById('np-title');
    var bodyEl = document.getElementById('np-body');
    var errEl = document.getElementById('np-error');
    var btn = document.getElementById('np-submit');
    var title = titleEl ? titleEl.value.trim() : '';
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!title) {
      if (errEl) errEl.textContent = 'you need a title';
      if (titleEl) titleEl.focus();
      return;
    }
    if (btn && btn.getAttribute('data-busy')) return;
    if (errEl) errEl.textContent = '';
    if (btn) { btn.setAttribute('data-busy', '1'); btn.disabled = true; btn.innerHTML = '<span class="cm-spin"></span>Posting'; }
    try {
      var newPost = await api('/community/posts', { method: 'POST', body: JSON.stringify({ title: title, body: body }) });
      newPost.comment_count = 0;
      newPost.net_votes = newPost.net_votes || 0;
      newPost.user_vote = newPost.user_vote || 0;
      if (!newPost.username && me) newPost.username = me.username;
      if (!newPost.profile_image_url && CM.me) newPost.profile_image_url = CM.me.avatar;
      if (!newPost.artist_id && CM.me) newPost.artist_id = CM.me.artist_id;
      CM.mine[newPost.id] = 1;
      posts.unshift(newPost);
      CM.posts = posts;
      try { localStorage.removeItem('wv_comm_draft'); } catch (_) {}
      if (titleEl) titleEl.value = '';
      if (bodyEl) bodyEl.value = '';
      closeComposer();
      if (_q) { _q = ''; var si = document.getElementById('cm-search-input'); if (si) si.value = ''; var sb = document.getElementById('cm-search'); if (sb) sb.classList.remove('has-q'); }
      renderFeed();
      renderRail();
      var card = document.getElementById('post-row-' + sid(newPost.id));
      if (card) { card.classList.add('is-fresh'); card.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' }); }
      toast('posted');
    } catch (err) {
      if (errEl) errEl.textContent = (err && err.message) || 'couldnt post that';
    } finally {
      if (btn) { btn.removeAttribute('data-busy'); btn.innerHTML = 'Post'; composerInput(true); }
    }
  }

  var _searchTimer = null;
  function onSearchInput(v) {
    _q = String(v || '');
    var box = document.getElementById('cm-search');
    if (box) box.classList.toggle('has-q', !!_q);
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(renderFeed, 110);
  }
  function clearSearch() {
    _q = '';
    var inp = document.getElementById('cm-search-input');
    if (inp) { inp.value = ''; inp.focus(); }
    var box = document.getElementById('cm-search');
    if (box) box.classList.remove('has-q');
    renderFeed();
  }
  async function searchServer() {
    var q = _q.trim();
    if (!q || !CM.hasMore) return;
    var note = document.getElementById('cm-search-note');
    if (note) note.innerHTML = '<div class="cm-search-note"><span><span class="cm-spin" style="vertical-align:-2px;margin-right:8px;"></span>searching older posts…</span></div>';
    try {
      var rows = await api('/community/posts?limit=100&q=' + encodeURIComponent(q));
      var seen = {}; posts.forEach(function (p) { seen[p.id] = 1; });
      (Array.isArray(rows) ? rows : []).forEach(function (p) { if (!seen[p.id]) { posts.push(p); seen[p.id] = 1; } });
      CM.posts = posts;
    } catch (_) {}
    renderFeed();
  }

  async function loadMore() {
    if (_loadingMore || !CM.hasMore || !posts.length) return;
    _loadingMore = true;
    var btn = document.getElementById('cm-more-btn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="cm-spin"></span>Loading'; }
    var oldest = posts.reduce(function (m, p) { return !m || Date.parse(p.created_at) < Date.parse(m.created_at) ? p : m; }, null);
    try {
      var rows = await api('/community/posts?limit=' + PAGE_SIZE + '&before=' + encodeURIComponent(oldest.created_at));
      rows = Array.isArray(rows) ? rows : [];
      var seen = {}; posts.forEach(function (p) { seen[p.id] = 1; });
      var fresh = rows.filter(function (p) { return !seen[p.id]; });
      posts = posts.concat(fresh);
      CM.posts = posts;
      CM.hasMore = fresh.length > 0 && rows.length === PAGE_SIZE;
    } catch (err) {
      if (err && err.navAborted) return;
      toast('couldnt load more posts', 'error');
    }
    _loadingMore = false;
    renderFeed();
    renderRail();
  }

  function setSort(sort) {
    _sort = sort;
    CM.sort = sort;
    document.querySelectorAll('.cm-seg [data-sort]').forEach(function (btn) {
      var on = btn.getAttribute('data-sort') === sort;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-selected', String(on));
    });
    renderFeed();
  }

  function _paintVote(kind, id, v) {
    var up = document.getElementById(kind + '-up-' + id);
    var down = document.getElementById(kind + '-down-' + id);
    var wrap = document.getElementById(kind + '-vote-' + id);
    if (up) { up.classList.toggle('on', v === 1); up.setAttribute('aria-pressed', String(v === 1)); }
    if (down) { down.classList.toggle('on', v === -1); down.setAttribute('aria-pressed', String(v === -1)); }
    if (wrap) { wrap.classList.toggle('is-up', v === 1); wrap.classList.toggle('is-down', v === -1); }
  }

  function bump(kind, id, dir) {
    var el = document.getElementById(kind + '-score-' + id);
    if (!el || reducedMotion()) return;
    el.classList.remove('bump-up', 'bump-down');
    void el.offsetWidth;
    el.classList.add(dir > 0 ? 'bump-up' : 'bump-down');
  }

  async function votePost(id, vote) {
    if (!isLoggedIn()) { navigate('/login'); return; }
    var post = posts.find(function (p) { return p.id === id; }) || (currentPost && currentPost.id === id ? currentPost : null);
    if (!post) return;
    var twin = (currentPost && currentPost.id === id && post !== currentPost) ? currentPost : null;
    var prev = netScore(post);
    var prevVote = post.user_vote || 0;
    var nextVote = prevVote === vote ? 0 : vote;
    post.net_votes = prev - prevVote + nextVote;
    post.user_vote = nextVote;
    if (twin) { twin.net_votes = post.net_votes; twin.user_vote = nextVote; }
    _updatePostScore(id);
    _paintVote('post', id, nextVote);
    bump('post', id, nextVote - prevVote);
    try {
      var result = await api('/community/posts/' + id + '/vote', { method: 'POST', body: JSON.stringify({ vote: vote }) });
      if (result) {
        post.net_votes = result.net_votes !== undefined ? result.net_votes : (result.upvotes - result.downvotes);
        if (result.user_vote !== undefined) { post.user_vote = result.user_vote; _paintVote('post', id, result.user_vote); }
        if (twin) { twin.net_votes = post.net_votes; twin.user_vote = post.user_vote; }
      }
      _updatePostScore(id);
    } catch (err) {
      post.net_votes = prev;
      post.user_vote = prevVote;
      if (twin) { twin.net_votes = prev; twin.user_vote = prevVote; }
      _updatePostScore(id);
      _paintVote('post', id, prevVote);
      if (err && err.status === 401) navigate('/login');
      else if (!(err && err.navAborted)) toast((err && err.message) || 'couldnt save your vote', 'error');
    }
  }

        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();

  function cmConfirm(title, desc, okLabel) {
    return new Promise(function (resolve) {
      var prevFocus = document.activeElement;
      var back = document.createElement('div');
      back.className = 'cm-modal-back';
      back.innerHTML = '<div class="cm-modal" role="alertdialog" aria-modal="true" aria-labelledby="cm-modal-t" aria-describedby="cm-modal-d">' +
        '<div class="cm-modal-t" id="cm-modal-t">' + esc(title) + '</div><div class="cm-modal-d" id="cm-modal-d">' + esc(desc) + '</div>' +
        '<div class="cm-modal-actions"><button class="cm-btn cm-btn-quiet" data-a="no">Cancel</button><button class="cm-btn cm-btn-danger" data-a="yes">' + esc(okLabel || 'Delete') + '</button></div></div>';
      function done(v) {
        document.removeEventListener('keydown', onKey, true);
        back.remove();
        try { if (prevFocus && prevFocus.focus) prevFocus.focus(); } catch (_) {}
        resolve(v);
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
        if (e.key === 'Tab') {
          var bs = back.querySelectorAll('button');
          if (e.shiftKey && document.activeElement === bs[0]) { e.preventDefault(); bs[bs.length - 1].focus(); }
          else if (!e.shiftKey && document.activeElement === bs[bs.length - 1]) { e.preventDefault(); bs[0].focus(); }
        }
      }
      back.addEventListener('click', function (e) {
        var a = e.target.closest('[data-a]');
        if (a) done(a.getAttribute('data-a') === 'yes');
        else if (e.target === back) done(false);
      });
      back._cmClose = function () { done(false); };
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(back);
      var yes = back.querySelector('[data-a="yes"]');
      if (yes) yes.focus();
    });
  }

  function buildCommentTree() {
    if (!currentComments.length) {
      return '<div class="cm-empty-comments"><b>no comments yet</b>be the first one to say something.</div>';
    }
    var byId = {}, childrenOf = {}, roots = [];
    currentComments.forEach(function (c) { byId[c.id] = c; });
    currentComments.forEach(function (c) {
      var pid = c.parent_id || null;
      if (pid && byId[pid]) { (childrenOf[pid] = childrenOf[pid] || []).push(c); }
      else { roots.push(c); }
    });
    if (_csort === 'new') roots.sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    else roots.sort(function (a, b) { var d = netScore(b) - netScore(a); return d !== 0 ? d : new Date(a.created_at) - new Date(b.created_at); });
    Object.keys(childrenOf).forEach(function (pid) {
      childrenOf[pid].sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
    });
    function countDesc(id) { var k = childrenOf[id] || []; return k.reduce(function (n, c) { return n + 1 + countDesc(c.id); }, 0); }
    var postAuthor = currentPost && currentPost.user_id;
    var before = currentPost && _visitsBefore[currentPost.id];
    var lastSeen = before && before.t ? Date.parse(before.t) : 0;
    var MAX = 3;

    function renderNode(c, depth, parentName, flat) {
      var id = sid(c.id);
      var isOwner = me && me.id === c.user_id;
      var kids = childrenOf[c.id] || [];
      var desc = countDesc(c.id);
      var fresh = lastSeen && Date.parse(c.created_at) > lastSeen && !isOwner;
      var nested = depth < MAX;
      var childHTML = kids.map(function (k) { return renderNode(k, nested ? depth + 1 : depth, c.username, !nested); }).join('');
      var actions = voteHTML('comment', id, netScore(c), c.user_vote || 0);
      if (isLoggedIn()) actions += '<button class="cm-act" onclick="toggleReplyForm(\'' + id + '\')" aria-label="Reply to @' + esc(c.username || '') + '">' + IC.reply + '<span class="cm-act-label">Reply</span></button>';
      actions += '<button class="cm-act" id="cshare-' + id + '" onclick="sharePost(\'' + sid(currentPost.id) + '\',\'' + id + '\')" aria-label="Copy link to comment">' + IC.share + '<span class="cm-act-label">Share</span></button>';
      if (isOwner) actions += '<button class="cm-act danger" onclick="deleteComment(\'' + id + '\')" aria-label="Delete your comment">' + IC.trash + '<span class="cm-act-label">Delete</span></button>';
      else if (isMod) actions += '<button class="cm-act danger" onclick="modDeleteComment(\'' + id + '\')" aria-label="Take down comment (mod)">' + IC.shield + '<span class="cm-act-label">Take down</span></button>';
      var collapsed = !!CM.collapsed[c.id];
      return '<div class="cm-c' + (collapsed ? ' collapsed' : '') + '" id="c-' + id + '" data-depth="' + depth + '">' +
        '<div class="cm-c-row">' +
          '<div class="cm-c-gutter">' + avatarHTML(c.username, c.profile_image_url, 28) +
            '<button class="cm-thread" onclick="toggleThread(\'' + id + '\')" aria-label="Collapse thread by @' + esc(c.username || '') + '" aria-expanded="' + (!collapsed) + '"></button></div>' +
          '<div class="cm-c-main">' +
            '<div class="cm-c-bubble">' +
              '<div class="cm-c-head">' + usernameLink(c.username, c.artist_id, c.user_id) +
                (postAuthor && c.user_id === postAuthor ? '<span class="cm-op" title="original poster">OP</span>' : '') +
                '<span class="cm-sep">·</span><time class="cm-time" datetime="' + esc(c.created_at) + '" title="' + esc(absTime(c.created_at)) + '">' + esc(ago(c.created_at)) + '</time>' +
                (fresh ? '<span class="cm-newdot" title="new since your last visit"></span>' : '') +
                (flat && parentName ? '<span class="cm-replying">replying to @' + esc(parentName) + '</span>' : '') +
                '<button class="cm-c-collapsed-note" onclick="toggleThread(\'' + id + '\')">' + (nested && desc ? '+' + plural(desc, 'reply', 'replies') : 'show') + '</button>' +
              '</div>' +
              '<div class="cm-c-body cm-md">' + renderMd(c.body) + '</div>' +
              (firstSiteLink(c.body) ? '<div class="cm-unfurl" data-url="' + esc(firstSiteLink(c.body)) + '"></div>' : '') +
              '<div class="cm-c-actions">' + actions + '</div>' +
            '</div>' +
            '<div class="cm-inline-reply" id="reply-form-' + id + '" hidden></div>' +
            (nested && childHTML ? '<div class="cm-c-children">' + childHTML + '</div>' : '') +
          '</div>' +
        '</div>' +
      '</div>' + (!nested ? childHTML : '');
    }
    return roots.map(function (c) { return renderNode(c, 0, null, false); }).join('');
  }

  function flashComment(id) {
    var node = document.getElementById('c-' + id);
    if (!node) return false;
    var self = currentComments.find(function (x) { return sid(x.id) === id; });
    var cur = self;
    var guard = 0;
    while (cur && cur.parent_id && guard++ < 50) {
      if (CM.collapsed[cur.parent_id]) { delete CM.collapsed[cur.parent_id]; var pn = document.getElementById('c-' + sid(cur.parent_id)); if (pn) pn.classList.remove('collapsed'); }
      var pid = cur.parent_id;
      cur = currentComments.find(function (x) { return x.id === pid; });
    }
    if (node.classList.contains('collapsed')) { node.classList.remove('collapsed'); if (self) delete CM.collapsed[self.id]; }
    node.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
    node.classList.add('flash');
    setTimeout(function () { node.classList.remove('flash'); }, 2600);
    return true;

    if (btn && !btn.getAttribute('data-busy')) btn.disabled = !ta.value.trim() || ta.value.length > 5000;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, Math.round(window.innerHeight * 0.5)) + 'px';
  }

  function replyKey(e, parentId) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (parentId) submitReply(parentId); else submitTopComment(); }
    else if (e.key === 'Escape' && parentId) { e.preventDefault(); toggleReplyForm(parentId, false); }
  }

  function fillMine(c) {
    if (!c) return c;
    if ((!c.username || c.username === 'unknown') && me) c.username = me.username;
    if (!c.profile_image_url && CM.me) c.profile_image_url = CM.me.avatar;
    if (!c.artist_id && CM.me) c.artist_id = CM.me.artist_id;
    if (c.net_votes === undefined) c.net_votes = 0;
    if (c.user_vote === undefined) c.user_vote = 0;
    return c;
  }

  async function submitTopComment() {
    var bodyEl = document.getElementById('top-comment-body');
    var errEl = document.getElementById('top-comment-error');
    var btn = document.getElementById('top-comment-submit');
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!body) { if (errEl) errEl.textContent = 'write something first'; return; }
    if (!currentPost || (btn && btn.getAttribute('data-busy'))) return;
    if (errEl) errEl.textContent = '';
    if (btn) { btn.setAttribute('data-busy', '1'); btn.disabled = true; btn.innerHTML = '<span class="cm-spin"></span>Posting'; }
    try {
      var c = fillMine(await api('/community/posts/' + currentPost.id + '/comments', { method: 'POST', body: JSON.stringify({ body: body }) }));
      currentComments.push(c);
      if (bodyEl) { bodyEl.value = ''; bodyEl.style.height = ''; }
      setCount(document.getElementById('top-comment-count'), 0, 5000);
      rerenderComments();
      writeVisit(currentPost.id, currentComments.length);
      flashComment(sid(c.id));
    } catch (err) {
      if (errEl) errEl.textContent = (err && err.message) || 'couldnt post that';
    } finally {
      if (btn) { btn.removeAttribute('data-busy'); btn.innerHTML = 'Comment'; btn.disabled = !(bodyEl && bodyEl.value.trim()); }
    }
  }

  function toggleReplyForm(commentId, force) {
    var form = document.getElementById('reply-form-' + commentId);
    if (!form) return;
    var open = force === undefined ? form.hidden : !!force;
    if (!open) { form.hidden = true; form.innerHTML = ''; return; }
    var c = currentComments.find(function (x) { return sid(x.id) === commentId; });
    form.innerHTML =
      '<label class="cm-sr" for="reply-body-' + commentId + '">Reply</label>' +
      '<textarea id="reply-body-' + commentId + '" class="cm-textarea" maxlength="5000" placeholder="reply to @' + esc(c ? c.username : '') + '…" oninput="replyInput(\'reply-body-' + commentId + '\',\'reply-count-' + commentId + '\',\'reply-submit-' + commentId + '\')" onkeydown="replyKey(event,\'' + commentId + '\')"></textarea>' +
      '<div id="reply-error-' + commentId + '" class="cm-err" role="alert"></div>' +
      '<div class="cm-inline-foot"><div class="cm-meta-line"><span class="cm-count" id="reply-count-' + commentId + '">0/5,000</span></div>' +
        '<div class="cm-foot-actions"><button class="cm-btn cm-btn-quiet" onclick="toggleReplyForm(\'' + commentId + '\',false)">Cancel</button>' +
        '<button class="cm-btn cm-btn-primary" id="reply-submit-' + commentId + '" onclick="submitReply(\'' + commentId + '\')" disabled>Reply</button></div></div>';
    form.hidden = false;
    var ta = document.getElementById('reply-body-' + commentId);
    if (ta) setTimeout(function () { ta.focus(); }, 20);
  }

  async function submitReply(parentId) {
    var bodyEl = document.getElementById('reply-body-' + parentId);
    var errEl = document.getElementById('reply-error-' + parentId);
    var btn = document.getElementById('reply-submit-' + parentId);
    var body = bodyEl ? bodyEl.value.trim() : '';
    if (!body) { if (errEl) errEl.textContent = 'write something first'; return; }
    if (!currentPost || (btn && btn.getAttribute('data-busy'))) return;
    var parent = currentComments.find(function (x) { return sid(x.id) === parentId; });
    if (errEl) errEl.textContent = '';
    if (btn) { btn.setAttribute('data-busy', '1'); btn.disabled = true; btn.innerHTML = '<span class="cm-spin"></span>Replying'; }
    try {
      var c = fillMine(await api('/community/posts/' + currentPost.id + '/comments', { method: 'POST', body: JSON.stringify({ body: body, parent_id: parent ? parent.id : parentId }) }));
      currentComments.push(c);
      if (parent) delete CM.collapsed[parent.id];
      rerenderComments();
      writeVisit(currentPost.id, currentComments.length);
      flashComment(sid(c.id));
    } catch (err) {
      if (errEl) errEl.textContent = (err && err.message) || 'couldnt post that';
      if (btn) { btn.removeAttribute('data-busy'); btn.innerHTML = 'Reply'; btn.disabled = false; }
    }
  }

  async function voteComment(id, vote) {
    if (!isLoggedIn()) { navigate('/login'); return; }
    var c = currentComments.find(function (x) { return sid(x.id) === id; });
    if (!c) return;
    var prev = netScore(c);
    var prevVote = c.user_vote || 0;
    var nextVote = prevVote === vote ? 0 : vote;
    c.net_votes = prev - prevVote + nextVote;
    c.user_vote = nextVote;
    var el = document.getElementById('comment-score-' + id);
    if (el) el.textContent = Math.max(0, netScore(c));
    _paintVote('comment', id, nextVote);
    bump('comment', id, nextVote - prevVote);
    try {
      var result = await api('/community/comments/' + c.id + '/vote', { method: 'POST', body: JSON.stringify({ vote: vote }) });
      if (result) {
        c.net_votes = result.net_votes !== undefined ? result.net_votes : (result.upvotes - result.downvotes);
        if (result.user_vote !== undefined) { c.user_vote = result.user_vote; _paintVote('comment', id, result.user_vote); }
      }
      if (el) el.textContent = Math.max(0, netScore(c));
    } catch (err) {
      c.net_votes = prev;
      c.user_vote = prevVote;
      if (el) el.textContent = Math.max(0, netScore(c));
      _paintVote('comment', id, prevVote);
      if (err && err.status === 401) navigate('/login');
      else if (!(err && err.navAborted)) toast((err && err.message) || 'couldnt save your vote', 'error');
    }
  }

  function dropComment(id) {
    var c = currentComments.find(function (x) { return sid(x.id) === id; });
    if (!c) return;
    var gone = {}; gone[c.id] = 1;
    var changed = true;
    while (changed) {
      changed = false;
      currentComments.forEach(function (x) { if (x.parent_id && gone[x.parent_id] && !gone[x.id]) { gone[x.id] = 1; changed = true; } });
    }
    currentComments = currentComments.filter(function (x) { return !gone[x.id]; });
    rerenderComments();
    if (currentPost) writeVisit(currentPost.id, currentComments.length);
  }

  async function deleteComment(id) {
    if (!(await cmConfirm('delete this comment?', 'replies under it will go with it. you cant undo this.', 'Delete'))) return;
    var c = currentComments.find(function (x) { return sid(x.id) === id; });
    try {
      await api('/community/comments/' + (c ? c.id : id), { method: 'DELETE' });
      dropComment(id);
      toast('comment deleted');
    } catch (err) { toast('couldnt delete: ' + ((err && err.message) || 'error'), 'error'); }
  }

  async function modDeleteComment(id) {
    if (!(await cmConfirm('take down this comment?', 'mod action. it gets removed for everyone.', 'Take down'))) return;
    var c = currentComments.find(function (x) { return sid(x.id) === id; });
    try {
      await api('/mod/community-comments/' + (c ? c.id : id), { method: 'DELETE' });
      dropComment(id);
      toast('comment taken down');
    } catch (err) { toast('couldnt take it down: ' + ((err && err.message) || 'error'), 'error'); }
  }

  window._wvCommKeys = function (e) {
    var t = e.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (document.querySelector('.cm-modal-back')) return;
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && t && (t.id === 'np-title' || t.id === 'np-body')) { e.preventDefault(); submitNewPost(); return; }
    if (e.key === 'Escape') {
      if (t && (t.id === 'np-title' || t.id === 'np-body')) { e.preventDefault(); closeComposer(); return; }
      if (t && t.id === 'cm-search-input') { e.preventDefault(); if (_q) clearSearch(); else t.blur(); return; }
      if (t && t.id === 'top-comment-body') { t.blur(); return; }
    }
    if (!typing && e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && currentView === 'list') {
      var si = document.getElementById('cm-search-input');
      if (si) { e.preventDefault(); si.focus(); }
    }
  };
  document.addEventListener('keydown', window._wvCommKeys);
  window._pageCleanup.push(function () { document.removeEventListener('keydown', window._wvCommKeys); });
  window._pageCleanup.push(function () { document.querySelectorAll('.cm-modal-back').forEach(function (el) { if (el._cmClose) el._cmClose(); else el.remove(); }); });
  window._pageCleanup.push(function () { if (currentView === 'list') { var s = scroller(); CM.listScroll = s ? s.scrollTop : 0; } });
</script>
</body>
</html>
