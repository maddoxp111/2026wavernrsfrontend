<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Following — wavernrs</title>
  <link rel="stylesheet" href="/css/style.css?v=202609051937">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>
<script src="/js/api.js?v=202609051937"></script>
<script src="/js/layout.js?v=202609051937"></script>
<script src="/js/player.js?v=202609051937"></script>
<script src="/js/router.js?v=202609051937"></script>
<script src="/js/playlists.js?v=202609051937"></script>
<script>
var _feedItems = [];
var _feedHasMore = false;
var _feedPage = 1;
initPlayer();

async function initFeed() {
  if (!isLoggedIn()) { navigate('/login.html'); return; }
  var view = document.getElementById('view');
  view.innerHTML =
    '<div style="display:flex;flex-direction:column;gap:32px;padding-bottom:40px;">' +
    '<h1 class="wv-page-title">Following</h1>' +
    '<div id="feed-sections"><div class="loading"><div class="spinner"></div></div></div>' +
    '</div>';
  loadFeed();
}

async function loadFeed() {
  var sectionsEl = document.getElementById('feed-sections');
  if (!sectionsEl) return;
  sectionsEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    // Fetch enough items to get a good cross-section of all followed artists.
    var data = await api('/feed?limit=100');
    var items = data.items || [];
    _feedItems = items;

    // Background from the first item with cover art.
    if (typeof window.setPageBgImage === 'function') {
      var first = items.find(function(i) { return i.cover_url; });
      window.setPageBgImage(first ? first.cover_url : '');
    }

    if (!items.length) {
      sectionsEl.innerHTML =
        '<div class="wv-empty" style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:48px 0;">' +
        '<div style="font-size:48px;">&#x1F465;</div>' +
        '<div style="font-size:16px;font-weight:600;color:var(--text);">Follow artists to see their latest releases here</div>' +
        '<button class="wv-pill brand" onclick="navigate(\'/discover.html\')">Discover artists</button>' +
        '</div>';
      return;
    }

    // Group by artist, preserving chronological order within each group.
    var groupMap = {};
    var groupOrder = [];
    items.forEach(function(item) {
      var aid = item.artist_id;
      if (!groupMap[aid]) {
        groupMap[aid] = { artist: item.artists || {}, items: [] };
        groupOrder.push(aid);
      }
      groupMap[aid].items.push(item);
    });

    // Render one section per artist.
    sectionsEl.innerHTML = groupOrder.map(function(aid) {
      return renderArtistSection(groupMap[aid].artist, groupMap[aid].items);
    }).join('');
  } catch (err) {
    sectionsEl.innerHTML = '<div class="wv-empty">Failed to load feed: ' + escHtml(err.message) + '</div>';
  }
}

function renderArtistSection(artist, items) {
  var artistId = artist.id || '';
  var name = escHtml(artist.display_name || 'Unknown');
  var pfpBg = coverGradient(artist.display_name || '');
  var pfpInner = artist.profile_image_url
    ? '<img src="' + escHtml(artist.profile_image_url) + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.style.display=\'none\'">'
    : '<span style="font-size:18px;font-weight:800;color:rgba(255,255,255,0.9);">' + escHtml((artist.display_name || '?')[0].toUpperCase()) + '</span>';
  var pfpHtml =
    '<div style="width:40px;height:40px;border-radius:50%;background:' + pfpBg + ';overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.25);">' +
    pfpInner + '</div>';

  var header =
    '<div class="wv-sec-head" style="justify-content:flex-start;gap:12px;cursor:pointer;" onclick="navigate(\'/artist.html?id=' + artistId + '\')">' +
    pfpHtml +
    '<div>' +
      '<div style="font-size:17px;font-weight:700;letter-spacing:-0.02em;color:var(--text);">' + name + '</div>' +
      '<div style="font-size:12px;color:var(--text-3);">' + items.length + ' release' + (items.length === 1 ? '' : 's') + '</div>' +
    '</div>' +
    '</div>';

  var cards = items.slice(0, 10).map(feedCardHTML).join('');
  var scrollRow =
    '<div class="wv-rail">' + cards + '</div>';

  return '<div style="display:flex;flex-direction:column;">' + header + scrollRow + '</div>';
}

function feedCardHTML(item) {
  var isAlbum = item._type === 'album';
  var bg = coverGradient(item.title || '');
  var action = isAlbum
    ? "navigate('/album.html?id=" + item.id + "')"
    : "navigate('/track.html?id=" + item.id + "')";
  var coverImg = item.cover_url
    ? '<img src="' + escHtml(item.cover_url) + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">'
    : '';
  var compBadge = isAlbum
    ? ''
    : '';
  var playBtn = !isAlbum
    ? '<button class="wv-cover-play-btn" onclick="event.stopPropagation();playFeedItem(\'' + item.id + '\')">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
      '</button>'
    : '';
  return '<div class="wv-comp-card" onclick="' + action + '">' +
    '<div class="wv-comp-card-cover">' +
      '<div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
        '' +
        compBadge + coverImg + playBtn +
      '</div>' +
    '</div>' +
    '<div class="wv-comp-card-title">' + escHtml(item.title || 'Untitled') + '</div>' +
    '<div class="wv-comp-card-artist">' + (isAlbum ? 'Comp' : 'Edit') + '</div>' +
  '</div>';
}

function playFeedItem(id) {
  var item = _feedItems.find(function(i) { return i.id === id; });
  if (!item) return;
  if (item._type === 'album') { navigate('/album.html?id=' + id); return; }
  playTrack({ id: item.id, title: item.title, artist_name: item.artists ? item.artists.display_name : '', ia_url: item.ia_url, cover_url: item.cover_url });
}

initFeed();
</script>
</body>
</html>
