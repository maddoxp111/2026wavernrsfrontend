<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — stats</title>
  <link rel="stylesheet" href="/css/style.css?v=2d4aca45e0bb">
  <script src="/js/status-card.js?v=2d4aca45e0bb"></script>
  <script src="/js/down.js?v=2d4aca45e0bb"></script>
  <style>
    .st-wrap { min-width: 0; padding-bottom: 32px; }
    .st-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .st-head .wv-page-title { margin: 6px 0 4px; }
    .st-head .wv-page-sub { margin: 0; }
    .st-live { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: var(--r-pill);
      background: var(--surface); border: 1px solid var(--hair); color: var(--text-2); font-size: 12.5px; font-weight: 600; text-decoration: none; }
    .st-live:hover { color: var(--text); border-color: var(--hair-strong); }
    .st-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }

    .st-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    .st-kpi { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--hair); border-radius: 12px;
      padding: 16px 16px 14px; min-height: 128px; display: flex; flex-direction: column; text-decoration: none; color: inherit;
      transition: border-color 160ms var(--ease), transform 160ms var(--ease); }
    a.st-kpi:hover { border-color: var(--hair-strong); }
    a.st-kpi:active { transform: scale(.99); }
    .st-kpi .k { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
    .st-kpi .k svg { color: var(--text-3); flex-shrink: 0; }
    .st-kpi .v { font-size: clamp(26px, 2.6vw, 34px); font-weight: 850; letter-spacing: -.035em; line-height: 1.05; margin-top: 10px; color: var(--text); white-space: nowrap; }
    .st-kpi .d { margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); position: relative; z-index: 1; flex-wrap: wrap; }
    .st-kpi .d b { font-weight: 700; color: var(--text); }
    .st-up { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px 1px 5px; border-radius: var(--r-pill); font-weight: 700; font-size: 12px;
      color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
    .st-flat { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: var(--r-pill); font-weight: 700; font-size: 12px; color: var(--text-2); background: var(--surface-2); }
    .st-vs { color: var(--text-3); font-size: 11.5px; }
    .st-spark { position: absolute; right: 12px; top: 14px; width: 42%; max-width: 120px; height: 34px; pointer-events: none; }
    .st-spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .st-spark .ln { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .st-spark .ar { fill: var(--brand); opacity: .1; }
    .st-spark .dot { position: absolute; right: -4px; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--surface); }

    .st-card { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 18px 18px 16px; min-width: 0; }
    .st-card + .st-card, .st-grid2 + .st-card, .st-card + .st-grid2, .st-grid2 + .st-grid2, .st-grid1 + .st-card, .st-card + .st-grid1 { margin-top: 14px; }
    .st-grid2 > .st-card { margin-top: 0; }
    .st-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .st-ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .st-ch h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
    .st-ch h2 a { color: inherit; text-decoration: none; }
    .st-ch h2 a:hover { text-decoration: underline; }
    .st-ch p { margin: 3px 0 0; font-size: 12.5px; color: var(--text-2); }
    .st-ch .more { font-size: 12.5px; font-weight: 700; color: var(--text-2); text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; padding: 0 2px; }
    .st-ch .more:hover { color: var(--text); text-decoration: underline; }
    .st-legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--text-2); font-weight: 600; }
    .st-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .st-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .st-sumrow { display: flex; gap: 22px; flex-wrap: wrap; margin: -4px 0 12px; }
    .st-sum .n { font-size: 20px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
    .st-sum .l { font-size: 11.5px; color: var(--text-3); font-weight: 600; }

    .st-chart { position: relative; width: 100%; outline: none; border-radius: 8px; }
    .st-chart:focus-visible { box-shadow: 0 0 0 2px var(--brand); }
    .st-chart svg { display: block; width: 100%; overflow: visible; }
    .st-chart .grid { stroke: var(--hair); stroke-width: 1; shape-rendering: crispEdges; }
    .st-chart .base { stroke: var(--hair-strong); stroke-width: 1; shape-rendering: crispEdges; }
    .st-chart .tk { fill: var(--text-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
    .st-chart .xl { fill: var(--text-3); font-size: 10.5px; }
    .st-chart .lab { fill: var(--text-2); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .st-chart .s0 { fill: var(--brand); }
    .st-chart .s1 { fill: color-mix(in srgb, var(--brand) 42%, var(--surface)); }
    .st-chart .col { transition: opacity 120ms var(--ease); }
    .st-chart.hov .col { opacity: .38; }
    .st-chart.hov .col.on { opacity: 1; }
    .st-chart .hit { fill: transparent; cursor: default; }
    .st-legend .s0 { background: var(--brand); }
    .st-legend .s1 { background: color-mix(in srgb, var(--brand) 42%, var(--surface)); }
    .st-tip { position: absolute; z-index: 5; pointer-events: none; min-width: 124px; padding: 9px 11px; border-radius: 10px;
      background: var(--elevated, var(--surface-2)); border: 1px solid var(--hair-strong); box-shadow: 0 10px 28px rgba(0,0,0,.28);
      font-size: 12px; color: var(--text-2); transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity 100ms linear; white-space: nowrap; }
    .st-tip.show { opacity: 1; }
    .st-tip .t { font-weight: 700; color: var(--text); margin-bottom: 5px; font-size: 12px; }
    .st-tip .r { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
    .st-tip .r b { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 26px; }
    .st-tip .r i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
    .st-tip .s0 { background: var(--brand); }
    .st-tip .s1 { background: color-mix(in srgb, var(--brand) 42%, var(--surface)); }
    .st-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .st-heat { display: grid; grid-template-columns: 34px minmax(0, 1fr) 120px; gap: 4px 14px; align-items: center; position: relative; }
    .st-heat .dl { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
    .st-hrow { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; }
    .st-cell { height: 20px; border-radius: 3px; background: var(--surface-2); position: relative; min-width: 0; }
    .st-cell b { position: absolute; inset: 0; border-radius: 3px; background: var(--brand); }
    .st-cell:hover, .st-cell:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; z-index: 1; }
    .st-wbar { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .st-wbar span { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
    .st-wbar span i { display: block; height: 100%; border-radius: 3px; background: var(--brand); }
    .st-wbar em { font-style: normal; min-width: 26px; text-align: right; }
    .st-hx { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; font-size: 10.5px; color: var(--text-3); }
    .st-hx span { white-space: nowrap; }
    .st-hfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
    .st-scale { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); font-size: 11px; }
    .st-scale i { width: 11px; height: 11px; border-radius: 3px; background: var(--surface-2); display: inline-block; position: relative; overflow: hidden; }
    .st-scale i b { position: absolute; inset: 0; background: var(--brand); }

    .st-comps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
    .st-comp { text-decoration: none; color: inherit; min-width: 0; border-radius: 10px; padding: 6px; margin: -6px; transition: background 140ms var(--ease); }
    .st-comp:hover { background: var(--surface-2); }
    .st-comp .art { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
    .st-comp .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .st-comp .rk { position: absolute; left: 7px; top: 7px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.62); color: #fff; font-size: 12px; font-weight: 800; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .st-comp .ti { margin-top: 9px; font-size: 13.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-comp .me { margin-top: 2px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-comp .me b { color: var(--text); font-weight: 700; }

    .st-list { display: flex; flex-direction: column; }
    .st-row { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 8px; margin: 0 -8px;
      border-radius: 10px; text-decoration: none; color: inherit; min-height: 52px; transition: background 140ms var(--ease); }
    .st-row:hover { background: var(--surface-2); }
    .st-row .n { font-size: 13px; font-weight: 800; color: var(--text-3); text-align: center; font-variant-numeric: tabular-nums; }
    .st-row .im { width: 40px; height: 40px; border-radius: 6px; overflow: hidden; background: var(--surface-2); position: relative; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; color: rgba(255,255,255,.92); }
    .st-row .im.round { border-radius: 50%; }
    .st-row .im img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .st-row .tx { min-width: 0; }
    .st-row .tx .a { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-row .tx .b { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .st-row .tx .bar { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
    .st-row .tx .bar i { display: block; height: 100%; border-radius: 2px; background: var(--brand); }
    .st-row .val { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; display: inline-flex; align-items: center; gap: 5px; }
    .st-row .val small { font-weight: 600; color: var(--text-3); font-size: 11.5px; }
    .st-row .val svg { color: var(--text-3); }

    .st-eras { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
    .st-era { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: 10px;
      text-decoration: none; color: inherit; min-height: 48px; transition: background 140ms var(--ease); }
    .st-era:hover { background: var(--surface-2); }
    .st-era .im { width: 36px; height: 36px; border-radius: 6px; overflow: hidden; background: var(--surface-2); position: relative; }
    .st-era .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .st-era .nm { font-size: 13.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-era .bar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
    .st-era .bar i { display: block; height: 100%; border-radius: 3px; background: var(--brand); transform-origin: left center; transition: transform 500ms var(--ease); }
    .st-era .c { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; min-width: 48px; }
    .st-era .c small { display: block; font-size: 11px; font-weight: 600; color: var(--text-3); }
    .st-seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-pill); padding: 3px; }
    .st-seg button { font: inherit; font-size: 12.5px; font-weight: 700; border: 0; cursor: pointer; min-height: 32px; padding: 0 14px; border-radius: var(--r-pill);
      background: transparent; color: var(--text-2); transition: background 140ms var(--ease), color 140ms var(--ease); }
    .st-seg button[aria-pressed="true"] { background: var(--text); color: var(--page-bg-base, var(--surface)); }
    .st-seg button:focus-visible, .st-btn:focus-visible, .st-row:focus-visible, .st-era:focus-visible, .st-comp:focus-visible, .st-ed:focus-visible, .st-kpi:focus-visible, .st-live:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .st-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; margin-top: 10px; border-radius: var(--r-pill);
      border: 1px solid var(--hair-strong); background: transparent; color: var(--text); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .st-btn:hover { border-color: var(--text); }

    .st-eds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    .st-ed { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14px 8px 12px; border-radius: 12px; background: var(--surface-2);
      text-decoration: none; color: inherit; min-width: 0; transition: transform 160ms var(--ease), background 160ms var(--ease); }
    .st-ed:hover { background: var(--surface-3); }
    .st-ed .av { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: rgba(255,255,255,.94); box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--hair-strong); }
    .st-ed .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .st-ed .nm { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--text); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-ed .wh { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
    .st-new { display: inline-block; margin-top: 7px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-text, var(--brand)); }

    #st-ye > .st-card { margin-top: 14px; }
    .st-ye { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .st-yt { background: var(--surface-2); border-radius: 12px; padding: 14px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: background 140ms var(--ease); }
    .st-yt:hover { background: var(--surface-3); }
    .st-yt .ic { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); margin-bottom: 6px; }
    .st-yt .v { font-size: 22px; font-weight: 850; letter-spacing: -.03em; color: var(--text); }
    .st-yt .k { font-size: 12.5px; font-weight: 700; color: var(--text); }
    .st-yt .d { font-size: 11.5px; color: var(--text-2); }

    .st-foot { margin-top: 20px; font-size: 12px; color: var(--text-3); display: flex; gap: 6px 14px; flex-wrap: wrap; }
    .st-foot a { color: var(--text-2); }
    .st-sk { background: var(--surface-2); border-radius: 6px; position: relative; overflow: hidden; }
    .st-sk::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 6%, transparent), transparent); animation: wv-skel 1.4s infinite; }
    .st-err { text-align: center; padding: 48px 16px; color: var(--text-2); }
    .st-err b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
    .st-fade { animation: st-in 320ms var(--ease) both; }
    @keyframes st-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    @media (max-width: 1100px) {
      .st-comps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .st-comps .st-comp:nth-child(n+9) { display: none; }
    }
    @media (max-width: 900px) {
      .st-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .st-grid2 { grid-template-columns: minmax(0, 1fr); }
      .st-eras { grid-template-columns: minmax(0, 1fr); }
      .st-eds { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .st-ye { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .st-kpi { min-height: 112px; padding: 14px 13px 12px; }
      .st-kpi .v { font-size: 25px; }
      .st-spark { width: 38%; top: 12px; right: 10px; height: 28px; }
      .st-kpi .k { font-size: 10.5px; letter-spacing: .06em; }
      .st-kpi .k svg { display: none; }
      .st-card { padding: 15px 14px 14px; border-radius: 12px; }
      .st-comps { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 14px; gap: 12px; margin: 0 -14px; padding: 6px 14px 8px; scrollbar-width: none; }
      .st-comps::-webkit-scrollbar { display: none; }
      .st-comps .st-comp { flex: 0 0 40%; scroll-snap-align: start; margin: 0; padding: 0; }
      .st-comps .st-comp:nth-child(n+9) { display: block; }
      .st-comp:hover { background: none; }
      .st-heat { grid-template-columns: 28px minmax(0, 1fr); }
      .st-heat .st-wbar, .st-heat .wh { display: none; }
      .st-hrow, .st-hx { gap: 2px; }
      .st-cell { height: auto; aspect-ratio: 1; }
      .st-cell, .st-cell b { border-radius: 2px; }
      .st-eds { gap: 8px; }
      .st-ed { padding: 12px 6px 10px; }
      .st-ed .av { width: 52px; height: 52px; font-size: 20px; }
      .st-ye { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .st-ye .st-yt:first-child { grid-column: span 2; }
      .st-sumrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .st-sum .n { font-size: 18px; }
      .st-sum .l { font-size: 11px; line-height: 1.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .st-fade { animation: none; }
      .st-era .bar i { transition: none; }
      .st-sk::after { animation: none; }
    }
  </style>
</head>
<body>
<div id="view">
  <div class="st-wrap">
    <div class="st-head">
      <div>
        <h1 class="wv-page-title">Stats</h1>
        <p class="wv-page-sub" id="st-sub">the whole site in numbers...refreshes every 15 min</p>
      </div>
      <a class="st-live" href="/status" id="st-live" aria-label="Open the live status page"><i aria-hidden="true"></i><span>live status</span></a>
    </div>
    <div id="st-body" aria-busy="true">
      <div class="st-kpis">
        <div class="st-kpi"><div class="st-sk" style="height:11px;width:46%"></div><div class="st-sk" style="height:30px;width:64%;margin-top:14px"></div><div class="st-sk" style="height:12px;width:52%;margin-top:auto"></div></div>
        <div class="st-kpi"><div class="st-sk" style="height:11px;width:40%"></div><div class="st-sk" style="height:30px;width:52%;margin-top:14px"></div><div class="st-sk" style="height:12px;width:58%;margin-top:auto"></div></div>
        <div class="st-kpi"><div class="st-sk" style="height:11px;width:44%"></div><div class="st-sk" style="height:30px;width:58%;margin-top:14px"></div><div class="st-sk" style="height:12px;width:48%;margin-top:auto"></div></div>
        <div class="st-kpi"><div class="st-sk" style="height:11px;width:38%"></div><div class="st-sk" style="height:30px;width:50%;margin-top:14px"></div><div class="st-sk" style="height:12px;width:56%;margin-top:auto"></div></div>

function stHeatHTML(hours, weekday) {

      var v = +(hours[ud] && hours[ud][uh]) || 0; if (!v) continue;

  all.sort(function (a, b) { return a - b; });

    (have ? '<span class="st-scale" aria-hidden="true">less <i></i><i><b style="opacity:.26"></b></i><i><b style="opacity:.48"></b></i><i><b style="opacity:.72"></b></i><i><b></b></i> more</span>' : '') + '</div>';

    tip.style.left = Math.max(half, Math.min(hr.width - half, cx)) + 'px';
    tip.style.top = (cr.top - hr.top) + 'px';
    tip.classList.add('show');
  });
  heat.addEventListener('pointerleave', function () { tip.classList.remove('show'); });
}

function stEraRows(eras, covers, mode, all) {
  var list = (eras || []).filter(function (e) { return (e[mode] || 0) > 0; }).slice().sort(function (a, b) { return (b[mode] || 0) - (a[mode] || 0); });
  var shown = all ? list : list.slice(0, 10);
  var max = Math.max.apply(null, shown.map(function (e) { return e[mode] || 0; }).concat([1]));
  var html = shown.map(function (e) {
    var cv = covers[e.id];
    var other = mode === 'plays' ? stNum(e.releases || 0) + ' releases' : stBig(e.plays || 0) + ' plays';
    return '<a class="st-era" href="/browse?era=' + encodeURIComponent(e.id) + '" aria-label="' + stEsc(e.name) + ', ' + stNum(e[mode] || 0) + ' ' + mode + '">' +
      '<div class="im" style="background:' + (typeof coverGradient === 'function' ? coverGradient(e.name || e.id) : 'var(--surface-2)') + '">' + (cv ? '<img src="' + stEsc(stImg(cv, 72)) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : '') + '</div>' +
      '<div style="min-width:0"><div class="nm">' + stEsc(e.name) + '</div><div class="bar"><i style="transform:scaleX(' + Math.max(0.02, (e[mode] || 0) / max).toFixed(3) + ')"></i></div></div>' +
      '<div class="c">' + stBig(e[mode] || 0) + '<small>' + other + '</small></div>' +
    '</a>';
  }).join('');
  return { html: html, total: list.length };
}

function stRenderEras() {
  var S = window._stState; var box = document.getElementById('st-eras-box'); if (!S || !box) return;
  var r = stEraRows(S.eras, S.eraCovers || {}, S.eraMode, S.eraAll);
  box.innerHTML = '<div class="st-eras">' + (r.html || '<div class="wv-empty" style="padding:12px 0">no era data yet</div>') + '</div>' +
    (r.total > 10 ? '<button class="st-btn" type="button" onclick="window._stState.eraAll=!window._stState.eraAll;stRenderEras()">' + (S.eraAll ? 'show top 10' : 'show all ' + r.total + ' eras') + '</button>' : '');
}
function stEraMode(m, btn) {
  var S = window._stState; if (!S) return; S.eraMode = m;
  var seg = btn && btn.parentNode; if (seg) seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
  stRenderEras();
}

function stYe(y) {
  var box = document.getElementById('st-ye'); if (!box || !y) return;
  var tiles = [];
  if (y.tweets) tiles.push({ ic: ST_ICONS.chat, v: y.tweets, k: 'Tweets', d: 'every ye tweet', href: '/resources' });
  if (y.yeezy) tiles.push({ ic: ST_ICONS.shirt, v: y.yeezy, k: 'Yeezy pieces', d: 'the full catalog', href: '/resources' });
  if (y.disco) tiles.push({ ic: ST_ICONS.album, v: y.disco, k: 'Albums', d: stNum(y.disco_songs || 0) + ' songs with credits', href: '/resources' });
  if (y.credits) tiles.push({ ic: ST_ICONS.people, v: y.credits, k: 'Songs with others', d: 'produced or featured', href: '/resources' });
  if (y.tour_shows) tiles.push({ ic: ST_ICONS.mic, v: y.tour_shows, k: 'Tour shows', d: y.tour_years ? 'across ' + stNum(y.tour_years) + ' years' : 'every show we have', href: '/resources' });
  if (!tiles.length) return;
  var synced = y.tweets_at ? 'tweets synced ' + stAgo(y.tweets_at) : '';
  box.innerHTML = '<div class="st-card st-fade"><div class="st-ch"><div><h2><a href="/resources">The Ye archive</a></h2><p>everything we track outside the edits' + (synced ? ' · ' + stEsc(synced) : '') + '</p></div><a class="more" href="/resources">Open</a></div>' +
    '<div class="st-ye">' + tiles.map(function (t) {
      return '<a class="st-yt" href="' + t.href + '"><span class="ic">' + t.ic + '</span><span class="v">' + stNum(t.v) + '</span><span class="k">' + stEsc(t.k) + '</span><span class="d">' + stEsc(t.d) + '</span></a>';
    }).join('') + '</div></div>';
}

function stRender(d) {
  var el = document.getElementById('st-body'); if (!el) return;
  var t = d.totals || {}, tw = d.this_week || null, pw = d.prev_week || null;
  var ub = Array.isArray(d.uploads_by_week) ? d.uploads_by_week : null;
  var eb = Array.isArray(d.editors_by_week) ? d.editors_by_week : null;
  var gb = Array.isArray(d.engagement_by_week) ? d.engagement_by_week : null;
  function last12(arr, f) { return arr ? arr.slice(-12).map(f) : null; }
  var uploads = (t.edits || 0) + (t.comps || 0);
  var kpis = [
    { k: 'Plays', v: t.plays, icon: ST_ICONS.play, href: '/charts', d: uploads ? '<span>about <b>' + stNum(Math.round((t.plays || 0) / uploads)) + '</b> per upload</span>' : '<span>on every edit and comp</span>' },
    { k: 'Edits', v: t.edits, icon: ST_ICONS.wave, href: '/browse', d: tw ? stDelta(tw.edits, pw && pw.edits) : '<span>standalone edits</span>', spark: ub ? stSpark(last12(ub, function (r) { return r.edits || 0; })) : '' },
    { k: 'Comps', v: t.comps, icon: ST_ICONS.disc, href: '/browse', d: tw ? stDelta(tw.comps, pw && pw.comps) : '<span>full comps</span>', spark: ub ? stSpark(last12(ub, function (r) { return r.comps || 0; })) : '' },
    { k: 'Editors', v: t.artists, icon: ST_ICONS.user, href: '/artists', d: tw ? stDelta(tw.artists, pw && pw.artists, 'joined') : '<span>on wavernrs</span>', spark: eb ? stSpark(last12(eb, function (r) { return r.count || 0; })) : '' },
    { k: 'Likes', v: t.likes, icon: ST_ICONS.heart, d: tw ? stDelta(tw.likes, pw && pw.likes) : '<span>on edits and comps</span>', spark: gb ? stSpark(last12(gb, function (r) { return r.likes || 0; })) : '' },
    { k: 'Follows', v: t.follows, icon: ST_ICONS.plus, href: '/artists', d: tw ? stDelta(tw.follows, pw && pw.follows) : '<span>editors followed</span>', spark: gb ? stSpark(last12(gb, function (r) { return r.follows || 0; })) : '' },
    { k: 'Archive comps', v: t.archive_comps, icon: ST_ICONS.box, href: '/archive', d: '<span>in the yedits archive</span>' },
    { k: 'New this week', v: t.new_this_week, icon: ST_ICONS.star, href: '/browse', d: pw ? '<span>edits and comps</span><span class="st-vs">vs ' + stNum((pw.edits || 0) + (pw.comps || 0)) + ' last wk</span>' : '<span>edits and comps</span>' }
  ];
  var html = '<div class="st-kpis st-fade">' + kpis.map(stKpi).join('') + '</div>';

  if (ub && ub.length) {
    var tot26 = ub.reduce(function (s, r) { return s + (r.edits || 0) + (r.comps || 0); }, 0);
    var bestW = ub.reduce(function (b, r) { var v = (r.edits || 0) + (r.comps || 0); return v > b.v ? { v: v, w: r.week } : b; }, { v: -1 });
    var active = ub.filter(function (r) { return (r.edits || 0) + (r.comps || 0) > 0; }).length;
    var sum = '<div class="st-sumrow">' +
      '<div class="st-sum"><div class="n">' + stNum(tot26) + '</div><div class="l">uploads in ' + ub.length + ' weeks</div></div>' +
      (bestW.v > 0 ? '<div class="st-sum"><div class="n">' + stNum(bestW.v) + '</div><div class="l">busiest week · ' + stEsc(stWeekLabel(bestW.w)) + '</div></div>' : '') +
      '<div class="st-sum"><div class="n">' + active + '<span style="font-size:13px;color:var(--text-3);font-weight:700">/' + ub.length + '</span></div><div class="l">weeks with a drop</div></div>' +
    '</div>';
    html += stChartCard('st-c-up', 'Uploads per week', 'new edits and comps, last ' + ub.length + ' weeks',
      '<div class="st-legend" aria-hidden="true"><span><i class="s1"></i>Edits</span><span><i class="s0"></i>Comps</span></div>', sum) ;
    html = html.replace('<div class="st-chart" id="st-c-up"', stTable('Uploads per week', ['Week of', 'Edits', 'Comps'], ub.map(function (r) { return [r.week, stNum(r.edits || 0), stNum(r.comps || 0)]; })) + '<div class="st-chart" id="st-c-up"');
  }
  if (eb || gb) {
    html += '<div class="st-grid2">';
    if (eb) {
      var eTot = eb.reduce(function (s, r) { return s + (r.count || 0); }, 0);
      html += stChartCard('st-c-ed', 'New editors', stNum(eTot) + ' joined in the last ' + eb.length + ' weeks', '') ;
    }
    if (gb) {
      var lTot = gb.reduce(function (s, r) { return s + (r.likes || 0); }, 0);
      html += stChartCard('st-c-lk', 'Likes per week', stNum(lTot) + ' likes in the last ' + gb.length + ' weeks', '');
    }
    html += '</div>';
  }
  if (Array.isArray(d.upload_hours) || Array.isArray(d.weekday_uploads)) {
    html += '<div class="st-card st-fade"><div class="st-ch"><div><h2>When uploads land</h2><p>every edit and comp by day and hour, in your time zone</p></div></div>' + stHeatHTML(d.upload_hours, d.weekday_uploads) + '</div>';
  }
  var tc = Array.isArray(d.top_comps) ? d.top_comps.filter(function (c) { return c && c.id; }) : [];
  if (tc.length) {
    html += '<div class="st-card st-fade"><div class="st-ch"><div><h2><a href="/charts">Most played comps</a></h2><p>all time, by plays</p></div><a class="more" href="/charts">Charts</a></div><div class="st-comps">' +
      tc.slice(0, 10).map(function (c, i) {
        return '<a class="st-comp" href="/album?id=' + encodeURIComponent(c.id) + '" aria-label="#' + (i + 1) + ' ' + stEsc(c.title) + (c.artist_name ? ' by ' + stEsc(c.artist_name) : '') + ', ' + stNum(c.plays) + ' plays">' +
          '<div class="art" style="background:' + (typeof coverGradient === 'function' ? coverGradient(c.title || c.id) : 'var(--surface-2)') + '">' + (c.cover_url ? '<img src="' + stEsc(stImg(c.cover_url, 240)) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : '') + '<span class="rk">' + (i + 1) + '</span></div>' +
          '<div class="ti">' + stEsc(c.title || 'untitled') + '</div>' +
          '<div class="me"><b>' + stBig(c.plays) + '</b> plays' + (c.artist_name ? ' · ' + stEsc(c.artist_name) : '') + '</div>' +
        '</a>';
      }).join('') + '</div></div>';
  }
  var ta = (d.top_artists || []).filter(function (a) { return a && a.id; });
  var tl = Array.isArray(d.top_liked_tracks) ? d.top_liked_tracks.filter(function (x) { return x && x.id; }) : [];
  if (ta.length || tl.length) {
    html += '<div class="' + (ta.length && tl.length ? 'st-grid2' : 'st-grid1') + '">';
    if (ta.length) {
      var amax = Math.max.apply(null, ta.map(function (a) { return a.plays || 0; }).concat([1]));
      html += '<div class="st-card st-fade"><div class="st-ch"><div><h2><a href="/artists">Top editors</a></h2><p>by plays on their edits and comps</p></div><a class="more" href="/artists">All editors</a></div><div class="st-list">' +
        ta.slice(0, 10).map(function (a, i) {
          return '<a class="st-row" href="/artist?id=' + encodeURIComponent(a.id) + '">' +
            '<span class="n">' + (i + 1) + '</span>' + stAvatar(a.display_name, a.profile_image_url, 'im round', 80) +
            '<div class="tx"><div class="a">' + stEsc(a.display_name || 'unknown') + '</div><div class="b">' + stNum(a.uploads || 0) + ' uploads · ' + stNum(a.followers || 0) + ' followers</div>' +
            '<div class="bar"><i style="width:' + Math.max(2, Math.round((a.plays || 0) / amax * 100)) + '%"></i></div></div>' +
            '<span class="val">' + stBig(a.plays || 0) + '<small>plays</small></span></a>';
        }).join('') + '</div></div>';
    }
    if (tl.length) {
      html += '<div class="st-card st-fade"><div class="st-ch"><div><h2>Most liked tracks</h2><p>all time, by likes</p></div></div><div class="st-list">' +
        tl.slice(0, 10).map(function (x, i) {
          var sub = [x.artist_name, x.album_title && x.album_title !== x.title ? 'from ' + x.album_title : ''].filter(Boolean).join(' · ');
          return '<a class="st-row" href="/track?id=' + encodeURIComponent(x.id) + '">' +
            '<span class="n">' + (i + 1) + '</span>' + stAvatar(x.title, x.cover_url, 'im', 80) +
            '<div class="tx"><div class="a">' + stEsc(x.title || 'untitled') + '</div><div class="b">' + stEsc(sub || (stNum(x.plays || 0) + ' plays')) + '</div></div>' +
            '<span class="val">' + ST_ICONS.heart + stNum(x.likes || 0) + '</span></a>';
        }).join('') + '</div></div>';
    }
    html += '</div>';
  }
  html += '<div class="st-card st-fade"><div class="st-ch"><div><h2><a href="/browse">Eras</a></h2><p id="st-era-sub">where the plays and releases go</p></div>' +
    '<div class="st-seg" role="group" aria-label="Rank eras by"><button type="button" aria-pressed="' + (window._stState.eraMode === 'plays') + '" onclick="stEraMode(\'plays\',this)">Plays</button><button type="button" aria-pressed="' + (window._stState.eraMode === 'releases') + '" onclick="stEraMode(\'releases\',this)">Releases</button></div></div>' +
    '<div id="st-eras-box"></div></div>';
  var ne = Array.isArray(d.newest_editors) ? d.newest_editors.filter(function (a) { return a && a.id; }) : [];
  if (ne.length) {
    html += '<div class="st-card st-fade"><div class="st-ch"><div><h2><a href="/artists">Newest editors</a></h2><p>say hi to the latest people on wavernrs</p></div><a class="more" href="/artists">Directory</a></div><div class="st-eds">' +
      ne.slice(0, 6).map(function (a) {
        var fresh = Date.now() - Date.parse(a.created_at) < 48 * 3600e3;
        return '<a class="st-ed" href="/artist?id=' + encodeURIComponent(a.id) + '">' + stAvatar(a.display_name, a.profile_image_url, 'av', 128) +
          '<div class="nm">' + stEsc(a.display_name || 'new editor') + '</div><div class="wh">joined ' + stEsc(stAgo(a.created_at)) + '</div>' +
          (fresh ? '<span class="st-new">new</span>' : (a.uploads ? '<span class="wh">' + stNum(a.uploads) + ' uploads</span>' : '')) + '</a>';
      }).join('') + '</div></div>';
  }
  html += '<div id="st-ye"></div>';
  var ttl = Math.round((+d.cache_ttl_s || 900) / 60);
  html += '<div class="st-foot"><span id="st-upd">updated ' + stEsc(d.generated_at ? stAgo(d.generated_at) : 'just now') + '</span><span>numbers refresh every ' + ttl + ' min</span><a href="/status">system status</a></div>';

  el.innerHTML = html;
  el.setAttribute('aria-busy', 'false');
  var sub = document.getElementById('st-sub');
  if (sub) sub.textContent = 'the whole site in numbers...refreshes every ' + ttl + ' min';
  stCountUp(el);
  stRenderEras();
  if (ub && ub.length) {
    var c1 = document.getElementById('st-c-up');
    c1.setAttribute('aria-label', 'Uploads per week chart. Use left and right arrow keys to read each week.');
    stColumns(c1, { rows: ub, keys: [{ k: 'comps', label: 'comps' }, { k: 'edits', label: 'edits' }], h: 230, titleFor: function (r) { return 'week of ' + stWeekLabel(r.week); } });
  }
  if (eb) { var c2 = document.getElementById('st-c-ed'); if (c2) { c2.setAttribute('aria-label', 'New editors per week chart'); stColumns(c2, { rows: eb, keys: [{ k: 'count', label: 'joined' }], h: 170, titleFor: function (r) { return 'week of ' + stWeekLabel(r.week); } }); } }
  if (gb) { var c3 = document.getElementById('st-c-lk'); if (c3) { c3.setAttribute('aria-label', 'Likes per week chart'); stColumns(c3, { rows: gb, keys: [{ k: 'likes', label: 'likes' }], h: 170, titleFor: function (r) { return 'week of ' + stWeekLabel(r.week); } }); } }
  stWireHeat(el);
  if (window._stState.ye) stYe(window._stState.ye);
  if (d.generated_at) {
    var tick = setInterval(function () { var u = document.getElementById('st-upd'); if (!u) { clearInterval(tick); return; } u.textContent = 'updated ' + stAgo(d.generated_at); }, 30000);
    window._pageCleanup.push(function () { clearInterval(tick); });
  }
}

async function loadStats() {
  window._stState = { eraMode: 'plays', eraAll: false, eraCovers: {}, eras: [], ye: null };
  var el = document.getElementById('st-body');
  api('/eratags').then(function (list) {
    var S = window._stState; if (!S || !Array.isArray(list)) return;
    list.forEach(function (e) { if (e && e.id && e.cover) S.eraCovers[e.id] = e.cover; });
    if (document.getElementById('st-eras-box')) stRenderEras();
  }).catch(function () {});
  api('/ye/status').then(function (y) { if (window._stState) { window._stState.ye = y; stYe(y); } }).catch(function () {});
  try {
    var d = await api('/stats');
    if (!document.getElementById('st-body')) return;
    window._stState.eras = d.eras || [];
    stRender(d || {});
  } catch (e) {
    if (e && e.navAborted) return;
    if (!el || !el.isConnected) return;
    el.setAttribute('aria-busy', 'false');
    el.innerHTML = '<div class="st-err"><b>couldnt load stats</b>' + escHtml(e && e.message ? e.message : 'try again in a minute') + '<br><button class="st-btn" type="button" onclick="loadStats()">Try again</button></div>';
  }
}
loadStats();
</script>
</body>
</html>
