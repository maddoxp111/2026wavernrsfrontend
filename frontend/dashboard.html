<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — dashboard</title>
  <link rel="stylesheet" href="/css/style.css?v=202609051937">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>


<div id="view">
<div class="container" style="padding-top:32px;padding-bottom:48px;">
  <div id="alert-container" style="margin-bottom:16px;"></div>
  <div class="dashboard-grid" id="dashboard">
    <div class="loading" style="grid-column:1/-1;"><div class="spinner"></div></div>
  </div>
</div>

<!-- Delete Edit Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <div class="modal-title">Delete edit?</div>
    <p style="font-size:14px;color:var(--text-secondary);">This will permanently remove the edit from your profile. The file will remain on Internet Archive.</p>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Delete Comp Confirm Modal -->
<div class="modal-overlay" id="delete-comp-modal">
  <div class="modal">
    <div class="modal-title">Delete comp?</div>
    <p style="font-size:14px;color:var(--text-secondary);">This will permanently remove the comp. The individual edits will not be deleted.</p>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteCompModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-comp-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Edit Edit Modal -->
<div class="modal-overlay" id="edit-track-modal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-title">Edit Edit</div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="edit-track-title" placeholder="Track name">
    </div>
    <div class="form-group">
      <label>Era Tag</label>
      <select id="edit-track-era"></select>
    </div>
    <div class="form-group">
      <label>Cover image URL</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="url" id="edit-track-cover" placeholder="https://..." style="flex:1;">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;white-space:nowrap;">
          Upload
          <input type="file" id="edit-track-cover-file" accept="image/*" style="display:none" onchange="uploadModalCover('edit-track-cover-file','edit-track-cover','edit-track-cover-status')">
        </label>
      </div>
      <span id="edit-track-cover-status" style="font-size:12px;color:var(--text-secondary);"></span>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="edit-track-desc" rows="2"></textarea>
    </div>
    <div id="edit-track-alert" style="margin-top:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditTrackModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditTrack()">Save</button>
    </div>
  </div>
</div>

<!-- Edit Comp Modal -->
<div class="modal-overlay" id="edit-album-modal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-title">Edit Comp</div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="edit-album-title" placeholder="Comp name">
    </div>
    <div class="form-group">
      <label>Era Tag</label>
      <select id="edit-album-era"></select>
    </div>
    <div class="form-group">
      <label>Cover image URL</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="url" id="edit-album-cover" placeholder="https://..." style="flex:1;">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;white-space:nowrap;">
          Upload
          <input type="file" id="edit-album-cover-file" accept="image/*" style="display:none" onchange="uploadModalCover('edit-album-cover-file','edit-album-cover','edit-album-cover-status')">
        </label>
      </div>
      <span id="edit-album-cover-status" style="font-size:12px;color:var(--text-secondary);"></span>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="edit-album-desc" rows="2"></textarea>
    </div>
    <div class="form-group" id="edit-album-tracklist-section" style="display:none;">
      <label style="display:flex;align-items:center;justify-content:space-between;">
        <span>Tracklist</span>
        <span id="edit-album-tracklist-saved" style="font-size:12px;color:var(--green);opacity:0;transition:opacity 0.4s;">Saved</span>
      </label>
      <div id="edit-album-tracklist" class="tracklist" style="margin-top:4px;"></div>
    </div>
    <div id="edit-album-alert" style="margin-top:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('edit-album-modal').classList.remove('open');editingAlbumId=null;">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditAlbum()">Save</button>
    </div>
  </div>
</div>
</div><!-- #view -->


<script src="/js/api.js?v=202609051937"></script>
<script src="/js/layout.js?v=202609051937"></script>
<script src="/js/player.js?v=202609051937"></script>
<script src="/js/router.js?v=202609051937"></script>
<script src="/js/playlists.js?v=202609051937"></script>
<script>
  if (!isLoggedIn()) navigate('/login.html');

  initPlayer();

  var me = null;
  var artist = null;
  var uploads = []; // mixed tracks (_type:'track') and albums (_type:'album'), sorted by created_at desc
  var eraTags = [];
  var statsData = null;
  var pendingDeleteId = null;
  var pendingDeleteCompId = null;

  // Upload state
  var selectedFiles = []; // array of File objects
  var editCoverFile = null;

  async function loadDashboard() {
    try {
      [me, eraTags] = await Promise.all([
        api('/auth/me'),
        api('/eratags').catch(() => []),
      ]);
      artist = me.artist;
      if (!artist || !artist.id) throw new Error('No artist profile found. Try logging out and back in.');
      // Blurred profile image as the page background (like the home hero).
      if (typeof window.setPageBgImage === 'function') {
        window.setPageBgImage(artist.profile_image_url || artist.banner_url || '');
      }
      const [allTracks, allComps] = await Promise.all([
        api(`/artists/${artist.id}/tracks`),
        api(`/albums/by-artist/${artist.id}`).catch(() => []),
      ]);
      uploads = [
        ...allTracks.map(t => ({ ...t, _type: 'track' })),
        ...allComps.map(a => ({ ...a, _type: 'album' })),
      ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      try { statsData = await api('/artists/' + artist.id + '/stats'); } catch(_) {}
      render();
      try { renderStatsCharts(); } catch(_) {}
    } catch (err) {
      if (err.message.includes('401')) return navigate('/login.html');
      showAlert('alert-container', 'Failed to load dashboard: ' + err.message);
    }
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function eraTagOptions(selectedId) {
    return `<option value="">No era tag</option>` +
      eraTags.map(t => `<option value="${t.id}" ${selectedId == t.id ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('');
  }

  function render() {
    const totalPlays = uploads.filter(u => u._type === 'track').reduce((s, t) => s + (t.play_count || 0), 0);
    const avatarContent = artist.profile_image_url
      ? `<img src="${escHtml(artist.profile_image_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : escHtml(artist.display_name?.[0]?.toUpperCase() || '?');

    // Stats card — shown at top of main content when stats are available
    var statsHtml = '';
    if (statsData) {
      var d = statsData;
      statsHtml = `
  <div class="card" style="padding:24px;margin-bottom:24px;">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
      <div style="font-size:15px;font-weight:700;">Your Stats</div>
      <div style="font-size:12px;color:var(--text-3);">Last 7 days</div>
    </div>

    <!-- Stat tiles -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;" class="stats-tiles">
      <div style="background:var(--surface-2);border-radius:var(--r-md);padding:14px 16px;">
        <div style="font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">🎵 Plays</div>
        <div style="font-size:24px;font-weight:800;letter-spacing:-0.03em;">${fmtNum(d.total_plays)}</div>
      </div>
      <div style="background:var(--surface-2);border-radius:var(--r-md);padding:14px 16px;">
        <div style="font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">❤️ Likes</div>
        <div style="font-size:24px;font-weight:800;letter-spacing:-0.03em;">${fmtNum(d.total_likes)}</div>
        ${d.likes_this_week > 0 ? `<div style="font-size:11px;color:var(--green);margin-top:2px;">+${d.likes_this_week} this week</div>` : ''}
      </div>
      <div style="background:var(--surface-2);border-radius:var(--r-md);padding:14px 16px;">
        <div style="font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">👥 Followers</div>
        <div style="font-size:24px;font-weight:800;letter-spacing:-0.03em;">${fmtNum(d.total_followers)}</div>
        ${d.followers_this_week > 0 ? `<div style="font-size:11px;color:var(--green);margin-top:2px;">+${d.followers_this_week} this week</div>` : ''}
      </div>
      <div style="background:var(--surface-2);border-radius:var(--r-md);padding:14px 16px;">
        <div style="font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">📤 Uploads</div>
        <div style="font-size:24px;font-weight:800;letter-spacing:-0.03em;">${uploads.length}</div>
      </div>
    </div>

    <!-- Two bar charts side by side -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:10px;">Likes (7 days)</div>
        <div style="height:120px;"><canvas id="chart-likes"></canvas></div>
      </div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:10px;">New Followers (7 days)</div>
        <div style="height:120px;"><canvas id="chart-followers"></canvas></div>
      </div>
    </div>

    <!-- Top tracks chart -->
    ${statsData.top_tracks && statsData.top_tracks.length ? `
    <div>
      <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:10px;">Top Tracks by Plays</div>
      <div style="height:${Math.max(80, statsData.top_tracks.length * 36)}px;"><canvas id="chart-top-tracks"></canvas></div>
    </div>` : ''}
  </div>`;
    }

    document.getElementById('dashboard').innerHTML = `
      <!-- Sidebar -->
      <div class="dashboard-sidebar">
        <!-- Profile card -->
        <div class="card" style="padding:20px;text-align:center;margin-bottom:16px;">
          <div style="width:72px;height:72px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin:0 auto 12px;overflow:hidden;">
            ${avatarContent}
          </div>
          <div style="font-weight:700;font-size:16px;">${escHtml(artist.display_name)}</div>
          <div style="font-size:13px;color:var(--text-secondary);">@${escHtml(me.username)}</div>
          <div style="display:flex;gap:16px;justify-content:center;margin-top:12px;">
            <div style="font-size:12px;color:var(--text-secondary);"><strong style="color:var(--text);font-size:16px;">${uploads.length}</strong><br>uploads</div>
            <div style="font-size:12px;color:var(--text-secondary);"><strong style="color:var(--text);font-size:16px;">${fmtNum(totalPlays)}</strong><br>plays</div>
          </div>
          ${artist && artist.id ? `<a href="/artist.html?id=${artist.id}" class="btn btn-secondary btn-sm" style="margin-top:14px;width:100%;justify-content:center;">View public page</a>` : ''}
        </div>

        <!-- Edit profile -->
        <div class="card" style="padding:20px;">
          <div style="font-size:14px;font-weight:600;margin-bottom:14px;">Edit Profile</div>
          <div class="form-group">
            <label>Display name</label>
            <input type="text" id="edit-name" value="${escHtml(artist.display_name || '')}" placeholder="Your name">
          </div>
          <div class="form-group">
            <label>Bio</label>
            <textarea id="edit-bio" rows="3" placeholder="Tell people about yourself…">${escHtml(artist.bio || '')}</textarea>
          </div>
          <div class="form-group">
            <label>Profile picture</label>
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
              <img id="profile_image_url-preview" src="${escHtml(artist.profile_image_url || '')}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--surface);${artist.profile_image_url ? '' : 'display:none;'}">
              <div>
                <input type="file" id="profile-img-file" accept="image/*" style="display:none" onchange="uploadProfileImage('profile-img-file', 'profile_image_url')">
                <button class="btn btn-secondary btn-sm" onclick="document.getElementById('profile-img-file').click()">Upload photo</button>
                <span id="profile_image_url-status" style="font-size:12px;color:var(--text-secondary);margin-left:8px;"></span>
              </div>
            </div>
            <input type="url" id="edit-avatar" value="${escHtml(artist.profile_image_url || '')}" placeholder="or paste image URL">
          </div>
          <div class="form-group">
            <label>Banner image</label>
            <div style="margin-bottom:8px;">
              <input type="file" id="banner-img-file" accept="image/*" style="display:none" onchange="uploadProfileImage('banner-img-file', 'banner_url')">
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('banner-img-file').click()">Upload banner</button>
              <span id="banner_url-status" style="font-size:12px;color:var(--text-secondary);margin-left:8px;"></span>
            </div>
            <input type="url" id="edit-banner" value="${escHtml(artist.banner_url || '')}" placeholder="or paste banner URL">
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="edit-location" value="${escHtml(artist.location || '')}" placeholder="City, Country">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label>Website</label>
            <input type="url" id="edit-website" value="${escHtml(artist.website || '')}" placeholder="https://...">
          </div>
          <div id="profile-alert" style="margin-top:10px;"></div>
          <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="saveProfile()">Save changes</button>
        </div>
      </div>

      <!-- Main content -->
      <div>
        ${statsHtml}
        <!-- Upload button -->
        <div class="wv-card" style="padding:24px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:15px;font-weight:600;margin-bottom:2px;">Upload Music</div>
            <div style="font-size:13px;color:var(--text-2);">Share an edit or comp with the community</div>
          </div>
          <a href="/upload.html" class="wv-pill brand" style="padding:10px 20px;text-decoration:none;">Upload</a>
        </div>

        <!-- Your Uploads -->
        <div>
          <div style="font-size:16px;font-weight:600;margin-bottom:16px;">Your Uploads <span style="color:var(--text-secondary);font-weight:400;font-size:14px;">(${uploads.length})</span></div>
          <div id="my-uploads"></div>
        </div>

        <!-- My Playlists -->
        <div style="margin-top:32px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <div style="font-size:16px;font-weight:600;">My Playlists</div>
            <button class="btn btn-secondary btn-sm" onclick="toggleNewPlaylistForm()">＋ New Playlist</button>
          </div>
          <div id="new-playlist-form" style="display:none;margin-bottom:16px;">
            <div style="display:flex;gap:8px;">
              <input type="text" id="new-playlist-title" placeholder="Playlist name…" style="flex:1;" onkeydown="if(event.key==='Enter')createDashboardPlaylist()">
              <button class="btn btn-primary btn-sm" onclick="createDashboardPlaylist()">Create</button>
              <button class="btn btn-secondary btn-sm" onclick="toggleNewPlaylistForm()">Cancel</button>
            </div>
          </div>
          <div id="my-playlists"></div>
        </div>
      </div>`;

    renderUploads();
    renderDashboardPlaylists();
  }

  function renderUploads() {
    const el = document.getElementById('my-uploads');
    if (!el) return; // guard: element might not exist if render() hasn't run yet
    if (!uploads.length) {
      el.innerHTML = `<div class="empty-state" style="padding:40px 0;"><div class="empty-title">No uploads yet</div><div class="empty-desc">Upload something above.</div></div>`;
      return;
    }
    el.innerHTML = `<div class="track-list">` + uploads.map(item => {
      const cover = item.cover_url ? `<img src="${escHtml(item.cover_url)}" alt="">` : '&#x1F3B5;';
      const isAlbum = item._type === 'album';
      const sub = isAlbum
        ? `Comp · ${timeAgo(item.created_at)}`
        : `${fmtNum(item.play_count)} plays · ${timeAgo(item.created_at)}`;
      const openHref = isAlbum ? `/album.html?id=${item.id}` : `/track.html?id=${item.id}`;
      return `
        <div class="track-row">
          <div class="track-row-cover">${cover}</div>
          <div class="track-row-info">
            <div class="track-row-title">${escHtml(item.title)}</div>
            <div class="track-row-artist">${sub}</div>
          </div>
          <div style="display:flex;gap:8px;margin-left:auto;">
            <a href="${openHref}" class="btn btn-secondary btn-sm">Open</a>
            <button class="btn btn-secondary btn-sm" onclick="${isAlbum ? `openEditAlbumModal(${JSON.stringify(item).replace(/"/g,'&quot;')})` : `openEditTrackModal(${JSON.stringify(item).replace(/"/g,'&quot;')})`}">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="${isAlbum ? `confirmDeleteComp('${item.id}')` : `confirmDelete('${item.id}')`}">Delete</button>
          </div>
        </div>`;
    }).join('') + `</div>`;

    // Wire IA CDN retry on cover images (new uploads appear after 1-3 min propagation)
    if (typeof wireIACoverRetry === 'function') {
      document.querySelectorAll('#my-uploads img').forEach(wireIACoverRetry);
    }
  }

  // ── Dashboard Playlists ──────────────────────────────────────────────────────
  var _myPlaylists = null; // cached after first fetch

  async function renderDashboardPlaylists() {
    var el = document.getElementById('my-playlists');
    if (!el) return;
    if (!isLoggedIn()) return;
    try {
      var data = await api('/playlists/mine');
      _myPlaylists = data || [];
    } catch (_) {
      _myPlaylists = _myPlaylists || [];
    }
    if (!_myPlaylists.length) {
      el.innerHTML = '<div style="font-size:13px;color:var(--text-3);padding:12px 0;">No playlists yet — create one above.</div>';
      return;
    }
    el.innerHTML = '<div class="track-list">' + _myPlaylists.map(function(p) {
      return '<div class="track-row" style="cursor:pointer;" onclick="navigate(\'/playlist.html?id=' + p.id + '\')">' +
        '<div class="track-row-cover" style="font-size:20px;display:flex;align-items:center;justify-content:center;">🎶</div>' +
        '<div class="track-row-info">' +
          '<div class="track-row-title">' + escHtml(p.title) + '</div>' +
          '<div class="track-row-artist">' + (p.track_count || 0) + ' track' + ((p.track_count || 0) !== 1 ? 's' : '') + (p.is_public ? '' : ' · 🔒 Private') + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-left:auto;">' +
          '<a href="/playlist.html?id=' + p.id + '" class="btn btn-secondary btn-sm" onclick="event.stopPropagation()">Open</a>' +
          '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteDashboardPlaylist(\'' + p.id + '\')">Delete</button>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function toggleNewPlaylistForm() {
    var form = document.getElementById('new-playlist-form');
    if (!form) return;
    var visible = form.style.display !== 'none';
    form.style.display = visible ? 'none' : '';
    if (!visible) {
      var inp = document.getElementById('new-playlist-title');
      if (inp) setTimeout(function() { inp.focus(); }, 50);
    }
  }

  async function createDashboardPlaylist() {
    var inp = document.getElementById('new-playlist-title');
    var title = inp ? inp.value.trim() : '';
    if (!title) { if (inp) inp.focus(); return; }
    try {
      var pl = await api('/playlists', { method: 'POST', body: JSON.stringify({ title: title, is_public: true }) });
      if (inp) inp.value = '';
      toggleNewPlaylistForm();
      if (typeof window.invalidatePlaylistCache === 'function') window.invalidatePlaylistCache();
      navigate('/playlist.html?id=' + pl.id);
    } catch (err) {
      alert('Could not create playlist: ' + err.message);
    }
  }

  async function deleteDashboardPlaylist(id) {
    if (!confirm('Delete this playlist? This cannot be undone.')) return;
    try {
      await api('/playlists/' + id, { method: 'DELETE' });
      if (_myPlaylists) _myPlaylists = _myPlaylists.filter(function(p) { return p.id !== id; });
      if (typeof window.invalidatePlaylistCache === 'function') window.invalidatePlaylistCache();
      renderDashboardPlaylists();
    } catch (err) {
      alert('Could not delete playlist: ' + err.message);
    }
  }
  // ────────────────────────────────────────────────────────────────────────────

  function cleanTitle(filename) {
    return filename.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ').trim();
  }

  function onFileSelect(e) {
    var newItems = Array.from(e.target.files).map(function(f) { return { file: f, title: cleanTitle(f.name) }; });
    selectedFiles = selectedFiles.concat(newItems);
    renderUploadQueue();
    e.target.value = '';
  }

  function onDrop(e) {
    e.preventDefault();
    document.getElementById('upload-zone').classList.remove('drag-over');
    var newItems = Array.from(e.dataTransfer.files)
      .filter(function(f) { return f.type.startsWith('audio/'); })
      .map(function(f) { return { file: f, title: cleanTitle(f.name) }; });
    selectedFiles = selectedFiles.concat(newItems);
    renderUploadQueue();
  }

  function renderUploadQueue() {
    var el = document.getElementById('upload-queue');
    var txt = document.getElementById('upload-zone-text');
    if (!selectedFiles.length) {
      el.innerHTML = '';
      txt.textContent = 'Drop audio file(s) here or click to add to queue';
      return;
    }
    txt.textContent = selectedFiles.length === 1
      ? '1 song queued — add more or press Upload'
      : selectedFiles.length + ' songs queued';
    el.innerHTML = selectedFiles.map(function(item, i) {
      return '<div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface-2);border-radius:var(--r-md);margin-bottom:6px;" draggable="true" id="qi-' + i + '"' +
        ' ondragstart="qDragStart(event,' + i + ')"' +
        ' ondragover="qDragOver(event,' + i + ')"' +
        ' ondrop="qDragDrop(event,' + i + ')"' +
        ' ondragend="qDragEnd()">' +
        '<span style="cursor:grab;color:var(--text-3);">⠿</span>' +
        '<span style="min-width:20px;font-size:12px;color:var(--text-3);">' + (i+1) + '</span>' +
        '<input type="text" value="' + escHtml(item.title) + '"' +
          ' oninput="selectedFiles[' + i + '].title=this.value"' +
          ' style="flex:1;background:transparent;border:none;border-bottom:1px solid var(--hair-strong);color:var(--text);font-size:13px;padding:2px 0;outline:none;" placeholder="Track title">' +
        '<span style="font-size:11px;color:var(--text-3);">' + (item.file.size/1024/1024).toFixed(1) + 'MB</span>' +
        '<button onclick="selectedFiles.splice(' + i + ',1);renderUploadQueue()" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:16px;line-height:1;">×</button>' +
      '</div>';
    }).join('');
  }

  var _qDragSrc = null;
  function qDragStart(e, i) {
    _qDragSrc = i;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(function() { var el = document.getElementById('qi-'+i); if (el) el.style.opacity = '0.4'; }, 0);
  }
  function qDragOver(e, i) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('[id^="qi-"]').forEach(function(el) { el.style.borderTop = ''; });
    if (i !== _qDragSrc) { var el = document.getElementById('qi-'+i); if (el) el.style.borderTop = '2px solid var(--purple)'; }
  }
  function qDragDrop(e, i) {
    e.stopPropagation();
    if (_qDragSrc === null || _qDragSrc === i) return;
    var moved = selectedFiles.splice(_qDragSrc, 1)[0];
    selectedFiles.splice(i, 0, moved);
    renderUploadQueue();
  }
  function qDragEnd() {
    _qDragSrc = null;
    document.querySelectorAll('[id^="qi-"]').forEach(function(el) { el.style.opacity = ''; el.style.borderTop = ''; });
  }

  async function doUpload() {
    const title = document.getElementById('upload-title').value.trim();
    const era_tag_id = document.getElementById('upload-era-tag').value;
    const description = document.getElementById('upload-desc').value.trim();
    const drive_url = document.getElementById('drive-url').value.trim();

    if (!selectedFiles.length && !drive_url) return showAlert('upload-alert', 'Add at least one audio file or paste a Drive link');
    if (!title && selectedFiles.length !== 1) return showAlert('upload-alert', 'Title is required');
    // For single-file uploads, fall back to the queue item's title
    var effectiveTitle = title || (selectedFiles[0] && selectedFiles[0].title) || '';

    const btn = document.getElementById('upload-btn');
    const progress = document.getElementById('upload-progress');
    const bar = document.getElementById('upload-bar');
    const statusEl = document.getElementById('upload-status');
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    progress.style.display = '';
    clearAlert('upload-alert');

    try {
      if (selectedFiles.length > 1) {
        // Step 1: create the album shell (with cover)
        statusEl.textContent = 'Creating comp…';
        bar.style.width = '8%';
        var albumForm = new FormData();
        albumForm.append('title', effectiveTitle);
        if (era_tag_id) albumForm.append('era_tag_id', era_tag_id);
        if (description) albumForm.append('description', description);
        if (editCoverFile) albumForm.append('cover_file', editCoverFile);
        var album = await apiUpload('/albums', albumForm);

        // Step 2: upload each track WITH album_id so it links immediately
        var linkErrors = [];
        for (var i = 0; i < selectedFiles.length; i++) {
          var item = selectedFiles[i];
          statusEl.textContent = 'Uploading ' + (i+1) + '/' + selectedFiles.length + ': ' + item.title + '…';
          bar.style.width = Math.round(8 + ((i + 1) / selectedFiles.length) * 82) + '%';
          var form = new FormData();
          form.append('file', item.file);
          form.append('title', item.title);
          form.append('album_id', album.id);
          form.append('track_position', String(i));
          if (era_tag_id) form.append('era_tag_id', era_tag_id);
          var t = await apiUpload('/tracks', form);
          if (t._link_error) {
            linkErrors.push('Track ' + (i+1) + ' (' + item.title + '): ' + t._link_error);
          }
        }

        if (linkErrors.length > 0) {
          throw new Error('Some tracks failed to link to the comp:\n' + linkErrors.join('\n'));
        }

        // Re-fetch album with its full tracklist
        album = await api('/albums/' + album.id);
        uploads.unshift({ ...album, _type: 'album' });
      } else {
        // Single file or drive link: create a track
        var form = new FormData();
        if (selectedFiles[0]) form.append('file', selectedFiles[0].file);
        if (drive_url) form.append('drive_url', drive_url);
        form.append('title', effectiveTitle);
        if (era_tag_id) form.append('era_tag_id', era_tag_id);
        if (description) form.append('description', description);
        if (editCoverFile) form.append('cover_file', editCoverFile);
        bar.style.width = '60%';
        statusEl.textContent = 'Uploading to Internet Archive…';
        var track = await apiUpload('/tracks', form);
        uploads.unshift({ ...track, _type: 'track' });
      }

      bar.style.width = '100%';
      // Reset form
      selectedFiles = [];
      editCoverFile = null;
      document.getElementById('upload-title').value = '';
      document.getElementById('upload-era-tag').value = '';
      document.getElementById('upload-desc').value = '';
      document.getElementById('drive-url').value = '';
      document.getElementById('cover-input').value = '';
      document.getElementById('file-input').value = '';
      document.getElementById('cover-zone-text').textContent = 'Drop image or click to browse';
      renderUploadQueue();
      renderUploads();
      showAlert('upload-alert', '&#x2713; Uploaded! Cover art may take 1–2 min to appear.', 'success');
    } catch (err) {
      showAlert('upload-alert', err.message || 'Upload failed');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Upload';
      setTimeout(() => { progress.style.display = 'none'; bar.style.width = '0%'; }, 3000);
    }
  }

  // Cover image handlers
  function onCoverDragOver(e) {
    e.preventDefault();
    document.getElementById('cover-zone').classList.add('drag-over');
  }
  function onCoverDragLeave() {
    document.getElementById('cover-zone').classList.remove('drag-over');
  }
  function onCoverDrop(e) {
    e.preventDefault();
    document.getElementById('cover-zone').classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) setCoverFile(file);
  }
  function onCoverSelect(e) {
    const file = e.target.files[0];
    if (file) setCoverFile(file);
  }
  function setCoverFile(file) {
    editCoverFile = file;
    document.getElementById('cover-zone-text').textContent = `&#x2713; ${file.name}`;
  }

  // Audio drag handlers
  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('upload-zone').classList.add('drag-over');
  }
  function onDragLeave() {
    document.getElementById('upload-zone').classList.remove('drag-over');
  }

  async function saveProfile() {
    clearAlert('profile-alert');
    const updates = {
      display_name: document.getElementById('edit-name').value.trim(),
      bio: document.getElementById('edit-bio').value.trim(),
      profile_image_url: document.getElementById('edit-avatar').value.trim(),
      banner_url: document.getElementById('edit-banner').value.trim(),
      location: document.getElementById('edit-location').value.trim(),
      website: document.getElementById('edit-website').value.trim(),
    };
    if (!updates.display_name) return showAlert('profile-alert', 'Display name is required');
    try {
      artist = await api(`/artists/${artist.id}`, {
        method: 'PUT',
        body: JSON.stringify(updates),
      });
      showAlert('profile-alert', '&#x2713; Profile saved', 'success');
    } catch (err) {
      showAlert('profile-alert', err.message);
    }
  }

  function confirmDelete(id) {
    pendingDeleteId = id;
    document.getElementById('delete-modal').classList.add('open');
    document.getElementById('confirm-delete-btn').onclick = doDelete;
  }

  function closeDeleteModal() {
    document.getElementById('delete-modal').classList.remove('open');
    pendingDeleteId = null;
  }

  async function doDelete() {
    if (!pendingDeleteId) return;
    try {
      await api(`/tracks/${pendingDeleteId}`, { method: 'DELETE' });
      uploads = uploads.filter(u => !(u.id === pendingDeleteId && u._type === 'track'));
      closeDeleteModal();
      renderUploads();
    } catch (err) {
      alert(err.message);
    }
  }

  function confirmDeleteComp(id) {
    pendingDeleteCompId = id;
    document.getElementById('delete-comp-modal').classList.add('open');
    document.getElementById('confirm-delete-comp-btn').onclick = doDeleteComp;
  }

  function closeDeleteCompModal() {
    document.getElementById('delete-comp-modal').classList.remove('open');
    pendingDeleteCompId = null;
  }

  async function doDeleteComp() {
    if (!pendingDeleteCompId) return;
    try {
      await api(`/albums/${pendingDeleteCompId}`, { method: 'DELETE' });
      uploads = uploads.filter(u => !(u.id === pendingDeleteCompId && u._type === 'album'));
      closeDeleteCompModal();
      renderUploads();
    } catch (err) {
      alert(err.message);
    }
  }

  // ── Edit Track Modal ──
  var editingTrackId = null;

  function openEditTrackModal(track) {
    editingTrackId = track.id;
    document.getElementById('edit-track-title').value = track.title || '';
    document.getElementById('edit-track-cover').value = track.cover_url || '';
    document.getElementById('edit-track-desc').value = track.description || '';
    api('/eratags').then(tags => {
      document.getElementById('edit-track-era').innerHTML =
        '<option value="">No era tag</option>' +
        tags.map(t => `<option value="${t.id}" ${track.era_tag_id === t.id ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('');
    }).catch(() => {});
    document.getElementById('edit-track-modal').classList.add('open');
  }

  function closeEditTrackModal() {
    document.getElementById('edit-track-modal').classList.remove('open');
    editingTrackId = null;
  }

  async function saveEditTrack() {
    const title = document.getElementById('edit-track-title').value.trim();
    if (!title) return showAlert('edit-track-alert', 'Title is required');
    clearAlert('edit-track-alert');
    try {
      const updated = await api(`/tracks/${editingTrackId}`, {
        method: 'PUT',
        body: JSON.stringify({
          title,
          era_tag_id: document.getElementById('edit-track-era').value || null,
          cover_url: document.getElementById('edit-track-cover').value.trim() || null,
          description: document.getElementById('edit-track-desc').value.trim() || null,
        }),
      });
      uploads = uploads.map(u => (u.id === editingTrackId && u._type === 'track') ? { ...u, ...updated, _type: 'track' } : u);
      closeEditTrackModal();
      renderUploads();
      showAlert('alert-container', '&#x2713; Edit updated', 'success');
    } catch (err) {
      showAlert('edit-track-alert', err.message);
    }
  }

  // ── Edit Album Modal ──
  var editingAlbumId = null;
  var _albumTracks = []; // mutable ordered array for the drag UI
  var _dragSrcIdx = null;

  function openEditAlbumModal(album) {
    editingAlbumId = album.id;
    document.getElementById('edit-album-title').value = album.title || '';
    document.getElementById('edit-album-cover').value = album.cover_url || '';
    document.getElementById('edit-album-desc').value = album.description || '';
    api('/eratags').then(tags => {
      document.getElementById('edit-album-era').innerHTML =
        '<option value="">No era tag</option>' +
        tags.map(t => `<option value="${t.id}" ${album.era_tag_id === t.id ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('');
    }).catch(() => {});
    // Fetch album tracks for the tracklist reorder UI
    _albumTracks = [];
    document.getElementById('edit-album-tracklist-section').style.display = 'none';
    document.getElementById('edit-album-modal').classList.add('open');
    api(`/albums/${album.id}`).then(function(fullAlbum) {
      var tracks = (fullAlbum.tracks || []).slice().sort(function(a, b) {
        return (a.position || 0) - (b.position || 0);
      });
      _albumTracks = tracks;
      if (tracks.length > 0) {
        document.getElementById('edit-album-tracklist-section').style.display = '';
        renderAlbumTracklist();
      }
    }).catch(function() {});
  }

  function renderAlbumTracklist() {
    var el = document.getElementById('edit-album-tracklist');
    if (!el) return;
    el.innerHTML = _albumTracks.map(function(track, i) {
      return '<div class="tracklist-item" draggable="true" id="ati-' + i + '"' +
        ' ondragstart="albumDragStart(event,' + i + ')"' +
        ' ondragover="albumDragOver(event,' + i + ')"' +
        ' ondrop="albumDragDrop(event,' + i + ')"' +
        ' ondragend="albumDragEnd()">' +
        '<div style="cursor:grab;padding:0 8px 0 0;font-size:16px;color:var(--text-secondary);user-select:none;flex-shrink:0;" title="Drag to reorder">⠿</div>' +
        '<div class="tracklist-num" style="min-width:20px;flex-shrink:0;">' + (i + 1) + '</div>' +
        '<div class="tracklist-info" style="flex:1;min-width:0;">' +
          '<div class="tracklist-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(track.title || track.track_title || '') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function albumDragStart(e, i) {
    _dragSrcIdx = i;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(i));
    setTimeout(function() {
      var el = document.getElementById('ati-' + i);
      if (el) el.style.opacity = '0.4';
    }, 0);
  }

  function albumDragOver(e, i) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('[id^="ati-"]').forEach(function(el) { el.style.borderTop = ''; });
    if (i !== _dragSrcIdx) {
      var el = document.getElementById('ati-' + i);
      if (el) el.style.borderTop = '2px solid var(--purple)';
    }
  }

  function albumDragDrop(e, i) {
    e.stopPropagation();
    e.preventDefault();
    if (_dragSrcIdx === null || _dragSrcIdx === i) return;
    var moved = _albumTracks.splice(_dragSrcIdx, 1)[0];
    _albumTracks.splice(i, 0, moved);
    renderAlbumTracklist();
    saveAlbumTracklist();
  }

  function albumDragEnd() {
    _dragSrcIdx = null;
    document.querySelectorAll('[id^="ati-"]').forEach(function(el) {
      el.style.opacity = '';
      el.style.borderTop = '';
    });
  }

  async function saveAlbumTracklist() {
    if (!editingAlbumId) return;
    var trackPayload = _albumTracks.map(function(t, i) {
      return { track_id: t.track_id || t.id, position: i + 1 };
    });
    try {
      await api('/albums/' + editingAlbumId + '/tracklist', {
        method: 'PUT',
        body: JSON.stringify({ tracks: trackPayload }),
      });
      var savedEl = document.getElementById('edit-album-tracklist-saved');
      if (savedEl) {
        savedEl.style.opacity = '1';
        setTimeout(function() { savedEl.style.opacity = '0'; }, 1500);
      }
    } catch (err) {
      showAlert('edit-album-alert', 'Failed to save order: ' + (err.message || 'error'));
    }
  }

  async function saveEditAlbum() {
    const title = document.getElementById('edit-album-title').value.trim();
    if (!title) return showAlert('edit-album-alert', 'Title is required');
    clearAlert('edit-album-alert');
    try {
      const updated = await api(`/albums/${editingAlbumId}`, {
        method: 'PUT',
        body: JSON.stringify({
          title,
          era_tag_id: document.getElementById('edit-album-era').value || null,
          cover_url: document.getElementById('edit-album-cover').value.trim() || null,
          description: document.getElementById('edit-album-desc').value.trim() || null,
        }),
      });
      uploads = uploads.map(u => (u.id === editingAlbumId && u._type === 'album') ? { ...u, ...updated, _type: 'album' } : u);
      document.getElementById('edit-album-modal').classList.remove('open');
      editingAlbumId = null;
      renderUploads();
      showAlert('alert-container', '&#x2713; Comp updated', 'success');
    } catch (err) {
      showAlert('edit-album-alert', err.message);
    }
  }

  async function uploadModalCover(inputId, urlFieldId, statusId) {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return;
    const statusEl = document.getElementById(statusId);
    if (statusEl) statusEl.textContent = 'Uploading…';
    try {
      const form = new FormData();
      form.append('image', file);
      const result = await apiUpload('/upload/image', form);
      const urlEl = document.getElementById(urlFieldId);
      if (urlEl) urlEl.value = result.url;
      if (statusEl) statusEl.textContent = '&#x2713; Uploaded';
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Upload failed';
    }
  }

  async function uploadProfileImage(inputId, field) {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return;
    const statusEl = document.getElementById(`${field}-status`);
    if (statusEl) statusEl.textContent = 'Uploading…';
    try {
      const form = new FormData();
      form.append('image', file);
      const result = await apiUpload('/upload/image', form);
      const url = result.url;
      if (field === 'profile_image_url') {
        document.getElementById('edit-avatar').value = url;
        const preview = document.getElementById('profile_image_url-preview');
        if (preview) { preview.src = url; preview.style.display = ''; }
      } else if (field === 'banner_url') {
        document.getElementById('edit-banner').value = url;
      }
      if (statusEl) statusEl.textContent = 'Saving…';

      // Auto-save immediately — don't force the user to also click "Save Profile"
      if (artist && artist.id) {
        await api(`/artists/${artist.id}`, {
          method: 'PUT',
          body: JSON.stringify({ [field]: url }),
        });
        // Keep local artist object in sync
        artist[field] = url;
      }

      if (statusEl) statusEl.textContent = '✓ Saved';
      setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 3000);
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Upload failed';
      alert('Image upload failed: ' + err.message);
    }
  }

  function renderStatsCharts() {
    if (!statsData) return;

    // Chart.js may not be loaded when arriving via SPA navigation (the <script src> in <head>
    // is not re-executed by the SPA router). Dynamically load it and retry if missing.
    if (typeof Chart === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
      s.onload = function() { renderStatsCharts(); };
      document.head.appendChild(s);
      return;
    }

    var isDark = document.getElementById('wv-root')?.classList.contains('theme-dark');
    var gridColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
    var labelColor = isDark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.45)';
    var brandColor = 'var(--purple)'; // purple brand
    var brand2Color = '#06b6d4'; // teal for followers

    var chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: isDark ? '#1e1e2e' : '#fff', titleColor: isDark ? '#fff' : '#000', bodyColor: isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.6)', borderColor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)', borderWidth: 1 },
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: { color: labelColor, font: { size: 11 } } },
        y: { grid: { color: gridColor }, ticks: { color: labelColor, font: { size: 11 } }, beginAtZero: true, precision: 0 },
      },
    };

    // Likes chart
    var likesCtx = document.getElementById('chart-likes');
    if (likesCtx && statsData.likes_by_day) {
      new Chart(likesCtx, {
        type: 'bar',
        data: {
          labels: statsData.likes_by_day.map(d => {
            var dt = new Date(d.date + 'T12:00:00');
            return dt.toLocaleDateString('en', { month: 'short', day: 'numeric' });
          }),
          datasets: [{ data: statsData.likes_by_day.map(d => d.count), backgroundColor: brandColor + 'cc', borderRadius: 6, borderSkipped: false }],
        },
        options: chartDefaults,
      });
    }

    // Followers chart
    var followersCtx = document.getElementById('chart-followers');
    if (followersCtx && statsData.followers_by_day) {
      new Chart(followersCtx, {
        type: 'bar',
        data: {
          labels: statsData.followers_by_day.map(d => {
            var dt = new Date(d.date + 'T12:00:00');
            return dt.toLocaleDateString('en', { month: 'short', day: 'numeric' });
          }),
          datasets: [{ data: statsData.followers_by_day.map(d => d.count), backgroundColor: brand2Color + 'cc', borderRadius: 6, borderSkipped: false }],
        },
        options: chartDefaults,
      });
    }

    // Top tracks horizontal bar chart
    var topCtx = document.getElementById('chart-top-tracks');
    if (topCtx && statsData.top_tracks && statsData.top_tracks.length) {
      var topOptions = JSON.parse(JSON.stringify(chartDefaults));
      topOptions.indexAxis = 'y';
      topOptions.scales.x.ticks.font = { size: 11 };
      topOptions.scales.y.ticks.font = { size: 11 };
      new Chart(topCtx, {
        type: 'bar',
        data: {
          labels: statsData.top_tracks.map(t => t.title.length > 22 ? t.title.slice(0, 22) + '…' : t.title),
          datasets: [{ data: statsData.top_tracks.map(t => t.play_count), backgroundColor: brandColor + 'cc', borderRadius: 6, borderSkipped: false }],
        },
        options: topOptions,
      });
    }
  }

  loadDashboard();
</script>
