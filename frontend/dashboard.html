<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — creator studio</title>
  <link rel="stylesheet" href="/css/style.css?v=30f4b61d2d06">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/js/status-card.js?v=30f4b61d2d06"></script>
  <script src="/js/down.js?v=30f4b61d2d06"></script>
  <style id="st-studio-css">
    .st-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 0 56px; }
    .st-card { background: var(--surface); border-radius: 14px; padding: 22px; position: relative; }
    .st-h { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin: 0; color: var(--text); }
    .st-h3 { font-size: 13px; font-weight: 700; color: var(--text); margin: 0; letter-spacing: -0.005em; }
    .st-sub { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
    .st-muted { color: var(--text-3); }

    .st-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }
    .st-hero-av { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; flex: none; position: relative; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: rgba(255,255,255,.92); box-shadow: 0 8px 26px rgba(0,0,0,.28); }
    .st-hero-av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .st-hero-main { flex: 1; min-width: 200px; }
    .st-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }
    .st-hero-name { font-size: clamp(26px, 4vw, 36px); font-weight: 900; letter-spacing: -0.035em; line-height: 1.05; margin: 3px 0 5px; color: var(--text); overflow-wrap: anywhere; }
    .st-hero-meta { font-size: 13px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .st-hero-meta b { color: var(--text); font-weight: 700; }
    .st-hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .st-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--text); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, transform .15s; }
    .st-btn:hover { background: var(--surface-3); }
    .st-btn:active { transform: scale(.97); }
    .st-btn.brand { background: var(--brand); color: var(--on-brand); }
    .st-btn.brand:hover { filter: brightness(1.06); }
    .st-btn svg { flex: none; }
    .st-btn:focus-visible, .st-ib:focus-visible, .st-seg button:focus-visible, .st-link:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

    .st-studio-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .st-seg button { min-height: 32px; padding: 6px 14px; }
    .st-studio.busy .st-kpis, .st-studio.busy .st-panels { opacity: .55; transition: opacity .2s; pointer-events: none; }

    .st-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .st-kpi { background: var(--surface-2); border-radius: 12px; padding: 14px 16px 12px; min-width: 0; display: flex; flex-direction: column; }
    .st-kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .st-kpi-l { font-size: 11.5px; font-weight: 700; color: var(--text-2); letter-spacing: .02em; }
    .st-kpi-v { font-size: 28px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; margin: 6px 0 4px; color: var(--text); font-variant-numeric: tabular-nums; }
    .st-kpi-foot { font-size: 11.5px; color: var(--text-3); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-spark { display: block; width: 100%; height: 34px; color: var(--brand); overflow: visible; }
    .st-spark-empty { height: 34px; display: flex; align-items: flex-end; }
    .st-spark-empty i { display: block; width: 100%; border-top: 2px dashed var(--hair-strong); }

    .st-delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .st-delta svg { width: 9px; height: 9px; }
    .st-delta.up { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
    .st-delta.down { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
    .st-delta.flat { color: var(--text-3); background: var(--surface-3); }
    .st-delta.new { color: var(--brand); background: var(--brand-bg); }

    .st-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .st-panel { background: var(--surface-2); border-radius: 12px; padding: 16px; min-width: 0; }
    .st-span2 { grid-column: 1 / -1; }
    .st-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .st-legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
    .st-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .st-legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--brand); }
    .st-legend i.dash { border-top: 2px dashed var(--text-3); }
    .st-chart { position: relative; height: 230px; }
    .st-chart.sm { height: 140px; }
    .st-note { font-size: 11.5px; color: var(--text-3); margin-top: 10px; }
    .st-total { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }

    .st-top { display: flex; flex-direction: column; gap: 2px; }
    .st-top-row { display: grid; grid-template-columns: 18px 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 8px; text-decoration: none; color: inherit; }
    .st-top-row:hover { background: var(--surface-3); }
    .st-top-n { font-size: 12px; font-weight: 700; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; }
    .st-top-art { width: 36px; height: 36px; border-radius: 6px; overflow: hidden; position: relative; flex: none; }
    .st-top-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .st-top-t { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-bar { display: block; height: 4px; border-radius: 4px; background: var(--surface-3); margin-top: 6px; overflow: hidden; }
    .st-bar i { display: block; height: 100%; border-radius: 4px; background: var(--brand); }
    .st-top-v { text-align: right; font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .st-top-v small { display: block; font-size: 11px; font-weight: 600; color: var(--text-3); }

    .st-feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
    .st-feed li { display: flex; align-items: center; gap: 11px; padding: 8px 2px; border-bottom: 1px solid var(--hair); min-width: 0; }
    .st-feed li:last-child { border-bottom: 0; }
    .st-feed-ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-3); color: var(--text-2); }
    .st-feed-ic.like { color: var(--pink); background: color-mix(in srgb, var(--pink) 15%, transparent); }
    .st-feed-ic.follow { color: var(--brand); background: var(--brand-bg); }
    .st-feed-ic.award { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 16%, transparent); }
    .st-feed-t { flex: 1; min-width: 0; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-feed-t b { color: var(--text); font-weight: 650; }
    .st-feed-w { font-size: 11.5px; color: var(--text-3); flex: none; font-variant-numeric: tabular-nums; }
    .st-empty-sm { font-size: 13px; color: var(--text-3); padding: 18px 4px; text-align: center; line-height: 1.5; }

    .st-row2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
    .st-ms { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; }
    .st-ms-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; }
    .st-ms-l { color: var(--text); font-weight: 650; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-ms-l small { color: var(--text-3); font-weight: 500; margin-left: 4px; }
    .st-ms-v { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .st-ms-v b { color: var(--text); }
    .st-ms-bar { height: 8px; border-radius: 8px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
    .st-ms-bar i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--brand-2, var(--brand)), var(--brand)); transform-origin: left; animation: st-grow .9s cubic-bezier(.22,.61,.36,1) both; }
    .st-ms-foot { font-size: 11.5px; color: var(--text-3); margin-top: 5px; }
    @keyframes st-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .st-awards { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .st-award { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 9px; border-radius: 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--yellow) 16%, var(--surface-2)), var(--surface-2)); min-width: 0; max-width: 100%; }
    .st-award-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--yellow); flex: none; }
    .st-award-t { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-award-s { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-rating { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hair); }
    .st-rating-v { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
    .st-stars { display: flex; gap: 2px; color: var(--yellow); }
    .st-stars .off { color: var(--surface-3); }

    .st-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; margin-top: 16px; align-items: start; }
    .st-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .st-count { font-size: 13px; font-weight: 600; color: var(--text-3); margin-left: 6px; }
    .st-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .st-link { background: none; border: 0; color: var(--text-2); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 8px 6px; min-height: 36px; display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; }
    .st-link:hover { color: var(--text); }

    .st-ups { display: flex; flex-direction: column; }
    .st-up { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; min-width: 0; }
    .st-up:hover { background: var(--surface-2); }
    .st-up-cover { width: 48px; height: 48px; border-radius: 6px; overflow: hidden; position: relative; flex: none; display: block; }
    .st-up-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .st-up-main { flex: 1; min-width: 0; }
    .st-up-title { display: block; font-size: 14px; font-weight: 650; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-up-title:hover { text-decoration: underline; }
    .st-up-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
    .st-up-sub > span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .st-tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--surface-3); color: var(--text-2); flex: none; }
    .st-tag.warn { background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--text); }
    .st-tag.draft { background: transparent; border: 1px dashed var(--text-3); }
    .st-up-plays { font-size: 13px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; flex: none; min-width: 52px; text-align: right; }
    .st-up-acts { display: flex; gap: 2px; flex: none; }
    .st-ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; cursor: pointer; text-decoration: none; transition: background .15s, color .15s; }
    .st-ib:hover { background: var(--surface-3); color: var(--text); }
    .st-ib.danger:hover { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }

    .st-pl-cover { width: 48px; height: 48px; border-radius: 6px; overflow: hidden; position: relative; flex: none; }

    .st-side .form-group { margin-bottom: 14px; }
    .st-side .form-group label { font-size: 12.5px; }
    .st-side input[type=text], .st-side input[type=url], .st-side textarea { width: 100%; }

    .st-skel { border-radius: 12px; background: var(--surface-2); position: relative; overflow: hidden; }
    .st-skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 6%, transparent), transparent); animation: st-shine 1.3s infinite; }
    @keyframes st-shine { to { transform: translateX(100%); } }

    @media (max-width: 1000px) {
      .st-grid { grid-template-columns: minmax(0, 1fr); }
      .st-row2 { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 860px) {
      .st-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .st-wrap { padding-top: 12px; }
      .st-panels { grid-template-columns: minmax(0, 1fr); }
      .st-card { padding: 16px; border-radius: 12px; }
      .st-hero { gap: 14px; }
      .st-hero-av { width: 60px; height: 60px; font-size: 24px; }
      .st-hero-actions { width: 100%; }
      .st-hero-actions .st-btn { flex: 1 1 auto; padding: 0 12px; }
      .st-kpi { padding: 12px 12px 10px; }
      .st-kpi-v { font-size: 24px; }
      .st-chart { height: 200px; }
      .st-up { padding: 6px 2px; gap: 10px; }
      .st-up-plays { display: none; }
      .st-up-acts .st-open { display: none; }
      .st-studio-head .wv-seg { width: 100%; display: flex; }
      .st-studio-head .wv-seg button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .st-ms-bar i, .st-skel::after { animation: none; }
      .st-btn, .st-ib { transition: none; }
    }
  </style>
</head>
<body>


<div id="view">
<div class="container st-wrap">
  <div id="alert-container"></div>
  <div id="dashboard" aria-busy="true">
    <div class="st-hero"><div class="st-hero-av st-skel" style="border-radius:50%;"></div><div class="st-hero-main"><div class="st-skel" style="height:12px;width:110px;border-radius:6px;"></div><div class="st-skel" style="height:30px;width:220px;margin-top:10px;border-radius:8px;"></div></div></div>
    <div class="st-card"><div class="st-skel" style="height:20px;width:120px;border-radius:6px;margin-bottom:18px;"></div><div class="st-kpis"><div class="st-skel" style="height:120px;"></div><div class="st-skel" style="height:120px;"></div><div class="st-skel" style="height:120px;"></div><div class="st-skel" style="height:120px;"></div></div><div class="st-skel" style="height:260px;"></div></div>
  </div>
</div>

<!-- Delete Edit Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <div class="modal-title">Delete edit?</div>
    <p style="font-size:14px;color:var(--text-secondary);">this deletes the edit from your profile for good. the file stays on Internet Archive tho.</p>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Delete Comp Confirm Modal -->
<div class="modal-overlay" id="delete-comp-modal">
  <div class="modal">
    <div class="modal-title">Delete comp?</div>
    <p style="font-size:14px;color:var(--text-secondary);">this deletes the comp and every edit in it for good.</p>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteCompModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-comp-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Edit Edit Modal -->
<div class="modal-overlay" id="edit-track-modal">
  <div class="modal" style="max-width:min(520px,100%);">
    <div class="modal-title">Edit Edit</div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="edit-track-title" placeholder="Track name">
    </div>
    <div class="form-group">
      <label>Era Tag</label>
      <select id="edit-track-era"></select>
    </div>
    <div class="form-group">
      <label>Cover image URL</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="url" id="edit-track-cover" placeholder="https://..." style="flex:1;">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;white-space:nowrap;">
          Upload
          <input type="file" id="edit-track-cover-file" accept="image/*" style="display:none" onchange="uploadModalCover('edit-track-cover-file','edit-track-cover','edit-track-cover-status')">
        </label>
      </div>
      <span id="edit-track-cover-status" style="font-size:12px;color:var(--text-secondary);"></span>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="edit-track-desc" rows="2"></textarea>
    </div>
    <div id="edit-track-alert" style="margin-top:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditTrackModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditTrack()">Save</button>
    </div>
  </div>
</div>

<!-- Edit Comp Modal -->
<div class="modal-overlay" id="edit-album-modal">
  <div class="modal" style="max-width:min(520px,100%);">
    <div class="modal-title">Edit Comp</div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="edit-album-title" placeholder="Comp name">
    </div>
    <div class="form-group">
      <label>Era Tag</label>
      <select id="edit-album-era"></select>
    </div>
    <div class="form-group">
      <label>Cover image URL</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="url" id="edit-album-cover" placeholder="https://..." style="flex:1;">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;white-space:nowrap;">
          Upload
          <input type="file" id="edit-album-cover-file" accept="image/*" style="display:none" onchange="uploadModalCover('edit-album-cover-file','edit-album-cover','edit-album-cover-status')">
        </label>
      </div>
      <span id="edit-album-cover-status" style="font-size:12px;color:var(--text-secondary);"></span>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="edit-album-desc" rows="2"></textarea>
    </div>
    <div class="form-group" id="edit-album-tracklist-section" style="display:none;">
      <label style="display:flex;align-items:center;justify-content:space-between;">
        <span>Tracklist</span>
        <span id="edit-album-tracklist-saved" style="font-size:12px;color:var(--green);opacity:0;transition:opacity 0.4s;">Saved</span>
      </label>
      <div id="edit-album-tracklist" class="tracklist" style="margin-top:4px;"></div>
    </div>
    <div id="edit-album-alert" style="margin-top:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('edit-album-modal').classList.remove('open');editingAlbumId=null;">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditAlbum()">Save</button>
    </div>
  </div>
</div>
</div><!-- #view -->

<script src="/js/api.js?v=30f4b61d2d06"></script>
<script src="/js/layout.js?v=30f4b61d2d06"></script>
<script src="/js/player.js?v=30f4b61d2d06"></script>
<script src="/js/router.js?v=30f4b61d2d06"></script>
<script src="/js/playlists.js?v=30f4b61d2d06"></script>
<script>
  initPlayer();

  var me = null;
  var artist = null;
  var uploads = [];
  var eraTags = [];
  var statsData = null;
  var pendingDeleteId = null;
  var pendingDeleteCompId = null;
  var _stCharts = [];
  var _stReq = 0;
  var _upFilter = 'all';
  var _upSort = 'new';
  var _stDays = (function () {
    try { var v = parseInt(localStorage.getItem('wv_studio_days'), 10); return [7, 30, 90].indexOf(v) !== -1 ? v : 30; } catch (_) { return 30; }
  })();

  window._pageCleanup = window._pageCleanup || [];
  window._pageCleanup.push(function () { stDestroyCharts(); });

  var ST_ICON = {

  function stShort(n) {
    n = Number(n) || 0;
    var f = function (v, u) { var r = v >= 100 ? Math.round(v) : Math.round(v * 10) / 10; return String(r).replace(/\.0$/, '') + u; };
    if (n >= 1000000) return f(n / 1000000, 'M');
    if (n >= 1000) return f(n / 1000, 'K');
    return String(n);
  }

  function stNum(n) {
    n = Number(n) || 0;
    return n < 10000 ? n.toLocaleString('en-US') : fmtNum(n);

  function stProfilePlays() {
    var p = 0;
    uploads.forEach(function (u) { if (!u.collab) p += (u.play_count || 0); });

  function stOwnReleases() {
    return uploads.filter(function (u) { return !u.collab; }).length;

  async function loadDashboard() {
    try {
      var first = await Promise.all([
        api('/auth/me'),
        api('/eratags').catch(function () { return []; }),
      ]);
      me = first[0];
      eraTags = first[1] || [];
      artist = me.artist;
      if (!artist || !artist.id) throw new Error('no artist profile found...try logging out and back in');
      if (typeof window.setPageBgImage === 'function') {
        window.setPageBgImage(artist.profile_image_url || artist.banner_url || '');
      }
      var reqId = ++_stReq;
      var rest = await Promise.all([
        api('/artists/' + artist.id + '/tracks'),
        api('/albums/by-artist/' + artist.id).catch(function () { return []; }),
        api('/artists/' + artist.id + '/stats?days=' + _stDays).catch(function () { return null; }),
        api('/artists/' + artist.id + '/follow').catch(function () { return null; }),
      ]);
      uploads = (rest[0] || []).map(function (t) { return Object.assign({}, t, { _type: 'track' }); })
        .concat((rest[1] || []).map(function (a) { return Object.assign({}, a, { _type: 'album' }); }))
        .sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      if (reqId === _stReq) statsData = rest[2];
      if (rest[3] && statsData && statsData.total_followers == null) statsData.total_followers = rest[3].follower_count;
      artist._followers = statsData && statsData.total_followers != null ? statsData.total_followers : (rest[3] ? rest[3].follower_count : null);
      render();
    } catch (err) {
      var msg = String((err && err.message) || err || '');
      if (msg.indexOf('401') !== -1) return navigate('/login');
      var box = document.getElementById('dashboard');
      if (box) {
        box.removeAttribute('aria-busy');
        box.innerHTML = '<div class="st-card" style="text-align:center;padding:48px 20px;">' +
          '<div class="st-h" style="font-size:18px;">couldnt load your studio</div>' +
          '<div class="st-sub" style="margin:6px 0 18px;">' + escHtml(msg || 'something went wrong') + '</div>' +
          '<button class="st-btn brand" onclick="retryDashboard()">Try again</button></div>';
      }
    }
  }

  function stSeries(list) {
    return (list || []).map(function (d) { return Number(d.count) || 0; });
  }

  function stSpark(values, label) {
    if (!values || values.length < 2) return '<div class="st-spark-empty" aria-hidden="true"><i></i></div>';
    var max = Math.max.apply(null, values), min = 0;
    if (max <= 0) return '<div class="st-spark-empty" aria-hidden="true"><i></i></div>';
    var W = 100, H = 30, n = values.length;
    var pts = values.map(function (v, i) {
      var x = (i / (n - 1)) * W;
      var y = H - 2 - ((v - min) / (max - min || 1)) * (H - 4);
      return [Math.round(x * 100) / 100, Math.round(y * 100) / 100];
    });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0] + ' ' + p[1]; }).join(' ');
    var area = line + ' L' + W + ' ' + H + ' L0 ' + H + ' Z';
    return '<svg class="st-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + escHtml(label || 'trend') + '">' +
      '<path d="' + area + '" fill="currentColor" opacity=".13"/>' +
      '<path d="' + line + '" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
      '</svg>';
  }

  function stDelta(cur, prev, days) {
    cur = Number(cur) || 0; prev = Number(prev) || 0;
    var tip = 'vs ' + stNum(prev) + ' in the ' + days + ' days before';
    if (!cur && !prev) return '<span class="st-delta flat" title="' + escHtml(tip) + '">—</span>';
    if (!prev) return '<span class="st-delta new" title="' + escHtml(tip) + '">new</span>';
    var pct = Math.round(((cur - prev) / prev) * 100);
    if (pct === 0) return '<span class="st-delta flat" title="' + escHtml(tip) + '">0%</span>';
    var up = pct > 0;
    var shown = Math.abs(pct) >= 1000 ? (up ? '10x+' : '99%') : Math.abs(pct) + '%';
    return '<span class="st-delta ' + (up ? 'up' : 'down') + '" title="' + escHtml(tip) + '"><span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">' + (up ? 'up' : 'down') + '</span>' + (up ? ST_ICON.up : ST_ICON.down) + shown + '</span>';
  }

  function stKpi(label, value, deltaHtml, spark, foot) {
    return '<div class="st-kpi">' +
      '<div class="st-kpi-top"><span class="st-kpi-l">' + escHtml(label) + '</span>' + (deltaHtml || '') + '</div>' +
      '<div class="st-kpi-v">' + value + '</div>' +
      spark +
      '<div class="st-kpi-foot">' + foot + '</div>' +
    '</div>';
  }

  function renderStudio() {
    var el = document.getElementById('st-studio');
    if (!el) return;
    el.classList.remove('busy');
    var d = statsData;
    if (!d) {
      el.innerHTML = '<div class="st-studio-head"><div><h2 class="st-h" id="st-title">Studio</h2><div class="st-sub">your stats couldnt load right now</div></div>' +
        '<button class="st-btn" onclick="setStudioRange(' + _stDays + ')">Try again</button></div>';
      renderMilestones();
      renderAwards();
      return;
    }
    var ranged = stHasRange(d);
    var days = ranged ? (d.days || _stDays) : 7;
    var profilePlays = stProfilePlays();
    var head = '<div class="st-studio-head">' +
      '<div><h2 class="st-h" id="st-title">Studio</h2>' +
      '<div class="st-sub">' + (ranged ? 'last ' + days + ' days, compared with the ' + days + ' before' : 'last 7 days') + '</div></div>' +
      (ranged ? '<div class="wv-seg st-seg" role="group" aria-label="date range">' +
        [7, 30, 90].map(function (n) { return '<button class="' + (n === days ? 'on' : '') + '" aria-pressed="' + (n === days) + '" onclick="setStudioRange(' + n + ')">' + n + 'd</button>'; }).join('') +
      '</div>' : '') +
    '</div>';

    var kpis;
    if (ranged) {
      var dl = d.deltas || {};
      var g = function (k) { return dl[k] || { current: 0, previous: 0 }; };
      kpis = [
        stKpi('Plays', stNum(g('plays').current), stDelta(g('plays').current, g('plays').previous, days), stSpark(stSeries(d.plays_by_day), 'plays per day'), stNum(profilePlays || d.total_plays) + ' all time'),
        stKpi('Listeners', stNum(g('listeners').current), stDelta(g('listeners').current, g('listeners').previous, days), stSpark(stSeries(d.listeners_by_day), 'listeners per day'), 'unique per comp per day'),
        stKpi('Likes', stNum(g('likes').current), stDelta(g('likes').current, g('likes').previous, days), stSpark(stSeries(d.likes_by_day), 'likes per day'), stNum(d.total_likes) + ' all time'),
        stKpi('Followers', '+' + stNum(g('followers').current), stDelta(g('followers').current, g('followers').previous, days), stSpark(stSeries(d.followers_by_day), 'new followers per day'), stNum(d.total_followers) + ' total'),
      ].join('');
    } else {
      kpis = [
        stKpi('Plays', stNum(profilePlays || d.total_plays), '', '<div class="st-spark-empty" aria-hidden="true"><i></i></div>', 'all time'),
        stKpi('Likes', stNum(d.likes_this_week || 0), '', stSpark(stSeries(d.likes_by_day), 'likes per day'), stNum(d.total_likes) + ' all time'),
        stKpi('Followers', '+' + stNum(d.followers_this_week || 0), '', stSpark(stSeries(d.followers_by_day), 'new followers per day'), stNum(d.total_followers) + ' total'),
        stKpi('Uploads', stNum(stOwnReleases()), '', '<div class="st-spark-empty" aria-hidden="true"><i></i></div>', 'comps and edits'),
      ].join('');
    }

    var sumOf = function (arr) { return stSeries(arr).reduce(function (s, n) { return s + n; }, 0); };
    var hasEdits = uploads.some(function (u) { return u._type === 'track' && !u.collab; });
    var panels = '';
    if (ranged) {
      panels += '<div class="st-panel st-span2">' +
        '<div class="st-panel-head"><h3 class="st-h3">Plays and listeners</h3>' +
          '<div class="st-legend"><span><i></i>Plays</span><span><i class="dash"></i>Listeners</span></div></div>' +
        '<div class="st-chart"><canvas id="chart-plays" role="img" aria-label="plays and listeners per day"></canvas></div>' +
        (hasEdits ? '<div class="st-note">daily numbers come from your comps. standalone edit plays count toward your all time total.</div>' : '') +
      '</div>';
    }
    panels += '<div class="st-panel">' +
        '<div class="st-panel-head"><h3 class="st-h3">Likes</h3><span class="st-total">' + stNum(sumOf(d.likes_by_day)) + ' in ' + days + 'd</span></div>' +
        '<div class="st-chart sm"><canvas id="chart-likes" role="img" aria-label="likes per day"></canvas></div>' +
      '</div>' +
      '<div class="st-panel">' +
        '<div class="st-panel-head"><h3 class="st-h3">New followers</h3><span class="st-total">' + stNum(sumOf(d.followers_by_day)) + ' in ' + days + 'd</span></div>' +
        '<div class="st-chart sm"><canvas id="chart-followers" role="img" aria-label="new followers per day"></canvas></div>' +
      '</div>';

    panels += '<div class="st-panel">' + stTopHTML(d, ranged, days) + '</div>';
    panels += '<div class="st-panel">' + stActivityHTML(d) + '</div>';

    el.innerHTML = head + '<div class="st-kpis">' + kpis + '</div><div class="st-panels">' + panels + '</div>';
    if (typeof wireIACoverRetry === 'function') el.querySelectorAll('img').forEach(wireIACoverRetry);
    renderMilestones();
    renderAwards();
    renderStatsCharts();
  }

  function stCover(url, seed, px) {
    var bg = coverGradient(seed || '');
    var img = url ? '<img src="' + escHtml(typeof wvImg === 'function' ? wvImg(url, px || 96) : url) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
    return '<div class="st-top-art" style="background:' + bg + ';">' + img + '</div>';
  }

  function stRowsHTML(rows) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.v || 0; })) || 1;
    return '<div class="st-top">' + rows.map(function (r, i) {
      return '<a class="st-top-row" href="' + escHtml(r.href) + '">' +
        '<span class="st-top-n">' + (i + 1) + '</span>' +
        stCover(r.cover, r.title) +
        '<span style="min-width:0;"><span class="st-top-t" style="display:block;">' + escHtml(r.title || 'Untitled') + '</span>' +
          '<span class="st-bar" aria-hidden="true"><i style="width:' + Math.max(3, Math.round(((r.v || 0) / max) * 100)) + '%;"></i></span></span>' +
        '<span class="st-top-v">' + stNum(r.v) + '<small>' + escHtml(r.small || '') + '</small></span>' +
      '</a>';
    }).join('') + '</div>';
  }

  function stTrackRows(d, n) {
    return (d.top_tracks || []).slice(0, n).map(function (t) {
      var up = (t.album_id && uploads.find(function (u) { return u.id === t.album_id; })) || uploads.find(function (u) { return u.id === t.id; });
      return { href: '/track?id=' + t.id, title: t.title, cover: up && up.cover_url, v: t.play_count, small: up ? (up._type === 'album' ? up.title : 'edit') : 'plays' };
    });
  }

  function stTopHTML(d, ranged, days) {
    var head = function (t, sub) { return '<div class="st-panel-head"><h3 class="st-h3">' + escHtml(t) + '</h3><span class="st-total">' + escHtml(sub) + '</span></div>'; };
    var comps = ranged && Array.isArray(d.top_comps) ? d.top_comps.slice(0, 6).map(function (c) {
      return { href: '/album?id=' + c.id, title: c.title, cover: c.cover_url, v: c.plays, small: stNum(c.listeners) + ' listener' + (c.listeners === 1 ? '' : 's') };
    }) : null;
    var tracks = stTrackRows(d, 5);
    if (!comps) {
      if (!tracks.length) return head('Top tracks', 'all time') + '<div class="st-empty-sm">no plays yet. share something and itll show up here</div>';
      return head('Top tracks', 'all time') + stRowsHTML(tracks);
    }
    var html = head('Top comps', 'by plays in ' + days + 'd');
    html += comps.length ? stRowsHTML(comps) : '<div class="st-empty-sm">no comp plays in this range yet</div>';
    if (comps.length < 4 && tracks.length) {
      html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);">' + head('Top tracks', 'all time') + stRowsHTML(tracks.slice(0, Math.max(2, 5 - comps.length))) + '</div>';
    }
    return html;
  }

  function stAgo(iso) {
    var t = Date.parse(iso);
    if (!t) return '';
    var diff = Date.now() - t;
    if (diff < 60000) return 'just now';
    var m = Math.floor(diff / 60000);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var dd = Math.floor(h / 24);
    if (dd < 7) return dd + 'd ago';
    if (dd < 60) return Math.floor(dd / 7) + 'w ago';
    return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function stActivityHTML(d) {
    var head = '<div class="st-panel-head"><h3 class="st-h3">Recent activity</h3></div>';
    var items = [];
    (d.recent_likes || []).forEach(function (l) {
      items.push({ at: l.created_at, kind: 'like', html: '<b>' + escHtml(l.track_title || 'a track') + '</b> got a like' });
    });
    (d.recent_follows || []).forEach(function (f) {
      items.push({ at: f.created_at, kind: 'follow', html: 'someone <b>followed</b> you' });
    });
    (d.awards_won || []).forEach(function (w) {
      items.push({ at: w.week + 'T12:00:00Z', kind: 'award', html: (w.album_title ? '<b>' + escHtml(w.album_title) + '</b> won ' : 'you won ') + escHtml(w.label || 'an award') });
    });
    if (!items.length && !Array.isArray(d.recent_likes)) {
      var lw = d.likes_this_week || 0, fw = d.followers_this_week || 0;
      if (!lw && !fw) return head + '<div class="st-empty-sm">quiet week. likes and new followers land here</div>';
      return head + '<ul class="st-feed">' +
        (lw ? '<li><span class="st-feed-ic like">' + ST_ICON.heart + '</span><span class="st-feed-t"><b>' + lw + '</b> new like' + (lw === 1 ? '' : 's') + ' this week</span></li>' : '') +
        (fw ? '<li><span class="st-feed-ic follow">' + ST_ICON.follow + '</span><span class="st-feed-t"><b>' + fw + '</b> new follower' + (fw === 1 ? '' : 's') + ' this week</span></li>' : '') +
      '</ul>';
    }
    if (!items.length) return head + '<div class="st-empty-sm">nothing yet. likes, follows and awards land here</div>';
    items.sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    var icon = { like: ST_ICON.heart, follow: ST_ICON.follow, award: ST_ICON.trophy };
    return head + '<ul class="st-feed">' + items.slice(0, 7).map(function (it) {
      return '<li><span class="st-feed-ic ' + it.kind + '">' + icon[it.kind] + '</span><span class="st-feed-t">' + it.html + '</span><span class="st-feed-w">' + escHtml(stAgo(it.at)) + '</span></li>';
    }).join('') + '</ul>';
  }

  var ST_PLAY_STEPS = [100, 1000, 10000, 100000, 1000000];
  var ST_FOLLOW_STEPS = [10, 50, 100, 500, 1000, 5000];
  var ST_TRACK_STEPS = [100, 1000, 10000, 100000];

  function stMilestone(label, sub, cur, steps) {
    cur = Number(cur) || 0;
    var next = null, last = null;
    for (var i = 0; i < steps.length; i++) { if (cur < steps[i]) { next = steps[i]; break; } last = steps[i]; }
    var pct = next ? Math.max(2, Math.min(100, (cur / next) * 100)) : 100;
    var foot = next
      ? stNum(next - cur) + ' to go' + (last ? ' · passed ' + stShort(last) : '')
      : 'every milestone hit. legend';
    return '<div>' +
      '<div class="st-ms-top"><span class="st-ms-l">' + escHtml(label) + (sub ? '<small>' + escHtml(sub) + '</small>' : '') + '</span>' +
      '<span class="st-ms-v"><b>' + stNum(cur) + '</b>' + (next ? ' / ' + stShort(next) : '') + '</span></div>' +
      '<div class="st-ms-bar" role="progressbar" aria-label="' + escHtml(label) + '" aria-valuemin="0" aria-valuemax="' + (next || cur) + '" aria-valuenow="' + cur + '"><i style="width:' + pct.toFixed(1) + '%;"></i></div>' +
      '<div class="st-ms-foot">' + escHtml(foot) + '</div>' +
    '</div>';
  }

  function renderMilestones() {
    var el = document.getElementById('st-milestones');
    if (!el) return;
    var d = statsData || {};
    var plays = stProfilePlays() || d.total_plays || 0;
    var followers = d.total_followers != null ? d.total_followers : (artist._followers || 0);
    var top = d.top_track || (d.top_tracks && d.top_tracks[0]) || null;
    el.innerHTML = '<h2 class="st-h" id="st-ms-title" style="font-size:16px;">Milestones</h2>' +
      '<div class="st-sub">the same ones that send you a notification</div>' +
      '<div class="st-ms">' +
        stMilestone('Total plays', '', plays, ST_PLAY_STEPS) +
        stMilestone('Followers', '', followers, ST_FOLLOW_STEPS) +
        (top ? stMilestone('Top track', top.title || '', top.play_count || 0, ST_TRACK_STEPS) : '') +
      '</div>';
  }

  function stStars(avg) {
    var out = '';
    for (var i = 1; i <= 5; i++) out += '<span class="' + (avg >= i - 0.25 ? '' : 'off') + '">' + ST_ICON.star + '</span>';
    return '<span class="st-stars" aria-hidden="true">' + out + '</span>';
  }

  function renderAwards() {
    var el = document.getElementById('st-awards');
    if (!el) return;
    var d = statsData || {};
    var list = Array.isArray(d.awards_won) ? d.awards_won : null;
    var row = el.parentElement;
    if (!list && !d.rating_count) { el.style.display = 'none'; if (row) row.style.gridTemplateColumns = 'minmax(0, 1fr)'; return; }
    el.style.display = '';
    if (row) row.style.gridTemplateColumns = '';
    var html = '<h2 class="st-h" id="st-aw-title" style="font-size:16px;">Awards</h2>';
    if (list && list.length) {
      html += '<div class="st-sub">' + list.length + ' weekly award' + (list.length === 1 ? '' : 's') + ' so far</div><div class="st-awards">' +
        list.slice(0, 8).map(function (w) {
          var wk = Date.parse(w.week + 'T12:00:00Z');
          var when = wk ? 'week of ' + new Date(wk).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
          var inner = '<span class="st-award-ic">' + ST_ICON.trophy + '</span><span style="min-width:0;"><span class="st-award-t" style="display:block;">' + escHtml(w.label || 'Award') + '</span>' +
            '<span class="st-award-s" style="display:block;">' + escHtml((w.album_title ? w.album_title + ' · ' : '') + when) + '</span></span>';
          return w.album_id ? '<a class="st-award" style="text-decoration:none;" href="/album?id=' + escHtml(w.album_id) + '">' + inner + '</a>' : '<div class="st-award">' + inner + '</div>';
        }).join('') + '</div>';
    } else {
      html += '<div class="st-sub">staff pick an edit, a comp and an editor of the week</div>' +
        '<div class="st-empty-sm" style="text-align:left;padding:16px 0 4px;">no awards yet. keep uploading, your first trophy shows up here</div>';
    }
    if (d.rating_count) {
      html += '<div class="st-rating"><span class="st-rating-v">' + escHtml(String(d.rating_avg)) + '</span>' +
        '<span>' + stStars(Number(d.rating_avg) || 0) + '<span class="st-sub" style="display:block;margin-top:2px;">avg rating from ' + stNum(d.rating_count) + ' rating' + (d.rating_count === 1 ? '' : 's') + '</span></span></div>';
    }
    el.innerHTML = html;
  }

  async function setStudioRange(n) {
    if ([7, 30, 90].indexOf(n) === -1 || !artist) return;
    _stDays = n;
    try { localStorage.setItem('wv_studio_days', String(n)); } catch (_) {}
    var el = document.getElementById('st-studio');
    if (el) {
      el.classList.add('busy');
      el.querySelectorAll('.st-seg button').forEach(function (b) { var on = b.textContent === n + 'd'; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    }
    var reqId = ++_stReq;
    try {
      var d = await api('/artists/' + artist.id + '/stats?days=' + n);
      if (reqId !== _stReq) return;
      statsData = d;
    } catch (_) {
      if (reqId !== _stReq) return;
      if (typeof wvToast === 'function') wvToast('couldnt load those stats', 'error');
    }
    renderStudio();
  }

  async function shareStudioStats() {
    if (!artist) return;
    var url = 'https://www.wavernrs.com/artist?id=' + encodeURIComponent(artist.id);
    var d = statsData || {};
    var followers = d.total_followers != null ? d.total_followers : artist._followers;
    var parts = [stNum(stProfilePlays() || d.total_plays || 0) + ' plays'];
    if (followers != null) parts.push(stNum(followers) + ' follower' + (followers === 1 ? '' : 's'));
    parts.push(stOwnReleases() + ' release' + (stOwnReleases() === 1 ? '' : 's'));
    var text = (artist.display_name || 'me') + ' on wavernrs · ' + parts.join(' · ');
    var coarse = false;
    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (_) {}
    if (coarse && navigator.share) {
      try { await navigator.share({ title: artist.display_name || 'wavernrs', text: text, url: url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    var full = text + '\n' + url;
    try {
      await navigator.clipboard.writeText(full);
      if (typeof wvToast === 'function') wvToast('copied your stats and profile link');
    } catch (_) {
      try {
        var ta = document.createElement('textarea');
        ta.value = full; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        if (typeof wvToast === 'function') wvToast('copied your stats and profile link');
      } catch (_) { if (typeof wvToast === 'function') wvToast('couldnt copy that', 'error'); }
    }
  }

  function setUploadFilter(f) {
    _upFilter = f;
    renderUploads();
  }

  function toggleUploadSort() {
    _upSort = _upSort === 'new' ? 'plays' : 'new';
    renderUploads();
  }

  function renderUploads() {
    var el = document.getElementById('my-uploads');
    if (!el) return;
    document.querySelectorAll('#st-up-filter button').forEach(function (b) { var on = b.getAttribute('data-f') === _upFilter; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    var sortBtn = document.querySelector('#st-up-sort span');
    if (sortBtn) sortBtn.textContent = _upSort === 'new' ? 'Newest' : 'Most played';
    var count = document.getElementById('st-up-count');
    if (count) count.textContent = uploads.length ? String(uploads.length) : '';
    if (!uploads.length) {
      el.innerHTML = '<div class="empty-state" style="padding:36px 12px;"><div class="empty-title">no uploads yet</div><div class="empty-desc" style="margin-bottom:16px;">post your first edit or comp and your stats start here</div><a class="st-btn brand" href="/upload">' + ST_ICON.upload + 'Upload</a></div>';
      return;
    }
    var list = uploads.filter(function (u) { return _upFilter === 'all' || u._type === _upFilter; });
    if (_upSort === 'plays') list = list.slice().sort(function (a, b) { return (b.play_count || 0) - (a.play_count || 0); });
    if (!list.length) {
      el.innerHTML = '<div class="st-empty-sm">no ' + (_upFilter === 'album' ? 'comps' : 'edits') + ' yet</div>';
      return;
    }
    el.innerHTML = '<div class="st-ups">' + list.map(function (item) {
      var isAlbum = item._type === 'album';
      var href = (isAlbum ? '/album?id=' : '/track?id=') + encodeURIComponent(item.id);
      var img = item.cover_url ? '<img src="' + escHtml(typeof wvImg === 'function' ? wvImg(item.cover_url, 96) : item.cover_url) + '" alt="" loading="lazy">' : '';
      var tag = isAlbum ? (item.collab ? 'Collab' : 'Comp') : 'Edit';
      var status = '';
      if (isAlbum && item.release_status === 'draft') status = '<span class="st-tag draft">Draft</span>';
      else if (isAlbum && item.release_status === 'upcoming' && item.release_at && new Date(item.release_at) > new Date()) status = '<span class="st-tag warn">Out ' + escHtml(new Date(item.release_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })) + '</span>';
      var bits = [];
      if (isAlbum && item.track_count) bits.push(item.track_count + ' track' + (item.track_count === 1 ? '' : 's'));
      bits.push(stNum(item.play_count || 0) + ' plays');
      bits.push(timeAgo(item.created_at));
      var t = escHtml(item.title || 'Untitled');
      return '<div class="st-up">' +
        '<a class="st-up-cover" href="' + href + '" tabindex="-1" aria-hidden="true" style="background:' + coverGradient(item.title || '') + ';">' + img + '</a>' +
        '<div class="st-up-main"><a class="st-up-title" href="' + href + '">' + t + '</a>' +
          '<div class="st-up-sub"><span class="st-tag">' + tag + '</span>' + status + '<span>' + escHtml(bits.join(' · ')) + '</span></div></div>' +
        '<div class="st-up-plays" title="plays">' + stNum(item.play_count || 0) + '</div>' +
        '<div class="st-up-acts">' +
          '<a class="st-ib st-open" href="' + href + '" aria-label="Open ' + t + '" title="Open">' + ST_ICON.open + '</a>' +
          (item.collab ? '' :
          '<button class="st-ib" onclick="editUpload(\'' + escHtml(item._type) + '\',\'' + escHtml(item.id) + '\')" aria-label="Edit ' + t + '" title="Edit">' + ST_ICON.edit + '</button>' +
          '<button class="st-ib danger" onclick="' + (isAlbum ? 'confirmDeleteComp' : 'confirmDelete') + '(\'' + escHtml(item.id) + '\')" aria-label="Delete ' + t + '" title="Delete">' + ST_ICON.trash + '</button>') +
        '</div>' +
      '</div>';
    }).join('') + '</div>';

    if (typeof wireIACoverRetry === 'function') {
      document.querySelectorAll('#my-uploads img').forEach(wireIACoverRetry);
    }
  }

  function editUpload(type, id) {
    var item = uploads.find(function (u) { return u.id === id && u._type === type; });
    if (!item) return;
    if (type === 'album') openEditAlbumModal(item); else openEditTrackModal(item);
  }

  function toggleNewPlaylistForm() {
    var form = document.getElementById('new-playlist-form');
    if (!form) return;
    var visible = form.style.display !== 'none';
    form.style.display = visible ? 'none' : '';
    if (!visible) {
      var inp = document.getElementById('new-playlist-title');
      if (inp) setTimeout(function () { inp.focus(); }, 50);
    }
  }

  async function createDashboardPlaylist() {
    var inp = document.getElementById('new-playlist-title');
    var title = inp ? inp.value.trim() : '';
    if (!title) { if (inp) inp.focus(); return; }
    try {
      var pl = await api('/playlists', { method: 'POST', body: JSON.stringify({ title: title, is_public: true }) });
      if (inp) inp.value = '';
      toggleNewPlaylistForm();
      if (typeof window.invalidatePlaylistCache === 'function') window.invalidatePlaylistCache();
      navigate('/playlist?id=' + pl.id);
    } catch (err) {
      alert('couldnt make the playlist: ' + err.message);
    }
  }

  async function deleteDashboardPlaylist(id) {
    if (!confirm('delete this playlist? you cant undo this')) return;
    try {
      await api('/playlists/' + id, { method: 'DELETE' });
      if (_myPlaylists) _myPlaylists = _myPlaylists.filter(function (p) { return p.id !== id; });
      if (typeof window.invalidatePlaylistCache === 'function') window.invalidatePlaylistCache();
      renderDashboardPlaylists();
    } catch (err) {
      alert('couldnt delete the playlist: ' + err.message);
    }
  }

  async function saveProfile() {
    clearAlert('profile-alert');
    const updates = {
      display_name: document.getElementById('edit-name').value.trim(),
      bio: document.getElementById('edit-bio').value.trim(),
      profile_image_url: document.getElementById('edit-avatar').value.trim(),
      banner_url: document.getElementById('edit-banner').value.trim(),
      location: document.getElementById('edit-location').value.trim(),
      website: document.getElementById('edit-website').value.trim(),
    };
    if (!updates.display_name) return showAlert('profile-alert', 'you need a display name');
    try {
      var keepFollowers = artist._followers;
      artist = await api(`/artists/${artist.id}`, {
        method: 'PUT',
        body: JSON.stringify(updates),
      });
      artist._followers = keepFollowers;
      var nameEl = document.querySelector('.st-hero-name');
      if (nameEl) nameEl.textContent = artist.display_name || '';
      showAlert('profile-alert', '✓ profile saved', 'success');
    } catch (err) {
      showAlert('profile-alert', err.message);
    }
  }

      closeDeleteModal();
      stAfterUploadsChange();

      alert(err.message);
    }

    pendingDeleteCompId = id;
    document.getElementById('delete-comp-modal').classList.add('open');

  function closeDeleteCompModal() {
    document.getElementById('delete-comp-modal').classList.remove('open');
    pendingDeleteCompId = null;

  // ── Edit Track Modal ──
  var editingTrackId = null;

  function openEditTrackModal(track) {
    editingTrackId = track.id;
    document.getElementById('edit-track-title').value = track.title || '';
    document.getElementById('edit-track-cover').value = track.cover_url || '';
    document.getElementById('edit-track-desc').value = track.description || '';
    api('/eratags').then(tags => {
      document.getElementById('edit-track-era').innerHTML =
        '<option value="">No era tag</option>' +
        (tags || []).map(t => `<option value="${escHtml(t.id)}" ${track.era_tag_id === t.id ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('');
    }).catch(() => {});
    document.getElementById('edit-track-modal').classList.add('open');
    stFocusIn('edit-track-modal');
  }

  function closeEditTrackModal() {
    document.getElementById('edit-track-modal').classList.remove('open');
    editingTrackId = null;
  }

  async function saveEditTrack() {
    const title = document.getElementById('edit-track-title').value.trim();
    if (!title) return showAlert('edit-track-alert', 'you need a title');
    clearAlert('edit-track-alert');
    try {
      const updated = await api(`/tracks/${editingTrackId}`, {
        method: 'PUT',
        body: JSON.stringify({
          title,
          era_tag_id: document.getElementById('edit-track-era').value || null,
          cover_url: document.getElementById('edit-track-cover').value.trim() || null,
          description: document.getElementById('edit-track-desc').value.trim() || null,
        }),
      });
      uploads = uploads.map(u => (u.id === editingTrackId && u._type === 'track') ? { ...u, ...updated, _type: 'track' } : u);
      closeEditTrackModal();
      renderUploads();
      showAlert('alert-container', '✓ edit updated', 'success');
    } catch (err) {
      showAlert('edit-track-alert', err.message);
    }
  }

  // ── Edit Album Modal ──
  var editingAlbumId = null;
  var _albumTracks = []; // mutable ordered array for the drag UI
  var _dragSrcIdx = null;

  function openEditAlbumModal(album) {
    editingAlbumId = album.id;
    document.getElementById('edit-album-title').value = album.title || '';
    document.getElementById('edit-album-cover').value = album.cover_url || '';
    document.getElementById('edit-album-desc').value = album.description || '';
    api('/eratags').then(tags => {
      document.getElementById('edit-album-era').innerHTML =
        '<option value="">No era tag</option>' +
        (tags || []).map(t => `<option value="${escHtml(t.id)}" ${album.era_tag_id === t.id ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('');
    }).catch(() => {});
    // Fetch album tracks for the tracklist reorder UI
    _albumTracks = [];
    document.getElementById('edit-album-tracklist-section').style.display = 'none';
    document.getElementById('edit-album-modal').classList.add('open');
    stFocusIn('edit-album-modal');
    api(`/albums/${album.id}`).then(function(fullAlbum) {
      var tracks = (fullAlbum.tracks || []).slice().sort(function(a, b) {
        return (a.position || 0) - (b.position || 0);
      });
      _albumTracks = tracks;
      if (tracks.length > 0) {
        document.getElementById('edit-album-tracklist-section').style.display = '';
        renderAlbumTracklist();
      }
    }).catch(function() {});
  }

  function renderAlbumTracklist() {
    var el = document.getElementById('edit-album-tracklist');
    if (!el) return;
    el.innerHTML = _albumTracks.map(function(track, i) {
      return '<div class="tracklist-item" draggable="true" id="ati-' + i + '"' +
        ' ondragstart="albumDragStart(event,' + i + ')"' +
        ' ondragover="albumDragOver(event,' + i + ')"' +
        ' ondrop="albumDragDrop(event,' + i + ')"' +
        ' ondragend="albumDragEnd()">' +
        '<div style="cursor:grab;padding:0 8px 0 0;font-size:16px;color:var(--text-secondary);user-select:none;flex-shrink:0;" title="drag to move it">⠿</div>' +
        '<div class="tracklist-num" style="min-width:20px;flex-shrink:0;">' + (i + 1) + '</div>' +
        '<div class="tracklist-info" style="flex:1;min-width:0;">' +
          '<div class="tracklist-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(track.title || track.track_title || '') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function albumDragStart(e, i) {
    _dragSrcIdx = i;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(i));
    setTimeout(function() {
      var el = document.getElementById('ati-' + i);
      if (el) el.style.opacity = '0.4';
    }, 0);
  }

  function albumDragOver(e, i) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('[id^="ati-"]').forEach(function(el) { el.style.borderTop = ''; });
    if (i !== _dragSrcIdx) {
      var el = document.getElementById('ati-' + i);
      if (el) el.style.borderTop = '2px solid var(--purple)';
    }
  }

  function albumDragDrop(e, i) {
    e.stopPropagation();
    e.preventDefault();
    if (_dragSrcIdx === null || _dragSrcIdx === i) return;
    var moved = _albumTracks.splice(_dragSrcIdx, 1)[0];
    _albumTracks.splice(i, 0, moved);
    renderAlbumTracklist();
    saveAlbumTracklist();
  }

  function albumDragEnd() {
    _dragSrcIdx = null;
    document.querySelectorAll('[id^="ati-"]').forEach(function(el) {
      el.style.opacity = '';
      el.style.borderTop = '';
    });
  }

  async function saveAlbumTracklist() {
    if (!editingAlbumId) return;
    var trackPayload = _albumTracks.map(function(t, i) {
      return { track_id: t.track_id || t.id, position: i + 1 };
    });
    try {
      await api('/albums/' + editingAlbumId + '/tracklist', {
        method: 'PUT',
        body: JSON.stringify({ tracks: trackPayload }),
      });
      var savedEl = document.getElementById('edit-album-tracklist-saved');
      if (savedEl) {
        savedEl.style.opacity = '1';
        setTimeout(function() { savedEl.style.opacity = '0'; }, 1500);
      }
    } catch (err) {
      showAlert('edit-album-alert', 'couldnt save the order: ' + (err.message || 'error'));
    }
  }

  async function saveEditAlbum() {
    const title = document.getElementById('edit-album-title').value.trim();
    if (!title) return showAlert('edit-album-alert', 'you need a title');
    clearAlert('edit-album-alert');
    try {
      const updated = await api(`/albums/${editingAlbumId}`, {
        method: 'PUT',
        body: JSON.stringify({
          title,
          era_tag_id: document.getElementById('edit-album-era').value || null,
          cover_url: document.getElementById('edit-album-cover').value.trim() || null,
          description: document.getElementById('edit-album-desc').value.trim() || null,
        }),
      });
      uploads = uploads.map(u => (u.id === editingAlbumId && u._type === 'album') ? { ...u, ...updated, _type: 'album' } : u);
      document.getElementById('edit-album-modal').classList.remove('open');
      editingAlbumId = null;
      renderUploads();
      showAlert('alert-container', '✓ comp updated', 'success');
    } catch (err) {
      showAlert('edit-album-alert', err.message);
    }
  }

  async function uploadModalCover(inputId, urlFieldId, statusId) {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return;
    const statusEl = document.getElementById(statusId);
    if (statusEl) statusEl.textContent = 'Uploading…';
    try {
      const form = new FormData();
      form.append('image', file);
      const result = await apiUpload('/upload/image', form);
      const urlEl = document.getElementById(urlFieldId);
      if (urlEl) urlEl.value = result.url;
      if (statusEl) statusEl.textContent = '✓ uploaded';
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Upload failed';
    }
  }

  async function uploadProfileImage(inputId, field) {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return;
    const statusEl = document.getElementById(`${field}-status`);
    if (statusEl) statusEl.textContent = 'Uploading…';
    try {
      const form = new FormData();
      form.append('image', file);
      const result = await apiUpload('/upload/image', form);
      const url = result.url;
      if (field === 'profile_image_url') {
        document.getElementById('edit-avatar').value = url;
        const preview = document.getElementById('profile_image_url-preview');
        if (preview) { preview.src = url; preview.style.display = ''; }
      } else if (field === 'banner_url') {
        document.getElementById('edit-banner').value = url;
      }
      if (statusEl) statusEl.textContent = 'Saving…';

      // Auto-save immediately — don't force the user to also click "Save Profile"
      if (artist && artist.id) {
        await api(`/artists/${artist.id}`, {
          method: 'PUT',
          body: JSON.stringify({ [field]: url }),
        });
        // Keep local artist object in sync
        artist[field] = url;
      }

      if (statusEl) statusEl.textContent = '✓ Saved';
      setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 3000);
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Upload failed';
      alert('image upload failed: ' + err.message);
    }
  }


  function stDestroyCharts() {
    _stCharts.forEach(function (c) { try { c.destroy(); } catch (_) {} });
    _stCharts = [];
  }

  function stVar(name, fallback) {
    var host = document.getElementById('view') || document.body;
    var v = '';
    try { v = getComputedStyle(host).getPropertyValue(name).trim(); } catch (_) {}
    return v || fallback;
  }

  function stAlpha(color, a) {
    var c = String(color || '').trim();
    var m = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if (m) {
      var h = m[1].length === 3 ? m[1].split('').map(function (x) { return x + x; }).join('') : m[1];
      return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')';
    }
    var r = c.match(/^rgba?\(([^)]+)\)$/i);
    if (r) { var p = r[1].split(',').map(function (x) { return x.trim(); }); return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + a + ')'; }
    return c;
  }

  function stDayLabel(key, days) {
    var dt = new Date(key + 'T12:00:00Z');
    if (isNaN(dt)) return key;
    return days <= 7 ? dt.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }) : dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function stLoadChartJs(cb) {
    if (typeof Chart !== 'undefined') return cb();
    if (window._stChartLoading) { window._stChartLoading.push(cb); return; }
    window._stChartLoading = [cb];
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    s.onload = function () { var q = window._stChartLoading || []; window._stChartLoading = null; q.forEach(function (f) { try { f(); } catch (_) {} }); };
    s.onerror = function () { window._stChartLoading = null; };
    document.head.appendChild(s);
  }

  function renderStatsCharts() {
    if (!statsData) return;
    stLoadChartJs(stDrawCharts);
  }

  function stDrawCharts() {
    if (typeof Chart === 'undefined' || !statsData || !document.getElementById('st-studio')) return;
    stDestroyCharts();
    var d = statsData;
    var days = stHasRange(d) ? (d.days || _stDays) : 7;
    var brand = stVar('--brand', '#a78bfa');
    var text = stVar('--text', '#ffffff');
    var text2 = stVar('--text-2', '#b3b3b3');
    var text3 = stVar('--text-3', '#7a7a7a');
    var hair = stVar('--hair', 'rgba(255,255,255,0.08)');
    var tipBg = stVar('--elevated', stVar('--surface-3', '#282828'));
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}
    var narrow = window.innerWidth < 700;

    var base = function (maxTicks) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        animation: reduce ? false : { duration: 500 },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: tipBg, titleColor: text, bodyColor: text2, borderColor: hair, borderWidth: 1,
            padding: 10, cornerRadius: 8, displayColors: true, boxWidth: 8, boxHeight: 8, usePointStyle: true,
            titleFont: { weight: '700' },
          },
        },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { color: text3, font: { size: 11 }, maxRotation: 0, autoSkip: true, maxTicksLimit: maxTicks } },
          y: { beginAtZero: true, grid: { color: hair, drawTicks: false }, border: { display: false }, ticks: { color: text3, font: { size: 11 }, precision: 0, padding: 8, maxTicksLimit: 5 } },
        },
      };
    };

    var playsEl = document.getElementById('chart-plays');
    if (playsEl && Array.isArray(d.plays_by_day)) {
      var labels = d.plays_by_day.map(function (x) { return stDayLabel(x.date, days); });
      var opts = base(narrow ? 5 : (days <= 7 ? 7 : 8));
      opts.plugins.tooltip.callbacks = { title: function (items) { var k = d.plays_by_day[items[0].dataIndex]; return k ? new Date(k.date + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }) : ''; } };
      _stCharts.push(new Chart(playsEl, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Plays', data: stSeries(d.plays_by_day), borderColor: brand, borderWidth: 2, tension: 0.35, pointRadius: days <= 7 ? 3 : 0, pointHoverRadius: 5,
              pointBackgroundColor: brand, pointBorderColor: brand, fill: 'origin',
              backgroundColor: function (ctx) {
                var c = ctx.chart, area = c.chartArea;
                if (!area) return stAlpha(brand, 0.12);
                var g = c.ctx.createLinearGradient(0, area.top, 0, area.bottom);
                g.addColorStop(0, stAlpha(brand, 0.32));
                g.addColorStop(1, stAlpha(brand, 0));
                return g;
              },
            },
            {
              label: 'Listeners', data: stSeries(d.listeners_by_day), borderColor: text3, borderWidth: 2, borderDash: [5, 4], tension: 0.35, pointRadius: 0, pointHoverRadius: 4,
              pointBackgroundColor: text3, pointBorderColor: text3, fill: false,
            },
          ],
        },
        options: opts,
      }));
    }

    var bar = function (el, series, label) {
      if (!el || !Array.isArray(series)) return;
      var o = base(narrow ? 4 : (days <= 7 ? 7 : 6));
      o.plugins.tooltip.displayColors = false;
      o.plugins.tooltip.callbacks = {
        title: function (items) { var k = series[items[0].dataIndex]; return k ? new Date(k.date + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }) : ''; },
        label: function (item) { return item.raw + ' ' + label + (item.raw === 1 ? '' : 's'); },
      };
      _stCharts.push(new Chart(el, {
        type: 'bar',
        data: {
          labels: series.map(function (x) { return stDayLabel(x.date, days); }),
          datasets: [{ data: stSeries(series), backgroundColor: brand, hoverBackgroundColor: stAlpha(brand, 0.8), borderRadius: 4, borderSkipped: 'bottom', maxBarThickness: 22, categoryPercentage: days > 30 ? 0.9 : 0.7, barPercentage: 0.9 }],
        },
        options: o,
      }));
    };
    bar(document.getElementById('chart-likes'), d.likes_by_day, 'like');
    bar(document.getElementById('chart-followers'), d.followers_by_day, 'new follower');
  }

  (function () {
    if (window._stThemeObs) { try { window._stThemeObs.disconnect(); } catch (_) {} }
    var last = document.body.className;
    var obs = new MutationObserver(function () {
      if (document.body.className === last) return;
      last = document.body.className;
      if (document.getElementById('st-studio') && statsData) setTimeout(stDrawCharts, 60);
    });
    obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    window._stThemeObs = obs;
    var onKey = function (e) {
      if (e.key !== 'Escape') return;
      var open = document.querySelector('#view .modal-overlay.open');
      if (!open) return;
      if (open.id === 'delete-modal') closeDeleteModal();
      else if (open.id === 'delete-comp-modal') closeDeleteCompModal();
      else if (open.id === 'edit-track-modal') closeEditTrackModal();
      else if (open.id === 'edit-album-modal') { open.classList.remove('open'); editingAlbumId = null; }
    };
    document.addEventListener('keydown', onKey);
    var resizeT = null, lastW = window.innerWidth;
    var onResize = function () {
      clearTimeout(resizeT);
      resizeT = setTimeout(function () {
        var w = window.innerWidth;
        if ((w < 700) !== (lastW < 700) && statsData) stDrawCharts();
        lastW = w;
      }, 200);
    };
    window.addEventListener('resize', onResize);
    window._pageCleanup.push(function () {
      try { obs.disconnect(); } catch (_) {}
      if (window._stThemeObs === obs) window._stThemeObs = null;
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      clearTimeout(resizeT);
    });
  })();

  if (isLoggedIn()) loadDashboard();
  else navigate('/login');
</script>
</body>
