<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/discover.html">Discover</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q.length>=2)location.href='/search.html?q='+encodeURIComponent(q);}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div class="container" style="padding-top:32px;padding-bottom:48px;">
  <div id="alert-container" style="margin-bottom:16px;"></div>
  <div class="dashboard-grid" id="dashboard">
    <div class="loading" style="grid-column:1/-1;"><div class="spinner"></div></div>
  </div>
</div>

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg></span>
    <span>Discover</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item active">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
    <span>Dashboard</span>
  </a>
</div>

<!-- Delete Edit Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <div class="modal-title">Delete edit?</div>
    <p style="font-size:14px;color:var(--text-secondary);">This will permanently remove the edit from your profile. The file will remain on Internet Archive.</p>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Delete Comp Confirm Modal -->
<div class="modal-overlay" id="delete-comp-modal">
  <div class="modal">
    <div class="modal-title">Delete comp?</div>
    <p style="font-size:14px;color:var(--text-secondary);">This will permanently remove the comp. The individual edits will not be deleted.</p>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteCompModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-comp-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Edit Edit Modal -->
<div class="modal-overlay" id="edit-track-modal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-title">Edit Edit</div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="edit-track-title" placeholder="Track name">
    </div>
    <div class="form-group">
      <label>Era Tag</label>
      <select id="edit-track-era"></select>
    </div>
    <div class="form-group">
      <label>Cover image URL</label>
      <input type="url" id="edit-track-cover" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="edit-track-desc" rows="2"></textarea>
    </div>
    <div id="edit-track-alert" style="margin-top:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditTrackModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditTrack()">Save</button>
    </div>
  </div>
</div>

<!-- Edit Comp Modal -->
<div class="modal-overlay" id="edit-album-modal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-title">Edit Comp</div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="edit-album-title" placeholder="Comp name">
    </div>
    <div class="form-group">
      <label>Era Tag</label>
      <select id="edit-album-era"></select>
    </div>
    <div class="form-group">
      <label>Cover image URL</label>
      <input type="url" id="edit-album-cover" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="edit-album-desc" rows="2"></textarea>
    </div>
    <div id="edit-album-alert" style="margin-top:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('edit-album-modal').classList.remove('open');editingAlbumId=null;">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditAlbum()">Save</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script>
  if (!isLoggedIn()) location.href = '/login.html';

  updateNav();
  initPlayer();

  let me = null;
  let artist = null;
  let tracks = [];
  let comps = [];
  let eraTags = [];
  let pendingDeleteId = null;
  let pendingDeleteCompId = null;

  // Upload Edit state
  let selectedFile = null;

  // Upload Comp state
  let compTracklist = []; // [{track_id, position, title, artist_name, cover_url}]
  let compCoverFile = null;
  let editCoverFile = null;
  let dragSrcIndex = null;

  async function loadDashboard() {
    try {
      [me, eraTags] = await Promise.all([
        api('/auth/me'),
        api('/eratags').catch(() => []),
      ]);
      artist = me.artist;
      [tracks, comps] = await Promise.all([
        api(`/artists/${artist.id}/tracks`),
        api(`/albums/by-artist/${artist.id}`).catch(() => []),
      ]);
      render();
    } catch (err) {
      if (err.message.includes('401')) return location.href = '/login.html';
      showAlert('alert-container', 'Failed to load dashboard: ' + err.message);
    }
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function eraTagOptions(selectedId) {
    return `<option value="">No era tag</option>` +
      eraTags.map(t => `<option value="${t.id}" ${selectedId == t.id ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('');
  }

  function render() {
    const totalPlays = tracks.reduce((s, t) => s + (t.play_count || 0), 0);
    const avatarContent = artist.profile_image_url
      ? `<img src="${artist.profile_image_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : escHtml(artist.display_name?.[0]?.toUpperCase() || '?');

    document.getElementById('dashboard').innerHTML = `
      <!-- Sidebar -->
      <div class="dashboard-sidebar">
        <!-- Profile card -->
        <div class="card" style="padding:20px;text-align:center;margin-bottom:16px;">
          <div style="width:72px;height:72px;border-radius:50%;background:var(--purple);color:white;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin:0 auto 12px;overflow:hidden;">
            ${avatarContent}
          </div>
          <div style="font-weight:700;font-size:16px;">${escHtml(artist.display_name)}</div>
          <div style="font-size:13px;color:var(--text-secondary);">@${escHtml(me.username)}</div>
          <div style="display:flex;gap:16px;justify-content:center;margin-top:12px;">
            <div style="font-size:12px;color:var(--text-secondary);"><strong style="color:var(--text);font-size:16px;">${tracks.length}</strong><br>edits</div>
            <div style="font-size:12px;color:var(--text-secondary);"><strong style="color:var(--text);font-size:16px;">${comps.length}</strong><br>comps</div>
            <div style="font-size:12px;color:var(--text-secondary);"><strong style="color:var(--text);font-size:16px;">${fmtNum(totalPlays)}</strong><br>plays</div>
          </div>
          <a href="/artist.html?id=${artist.id}" class="btn btn-secondary btn-sm" style="margin-top:14px;width:100%;justify-content:center;">View public page</a>
        </div>

        <!-- Edit profile -->
        <div class="card" style="padding:20px;">
          <div style="font-size:14px;font-weight:600;margin-bottom:14px;">Edit Profile</div>
          <div class="form-group">
            <label>Display name</label>
            <input type="text" id="edit-name" value="${escHtml(artist.display_name || '')}" placeholder="Your name">
          </div>
          <div class="form-group">
            <label>Bio</label>
            <textarea id="edit-bio" rows="3" placeholder="Tell people about yourself…">${escHtml(artist.bio || '')}</textarea>
          </div>
          <div class="form-group">
            <label>Profile picture</label>
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
              <img id="profile_image_url-preview" src="${escHtml(artist.profile_image_url || '')}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--surface);${artist.profile_image_url ? '' : 'display:none;'}">
              <div>
                <input type="file" id="profile-img-file" accept="image/*" style="display:none" onchange="uploadProfileImage('profile-img-file', 'profile_image_url')">
                <button class="btn btn-secondary btn-sm" onclick="document.getElementById('profile-img-file').click()">Upload photo</button>
                <span id="profile_image_url-status" style="font-size:12px;color:var(--text-secondary);margin-left:8px;"></span>
              </div>
            </div>
            <input type="url" id="edit-avatar" value="${escHtml(artist.profile_image_url || '')}" placeholder="or paste image URL">
          </div>
          <div class="form-group">
            <label>Banner image</label>
            <div style="margin-bottom:8px;">
              <input type="file" id="banner-img-file" accept="image/*" style="display:none" onchange="uploadProfileImage('banner-img-file', 'banner_url')">
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('banner-img-file').click()">Upload banner</button>
              <span id="banner_url-status" style="font-size:12px;color:var(--text-secondary);margin-left:8px;"></span>
            </div>
            <input type="url" id="edit-banner" value="${escHtml(artist.banner_url || '')}" placeholder="or paste banner URL">
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="edit-location" value="${escHtml(artist.location || '')}" placeholder="City, Country">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label>Website</label>
            <input type="url" id="edit-website" value="${escHtml(artist.website || '')}" placeholder="https://...">
          </div>
          <div id="profile-alert" style="margin-top:10px;"></div>
          <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="saveProfile()">Save changes</button>
        </div>
      </div>

      <!-- Main content -->
      <div>
        <!-- Upload card with tabs -->
        <div class="card" style="padding:24px;margin-bottom:24px;">
          <div class="tabs" style="margin-bottom:20px;">
            <button class="tab active" id="upload-tab-edit" onclick="switchUploadTab('edit')">Upload Edit</button>
            <button class="tab" id="upload-tab-comp" onclick="switchUploadTab('comp')">Upload Comp</button>
          </div>

          <!-- Upload Edit form -->
          <div id="upload-edit-form">
            <div class="form-group">
              <label>Title *</label>
              <input type="text" id="upload-title" placeholder="Edit name">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div class="form-group">
                <label>Era Tag</label>
                <select id="upload-era-tag">
                  ${eraTagOptions(null)}
                </select>
              </div>
              <div class="form-group">
                <label>Description</label>
                <textarea id="upload-desc" rows="2" placeholder="Optional note about the edit…" style="min-height:42px;"></textarea>
              </div>
            </div>

            <!-- Cover image upload -->
            <div class="form-group">
              <label>Cover image</label>
              <div class="upload-zone" id="cover-zone" style="padding:16px;" onclick="document.getElementById('cover-input').click()"
                ondragover="onCoverDragOver(event)" ondragleave="onCoverDragLeave(event)" ondrop="onCoverDrop(event)">
                <div class="upload-zone-icon" style="font-size:20px;">🖼️</div>
                <div class="upload-zone-text" id="cover-zone-text" style="font-size:13px;">Drop image or click to browse</div>
                <div class="upload-zone-hint">PNG, JPG, WEBP</div>
              </div>
              <input type="file" id="cover-input" accept="image/*" style="display:none" onchange="onCoverSelect(event)">
            </div>

            <!-- Audio upload zone -->
            <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()"
              ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
              <div class="upload-zone-icon">🎵</div>
              <div class="upload-zone-text" id="upload-zone-text">Drop audio file here or click to browse</div>
              <div class="upload-zone-hint">MP3, WAV, FLAC, M4A — up to 200MB</div>
            </div>
            <input type="file" id="file-input" accept="audio/*" style="display:none" onchange="onFileSelect(event)">

            <div class="or-divider">or paste a Google Drive link</div>

            <div class="form-group" style="margin-bottom:0;">
              <input type="url" id="drive-url" placeholder="https://drive.google.com/file/d/…">
            </div>

            <div id="upload-alert" style="margin-top:12px;"></div>
            <div id="upload-progress" style="display:none;margin-top:12px;">
              <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;" id="upload-status">Uploading to Internet Archive…</div>
              <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;">
                <div style="height:100%;background:var(--purple);border-radius:2px;width:0%;transition:width 0.3s;" id="upload-bar"></div>
              </div>
            </div>
            <button class="btn btn-primary btn-lg" style="margin-top:16px;width:100%;" id="upload-btn" onclick="doUpload()">Upload Edit</button>
          </div>

          <!-- Upload Comp form -->
          <div id="upload-comp-form" style="display:none;">
            <div class="form-group">
              <label>Comp Title *</label>
              <input type="text" id="comp-title" placeholder="Comp name">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div class="form-group">
                <label>Era Tag</label>
                <select id="comp-era-tag">
                  ${eraTagOptions(null)}
                </select>
              </div>
              <div class="form-group">
                <label>Description</label>
                <textarea id="comp-desc" rows="2" placeholder="About this comp…" style="min-height:42px;"></textarea>
              </div>
            </div>

            <!-- Comp cover upload -->
            <div class="form-group">
              <label>Comp cover</label>
              <div class="upload-zone" id="comp-cover-zone" style="padding:16px;" onclick="document.getElementById('comp-cover-input').click()"
                ondragover="e=>{e.preventDefault();document.getElementById('comp-cover-zone').classList.add('dragover');}"
                ondragleave="document.getElementById('comp-cover-zone').classList.remove('dragover');"
                ondrop="onCompCoverDrop(event)">
                <div class="upload-zone-icon" style="font-size:20px;">🖼️</div>
                <div class="upload-zone-text" id="comp-cover-zone-text" style="font-size:13px;">Drop image or click to browse</div>
              </div>
              <input type="file" id="comp-cover-input" accept="image/*" style="display:none" onchange="onCompCoverSelect(event)">
            </div>

            <!-- Tracklist builder -->
            <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Tracklist</div>

            <!-- Upload audio files directly -->
            <div class="form-group">
              <label>Upload audio files (creates new Edits + adds to this Comp)</label>
              <div class="upload-zone" id="comp-audio-zone" onclick="document.getElementById('comp-audio-files').click()" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onCompAudioDrop(event)">
                <div class="upload-zone-icon">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--text-tertiary)"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="upload-zone-text">Drop audio files or click to browse</div>
                <div class="upload-zone-hint">MP3, WAV, FLAC — multiple files supported</div>
              </div>
              <input type="file" id="comp-audio-files" accept="audio/*" multiple style="display:none" onchange="onCompAudioSelect(event)">
              <div id="comp-audio-queue" class="tracklist" style="margin-top:8px;"></div>
            </div>

            <!-- Search your edits to add -->
            <div class="form-group">
              <label>Add edits from your library</label>
              <div style="display:flex;gap:8px;">
                <input type="text" id="track-search" placeholder="Search your edits…" oninput="filterMyTracks(this.value)">
              </div>
            </div>
            <div id="my-tracks-picker" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:16px;">
              <!-- populated by renderTrackPicker() -->
            </div>

            <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;">Tracklist (drag to reorder)</div>
            <div class="tracklist" id="comp-tracklist"></div>

            <div id="comp-upload-alert" style="margin-top:12px;"></div>
            <button class="btn btn-primary btn-lg" style="margin-top:16px;width:100%;" id="comp-upload-btn" onclick="doUploadComp()">Upload Comp</button>
          </div>
        </div>

        <!-- Your Edits -->
        <div style="margin-bottom:32px;">
          <div style="font-size:16px;font-weight:600;margin-bottom:16px;">Your Edits <span style="color:var(--text-secondary);font-weight:400;font-size:14px;">(${tracks.length})</span></div>
          <div id="my-tracks"></div>
        </div>

        <!-- Your Comps -->
        <div>
          <div style="font-size:16px;font-weight:600;margin-bottom:16px;">Your Comps <span style="color:var(--text-secondary);font-weight:400;font-size:14px;">(${comps.length})</span></div>
          <div id="my-comps"></div>
        </div>
      </div>`;

    renderTracks();
    renderComps();
    renderTrackPicker('');
  }

  function switchUploadTab(tab) {
    document.getElementById('upload-tab-edit').classList.toggle('active', tab === 'edit');
    document.getElementById('upload-tab-comp').classList.toggle('active', tab === 'comp');
    document.getElementById('upload-edit-form').style.display = tab === 'edit' ? '' : 'none';
    document.getElementById('upload-comp-form').style.display = tab === 'comp' ? '' : 'none';
  }

  function renderTracks() {
    const el = document.getElementById('my-tracks');
    if (!tracks.length) {
      el.innerHTML = `<div class="empty-state" style="padding:40px 0;"><div class="empty-icon">🎵</div><div class="empty-title">No edits yet</div><div class="empty-desc">Upload your first edit above.</div></div>`;
      return;
    }
    el.innerHTML = `<div class="track-list">` + tracks.map(t => {
      const cover = t.cover_url ? `<img src="${t.cover_url}" alt="">` : '🎵';
      const eraName = t.era_tag?.name || t.genre || '';
      return `
        <div class="track-row">
          <div class="track-row-cover">${cover}</div>
          <div class="track-row-info">
            <div class="track-row-title">${escHtml(t.title)}</div>
            <div class="track-row-artist">${eraName ? escHtml(eraName) + ' · ' : ''}${fmtNum(t.play_count)} plays · ${timeAgo(t.created_at)}</div>
          </div>
          <div style="display:flex;gap:8px;margin-left:auto;">
            <a href="/track.html?id=${t.id}" class="btn btn-secondary btn-sm">Open</a>
            <button class="btn btn-secondary btn-sm" onclick="openEditTrackModal(${JSON.stringify(t).replace(/"/g,'&quot;')})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="confirmDelete('${t.id}')">Delete</button>
          </div>
        </div>`;
    }).join('') + `</div>`;
  }

  function renderComps() {
    const el = document.getElementById('my-comps');
    if (!comps.length) {
      el.innerHTML = `<div class="empty-state" style="padding:40px 0;"><div class="empty-icon">💿</div><div class="empty-title">No comps yet</div><div class="empty-desc">Create your first comp above.</div></div>`;
      return;
    }
    el.innerHTML = `<div class="track-list">` + comps.map(c => {
      const cover = c.cover_url ? `<img src="${c.cover_url}" alt="">` : '💿';
      return `
        <div class="track-row">
          <div class="track-row-cover">${cover}</div>
          <div class="track-row-info">
            <div class="track-row-title">${escHtml(c.title)}</div>
            <div class="track-row-artist">${c.track_count || 0} edits · ${timeAgo(c.created_at)}</div>
          </div>
          <div style="display:flex;gap:8px;margin-left:auto;">
            <a href="/album.html?id=${c.id}" class="btn btn-secondary btn-sm">Open</a>
            <button class="btn btn-secondary btn-sm" onclick="openEditAlbumModal(${JSON.stringify(c).replace(/"/g,'&quot;')})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="confirmDeleteComp('${c.id}')">Delete</button>
          </div>
        </div>`;
    }).join('') + `</div>`;
  }

  function filterMyTracks(q) {
    renderTrackPicker(q);
  }

  function renderTrackPicker(q) {
    const el = document.getElementById('my-tracks-picker');
    if (!el) return;
    const filtered = q
      ? tracks.filter(t => t.title.toLowerCase().includes(q.toLowerCase()))
      : tracks;
    if (!filtered.length) {
      el.innerHTML = `<div style="padding:12px;font-size:13px;color:var(--text-tertiary);">No edits found.</div>`;
      return;
    }
    el.innerHTML = filtered.map(t => {
      const alreadyAdded = compTracklist.some(x => x.track_id === t.id);
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border-subtle);" class="${alreadyAdded ? '' : 'track-row'}" onclick="${alreadyAdded ? '' : `addToTracklist('${t.id}')`}" style="cursor:${alreadyAdded ? 'default' : 'pointer'};">
        <div style="width:32px;height:32px;border-radius:4px;background:var(--purple-bg);overflow:hidden;flex-shrink:0;">
          ${t.cover_url ? `<img src="${t.cover_url}" style="width:100%;height:100%;object-fit:cover;">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">🎵</div>'}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(t.title)}</div>
        </div>
        <button class="btn btn-sm ${alreadyAdded ? 'btn-secondary' : 'btn-primary'}" onclick="event.stopPropagation();${alreadyAdded ? '' : `addToTracklist('${t.id}')`}" ${alreadyAdded ? 'disabled' : ''}>${alreadyAdded ? 'Added' : '+'}</button>
      </div>`;
    }).join('');
  }

  function addToTracklist(trackId) {
    const track = tracks.find(t => t.id === trackId);
    if (!track) return;
    if (compTracklist.some(x => x.track_id === trackId)) return;
    compTracklist.push({
      track_id: trackId,
      position: compTracklist.length + 1,
      title: track.title,
      artist_name: artist.display_name,
      cover_url: track.cover_url,
    });
    renderCompTracklist();
    renderTrackPicker(document.getElementById('track-search')?.value || '');
  }

  function removeFromTracklist(trackId) {
    compTracklist = compTracklist.filter(x => x.track_id !== trackId);
    compTracklist.forEach((x, i) => x.position = i + 1);
    renderCompTracklist();
    renderTrackPicker(document.getElementById('track-search')?.value || '');
  }

  function renderCompTracklist() {
    const el = document.getElementById('comp-tracklist');
    if (!el) return;
    if (!compTracklist.length) {
      el.innerHTML = `<div style="padding:12px;font-size:13px;color:var(--text-tertiary);text-align:center;border:1px dashed var(--border);border-radius:var(--radius-sm);">Add edits from your library above</div>`;
      return;
    }
    el.innerHTML = compTracklist.map((item, i) => `
      <div class="tracklist-item" draggable="true" data-index="${i}"
        ondragstart="onTLDragStart(event,${i})"
        ondragover="onTLDragOver(event,${i})"
        ondrop="onTLDrop(event,${i})"
        ondragend="onTLDragEnd(event)">
        <span class="tracklist-drag-handle">⠿</span>
        <span class="tracklist-num">${i + 1}</span>
        <div class="tracklist-cover">
          ${item.cover_url ? `<img src="${item.cover_url}" alt="">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;">🎵</div>'}
        </div>
        <div class="tracklist-info">
          <div class="tracklist-title">${escHtml(item.title)}</div>
          <div class="tracklist-artist">${escHtml(item.artist_name || '')}</div>
        </div>
        <button class="tracklist-remove" onclick="removeFromTracklist('${item.track_id}')">×</button>
      </div>`).join('');
  }

  // Drag-drop for tracklist reordering
  function onTLDragStart(e, index) {
    dragSrcIndex = index;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function onTLDragOver(e, index) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.tracklist-item').forEach((el, i) => {
      el.classList.toggle('drag-over', i === index && i !== dragSrcIndex);
    });
  }

  function onTLDrop(e, index) {
    e.preventDefault();
    if (dragSrcIndex === null || dragSrcIndex === index) return;
    const moved = compTracklist.splice(dragSrcIndex, 1)[0];
    compTracklist.splice(index, 0, moved);
    compTracklist.forEach((x, i) => x.position = i + 1);
    dragSrcIndex = null;
    renderCompTracklist();
    renderTrackPicker(document.getElementById('track-search')?.value || '');
  }

  function onTLDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.tracklist-item').forEach(el => el.classList.remove('drag-over'));
    dragSrcIndex = null;
  }

  // Cover image handlers (edit)
  function onCoverDragOver(e) {
    e.preventDefault();
    document.getElementById('cover-zone').classList.add('dragover');
  }
  function onCoverDragLeave() {
    document.getElementById('cover-zone').classList.remove('dragover');
  }
  function onCoverDrop(e) {
    e.preventDefault();
    document.getElementById('cover-zone').classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) setCoverFile(file);
  }
  function onCoverSelect(e) {
    const file = e.target.files[0];
    if (file) setCoverFile(file);
  }
  function setCoverFile(file) {
    editCoverFile = file;
    document.getElementById('cover-zone-text').textContent = `✓ ${file.name}`;
  }

  // Comp cover handlers
  function onCompCoverDrop(e) {
    e.preventDefault();
    document.getElementById('comp-cover-zone').classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) setCompCoverFile(file);
  }
  function onCompCoverSelect(e) {
    const file = e.target.files[0];
    if (file) setCompCoverFile(file);
  }
  function setCompCoverFile(file) {
    compCoverFile = file;
    document.getElementById('comp-cover-zone-text').textContent = `✓ ${file.name}`;
  }

  // Audio file handlers
  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('upload-zone').classList.add('dragover');
  }
  function onDragLeave() {
    document.getElementById('upload-zone').classList.remove('dragover');
  }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById('upload-zone').classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  }
  function onFileSelect(e) {
    const file = e.target.files[0];
    if (file) setFile(file);
  }
  function setFile(file) {
    selectedFile = file;
    document.getElementById('upload-zone-text').textContent = `✓ ${file.name}`;
    document.getElementById('drive-url').value = '';
  }

  async function doUpload() {
    const title = document.getElementById('upload-title').value.trim();
    const era_tag_id = document.getElementById('upload-era-tag').value;
    if (!era_tag_id) return showAlert('upload-alert', 'Era tag is required');
    const description = document.getElementById('upload-desc').value.trim();
    const drive_url = document.getElementById('drive-url').value.trim();
    clearAlert('upload-alert');

    if (!title) return showAlert('upload-alert', 'Title is required');
    if (!selectedFile && !drive_url) return showAlert('upload-alert', 'Choose a file or paste a Google Drive link');

    const btn = document.getElementById('upload-btn');
    btn.disabled = true;
    btn.textContent = 'Uploading…';

    const progress = document.getElementById('upload-progress');
    const bar = document.getElementById('upload-bar');
    const status = document.getElementById('upload-status');
    progress.style.display = 'block';

    status.textContent = drive_url ? '📡 Connecting to Google Drive…' : '📦 Preparing upload…';
    bar.style.width = '10%';

    let pct = 10;
    const timer = setInterval(() => {
      if (pct < 30) pct += 3;
      else if (pct < 60) pct += 1.5;
      else if (pct < 80) pct += 0.5;
      else pct = Math.min(pct + 0.1, 84);
      bar.style.width = pct + '%';

      if (pct > 15 && pct < 40) status.textContent = '☁️ Uploading to Internet Archive… (this can take 1-2 minutes for large files)';
      if (pct > 40 && pct < 70) status.textContent = '☁️ Uploading to Internet Archive… (this can take a while for large files, please don\'t close the page)';
      if (pct > 70) status.textContent = '⏳ Almost there… finalizing upload…';
    }, 800);

    try {
      status.textContent = drive_url ? '📡 Connecting to Google Drive…' : '☁️ Uploading to Internet Archive… (this can take 1-2 minutes for large files)';

      let track;
      if (selectedFile) {
        const form = new FormData();
        form.append('file', selectedFile);
        form.append('title', title);
        if (era_tag_id) form.append('era_tag_id', era_tag_id);
        if (description) form.append('description', description);
        if (editCoverFile) form.append('cover_file', editCoverFile);
        track = await apiUpload('/tracks', form);
      } else {
        track = await api('/tracks', {
          method: 'POST',
          body: JSON.stringify({ title, era_tag_id: era_tag_id || undefined, description, drive_url }),
        });
      }

      clearInterval(timer);
      bar.style.width = '100%';
      status.textContent = '✓ Upload complete!';

      tracks.unshift(track);
      selectedFile = null;
      editCoverFile = null;
      document.getElementById('upload-zone-text').textContent = 'Drop audio file here or click to browse';
      document.getElementById('cover-zone-text').textContent = 'Drop image or click to browse';
      document.getElementById('upload-title').value = '';
      document.getElementById('upload-era-tag').value = '';
      document.getElementById('upload-desc').value = '';
      document.getElementById('drive-url').value = '';
      document.getElementById('file-input').value = '';
      document.getElementById('cover-input').value = '';

      renderTracks();
      renderTrackPicker('');
      showAlert('upload-alert', '✓ Edit uploaded!', 'success');
    } catch (err) {
      clearInterval(timer);
      showAlert('upload-alert', err.message || 'Upload failed');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Upload Edit';
      setTimeout(() => { progress.style.display = 'none'; bar.style.width = '0%'; }, 3000);
    }
  }

  async function doUploadComp() {
    const title = document.getElementById('comp-title').value.trim();
    const era_tag_id = document.getElementById('comp-era-tag').value;
    if (!era_tag_id) return showAlert('comp-upload-alert', 'Era tag is required');
    const description = document.getElementById('comp-desc').value.trim();
    clearAlert('comp-upload-alert');

    if (!title) return showAlert('comp-upload-alert', 'Title is required');
    if (!compTracklist.length && !compAudioFiles.length) return showAlert('comp-upload-alert', 'Add at least one edit to the tracklist or upload audio files');

    const btn = document.getElementById('comp-upload-btn');
    btn.disabled = true;
    btn.textContent = 'Creating comp…';

    const statusEl = document.getElementById('comp-upload-alert');

    try {
      // Upload queued audio files first, collect their track IDs
      const uploadedTrackIds = [];
      for (let i = 0; i < compAudioFiles.length; i++) {
        const f = compAudioFiles[i];
        if (statusEl) statusEl.innerHTML = `<div class="alert alert-success">Uploading audio ${i+1}/${compAudioFiles.length}: ${escHtml(f.name)}…</div>`;
        const audioForm = new FormData();
        audioForm.append('file', f);
        audioForm.append('title', f.name.replace(/\.[^.]+$/, ''));
        if (era_tag_id) audioForm.append('era_tag_id', era_tag_id);
        try {
          const t = await apiUpload('/tracks', audioForm);
          uploadedTrackIds.push(t.id);
          tracks.unshift(t);
        } catch (err) {
          console.error('Failed to upload', f.name, err.message);
        }
      }

      // Combine uploaded track IDs with manually selected tracklist
      const manualTracks = compTracklist.map((x, i) => ({ track_id: x.track_id, position: i + 1 }));
      const uploadedTracks = uploadedTrackIds.map((id, i) => ({ track_id: id, position: manualTracks.length + i + 1 }));
      const allTracks = [...manualTracks, ...uploadedTracks];

      if (!allTracks.length) {
        showAlert('comp-upload-alert', 'No valid tracks to add to comp');
        btn.disabled = false;
        btn.textContent = 'Upload Comp';
        return;
      }

      if (statusEl) statusEl.innerHTML = `<div class="alert alert-success">Creating comp…</div>`;

      const form = new FormData();
      form.append('title', title);
      if (era_tag_id) form.append('era_tag_id', era_tag_id);
      if (description) form.append('description', description);
      if (compCoverFile) form.append('cover_file', compCoverFile);
      form.append('tracks', JSON.stringify(allTracks));

      const comp = await apiUpload('/albums', form);
      comps.unshift(comp);
      compTracklist = [];
      compAudioFiles = [];
      compCoverFile = null;
      document.getElementById('comp-title').value = '';
      document.getElementById('comp-era-tag').value = '';
      document.getElementById('comp-desc').value = '';
      document.getElementById('comp-cover-zone-text').textContent = 'Drop image or click to browse';
      document.getElementById('comp-cover-input').value = '';
      renderCompTracklist();
      renderCompAudioQueue();
      renderComps();
      renderTracks();
      renderTrackPicker('');
      document.querySelector('[data-count-comps]')?.setAttribute('data-count-comps', comps.length);
      showAlert('comp-upload-alert', '✓ Comp created!', 'success');
    } catch (err) {
      showAlert('comp-upload-alert', err.message || 'Failed to create comp');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Upload Comp';
    }
  }

  async function saveProfile() {
    clearAlert('profile-alert');
    const updates = {
      display_name: document.getElementById('edit-name').value.trim(),
      bio: document.getElementById('edit-bio').value.trim(),
      profile_image_url: document.getElementById('edit-avatar').value.trim(),
      banner_url: document.getElementById('edit-banner').value.trim(),
      location: document.getElementById('edit-location').value.trim(),
      website: document.getElementById('edit-website').value.trim(),
    };
    if (!updates.display_name) return showAlert('profile-alert', 'Display name is required');
    try {
      artist = await api(`/artists/${artist.id}`, {
        method: 'PUT',
        body: JSON.stringify(updates),
      });
      showAlert('profile-alert', '✓ Profile saved', 'success');
    } catch (err) {
      showAlert('profile-alert', err.message);
    }
  }

  function confirmDelete(id) {
    pendingDeleteId = id;
    document.getElementById('delete-modal').classList.add('open');
    document.getElementById('confirm-delete-btn').onclick = doDelete;
  }

  function closeDeleteModal() {
    document.getElementById('delete-modal').classList.remove('open');
    pendingDeleteId = null;
  }

  async function doDelete() {
    if (!pendingDeleteId) return;
    try {
      await api(`/tracks/${pendingDeleteId}`, { method: 'DELETE' });
      tracks = tracks.filter(t => t.id !== pendingDeleteId);
      closeDeleteModal();
      renderTracks();
      renderTrackPicker('');
    } catch (err) {
      alert(err.message);
    }
  }

  function confirmDeleteComp(id) {
    pendingDeleteCompId = id;
    document.getElementById('delete-comp-modal').classList.add('open');
    document.getElementById('confirm-delete-comp-btn').onclick = doDeleteComp;
  }

  function closeDeleteCompModal() {
    document.getElementById('delete-comp-modal').classList.remove('open');
    pendingDeleteCompId = null;
  }

  async function doDeleteComp() {
    if (!pendingDeleteCompId) return;
    try {
      await api(`/albums/${pendingDeleteCompId}`, { method: 'DELETE' });
      comps = comps.filter(c => c.id !== pendingDeleteCompId);
      closeDeleteCompModal();
      renderComps();
    } catch (err) {
      alert(err.message);
    }
  }

  // ── Edit Track Modal ──
  let editingTrackId = null;

  function openEditTrackModal(track) {
    editingTrackId = track.id;
    document.getElementById('edit-track-title').value = track.title || '';
    document.getElementById('edit-track-cover').value = track.cover_url || '';
    document.getElementById('edit-track-desc').value = track.description || '';
    api('/eratags').then(tags => {
      document.getElementById('edit-track-era').innerHTML =
        '<option value="">No era tag</option>' +
        tags.map(t => `<option value="${t.id}" ${track.era_tag_id === t.id ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('');
    }).catch(() => {});
    document.getElementById('edit-track-modal').classList.add('open');
  }

  function closeEditTrackModal() {
    document.getElementById('edit-track-modal').classList.remove('open');
    editingTrackId = null;
  }

  async function saveEditTrack() {
    const title = document.getElementById('edit-track-title').value.trim();
    if (!title) return showAlert('edit-track-alert', 'Title is required');
    clearAlert('edit-track-alert');
    try {
      const updated = await api(`/tracks/${editingTrackId}`, {
        method: 'PUT',
        body: JSON.stringify({
          title,
          era_tag_id: document.getElementById('edit-track-era').value || null,
          cover_url: document.getElementById('edit-track-cover').value.trim() || null,
          description: document.getElementById('edit-track-desc').value.trim() || null,
        }),
      });
      tracks = tracks.map(t => t.id === editingTrackId ? { ...t, ...updated } : t);
      closeEditTrackModal();
      renderTracks();
      showAlert('alert-container', '✓ Edit updated', 'success');
    } catch (err) {
      showAlert('edit-track-alert', err.message);
    }
  }

  // ── Edit Album Modal ──
  let editingAlbumId = null;

  function openEditAlbumModal(album) {
    editingAlbumId = album.id;
    document.getElementById('edit-album-title').value = album.title || '';
    document.getElementById('edit-album-cover').value = album.cover_url || '';
    document.getElementById('edit-album-desc').value = album.description || '';
    api('/eratags').then(tags => {
      document.getElementById('edit-album-era').innerHTML =
        '<option value="">No era tag</option>' +
        tags.map(t => `<option value="${t.id}" ${album.era_tag_id === t.id ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('');
    }).catch(() => {});
    document.getElementById('edit-album-modal').classList.add('open');
  }

  async function saveEditAlbum() {
    const title = document.getElementById('edit-album-title').value.trim();
    if (!title) return showAlert('edit-album-alert', 'Title is required');
    clearAlert('edit-album-alert');
    try {
      const updated = await api(`/albums/${editingAlbumId}`, {
        method: 'PUT',
        body: JSON.stringify({
          title,
          era_tag_id: document.getElementById('edit-album-era').value || null,
          cover_url: document.getElementById('edit-album-cover').value.trim() || null,
          description: document.getElementById('edit-album-desc').value.trim() || null,
        }),
      });
      comps = comps.map(a => a.id === editingAlbumId ? { ...a, ...updated } : a);
      document.getElementById('edit-album-modal').classList.remove('open');
      editingAlbumId = null;
      renderComps();
      showAlert('alert-container', '✓ Comp updated', 'success');
    } catch (err) {
      showAlert('edit-album-alert', err.message);
    }
  }

  // ── Profile Image Upload ──
  async function uploadProfileImage(inputId, field) {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return;
    const statusEl = document.getElementById(`${field}-status`);
    if (statusEl) statusEl.textContent = 'Uploading…';
    try {
      const form = new FormData();
      form.append('image', file);
      const res = await apiUpload('/upload/image', form);
      const urlInput = document.getElementById(field === 'profile_image_url' ? 'edit-avatar' : 'edit-banner');
      if (urlInput) urlInput.value = res.url;
      if (statusEl) statusEl.textContent = '✓ Uploaded';
      const preview = document.getElementById('profile_image_url-preview');
      if (field === 'profile_image_url' && preview) { preview.src = res.url; preview.style.display = ''; }
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Upload failed';
    }
  }

  // ── Comp Audio Upload ──
  let compAudioFiles = []; // Array of File objects queued for upload when Comp is submitted

  function onCompAudioDrop(e) {
    e.preventDefault();
    document.getElementById('comp-audio-zone').classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
    addCompAudioFiles(files);
  }

  function onCompAudioSelect(e) {
    const files = Array.from(e.target.files);
    addCompAudioFiles(files);
    e.target.value = '';
  }

  function addCompAudioFiles(files) {
    for (const f of files) {
      if (!compAudioFiles.find(x => x.name === f.name)) {
        compAudioFiles.push(f);
      }
    }
    renderCompAudioQueue();
  }

  function renderCompAudioQueue() {
    const container = document.getElementById('comp-audio-queue');
    if (!container) return;
    if (!compAudioFiles.length) { container.innerHTML = ''; return; }
    container.innerHTML = compAudioFiles.map((f, i) => `
      <div class="tracklist-item" style="opacity:1;">
        <div class="tracklist-num">${i+1}</div>
        <div class="tracklist-info" style="flex:1;">
          <div class="tracklist-title">${escHtml(f.name)}</div>
          <div class="tracklist-artist">${(f.size / 1024 / 1024).toFixed(1)} MB</div>
        </div>
        <button class="tracklist-remove" onclick="removeCompAudioFile(${i})">×</button>
      </div>`).join('');
  }

  function removeCompAudioFile(i) {
    compAudioFiles.splice(i, 1);
    renderCompAudioQueue();
  }

  async function uploadProfileImage(inputId, field) {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return;
    const statusEl = document.getElementById(`${field}-status`);
    if (statusEl) statusEl.textContent = 'Uploading…';
    try {
      const form = new FormData();
      form.append('image', file);
      const result = await apiUpload('/upload/image', form);
      const url = result.url;
      if (field === 'profile_image_url') {
        document.getElementById('edit-avatar').value = url;
        const preview = document.getElementById('profile_image_url-preview');
        if (preview) { preview.src = url; preview.style.display = ''; }
      } else if (field === 'banner_url') {
        document.getElementById('edit-banner').value = url;
      }
      if (statusEl) statusEl.textContent = '✓ Uploaded';
    } catch (err) {
      if (statusEl) statusEl.textContent = 'Upload failed';
      alert('Image upload failed: ' + err.message);
    }
  }

  loadDashboard();
</script>
