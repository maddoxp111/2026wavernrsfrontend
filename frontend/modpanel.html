<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — mod panel</title>
  <link rel="stylesheet" href="/css/style.css?v=261967381b39">
  <script src="/js/status-card.js?v=261967381b39"></script>
  <script src="/js/down.js?v=261967381b39"></script>
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script src="/js/api.js?v=261967381b39"></script>
<script src="/js/layout.js?v=261967381b39"></script>
<script src="/js/player.js?v=261967381b39"></script>
<script src="/js/router.js?v=261967381b39"></script>
<script>
  var _allUsers = [];

  // ── Auth + mod check ──────────────────────────────────────────────────────
  (function init() {
    var token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }

    fetch(API_BASE + '/mod/check', {
      headers: { 'Authorization': 'Bearer ' + token },
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || !d.is_mod) {
          document.getElementById('view').innerHTML =
            '<div style="padding:48px 24px;text-align:center;">' +
            '<div style="font-size:18px;font-weight:700;color:var(--red);margin-bottom:8px;">Access denied</div>' +
            '<div style="font-size:14px;color:var(--text-2);">you dont have mod perms</div>' +
            '</div>';
          setTimeout(function() { window.location.href = '/index'; }, 2500);
          return;
        }
        // Mod confirmed. Require a password re-auth before opening the panel
        // (verified once per browser session).
        var ra = sessionStorage.getItem('mod_reauth_ok');
        if (ra && ra !== '1') {
          renderShell();
          loadUsers();
        } else {
          showModPasswordGate();
        }
      })
      .catch(function() {
        document.getElementById('view').innerHTML =
          '<div style="padding:48px 24px;text-align:center;color:var(--red);">couldnt check if youre a mod...try again</div>';
      });
  })();

  // ── Password gate ───────────────────────────────────────────────────────────
  function showModPasswordGate(errMsg) {
    document.getElementById('view').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;min-height:70vh;padding:24px;">' +
        '<div style="background:var(--elevated);border-radius:var(--r-lg);padding:36px 32px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.18);">' +
          '<div style="font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">wavernrs</div>' +
          '<h1 style="font-size:24px;font-weight:800;margin:0 0 6px;">Mod Panel</h1>' +
          '<p style="font-size:14px;color:var(--text-2);margin:0 0 24px;">type your account password to keep going</p>' +
          '<div id="mod-gate-alert" style="margin-bottom:12px;">' +
            (errMsg ? '<div style="color:var(--red);font-size:13px;">' + escHtml(errMsg) + '</div>' : '') +
          '</div>' +
          '<div class="form-group" style="margin-bottom:16px;">' +
            '<input type="password" id="mod-gate-pw" placeholder="Your password" class="wv-input" ' +
              'style="width:100%;padding:11px 14px;font-size:14px;" onkeydown="if(event.key===\'Enter\') verifyModPassword()">' +
          '</div>' +
          '<button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="verifyModPassword()">Enter</button>' +
        '</div>' +
      '</div>';
    setTimeout(function() { var f = document.getElementById('mod-gate-pw'); if (f) f.focus(); }, 50);
  }

  window.verifyModPassword = function() {
    var pwEl = document.getElementById('mod-gate-pw');
    var pw = pwEl ? pwEl.value : '';
    if (!pw) { showModPasswordGate('type your password'); return; }
    var token = localStorage.getItem('token');
    fetch(API_BASE + '/mod/reauth', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    })
      .then(function(r) { return r.json().then(function(d) { return { status: r.status, d: d }; }); })
      .then(function(res) {
        if (res.d && res.d.ok) {
          if (res.d.reauth) sessionStorage.setItem('mod_reauth_ok', res.d.reauth);
          renderShell();
          loadUsers();
        } else if (res.status === 429) {
          showModPasswordGate('too many tries...wait a bit and try again');
        } else {
          showModPasswordGate((res.d && res.d.error) || 'Incorrect password');
        }
      })
      .catch(function() { showModPasswordGate('connection error...try again'); });
  };

  // ── Shell ─────────────────────────────────────────────────────────────────
  function renderShell() {
    document.getElementById('view').innerHTML =
      '<div style="padding:28px 0 80px;max-width:1040px;">' +
        '<h1 style="font-size:26px;font-weight:800;margin:0 0 24px;">Mod Panel</h1>' +

        '<div class="wv-card" style="padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">' +
          '<div style="flex:1;min-width:200px;font-size:13.5px;color:var(--text-2);line-height:1.5;">archive uploads, link imports and the Discord bot queue are in the archive panel now</div>' +
          '<a class="wv-pill brand" href="/archivepanel" style="font-size:12.5px;padding:7px 14px;">Open the archive panel</a>' +
        '</div>' +

        '<div style="display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--hair-strong);overflow-x:auto;flex-wrap:nowrap;" class="no-scrollbar">' +
          '<button class="wv-admin-tab active" id="mtab-users"         onclick="showModTab(\'users\')">Users</button>' +
          '<button class="wv-admin-tab"        id="mtab-uploads"       onclick="showModTab(\'uploads\')">Recent Uploads</button>' +
          '<button class="wv-admin-tab"        id="mtab-replace-audio" onclick="showModTab(\'replace-audio\')">Replace Audio</button>' +
          '<button class="wv-admin-tab"        id="mtab-eras"          onclick="showModTab(\'eras\')">Era Keywords</button>' +
          '<button class="wv-admin-tab"        id="mtab-dupes"         onclick="showModTab(\'dupes\')">Duplicates</button>' +
        '</div>' +

        '<div id="mod-alert" style="margin-bottom:12px;"></div>' +

        // Users tab
        '<div id="mod-tab-users">' +
          '<div style="margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
            '<input type="text" id="user-search" class="wv-input" placeholder="search by username..." ' +
              'style="max-width:320px;padding:9px 14px;" oninput="filterUsers()">' +
            '<span id="users-count" style="font-size:12px;color:var(--text-3);"></span>' +
          '</div>' +
          '<div id="users-list"><div class="loading"><div class="spinner"></div></div></div>' +
        '</div>' +

        // Uploads tab
        '<div id="mod-tab-uploads" style="display:none;">' +
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">' +
            '<input id="uploads-q" class="wv-input" placeholder="search every comp and edit by title, artist or account..." style="flex:1;min-width:220px;max-width:460px;padding:8px 12px;font-size:13.5px;" oninput="uploadsSearchInput()">' +
            '<span id="uploads-count" style="font-size:12px;color:var(--text-3);"></span>' +
          '</div>' +
          '<div id="uploads-list"><div class="loading"><div class="spinner"></div></div></div>' +
        '</div>' +

        // Replace Audio tab
        '<div id="mod-tab-replace-audio" style="display:none;">' +
          '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--purple);">' +
            '<div style="font-size:13px;font-weight:700;color:var(--purple-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">What this tool does</div>' +
            '<p style="margin:0;font-size:14px;color:var(--text-2);line-height:1.6;">' +
              'use this when a track has the wrong audio...like when 2 tracks in the same comp had the same filename on Internet Archive and one overwrote the other. ' +
              'upload the right file here and it goes to IA and updates the track <strong style="color:var(--text-1);">without touching plays, likes or comments</strong>. ' +
              'the old IA file stays up (IA doesnt let you delete stuff)...only the database url changes so the player uses the new file right away.' +
            '</p>' +
          '</div>' +

          '<div style="margin-bottom:14px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Search track by title</label>' +
            '<div style="display:flex;gap:8px;">' +
              '<input type="text" id="ra-search" class="wv-input" placeholder="e.g. Hurricane V34" style="flex:1;max-width:400px;" oninput="raSearchDebounce()">' +
            '</div>' +
            '<div id="ra-results" style="margin-top:10px;"></div>' +
          '</div>' +

          '<div id="ra-selected" style="display:none;margin-bottom:18px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;">' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:4px;">Selected track</div>' +
            '<div id="ra-selected-title" style="font-size:15px;font-weight:700;"></div>' +
            '<div id="ra-selected-meta"  style="font-size:12px;color:var(--text-2);margin-top:2px;"></div>' +
          '</div>' +

          '<div style="margin-bottom:14px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Replacement audio file</label>' +
            '<input type="file" id="ra-file" accept="audio/*" class="wv-input" style="padding:8px 12px;">' +
          '</div>' +

          '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px;">MP3, WAV, FLAC, AAC or OGG...max 200 MB</div>' +

          '<button class="wv-pill brand" id="ra-submit" onclick="submitReplaceAudio()" disabled style="opacity:.5;cursor:not-allowed;">Upload Replacement</button>' +
          '<div id="ra-status" style="margin-top:12px;font-size:13px;"></div>' +
        '</div>' +

        '<div id="mod-tab-eras" style="display:none;">' +
          '<div class="wv-card" style="padding:18px 20px;margin-bottom:18px;">' +
            '<div style="font-weight:700;margin-bottom:4px;">Era Tag Keywords</div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">keywords for each era tag, split by commas. used when a comp is imported from a link on the site. discord and reddit archive imports are not auto-tagged; set their era from the archive panel.</div>' +
            '<div id="era-keywords-list" style="display:flex;flex-direction:column;gap:8px;"><div class="loading"><div class="spinner"></div></div></div>' +
          '</div>' +
        '</div>' +

        // Duplicates tab
        '<div id="mod-tab-dupes" style="display:none;">' +
          '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--purple);">' +
            '<div style="font-size:13px;font-weight:700;color:var(--purple-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Duplicate comps</div>' +
            '<p style="margin:0;font-size:14px;color:var(--text-2);line-height:1.6;">' +
              'bulk imports end up making the same comp twice a lot...like the same link posted in 2 channels or a folder scanned again after it half failed. ' +
              'each group below is one comp that exists more than once. keep the most complete copy (most tracks). ' +
              'when every copy is an archive comp the rest get merged into the one you keep: their plays, likes and links move over and you can bring them back from Removed in the archive panel. ' +
              'user uploads get deleted instead, and deleting a copy deletes its tracks too.' +
            '</p>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;">' +
            '<button class="wv-pill brand" onclick="loadDuplicates()">Scan for duplicates</button>' +
            '<span id="dupes-summary" style="font-size:12.5px;color:var(--text-3);"></span>' +
          '</div>' +
          '<div id="dupes-list"></div>' +
        '</div>' +

      '</div>';
  }

  function showModTab(tab) {
    ['users', 'uploads', 'replace-audio', 'eras', 'dupes'].forEach(function(t) {
      var panel = document.getElementById('mod-tab-' + t);
      var btn   = document.getElementById('mtab-' + t);
      if (panel) panel.style.display = t === tab ? '' : 'none';
      if (btn)   btn.classList.toggle('active', t === tab);
    });
    if (tab === 'uploads') loadUploads();
    if (tab === 'eras') loadEraKeywords();
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showAlert(msg, type) {
    var el = document.getElementById('mod-alert');
    if (!el) return;
    el.innerHTML = '<div style="padding:10px 14px;border-radius:10px;font-size:13px;background:var(--glass-small-bg);border:1px solid var(--hair);color:' + (type === 'error' ? 'var(--red)' : 'var(--green)') + ';">' + escHtml(msg) + '</div>';
    setTimeout(function() { if (el) el.innerHTML = ''; }, 4000);
  }

  function authHeaders() {
    var h = { 'Authorization': 'Bearer ' + localStorage.getItem('token'), 'Content-Type': 'application/json' };
    var ra = sessionStorage.getItem('mod_reauth_ok');
    if (ra && ra !== '1') h['X-Mod-Reauth'] = ra;
    return h;
  }

  function _modNeedsReauth(r, d) {
    if (r.status !== 403 || !d || d.error !== 'enter your password again') return false;
    sessionStorage.removeItem('mod_reauth_ok');
    showModPasswordGate(d.error);
    return true;
  }

  // ── Users ─────────────────────────────────────────────────────────────────
  var _usersTimer = null, _usersGen = 0;
  async function loadUsers() {
    var el = document.getElementById('users-list');
    if (!el) return;
    var q = ((document.getElementById('user-search') || {}).value || '').trim();
    var gen = ++_usersGen;
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var r = await fetch(API_BASE + '/mod/users' + (q ? '?q=' + encodeURIComponent(q) : ''), { headers: authHeaders() });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');
      if (gen !== _usersGen) return;
      _allUsers = data;
      var cnt = document.getElementById('users-count');
      if (cnt) cnt.textContent = q ? data.length + ' match' + (data.length === 1 ? '' : 'es') + (data.length >= 100 ? ' (first 100)' : '') : 'the 100 newest accounts';
      renderUsers(data);
    } catch (err) {
      if (gen !== _usersGen) return;
      if (el) el.innerHTML = '<div style="color:var(--red);">' + escHtml(err.message) + '</div>';
    }
  }

  function filterUsers() {
    clearTimeout(_usersTimer);
    _usersTimer = setTimeout(loadUsers, 300);
  }

  function renderUsers(users) {
    var el = document.getElementById('users-list');
    if (!el) return;
    if (!users || !users.length) {
      el.innerHTML = '<div style="color:var(--text-3);font-size:14px;padding:16px 0;">no users found</div>';
      return;
    }

    var html = users.map(function(u) {
      var ctBadge = u.community_timeout
        ? '<span class="wv-pill" style="background:var(--red);color:#fff;font-size:11px;padding:2px 8px;">Community + LP chat TO</span>'
        : '<span class="wv-pill" style="font-size:11px;padding:2px 8px;">No community + LP chat TO</span>';
      var utBadge = u.upload_timeout
        ? '<span class="wv-pill" style="background:var(--red);color:#fff;font-size:11px;padding:2px 8px;">Upload TO</span>'
        : '<span class="wv-pill" style="font-size:11px;padding:2px 8px;">No upload TO</span>';

      var ctActions = u.community_timeout
        ? '<button class="btn btn-secondary btn-sm" onclick="removeTimeout(\'' + u.id + '\',\'community\')">Remove community + LP chat timeout</button>'
        : timeoutForm(u.id, 'community');
      var utActions = u.upload_timeout
        ? '<button class="btn btn-secondary btn-sm" onclick="removeTimeout(\'' + u.id + '\',\'upload\')">Remove upload timeout</button>'
        : timeoutForm(u.id, 'upload');

      return '<div class="wv-card" style="margin-bottom:12px;padding:16px 18px;" id="user-row-' + u.id + '">' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">' +
          '<span style="font-size:15px;font-weight:700;">' + escHtml(u.username) + '</span>' +
          ctBadge + utBadge +
        '</div>' +
        '<div style="display:flex;gap:24px;flex-wrap:wrap;">' +
          '<div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;">Community + LP chat</div>' +
            ctActions +
          '</div>' +
          '<div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;">Upload</div>' +
            utActions +
          '</div>' +
          '<div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;">Password</div>' +
            '<button class="btn btn-secondary btn-sm" onclick="resetUserPassword(\'' + u.id + '\',\'' + escHtml(u.username) + '\')">Reset password</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    el.innerHTML = html;
  }

  function timeoutForm(userId, type) {
    var prefix = 'to_' + type + '_' + userId.replace(/-/g, '');
    return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">' +
      '<select id="' + prefix + '_dur" class="wv-input" style="padding:7px 10px;font-size:13px;width:130px;">' +
        '<option value="1">1 hour</option>' +
        '<option value="24">24 hours</option>' +
        '<option value="168">7 days</option>' +
        '<option value="720">30 days</option>' +
        '<option value="">Permanent</option>' +
      '</select>' +
      '<input type="text" id="' + prefix + '_reason" class="wv-input" placeholder="Reason (optional)" style="padding:7px 10px;font-size:13px;width:180px;">' +
      '<button class="btn btn-danger btn-sm" onclick="applyTimeout(\'' + userId + '\',\'' + type + '\',\'' + prefix + '\')">Timeout</button>' +
    '</div>';
  }

  async function applyTimeout(userId, type, prefix) {
    var durEl = document.getElementById(prefix + '_dur');
    var reasonEl = document.getElementById(prefix + '_reason');
    var durVal = durEl ? durEl.value : '';
    var reason = reasonEl ? reasonEl.value.trim() : '';
    var duration_hours = durVal !== '' ? parseInt(durVal, 10) : null;

    try {
      var r = await fetch(API_BASE + '/mod/timeout', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ user_id: userId, type: type, duration_hours: duration_hours, reason: reason || null }),
      });
      var d = await r.json();
      if (_modNeedsReauth(r, d)) return;
      if (!r.ok) throw new Error(d.error || 'Failed');
      showAlert('timeout applied', 'success');
      loadUsers();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  async function removeTimeout(userId, type) {
    try {
      var r = await fetch(API_BASE + '/mod/timeout/' + userId + '/' + type, {
        method: 'DELETE',
        headers: authHeaders(),
      });
      var d = await r.json();
      if (_modNeedsReauth(r, d)) return;
      if (!r.ok) throw new Error(d.error || 'Failed');
      showAlert('timeout removed', 'success');
      loadUsers();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  // ── Uploads ───────────────────────────────────────────────────────────────
  var _uploadsTimer = null, _uploadsGen = 0;
  window.uploadsSearchInput = function() { clearTimeout(_uploadsTimer); _uploadsTimer = setTimeout(loadUploads, 250); };
  async function loadUploads() {
    var el = document.getElementById('uploads-list');
    if (!el) return;
    var q = ((document.getElementById('uploads-q') || {}).value || '').trim();
    var gen = ++_uploadsGen;
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var r = await fetch(API_BASE + '/mod/uploads' + (q ? '?q=' + encodeURIComponent(q) : ''), { headers: authHeaders() });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');
      if (gen !== _uploadsGen) return;
      var cnt = document.getElementById('uploads-count'); if (cnt) cnt.textContent = q ? (data.length + ' result' + (data.length === 1 ? '' : 's') + ' for "' + q + '"') : 'latest 50 uploads';
      renderUploads(data);
    } catch (err) {
      if (el) el.innerHTML = '<div style="color:var(--red);">' + escHtml(err.message) + '</div>';
    }
  }

  function renderUploads(items) {
    var el = document.getElementById('uploads-list');
    if (!el) return;
    if (!items || !items.length) {
      el.innerHTML = '<div style="color:var(--text-3);font-size:14px;padding:16px 0;">no recent uploads</div>';
      return;
    }

    var html = '<div class="wv-comp-grid wv-comp-grid-4">' +
      items.map(function(item) {
        var cover = item.cover_url
          ? '<img src="' + escHtml(item.cover_url) + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px 10px 0 0;" loading="lazy">'
          : '<div style="width:100%;aspect-ratio:1;background:var(--hair);border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:28px;">' + (item._type === 'album' ? '💿' : '🎵') + '</div>';
        var typeBadge = item._type === 'album'
          ? '<span class="wv-pill brand" style="font-size:11px;padding:2px 7px;">Comp</span>'
          : '<span class="wv-pill" style="font-size:11px;padding:2px 7px;">Edit</span>';

        return '<div class="wv-comp-card" id="upload-card-' + item._type + '-' + item.id + '" style="border-radius:12px;overflow:hidden;">' +
          cover +
          '<div style="padding:10px 12px 12px;">' +
            '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px;">' +
              '<span style="font-size:13px;font-weight:600;line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(item.title) + '</span>' +
              typeBadge +
            '</div>' +
            '<div style="font-size:12px;color:var(--text-2);margin-bottom:10px;">' + escHtml(item.artist_name || '') + '</div>' +
            '<button class="btn btn-danger btn-sm" style="width:100%;" onclick="takeDown(\'' + item._type + '\',\'' + item.id + '\')">Take down</button>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';

    el.innerHTML = html;
  }

  async function takeDown(type, id) {
    if (!confirm(type === 'album'
      ? 'take down this comp? it goes to the recycle bin (Archive panel > Deleted). only the last 60 deleted comps can be restored'
      : 'take down this edit? this cant be undone')) return;
    try {
      var endpoint = type === 'album' ? '/mod/albums/' + id : '/mod/tracks/' + id;
      var r = await fetch(API_BASE + endpoint, { method: 'DELETE', headers: authHeaders() });
      var d = await r.json();
      if (_modNeedsReauth(r, d)) return;
      if (!r.ok) throw new Error(d.error || 'Failed');
      var card = document.getElementById('upload-card-' + type + '-' + id);
      if (card) card.remove();
      showAlert('removed', 'success');
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  // ── Password Reset ────────────────────────────────────────────────────────
  async function resetUserPassword(userId, username) {
    if (!confirm('reset the password for ' + username + '? they will get a one-time temporary password')) return;
    try {
      var r = await fetch(API_BASE + '/mod/users/' + userId + '/reset-password', { method: 'POST', headers: authHeaders() });
      var d = await r.json();
      if (_modNeedsReauth(r, d)) return;
      if (!r.ok) throw new Error(d.error || 'Failed');
      _showTempPassword(userId, d.username || username, d.temp_password || '');
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  function _showTempPassword(userId, username, temp) {
    var row = document.getElementById('user-row-' + userId);
    if (!row) { alert('send this to ' + username + ' privately: ' + temp); return; }
    var old = row.querySelector('.temp-pw');
    if (old) old.remove();
    var box = document.createElement('div');
    box.className = 'temp-pw';
    box.style.cssText = 'margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--hair);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;';
    box.innerHTML = '<span style="color:var(--text-2);">send this to ' + escHtml(username) + ' privately:</span>' +
      '<code style="font-size:14px;font-weight:700;user-select:all;">' + escHtml(temp) + '</code>' +
      '<button class="btn btn-secondary btn-sm">Copy</button>';
    var btn = box.querySelector('button');
    btn.addEventListener('click', function() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(temp).then(function() { btn.textContent = 'Copied'; }, function() { btn.textContent = 'Copy failed, select it instead'; });
      } else {
        btn.textContent = 'Select it and copy';
      }
    });
    row.appendChild(box);
  }

  // ── Replace Audio ─────────────────────────────────────────────────────────
  var _raSelectedId = null;
  var _raSearchTimer = null;

  function raSearchDebounce() {
    clearTimeout(_raSearchTimer);
    _raSearchTimer = setTimeout(raRunSearch, 300);
  }

  async function raRunSearch() {
    var q = (document.getElementById('ra-search') || {}).value || '';
    var resultsEl = document.getElementById('ra-results');
    if (!resultsEl) return;
    if (q.trim().length < 2) { resultsEl.innerHTML = ''; return; }
    resultsEl.innerHTML = '<div style="color:var(--text-3);font-size:13px;">Searching…</div>';
    try {
      var r = await fetch(API_BASE + '/mod/tracks/search?q=' + encodeURIComponent(q.trim()), { headers: authHeaders() });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Search failed');
      if (!data.length) { resultsEl.innerHTML = '<div style="color:var(--text-3);font-size:13px;">no tracks found</div>'; return; }
      resultsEl.innerHTML = data.map(function(t) {
        var meta = [t.artist_name, t.album_title ? 'from "' + escHtml(t.album_title) + '"' : null].filter(Boolean).join(' · ');
        return '<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="raSelectTrack(\'' + t.id + '\',\'' + escHtml(t.title).replace(/'/g, '\\\'') + '\',\'' + escHtml(meta).replace(/'/g, '\\\'') + '\')">' +
          (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" style="width:36px;height:36px;border-radius:5px;object-fit:cover;flex-shrink:0;">' : '<div style="width:36px;height:36px;border-radius:5px;background:var(--hair);flex-shrink:0;"></div>') +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(t.title) + '</div>' +
            '<div style="font-size:12px;color:var(--text-2);">' + escHtml(meta) + '</div>' +
          '</div>' +
          '<button class="wv-pill" style="font-size:12px;flex-shrink:0;">Select</button>' +
        '</div>';
      }).join('');
    } catch (err) {
      resultsEl.innerHTML = '<div style="color:var(--red);font-size:13px;">' + escHtml(err.message) + '</div>';
    }
  }

  function raSelectTrack(id, title, meta) {
    _raSelectedId = id;
    var selEl = document.getElementById('ra-selected');
    if (selEl) selEl.style.display = '';
    var titleEl = document.getElementById('ra-selected-title');
    if (titleEl) titleEl.textContent = title;
    var metaEl = document.getElementById('ra-selected-meta');
    if (metaEl) metaEl.textContent = meta;
    var resultsEl = document.getElementById('ra-results');
    if (resultsEl) resultsEl.innerHTML = '';
    var searchEl = document.getElementById('ra-search');
    if (searchEl) searchEl.value = '';
    raUpdateSubmit();
  }

  function raUpdateSubmit() {
    var btn = document.getElementById('ra-submit');
    var fileEl = document.getElementById('ra-file');
    var ready = _raSelectedId && fileEl && fileEl.files && fileEl.files.length > 0;
    if (btn) {
      btn.disabled = !ready;
      btn.style.opacity = ready ? '1' : '.5';
      btn.style.cursor = ready ? 'pointer' : 'not-allowed';
    }
  }

  // Wire file input change to enable/disable submit
  document.addEventListener('change', function(e) {
    if (e.target && e.target.id === 'ra-file') raUpdateSubmit();
  });

  async function submitReplaceAudio() {
    if (!_raSelectedId) return;
    var fileEl = document.getElementById('ra-file');
    if (!fileEl || !fileEl.files || !fileEl.files.length) return;
    var statusEl = document.getElementById('ra-status');
    var btn = document.getElementById('ra-submit');

    if (btn) { btn.disabled = true; btn.textContent = 'Uploading…'; btn.style.opacity = '.6'; }
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-2);">uploading to Internet Archive...this might take a minute</span>';

    var fd = new FormData();
    fd.append('audio', fileEl.files[0]);
    var raHeaders = authHeaders();
    delete raHeaders['Content-Type'];

    try {
      var r = await fetch(API_BASE + '/mod/tracks/' + _raSelectedId + '/replace-audio', {
        method: 'POST',
        headers: raHeaders,
        body: fd,
      });
      var d = await r.json();
      if (_modNeedsReauth(r, d)) return;
      if (!r.ok) throw new Error(d.error || 'Upload failed');
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--green);">✓ audio replaced...the player uses the new file right away</span>';
      // Reset form
      _raSelectedId = null;
      var selEl = document.getElementById('ra-selected');
      if (selEl) selEl.style.display = 'none';
      if (fileEl) fileEl.value = '';
    } catch (err) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--red);">' + escHtml(err.message) + '</span>';
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Upload Replacement'; btn.style.opacity = '1'; }
      raUpdateSubmit();
    }
  }

  async function loadEraKeywords() {
    var el = document.getElementById('era-keywords-list');
    if (!el) return;
    try {
      var tags = await api('/eratags');
      _arcRenderKeywords(tags || []);
    } catch (err) {
      el.innerHTML = '<div style="color:var(--red);font-size:13px;">' + escHtml(err.message || 'couldnt load the era tags') + '</div>';
    }
  }

  function _arcRenderKeywords(tags) {
    var el = document.getElementById('era-keywords-list');
    if (!el) return;
    el.innerHTML = tags.map(function(t) {
      return (
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
          '<span style="font-size:13px;font-weight:600;min-width:110px;flex-shrink:0;">' + escHtml(t.name) + '</span>' +
          '<input id="kw-' + escHtml(t.id) + '" class="wv-input" ' +
            'value="' + escHtml((t.keywords || []).join(', ')) + '" ' +
            'placeholder="keyword1, keyword2..." ' +
            'style="flex:1;min-width:180px;font-size:13px;padding:7px 10px;">' +
          '<button class="wv-pill brand" style="padding:6px 14px;font-size:12px;" ' +
            'onclick="saveEraTagKeywords(\'' + escHtml(t.id) + '\', this)">Save</button>' +
        '</div>'
      );
    }).join('');
  }

  async function saveEraTagKeywords(tagId, btn) {
    var inp = document.getElementById('kw-' + tagId);
    if (!inp) return;
    var keywords = inp.value.split(',').map(function(k) { return k.trim(); }).filter(Boolean);
    var orig = btn.textContent;
    btn.disabled = true;
    try {
      await api('/eratags/' + tagId + '/keywords', { method: 'PATCH', body: JSON.stringify({ keywords: keywords }) });
      btn.textContent = '✓';
      setTimeout(function() { btn.textContent = orig; btn.disabled = false; }, 1500);
    } catch (err) {
      btn.textContent = 'Error';
      setTimeout(function() { btn.textContent = orig; btn.disabled = false; }, 1500);
    }
  }

  // ── Duplicates tab ────────────────────────────────────────────────────────
  var _dupeGroups = [];

  async function loadDuplicates() {
    var el = document.getElementById('dupes-list');
    var sum = document.getElementById('dupes-summary');
    if (!el) return;
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    if (sum) sum.textContent = 'Scanning…';
    try {
      var r = await fetch(API_BASE + '/mod/duplicates', { headers: authHeaders() });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed');
      _dupeGroups = d.groups || [];
      if (sum) {
        sum.textContent = _dupeGroups.length
          ? _dupeGroups.length + ' duplicate group' + (_dupeGroups.length !== 1 ? 's' : '') + ' found'
          : 'no duplicates found';
      }
      renderDuplicates();
    } catch (err) {
      if (sum) sum.textContent = '';
      el.innerHTML = '<div style="color:var(--red);font-size:13px;">' + escHtml(err.message) + '</div>';
    }
  }

  function renderDuplicates() {
    var el = document.getElementById('dupes-list');
    if (!el) return;
    if (!_dupeGroups.length) {
      el.innerHTML = '<div style="color:var(--text-3);font-size:14px;padding:12px 0;">nothing to clean up...no duplicate comps found</div>';
      return;
    }
    el.innerHTML = _dupeGroups.map(function(g, gi) {
      var allArchive = g.albums.every(function(a) { return a.is_archive; });
      var rows = g.albums.map(function(a) {
        var checked = a.id === g.suggested_keep_id ? ' checked' : '';
        var badge = a.id === g.suggested_keep_id
          ? '<span style="font-size:10px;font-weight:700;color:var(--green);letter-spacing:.04em;">SUGGESTED</span>'
          : '';
        return '<label style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:6px;cursor:pointer;">' +
          '<input type="radio" name="dupe-keep-' + gi + '" value="' + escHtml(a.id) + '"' + checked + ' style="flex-shrink:0;">' +
          (a.cover_url
            ? '<img src="' + escHtml(a.cover_url) + '" style="width:34px;height:34px;border-radius:5px;object-fit:cover;flex-shrink:0;" onerror="this.style.opacity=0">'
            : '<div style="width:34px;height:34px;border-radius:5px;background:var(--hair);flex-shrink:0;"></div>') +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
              escHtml(a.title || 'Untitled') + ' ' + badge + '</div>' +
            '<div style="font-size:11.5px;color:var(--text-3);">' +
              a.track_count + ' track' + (a.track_count !== 1 ? 's' : '') +
              ' · ' + (a.play_count || 0) + ' plays' +
              ' · ' + _discordRelTime(a.created_at) +
              (a.is_archive ? ' · archive' : '') +
            '</div>' +
          '</div>' +
          '<a href="/album?id=' + escHtml(a.id) + '" target="_blank" rel="noopener" ' +
            'onclick="event.stopPropagation()" class="wv-pill" style="font-size:11px;padding:3px 10px;flex-shrink:0;">View</a>' +
        '</label>';
      }).join('');

      return '<div class="wv-card" style="padding:16px 18px;margin-bottom:14px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
          '<div style="font-size:14px;font-weight:700;">' + escHtml(g.albums[0].artist_name) + ' · ' + escHtml(g.albums[0].title || '') + '</div>' +
          '<span style="font-size:11px;color:var(--text-3);">' + g.albums.length + ' copies · ' + escHtml(g.reason) + '</span>' +
        '</div>' +
        rows +
        '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
          '<button class="wv-pill" style="font-size:12px;padding:5px 14px;background:color-mix(in srgb, var(--red) 13%, transparent);color:var(--red);border:1px solid color-mix(in srgb, var(--red) 27%, transparent);" ' +
            'onclick="mergeDupeGroup(' + gi + ', this)">' + (allArchive ? 'Keep selected, merge the rest' : 'Keep selected, delete the rest') + '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  window.mergeDupeGroup = async function(gi, btn) {
    var g = _dupeGroups[gi];
    if (!g) return;
    var picked = document.querySelector('input[name="dupe-keep-' + gi + '"]:checked');
    if (!picked) { showAlert('pick which copy to keep first', 'error'); return; }
    var keepId = picked.value;
    var removeIds = g.albums.map(function(a) { return a.id; }).filter(function(id) { return id !== keepId; });
    if (!removeIds.length) return;
    var allArchive = g.albums.every(function(a) { return a.is_archive; });
    var n = removeIds.length;
    var ask = allArchive
      ? 'Merge ' + n + ' cop' + (n === 1 ? 'y' : 'ies') + ' into the one you picked? You can bring them back from Removed in the archive panel.'
      : 'Delete ' + n + ' duplicate cop' + (n === 1 ? 'y' : 'ies') + '? their tracks get deleted too. you cant undo this';
    if (!confirm(ask)) return;

    var idleLabel = allArchive ? 'Keep selected, merge the rest' : 'Keep selected, delete the rest';
    if (btn) { btn.disabled = true; btn.textContent = allArchive ? 'Merging…' : 'Deleting…'; }
    try {
      var r = await fetch(API_BASE + '/mod/duplicates/merge', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ keep_id: keepId, remove_ids: removeIds }),
      });
      var d = await r.json();
      if (_modNeedsReauth(r, d)) return;
      if (!r.ok) throw new Error(d.error || 'Failed');
      var parts = [];
      if (d.merged) parts.push('merged ' + d.merged);
      if (d.deleted) parts.push('removed ' + d.deleted);
      var failed = d.failed || [];
      if (failed.length) {
        showAlert((parts.length ? parts.join(', ') + ', ' : '') + failed.length + ' failed: ' + (failed[0].error || 'unknown error'), 'error');
        if (btn) { btn.disabled = false; btn.textContent = idleLabel; }
        return;
      }
      showAlert((parts.join(', ') || 'nothing changed') + '.', 'success');
      _dupeGroups.splice(gi, 1);
      renderDuplicates();
      var sum = document.getElementById('dupes-summary');
      if (sum) sum.textContent = _dupeGroups.length + ' duplicate group' + (_dupeGroups.length !== 1 ? 's' : '') + ' remaining';
    } catch (err) {
      showAlert(err.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = idleLabel; }
    }
  };

  function _discordRelTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var diff = Date.now() - d.getTime();
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return Math.floor(diff / 86400000) + 'd ago';
  }
</script>
</body>
