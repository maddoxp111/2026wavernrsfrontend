<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — mod panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  var _allUsers = [];

  // ── Auth + mod check ──────────────────────────────────────────────────────
  (function init() {
    var token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login.html'; return; }

    fetch(API_BASE + '/mod/check', {
      headers: { 'Authorization': 'Bearer ' + token },
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || !d.is_mod) {
          document.getElementById('view').innerHTML =
            '<div style="padding:48px 24px;text-align:center;">' +
            '<div style="font-size:18px;font-weight:700;color:var(--red);margin-bottom:8px;">Access denied</div>' +
            '<div style="font-size:14px;color:var(--text-2);">You do not have moderator permissions.</div>' +
            '</div>';
          setTimeout(function() { window.location.href = '/index.html'; }, 2500);
          return;
        }
        // Mod confirmed. Require a password re-auth before opening the panel
        // (verified once per browser session).
        if (sessionStorage.getItem('mod_reauth_ok') === '1') {
          renderShell();
          loadUsers();
        } else {
          showModPasswordGate();
        }
      })
      .catch(function() {
        document.getElementById('view').innerHTML =
          '<div style="padding:48px 24px;text-align:center;color:var(--red);">Failed to verify moderator status.</div>';
      });
  })();

  // ── Password gate ───────────────────────────────────────────────────────────
  function showModPasswordGate(errMsg) {
    document.getElementById('view').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;min-height:70vh;padding:24px;">' +
        '<div style="background:var(--glass-large-bg);backdrop-filter:blur(var(--lg-frost-large));-webkit-backdrop-filter:blur(var(--lg-frost-large));border:1px solid var(--glass-large-border);border-radius:24px;padding:36px 32px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.18);">' +
          '<div style="font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">wavernrs</div>' +
          '<h1 style="font-size:24px;font-weight:800;margin:0 0 6px;">Mod Panel</h1>' +
          '<p style="font-size:14px;color:var(--text-2);margin:0 0 24px;">Enter your account password to continue</p>' +
          '<div id="mod-gate-alert" style="margin-bottom:12px;">' +
            (errMsg ? '<div style="color:var(--red);font-size:13px;">' + escHtml(errMsg) + '</div>' : '') +
          '</div>' +
          '<div class="form-group" style="margin-bottom:16px;">' +
            '<input type="password" id="mod-gate-pw" placeholder="Your password" class="wv-input" ' +
              'style="width:100%;padding:11px 14px;font-size:14px;" onkeydown="if(event.key===\'Enter\') verifyModPassword()">' +
          '</div>' +
          '<button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="verifyModPassword()">Enter</button>' +
        '</div>' +
      '</div>';
    setTimeout(function() { var f = document.getElementById('mod-gate-pw'); if (f) f.focus(); }, 50);
  }

  window.verifyModPassword = function() {
    var pwEl = document.getElementById('mod-gate-pw');
    var pw = pwEl ? pwEl.value : '';
    if (!pw) { showModPasswordGate('Enter your password'); return; }
    var token = localStorage.getItem('token');
    fetch(API_BASE + '/mod/reauth', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    })
      .then(function(r) { return r.json().then(function(d) { return { status: r.status, d: d }; }); })
      .then(function(res) {
        if (res.d && res.d.ok) {
          sessionStorage.setItem('mod_reauth_ok', '1');
          renderShell();
          loadUsers();
        } else if (res.status === 429) {
          showModPasswordGate('Too many attempts. Try again later.');
        } else {
          showModPasswordGate((res.d && res.d.error) || 'Incorrect password');
        }
      })
      .catch(function() { showModPasswordGate('Connection error. Try again.'); });
  };

  // ── Shell ─────────────────────────────────────────────────────────────────
  function renderShell() {
    document.getElementById('view').innerHTML =
      '<div style="padding:28px 0 80px;max-width:1040px;">' +
        '<h1 style="font-size:26px;font-weight:800;margin:0 0 24px;">Mod Panel</h1>' +

        // Tab bar
        '<div style="display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--hair-strong);">' +
          '<button class="wv-admin-tab active" id="mtab-users"         onclick="showModTab(\'users\')">Users</button>' +
          '<button class="wv-admin-tab"        id="mtab-uploads"       onclick="showModTab(\'uploads\')">Recent Uploads</button>' +
          '<button class="wv-admin-tab"        id="mtab-replace-audio" onclick="showModTab(\'replace-audio\')">Replace Audio</button>' +
        '</div>' +

        '<div id="mod-alert" style="margin-bottom:12px;"></div>' +

        // Users tab
        '<div id="mod-tab-users">' +
          '<div style="margin-bottom:16px;">' +
            '<input type="text" id="user-search" class="wv-input" placeholder="Search by username..." ' +
              'style="max-width:320px;padding:9px 14px;" oninput="filterUsers()">' +
          '</div>' +
          '<div id="users-list"><div class="loading"><div class="spinner"></div></div></div>' +
        '</div>' +

        // Uploads tab
        '<div id="mod-tab-uploads" style="display:none;">' +
          '<div id="uploads-list"><div class="loading"><div class="spinner"></div></div></div>' +
        '</div>' +

        // Replace Audio tab
        '<div id="mod-tab-replace-audio" style="display:none;">' +
          '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--purple);">' +
            '<div style="font-size:13px;font-weight:700;color:var(--purple-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">What this tool does</div>' +
            '<p style="margin:0;font-size:14px;color:var(--text-2);line-height:1.6;">' +
              'Use this to fix a track whose audio is wrong — for example, when two tracks in the same comp shared an identical filename on Internet Archive and one overwrote the other. ' +
              'Uploading a replacement file here pushes the correct audio to IA and updates the track in the database <strong style="color:var(--text-1);">without touching plays, likes, or comments</strong>. ' +
              'The old IA file is left in place (IA does not support deletion); only the database URL is updated so the player immediately uses the new file.' +
            '</p>' +
          '</div>' +

          '<div style="margin-bottom:14px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Search track by title</label>' +
            '<div style="display:flex;gap:8px;">' +
              '<input type="text" id="ra-search" class="wv-input" placeholder="e.g. Hurricane V34" style="flex:1;max-width:400px;" oninput="raSearchDebounce()">' +
            '</div>' +
            '<div id="ra-results" style="margin-top:10px;"></div>' +
          '</div>' +

          '<div id="ra-selected" style="display:none;margin-bottom:18px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;">' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:4px;">Selected track</div>' +
            '<div id="ra-selected-title" style="font-size:15px;font-weight:700;"></div>' +
            '<div id="ra-selected-meta"  style="font-size:12px;color:var(--text-2);margin-top:2px;"></div>' +
          '</div>' +

          '<div style="margin-bottom:14px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Replacement audio file</label>' +
            '<input type="file" id="ra-file" accept="audio/*" class="wv-input" style="padding:8px 12px;">' +
          '</div>' +

          '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px;">Accepted: MP3, WAV, FLAC, AAC, OGG — max 200 MB</div>' +

          '<button class="wv-pill brand" id="ra-submit" onclick="submitReplaceAudio()" disabled style="opacity:.5;cursor:not-allowed;">Upload Replacement</button>' +
          '<div id="ra-status" style="margin-top:12px;font-size:13px;"></div>' +
        '</div>' +

      '</div>';
  }

  function showModTab(tab) {
    ['users', 'uploads', 'replace-audio'].forEach(function(t) {
      var panel = document.getElementById('mod-tab-' + t);
      var btn   = document.getElementById('mtab-' + t);
      if (panel) panel.style.display = t === tab ? '' : 'none';
      if (btn)   btn.classList.toggle('active', t === tab);
    });
    if (tab === 'uploads') loadUploads();
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showAlert(msg, type) {
    var el = document.getElementById('mod-alert');
    if (!el) return;
    el.innerHTML = '<div style="padding:10px 14px;border-radius:10px;font-size:13px;background:var(--glass-small-bg);border:1px solid var(--hair);color:' + (type === 'error' ? 'var(--red)' : '#4ade80') + ';">' + escHtml(msg) + '</div>';
    setTimeout(function() { if (el) el.innerHTML = ''; }, 4000);
  }

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + localStorage.getItem('token'), 'Content-Type': 'application/json' };
  }

  // ── Users ─────────────────────────────────────────────────────────────────
  async function loadUsers() {
    var el = document.getElementById('users-list');
    if (!el) return;
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var r = await fetch(API_BASE + '/mod/users', { headers: authHeaders() });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');
      _allUsers = data;
      renderUsers(data);
    } catch (err) {
      if (el) el.innerHTML = '<div style="color:var(--red);">' + escHtml(err.message) + '</div>';
    }
  }

  function filterUsers() {
    var q = (document.getElementById('user-search') || {}).value || '';
    q = q.toLowerCase().trim();
    var filtered = q ? _allUsers.filter(function(u) { return u.username.toLowerCase().includes(q); }) : _allUsers;
    renderUsers(filtered);
  }

  function renderUsers(users) {
    var el = document.getElementById('users-list');
    if (!el) return;
    if (!users || !users.length) {
      el.innerHTML = '<div style="color:var(--text-3);font-size:14px;padding:16px 0;">No users found.</div>';
      return;
    }

    var html = users.map(function(u) {
      var ctBadge = u.community_timeout
        ? '<span class="wv-pill" style="background:var(--red);color:#fff;font-size:11px;padding:2px 8px;">Community TO</span>'
        : '<span class="wv-pill" style="font-size:11px;padding:2px 8px;">No community TO</span>';
      var utBadge = u.upload_timeout
        ? '<span class="wv-pill" style="background:var(--red);color:#fff;font-size:11px;padding:2px 8px;">Upload TO</span>'
        : '<span class="wv-pill" style="font-size:11px;padding:2px 8px;">No upload TO</span>';

      var ctActions = u.community_timeout
        ? '<button class="btn btn-secondary btn-sm" onclick="removeTimeout(\'' + u.id + '\',\'community\')">Remove community timeout</button>'
        : timeoutForm(u.id, 'community');
      var utActions = u.upload_timeout
        ? '<button class="btn btn-secondary btn-sm" onclick="removeTimeout(\'' + u.id + '\',\'upload\')">Remove upload timeout</button>'
        : timeoutForm(u.id, 'upload');

      return '<div class="wv-card" style="margin-bottom:12px;padding:16px 18px;" id="user-row-' + u.id + '">' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">' +
          '<span style="font-size:15px;font-weight:700;">' + escHtml(u.username) + '</span>' +
          ctBadge + utBadge +
        '</div>' +
        '<div style="display:flex;gap:24px;flex-wrap:wrap;">' +
          '<div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;">Community</div>' +
            ctActions +
          '</div>' +
          '<div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;">Upload</div>' +
            utActions +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    el.innerHTML = html;
  }

  function timeoutForm(userId, type) {
    var prefix = 'to_' + type + '_' + userId.replace(/-/g, '');
    return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">' +
      '<select id="' + prefix + '_dur" class="wv-input" style="padding:7px 10px;font-size:13px;width:130px;">' +
        '<option value="1">1 hour</option>' +
        '<option value="24">24 hours</option>' +
        '<option value="168">7 days</option>' +
        '<option value="720">30 days</option>' +
        '<option value="">Permanent</option>' +
      '</select>' +
      '<input type="text" id="' + prefix + '_reason" class="wv-input" placeholder="Reason (optional)" style="padding:7px 10px;font-size:13px;width:180px;">' +
      '<button class="btn btn-danger btn-sm" onclick="applyTimeout(\'' + userId + '\',\'' + type + '\',\'' + prefix + '\')">Timeout</button>' +
    '</div>';
  }

  async function applyTimeout(userId, type, prefix) {
    var durEl = document.getElementById(prefix + '_dur');
    var reasonEl = document.getElementById(prefix + '_reason');
    var durVal = durEl ? durEl.value : '';
    var reason = reasonEl ? reasonEl.value.trim() : '';
    var duration_hours = durVal !== '' ? parseInt(durVal, 10) : null;

    try {
      var r = await fetch(API_BASE + '/mod/timeout', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ user_id: userId, type: type, duration_hours: duration_hours, reason: reason || null }),
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed');
      showAlert('Timeout applied.', 'success');
      loadUsers();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  async function removeTimeout(userId, type) {
    try {
      var r = await fetch(API_BASE + '/mod/timeout/' + userId + '/' + type, {
        method: 'DELETE',
        headers: authHeaders(),
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed');
      showAlert('Timeout removed.', 'success');
      loadUsers();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  // ── Uploads ───────────────────────────────────────────────────────────────
  async function loadUploads() {
    var el = document.getElementById('uploads-list');
    if (!el) return;
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var r = await fetch(API_BASE + '/mod/uploads', { headers: authHeaders() });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');
      renderUploads(data);
    } catch (err) {
      if (el) el.innerHTML = '<div style="color:var(--red);">' + escHtml(err.message) + '</div>';
    }
  }

  function renderUploads(items) {
    var el = document.getElementById('uploads-list');
    if (!el) return;
    if (!items || !items.length) {
      el.innerHTML = '<div style="color:var(--text-3);font-size:14px;padding:16px 0;">No recent uploads.</div>';
      return;
    }

    var html = '<div class="wv-comp-grid wv-comp-grid-4">' +
      items.map(function(item) {
        var cover = item.cover_url
          ? '<img src="' + escHtml(item.cover_url) + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px 10px 0 0;" loading="lazy">'
          : '<div style="width:100%;aspect-ratio:1;background:var(--hair);border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:28px;">' + (item._type === 'album' ? '💿' : '🎵') + '</div>';
        var typeBadge = item._type === 'album'
          ? '<span class="wv-pill brand" style="font-size:11px;padding:2px 7px;">Comp</span>'
          : '<span class="wv-pill" style="font-size:11px;padding:2px 7px;">Edit</span>';

        return '<div class="wv-comp-card" id="upload-card-' + item._type + '-' + item.id + '" style="border-radius:12px;overflow:hidden;">' +
          cover +
          '<div style="padding:10px 12px 12px;">' +
            '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px;">' +
              '<span style="font-size:13px;font-weight:600;line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(item.title) + '</span>' +
              typeBadge +
            '</div>' +
            '<div style="font-size:12px;color:var(--text-2);margin-bottom:10px;">' + escHtml(item.artist_name || '') + '</div>' +
            '<button class="btn btn-danger btn-sm" style="width:100%;" onclick="takeDown(\'' + item._type + '\',\'' + item.id + '\')">Take down</button>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';

    el.innerHTML = html;
  }

  async function takeDown(type, id) {
    if (!confirm('Take down this ' + type + '? This cannot be undone.')) return;
    try {
      var endpoint = type === 'album' ? '/mod/albums/' + id : '/mod/tracks/' + id;
      var r = await fetch(API_BASE + endpoint, { method: 'DELETE', headers: authHeaders() });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed');
      var card = document.getElementById('upload-card-' + type + '-' + id);
      if (card) card.remove();
      showAlert('Removed.', 'success');
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  // ── Replace Audio ─────────────────────────────────────────────────────────
  var _raSelectedId = null;
  var _raSearchTimer = null;

  function raSearchDebounce() {
    clearTimeout(_raSearchTimer);
    _raSearchTimer = setTimeout(raRunSearch, 300);
  }

  async function raRunSearch() {
    var q = (document.getElementById('ra-search') || {}).value || '';
    var resultsEl = document.getElementById('ra-results');
    if (!resultsEl) return;
    if (q.trim().length < 2) { resultsEl.innerHTML = ''; return; }
    resultsEl.innerHTML = '<div style="color:var(--text-3);font-size:13px;">Searching…</div>';
    try {
      var r = await fetch(API_BASE + '/mod/tracks/search?q=' + encodeURIComponent(q.trim()), { headers: authHeaders() });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Search failed');
      if (!data.length) { resultsEl.innerHTML = '<div style="color:var(--text-3);font-size:13px;">No tracks found.</div>'; return; }
      resultsEl.innerHTML = data.map(function(t) {
        var meta = [t.artist_name, t.album_title ? 'from "' + escHtml(t.album_title) + '"' : null].filter(Boolean).join(' · ');
        return '<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="raSelectTrack(\'' + t.id + '\',\'' + escHtml(t.title).replace(/'/g, '\\\'') + '\',\'' + escHtml(meta).replace(/'/g, '\\\'') + '\')">' +
          (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" style="width:36px;height:36px;border-radius:5px;object-fit:cover;flex-shrink:0;">' : '<div style="width:36px;height:36px;border-radius:5px;background:var(--hair);flex-shrink:0;"></div>') +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(t.title) + '</div>' +
            '<div style="font-size:12px;color:var(--text-2);">' + escHtml(meta) + '</div>' +
          '</div>' +
          '<button class="wv-pill" style="font-size:12px;flex-shrink:0;">Select</button>' +
        '</div>';
      }).join('');
    } catch (err) {
      resultsEl.innerHTML = '<div style="color:var(--red);font-size:13px;">' + escHtml(err.message) + '</div>';
    }
  }

  function raSelectTrack(id, title, meta) {
    _raSelectedId = id;
    var selEl = document.getElementById('ra-selected');
    if (selEl) selEl.style.display = '';
    var titleEl = document.getElementById('ra-selected-title');
    if (titleEl) titleEl.textContent = title;
    var metaEl = document.getElementById('ra-selected-meta');
    if (metaEl) metaEl.textContent = meta;
    var resultsEl = document.getElementById('ra-results');
    if (resultsEl) resultsEl.innerHTML = '';
    var searchEl = document.getElementById('ra-search');
    if (searchEl) searchEl.value = '';
    raUpdateSubmit();
  }

  function raUpdateSubmit() {
    var btn = document.getElementById('ra-submit');
    var fileEl = document.getElementById('ra-file');
    var ready = _raSelectedId && fileEl && fileEl.files && fileEl.files.length > 0;
    if (btn) {
      btn.disabled = !ready;
      btn.style.opacity = ready ? '1' : '.5';
      btn.style.cursor = ready ? 'pointer' : 'not-allowed';
    }
  }

  // Wire file input change to enable/disable submit
  document.addEventListener('change', function(e) {
    if (e.target && e.target.id === 'ra-file') raUpdateSubmit();
  });

  async function submitReplaceAudio() {
    if (!_raSelectedId) return;
    var fileEl = document.getElementById('ra-file');
    if (!fileEl || !fileEl.files || !fileEl.files.length) return;
    var statusEl = document.getElementById('ra-status');
    var btn = document.getElementById('ra-submit');

    if (btn) { btn.disabled = true; btn.textContent = 'Uploading…'; btn.style.opacity = '.6'; }
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-2);">Uploading to Internet Archive — this may take a minute…</span>';

    var fd = new FormData();
    fd.append('audio', fileEl.files[0]);

    try {
      var r = await fetch(API_BASE + '/mod/tracks/' + _raSelectedId + '/replace-audio', {
        method: 'POST',
        headers: authHeaders(),
        body: fd,
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Upload failed');
      if (statusEl) statusEl.innerHTML = '<span style="color:#4ade80;">✓ Audio replaced successfully. The player will use the new file immediately.</span>';
      // Reset form
      _raSelectedId = null;
      var selEl = document.getElementById('ra-selected');
      if (selEl) selEl.style.display = 'none';
      if (fileEl) fileEl.value = '';
    } catch (err) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--red);">' + escHtml(err.message) + '</span>';
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Upload Replacement'; btn.style.opacity = '1'; }
      raUpdateSubmit();
    }
  }
</script>
</body>
</html>
