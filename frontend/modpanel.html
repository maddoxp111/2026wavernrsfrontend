<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — mod panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  var _allUsers = [];

  // ── Auth + mod check ──────────────────────────────────────────────────────
  (function init() {
    var token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login.html'; return; }

    fetch(API_BASE + '/mod/check', {
      headers: { 'Authorization': 'Bearer ' + token },
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || !d.is_mod) {
          document.getElementById('view').innerHTML =
            '<div style="padding:48px 24px;text-align:center;">' +
            '<div style="font-size:18px;font-weight:700;color:var(--red);margin-bottom:8px;">Access denied</div>' +
            '<div style="font-size:14px;color:var(--text-2);">You do not have moderator permissions.</div>' +
            '</div>';
          setTimeout(function() { window.location.href = '/index.html'; }, 2500);
          return;
        }
        // Mod confirmed. Require a password re-auth before opening the panel
        // (verified once per browser session).
        if (sessionStorage.getItem('mod_reauth_ok') === '1') {
          renderShell();
          loadUsers();
        } else {
          showModPasswordGate();
        }
      })
      .catch(function() {
        document.getElementById('view').innerHTML =
          '<div style="padding:48px 24px;text-align:center;color:var(--red);">Failed to verify moderator status.</div>';
      });
  })();

  // ── Password gate ───────────────────────────────────────────────────────────
  function showModPasswordGate(errMsg) {
    document.getElementById('view').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;min-height:70vh;padding:24px;">' +
        '<div style="background:var(--glass-large-bg);backdrop-filter:blur(var(--lg-frost-large));-webkit-backdrop-filter:blur(var(--lg-frost-large));border:1px solid var(--glass-large-border);border-radius:24px;padding:36px 32px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.18);">' +
          '<div style="font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;">wavernrs</div>' +
          '<h1 style="font-size:24px;font-weight:800;margin:0 0 6px;">Mod Panel</h1>' +
          '<p style="font-size:14px;color:var(--text-2);margin:0 0 24px;">Enter your account password to continue</p>' +
          '<div id="mod-gate-alert" style="margin-bottom:12px;">' +
            (errMsg ? '<div style="color:var(--red);font-size:13px;">' + escHtml(errMsg) + '</div>' : '') +
          '</div>' +
          '<div class="form-group" style="margin-bottom:16px;">' +
            '<input type="password" id="mod-gate-pw" placeholder="Your password" class="wv-input" ' +
              'style="width:100%;padding:11px 14px;font-size:14px;" onkeydown="if(event.key===\'Enter\') verifyModPassword()">' +
          '</div>' +
          '<button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="verifyModPassword()">Enter</button>' +
        '</div>' +
      '</div>';
    setTimeout(function() { var f = document.getElementById('mod-gate-pw'); if (f) f.focus(); }, 50);
  }

  window.verifyModPassword = function() {
    var pwEl = document.getElementById('mod-gate-pw');
    var pw = pwEl ? pwEl.value : '';
    if (!pw) { showModPasswordGate('Enter your password'); return; }
    var token = localStorage.getItem('token');
    fetch(API_BASE + '/mod/reauth', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    })
      .then(function(r) { return r.json().then(function(d) { return { status: r.status, d: d }; }); })
      .then(function(res) {
        if (res.d && res.d.ok) {
          sessionStorage.setItem('mod_reauth_ok', '1');
          renderShell();
          loadUsers();
        } else if (res.status === 429) {
          showModPasswordGate('Too many attempts. Try again later.');
        } else {
          showModPasswordGate((res.d && res.d.error) || 'Incorrect password');
        }
      })
      .catch(function() { showModPasswordGate('Connection error. Try again.'); });
  };

  // ── Shell ─────────────────────────────────────────────────────────────────
  function renderShell() {
    document.getElementById('view').innerHTML =
      '<div style="padding:28px 0 80px;max-width:1040px;">' +
        '<h1 style="font-size:26px;font-weight:800;margin:0 0 24px;">Mod Panel</h1>' +

        // Tab bar
        '<div style="display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--hair-strong);">' +
          '<button class="wv-admin-tab active" id="mtab-users"         onclick="showModTab(\'users\')">Users</button>' +
          '<button class="wv-admin-tab"        id="mtab-uploads"       onclick="showModTab(\'uploads\')">Recent Uploads</button>' +
          '<button class="wv-admin-tab"        id="mtab-replace-audio" onclick="showModTab(\'replace-audio\')">Replace Audio</button>' +
          '<button class="wv-admin-tab"        id="mtab-arc"           onclick="showModTab(\'arc\')">Archive</button>' +
          '<button class="wv-admin-tab"        id="mtab-discord"       onclick="showModTab(\'discord\')">Discord Uploads</button>' +
        '</div>' +

        '<div id="mod-alert" style="margin-bottom:12px;"></div>' +

        // Users tab
        '<div id="mod-tab-users">' +
          '<div style="margin-bottom:16px;">' +
            '<input type="text" id="user-search" class="wv-input" placeholder="Search by username..." ' +
              'style="max-width:320px;padding:9px 14px;" oninput="filterUsers()">' +
          '</div>' +
          '<div id="users-list"><div class="loading"><div class="spinner"></div></div></div>' +
        '</div>' +

        // Uploads tab
        '<div id="mod-tab-uploads" style="display:none;">' +
          '<div id="uploads-list"><div class="loading"><div class="spinner"></div></div></div>' +
        '</div>' +

        // Replace Audio tab
        '<div id="mod-tab-replace-audio" style="display:none;">' +
          '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--purple);">' +
            '<div style="font-size:13px;font-weight:700;color:var(--purple-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">What this tool does</div>' +
            '<p style="margin:0;font-size:14px;color:var(--text-2);line-height:1.6;">' +
              'Use this to fix a track whose audio is wrong — for example, when two tracks in the same comp shared an identical filename on Internet Archive and one overwrote the other. ' +
              'Uploading a replacement file here pushes the correct audio to IA and updates the track in the database <strong style="color:var(--text-1);">without touching plays, likes, or comments</strong>. ' +
              'The old IA file is left in place (IA does not support deletion); only the database URL is updated so the player immediately uses the new file.' +
            '</p>' +
          '</div>' +

          '<div style="margin-bottom:14px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Search track by title</label>' +
            '<div style="display:flex;gap:8px;">' +
              '<input type="text" id="ra-search" class="wv-input" placeholder="e.g. Hurricane V34" style="flex:1;max-width:400px;" oninput="raSearchDebounce()">' +
            '</div>' +
            '<div id="ra-results" style="margin-top:10px;"></div>' +
          '</div>' +

          '<div id="ra-selected" style="display:none;margin-bottom:18px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;">' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:4px;">Selected track</div>' +
            '<div id="ra-selected-title" style="font-size:15px;font-weight:700;"></div>' +
            '<div id="ra-selected-meta"  style="font-size:12px;color:var(--text-2);margin-top:2px;"></div>' +
          '</div>' +

          '<div style="margin-bottom:14px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Replacement audio file</label>' +
            '<input type="file" id="ra-file" accept="audio/*" class="wv-input" style="padding:8px 12px;">' +
          '</div>' +

          '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px;">Accepted: MP3, WAV, FLAC, AAC, OGG — max 200 MB</div>' +

          '<button class="wv-pill brand" id="ra-submit" onclick="submitReplaceAudio()" disabled style="opacity:.5;cursor:not-allowed;">Upload Replacement</button>' +
          '<div id="ra-status" style="margin-top:12px;font-size:13px;"></div>' +
        '</div>' +

        // Archive tab
        '<div id="mod-tab-arc" style="display:none;">' +
          '<div class="wv-card" style="padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--purple);">' +
            '<div style="font-size:13px;font-weight:700;color:var(--purple-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Archive uploads</div>' +
            '<p style="margin:0;font-size:14px;color:var(--text-2);line-height:1.6;">' +
              'Archive comps are comps by artists who are <strong style="color:var(--text-1);">not on the site</strong> but are too good to be lost. ' +
              'They do not create an artist account — the name you enter is display-only. ' +
              'Archive comps appear ONLY on the Archive page and in the Archived section of search. They never show in discover, charts, feeds, or on any artist profile.' +
            '</p>' +
          '</div>' +

          '<div style="margin-bottom:14px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Artist name (display only) *</label>' +
            '<input type="text" id="arc-artist" class="wv-input" placeholder="e.g. Lil Uzi Vert" style="max-width:400px;">' +
          '</div>' +
          '<div style="margin-bottom:18px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Era tag *</label>' +
            '<select id="arc-era" class="wv-input" style="max-width:400px;"><option value="">Loading…</option></select>' +
          '</div>' +

          // Era tag keywords
          '<div class="wv-card" style="padding:18px 20px;margin-bottom:18px;">' +
            '<div style="font-weight:700;margin-bottom:4px;">Era Tag Keywords</div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">Comma-separated keywords per era tag. When the Discord bot imports a comp, it matches the title against these keywords and assigns the matching tag. If nothing matches, it falls back to <b>Other</b>.</div>' +
            '<div id="era-keywords-list" style="display:flex;flex-direction:column;gap:8px;"></div>' +
          '</div>' +

          // Import from link
          '<div class="wv-card" style="padding:18px 20px;margin-bottom:18px;">' +
            '<div style="font-weight:700;margin-bottom:6px;">Import from a link</div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">Paste a public <b>untitled.stream</b>, <b>Samply</b>, or <b>mega.nz folder</b> link — pulls every track and the cover art. Mega folders: each audio file becomes a track (sorted by filename), and an image in the folder becomes the cover. Mega downloads route through Tor (rotating IP every 2 comps) so they\'re slower and an occasional track may fail — just re-import to pick up any that didn\'t.</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
              '<input id="arc-import-url" class="wv-input" placeholder="untitled.stream/library/project/…, samply.app/p/…, or mega.nz/folder/…" style="flex:1;min-width:220px;">' +
              '<button class="wv-pill brand" id="arc-import-btn" onclick="startArchiveImport()">Import</button>' +
            '</div>' +
            '<div id="arc-import-status" style="margin-top:10px;font-size:13px;display:none;"></div>' +
          '</div>' +

          // Manual upload
          '<div class="wv-card" style="padding:18px 20px;">' +
            '<div style="font-weight:700;margin-bottom:10px;">Upload files</div>' +
            '<div class="wv-form-field" style="margin-bottom:10px;">' +
              '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Comp title *</label>' +
              '<input type="text" id="arc-title" class="wv-input" placeholder="Comp name" style="max-width:400px;">' +
            '</div>' +
            '<div class="wv-form-field" style="margin-bottom:10px;">' +
              '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Description</label>' +
              '<textarea id="arc-desc" class="wv-input" rows="2" placeholder="Optional…" style="resize:vertical;max-width:400px;"></textarea>' +
            '</div>' +
            '<div class="wv-form-field" style="margin-bottom:12px;">' +
              '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Cover image</label>' +
              '<input type="file" id="arc-cover" accept="image/*" class="wv-input" style="padding:8px 12px;max-width:400px;">' +
            '</div>' +
            '<div class="wv-form-field" style="margin-bottom:12px;">' +
              '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Audio files *</label>' +
              '<input type="file" id="arc-files" accept="audio/*" multiple class="wv-input" style="padding:8px 12px;max-width:400px;" onchange="arcRenderQueue()">' +
            '</div>' +
            '<div id="arc-queue" style="margin-bottom:14px;"></div>' +
            '<button class="wv-pill brand" id="arc-upload-btn" onclick="startArchiveUpload()">Upload Archive Comp</button>' +
            '<div id="arc-upload-status" style="margin-top:12px;font-size:13px;"></div>' +
          '</div>' +
        '</div>' +

        // Discord Uploads tab
        '<div id="mod-tab-discord" style="display:none;">' +
          '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">' +
            '<div style="font-size:13px;font-weight:600;color:var(--text-2);">Bot-triggered imports — auto-refreshes every 10 s</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;" id="discord-status-filter">' +
              '<button class="wv-pill" id="dsf-all"    onclick="setDiscordFilter(\'\')"       style="font-size:11px;padding:3px 10px;background:var(--purple);color:#fff;">All</button>' +
              '<button class="wv-pill" id="dsf-queued" onclick="setDiscordFilter(\'queued\')"  style="font-size:11px;padding:3px 10px;">Queued</button>' +
              '<button class="wv-pill" id="dsf-running" onclick="setDiscordFilter(\'running\')" style="font-size:11px;padding:3px 10px;">Running</button>' +
              '<button class="wv-pill" id="dsf-done"   onclick="setDiscordFilter(\'done\')"   style="font-size:11px;padding:3px 10px;">Done</button>' +
              '<button class="wv-pill" id="dsf-failed" onclick="setDiscordFilter(\'failed\')" style="font-size:11px;padding:3px 10px;">Failed</button>' +
            '</div>' +
          '</div>' +
          '<div id="discord-upload-list" style="display:flex;flex-direction:column;gap:8px;"></div>' +
        '</div>' +

      '</div>';
  }

  var _discordPollInterval = null;

  function showModTab(tab) {
    ['users', 'uploads', 'replace-audio', 'arc', 'discord'].forEach(function(t) {
      var panel = document.getElementById('mod-tab-' + t);
      var btn   = document.getElementById('mtab-' + t);
      if (panel) panel.style.display = t === tab ? '' : 'none';
      if (btn)   btn.classList.toggle('active', t === tab);
    });
    if (tab === 'uploads') loadUploads();
    if (tab === 'arc') arcLoadEraTags();
    if (tab === 'discord') {
      _discordStatusFilter = '';
      loadDiscordUploads();
      if (!_discordPollInterval) {
        _discordPollInterval = setInterval(function() {
          var panel = document.getElementById('mod-tab-discord');
          if (panel && panel.style.display !== 'none') loadDiscordUploads();
        }, 10000);
      }
    }
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showAlert(msg, type) {
    var el = document.getElementById('mod-alert');
    if (!el) return;
    el.innerHTML = '<div style="padding:10px 14px;border-radius:10px;font-size:13px;background:var(--glass-small-bg);border:1px solid var(--hair);color:' + (type === 'error' ? 'var(--red)' : '#4ade80') + ';">' + escHtml(msg) + '</div>';
    setTimeout(function() { if (el) el.innerHTML = ''; }, 4000);
  }

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + localStorage.getItem('token'), 'Content-Type': 'application/json' };
  }

  // ── Users ─────────────────────────────────────────────────────────────────
  async function loadUsers() {
    var el = document.getElementById('users-list');
    if (!el) return;
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var r = await fetch(API_BASE + '/mod/users', { headers: authHeaders() });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');
      _allUsers = data;
      renderUsers(data);
    } catch (err) {
      if (el) el.innerHTML = '<div style="color:var(--red);">' + escHtml(err.message) + '</div>';
    }
  }

  function filterUsers() {
    var q = (document.getElementById('user-search') || {}).value || '';
    q = q.toLowerCase().trim();
    var filtered = q ? _allUsers.filter(function(u) { return u.username.toLowerCase().includes(q); }) : _allUsers;
    renderUsers(filtered);
  }

  function renderUsers(users) {
    var el = document.getElementById('users-list');
    if (!el) return;
    if (!users || !users.length) {
      el.innerHTML = '<div style="color:var(--text-3);font-size:14px;padding:16px 0;">No users found.</div>';
      return;
    }

    var html = users.map(function(u) {
      var ctBadge = u.community_timeout
        ? '<span class="wv-pill" style="background:var(--red);color:#fff;font-size:11px;padding:2px 8px;">Community TO</span>'
        : '<span class="wv-pill" style="font-size:11px;padding:2px 8px;">No community TO</span>';
      var utBadge = u.upload_timeout
        ? '<span class="wv-pill" style="background:var(--red);color:#fff;font-size:11px;padding:2px 8px;">Upload TO</span>'
        : '<span class="wv-pill" style="font-size:11px;padding:2px 8px;">No upload TO</span>';

      var ctActions = u.community_timeout
        ? '<button class="btn btn-secondary btn-sm" onclick="removeTimeout(\'' + u.id + '\',\'community\')">Remove community timeout</button>'
        : timeoutForm(u.id, 'community');
      var utActions = u.upload_timeout
        ? '<button class="btn btn-secondary btn-sm" onclick="removeTimeout(\'' + u.id + '\',\'upload\')">Remove upload timeout</button>'
        : timeoutForm(u.id, 'upload');

      return '<div class="wv-card" style="margin-bottom:12px;padding:16px 18px;" id="user-row-' + u.id + '">' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">' +
          '<span style="font-size:15px;font-weight:700;">' + escHtml(u.username) + '</span>' +
          ctBadge + utBadge +
        '</div>' +
        '<div style="display:flex;gap:24px;flex-wrap:wrap;">' +
          '<div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;">Community</div>' +
            ctActions +
          '</div>' +
          '<div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;">Upload</div>' +
            utActions +
          '</div>' +
          '<div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;">Password</div>' +
            '<button class="btn btn-secondary btn-sm" onclick="resetUserPassword(\'' + u.id + '\',\'' + escHtml(u.username) + '\')">Reset to Password1</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    el.innerHTML = html;
  }

  function timeoutForm(userId, type) {
    var prefix = 'to_' + type + '_' + userId.replace(/-/g, '');
    return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">' +
      '<select id="' + prefix + '_dur" class="wv-input" style="padding:7px 10px;font-size:13px;width:130px;">' +
        '<option value="1">1 hour</option>' +
        '<option value="24">24 hours</option>' +
        '<option value="168">7 days</option>' +
        '<option value="720">30 days</option>' +
        '<option value="">Permanent</option>' +
      '</select>' +
      '<input type="text" id="' + prefix + '_reason" class="wv-input" placeholder="Reason (optional)" style="padding:7px 10px;font-size:13px;width:180px;">' +
      '<button class="btn btn-danger btn-sm" onclick="applyTimeout(\'' + userId + '\',\'' + type + '\',\'' + prefix + '\')">Timeout</button>' +
    '</div>';
  }

  async function applyTimeout(userId, type, prefix) {
    var durEl = document.getElementById(prefix + '_dur');
    var reasonEl = document.getElementById(prefix + '_reason');
    var durVal = durEl ? durEl.value : '';
    var reason = reasonEl ? reasonEl.value.trim() : '';
    var duration_hours = durVal !== '' ? parseInt(durVal, 10) : null;

    try {
      var r = await fetch(API_BASE + '/mod/timeout', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ user_id: userId, type: type, duration_hours: duration_hours, reason: reason || null }),
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed');
      showAlert('Timeout applied.', 'success');
      loadUsers();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  async function removeTimeout(userId, type) {
    try {
      var r = await fetch(API_BASE + '/mod/timeout/' + userId + '/' + type, {
        method: 'DELETE',
        headers: authHeaders(),
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed');
      showAlert('Timeout removed.', 'success');
      loadUsers();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  // ── Uploads ───────────────────────────────────────────────────────────────
  async function loadUploads() {
    var el = document.getElementById('uploads-list');
    if (!el) return;
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var r = await fetch(API_BASE + '/mod/uploads', { headers: authHeaders() });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');
      renderUploads(data);
    } catch (err) {
      if (el) el.innerHTML = '<div style="color:var(--red);">' + escHtml(err.message) + '</div>';
    }
  }

  function renderUploads(items) {
    var el = document.getElementById('uploads-list');
    if (!el) return;
    if (!items || !items.length) {
      el.innerHTML = '<div style="color:var(--text-3);font-size:14px;padding:16px 0;">No recent uploads.</div>';
      return;
    }

    var html = '<div class="wv-comp-grid wv-comp-grid-4">' +
      items.map(function(item) {

  async function takeDown(type, id) {
    if (!confirm('Take down this ' + type + '? This cannot be undone.')) return;
    try {
      var endpoint = type === 'album' ? '/mod/albums/' + id : '/mod/tracks/' + id;
      var r = await fetch(API_BASE + endpoint, { method: 'DELETE', headers: authHeaders() });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed');
      var card = document.getElementById('upload-card-' + type + '-' + id);
      if (card) card.remove();
      showAlert('Removed.', 'success');
    } catch (err) {
      showAlert(err.message, 'error');
    }

  function raUpdateSubmit() {

    var fileEl = document.getElementById('ra-file');
    var ready = _raSelectedId && fileEl && fileEl.files && fileEl.files.length > 0;
    if (btn) {
      btn.disabled = !ready;
      btn.style.opacity = ready ? '1' : '.5';
      btn.style.cursor = ready ? 'pointer' : 'not-allowed';

  document.addEventListener('change', function(e) {

  async function submitReplaceAudio() {
    if (!_raSelectedId) return;
    var fileEl = document.getElementById('ra-file');
    if (!fileEl || !fileEl.files || !fileEl.files.length) return;
    var statusEl = document.getElementById('ra-status');
    var btn = document.getElementById('ra-submit');

    if (btn) { btn.disabled = true; btn.textContent = 'Uploading…'; btn.style.opacity = '.6'; }
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-2);">Uploading to Internet Archive — this may take a minute…</span>';

    var fd = new FormData();
    fd.append('audio', fileEl.files[0]);

    try {
      var r = await fetch(API_BASE + '/mod/tracks/' + _raSelectedId + '/replace-audio', {
        method: 'POST',
        headers: authHeaders(),
        body: fd,
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Upload failed');
      if (statusEl) statusEl.innerHTML = '<span style="color:#4ade80;">✓ Audio replaced successfully. The player will use the new file immediately.</span>';
      // Reset form
      _raSelectedId = null;
      var selEl = document.getElementById('ra-selected');
      if (selEl) selEl.style.display = 'none';
      if (fileEl) fileEl.value = '';
    } catch (err) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--red);">' + escHtml(err.message) + '</span>';
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Upload Replacement'; btn.style.opacity = '1'; }
      raUpdateSubmit();
    }
  }

  // Import from untitled.stream / Samply / mega.nz as an archive comp
  async function startArchiveImport() {
    var common = _arcValidateCommon();
    if (common.error) { _arcStatus('arc-import-status', common.error, '#f87171'); return; }
    var url = ((document.getElementById('arc-import-url') || {}).value || '').trim();
    var endpoint = null;
    if (/^https?:\/\/untitled\.stream\/library\/project\/[A-Za-z0-9_-]+\/?$/.test(url)) endpoint = '/import/untitled';
    else if (/^https?:\/\/(www\.)?samply\.app\/p\/[A-Za-z0-9_-]+(\?.*)?$/.test(url)) endpoint = '/import/samply';
    else if (/^https?:\/\/mega(\.co)?\.nz\/(folder\/[\w-]+#[\w-]+|#F![\w-]+![\w-]+)\/?$/.test(url)) endpoint = '/import/mega';
    if (!endpoint) {
      var badMsg = 'That doesn\'t look like an untitled.stream, Samply, or mega.nz folder link.';
      if (/mega(\.co)?\.nz\/(file\/|#!)/.test(url)) badMsg = 'Mega single-file links aren\'t supported — paste a folder link (the whole folder becomes one comp).';
      else if (/mega(\.co)?\.nz\/folder\/[\w-]+$/.test(url)) badMsg = 'That mega folder link is missing its key — copy the full link including the part after #.';
      _arcStatus('arc-import-status', badMsg, '#f87171');
      return;
    }

    var btn = document.getElementById('arc-import-btn');
    btn.disabled = true;
    _arcStatus('arc-import-status', 'Starting archive import…');
    var jobId;
    try {
      var resp = await api(endpoint, { method: 'POST', body: JSON.stringify({
        url: url, era_tag_id: common.era, archive_artist_name: common.artist,
      }) });
      jobId = resp.jobId;
    } catch (err) {
      _arcStatus('arc-import-status', 'Could not start import: ' + err.message, '#f87171');
      btn.disabled = false;
      return;
    }

    // SSE via fetch stream (EventSource can't send auth headers)
    try {
      var token = localStorage.getItem('token');
      var siteAccess = localStorage.getItem('wv_site_access');
      var streamHeaders = { 'Authorization': 'Bearer ' + token };
      if (siteAccess) streamHeaders['X-Site-Access'] = siteAccess;
      var resp2 = await fetch(API_BASE + '/import/jobs/' + jobId + '/events', { headers: streamHeaders });
      if (!resp2.ok || !resp2.body) throw new Error('stream failed');
      var reader = resp2.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var parts = buf.split('\n\n');
        buf = parts.pop();
        for (var i = 0; i < parts.length; i++) {
          var line = parts[i].trim();
          if (!line.startsWith('data:')) continue;
          var evt;
          try { evt = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
          if (evt.type === 'status') _arcStatus('arc-import-status', evt.message);
          else if (evt.type === 'track') _arcStatus('arc-import-status', 'Importing track ' + evt.i + ' of ' + evt.n + ': ' + evt.title);
          else if (evt.type === 'done') {
            var msg = 'Archived ' + evt.imported + ' track' + (evt.imported === 1 ? '' : 's') + '.';
            if (evt.failed && evt.failed.length) msg += ' ' + evt.failed.length + ' failed.';
            _arcStatus('arc-import-status', msg + ' Opening…', '#4ade80');
            setTimeout(function() { navigate('/album.html?id=' + evt.albumId); }, 900);
            return;
          } else if (evt.type === 'error') {
            _arcStatus('arc-import-status', 'Error: ' + evt.message, '#f87171');
            btn.disabled = false;
            return;
          }
        }
      }
      _arcStatus('arc-import-status', 'Connection closed.', '#f87171');
      btn.disabled = false;
    } catch (err) {
      _arcStatus('arc-import-status', 'Lost connection to import: ' + err.message, '#f87171');
      btn.disabled = false;
    }
  }

  // Manual file upload as an archive comp: create the album shell with the
  // archive flags, then upload each track into it (tracks inherit is_archive
  // from the album server-side).
  async function startArchiveUpload() {
    var common = _arcValidateCommon();
    if (common.error) { _arcStatus('arc-upload-status', common.error, '#f87171'); return; }
    var title = ((document.getElementById('arc-title') || {}).value || '').trim();
    if (!title) { _arcStatus('arc-upload-status', 'Comp title is required.', '#f87171'); return; }
    var filesInput = document.getElementById('arc-files');
    var files = Array.from((filesInput && filesInput.files) || []);
    if (!files.length) { _arcStatus('arc-upload-status', 'Add at least one audio file.', '#f87171'); return; }

    var btn = document.getElementById('arc-upload-btn');
    btn.disabled = true;
    try {
      _arcStatus('arc-upload-status', 'Creating archive comp…');
      var albumForm = new FormData();
      albumForm.append('title', title);
      albumForm.append('era_tag_id', common.era);
      albumForm.append('is_archive', '1');
      albumForm.append('archive_artist_name', common.artist);
      var desc = ((document.getElementById('arc-desc') || {}).value || '').trim();
      if (desc) albumForm.append('description', desc);
      var coverInput = document.getElementById('arc-cover');
      if (coverInput && coverInput.files && coverInput.files[0]) albumForm.append('cover_file', coverInput.files[0]);
      var album = await apiUpload('/albums', albumForm);

      for (var i = 0; i < files.length; i++) {
        _arcStatus('arc-upload-status', 'Uploading ' + (i + 1) + '/' + files.length + ': ' + files[i].name + '…');
        var form = new FormData();
        form.append('file', files[i]);
        form.append('title', _arcCleanTitle(files[i].name));
        form.append('album_id', album.id);
        form.append('track_position', String(i));
        form.append('era_tag_id', common.era);
        await apiUpload('/tracks', form);
      }

      _arcStatus('arc-upload-status', '✓ Archive comp uploaded. Opening…', '#4ade80');
      setTimeout(function() { navigate('/album.html?id=' + album.id); }, 900);
    } catch (err) {
      _arcStatus('arc-upload-status', 'Failed: ' + (err.message || 'Upload error'), '#f87171');
      btn.disabled = false;
    }
  }

  // ── Discord Uploads tab ───────────────────────────────────────────────────
  var _discordStatusFilter = '';

  function setDiscordFilter(status) {
    _discordStatusFilter = status;
    ['all', 'queued', 'running', 'done', 'failed'].forEach(function(s) {
      var btn = document.getElementById('dsf-' + (s === '' ? 'all' : s));
      if (!btn) return;
      var active = (status === '' && s === 'all') || status === s;
      btn.style.background = active ? 'var(--purple)' : '';
      btn.style.color = active ? '#fff' : '';
    });
    loadDiscordUploads();
  }

  function _discordRelTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var diff = Date.now() - d.getTime();
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return Math.floor(diff / 86400000) + 'd ago';
  }

  async function loadDiscordUploads() {
    var el = document.getElementById('discord-upload-list');
    if (!el) return;
    var token = localStorage.getItem('token');
    var r, data;
    var qs = _discordStatusFilter ? '?status=' + encodeURIComponent(_discordStatusFilter) : '';
    try {
      r = await fetch(API_BASE + '/discord/active-jobs' + qs, { headers: { 'Authorization': 'Bearer ' + token } });
      data = await r.json();
    } catch (err) {
      el.innerHTML = '<div style="color:var(--red);font-size:13px;">' + escHtml(err.message) + '</div>';
      return;
    }
    if (!r.ok) {
      el.innerHTML = '<div style="color:var(--red);font-size:13px;">' + escHtml((data && data.error) || 'Failed to load') + '</div>';
      return;
    }

    var log = data.log || [];
    var statusColor = { queued: 'var(--text-3)', running: '#facc15', done: '#4ade80', failed: '#f87171' };
    var providerLabel = { untitled: 'Untitled.stream', samply: 'Samply', mega: 'MEGA', unknown: '?' };
    var providerColor = { untitled: '#a78bfa', samply: '#60a5fa', mega: '#fb923c', unknown: 'var(--text-3)' };

    var header = '<div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">' +
      'Queue: ' + (data.queue_length || 0) + ' pending' +
      (data.active_job_id ? ' · <span style="color:#facc15;">1 running</span>' : '') +
      ' · ' + log.length + ' shown' +
      '</div>';

    if (!log.length) {
      el.innerHTML = header + '<div style="color:var(--text-3);font-size:14px;padding:8px 0;">No imports match this filter.</div>';
      return;
    }

    el.innerHTML = header + log.map(function(row) {
      var statusCol = statusColor[row.status] || 'var(--text-2)';
      var statusLabel = (row.status || '').charAt(0).toUpperCase() + (row.status || '').slice(1);
      var isRunning = row.status === 'running' && row.job_id === data.active_job_id;
      if (isRunning) statusLabel = '⚡ Running';

      var provider = row.provider || 'unknown';
      var pLabel = providerLabel[provider] || provider;
      var pColor = providerColor[provider] || 'var(--text-3)';

      var name = escHtml(row.discord_username || '(unknown)');
      var url = row.source_url || '';
      var shortUrl = url.length > 72 ? url.slice(0, 69) + '…' : url;

      var attempts = row.attempts || 0;
      var attemptsHtml = attempts > 0
        ? '<span style="font-size:11px;color:' + (attempts >= 4 ? '#f87171' : 'var(--text-3)') + ';">' + attempts + ' attempt' + (attempts !== 1 ? 's' : '') + '</span>'
        : '';

      var importedHtml = '';

      var guildHtml = row.guild_id
        ? '<span style="font-size:11px;color:var(--text-3);" title="Guild ID">guild ' + escHtml(row.guild_id) + '</span>'
        : '';
      var channelHtml = row.channel_id
        ? '<span style="font-size:11px;color:var(--text-3);" title="Channel ID">ch ' + escHtml(row.channel_id) + '</span>'
        : '';

      var timeHtml = '<span style="font-size:11px;color:var(--text-3);" title="' + escHtml(row.created_at || '') + '">' + _discordRelTime(row.created_at) + '</span>';

      var claimedHtml = row.claimed
        ? '<span style="font-size:10px;color:#4ade80;font-weight:700;letter-spacing:.04em;">CLAIMED</span>'
        : '';

      return (
        '<div style="padding:12px 14px;background:var(--glass-pill-bg);border:1px solid var(--glass-small-border);border-radius:10px;">' +
          // Top row: username + status + provider
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px;">' +
            '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
              '<span style="font-size:13px;font-weight:700;">@' + name + '</span>' +
              claimedHtml +
              '<span style="font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:' + pColor + '22;color:' + pColor + ';">' + escHtml(pLabel) + '</span>' +
            '</div>' +
            '<span style="font-size:12px;font-weight:700;color:' + statusCol + ';flex-shrink:0;">' + statusLabel + '</span>' +
          '</div>' +
          // URL
          '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px;word-break:break-all;">' +
            '<a href="' + escHtml(url) + '" target="_blank" rel="noopener" style="color:var(--text-3);text-decoration:underline;">' + escHtml(shortUrl) + '</a>' +
          '</div>' +
          // Meta row: attempts, tracks, guild, channel, time
          '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:' + (row.error_message || row.album_id ? '6' : '0') + 'px;">' +
            attemptsHtml + importedHtml + guildHtml + channelHtml + timeHtml +
          '</div>' +
          // Album link
          (row.album_id
            ? '<div style="font-size:12px;margin-bottom:4px;"><a href="/album.html?id=' + escHtml(row.album_id) + '" style="color:var(--purple-light);">→ View comp</a></div>'
            : '') +
          // Error
          (row.error_message
            ? '<div style="font-size:12px;color:#f87171;padding:5px 8px;background:#f871711a;border-radius:5px;margin-top:2px;word-break:break-word;">' + escHtml(String(row.error_message).slice(0, 300)) + '</div>'
            : '') +
        '</div>'
      );
    }).join('');
  }
</script>
</body>
</html>
