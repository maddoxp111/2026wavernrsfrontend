<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — listening parties</title>
  <link rel="stylesheet" href="/css/style.css?v=0acb33bbd519">
  <script src="/js/status-card.js?v=0acb33bbd519"></script>
  <script src="/js/down.js?v=0acb33bbd519"></script>
</head>
<body>
<div id="view">
  <style>
    .lp-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:8px 0 22px; }
    .lp-h1 { font-size:clamp(28px,4vw,44px); font-weight:800; letter-spacing:-.03em; margin:0; }
    .lp-sub { color:var(--text-2); font-size:14px; margin-top:6px; max-width:560px; }
    .lp-sec { margin:0 0 28px; }
    .lp-sec h2 { font-size:18px; font-weight:800; letter-spacing:-.02em; margin:0 0 12px; }
    .lp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
    .lp-card { background:var(--surface); border-radius:var(--r-lg,16px); overflow:hidden; cursor:pointer; transition:transform .16s var(--ease); }
    .lp-card:hover { transform:translateY(-2px); }
    .lp-card-art { aspect-ratio:16/10; position:relative; overflow:hidden; }
    .lp-card-art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .lp-badge { position:absolute; top:10px; left:10px; font-size:10px; font-weight:800; letter-spacing:.08em; padding:3px 8px; border-radius:6px; color:#fff; background:#e0245e; display:inline-flex; align-items:center; gap:5px; }
    .lp-badge.soon { background:rgba(0,0,0,.65); }
    .lp-badge.ended { background:rgba(0,0,0,.65); color:#bbb; }
    .lp-badge.paused { background:#b7791f; }
    .lp-dot { width:6px; height:6px; border-radius:50%; background:#fff; animation:lpPulse 1.4s infinite; }
    @keyframes lpPulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
    .lp-count { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
    .lp-card-body { padding:12px 14px 14px; }
    .lp-card-name { font-weight:800; font-size:16px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lp-card-sub { font-size:12.5px; color:var(--text-2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lp-empty { color:var(--text-3); font-size:14px; padding:18px; border:1px dashed var(--hair-strong); border-radius:14px; text-align:center; }

    .lp-room { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:22px; align-items:start; }
    @media (max-width: 980px) { .lp-room { grid-template-columns:minmax(0,1fr); } }
    .lp-hero { display:flex; gap:22px; align-items:flex-end; flex-wrap:wrap; margin:6px 0 18px; }
    .lp-cover { width:200px; height:200px; border-radius:14px; overflow:hidden; position:relative; flex-shrink:0; box-shadow:0 12px 40px rgba(0,0,0,.45); }
    .lp-cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    @media (max-width: 600px) { .lp-hero { gap:14px; } .lp-cover { width:132px; height:132px; } .lp-info { min-width:0; flex-basis:100%; } }
    .lp-info { flex:1; min-width:240px; }
    .lp-status { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:.08em; padding:4px 9px; border-radius:6px; color:#fff; background:#e0245e; }
    .lp-status.soon { background:var(--surface-3); color:var(--text); }
    .lp-status.ended { background:var(--surface-3); color:var(--text-3); }
    .lp-status.paused { background:#b7791f; }
    .lp-title { font-size:clamp(26px,4vw,46px); font-weight:800; letter-spacing:-.035em; line-height:1.05; margin:10px 0 6px; overflow-wrap:anywhere; }
    .lp-host { font-size:14px; color:var(--text-2); display:flex; align-items:center; gap:8px; }
    .lp-host a { color:var(--text); font-weight:700; }
    .lp-av { width:24px; height:24px; border-radius:50%; object-fit:cover; background:var(--surface-3); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--text-2); flex-shrink:0; overflow:hidden; }
    .lp-desc { color:var(--text-2); font-size:14px; margin-top:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .lp-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center; }
    .lp-people { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text-2); }
    .lp-stack { display:flex; }
    .lp-stack .lp-av { border:2px solid var(--bg, #121212); margin-left:-7px; }
    .lp-stack .lp-av:first-child { margin-left:0; }

    .lp-now { background:var(--surface); border-radius:16px; padding:16px; margin-bottom:18px; position:relative; }
    .lp-reacts { display:flex; justify-content:center; gap:6px; margin-top:12px; flex-wrap:wrap; }
    .lp-rb { border:0; background:var(--surface-2); border-radius:99px; width:42px; height:36px; font-size:18px; cursor:pointer; transition:transform .12s var(--ease), background .12s; }
    .lp-rb:hover { background:var(--surface-3); transform:translateY(-2px); }
    .lp-rb:active { transform:scale(.9); }
    .lp-float { position:absolute; left:0; right:0; bottom:40px; height:0; pointer-events:none; overflow:visible; }
    .lp-fl { position:absolute; bottom:0; font-size:26px; animation:lpFloat 2.4s ease-out forwards; will-change:transform, opacity; }
    @keyframes lpFloat { 0% { transform:translate(0,0) scale(.6); opacity:0; } 12% { opacity:1; transform:translate(0,-20px) scale(1.1); } 100% { transform:translate(var(--dx), -190px) scale(.9); opacity:0; } }
    .lp-now-row { display:flex; gap:14px; align-items:center; }
    .lp-now-art { width:64px; height:64px; border-radius:10px; overflow:hidden; position:relative; flex-shrink:0; }
    .lp-now-art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .lp-now-t { font-weight:800; font-size:17px; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lp-now-a { font-size:13px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lp-now-a a { color:inherit; }
    .lp-bar { height:4px; background:var(--surface-3); border-radius:2px; margin-top:14px; overflow:hidden; }
    .lp-bar > div { height:100%; background:var(--brand); width:0; transition:width .5s linear; }
    .lp-times { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-3); margin-top:5px; font-variant-numeric:tabular-nums; }
    .lp-ctrl { display:flex; justify-content:center; gap:10px; margin-top:10px; }
    .lp-cbtn { width:42px; height:42px; border-radius:50%; border:0; background:var(--surface-3); color:var(--text); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    .lp-cbtn.big { width:50px; height:50px; background:var(--text); color:var(--bg, #000); }
    .lp-cbtn:disabled { opacity:.4; cursor:default; }

    .lp-q h3, .lp-chat h3 { font-size:16px; font-weight:800; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .lp-qrow { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:10px; }
    .lp-qrow:hover { background:var(--surface); }
    .lp-qrow.cur { background:color-mix(in srgb, var(--brand) 14%, transparent); }
    .lp-qrow.done { opacity:.45; }
    .lp-qn { width:22px; text-align:right; font-size:12.5px; color:var(--text-3); font-variant-numeric:tabular-nums; flex-shrink:0; }
    .lp-qart { width:38px; height:38px; border-radius:6px; position:relative; overflow:hidden; flex-shrink:0; }
    .lp-qart img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .lp-qi { flex:1; min-width:0; }
    .lp-qt { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lp-qa { font-size:12px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lp-qd { font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; flex-shrink:0; }
    .lp-qb { border:0; background:transparent; color:var(--text-3); cursor:pointer; width:28px; height:28px; border-radius:6px; font-size:13px; flex-shrink:0; }
    .lp-qb:hover { background:var(--surface-3); color:var(--text); }
    .lp-add { background:var(--surface); border-radius:14px; padding:12px; margin-bottom:14px; }
    .lp-res { max-height:320px; overflow:auto; margin-top:8px; }

    .lp-chat { background:var(--surface); border-radius:16px; padding:14px; position:sticky; top:12px; display:flex; flex-direction:column; height:min(640px, calc(100vh - 160px)); }
    @media (max-width: 980px) { .lp-chat { position:static; height:460px; } }
    .lp-msgs { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px; }
    .lp-msg { display:flex; gap:8px; font-size:13.5px; line-height:1.4; }
    .lp-msg-b { min-width:0; flex:1; overflow-wrap:anywhere; }
    .lp-msg-n { font-weight:700; margin-right:6px; }
    .lp-msg-t { color:var(--text-3); font-size:11px; }
    .lp-msg-x { visibility:hidden; border:0; background:transparent; color:var(--text-3); cursor:pointer; font-size:12px; }
    .lp-msg:hover .lp-msg-x { visibility:visible; }
    .lp-send { display:flex; gap:8px; margin-top:10px; }
    .lp-send input { flex:1; min-width:0; }
    .lp-note { font-size:12.5px; color:var(--text-3); text-align:center; padding:10px 0 0; }
    .lp-form label { display:block; font-size:12.5px; font-weight:700; color:var(--text-2); margin:10px 0 5px; }
    .lp-form .wv-input { width:100%; box-sizing:border-box; }
  </style>
  <div id="lp-root"><div class="loading"><div class="spinner"></div></div></div>
</div>
<script src="/js/api.js?v=0acb33bbd519"></script>
<script src="/js/layout.js?v=0acb33bbd519"></script>
<script src="/js/player.js?v=0acb33bbd519"></script>
<script src="/js/router.js?v=0acb33bbd519"></script>
<script>
initPlayer();
(function () {
  var id = new URLSearchParams(location.search).get('id');
  var root = document.getElementById('lp-root');
  var timers = [];
  var me = null;
  try { me = JSON.parse(localStorage.getItem('user') || 'null'); } catch (_) {}
  var loggedIn = !!(me && localStorage.getItem('token'));
  if (typeof window.setPageWash === 'function') window.setPageWash('radio');
  window._pageCleanup.push(function () { timers.forEach(function (t) { clearInterval(t); clearTimeout(t); }); timers = []; document.removeEventListener('lpState', onLpState); document.removeEventListener('lpLeft', onLpLeft); });

  function img(u, w) { return typeof wvImg === 'function' ? wvImg(u, w) : u; }
  function art(url, seed, w) { return '<div style="position:absolute;inset:0;background:' + coverGradient(seed || '') + ';"></div>' + (url ? '<img src="' + escHtml(img(url, w || 320)) + '" alt="" loading="lazy" onerror="this.remove()">' : ''); }
  function av(p) {
    if (!p) return '<span class="lp-av"></span>';
    return p.avatar ? '<img class="lp-av" src="' + escHtml(img(p.avatar, 64)) + '" alt="" title="' + escHtml(p.name) + '" onerror="this.style.visibility=\'hidden\'">' : '<span class="lp-av" title="' + escHtml(p.name) + '">' + escHtml(String(p.name || '?').slice(0, 1).toUpperCase()) + '</span>';
  }
  function who(p) {
    if (!p) return 'someone';
    var inner = '<span data-wv-uid="' + escHtml(p.id) + '">' + escHtml(p.name) + '</span>';
    return p.artist_id ? '<a href="/artist?id=' + encodeURIComponent(p.artist_id) + '" onclick="navigate(this.getAttribute(\'href\'));return false;">' + inner + '</a>' : inner;
  }
  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function countdown(iso) {
    var ms = Date.parse(iso) - Date.now();
    if (!(ms > 0)) return 'any minute';
    var m = Math.floor(ms / 60000), h = Math.floor(m / 60), dd = Math.floor(h / 24);
    if (dd >= 1) return 'in ' + dd + 'd ' + (h % 24) + 'h';
    if (h >= 1) return 'in ' + h + 'h ' + (m % 60) + 'm';
    return 'in ' + Math.max(1, m) + 'm';
  }
  function mmss(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

  // ── List of parties ──────────────────────────────────────────
  function card(l) {
    var np = l.now_playing;
    var badge = l.status === 'live' ? (l.paused ? '<span class="lp-badge paused">PAUSED</span>' : '<span class="lp-badge"><span class="lp-dot"></span>LIVE</span>')
      : l.status === 'ended' ? '<span class="lp-badge ended">ENDED</span>'
      : '<span class="lp-badge soon">' + (l.starts_at ? 'STARTS ' + escHtml(countdown(l.starts_at).toUpperCase()) : 'LOBBY OPEN') + '</span>';
    var sub = l.status === 'live' ? (np ? '♪ ' + np.title + ' · ' + np.artist : 'waiting for the next song') : l.status === 'ended' ? 'Ended' : (l.starts_at ? when(l.starts_at) : 'starting soon');
    return '<div class="lp-card" onclick="navigate(\'/lp?id=' + encodeURIComponent(l.id) + '\')">' +
      '<div class="lp-card-art">' + art(np && np.cover_url, l.title, 480) + badge + (l.status === 'live' ? '<span class="lp-count">🎧 ' + (l.listeners || 0) + '</span>' : '') + '</div>' +
      '<div class="lp-card-body"><div class="lp-card-name">' + escHtml(l.title) + '</div>' +
      '<div class="lp-card-sub">Hosted by ' + escHtml((l.host && l.host.name) || 'someone') + '</div>' +
      '<div class="lp-card-sub">' + escHtml(sub) + '</div></div></div>';
  }

  async function renderList() {
    var d;
    try { d = await api('/lp'); } catch (e) { root.innerHTML = '<div class="wv-empty">' + escHtml(e.message || 'couldnt load listening parties') + '</div>'; return; }
    if (!d.available) { root.innerHTML = '<div class="wv-empty">listening parties are still getting set up...check back in a minute</div>'; return; }
    var mine = (d.mine || []).filter(function (l) { return l.status !== 'ended'; });
    var mineIds = new Set(mine.map(function (l) { return l.id; }));
    var live = (d.live || []).filter(function (l) { return !mineIds.has(l.id); });
    var soon = (d.upcoming || []).filter(function (l) { return !mineIds.has(l.id); });
    root.innerHTML =
      '<div class="lp-head"><div><h1 class="lp-h1">Listening parties</h1>' +
      '<div class="lp-sub">listen to edits and comps together live...everyone hears the same thing at the same time. only discord verified members can host one.</div></div>' +
      (mine.length ? '' : '<button class="wv-btn-play" id="lp-host-btn">Host an LP</button>') + '</div>' +
      (mine.length ? '<div class="lp-sec"><h2>Your LP</h2><div class="lp-grid">' + mine.map(card).join('') + '</div></div>' : '') +
      '<div class="lp-sec"><h2>Live now</h2>' + (live.length ? '<div class="lp-grid">' + live.map(card).join('') + '</div>' : '<div class="lp-empty">nobody is live rn' + (mine.length ? '' : '...start one and send the link to people') + '</div>') + '</div>' +
      (soon.length ? '<div class="lp-sec"><h2>Coming up</h2><div class="lp-grid">' + soon.map(card).join('') + '</div></div>' : '');
    var hb = document.getElementById('lp-host-btn');
    if (hb) hb.onclick = function () {
      if (!loggedIn) { navigate('/login?next=' + encodeURIComponent('/lp')); return; }
      if (!d.can_host) { if (typeof wvVerifyPrompt === 'function') wvVerifyPrompt('you have to be discord verified to host a listening party...just for security reasons.'); return; }
      openForm(null);
    };
  }

  function openForm(lp) {
    var wrap = document.createElement('div');
    wrap.className = 'wv-vp-wrap';
    var local = '';
    if (lp && lp.starts_at) { var t = new Date(lp.starts_at); local = new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
    wrap.innerHTML = '<div class="wv-vp lp-form" style="max-width:460px;text-align:left;">' +
      '<div class="wv-vp-title">' + (lp ? 'Edit LP' : 'Host an LP') + '</div>' +
      '<label>Name</label><input class="wv-input" id="lpf-title" maxlength="100" placeholder="like DONDA 2 comp premiere" value="' + escHtml(lp ? lp.title : '') + '">' +
      '<label>About (optional)</label><textarea class="wv-input" id="lpf-desc" rows="3" maxlength="1000" placeholder="what are you playing?">' + escHtml(lp ? lp.description : '') + '</textarea>' +
      '<label>Start time (optional)</label><input class="wv-input" id="lpf-when" type="datetime-local" value="' + local + '">' +
      '<div style="font-size:12px;color:var(--text-3);margin-top:6px;">you start it yourself when youre ready...the time just tells people when to show up.</div>' +
      '<div class="wv-vp-actions" style="margin-top:16px;"><button class="wv-pill" id="lpf-cancel">Cancel</button><button class="wv-pill brand" id="lpf-ok">' + (lp ? 'Save' : 'Create') + '</button></div>' +
    '</div>';
    document.body.appendChild(wrap);
    var closeIt = function () { wrap.remove(); };
    wrap.querySelector('#lpf-cancel').onclick = closeIt;
    wrap.addEventListener('click', function (e) { if (e.target === wrap) closeIt(); });
    wrap.querySelector('#lpf-ok').onclick = async function () {
      var btn = this, title = document.getElementById('lpf-title').value.trim();
      if (!title) { document.getElementById('lpf-title').focus(); return; }
      var w = document.getElementById('lpf-when').value;
      var body = { title: title, description: document.getElementById('lpf-desc').value, starts_at: w ? new Date(w).toISOString() : null };
      btn.disabled = true;
      try {
        if (lp) { await api('/lp/' + lp.id, { method: 'PATCH', body: JSON.stringify(body) }); closeIt(); loadRoom(true); }
        else { var r = await api('/lp', { method: 'POST', body: JSON.stringify(body) }); closeIt(); navigate('/lp?id=' + encodeURIComponent(r.lp.id)); }
      } catch (e) {
        btn.disabled = false;
        if (e.data && e.data.need_verification && typeof wvVerifyPrompt === 'function') { closeIt(); wvVerifyPrompt('you have to be discord verified to host a listening party...just for security reasons.'); return; }
        if (e.data && e.data.id) { closeIt(); navigate('/lp?id=' + encodeURIComponent(e.data.id)); return; }
        if (typeof wvToast === 'function') wvToast(e.message || 'couldnt save', 'error');
      }
    };
    setTimeout(function () { var t = document.getElementById('lpf-title'); if (t) t.focus(); }, 30);
  }

  if (!id) { renderList(); return; }

  // ── A party room ─────────────────────────────────────────────
  var S = { lp: null, items: [], now: null, curPos: 0, qv: -1, listeners: { count: 0, people: [] }, host: false, offset: 0, status: null, lastChat: 0, msgs: [] };
  function joined() { return typeof lpId === 'function' && lpId() === id; }

  async function loadRoom(keepChat) {
    var d;
    try { d = await api('/lp/' + encodeURIComponent(id)); }
    catch (e) { if (!S.lp) { root.innerHTML = '<div class="wv-empty">' + escHtml(e.message || 'couldnt load this LP') + '</div>'; timers.forEach(function (t) { clearInterval(t); clearTimeout(t); }); timers = []; } return; }
    S.lp = d.lp; S.items = d.items || []; S.now = d.now; S.curPos = d.cur_position || 0; S.qv = d.queue_version; S.listeners = d.listeners || S.listeners; S.host = !!d.can_control; S.status = d.lp.status;
    S.offset = Date.parse(d.server_time) - Date.now();
    document.title = 'wavernrs — ' + d.lp.title;
    if (!document.getElementById('lp-main')) renderShell();
    renderHero(); renderNow(); renderQueue();
    if (!keepChat) loadChat(true);
  }

  function renderShell() {
    root.innerHTML = '<div style="margin:4px 0 8px;"><a href="/lp" onclick="navigate(\'/lp\');return false;" style="color:var(--text-3);font-size:13px;">← All listening parties</a></div>' +
      '<div class="lp-room"><div id="lp-main"><div id="lp-hero"></div><div id="lp-now"></div><div id="lp-add"></div><div class="lp-q" id="lp-q"></div></div>' +
      '<div class="lp-chat"><h3>Chat <span style="font-size:12px;color:var(--text-3);font-weight:600;" id="lp-lc"></span></h3><div class="lp-msgs" id="lp-msgs"></div>' +
      (loggedIn ? '<div class="lp-send"><input class="wv-input" id="lp-in" maxlength="400" placeholder="say something..." autocomplete="off"><button class="wv-pill brand" id="lp-send">Send</button></div>'
        : '<div class="lp-note"><a href="/login" onclick="navigate(\'/login?next=\'+encodeURIComponent(location.pathname+location.search));return false;">Log in</a> to chat</div>') + '</div></div>';
    var inp = document.getElementById('lp-in');
    if (inp) {
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendChat(); });
      document.getElementById('lp-send').onclick = sendChat;
    }
  }

  function statusPill() {
    if (S.status === 'ended') return '<span class="lp-status ended">ENDED</span>';
    if (S.status === 'live') return S.now && S.now.paused ? '<span class="lp-status paused">PAUSED</span>' : '<span class="lp-status"><span class="lp-dot"></span>LIVE</span>';
    return '<span class="lp-status soon">' + (S.lp.starts_at ? 'STARTS ' + escHtml(countdown(S.lp.starts_at).toUpperCase()) + ' · ' + escHtml(when(S.lp.starts_at)) : 'LOBBY · WAITING FOR THE HOST') + '</span>';
  }

  function renderHero() {
    var el = document.getElementById('lp-hero'); if (!el) return;
    var cov = S.now && S.now.track ? S.now.track.cover_url : (S.items[0] && S.items[0].track && S.items[0].track.cover_url);
    var isJoined = joined();
    var ppl = (S.listeners.people || []).slice(0, 8);
    var acts = '';
    if (S.status !== 'ended') acts += isJoined ? '<button class="wv-btn-ghost" id="lp-leave">Leave</button>' : '<button class="wv-btn-play" id="lp-join"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg>' + (S.status === 'live' ? 'Join the LP' : 'Join the lobby') + '</button>';
    acts += '<button class="wv-btn-ghost" id="lp-share">Share link</button>';
    if (S.host && S.status === 'waiting') acts += '<button class="wv-btn-play" id="lp-start"' + (S.items.length ? '' : ' disabled title="add some songs first"') + '>Start the LP</button>';
    if (S.host && S.status !== 'ended') acts += '<button class="wv-pill" id="lp-edit">Edit</button><button class="wv-pill" id="lp-end">End LP</button>';
    if (S.host && S.status === 'ended') acts += '<button class="wv-pill" id="lp-del">Delete</button>';
    el.innerHTML = '<div class="lp-hero"><div class="lp-cover">' + art(cov, S.lp.title, 480) + '</div>' +
      '<div class="lp-info">' + statusPill() +
      '<div class="lp-title">' + escHtml(S.lp.title) + '</div>' +
      '<div class="lp-host">' + av(S.lp.host) + '<span>Hosted by ' + who(S.lp.host) + '</span></div>' +
      (S.lp.description ? '<div class="lp-desc">' + escHtml(S.lp.description) + '</div>' : '') +
      '<div class="lp-people">' + (ppl.length ? '<span class="lp-stack">' + ppl.map(av).join('') + '</span>' : '') + '<span id="lp-lcount">' + S.listeners.count + ' listening' + (isJoined ? ' · youre in' : '') + '</span></div>' +
      '<div class="lp-actions">' + acts + '</div></div></div>';
    var b;
    if ((b = document.getElementById('lp-join'))) b.onclick = join;
    if ((b = document.getElementById('lp-leave'))) b.onclick = function () { if (typeof radioStop === 'function') radioStop(); if (typeof audio !== 'undefined' && audio) audio.pause(); renderHero(); };
    if ((b = document.getElementById('lp-share'))) b.onclick = function () {
      var url = location.origin + '/lp?id=' + encodeURIComponent(id);
      if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) { navigator.share({ title: S.lp.title, url: url }).catch(function () {}); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { if (typeof wvToast === 'function') wvToast('link copied'); }).catch(function () { prompt('copy this link', url); });
    };
    if ((b = document.getElementById('lp-start'))) b.onclick = async function () { await control('start'); join(); };
    if ((b = document.getElementById('lp-edit'))) b.onclick = function () { openForm(S.lp); };
    if ((b = document.getElementById('lp-end'))) b.onclick = async function () { if (!confirm('end this LP for everyone?')) return; await control('end'); };
    if ((b = document.getElementById('lp-del'))) b.onclick = async function () {
      if (!confirm('delete this LP and its chat?')) return;
      try { await api('/lp/' + id, { method: 'DELETE' }); navigate('/lp'); } catch (e) { if (typeof wvToast === 'function') wvToast(e.message, 'error'); }
    };
  }

  function join() {
    if (typeof lpTuneIn !== 'function') return;
    lpTuneIn(id).then(function () { renderHero(); });
    renderHero();
  }

  function posNow() {
    if (!S.now) return 0;
    if (S.now.paused) return S.now.position_sec || 0;
    return Math.max(0, (Date.now() + S.offset - Date.parse(S.now.started_at)) / 1000);
  }

  function renderNow() {
    var el = document.getElementById('lp-now'); if (!el) return;
    if (S.status !== 'live') {
      el.innerHTML = S.status === 'ended'
        ? '<div class="lp-now" style="text-align:center;color:var(--text-2);">this LP is over...thank you for listening ❤️</div>'
        : '<div class="lp-now" style="text-align:center;color:var(--text-2);">' + (S.host ? (S.items.length ? 'everythings ready...press <b>Start the LP</b> when people are here.' : 'add songs below, then press <b>Start the LP</b>.') : 'the host hasnt started yet...join the lobby and itll start playing for you when they do.') + '</div>';
      return;
    }
    var t = S.now && S.now.track;
    var hostBtns = S.host ? '<div class="lp-ctrl">' +
      '<button class="lp-cbtn" data-a="prev" title="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>' +
      '<button class="lp-cbtn big" data-a="' + (S.now && S.now.paused ? 'resume' : 'pause') + '" title="' + (S.now && S.now.paused ? 'resume for everyone' : 'pause for everyone') + '">' + (S.now && S.now.paused ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>') + '</button>' +
      '<button class="lp-cbtn" data-a="next" title="Next"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button></div>' : '';
    if (!t) {
      el.innerHTML = '<div class="lp-now" style="text-align:center;color:var(--text-2);">' + (S.host ? 'that was the last song...add more below and theyll start right away, or end the LP.' : 'waiting for the host to add more songs...') + '</div>';
      return;
    }
    el.innerHTML = '<div class="lp-now"><div class="lp-now-row"><div class="lp-now-art">' + art(t.cover_url, t.title, 160) + '</div><div style="min-width:0;flex:1;">' +
      '<div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--text-3);">NOW PLAYING</div>' +
      '<div class="lp-now-t">' + escHtml(t.title) + '</div><div class="lp-now-a">' + escHtml(t.artist) + (t.album_id ? ' · <a href="/album?id=' + encodeURIComponent(t.album_id) + '" onclick="navigate(this.getAttribute(\'href\'));return false;">' + escHtml(t.album_title || 'comp') + '</a>' : '') + '</div></div></div>' +
      '<div class="lp-bar"><div id="lp-prog"></div></div><div class="lp-times"><span id="lp-t0">0:00</span><span id="lp-t1">' + (S.now.duration_sec ? mmss(S.now.duration_sec) : '') + '</span></div>' + hostBtns +
      '<div class="lp-reacts">' + REACTS.map(function (e) { return '<button class="lp-rb" data-r="' + e + '" title="react">' + e + '</button>'; }).join('') + '</div>' +
      '<div class="lp-float" id="lp-float"></div></div>';
    el.querySelectorAll('[data-a]').forEach(function (b) { b.onclick = function () { control(b.getAttribute('data-a')); }; });
    el.querySelectorAll('[data-r]').forEach(function (b) { b.onclick = function () { sendReact(b.getAttribute('data-r')); }; });
    tick();
  }

  function tick() {
    var p = document.getElementById('lp-prog'); if (!p || !S.now) return;
    var pos = posNow(), dur = S.now.duration_sec || 0;
    if (dur) pos = Math.min(pos, dur);
    p.style.width = dur ? (pos / dur * 100).toFixed(2) + '%' : '0%';
    var a = document.getElementById('lp-t0'); if (a) a.textContent = mmss(pos);
  }

  function renderQueue() {
    var el = document.getElementById('lp-q'); if (!el) return;
    var curId = S.now && S.now.item_id;
    var curPos = S.now ? S.now.position : S.curPos;
    var live = S.status === 'live';
    el.innerHTML = '<h3>Tracklist <span style="font-size:12px;color:var(--text-3);font-weight:600;">' + S.items.length + ' song' + (S.items.length === 1 ? '' : 's') + '</span></h3>' +
      (S.items.length ? S.items.map(function (it, i) {
        var t = it.track, cls = it.id === curId ? ' cur' : (live && (curId ? it.position < curPos : it.position <= curPos) ? ' done' : '');
        var btns = S.host && S.status !== 'ended' ? (live ? '<button class="lp-qb" data-j="' + it.id + '" title="play this now">▶</button>' : '') +
          '<button class="lp-qb" data-u="' + i + '" title="Move up"' + (i ? '' : ' style="visibility:hidden"') + '>↑</button><button class="lp-qb" data-d="' + i + '" title="Move down"' + (i < S.items.length - 1 ? '' : ' style="visibility:hidden"') + '>↓</button><button class="lp-qb" data-x="' + it.id + '" title="Remove">✕</button>' : '';
        return '<div class="lp-qrow' + cls + '"><span class="lp-qn">' + (it.id === curId ? '♪' : i + 1) + '</span><div class="lp-qart">' + art(t.cover_url, t.title, 80) + '</div>' +
          '<div class="lp-qi"><div class="lp-qt">' + escHtml(t.title) + '</div><div class="lp-qa">' + escHtml(t.artist) + (t.album_title ? ' · ' + escHtml(t.album_title) : '') + '</div></div>' +
          '<span class="lp-qd">' + (it.duration_sec ? mmss(it.duration_sec) : '') + '</span>' + btns + '</div>';
      }).join('') : '<div class="lp-empty">' + (S.host ? 'no songs yet...search above to add edits or whole comps.' : 'the host hasnt added any songs yet') + '</div>');
    el.querySelectorAll('[data-j]').forEach(function (b) { b.onclick = function () { control('jump', { item_id: b.getAttribute('data-j') }); }; });
    el.querySelectorAll('[data-x]').forEach(function (b) { b.onclick = async function () { try { await api('/lp/' + id + '/items/' + b.getAttribute('data-x'), { method: 'DELETE' }); loadRoom(true); } catch (e) { wvToast(e.message, 'error'); } }; });
    var move = async function (i, dir) {
      var ids = S.items.map(function (x) { return x.id; });
      var j = i + dir; if (j < 0 || j >= ids.length) return;
      var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
      try { await api('/lp/' + id + '/items/order', { method: 'PUT', body: JSON.stringify({ ids: ids }) }); loadRoom(true); } catch (e) { wvToast(e.message, 'error'); }
    };
    el.querySelectorAll('[data-u]').forEach(function (b) { b.onclick = function () { move(+b.getAttribute('data-u'), -1); }; });
    el.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { move(+b.getAttribute('data-d'), 1); }; });
    renderAdd();
  }

  var _addQ = '', _addTimer = null;
  function renderAdd() {
    var el = document.getElementById('lp-add'); if (!el) return;
    if (!S.host || S.status === 'ended') { el.innerHTML = ''; return; }
    if (document.getElementById('lp-sq')) return;
    el.innerHTML = '<div class="lp-add"><input class="wv-input" id="lp-sq" placeholder="search edits or comps to add..." autocomplete="off" style="width:100%;box-sizing:border-box;"><div class="lp-res" id="lp-res"></div></div>';
    document.getElementById('lp-sq').addEventListener('input', function () {
      _addQ = this.value.trim();
      clearTimeout(_addTimer);
      _addTimer = setTimeout(search, 280);
    });
  }
  async function search() {
    var box = document.getElementById('lp-res'); if (!box) return;
    var q = _addQ;
    if (!q) { box.innerHTML = ''; return; }
    box.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:6px;">searching...</div>';
    var d;
    try { d = await api('/radio/search?q=' + encodeURIComponent(q)); } catch (e) { box.innerHTML = '<div style="color:var(--red);font-size:13px;padding:6px;">' + escHtml(e.message) + '</div>'; return; }
    if (q !== _addQ) return;
    var rows = (d.albums || []).map(function (a) {
      return '<div class="lp-qrow"><div class="lp-qart">' + art(a.cover_url, a.title, 80) + '</div><div class="lp-qi"><div class="lp-qt">' + escHtml(a.title) + '</div><div class="lp-qa">Comp · ' + escHtml(a.artist) + (a.track_count ? ' · ' + a.track_count + ' songs' : '') + '</div></div><button class="wv-pill" data-al="' + a.id + '">Add all</button></div>';
    }).concat((d.tracks || []).map(function (t) {
      return '<div class="lp-qrow"><div class="lp-qart">' + art(t.cover_url, t.title, 80) + '</div><div class="lp-qi"><div class="lp-qt">' + escHtml(t.title) + '</div><div class="lp-qa">' + escHtml(t.artist) + (t.album_title ? ' · ' + escHtml(t.album_title) : '') + '</div></div><button class="wv-pill" data-tr="' + t.id + '">Add</button></div>';
    }));
    box.innerHTML = rows.length ? rows.join('') : '<div style="color:var(--text-3);font-size:13px;padding:6px;">nothing found</div>';
    box.querySelectorAll('[data-al],[data-tr]').forEach(function (b) {
      b.onclick = async function () {
        var body = b.hasAttribute('data-al') ? { album_id: b.getAttribute('data-al') } : { track_id: b.getAttribute('data-tr') };
        b.disabled = true;
        try { var r = await api('/lp/' + id + '/items', { method: 'POST', body: JSON.stringify(body) }); b.textContent = 'Added ' + (r.added > 1 ? r.added : '✓'); loadRoom(true); }
        catch (e) { b.disabled = false; wvToast(e.message || 'couldnt add that', 'error'); }
      };
    });
  }

  async function control(action, extra) {
    try {
      var r = await api('/lp/' + id + '/control', { method: 'POST', body: JSON.stringify(Object.assign({ action: action }, extra || {})) });
      S.now = r.now; S.status = r.status; S.offset = Date.parse(r.server_time) - Date.now();
      renderHero(); renderNow(); renderQueue();
      if (joined() && typeof lpTuneIn === 'function') lpTuneIn(id);
    } catch (e) { if (typeof wvToast === 'function') wvToast(e.message || 'couldnt do that', 'error'); }
  }

  // ── Reactions: tap one and it floats up for everyone in the room ──
  var REACTS = ['🔥', '😭', '🐐', '💀', '❤️', '🙏'];
  var _seenReacts = {}, _reactsPrimed = false, _lastReact = 0;
  function floatReact(e) {
    var box = document.getElementById('lp-float'); if (!box) return;
    var el = document.createElement('span');
    el.className = 'lp-fl'; el.textContent = e;
    el.style.left = (10 + Math.random() * 80) + '%';
    el.style.setProperty('--dx', (Math.random() * 60 - 30).toFixed(0) + 'px');
    box.appendChild(el);
    setTimeout(function () { el.remove(); }, 2500);
  }
  async function sendReact(e) {
    if (Date.now() - _lastReact < 650) return;
    _lastReact = Date.now();
    floatReact(e);
    try {
      var cid = ''; try { cid = sessionStorage.getItem('wv_lp_cid') || ''; } catch (_) {}
      var r = await api('/lp/' + id + '/react', { method: 'POST', body: JSON.stringify({ e: e, c: cid }) });
      if (r && r.n) _seenReacts[r.n] = 1;
    } catch (_) {}
  }
  function takeReacts(list) {
    if (!list) return;
    list.forEach(function (x) {
      if (_seenReacts[x.n]) return;
      _seenReacts[x.n] = 1;
      if (_reactsPrimed) setTimeout(function () { floatReact(x.e); }, Math.random() * 2600);
    });
    _reactsPrimed = true;
  }

  function applyState(d) {
    if (!d || d.error) return;
    takeReacts(d.reactions);
    S.offset = Date.parse(d.server_time) - Date.now();
    var before = JSON.stringify([S.status, S.now && S.now.item_id, S.now && S.now.paused, S.now && S.now.started_at, S.now && S.now.duration_sec]);
    S.status = d.status; S.now = d.now; S.curPos = d.cur_position || 0;
    S.listeners.count = d.listeners || 0;
    var lc = document.getElementById('lp-lcount'); if (lc) lc.textContent = S.listeners.count + ' listening' + (joined() ? ' · youre in' : '');
    var after = JSON.stringify([S.status, S.now && S.now.item_id, S.now && S.now.paused, S.now && S.now.started_at, S.now && S.now.duration_sec]);
    if (d.queue_version !== S.qv) { loadRoom(true); return; }
    if (before !== after) { renderHero(); renderNow(); renderQueue(); }
  }
  function onLpState(e) { if (joined()) applyState(e.detail); }
  function onLpLeft() { renderHero(); }
  document.addEventListener('lpState', onLpState);
  document.addEventListener('lpLeft', onLpLeft);

  async function poll() {
    if (joined()) return;
    try { var r = await fetch(API_BASE + '/lp/' + encodeURIComponent(id) + '/now'); applyState(await r.json()); } catch (_) {}
  }

  // ── Chat ─────────────────────────────────────────────────────
  function msgHtml(m) {
    var mine = me && m.user && m.user.id === me.id;
    var canDel = mine || S.host;
    var t = new Date(m.created_at);
    return '<div class="lp-msg" data-mid="' + m.id + '">' + av(m.user) + '<div class="lp-msg-b"><span class="lp-msg-n">' + who(m.user) + '</span><span class="lp-msg-t">' + t.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) + '</span><div>' + escHtml(m.body) + '</div></div>' +
      (canDel ? '<button class="lp-msg-x" data-del="' + m.id + '" title="Delete">✕</button>' : '') + '</div>';
  }
  function paintChat(scroll) {
    var box = document.getElementById('lp-msgs'); if (!box) return;
    var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = S.msgs.length ? S.msgs.map(msgHtml).join('') : '<div class="lp-note" style="margin:auto;">no messages yet...say hi</div>';
    box.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = async function () { try { await api('/lp/' + id + '/chat/' + b.getAttribute('data-del'), { method: 'DELETE' }); S.msgs = S.msgs.filter(function (m) { return String(m.id) !== b.getAttribute('data-del'); }); paintChat(false); } catch (e) { wvToast(e.message, 'error'); } }; });
    if (scroll || nearBottom) box.scrollTop = box.scrollHeight;
  }
  async function loadChat(full) {
    try {
      var r = await fetch(API_BASE + '/lp/' + encodeURIComponent(id) + '/chat' + (full || !S.lastChat ? '' : '?after=' + S.lastChat));
      var d = await r.json();
      var ms = d.messages || [];
      if (full || !S.lastChat) S.msgs = ms; else if (ms.length) S.msgs = S.msgs.concat(ms).slice(-300);
      else return;
      if (S.msgs.length) S.lastChat = S.msgs[S.msgs.length - 1].id;
      paintChat(full);
    } catch (_) {}
  }
  async function sendChat() {
    var inp = document.getElementById('lp-in'); if (!inp) return;
    var body = inp.value.trim(); if (!body) return;
    inp.value = '';
    try {
      var r = await api('/lp/' + id + '/chat', { method: 'POST', body: JSON.stringify({ body: body }) });
      if (!S.msgs.some(function (m) { return m.id === r.message.id; })) { S.msgs.push(r.message); S.lastChat = Math.max(S.lastChat, r.message.id); }
      paintChat(true);
    } catch (e) { inp.value = body; if (typeof wvToast === 'function') wvToast(e.message || 'couldnt send', 'error'); }
  }

  loadRoom(false);
  timers.push(setInterval(poll, 3000));
  timers.push(setInterval(tick, 500));
  timers.push(setInterval(function () { loadChat(false); }, 3000));
  timers.push(setInterval(function () { loadChat(true); }, 30000));
  timers.push(setInterval(function () { loadRoom(true); }, 20000));
})();
</script>
</body>
</html>
