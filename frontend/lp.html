<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — listening parties</title>
  <link rel="stylesheet" href="/css/style.css?v=6288d60cd337">
  <script src="/js/status-card.js?v=6288d60cd337"></script>
  <script src="/js/down.js?v=6288d60cd337"></script>
</head>
<body>
<div id="view">
  <style>
    .lp-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:8px 0 22px; }
    .lp-h1 { font-size:clamp(28px,4vw,44px); font-weight:800; letter-spacing:-.03em; margin:0; }
    .lp-sub { color:var(--text-2); font-size:14px; margin-top:6px; max-width:560px; }
    .lp-sec { margin:0 0 30px; }
    .lp-sec h2 { font-size:18px; font-weight:800; letter-spacing:-.02em; margin:0 0 12px; display:flex; align-items:center; gap:10px; }
    .lp-sec h2 .lp-n { font-size:12px; font-weight:700; color:var(--text-3); background:var(--surface-2); border-radius:99px; padding:2px 8px; }
    .lp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
    .lp-card { background:var(--surface); border:1px solid var(--hair); border-radius:14px; overflow:hidden; cursor:pointer; position:relative; transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s; }
    .lp-card:hover { transform:translateY(-3px); box-shadow:0 16px 36px rgba(0,0,0,.26); border-color:var(--hair-strong); }
    .lp-card:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    .lp-card-art { aspect-ratio:16/10; position:relative; overflow:hidden; }
    .lp-card-art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .6s var(--ease); }
    .lp-card:hover .lp-card-art img { transform:scale(1.045); }
    .lp-card-art::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.22) 0%, transparent 34%, transparent 58%, rgba(0,0,0,.5) 100%); pointer-events:none; }
    .lp-badge { position:absolute; z-index:1; top:10px; left:10px; font-size:10px; font-weight:800; letter-spacing:.08em; padding:4px 8px; border-radius:6px; color:#fff; background:#e0245e; display:inline-flex; align-items:center; gap:6px; }
    .lp-badge.soon { background:rgba(0,0,0,.62); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
    .lp-badge.ended { background:rgba(0,0,0,.62); color:#ddd; }
    .lp-badge.paused { background:#b7791f; }
    .lp-dot { width:6px; height:6px; border-radius:50%; background:#fff; animation:lpPulse 1.4s infinite; }
    @keyframes lpPulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
    .lp-count { position:absolute; z-index:1; top:10px; right:10px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; font-weight:700; padding:4px 8px; border-radius:6px; display:inline-flex; align-items:center; gap:5px; }
    .lp-chip { position:absolute; z-index:1; bottom:10px; left:10px; background:rgba(0,0,0,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; font-size:12px; font-weight:700; padding:5px 10px; border-radius:99px; font-variant-numeric:tabular-nums; display:inline-flex; align-items:center; gap:6px; }
    .lp-chip.hot { background:var(--brand); color:var(--on-brand); }
    .lp-chip.r { left:auto; right:10px; }
    .lp-card-body { padding:12px 12px 14px 14px; display:flex; gap:10px; align-items:flex-start; }
    .lp-card-meta { min-width:0; flex:1; }
    .lp-card-name { font-weight:800; font-size:16px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lp-card-sub { font-size:12.5px; color:var(--text-2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lp-card-sub.np { color:var(--text); }
    .lp-ibtn { width:40px; height:40px; border-radius:50%; border:1px solid var(--hair-strong); background:transparent; color:var(--text-2); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:background .14s, color .14s; }
    .lp-ibtn:hover { background:var(--surface-3); color:var(--text); }
    .lp-ibtn:focus-visible, .lp-rb:focus-visible, .lp-cbtn:focus-visible, .lp-qb:focus-visible, .lp-grip:focus-visible, .lp-emo button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    .lp-empty { color:var(--text-3); font-size:14px; padding:18px; border:1px dashed var(--hair-strong); border-radius:14px; text-align:center; }
    .lp-skel-card { background:var(--surface); border:1px solid var(--hair); border-radius:14px; overflow:hidden; }
    .lp-skel-card .a { aspect-ratio:16/10; border-radius:0; }
    .lp-skel-card .l1 { height:14px; width:70%; margin:14px 14px 8px; }
    .lp-skel-card .l2 { height:11px; width:45%; margin:0 14px 16px; }
    .lp-skel-h { height:18px; width:140px; margin-bottom:14px; }

    .lp-eq { display:inline-flex; align-items:flex-end; gap:2px; height:11px; flex-shrink:0; }
    .lp-eq i { display:block; width:2.5px; height:100%; border-radius:1px; background:currentColor; transform-origin:bottom; animation:lpEq .9s ease-in-out infinite alternate; }
    .lp-eq i:nth-child(2) { animation-duration:.66s; animation-delay:-.3s; }
    .lp-eq i:nth-child(3) { animation-duration:1.08s; animation-delay:-.55s; }
    .lp-eq i:nth-child(4) { animation-duration:.8s; animation-delay:-.15s; }
    .lp-eq.paused i { animation-play-state:paused; }
    @keyframes lpEq { 0% { transform:scaleY(.22); } 100% { transform:scaleY(1); } }

    .lp-void { position:relative; overflow:hidden; isolation:isolate; border-radius:20px; border:1px solid var(--hair); background:var(--surface); padding:clamp(22px,4vw,48px); margin-bottom:14px; }
    .lp-void-bg { position:absolute; inset:-25%; z-index:-1; pointer-events:none; }
    .lp-void-bg i { position:absolute; width:52%; aspect-ratio:1; border-radius:50%; filter:blur(70px); opacity:.5; animation:lpBlob 18s ease-in-out infinite alternate; }
    .lp-void-bg i:nth-child(1) { background:var(--brand); left:8%; top:12%; }
    .lp-void-bg i:nth-child(2) { background:var(--pink,#f472b6); right:2%; top:28%; opacity:.34; animation-duration:23s; animation-delay:-6s; }
    .lp-void-bg i:nth-child(3) { background:var(--blue,#60a5fa); left:34%; bottom:0; opacity:.28; animation-duration:27s; animation-delay:-11s; }
    .theme-light .lp-void-bg i { opacity:.26; }
    .theme-light .lp-void-bg i:nth-child(n+2) { opacity:.18; }
    @keyframes lpBlob { 0% { transform:translate(0,0) scale(1); } 50% { transform:translate(9%,-7%) scale(1.14); } 100% { transform:translate(-7%,8%) scale(.94); } }
    .lp-void-in { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; align-items:center; }
    .lp-eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-2); background:color-mix(in srgb, var(--text) 7%, transparent); border:1px solid var(--hair); padding:5px 10px; border-radius:99px; }
    .lp-eyebrow .lp-dot { background:var(--text-3); animation:none; }
    .lp-void h2 { font-size:clamp(30px,4.4vw,52px); font-weight:800; letter-spacing:-.04em; line-height:1; margin:16px 0 12px; }
    .lp-void h2 em { font-style:normal; background:linear-gradient(90deg, var(--brand), var(--pink,#f472b6)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .lp-void p { color:var(--text-2); font-size:15px; line-height:1.5; max-width:460px; margin:0; }
    .lp-void-cta { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
    .lp-void-cta .wv-btn-play, .lp-void-cta .wv-btn-ghost { min-height:44px; }
    .lp-void-art { position:relative; height:250px; }
    .lp-sleeve { position:absolute; z-index:2; left:calc(50% - 150px); top:50%; width:196px; aspect-ratio:1; margin-top:-98px; border-radius:14px; overflow:hidden; transform:rotate(-5deg); background:linear-gradient(140deg, var(--brand) 0%, var(--pink,#f472b6) 58%, var(--orange,#fb923c) 100%); box-shadow:0 26px 60px rgba(0,0,0,.35); display:flex; flex-direction:column; justify-content:space-between; padding:16px; box-sizing:border-box; color:#fff; }
    .lp-sleeve::before { content:""; position:absolute; inset:0; background:radial-gradient(120% 80% at 10% 0%, rgba(255,255,255,.35), transparent 55%); }
    .lp-sleeve b { position:relative; font-size:44px; font-weight:900; letter-spacing:-.05em; line-height:.9; }
    .lp-sleeve small { position:relative; font-size:11px; font-weight:800; letter-spacing:.14em; opacity:.9; display:flex; align-items:center; gap:8px; }
    .lp-vinyl { position:absolute; z-index:1; left:calc(50% - 60px); top:50%; width:196px; aspect-ratio:1; margin-top:-98px; border-radius:50%; box-shadow:0 20px 50px rgba(0,0,0,.4); }
    .lp-vinyl .disc { position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle, #0b0b0b 0 6%, var(--brand) 6.5% 27%, #0b0b0b 27.5% 29%, transparent 29.5%), repeating-radial-gradient(circle, #161616 0 1.4px, #0c0c0c 1.4px 2.8px); animation:lpSpin 5.5s linear infinite; }
    .lp-vinyl .disc::after { content:""; position:absolute; left:50%; top:22%; width:9%; height:9%; border-radius:50%; background:rgba(255,255,255,.55); }
    .lp-vinyl::after { content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 30deg, transparent 0 12%, rgba(255,255,255,.1) 16%, transparent 22% 58%, rgba(255,255,255,.08) 62%, transparent 68%); pointer-events:none; }
    @keyframes lpSpin { to { transform:rotate(360deg); } }
    .lp-void-fl { position:absolute; z-index:3; font-size:24px; animation:lpDrift 6s ease-in-out infinite; opacity:0; }
    .lp-void-fl:nth-of-type(1) { left:0; top:14%; animation-delay:.2s; }
    .lp-void-fl:nth-of-type(2) { left:58%; top:4%; animation-delay:1.8s; font-size:28px; }
    .lp-void-fl:nth-of-type(3) { left:86%; top:46%; animation-delay:3.3s; }
    .lp-void-fl:nth-of-type(4) { left:22%; top:78%; animation-delay:4.4s; font-size:20px; }
    @keyframes lpDrift { 0% { opacity:0; transform:translateY(16px) scale(.7); } 15% { opacity:1; transform:translateY(0) scale(1); } 70% { opacity:1; } 100% { opacity:0; transform:translateY(-40px) scale(.95); } }
    .lp-steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:0 0 32px; }
    .lp-step { background:var(--surface); border:1px solid var(--hair); border-radius:14px; padding:16px; display:flex; gap:14px; align-items:flex-start; }
    .lp-step-ic { width:42px; height:42px; border-radius:12px; background:color-mix(in srgb, var(--brand) 16%, transparent); color:var(--brand); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .lp-step-n { font-size:10.5px; font-weight:800; letter-spacing:.12em; color:var(--text-3); }
    .lp-step b { display:block; font-size:15px; letter-spacing:-.01em; margin:2px 0 3px; }
    .lp-step span { font-size:13px; color:var(--text-2); line-height:1.45; }
    @media (max-width: 760px) {
      .lp-void-in { grid-template-columns:minmax(0,1fr); gap:6px; }
      .lp-void-art { order:-1; height:190px; }
      .lp-sleeve, .lp-vinyl { width:150px; margin-top:-75px; }
      .lp-sleeve { left:calc(50% - 115px); }
      .lp-vinyl { left:calc(50% - 45px); }
      .lp-sleeve b { font-size:34px; }
      .lp-steps { grid-template-columns:minmax(0,1fr); }
    }

    .lp-pop { position:fixed; z-index:9100; min-width:220px; background:var(--elevated); border:1px solid var(--border); border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,.4); padding:6px; animation:lpPopIn .14s var(--ease); }
    @keyframes lpPopIn { from { opacity:0; transform:translateY(-4px) scale(.98); } to { opacity:1; transform:none; } }
    .lp-pop a, .lp-pop button { display:flex; align-items:center; gap:10px; width:100%; min-height:42px; padding:9px 12px; border:0; border-radius:8px; background:none; color:var(--text); font:inherit; font-size:13.5px; font-weight:600; text-decoration:none; cursor:pointer; text-align:left; box-sizing:border-box; }
    .lp-pop a:hover, .lp-pop button:hover, .lp-pop a:focus-visible, .lp-pop button:focus-visible { background:var(--surface-3); outline:none; }
    .lp-pop svg { color:var(--text-2); flex-shrink:0; }
    .lp-pop-h { font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--text-3); padding:8px 12px 4px; }

    .lp-room { display:grid; grid-template-columns:minmax(0,1fr) 340px; grid-template-areas:"hero chat" "now chat" "add chat" "q chat"; grid-template-rows:auto auto auto 1fr; column-gap:22px; align-items:start; }
    #lp-hero { grid-area:hero; min-width:0; } #lp-now { grid-area:now; min-width:0; } #lp-add { grid-area:add; min-width:0; } #lp-q { grid-area:q; min-width:0; }
    @media (max-width: 980px) { .lp-room { grid-template-columns:minmax(0,1fr); grid-template-areas:"hero" "now" "chat" "add" "q"; grid-template-rows:none; } }
    .lp-hero { display:flex; gap:24px; align-items:center; flex-wrap:wrap; margin:6px 0 20px; }
    .lp-cover { width:200px; height:200px; border-radius:14px; overflow:hidden; position:relative; flex-shrink:0; box-shadow:0 14px 44px rgba(0,0,0,.42); }
    .lp-cover img, .lp-xl img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .lp-xf { position:absolute; inset:0; }
    .lp-xl { position:absolute; inset:0; opacity:0; transition:opacity .7s var(--ease); }
    .lp-xl.in { opacity:1; }
    @media (max-width: 600px) { .lp-hero { gap:14px; } .lp-cover { width:132px; height:132px; } .lp-info { min-width:0; flex-basis:100%; } }
    .lp-info { flex:1; min-width:240px; }
    .lp-status { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:800; letter-spacing:.08em; padding:4px 9px; border-radius:6px; color:#fff; background:#e0245e; }
    .lp-status.soon { background:var(--surface-3); color:var(--text); }
    .lp-status.ended { background:var(--surface-3); color:var(--text-2); }
    .lp-status.paused { background:#b7791f; }
    .lp-status-x { font-size:12.5px; color:var(--text-3); margin-left:8px; font-weight:600; }
    .lp-title { font-size:clamp(26px,3.3vw,42px); font-weight:800; letter-spacing:-.035em; line-height:1.05; margin:10px 0 6px; overflow-wrap:anywhere; }
    .lp-host { font-size:14px; color:var(--text-2); display:flex; align-items:center; gap:8px; }
    .lp-host a { color:var(--text); font-weight:700; }
    .lp-av { width:24px; height:24px; border-radius:50%; object-fit:cover; background:var(--surface-3); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--text-2); flex-shrink:0; overflow:hidden; }
    .lp-desc { color:var(--text-2); font-size:14px; margin-top:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .lp-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center; }
    .lp-actions .wv-btn-play, .lp-actions .wv-btn-ghost { min-height:40px; }
    .lp-actions .wv-pill { min-height:40px; }
    .lp-people { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text-2); }
    .lp-stack { display:flex; }
    .lp-stack .lp-av { border:2px solid var(--page-bg-base, #121212); margin-left:-7px; box-sizing:content-box; }
    .lp-stack .lp-av:first-child { margin-left:0; }

    .lp-now { background:var(--surface); border:1px solid var(--hair); border-radius:18px; padding:18px; margin-bottom:18px; position:relative; overflow:hidden; isolation:isolate; }
    .lp-now-bg { position:absolute; inset:-40px; z-index:-2; filter:blur(38px) saturate(1.5); opacity:.42; transform:translateZ(0); }
    .theme-light .lp-now-bg { opacity:.26; }
    .lp-now-veil { position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, color-mix(in srgb, var(--surface) 35%, transparent) 0%, color-mix(in srgb, var(--surface) 82%, transparent) 70%, var(--surface) 100%); }
    .lp-now-msg { text-align:center; color:var(--text-2); font-size:14px; padding:6px 0; }
    .lp-now-row { display:flex; gap:16px; align-items:center; }
    .lp-now-art { width:92px; height:92px; border-radius:10px; overflow:hidden; position:relative; flex-shrink:0; box-shadow:0 10px 28px rgba(0,0,0,.35); }
    .lp-now-meta { min-width:0; flex:1; }
    .lp-np { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--brand); }
    .lp-np.paused { color:#d69e2e; }
    .lp-now-t { font-weight:800; font-size:20px; letter-spacing:-.025em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:4px; }
    .lp-now-a { font-size:13.5px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
    .lp-now-a a { color:inherit; }
    .lp-now-a a:hover { color:var(--text); text-decoration:underline; }
    .lp-seek { position:relative; height:22px; margin-top:14px; display:flex; align-items:center; touch-action:none; outline:none; }
    .lp-seek-track { position:relative; width:100%; height:4px; border-radius:3px; background:color-mix(in srgb, var(--text) 16%, transparent); overflow:hidden; transition:height .12s var(--ease); }
    .lp-seek-fill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--brand); border-radius:3px; transition:width .5s linear; }
    .lp-seek.host { cursor:pointer; }
    .lp-seek.host:hover .lp-seek-track, .lp-seek.drag .lp-seek-track, .lp-seek:focus-visible .lp-seek-track { height:6px; }
    .lp-seek.drag .lp-seek-fill { transition:none; }
    .lp-seek-knob { position:absolute; top:50%; left:0; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.35); transform:scale(0); transition:transform .12s var(--ease); pointer-events:none; }
    .lp-seek.host:hover .lp-seek-knob, .lp-seek.drag .lp-seek-knob, .lp-seek:focus-visible .lp-seek-knob { transform:scale(1); }
    .lp-seek:focus-visible .lp-seek-track { box-shadow:0 0 0 2px color-mix(in srgb, var(--brand) 55%, transparent); }
    .lp-seek-tip { position:absolute; bottom:calc(100% + 2px); left:0; transform:translateX(-50%); background:var(--elevated); color:var(--text); border:1px solid var(--border); font-size:11px; font-weight:700; padding:3px 7px; border-radius:6px; opacity:0; pointer-events:none; font-variant-numeric:tabular-nums; transition:opacity .12s; white-space:nowrap; }
    .lp-seek.host:hover .lp-seek-tip, .lp-seek.drag .lp-seek-tip { opacity:1; }
    .lp-times { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-3); margin-top:2px; font-variant-numeric:tabular-nums; }
    .lp-ctrl { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:8px; }
    .lp-cbtn { width:44px; height:44px; border-radius:50%; border:0; background:color-mix(in srgb, var(--text) 10%, transparent); color:var(--text); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:transform .1s var(--ease), background .14s; }
    .lp-cbtn:hover { background:color-mix(in srgb, var(--text) 16%, transparent); }
    .lp-cbtn:active { transform:scale(.93); }
    .lp-cbtn.big { width:54px; height:54px; background:var(--text); color:var(--page-bg-base, #121212); }
    .lp-cbtn:disabled { opacity:.4; cursor:default; }
    .lp-kbd { font-size:10.5px; color:var(--text-3); text-align:center; margin-top:6px; }
    .lp-kbd kbd { font:inherit; font-weight:700; border:1px solid var(--hair-strong); border-bottom-width:2px; border-radius:4px; padding:0 5px; color:var(--text-2); }
    @media (hover: none) { .lp-kbd { display:none; } }
    .lp-reacts { display:flex; justify-content:center; gap:6px; margin-top:14px; flex-wrap:wrap; }
    .lp-rb { position:relative; border:0; background:color-mix(in srgb, var(--text) 8%, transparent); border-radius:99px; width:46px; height:42px; font-size:19px; cursor:pointer; transition:transform .12s var(--ease), background .12s; }
    .lp-rb:hover { background:color-mix(in srgb, var(--text) 14%, transparent); transform:translateY(-2px); }
    .lp-rb:active, .lp-rb.hit { transform:scale(.88); }
    .lp-rb sup { position:absolute; right:5px; top:3px; font-size:9px; font-weight:800; color:var(--text-3); }
    @media (hover: none) { .lp-rb sup { display:none; } }
    .lp-float { position:absolute; left:0; right:0; bottom:44px; height:0; pointer-events:none; overflow:visible; z-index:2; }
    .lp-fl { position:absolute; bottom:0; font-size:26px; animation:lpFloat 2.4s ease-out forwards; will-change:transform, opacity; }

    if (!_combo.on) return;
    var el = document.getElementById('lp-combo');
    if (el) {
      var cnt = {}; _combo.hits.forEach(function (h) { cnt[h.e] = (cnt[h.e] || 0) + 1; });
      var top = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; })[0] || e;
      el.innerHTML = '<span>' + E(top) + '</span>x' + _combo.n;
      el.classList.add('on');
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    }
    clearTimeout(_combo.t);
    _combo.t = setTimeout(function () { _combo.on = false; _combo.n = 0; var c = document.getElementById('lp-combo'); if (c) c.classList.remove('on', 'pop'); }, 2600);
  }
  async function sendReact(e) {
    if (Date.now() - _lastReact < 650) return;
    _lastReact = Date.now();
    noteReact(e);
    var b = document.querySelector('.lp-rb[data-r="' + e + '"]');
    if (b) { b.classList.add('hit'); setTimeout(function () { b.classList.remove('hit'); }, 140); }
    try {
      var cid = ''; try { cid = sessionStorage.getItem('wv_lp_cid') || ''; } catch (_) {}
      var r = await api('/lp/' + id + '/react', { method: 'POST', body: JSON.stringify({ e: e, c: cid }) });
      if (r && r.n) _seenReacts[r.n] = 1;
    } catch (_) {}
  }
  function takeReacts(list) {
    if (!list) return;
    list.forEach(function (x) {
      if (_seenReacts[x.n]) return;
      _seenReacts[x.n] = 1;
      if (_reactsPrimed) timers.push(setTimeout(function () { noteReact(x.e); }, Math.random() * 2600));
    });
    _reactsPrimed = true;
  }

  function onKey(e) {
    if (!S.lp || e.metaKey || e.ctrlKey || e.altKey || typing(e.target)) return;
    if (document.querySelector('.wv-vp-wrap')) return;
    if (S.status !== 'live') return;
    if (/^[1-6]$/.test(e.key) && S.mode === 'live') { e.preventDefault(); sendReact(REACTS[+e.key - 1]); return; }
    if ((e.code === 'Space' || e.key === ' ') && S.host && S.now && S.now.track) {
      var onControl = e.target && e.target.closest && e.target.closest('button, a, [role="slider"], [role="button"], [tabindex]:not([tabindex="-1"])');
      if (onControl) return;
      e.preventDefault(); e.stopImmediatePropagation();
      if (e.repeat) return;
      control(S.now.paused ? 'resume' : 'pause');
    }
  }
  window.addEventListener('keydown', onKey, true);

  function applyState(d) {
    if (!d || d.error) return;
    takeReacts(d.reactions);
    S.offset = Date.parse(d.server_time) - Date.now();
    var key = function () { return JSON.stringify([S.status, S.now && S.now.item_id, S.now && S.now.paused, S.now && S.now.started_at, S.now && S.now.duration_sec]); };
    var before = key();
    S.status = d.status; S.now = d.now; S.curPos = d.cur_position || 0;
    S.listeners.count = d.listeners || 0;
    var lc = document.getElementById('lp-lcount'); if (lc) lc.textContent = lcText();
    var cl = document.getElementById('lp-lc'); if (cl) cl.innerHTML = S.status === 'live' && S.listeners.count ? '<span class="lp-dot"></span>' + S.listeners.count + ' here' : '';
    if (d.queue_version !== S.qv) { loadRoom(true); return; }
    if (before !== key()) { if (S.seeking != null) S.seeking = null; renderAll(); }
  }
  function onLpState(e) { if (joined()) applyState(e.detail); }
  function onLpLeft() { renderHero(); }
  document.addEventListener('lpState', onLpState);
  document.addEventListener('lpLeft', onLpLeft);

  async function poll() {
    if (joined() || S.status === 'ended') return;
    try { var r = await fetch(API_BASE + '/lp/' + encodeURIComponent(id) + '/now'); applyState(await r.json()); } catch (_) {}
  }

  // ── Chat ─────────────────────────────────────────────────────
  function lpLinks(h) {
    return h.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, function (m, pre, u) {
      var tail = (u.match(/[).,!?]+$/) || [''])[0]; u = u.slice(0, u.length - tail.length);
      var inside = /^https?:\/\/(www\.)?wavernrs\.com\//.test(u);
      return pre + '<a href="' + u + '" target="_blank" rel="noopener' + (inside ? '' : ' nofollow ugc') + '" style="color:var(--brand);word-break:break-all;">' + u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 50) + (u.length > 58 ? '\u2026' : '') + '</a>' + tail;
    });
  }
  function mentions(h) { return h.replace(/(^|\s)@([A-Za-z0-9_.]{2,32})/g, function (m, pre, u) { return pre + '<span class="lp-at">@' + u + '</span>'; }); }
  function mentionsMe(body) {
    var n = myName(); if (!n) return false;
    var re = new RegExp('(^|\\s)@' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z0-9_])', 'i');
    return re.test(body || '');
  }
  function nearBottom(box) { return box.scrollHeight - box.scrollTop - box.clientHeight < 80; }
  function newPill() {
    var p = document.getElementById('lp-newpill'); if (!p) return;
    p.classList.toggle('on', S.unseen > 0);
    p.querySelector('span').textContent = S.unseen + ' new message' + (S.unseen === 1 ? '' : 's');
  }
  function msgHtml(m) {
    if (m.sys) return '<div class="lp-sys"><span>' + who(m.user) + ' ' + (m.sys === 'joined' ? 'joined' : 'left') + '</span></div>';
    var mine = me && m.user && m.user.id === me.id;
    var canDel = (mine || S.host) && S.status !== 'ended';
    var isHost = S.lp && S.lp.host && m.user && m.user.id === S.lp.host.id;
    var t = new Date(m.created_at);
    var handle = m.user && m.user.username;
    var hit = !mine && mentionsMe(m.body);
    return '<div class="lp-msg' + (hit ? ' mention' : '') + '" data-mid="' + E(m.id) + '">' +
      (handle && loggedIn && S.status !== 'ended' ? '<button class="lp-msg-av" type="button" data-at="' + E(handle) + '" aria-label="mention ' + E(m.user.name) + '" title="mention @' + E(handle) + '">' + av(m.user) + '</button>' : av(m.user)) +
      '<div class="lp-msg-b">' + (isHost ? '<span class="lp-hostpill">HOST</span>' : '') + '<span class="lp-msg-n">' + who(m.user) + '</span><span class="lp-msg-t">' + E(t.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })) + '</span><div>' + lpLinks(mentions(E(m.body))) + '</div></div>' +
      (canDel ? '<button class="lp-msg-x" type="button" data-del="' + E(m.id) + '" aria-label="Delete message" title="Delete">' + IC.x + '</button>' : '') + '</div>';
  }
  function paintChat(scroll, keepPos) {
    var box = document.getElementById('lp-msgs'); if (!box) return;
    var nb = nearBottom(box), prevTop = box.scrollTop;
    var all = S.msgs.concat(S.sys).map(function (m, i) { return { m: m, t: Date.parse(m.created_at) || 0, i: i }; });
    all.sort(function (a, b) { return a.t - b.t || a.i - b.i; });
    box.innerHTML = all.length ? all.map(function (x) { return msgHtml(x.m); }).join('') : '<div class="lp-note" style="margin:auto;">no messages yet...say hi</div>';
    box.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = async function () { try { await api('/lp/' + id + '/chat/' + b.getAttribute('data-del'), { method: 'DELETE' }); S.msgs = S.msgs.filter(function (m) { return String(m.id) !== b.getAttribute('data-del'); }); paintChat(false, true); } catch (e) { toast(e.message, 'error'); } }; });
    box.querySelectorAll('[data-at]').forEach(function (b) { b.onclick = function () { insertText('@' + b.getAttribute('data-at') + ' '); }; });
    if (scroll || nb) { box.scrollTop = box.scrollHeight; S.unseen = 0; }
    else if (keepPos) box.scrollTop = prevTop;
    newPill();
  }
  async function loadChat(full) {
    try {
      var incr = !(full || !S.lastChat);
      var r = await fetch(API_BASE + '/lp/' + encodeURIComponent(id) + '/chat' + (incr ? '?after=' + S.lastChat : ''));
      var d = await r.json();
      var ms = d.messages || [];
      S._chatLoaded = true;
      if (!incr) {
        var box = document.getElementById('lp-msgs');
        var had = S.msgs.map(function (m) { return m.id; }).join(',');
        S.msgs = ms;
        if (S.msgs.length) S.lastChat = S.msgs[S.msgs.length - 1].id;
        if (full === true && had === S.msgs.map(function (m) { return m.id; }).join(',') && box && box.childElementCount) return;
        paintChat(!had, true);
        if (S.mode === 'ended' && S.recap && S.recap._local) paintRecap(S.recap = fallbackRecap());
        return;
      }
      var have = new Set(S.msgs.map(function (m) { return m.id; }));
      var add = ms.filter(function (m) { return !have.has(m.id); });
      if (!add.length) return;
      var box2 = document.getElementById('lp-msgs');
      var atBottom = box2 && nearBottom(box2);
      S.msgs = S.msgs.concat(add).slice(-300);
      S.lastChat = Math.max(S.lastChat, S.msgs[S.msgs.length - 1].id);
      if (!atBottom) S.unseen += add.filter(function (m) { return !(me && m.user && m.user.id === me.id); }).length;
      paintChat(false, true);
    } catch (_) {}
  }
  async function sendChat() {
    var inp = document.getElementById('lp-in'); if (!inp) return;
    var body = inp.value.trim(); if (!body) return;
    inp.value = '';
    try {
      var r = await api('/lp/' + id + '/chat', { method: 'POST', body: JSON.stringify({ body: body }) });
      if (!S.msgs.some(function (m) { return m.id === r.message.id; })) { S.msgs.push(r.message); S.lastChat = Math.max(S.lastChat, r.message.id); }
      paintChat(true);
    } catch (e) { if (!inp.value) inp.value = body; toast(e.message || 'couldnt send', 'error'); }
  }

  loadRoom(false);
  timers.push(setInterval(poll, 3000));
  timers.push(setInterval(tick, 500));
  timers.push(setInterval(function () { if (S.mode === 'wait') tickLobby(); if (S.mode === 'live') { var n = Date.now(); if (!S._tq || n - S._tq > 20000) { S._tq = n; renderUpNext(); refreshTimes(); } } }, 1000));
  timers.push(setInterval(function () { if (S.status !== 'ended') loadChat(false); }, 3000));
  timers.push(setInterval(function () { loadChat(true); }, 30000));
  timers.push(setInterval(function () { if (S.status !== 'ended' || !S.lp) loadRoom(true); }, 20000));
})();
</script>
