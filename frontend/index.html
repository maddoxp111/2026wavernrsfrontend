<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — home</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html" class="active">Home</a>
    <a href="/discover.html">Discover</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" id="nav-search" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q.length>=2)navigate('/search.html?q='+encodeURIComponent(q));}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="view">
<div class="container" style="padding-top:28px;">

  <!-- Quick access grid -->
  <div class="quick-grid" id="quick-grid">
    <!-- Populated by JS -->
  </div>

  <!-- New Releases section -->
  <div class="scroll-section">
    <div class="scroll-section-header">
      <span class="scroll-section-title">New Releases</span>
      <a href="/discover.html" class="scroll-section-link">Show all</a>
    </div>
    <div class="scroll-row" id="new-releases-row">
      <div class="loading" style="padding:20px;"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Trending section -->
  <div class="scroll-section">
    <div class="scroll-section-header">
      <span class="scroll-section-title">Trending</span>
      <a href="/discover.html?tab=trending" class="scroll-section-link">Show all</a>
    </div>
    <div class="scroll-row" id="trending-row">
      <div class="loading" style="padding:20px;"><div class="spinner"></div></div>
    </div>
  </div>


</div>
</div><!-- /view -->

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item active" style="text-decoration:none;">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg></span>
    <span>Discover</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
    <span>Dashboard</span>
  </a>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  updateNav();
  initPlayer();
  renderSiteBanners();

  async function loadHome() {
    try {
      const data = await api('/discover');
      const recent = data.recent || [];
      const trending = data.trending || [];

      renderQuickGrid(recent, trending);
      renderScrollRow('new-releases-row', recent);
      renderScrollRow('trending-row', trending);
    } catch (err) {
      document.getElementById('new-releases-row').innerHTML =
        `<div style="color:var(--text-tertiary);font-size:14px;padding:12px 0;">Failed to load.</div>`;
      document.getElementById('trending-row').innerHTML =
        `<div style="color:var(--text-tertiary);font-size:14px;padding:12px 0;">Failed to load.</div>`;
    }
  }

  function renderQuickGrid(recent, trending) {
    const el = document.getElementById('quick-grid');

    // Try recently played first
    let historyItems = [];
    try { historyItems = JSON.parse(localStorage.getItem('recently_played') || '[]'); } catch {}

    const combined = historyItems.length >= 4 ? historyItems : [...recent, ...trending];
    const seen = new Set();
    const unique = combined.filter(t => {
      if (!t || !t.id || seen.has(t.id)) return false;
      seen.add(t.id);
      return true;
    });
    const items = unique.slice(0, 8);

    if (!items.length) { el.style.display = 'none'; return; }

    // Add section label
    const label = historyItems.length >= 4 ? 'Recently Played' : 'Popular Right Now';
    el.insertAdjacentHTML('beforebegin', `<div style="font-size:20px;font-weight:700;margin-bottom:16px;">${label}</div>`);

    el.innerHTML = items.map(t => {
      const isAlbum = t._type === 'album';
      const coverHtml = t.cover_url
        ? `<img src="${t.cover_url}" alt="" onerror="this.style.display='none'">`
        : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--purple-bg);">🎵</div>`;
      const clickAction = isAlbum
        ? `navigate('/album.html?id=${t.id}')`
        : `playThis(${JSON.stringify(t).replace(/"/g,'&quot;')})`;
      return `
        <div class="quick-item" onclick="${clickAction}">
          <div class="quick-item-cover">${coverHtml}</div>
          <div class="quick-item-title">${escHtml(t.title)}</div>
        </div>`;
    }).join('');
  }

  function renderScrollRow(rowId, tracks) {
    const el = document.getElementById(rowId);
    if (!tracks.length) {
      el.innerHTML = `<div style="color:var(--text-tertiary);font-size:14px;padding:12px 0;">Nothing here yet.</div>`;
      return;
    }
    el.innerHTML = tracks.map(t => scrollCard(t)).join('');
  }

  function scrollCard(item) {
    const isAlbum = item._type === 'album';
    const coverHtml = item.cover_url ? `<img src="${item.cover_url}" alt="" onerror="this.style.display='none'">` : '';
    const clickAction = isAlbum
      ? `navigate('/album.html?id=${item.id}')`
      : `openTrack('${item.id}')`;
    return `
      <div class="scroll-card" onclick="${clickAction}" style="cursor:pointer;">
        <div class="scroll-card-cover">
          ${coverHtml}
          ${isAlbum ? `<div style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.65);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:0.05em;">COMP</div>` : `
          <div class="scroll-card-overlay">
            <button class="play-btn-overlay" onclick="event.stopPropagation();playThis(${JSON.stringify(item).replace(/"/g,'&quot;')})">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--purple)"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>`}
        </div>
        <div class="scroll-card-title">${escHtml(item.title)}</div>
        <div class="scroll-card-sub">${escHtml(item.artists?.display_name || 'Unknown')}</div>
      </div>`;
  }

  function playThis(track) {
    playTrack({ ...track, artist_name: track.artists?.display_name });
  }

  function openTrack(id) {
    navigate(`/track.html?id=${id}`);
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadHome();
</script>
</body>
</html>
