<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs</title>
  <link rel="stylesheet" href="/css/style.css?v=202609051824">
</head>
<body>
<div id="view">
  <div class="wv-home-chips"><span class="wv-skel" style="width:60px;height:32px;border-radius:999px;"></span><span class="wv-skel" style="width:80px;height:32px;border-radius:999px;"></span><span class="wv-skel" style="width:70px;height:32px;border-radius:999px;"></span></div>
  <div class="wv-quick-grid">
    <div class="wv-skel" style="height:56px;"></div><div class="wv-skel" style="height:56px;"></div><div class="wv-skel" style="height:56px;"></div><div class="wv-skel" style="height:56px;"></div>
  </div>
  <div class="wv-sec-head"><span class="wv-skel" style="width:180px;height:24px;"></span></div>
  <div class="wv-rail">
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
  </div>
</div>

<script src="/js/api.js?v=202609051824"></script>
<script src="/js/layout.js?v=202609051824"></script>
<script src="/js/player.js?v=202609051824"></script>
<script src="/js/router.js?v=202609051824"></script>
<script src="/js/playlists.js?v=202609051824"></script>
<script>
initPlayer();

// ── State ──────────────────────────────────────────────────────
var _home = { recent: [], trending: [], highlighted: [], charts: null, archive: [] };
var _homeFilter = 'all';      // all | comps | edits
var _badges = { verified_artists: [], highlighted_albums: [], exclusive_albums: [], highlighted_tracks: [], exclusive_tracks: [] };
var _allItems = {};           // id -> item, for play buttons

function _greeting() {
  var h = new Date().getHours();
  return h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}
function _recentPlayed() {
  try { return JSON.parse(localStorage.getItem('recently_played') || '[]'); } catch (e) { return []; }
}
function _filterItems(items) {
  if (_homeFilter === 'comps') return items.filter(function(i) { return i._type === 'album'; });
  if (_homeFilter === 'edits') return items.filter(function(i) { return i._type !== 'album'; });
  return items;
}

// ── Load ───────────────────────────────────────────────────────
async function loadHome() {
  try {
    var r = await Promise.all([
      api('/discover'),
      api('/discover/trending').catch(function() { return []; }),
      api('/discover/highlighted').catch(function() { return []; }),
      api('/charts').catch(function() { return null; }),
      api('/archive?limit=12').catch(function() { return null; }),
      getBadgeData().catch(function() { return null; }),
    ]);
    _home.recent = (r[0] && r[0].recent) || [];
    _home.trending = Array.isArray(r[1]) ? r[1] : [];
    _home.highlighted = Array.isArray(r[2]) ? r[2] : [];
    _home.charts = r[3];
    _home.archive = r[4] ? (Array.isArray(r[4]) ? r[4] : (r[4].items || [])) : [];
    _badges = r[5] || _badges;
    [].concat(_home.recent, _home.trending, _home.highlighted, _home.archive).forEach(function(i) { if (i && i.id) _allItems[i.id] = i; });
    renderHome();
  } catch (err) {
    document.getElementById('view').innerHTML = '<div class="wv-empty">Failed to load: ' + escHtml(String(err.message)) + '</div>';
  }
}

// ── Render ─────────────────────────────────────────────────────
function renderHome() {
  var view = document.getElementById('view');
  var recent = _recentPlayed().filter(function(t) { return t.id; });
  var user = null; try { user = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) {}

  // Wash from what you played last, else the newest comp.
  var washFrom = (recent[0] && recent[0].cover_url) || ((_home.recent.find(function(i) { return i.cover_url; }) || {}).cover_url) || '';
  if (typeof window.setPageBgImage === 'function') window.setPageBgImage(washFrom, washFrom || 'wavernrs');

  var html = '';
  html += '<h1 class="wv-page-title" style="margin-bottom:12px;">' + _greeting() + (user && user.username ? ', ' + escHtml(user.display_name || user.username) : '') + '</h1>';
  html += '<div class="wv-home-chips">' +
    chip('all', 'All') + chip('comps', 'Comps') + chip('edits', 'Edits') +
    '<span class="wv-chip" onclick="navigate(\'/archive.html\')">Archive</span>' +
    '</div>';

  // Jump back in — dense 2×4 tile grid, first screen
  if (recent.length) {
    html += '<div class="wv-quick-grid">' + recent.slice(0, 8).map(function(t, i) {
      var href = t._type === 'album' ? '/album.html?id=' + t.id : '/track.html?id=' + t.id;
      return '<div class="wv-quick-item" onclick="navigate(\'' + href + '\')">' +
        '<div class="wv-quick-cover" style="background:' + coverGradient(t.title || '') + ';">' +
          (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" loading="lazy" onerror="this.remove()">' : '') +
        '</div>' +
        '<div class="wv-quick-title">' + escHtml(t.title || '') + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  var newComps = _home.recent.filter(function(i) { return i._type === 'album'; });
  var newEdits = _home.recent.filter(function(i) { return i._type !== 'album'; });

  html += rail('Made for you', _filterItems(_home.highlighted), '/browse.html?tab=highlighted');
  html += rail('Trending now', _filterItems(_home.trending), '/charts.html');
  if (_homeFilter !== 'edits') html += rail('New comps', newComps, '/browse.html?tab=recent');
  if (_homeFilter !== 'comps') html += rail('New edits', newEdits, '/browse.html?tab=recent');
  html += chartsBlock();
  html += rail('From the archive', _home.archive.map(function(a) { return Object.assign({}, a, { _type: 'album', _archive: true }); }), '/archive.html');
  html += rail('Recently played', recent.slice(0, 20).map(function(t) {
    return { id: t.id, _type: t._type, title: t.title, cover_url: t.cover_url, ia_url: t.ia_url, artists: { display_name: t.artist_name } };
  }), '/library.html');

  view.innerHTML = html;
}

function chip(k, label) {
  return '<span class="wv-chip' + (_homeFilter === k ? ' acc' : '') + '" onclick="setHomeFilter(\'' + k + '\')">' + label + '</span>';
}
window.setHomeFilter = function(k) { _homeFilter = k; renderHome(); };

function rail(title, items, href) {
  if (!items || !items.length) return '';
  return '<div class="home-section">' +
    '<div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'' + href + '\')">' + escHtml(title) + '</h2>' +
      '<button class="wv-see-all" onclick="navigate(\'' + href + '\')">Show all</button></div>' +
    '<div class="wv-rail">' + items.slice(0, 20).map(compCardHTML).join('') + '</div>' +
  '</div>';
}

function compCardHTML(item) {
  var isAlbum = item._type === 'album';
  var artist = item._archive ? (item.archive_artist_name || item.artist_name || 'Archive')
             : (item.artists ? (item.artists.display_name || '') : (item.artist_name || 'Unknown'));
  var artistId = item.artists ? item.artists.id : null;
  var href = isAlbum ? '/album.html?id=' + item.id : '/track.html?id=' + item.id;
  var b = _badges || {};
  var isVerified = artistId && (b.verified_artists || []).indexOf(artistId) !== -1;
  var isHighlighted = isAlbum ? (b.highlighted_albums || []).indexOf(item.id) !== -1 : (b.highlighted_tracks || []).indexOf(item.id) !== -1;
  var isExclusive   = isAlbum ? (b.exclusive_albums || []).indexOf(item.id) !== -1   : (b.exclusive_tracks || []).indexOf(item.id) !== -1;
  var badges = (isHighlighted ? '<span class="wv-badge-hl-icon" title="Highlighted">★</span>' : '') +
               (isExclusive ? '<span class="wv-badge-ex-icon" title="Exclusive">◆</span>' : '');
  var sub = (isAlbum ? 'Comp' : 'Edit') + ' · ' + escHtml(artist) + (isVerified ? '<span class="wv-verified-icon" title="Verified">✓</span>' : '');
  _allItems[item.id] = _allItems[item.id] || item;
  return '<div class="wv-comp-card" onclick="navigate(\'' + href + '\')">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + coverGradient(item.title || '') + ';">' +
      (item.cover_url ? '<img src="' + escHtml(item.cover_url) + '" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">' : '') +
      '<button class="wv-cover-play-btn" aria-label="Play" onclick="event.stopPropagation();playItem(\'' + item.id + '\')">' +
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg></button>' +
    '</div></div>' +
    '<div class="wv-comp-card-title">' + escHtml(item.title || '') + badges + '</div>' +
    '<div class="wv-comp-card-artist">' + sub + '</div>' +
  '</div>';
}

window.playItem = function(id) {
  var item = _allItems[id];
  if (!item) return;
  if (item._type === 'album') { navigate('/album.html?id=' + id + '&play=1'); return; }
  if (!item.ia_url) { navigate('/track.html?id=' + id); return; }
  playTrack({ id: item.id, title: item.title, artist_name: item.artists ? item.artists.display_name : (item.artist_name || ''), ia_url: item.ia_url, cover_url: item.cover_url });
};

// Top charts as a compact two-column list — numbers first, like a chart.
function chartsBlock() {
  var c = _home.charts; if (!c) return '';
  var edits = (c.edits || c).alltime || [];
  var comps = (c.comps || {}).alltime || [];
  if (!edits.length && !comps.length) return '';
  function col(title, list, kind) {
    if (!list.length) return '';
    var top = list.slice().sort(function(a, b) { return (b.play_count || 0) - (a.play_count || 0); }).slice(0, 5);
    return '<div><div class="wv-colhead">' + title + '</div>' + top.map(function(t, i) {
      var href = kind === 'comp' ? '/album.html?id=' + t.id : '/track.html?id=' + t.id;
      var artist = t.artists ? t.artists.display_name : (t.archive_artist_name || '');
      return '<div class="wv-trow" onclick="navigate(\'' + href + '\')">' +
        '<div class="wv-trow-num">' + (i + 1) + '</div>' +
        '<div class="wv-trow-art" style="background:' + coverGradient(t.title || '') + ';">' + (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="wv-trow-main"><div class="wv-trow-title">' + escHtml(t.title || '') + '</div><div class="wv-trow-sub">' + escHtml(artist || '') + '</div></div>' +
        '<div class="wv-trow-dur">' + fmtNum(t.play_count || 0) + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }
  return '<div class="home-section">' +
    '<div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'/charts.html\')">Top charts</h2><button class="wv-see-all" onclick="navigate(\'/charts.html\')">Show all</button></div>' +
    '<div class="wv-cols2">' + col('Edits · all time', edits, 'edit') + col('Comps · all time', comps, 'comp') + '</div>' +
  '</div>';
}

loadHome();
</script>
</body>
</html>
