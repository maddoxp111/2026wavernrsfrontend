  <style>
    /* ── Home: motion ───────────────────────────────────────── */
    .hm-in { animation: hmIn 220ms var(--ease) both; }
    @keyframes hmIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .hm-rv { opacity: 0; transform: translateY(16px); }
    .hm-rv-go { transition: opacity 460ms var(--ease), transform 460ms var(--ease); }
    .hm-slot:empty:not([data-lazy]) { display: none; }

    /* Links that used to be clickable divs keep their look. */
    #view a.wv-comp-card, #view a.wv-quick-item, #view a.scroll-card, #view a.wv-otd-tw,
    #view a.wv-era-chip, #view a.wv-trow { color: inherit; text-decoration: none; }
    #view a.wv-comp-card, #view a.scroll-card { display: block; }
    #view .wv-sec-title a { color: inherit; text-decoration: none; }
    #view a.wv-see-all { text-decoration: none; }
    #view a.wv-see-all:hover { text-decoration: underline; }
    #view .wv-home-chips button.wv-chip, #view .wv-home-chips a.wv-chip { border: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none; }
    #view .wv-home-chips .wv-chip.acc { color: var(--page-bg-base); }
    #view .wv-home-chips .hm-chip-ic { display: inline-flex; align-items: center; gap: 6px; }
    #view .wv-home-chips .hm-chip-ic svg { width: 14px; height: 14px; }

    /* ── Spotlight hero ─────────────────────────────────────── */
    #hm-hero:not(:empty) { margin: 0 0 22px; }
    .hx { position: relative; border-radius: 16px; overflow: hidden; isolation: isolate;
      background: var(--surface); touch-action: pan-y; box-shadow: 0 1px 0 var(--hair) inset; }
    .hx:focus { outline: none; }
    .hx:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    .hx-stage { display: grid; }
    .hx-slide { grid-area: 1 / 1; position: relative; opacity: 0; visibility: hidden; z-index: 0;
      transition: opacity 650ms var(--ease), visibility 0s linear 650ms;
      --hx1: var(--brand); --hx2: var(--pink); }
    .hx-slide.on { opacity: 1; visibility: visible; z-index: 1; transition: opacity 650ms var(--ease), visibility 0s; }
    .hx-bg { position: absolute; inset: 0; overflow: hidden; background: var(--surface-2); }
    .hx-bg img { position: absolute; left: -15%; top: -35%; width: 130%; height: 170%; object-fit: cover;
      filter: blur(38px) saturate(1.5); opacity: .85; transform: scale(1.06); transition: transform 7s linear; }
    .hx-slide.on .hx-bg img { transform: scale(1.14); }
    .hx-wash { position: absolute; inset: 0;
      background: radial-gradient(70% 120% at 12% 10%, color-mix(in srgb, var(--hx1) 55%, transparent), transparent 70%),
                  radial-gradient(60% 110% at 100% 100%, color-mix(in srgb, var(--hx2) 45%, transparent), transparent 70%); opacity: .75; }
    .hx-scrim { position: absolute; inset: 0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--page-bg-base) 82%, transparent) 0%,
                                          color-mix(in srgb, var(--page-bg-base) 58%, transparent) 48%,
                                          color-mix(in srgb, var(--page-bg-base) 30%, transparent) 100%); }
    .hx-in { position: relative; display: grid; grid-template-columns: 236px minmax(0, 1fr);
      grid-template-rows: 1fr auto auto 1fr; grid-template-areas: "art ." "art head" "art act" "art .";
      column-gap: 30px; padding: 30px 34px; min-height: 296px; box-sizing: border-box; }
    .hx-art { grid-area: art; align-self: center; display: block; width: 236px; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
      position: relative; box-shadow: 0 22px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
      transform: scale(.94) translateY(6px); transition: transform 800ms var(--ease); }
    .hx-slide.on .hx-art { transform: none; }
    .hx-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .hx-head { grid-area: head; min-width: 0; opacity: 0; transform: translateX(18px);
      transition: opacity 600ms var(--ease) 120ms, transform 700ms var(--ease) 120ms; }
    .hx-act { grid-area: act; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; opacity: 0; transform: translateX(18px);
      transition: opacity 600ms var(--ease) 200ms, transform 700ms var(--ease) 200ms; }
    .hx-slide.on .hx-head, .hx-slide.on .hx-act { opacity: 1; transform: none; }
    .hx-kind { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .09em;
      text-transform: uppercase; padding: 5px 11px 5px 9px; border-radius: 99px; color: var(--text);
      background: color-mix(in srgb, var(--text) 11%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 10%, transparent) inset; }
    .hx-kind svg { width: 13px; height: 13px; color: var(--hx-kc, var(--brand)); }
    .hx-kind.k-new svg { color: var(--green); }
    .hx-kind.k-award svg { color: var(--yellow); }
    .hx-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
      font-size: clamp(28px, 3.5vw, 50px); font-weight: 900; letter-spacing: -.04em; line-height: 1.02;
      margin: 14px 0 10px; color: var(--text); text-decoration: none; }
    a.hx-title:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .hx-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 14px; color: var(--text-2); }
    .hx-meta b { color: var(--text); font-weight: 700; }
    .hx-meta .dot { opacity: .5; }
    .hx-av { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; flex: none; position: relative; }
    .hx-av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hx-desc { font-size: 13.5px; line-height: 1.5; color: var(--text-2); margin-top: 10px; max-width: 560px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .hx-play, .hx-open { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 99px;
      font: inherit; font-size: 14.5px; font-weight: 800; cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: transform 120ms var(--ease), filter 120ms var(--ease), background 120ms var(--ease); }
    .hx-play { padding: 0 24px 0 18px; border: 0; background: var(--brand); color: var(--on-brand);
      box-shadow: 0 10px 26px color-mix(in srgb, var(--brand) 38%, transparent); }
    .hx-play svg { width: 18px; height: 18px; }
    .hx-play:hover { filter: brightness(1.07); transform: scale(1.03); }
    .hx-play:active { transform: scale(.98); }
    .hx-open { padding: 0 20px; color: var(--text); background: color-mix(in srgb, var(--text) 9%, transparent);
      border: 1px solid color-mix(in srgb, var(--text) 20%, transparent); }
    .hx-open:hover { background: color-mix(in srgb, var(--text) 15%, transparent); }
    .hx-ctl { position: absolute; right: 18px; bottom: 16px; z-index: 3; display: flex; align-items: center; gap: 2px; }
    .hx-dots { display: flex; align-items: center; }
    .hx-dot { width: 22px; height: 40px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: width 350ms var(--ease); }
    .hx-dot i { display: block; position: relative; width: 7px; height: 7px; border-radius: 99px; overflow: hidden;
      background: color-mix(in srgb, var(--text) 32%, transparent); transition: width 350ms var(--ease), background 200ms; }
    .hx-dot:hover i { background: color-mix(in srgb, var(--text) 60%, transparent); }
    .hx-dot.on { width: 40px; }
    .hx-dot.on i { width: 28px; background: color-mix(in srgb, var(--text) 26%, transparent); }
    .hx-dot i b { position: absolute; inset: 0; border-radius: inherit; background: var(--text); transform-origin: left center; transform: scaleX(0); }
    .hx-dot.on i b { animation: hxFill 7s linear forwards; }
    .hx.is-paused .hx-dot.on i b { animation-play-state: paused; }
    .hx.no-auto .hx-dot.on i b { animation: none; transform: none; }
    @keyframes hxFill { to { transform: scaleX(1); } }
    .hx-arrow { width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: none; align-items: center; justify-content: center;
      color: var(--text); background: color-mix(in srgb, var(--text) 10%, transparent); margin-left: 6px; transition: background 120ms var(--ease); }
    .hx-arrow:hover { background: color-mix(in srgb, var(--text) 18%, transparent); }
    .hx-arrow svg { width: 18px; height: 18px; }
    @media (hover: hover) and (pointer: fine) { .hx-arrow { display: inline-flex; } }
    .hx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .hx-skel .hx-in { min-height: 296px; }
    .hx-skel .hx-art { transform: none; box-shadow: none; }
    .hx-skel .hx-head, .hx-skel .hx-act { opacity: 1; transform: none; }
    .hx-skel .l { height: 14px; border-radius: 99px; margin-bottom: 12px; }

    @media (max-width: 640px) {
      .hx { border-radius: 14px; }
      #hm-hero:not(:empty) { margin-bottom: 16px; }
      .hx-in { grid-template-columns: 112px minmax(0, 1fr); grid-template-rows: auto auto; grid-template-areas: "art head" "act act";
        column-gap: 16px; padding: 18px 16px 38px; min-height: 0; align-items: center; }
      .hx-art { width: 112px; border-radius: 8px; }
      .hx-title { font-size: 23px; margin: 9px 0 6px; letter-spacing: -.03em; }
      .hx-meta { font-size: 12.5px; }
      .hx-av { display: none; }
      .hx-desc { display: none; }
      .hx-kind { font-size: 10px; padding: 4px 9px 4px 8px; }
      .hx-act { margin-top: 16px; gap: 8px; flex-wrap: nowrap; }
      .hx-act > * { flex: 1 1 0; min-width: 0; }
      .hx-play, .hx-open { height: 42px; font-size: 14px; }
      .hx-play { padding: 0 18px 0 14px; }
      .hx-open { padding: 0 16px; }
      .hx-ctl { left: 0; right: 0; bottom: 0; justify-content: center; }
      .hx-dot { height: 36px; }
      .hx-arrow { display: none; }
      .hx-dot { width: 16px; }
      .hx-dot.on { width: 34px; }
      .hx-dot i { width: 6px; height: 6px; }
      .hx-dot.on i { width: 24px; }
      .hx-skel .hx-in { min-height: 226px; }
    }

    /* ── Logged-out welcome strip ───────────────────────────── */
    .hw { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 8px 8px 16px; margin: 2px 0 14px;
      border-radius: 12px; background: var(--surface); border: 1px solid var(--hair); }
    .hw-txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; color: var(--text-2); }
    .hw-txt b { color: var(--text); font-weight: 700; }
    .hw-live { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
    .hw-live[hidden] { display: none; }
    .hw-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .hw-cta { display: flex; align-items: center; gap: 6px; flex: none; }
    .hw-btn { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 99px; font-size: 13.5px; font-weight: 700;
      text-decoration: none; color: var(--text); background: color-mix(in srgb, var(--text) 9%, transparent); white-space: nowrap; }
    .hw-btn:hover { background: color-mix(in srgb, var(--text) 14%, transparent); }
    .hw-btn.pri { background: var(--text); color: var(--page-bg-base); }
    .hw-btn.pri:hover { filter: brightness(.94); }
    .hw-x { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--text-3); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .hw-x:hover { background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); }
    @media (max-width: 640px) {
      .hw { flex-wrap: wrap; gap: 10px; padding: 12px 8px 10px 14px; position: relative; }
      .hw-txt { flex: 1 1 100%; padding-right: 34px; font-size: 13.5px; }
      .hw-live { display: flex; margin: 4px 0 0; }
      .hw-cta { flex: 1 1 100%; }
      .hw-cta .hw-btn { flex: 1; justify-content: center; height: 40px; }
      .hw-x { position: absolute; top: 6px; right: 6px; }
    }

    /* ── Quick grid play buttons ────────────────────────────── */
    #view .wv-quick-item { position: relative; }
    .hm-qplay { position: absolute; right: 8px; top: 50%; width: 34px; height: 34px; margin-top: -17px; border-radius: 50%; border: 0; padding: 0;
      display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--brand); color: var(--on-brand);
      box-shadow: 0 6px 14px rgba(0,0,0,.3); opacity: 0; transform: scale(.85); transition: opacity 160ms var(--ease), transform 160ms var(--ease); }
    .hm-qplay svg { width: 15px; height: 15px; }
    #view .wv-quick-item:hover .hm-qplay, .hm-qplay:focus-visible { opacity: 1; transform: none; }
    #view .wv-quick-item:hover .wv-quick-title { padding-right: 50px; }
    @media (hover: none), (max-width: 640px) { .hm-qplay { display: none; } }

    /* ── Recap + Hall of Fame ───────────────────────────────── */
    .hm-promo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px 0 4px; }
    .hm-pr { position: relative; display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 14px 16px; border-radius: 14px; overflow: hidden;
      text-decoration: none; color: var(--text); transition: transform 160ms var(--ease), filter 160ms var(--ease); }
    .hm-pr:hover { filter: brightness(1.06); }
    .hm-pr.recap { background: linear-gradient(120deg, color-mix(in srgb, var(--brand) 34%, var(--surface)) 0%, color-mix(in srgb, var(--pink) 16%, var(--surface)) 100%); }
    .hm-pr.hof { background: linear-gradient(120deg, color-mix(in srgb, var(--yellow) 26%, var(--surface)) 0%, color-mix(in srgb, var(--orange) 12%, var(--surface)) 100%); }
    .hm-pr-ic { width: 46px; height: 46px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--text) 10%, transparent); }
    .hm-pr.recap .hm-pr-ic { color: var(--brand); }
    .hm-pr.hof .hm-pr-ic { color: var(--yellow); }
    .hm-pr-ic svg { width: 24px; height: 24px; }
    .hm-pr-t { min-width: 0; flex: 1; }
    .hm-pr-t b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.015em; }
    .hm-pr-t small { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }
    .hm-pr-go { flex: none; width: 20px; height: 20px; color: var(--text-3); transition: transform 160ms var(--ease), color 160ms var(--ease); }
    .hm-pr:hover .hm-pr-go { transform: translateX(3px); color: var(--text); }
    @media (max-width: 640px) {
      .hm-promo { gap: 8px; }
      .hm-pr { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; }
      .hm-pr-ic { width: 40px; height: 40px; border-radius: 10px; }
      .hm-pr-ic svg { width: 21px; height: 21px; }
      .hm-pr-go { display: none; }
      .hm-pr-t b { font-size: 15px; }
    }

    /* ── Section loading + errors ───────────────────────────── */
    .hm-skrail { display: grid; grid-auto-flow: column; grid-auto-columns: 184px; margin: 0 -12px; overflow: hidden; }
    .hm-skstrip { display: flex; gap: 10px; overflow: hidden; margin-bottom: 10px; }
    .hm-skstrip .wv-skel { flex: none; width: 150px; height: 52px; border-radius: 10px; }
    .hm-sklist { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
    .hm-sklist .r { display: flex; align-items: center; gap: 12px; padding: 9px 10px; }
    .hm-sklist .r .wv-skel:first-child { width: 38px; height: 38px; flex: none; }
    @media (max-width: 860px) { .hm-sklist { grid-template-columns: 1fr; gap: 0; } .hm-sklist > div + div { display: none; } }
    @media (max-width: 640px) { .hm-skrail { grid-auto-columns: 148px; margin: 0 -8px; } }
    .hm-err { display: flex; align-items: center; gap: 12px; margin: 22px 0 6px; padding: 10px 10px 10px 14px; border-radius: 12px;
      background: var(--surface-2); font-size: 13.5px; color: var(--text-2); }
    .hm-err svg { width: 18px; height: 18px; flex: none; color: var(--text-3); }
    .hm-err span { flex: 1; min-width: 0; }
    .hm-err b { color: var(--text); font-weight: 700; }
    .hm-retry { flex: none; height: 40px; padding: 0 16px; border-radius: 99px; border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
      background: var(--surface-3); color: var(--text); }
    .hm-retry:hover { background: var(--surface-hover); filter: brightness(1.15); }

    @media (prefers-reduced-motion: reduce) {
      .hm-in { animation: none; }
      .hm-rv { opacity: 1; transform: none; }
      .hx-slide, .hx-slide.on, .hx-art, .hx-head, .hx-act, .hx-bg img { transition: none; }
      .hx-slide.on .hx-bg img { transform: scale(1.06); }
      #view .wv-skel::after { animation: none; }
    }
  </style>
</head>

<script>
initPlayer();

// ── State ──────────────────────────────────────────────────────
// Every section loads on its own: _hData holds each source's response,
// _hState its status (loading | ok | err). Slots redraw from this cache, so
// switching filters never refetches.
window._homeGen = (window._homeGen || 0) + 1;
var _home = { recent: [], trending: [], highlighted: [], charts: null, archive: [], justAdded: [], eras: [], playlists: [], awards: [] };
var _homeFilter = 'all';      // all | comps | edits

    '<div class="scroll-row">' + items.map(function (e) {
      var a = e.album, art = a.cover_url ? _hImg(a.cover_url, 320) : '';
      return '<a class="scroll-card" href="' + _hEsc('/album?id=' + encodeURIComponent(a.id)) + '" style="flex-shrink:0;width:150px;">' +
        '<div class="scroll-card-cover" style="background:' + coverGradient(a.title || '') + ';">' + (art ? '<img src="' + _hEsc(art) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="scroll-card-title">' + _hEsc(e.n || a.title) + '</div>' +
        '<div class="scroll-card-sub">' + _hEsc([e.c, e.era].filter(Boolean).join(' · ')) + '</div></a>';
    }).join('') + '</div></div>';
  _hAnimateIn(el);
}

// A one-time heads up about new corners of the site. Dismissed for good once closed.
var WV_NEWS = { id: 'ye-archive-2026-09-28b', items: [
  ['On this day', 'what ye tweeted, dropped and leaked on this date', '/resources?view=today'],
  ['Discography', 'producers, samples and previews for every album', '/resources?view=disco'],
  ['Song pages', 'every version of a song, leaks, credits and live shows', '/resources?view=song&t=Runaway'],
  ['Timeline', 'ye year by year', '/resources?view=timeline'],
] };
function newsCard() {
  try { if (localStorage.getItem('wv_news_seen') === WV_NEWS.id) return ''; } catch (_) { return ''; }
  return '<div class="wv-news" id="wv-news"><div class="wv-news-h"><b>new on wavernrs</b><button onclick="closeNews()" aria-label="dismiss">✕</button></div><div class="wv-news-row">' +
    WV_NEWS.items.map(function (x) { return '<a href="' + x[2] + '" onclick="closeNews(true);navigate(this.getAttribute(\'href\'));return false;"><b>' + escHtml(x[0]) + '</b><span>' + escHtml(x[1]) + '</span></a>'; }).join('') + '</div></div>';
}
window.closeNews = function (keepVisible) {
  try { localStorage.setItem('wv_news_seen', WV_NEWS.id); } catch (_) {}
  if (!keepVisible) { var el = document.getElementById('wv-news'); if (el) el.remove(); }
};

// Live listening parties go right at the top so people actually find them.
var _lpCache = { at: 0, live: [] };
async function fillLiveLps() {
  try {
    if (Date.now() - _lpCache.at > 60000) {
      var d = await api('/lp');
      _lpCache = { at: Date.now(), live: (d && d.live) || [] };
    }
  } catch (_) { return; }
  var el = document.getElementById('home-lp');
  if (!el || !_lpCache.live.length) return;
  el.innerHTML = _lpCache.live.slice(0, 2).map(function (l) {
    var np = l.now_playing, href = '/lp?id=' + encodeURIComponent(l.id);
    var art = np && np.cover_url ? _hImg(np.cover_url, 160) : '';
    return '<a class="wv-home-lp" href="' + _hEsc(href) + '">' +
      '<div class="wv-home-lp-art" style="background:' + coverGradient(l.title || '') + ';">' + (art ? '<img src="' + _hEsc(art) + '" alt="" onerror="this.remove()">' : '') + '</div>' +
      '<div class="wv-home-lp-i"><div class="wv-home-lp-k"><span class="wv-home-lp-dot"></span>' + (l.paused ? 'PAUSED' : 'LIVE NOW') + ' · ' + _hEsc(l.listeners || 0) + ' listening</div>' +
      '<div class="wv-home-lp-t">' + _hEsc(l.title) + '</div>' +
      '<div class="wv-home-lp-s">hosted by ' + _hEsc((l.host && l.host.name) || 'someone') + (np ? ' · ♪ ' + _hEsc(np.title) : '') + '</div></div>' +
      '<span class="wv-home-lp-go">Join</span></a>';
  }).join('');
  _hAnimateIn(el);
}

// A quick way into the archive by era, using the covers we already have.
function eraStrip() {
  var eras = (_home.eras || []).filter(function (e) { return (e.total || 0) > 0; });
  if (eras.length < 4) return '';
  eras = eras.slice().sort(function (a, b) { return (b.total || 0) - (a.total || 0); }).slice(0, 14);
  return '<div class="home-section">' + _secHead('Browse by era', '/eras') +
    '<div class="wv-era-strip">' + eras.map(function (e) {
      var n = (e.total || 0).toLocaleString();
      return '<a class="wv-era-chip" href="' + _hEsc('/archive?era=' + encodeURIComponent(e.id)) + '">' +
        '<div class="wv-era-chip-cover" style="background:' + coverGradient(e.name || '') + ';">' +
          (e.cover ? '<img src="' + _hEsc(_hImg(e.cover, 96)) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
        '</div>' +
        '<div class="wv-era-chip-text"><b>' + _hEsc(e.name) + '</b><span>' + _hEsc(n) + '</span></div>' +
      '</a>';
    }).join('') + '</div></div>';
}

// One click from the home page into something nobody was looking for.
window.homeSurprise = async function () {
  try {
    if (typeof wvToast === 'function') wvToast('finding something...');
    var r = await api('/archive/random?n=1');
    var pick = r && r.items && r.items[0];
    if (!pick) { if (typeof wvToast === 'function') wvToast('couldnt pick one rn...try again', 'error'); return; }
    if (typeof wvToast === 'function') wvToast('playing ' + pick.title);
    playCompById(pick.id, { album: pick, quiet: true });
  } catch (_) { if (typeof wvToast === 'function') wvToast('couldnt pick one rn...try again', 'error'); }
};

// Staff picks for the week: Edit, Comp, Album and Yeditor of the Week.
var AWARD_SHORT = { edit: 'EOTW', comp: 'COTW', album: 'AOTW', yeditor: 'YOTW' };
function awardsBlock() {
  var picks = (_home.awards || []).filter(function(p) { return p.album || p.editor; });
  if (!picks.length || _homeFilter !== 'all') return '';
  var wk = picks[0].week ? new Date(picks[0].week + 'T12:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  return '<div class="home-section">' +
    '<div class="wv-sec-head"><h2 class="wv-sec-title"><a href="/awards">This week\'s picks</a></h2>' + (wk ? '<span class="wv-otw-week">Week of ' + _hEsc(wk) + '</span>' : '') + '</div>' +
    '<div class="wv-otw-grid">' + picks.map(function(p) {
      var chip = '<span class="wv-otw-chip wv-otw-' + _hEsc(p.category) + '">' + _hEsc(AWARD_SHORT[p.category] || '') + '</span>';
      if (p.editor) {
        var slug = typeof archiveArtistSlug === 'function' ? archiveArtistSlug(p.editor.name) : p.editor.name;
        var href = '/archive-artist?a=' + encodeURIComponent(slug);
        return '<a class="wv-otw-card" href="' + _hEsc(href) + '">' +
          '<div class="wv-otw-art wv-otw-person" style="background:' + coverGradient(p.editor.name) + ';"><span>' + _hEsc((p.editor.name || '?').charAt(0).toUpperCase()) + '</span></div>' +
          '<div class="wv-otw-body">' + chip + '<div class="wv-otw-label">' + _hEsc(p.label) + '</div>' +
          '<div class="wv-otw-title">' + _hEsc(p.editor.name) + '</div>' +
          (p.note ? '<div class="wv-otw-note">' + _hEsc(p.note) + '</div>' : '') + '</div></a>';
      }
      var a = p.album, href2 = '/album?id=' + encodeURIComponent(a.id);
      return '<a class="wv-otw-card" href="' + _hEsc(href2) + '">' +
        '<div class="wv-otw-art" style="background:' + coverGradient(a.title || '') + ';">' + (a.cover_url ? '<img src="' + _hEsc(_hImg(a.cover_url, 300)) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="wv-otw-body">' + chip + '<div class="wv-otw-label">' + _hEsc(p.label) + '</div>' +
        '<div class="wv-otw-title">' + _hEsc(a.title || '') + '</div>' +
        '<div class="wv-otw-sub">' + _hEsc(a.creator || '') + '</div>' +
        (p.note ? '<div class="wv-otw-note">' + _hEsc(p.note) + '</div>' : '') + '</div></a>';
    }).join('') + '</div>' +
  '</div>';
}

// Published playlists from the community. Hidden until there are any, and
// under the Comps and Edits filters.
function playlistRail() {
  var items = _home.playlists || [];
  if (!items.length || _homeFilter !== 'all' || typeof window.wvPlaylistCardHTML !== 'function') return '';
  return '<div class="home-section">' + _secHead('Community playlists', '/playlists') +
    '<div class="wv-rail">' + items.map(window.wvPlaylistCardHTML).join('') + '</div>' +
  '</div>';
}

function rail(title, items, href) {
  if (!items || !items.length) return '';
  return '<div class="home-section">' + _secHead(title, href) +
    '<div class="wv-rail">' + items.slice(0, 20).map(compCardHTML).join('') + '</div>' +
  '</div>';
}

function compCardHTML(item) {
  var isAlbum = item._type === 'album';
  var artist = item._archive ? (item.archive_artist_name || item.artist_name || (item.artists && item.artists.display_name) || 'Archive')
             : (item.artists ? (item.artists.display_name || '') : (item.artist_name || 'Unknown'));
  var artistId = item.artists ? item.artists.id : null;
  var href = _hrefFor(item);
  var b = _badges || {};
  var isVerified = artistId && (b.verified_artists || []).indexOf(artistId) !== -1;
  var isHighlighted = isAlbum ? (b.highlighted_albums || []).indexOf(item.id) !== -1 : (b.highlighted_tracks || []).indexOf(item.id) !== -1;
  var isExclusive   = isAlbum ? (b.exclusive_albums || []).indexOf(item.id) !== -1   : (b.exclusive_tracks || []).indexOf(item.id) !== -1;
  var badges = (isHighlighted ? '<span class="wv-badge-hl-icon" title="Highlighted">★</span>' : '') +
               (isExclusive ? '<span class="wv-badge-ex-icon" title="Exclusive">◆</span>' : '');
  var sub = (isAlbum ? 'Comp' : 'Edit') + ' · ' + _hEsc(artist) + (isVerified ? '<span class="wv-verified-icon" title="Verified">✓</span>' : '');
  _allItems[item.id] = _allItems[item.id] || item;
  return '<a class="wv-comp-card" href="' + _hEsc(href) + '">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + coverGradient(item.title || '') + ';">' +
      (item.cover_url ? '<img src="' + _hEsc(_hImg(item.cover_url, 320)) + '" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">' : '') +
      '<button type="button" class="wv-cover-play-btn" data-play="' + _hEsc(item.id) + '" aria-label="Play ' + _hEsc(item.title || '') + '">' +
        '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg></button>' +
    '</div></div>' +
    '<div class="wv-comp-card-title">' + _hEsc(item.title || '') + badges + '</div>' +
    '<div class="wv-comp-card-artist">' + sub + '</div>' +
  '</a>';
}

// Comps play in place; edits play directly when they have audio.
window.playItem = function(id) {
  var item = _allItems[id];
  if (!item) return;
  if (item._type === 'album') {
    if (typeof playCompById === 'function') playCompById(id, { album: item });
    else navigate('/album?id=' + encodeURIComponent(id) + '&play=1');
    return;
  }
  if (!item.ia_url) { navigate('/track?id=' + encodeURIComponent(id)); return; }
  playTrack({ id: item.id, title: item.title, artist_name: item.artists ? item.artists.display_name : (item.artist_name || ''), ia_url: item.ia_url, cover_url: item.cover_url });
};

// Top charts as a compact two-column list — numbers first, like a chart.
function chartsBlock() {
  var c = _home.charts; if (!c) return '';
  var edits = c.edits || [];
  var comps = c.comps || [];
  if (_homeFilter === 'comps') edits = [];
  if (_homeFilter === 'edits') comps = [];
  if (!edits.length && !comps.length) return '';
  function col(title, list, kind) {
    if (!list.length) return '';
    var top = list.slice().sort(function(a, b) { return (b.play_count || 0) - (a.play_count || 0); }).slice(0, 5);
    return '<div><div class="wv-colhead">' + title + '</div>' + top.map(function(t, i) {
      var href = (kind === 'comp' ? '/album?id=' : '/track?id=') + encodeURIComponent(t.id);
      var artist = t.artists ? t.artists.display_name : (t.archive_artist_name || '');
      return '<a class="wv-trow" href="' + _hEsc(href) + '">' +
        '<div class="wv-trow-num">' + (i + 1) + '</div>' +
        '<div class="wv-trow-art" style="background:' + coverGradient(t.title || '') + ';">' + (t.cover_url ? '<img src="' + _hEsc(_hImg(t.cover_url, 96)) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="wv-trow-main"><div class="wv-trow-title">' + _hEsc(t.title || '') + '</div><div class="wv-trow-sub">' + _hEsc(artist || '') + '</div></div>' +
        '<div class="wv-trow-dur">' + _hEsc(fmtNum(t.play_count || 0)) + '</div>' +
      '</a>';
    }).join('') + '</div>';
  }
  return '<div class="home-section">' + _secHead('Top charts', '/charts') +
    '<div class="wv-cols2">' + col('Edits · all time', edits, 'edit') + col('Comps · all time', comps, 'comp') + '</div>' +
  '</div>';
}

loadHome();
</script>
</body>
</html>
