<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs</title>
  <link rel="stylesheet" href="/css/style.css?v=649977439c35">
  <script src="/js/status-card.js?v=649977439c35"></script>
  <script src="/js/down.js?v=649977439c35"></script>
</head>
<body>
<div id="view">
  <div class="wv-home-chips"><span class="wv-skel" style="width:60px;height:32px;border-radius:999px;"></span><span class="wv-skel" style="width:80px;height:32px;border-radius:999px;"></span><span class="wv-skel" style="width:70px;height:32px;border-radius:999px;"></span></div>
  <div class="wv-quick-grid">
    <div class="wv-skel" style="height:56px;"></div><div class="wv-skel" style="height:56px;"></div><div class="wv-skel" style="height:56px;"></div><div class="wv-skel" style="height:56px;"></div>
  </div>
  <div class="wv-sec-head"><span class="wv-skel" style="width:180px;height:24px;"></span></div>
  <div class="wv-rail">
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
    <div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>
  </div>
</div>

<script src="/js/api.js?v=649977439c35"></script>
<script src="/js/layout.js?v=649977439c35"></script>
<script src="/js/player.js?v=649977439c35"></script>
<script src="/js/router.js?v=649977439c35"></script>
<script src="/js/playlists.js?v=649977439c35"></script>
<script>
initPlayer();

// ── State ──────────────────────────────────────────────────────
var _home = { recent: [], trending: [], highlighted: [], charts: null, archive: [], justAdded: [], eras: [] };
var _homeFilter = 'all';      // all | comps | edits
var _badges = { verified_artists: [], highlighted_albums: [], exclusive_albums: [], highlighted_tracks: [], exclusive_tracks: [] };
var _allItems = {};           // id -> item, for play buttons

function _greeting() {
  var h = new Date().getHours();
  return h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}
function _recentPlayed() {
  try { return JSON.parse(localStorage.getItem('recently_played') || '[]'); } catch (e) { return []; }
}
function _filterItems(items) {
  if (_homeFilter === 'comps') return items.filter(function(i) { return i._type === 'album'; });
  if (_homeFilter === 'edits') return items.filter(function(i) { return i._type !== 'album'; });
  return items;
}

// ── Load ───────────────────────────────────────────────────────
async function loadHome() {
  try {
    var r = await Promise.all([
      api('/discover'),
      api('/discover/trending').catch(function() { return []; }),
      api('/discover/highlighted').catch(function() { return []; }),
      api('/charts').catch(function() { return null; }),
      api('/archive?limit=12').catch(function() { return null; }),
      getBadgeData().catch(function() { return null; }),
      api('/archive/recent?limit=14').catch(function() { return null; }),
      api('/archive/eras').catch(function() { return null; }),
      api('/playlists/published?limit=16').catch(function() { return null; }),
      api('/awards/current').catch(function() { return null; }),
    ]);
    _home.recent = (r[0] && r[0].recent) || [];
    _home.trending = Array.isArray(r[1]) ? r[1] : [];
    _home.highlighted = Array.isArray(r[2]) ? r[2] : [];
    _home.charts = r[3];
    _home.archive = r[4] ? (Array.isArray(r[4]) ? r[4] : (r[4].items || [])) : [];
    _badges = r[5] || _badges;
    _home.justAdded = (r[6] && r[6].items) || [];
    _home.eras = (r[7] && r[7].items) || [];
    _home.playlists = (r[8] && r[8].items) || [];
    _home.awards = (r[9] && r[9].picks) || [];
    [].concat(_home.recent, _home.trending, _home.highlighted, _home.archive, _home.justAdded).forEach(function(i) { if (i && i.id) _allItems[i.id] = i; });
    renderHome();
  } catch (err) {
    wvShowError('view', err, 'loadHome()');
  }
}

// ── Render ─────────────────────────────────────────────────────
function renderHome() {
  var view = document.getElementById('view');
  var recent = _recentPlayed().filter(function(t) { return t.id; });
  var user = null; try { user = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) {}

  // Wash from what you played last, else the newest comp.
  var washFrom = (recent[0] && recent[0].cover_url) || ((_home.recent.find(function(i) { return i.cover_url; }) || {}).cover_url) || '';
  if (typeof window.setPageBgImage === 'function') window.setPageBgImage(washFrom, washFrom || 'wavernrs');

  var html = '';
  html += '<h1 class="wv-page-title" style="margin-bottom:12px;">' + _greeting() + (user && user.username ? ', ' + escHtml(user.display_name || user.username) : '') + '</h1>';
  html += '<div class="wv-home-chips">' +
    chip('all', 'All') + chip('comps', 'Comps') + chip('edits', 'Edits') +
    '<span class="wv-chip" onclick="navigate(\'/archive\')">Archive</span>' +
    '<span class="wv-chip" onclick="homeSurprise()" title="plays a random comp">Surprise me</span>' +
    '</div>';

  html += '<div id="home-lp"></div>';
  html += newsCard();
  html += eraStrip();

  // Jump back in — dense 2×4 tile grid, first screen
  if (recent.length) {
    html += '<div class="wv-quick-grid">' + recent.slice(0, 8).map(function(t, i) {
      var href = t._type === 'album' ? '/album?id=' + t.id : '/track?id=' + t.id;
      return '<div class="wv-quick-item" onclick="navigate(\'' + href + '\')">' +
        '<div class="wv-quick-cover" style="background:' + coverGradient(t.title || '') + ';">' +
          (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" loading="lazy" onerror="this.remove()">' : '') +
        '</div>' +
        '<div class="wv-quick-title">' + escHtml(t.title || '') + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  var newComps = _home.recent.filter(function(i) { return i._type === 'album'; });
  var newEdits = _home.recent.filter(function(i) { return i._type !== 'album'; });

  var mostPlayed = (typeof getPlayTally === 'function' ? getPlayTally({ days: 30, min: 2, limit: 12 }) : [])
    .map(function (e) { return { id: e.id, _type: e._type, title: e.title, cover_url: e.cover_url, artists: { display_name: e.artist_name }, _plays: e.n }; });
  html += awardsBlock();
  html += '<div id="home-leaks"></div>';
  html += '<div id="home-otd"></div>';
  html += '<div id="home-tnew"></div>';
  html += rail('Your most played this month', _filterItems(mostPlayed), '/history');
  html += rail('Made for you', _filterItems(_home.highlighted), '/browse?tab=highlighted');
  html += rail('Trending now', _filterItems(_home.trending), '/charts');
  html += playlistRail();
  if (_homeFilter !== 'edits') html += rail('New comps', newComps, '/browse?tab=recent');
  if (_homeFilter !== 'comps') html += rail('New edits', newEdits, '/browse?tab=recent');
  html += chartsBlock();
  if (_homeFilter !== 'edits') {
    html += rail('Just added to the archive', _home.justAdded.map(function(a) { return Object.assign({}, a, { _type: 'album', _archive: true }); }), '/archive?sort=newest');
  }
  html += rail('From the archive', _home.archive.map(function(a) { return Object.assign({}, a, { _type: 'album', _archive: true }); }), '/archive');
  html += rail('Recently played', recent.slice(0, 20).map(function(t) {
    return { id: t.id, _type: t._type, title: t.title, cover_url: t.cover_url, ia_url: t.ia_url, artists: { display_name: t.artist_name } };
  }), '/library');

  view.innerHTML = html;
  fillLiveLps();
  fillLeaks();
  fillOnThisDay();
  fillTrackerNew();
}

// Newest leaks from the Ye tracker.
var _leakCache = { at: 0, rows: [] };
async function fillLeaks() {
  if (_homeFilter !== 'all') return;
  try {
    if (Date.now() - _leakCache.at > 5 * 60000) {
      var d = await api('/resources/latest?n=12');
      _leakCache = { at: Date.now(), rows: (d && d.results) || [] };
    }
  } catch (_) { return; }
  var el = document.getElementById('home-leaks');
  if (!el || !_leakCache.rows.length) return;
  el.innerHTML = '<div class="home-section"><div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'/resources\')">Fresh leaks</h2><button class="wv-see-all" onclick="navigate(\'/resources\')">Show all</button></div>' +
    '<div class="scroll-row">' + _leakCache.rows.map(function (r) {
      var t = String(r.title || '').replace(/^[\s\u2B50\u2728\uFE0F\u2049]+/, '').replace(/^(\uD83C[\uDFC6\uDFC5\uDF96]|\uD83E\uDD47|\uD83D\uDDD1|\uD83E\uDD16)\uFE0F?\s*/, '');
      var href = '/resources?tab=Unreleased&era=' + encodeURIComponent(r.era) + '&q=' + encodeURIComponent(t);
      var art = r.art ? (typeof wvImg === 'function' ? wvImg(r.art, 320) : r.art) : '';
      return '<div class="scroll-card" onclick="navigate(\'' + href.replace(/'/g, "\\'") + '\')" style="flex-shrink:0;width:150px;">' +
        '<div class="scroll-card-cover" style="background:' + coverGradient(r.era || '') + ';">' + (art ? '<img src="' + escHtml(art) + '" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="scroll-card-title">' + escHtml(t) + '</div>' +
        '<div class="scroll-card-sub">' + escHtml(r.era) + (r.leak ? ' · ' + escHtml(r.leak.replace(/, \d{4}$/, '')) : '') + '</div></div>';
    }).join('') + '</div></div>';
}

// On this day in Ye history: tweets from this date in past years and album birthdays.
var _otdCache = { at: 0, d: null };
async function fillOnThisDay() {
  if (_homeFilter !== 'all') return;
  try {
    if (!_otdCache.d || Date.now() - _otdCache.at > 30 * 60000) _otdCache = { at: Date.now(), d: await api('/ye/onthisday') };
  } catch (_) { return; }
  var d = _otdCache.d, el = document.getElementById('home-otd');
  if (!el || !d) return;
  var cards = [];
  (d.week || []).forEach(function (a) {
    var when = a.days === 0 ? 'turns ' + a.age + ' today' : 'turns ' + a.age + (a.days === 1 ? ' tomorrow' : ' in ' + a.days + ' days');
    var href = '/resources?view=disco&album=' + encodeURIComponent(a.slug);
    var art = typeof wvImg === 'function' ? wvImg(a.cover_sm, 320) : a.cover_sm;
    cards.push('<div class="scroll-card" onclick="navigate(\'' + href + '\')" style="flex-shrink:0;width:150px;"><div class="scroll-card-cover" style="background:' + coverGradient(a.title) + ';"><img src="' + escHtml(art) + '" loading="lazy" onerror="this.remove()"></div>' +
      '<div class="scroll-card-title">' + escHtml(a.title) + '</div><div class="scroll-card-sub">' + escHtml(when) + '</div></div>');
  });
  (d.years || []).forEach(function (y) {
    var t = y.items && y.items[0]; if (!t) return;
    var text = String(t.text || '').replace(/\s*https?:\/\/\S+/g, '').trim() || (t.media && t.media.length ? '[photo]' : '');
    if (!text) return;
    cards.push('<div class="wv-otd-tw" onclick="navigate(\'/resources?view=tweets&filter=today\')"><div class="wv-otd-y">' + escHtml(y.year) + (y.count > 1 ? ' · ' + y.count + ' tweets' : '') + '</div><div class="wv-otd-t">' + escHtml(text) + '</div><div class="wv-otd-s">' + (t.likes ? '♥ ' + (t.likes >= 1000 ? Math.round(t.likes / 1000) + 'K' : t.likes) : 'read it ›') + '</div></div>');
  });
  ((d.leaks && d.leaks.items) || []).slice(0, 8).forEach(function (l) {
    var clean = String(l.title).replace(/\s*\[[^\]]*\]\s*/g, ' ').trim();
    var art = l.art ? (typeof wvImg === 'function' ? wvImg(l.art, 320) : l.art) : '';
    cards.push('<div class="scroll-card" onclick="navigate(\'/resources?view=song&t=' + encodeURIComponent(clean).replace(/'/g, '%27') + '\')" style="flex-shrink:0;width:150px;"><div class="scroll-card-cover" style="background:' + coverGradient(l.era || '') + ';">' + (art ? '<img src="' + escHtml(art) + '" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
      '<div class="scroll-card-title">' + escHtml(l.title) + '</div><div class="scroll-card-sub">leaked this day in ' + escHtml(l.year) + '</div></div>');
  });
  (d.yeezy || []).slice(0, 4).forEach(function (x) {
    var art = typeof wvImg === 'function' ? wvImg(x.img, 320) : x.img;
    cards.push('<div class="scroll-card" onclick="navigate(\'/resources?view=yeezy&item=' + encodeURIComponent(x.id).replace(/'/g, '%27') + '\')" style="flex-shrink:0;width:150px;"><div class="scroll-card-cover" style="background:#fff;"><img src="' + escHtml(art) + '" loading="lazy" style="object-fit:contain;" onerror="this.remove()"></div>' +
      '<div class="scroll-card-title">' + escHtml(x.title) + '</div><div class="scroll-card-sub">yeezy · ' + escHtml(x.year) + '</div></div>');
  });
  var dly = {}; try { dly = JSON.parse(localStorage.getItem('wv_yedaily') || '{}') || {}; } catch (_) {}
  var todayKey = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  var played = dly.day === todayKey && dly.res;
  cards.unshift('<div class="wv-otd-tw wv-otd-quiz" onclick="navigate(\'/resources?view=quiz\')"><div class="wv-otd-y">DAILY YE</div><div class="wv-otd-t">' + (played ? escHtml(dly.res.split('').map(function (c) { return c === '1' ? '🟩' : '🟥'; }).join('')) + '<br>you got ' + (dly.res.split('1').length - 1) + '/5 today' : 'today\u2019s 5 questions. same for everyone, one try') + '</div><div class="wv-otd-s">' + (played ? (dly.streak > 1 ? '🔥 ' + dly.streak + ' day streak' : 'new one at midnight') : 'play ›') + '</div></div>');
  if (!cards.length) return;
  var day = new Date('2000-' + d.md + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
  el.innerHTML = '<div class="home-section"><div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'/resources?view=tweets&filter=today\')">On this day in Ye history</h2><button class="wv-see-all" onclick="navigate(\'/resources?view=tweets&filter=today\')">' + escHtml(day) + '</button></div>' +
    '<div class="scroll-row">' + cards.join('') + '</div></div>';
}

// Comps that just landed on the Yedits trackers and are playable here.
var _tnewCache = { at: 0, items: null };
async function fillTrackerNew() {
  if (_homeFilter === 'edits') return;
  try {
    if (!_tnewCache.items || Date.now() - _tnewCache.at > 10 * 60000) _tnewCache = { at: Date.now(), items: ((await api('/trackers/changes?fresh=1')) || {}).items || [] };
  } catch (_) { return; }
  if (_homeFilter === 'edits') return;
  var el = document.getElementById('home-tnew');
  var items = (_tnewCache.items || []).filter(function (e) { return e && e.album && e.album.id; });
  if (!el || items.length < 3) return;
  el.innerHTML = '<div class="home-section"><div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'/tracker?t=' + encodeURIComponent(items[0].slug) + '\')">New on the trackers</h2><button class="wv-see-all" onclick="navigate(\'/tracker?t=' + encodeURIComponent(items[0].slug) + '\')">What’s new</button></div>' +
    '<div class="scroll-row">' + items.map(function (e) {
      var a = e.album, art = a.cover_url ? (typeof wvImg === 'function' ? wvImg(a.cover_url, 320) : a.cover_url) : '';
      return '<div class="scroll-card" onclick="navigate(\'/album?id=' + encodeURIComponent(a.id) + '\')" style="flex-shrink:0;width:150px;">' +
        '<div class="scroll-card-cover" style="background:' + coverGradient(a.title || '') + ';">' + (art ? '<img src="' + escHtml(art) + '" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="scroll-card-title">' + escHtml(e.n || a.title) + '</div>' +
        '<div class="scroll-card-sub">' + escHtml([e.c, e.era].filter(Boolean).join(' · ')) + '</div></div>';
    }).join('') + '</div></div>';
}

// A one-time heads up about new corners of the site. Dismissed for good once closed.
var WV_NEWS = { id: 'ye-archive-2026-09-28', items: [
  ['Daily Ye', '5 questions a day, same for everyone', '/resources?view=quiz'],
  ['Discography', 'producers, samples and previews for every album', '/resources?view=disco'],
  ['Song pages', 'every version of a song, leaks, credits and live shows', '/resources?view=song&t=Runaway'],
  ['Timeline', 'ye year by year', '/resources?view=timeline'],
] };
function newsCard() {
  try { if (localStorage.getItem('wv_news_seen') === WV_NEWS.id) return ''; } catch (_) { return ''; }
  return '<div class="wv-news" id="wv-news"><div class="wv-news-h"><b>new on wavernrs</b><button onclick="closeNews()" aria-label="dismiss">✕</button></div><div class="wv-news-row">' +
    WV_NEWS.items.map(function (x) { return '<a href="' + x[2] + '" onclick="closeNews(true);navigate(this.getAttribute(\'href\'));return false;"><b>' + escHtml(x[0]) + '</b><span>' + escHtml(x[1]) + '</span></a>'; }).join('') + '</div></div>';
}
window.closeNews = function (keepVisible) {
  try { localStorage.setItem('wv_news_seen', WV_NEWS.id); } catch (_) {}
  if (!keepVisible) { var el = document.getElementById('wv-news'); if (el) el.remove(); }
};

// Live listening parties go right at the top so people actually find them.
var _lpCache = { at: 0, live: [] };
async function fillLiveLps() {
  try {
    if (Date.now() - _lpCache.at > 60000) {
      var d = await api('/lp');
      _lpCache = { at: Date.now(), live: (d && d.live) || [] };
    }
  } catch (_) { return; }
  var el = document.getElementById('home-lp');
  if (!el || !_lpCache.live.length) return;
  el.innerHTML = _lpCache.live.slice(0, 2).map(function (l) {
    var np = l.now_playing, href = '/lp?id=' + encodeURIComponent(l.id);
    var art = np && np.cover_url ? (typeof wvImg === 'function' ? wvImg(np.cover_url, 160) : np.cover_url) : '';
    return '<a class="wv-home-lp" href="' + href + '" onclick="navigate(\'' + href + '\');return false;">' +
      '<div class="wv-home-lp-art" style="background:' + coverGradient(l.title || '') + ';">' + (art ? '<img src="' + escHtml(art) + '" alt="" onerror="this.remove()">' : '') + '</div>' +
      '<div class="wv-home-lp-i"><div class="wv-home-lp-k"><span class="wv-home-lp-dot"></span>' + (l.paused ? 'PAUSED' : 'LIVE NOW') + ' · ' + (l.listeners || 0) + ' listening</div>' +
      '<div class="wv-home-lp-t">' + escHtml(l.title) + '</div>' +
      '<div class="wv-home-lp-s">hosted by ' + escHtml((l.host && l.host.name) || 'someone') + (np ? ' · ♪ ' + escHtml(np.title) : '') + '</div></div>' +
      '<span class="wv-home-lp-go">Join</span></a>';
  }).join('');
}

// A quick way into the archive by era, using the covers we already have.
function eraStrip() {
  var eras = (_home.eras || []).filter(function (e) { return (e.total || 0) > 0; });
  if (eras.length < 4) return '';
  eras = eras.slice().sort(function (a, b) { return (b.total || 0) - (a.total || 0); }).slice(0, 14);
  return '<div class="home-section">' +
    '<div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'/eras\')">Browse by era</h2>' +
      '<button class="wv-see-all" onclick="navigate(\'/eras\')">Show all</button></div>' +
    '<div class="wv-era-strip">' + eras.map(function (e) {
      var n = (e.total || 0).toLocaleString();
      return '<div class="wv-era-chip" onclick="navigate(\'/archive?era=' + encodeURIComponent(e.id) + '\')">' +
        '<div class="wv-era-chip-cover" style="background:' + coverGradient(e.name || '') + ';">' +
          (e.cover ? '<img src="' + escHtml(e.cover) + '" loading="lazy" onerror="this.remove()">' : '') +
        '</div>' +
        '<div class="wv-era-chip-text"><b>' + escHtml(e.name) + '</b><span>' + n + '</span></div>' +
      '</div>';
    }).join('') + '</div></div>';
}

// One click from the home page into something nobody was looking for.
window.homeSurprise = async function () {
  try {
    if (typeof wvToast === 'function') wvToast('finding something...');
    var r = await api('/archive/random?n=1');
    var pick = r && r.items && r.items[0];
    if (!pick) { if (typeof wvToast === 'function') wvToast('couldnt pick one rn...try again', 'error'); return; }
    if (typeof wvToast === 'function') wvToast('playing ' + pick.title);
    playCompById(pick.id, { album: pick, quiet: true });
  } catch (_) { if (typeof wvToast === 'function') wvToast('couldnt pick one rn...try again', 'error'); }
};

function chip(k, label) {
  return '<span class="wv-chip' + (_homeFilter === k ? ' acc' : '') + '" onclick="setHomeFilter(\'' + k + '\')">' + label + '</span>';
}
window.setHomeFilter = function(k) { _homeFilter = k; renderHome(); };

// Staff picks for the week: Edit, Comp, Album and Yeditor of the Week.
var AWARD_SHORT = { edit: 'EOTW', comp: 'COTW', album: 'AOTW', yeditor: 'YOTW' };
function awardsBlock() {
  var picks = (_home.awards || []).filter(function(p) { return p.album || p.editor; });
  if (!picks.length || _homeFilter !== 'all') return '';
  var wk = picks[0].week ? new Date(picks[0].week + 'T12:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  return '<div class="home-section">' +
    '<div class="wv-sec-head"><h2 class="wv-sec-title">This week\'s picks</h2>' + (wk ? '<span class="wv-otw-week">Week of ' + escHtml(wk) + '</span>' : '') + '</div>' +
    '<div class="wv-otw-grid">' + picks.map(function(p) {
      var chip = '<span class="wv-otw-chip wv-otw-' + p.category + '">' + escHtml(AWARD_SHORT[p.category] || '') + '</span>';
      if (p.editor) {
        var slug = typeof archiveArtistSlug === 'function' ? archiveArtistSlug(p.editor.name) : encodeURIComponent(p.editor.name);
        var href = '/archive-artist?a=' + encodeURIComponent(slug);
        return '<a class="wv-otw-card" href="' + href + '" onclick="navigate(\'' + href + '\');return false;">' +
          '<div class="wv-otw-art wv-otw-person" style="background:' + coverGradient(p.editor.name) + ';"><span>' + escHtml((p.editor.name || '?').charAt(0).toUpperCase()) + '</span></div>' +
          '<div class="wv-otw-body">' + chip + '<div class="wv-otw-label">' + escHtml(p.label) + '</div>' +
          '<div class="wv-otw-title">' + escHtml(p.editor.name) + '</div>' +
          (p.note ? '<div class="wv-otw-note">' + escHtml(p.note) + '</div>' : '') + '</div></a>';
      }
      var a = p.album, href2 = '/album?id=' + encodeURIComponent(a.id);
      return '<a class="wv-otw-card" href="' + href2 + '" onclick="navigate(\'' + href2 + '\');return false;">' +
        '<div class="wv-otw-art" style="background:' + coverGradient(a.title || '') + ';">' + (a.cover_url ? '<img src="' + escHtml(typeof wvImg === 'function' ? wvImg(a.cover_url, 300) : a.cover_url) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="wv-otw-body">' + chip + '<div class="wv-otw-label">' + escHtml(p.label) + '</div>' +
        '<div class="wv-otw-title">' + escHtml(a.title || '') + '</div>' +
        '<div class="wv-otw-sub">' + escHtml(a.creator || '') + '</div>' +
        (p.note ? '<div class="wv-otw-note">' + escHtml(p.note) + '</div>' : '') + '</div></a>';
    }).join('') + '</div>' +
  '</div>';
}

// Published playlists from the community. Hidden until there are any, and
// under the Comps and Edits filters.
function playlistRail() {
  var items = _home.playlists || [];
  if (!items.length || _homeFilter !== 'all' || typeof window.wvPlaylistCardHTML !== 'function') return '';
  return '<div class="home-section">' +
    '<div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'/playlists\')">Community playlists</h2>' +
      '<button class="wv-see-all" onclick="navigate(\'/playlists\')">Show all</button></div>' +
    '<div class="wv-rail">' + items.map(window.wvPlaylistCardHTML).join('') + '</div>' +
  '</div>';
}

function rail(title, items, href) {
  if (!items || !items.length) return '';
  return '<div class="home-section">' +
    '<div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'' + href + '\')">' + escHtml(title) + '</h2>' +
      '<button class="wv-see-all" onclick="navigate(\'' + href + '\')">Show all</button></div>' +
    '<div class="wv-rail">' + items.slice(0, 20).map(compCardHTML).join('') + '</div>' +
  '</div>';
}

function compCardHTML(item) {
  var isAlbum = item._type === 'album';
  var artist = item._archive ? (item.archive_artist_name || item.artist_name || 'Archive')
             : (item.artists ? (item.artists.display_name || '') : (item.artist_name || 'Unknown'));
  var artistId = item.artists ? item.artists.id : null;
  var href = isAlbum ? '/album?id=' + item.id : '/track?id=' + item.id;
  var b = _badges || {};
  var isVerified = artistId && (b.verified_artists || []).indexOf(artistId) !== -1;
  var isHighlighted = isAlbum ? (b.highlighted_albums || []).indexOf(item.id) !== -1 : (b.highlighted_tracks || []).indexOf(item.id) !== -1;
  var isExclusive   = isAlbum ? (b.exclusive_albums || []).indexOf(item.id) !== -1   : (b.exclusive_tracks || []).indexOf(item.id) !== -1;
  var badges = (isHighlighted ? '<span class="wv-badge-hl-icon" title="Highlighted">★</span>' : '') +
               (isExclusive ? '<span class="wv-badge-ex-icon" title="Exclusive">◆</span>' : '');
  var sub = (isAlbum ? 'Comp' : 'Edit') + ' · ' + escHtml(artist) + (isVerified ? '<span class="wv-verified-icon" title="Verified">✓</span>' : '');
  _allItems[item.id] = _allItems[item.id] || item;
  return '<div class="wv-comp-card" onclick="navigate(\'' + href + '\')">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + coverGradient(item.title || '') + ';">' +
      (item.cover_url ? '<img src="' + escHtml(item.cover_url) + '" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">' : '') +
      '<button class="wv-cover-play-btn" aria-label="Play" onclick="event.stopPropagation();playItem(\'' + item.id + '\')">' +
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg></button>' +
    '</div></div>' +
    '<div class="wv-comp-card-title">' + escHtml(item.title || '') + badges + '</div>' +
    '<div class="wv-comp-card-artist">' + sub + '</div>' +
  '</div>';
}

window.playItem = function(id) {
  var item = _allItems[id];
  if (!item) return;
  if (item._type === 'album') { navigate('/album?id=' + id + '&play=1'); return; }
  if (!item.ia_url) { navigate('/track?id=' + id); return; }
  playTrack({ id: item.id, title: item.title, artist_name: item.artists ? item.artists.display_name : (item.artist_name || ''), ia_url: item.ia_url, cover_url: item.cover_url });
};

// Top charts as a compact two-column list — numbers first, like a chart.
function chartsBlock() {
  var c = _home.charts; if (!c) return '';
  var edits = (c.edits || c).alltime || [];
  var comps = (c.comps || {}).alltime || [];
  if (!edits.length && !comps.length) return '';
  function col(title, list, kind) {
    if (!list.length) return '';
    var top = list.slice().sort(function(a, b) { return (b.play_count || 0) - (a.play_count || 0); }).slice(0, 5);
    return '<div><div class="wv-colhead">' + title + '</div>' + top.map(function(t, i) {
      var href = kind === 'comp' ? '/album?id=' + t.id : '/track?id=' + t.id;
      var artist = t.artists ? t.artists.display_name : (t.archive_artist_name || '');
      return '<div class="wv-trow" onclick="navigate(\'' + href + '\')">' +
        '<div class="wv-trow-num">' + (i + 1) + '</div>' +
        '<div class="wv-trow-art" style="background:' + coverGradient(t.title || '') + ';">' + (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="wv-trow-main"><div class="wv-trow-title">' + escHtml(t.title || '') + '</div><div class="wv-trow-sub">' + escHtml(artist || '') + '</div></div>' +
        '<div class="wv-trow-dur">' + fmtNum(t.play_count || 0) + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }
  return '<div class="home-section">' +
    '<div class="wv-sec-head"><h2 class="wv-sec-title" onclick="navigate(\'/charts\')">Top charts</h2><button class="wv-see-all" onclick="navigate(\'/charts\')">Show all</button></div>' +
    '<div class="wv-cols2">' + col('Edits · all time', edits, 'edit') + col('Comps · all time', comps, 'comp') + '</div>' +
  '</div>';
}

loadHome();
</script>
</body>
</html>
