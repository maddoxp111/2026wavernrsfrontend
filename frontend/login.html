<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — log in</title>
  <link rel="stylesheet" href="/css/style.css?v=202609041844">
  <link rel="icon" type="image/x-icon" href="/icon.ico">
</head>
<body>
<div class="wv-auth-page" id="auth-root">
  <div class="wv-auth-card wv-card">
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.04em;color:var(--brand);margin-bottom:24px;">wavernrs</div>
    <div class="wv-auth-title">Welcome back</div>
    <div class="wv-auth-sub">Log in to your account</div>

    <div id="alert-container"></div>

    <div class="wv-form-field">
      <label class="wv-form-label" for="username">Username</label>
      <input class="wv-input" type="text" id="username" placeholder="yourname" autocomplete="username">
    </div>
    <div class="wv-form-field">
      <label class="wv-form-label" for="password">Password</label>
      <input class="wv-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="wv-pill brand" style="width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:8px;" id="login-btn" onclick="doLogin()">Log in</button>

    <div style="display:flex;align-items:center;gap:10px;margin:20px 0 4px;">
      <div style="flex:1;height:1px;background:var(--hair);"></div>
      <div style="font-size:12px;color:var(--text-3);">or</div>
      <div style="flex:1;height:1px;background:var(--hair);"></div>
    </div>

    <button id="discord-btn" onclick="oauthLogin('discord')" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:var(--r-md);background:#5865F2;color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;margin-bottom:8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.054a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Continue with Discord
    </button>
    <button id="google-btn" onclick="oauthLogin('google')" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:var(--r-md);background:var(--surface-1);color:var(--text-1);font-size:14px;font-weight:600;border:1px solid var(--border);cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-2);">
      Don't have an account? <a href="/register.html" style="color:var(--brand);font-weight:500;">Sign up</a>
    </div>
  </div>
</div>

<script src="/js/api.js?v=202609041844"></script>
<script>
  // Apply saved theme
  var _t = (localStorage.getItem('wv_theme') === 'light' ? 'light' : 'dark');
  document.getElementById('auth-root').className = 'wv-auth-page theme-' + _t;

  if (isLoggedIn()) location.href = '/index.html';

  function showAlert(containerId, msg) {
    const el = document.getElementById(containerId);
    if (el) el.innerHTML = '<div class="wv-form-error">' + msg + '</div>';
  }
  function clearAlert(containerId) {
    const el = document.getElementById(containerId);
    if (el) el.innerHTML = '';
  }

  // Landed here because a stored token stopped working (an old token from
  // before sessions became permanent, or a rotated server secret). Say so,
  // and send them back where they were once they're in.
  (function noteSessionEnd() {
    var params = new URLSearchParams(location.search);
    var reason = params.get('session');
    if (!reason) return;
    var el = document.getElementById('alert-container');
    if (el) {
      el.innerHTML = '<div class="wv-form-error" style="color:var(--text-2);">' +
        'You were signed out. Log back in — from now on you\'ll stay signed in.' +
        '</div>';
    }
  })();

  // Where to go after a successful login (set when we bounced them here).
  function _postLoginTarget() {
    var next = new URLSearchParams(location.search).get('next');
    // Only same-site paths — never redirect to an absolute/offsite URL.
    if (next && next.charAt(0) === '/' && next.charAt(1) !== '/') return next;
    return '/index.html';
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function oauthLogin(provider) {
    location.href = API_BASE + '/oauth/' + provider;
  }

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    clearAlert('alert-container');

    if (!username || !password) {
      return showAlert('alert-container', 'Please fill in all fields');
    }

    const btn = document.getElementById('login-btn');
    btn.textContent = 'Logging in…';
    btn.disabled = true;

    try {
      const { token, user } = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(user));
      localStorage.removeItem('wv_countdown_bypass');
      location.href = _postLoginTarget();
    } catch (err) {
      showAlert('alert-container', err.message);
      btn.textContent = 'Log in';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
