<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — log in</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="auth-logo">wavernrs stream</div>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-subtitle">Log in to your account</p>

  <div id="alert-container"></div>

  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="yourname" autocomplete="username">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn btn-primary btn-lg" style="width:100%" id="login-btn" onclick="doLogin()">Log in</button>

  <div class="auth-footer">
    Don't have an account? <a href="/register.html">Sign up</a>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  // Redirect if already logged in
  if (isLoggedIn()) location.href = '/index.html';

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    clearAlert('alert-container');

    if (!username || !password) {
      return showAlert('alert-container', 'Please fill in all fields');
    }

    const btn = document.getElementById('login-btn');
    btn.textContent = 'Logging in…';
    btn.disabled = true;

    try {
      const { token, user } = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(user));
      location.href = '/index.html';
    } catch (err) {
      showAlert('alert-container', err.message);
      btn.textContent = 'Log in';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
