    return '<section class="ma-about" aria-labelledby="ma-about-h">' +
      '<div class="ma-about-in"><h2 class="ma-h2" id="ma-about-h">At a glance</h2>' +
      '<dl class="ma-facts">' + facts.map(function (f) { return '<div class="ma-fact"><dt>' + esc(f[0]) + '</dt><dd title="' + esc(f[1]) + '">' + esc(f[1]) + '</dd></div>'; }).join('') + '</dl>' +
      '<div class="ma-attrib"><span>from the song credits on wavernrs</span></div></div></section>';
  }
  function aboutSkeleton() {
    return '<section class="ma-about" aria-busy="true" aria-label="Loading bio"><div class="ma-about-in ma-about-sk"><h2 class="ma-h2">About</h2><div class="ma-sk-line ma-sk"></div><div class="ma-sk-line ma-sk"></div><div class="ma-sk-line ma-sk"></div></div></section>';
  }
  function relatedRow(list) {
    if (!list || !list.length) return '';
    return '<section aria-labelledby="ma-rel-h"><h2 class="ma-h2" id="ma-rel-h">Often featured with</h2><div class="ma-rel">' + list.map(function (r) {
      var href = artistHref(r.artist_key);
      return '<a class="ma-rel-item" href="' + esc(href) + '" data-href="' + esc(href) + '">' +
        '<div class="av" style="background:' + grad(r.name) + '">' + avatar(r.name, r.photo, 280) + '</div>' +
        '<div class="ma-rel-name">' + esc(r.name) + '</div>' +
        '<div class="ma-rel-meta">' + (r.shared ? esc(plural(r.shared, 'song')) + '<span class="tg"> together</span>' : esc(plural(r.tracks || 0, 'feature'))) + '</div></a>';
    }).join('') + '</div></section>';
  }
  function compCard(c, primary) {
    var href = '/album?id=' + encodeURIComponent(c.id);
    return '<a class="wv-comp-card" href="' + esc(href) + '" data-href="' + esc(href) + '" style="text-decoration:none;color:inherit;"><div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + grad(c.title || '') + ';border-radius:14px;">' +
      (c.cover_url ? '<img src="' + esc(img(c.cover_url, 320)) + '" alt="" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.remove()">' : '') +
      '</div></div><div class="wv-comp-card-title">' + esc(c.title || '') + '</div><div class="wv-comp-card-artist">' + esc([c.archive_artist_name || '', primary ? '' : plural(c.feature_count || 0, 'song')].filter(Boolean).join(' · ')) + '</div></a>';
  }

  function detailSkeleton() {
    return '<button type="button" class="ma-back" data-href="/music">' + I.back + 'Artists</button>' +
      '<div class="ma-hero" aria-busy="true"><div class="ma-photo ma-sk"></div><div class="ma-hero-body" style="width:100%;"><div class="ma-sk-line ma-sk" style="width:80px;margin:0 0 14px;"></div><div class="ma-sk ma-sk-line" style="height:52px;width:min(420px,80%);margin:0 0 14px;border-radius:12px;"></div><div class="ma-sk-line ma-sk" style="width:220px;margin:0;"></div></div></div>' +
      '<div class="ma-cols"><div>' + [0, 1, 2, 3, 4, 5].map(function () { return '<div class="ma-row" aria-hidden="true"><div></div><div class="ma-cov ma-sk"></div><div><div class="ma-sk-line ma-sk" style="margin:0 0 7px;width:60%;"></div><div class="ma-sk-line sm ma-sk" style="margin:0;width:35%;"></div></div></div>'; }).join('') + '</div>' + aboutSkeleton() + '</div>';
  }

  async function share(a) {
    var url = location.origin + artistHref(a.artist_key);
    var title = a.name + ' on wavernrs';
    if (navigator.share && matchMedia('(pointer: coarse)').matches) {
      try { await navigator.share({ title: title, url: url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(url); toast('link copied'); }
    catch (_) {
      var ta = document.createElement('textarea'); ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('link copied'); } catch (_) { toast(url); }
      ta.remove();
    }
  }

  async function renderDetail() {
    root.innerHTML = detailSkeleton();
    bindDetail();
    try {
      _detail = await api('/music-artists/' + encodeURIComponent(key));
    } catch (e) {
      if (!document.body.contains(root)) return;
      root.innerHTML = '<button type="button" class="ma-back" data-href="/music">' + I.back + 'Artists</button><div class="wv-empty">' + esc(e.message || 'couldnt find that artist') + '</div>';
      return;
    }
    if (!document.body.contains(root)) return;
    var a = _detail.artist, tracks = _detail.tracks || [], comps = _detail.comps || [];
    var hasAboutApi = Object.prototype.hasOwnProperty.call(_detail, 'about');
    var ab = _detail.about || null;
    var related = Array.isArray(_detail.related) ? _detail.related : localRelated(tracks, a.artist_key);
    _queue = tracks.filter(function (t) { return t.ia_url; });
    document.title = a.name + ' — wavernrs';
    var lead = comps.find(function (c) { return c.cover_url; }) || tracks.find(function (t) { return t.cover_url || (t.albums && t.albums.cover_url); });
    var leadCover = lead ? (lead.cover_url || (lead.albums && lead.albums.cover_url)) : '';
    if (typeof window.setPageBgImage === 'function') window.setPageBgImage(a.photo || leadCover || '', a.name);
    var pop = popular(tracks);
    var statChips = a.primary
      ? '<span class="ma-chip">' + I.note + esc(plural(a.tracks || 0, 'song')) + '</span><span class="ma-chip">' + I.disc + esc(plural(a.comps || 0, 'release')) + '</span>'
      : '<span class="ma-chip">' + I.note + 'on ' + esc(plural(a.tracks || 0, 'song')) + '</span><span class="ma-chip">' + I.disc + esc(plural(a.comps || 0, 'release')) + '</span>' + (a.plays ? '<span class="ma-chip">' + I.ear + esc(short(a.plays)) + ' plays</span>' : '');
    var bgUrl = a.photo ? String(img(a.photo, 320) || '').replace(/["'()\\\s<>]/g, encodeURIComponent) : '';
    _glance = glanceCard(a, comps, related, pop);
    var aboutHtml = ab ? aboutCard(a, ab) : '';
    if (!aboutHtml) aboutHtml = hasAboutApi && _detail.about_pending ? aboutSkeleton() : _glance;
    root.innerHTML =
      '<button type="button" class="ma-back" data-href="/music">' + I.back + 'Artists</button>' +
      '<header class="ma-hero">' +
        (bgUrl ? '<div class="ma-hero-bg" style="background-image:url(&quot;' + esc(bgUrl) + '&quot;)"></div>' : '<div class="ma-hero-bg" style="background:' + grad(a.name) + '"></div>') +
        '<div class="ma-photo" style="background:' + grad(a.name) + '">' + '<span aria-hidden="true">' + esc(initials(a.name)) + '</span>' + (a.photo ? '<img src="' + esc(img(a.photo, 480)) + '" alt="' + esc(a.name) + '" onerror="this.remove()">' : '') + '</div>' +
        '<div class="ma-hero-body">' +
          '<div class="ma-kind">' + (a.primary ? I.star + 'the main man' : 'Artist') + '</div>' +
          '<h1 class="ma-name">' + esc(a.name) + '</h1>' +
          '<div class="ma-desc" id="ma-desc"' + (ab && ab.description ? '' : ' hidden') + '>' + esc(ab && ab.description ? ab.description : '') + '</div>' +
          '<div class="ma-chips" id="ma-chips">' + factChips(ab) + statChips + '</div>' +
          '<div class="ma-actions">' +
            '<button type="button" class="ma-play" data-act="play"' + (_queue.length ? '' : ' disabled') + '>' + I.play + 'Play</button>' +
            '<button type="button" class="ma-ghost" data-act="shuffle"' + (_queue.length ? '' : ' disabled') + '>' + I.shuffle + 'Shuffle</button>' +
            '<button type="button" class="ma-ghost ma-icon-btn" data-act="share" aria-label="Copy link to ' + esc(a.name) + '" title="Share">' + I.share + '</button>' +
          '</div>' +
        '</div>' +
      '</header>' +
      '<div class="ma-cols">' +
        '<section aria-labelledby="ma-pop-h"><h2 class="ma-h2" id="ma-pop-h">Popular</h2>' +
          (pop.length ? '<div class="ma-list" id="ma-pop">' + pop.map(row).join('') + '</div>' : '<div class="wv-empty">no songs yet</div>') +
          (tracks.length > pop.length ? '<button type="button" class="ma-expander" data-act="all" aria-expanded="false" aria-controls="ma-all">See all ' + esc(num(tracks.length)) + ' songs</button>' : '') +
          '<div class="ma-all" id="ma-all" hidden></div>' +
        '</section>' +
        '<div id="ma-about-slot">' + aboutHtml + '</div>' +
      '</div>' +
      relatedRow(related) +
      (comps.length ? '<section class="ma-comps" aria-labelledby="ma-comps-h"><h2 class="ma-h2" id="ma-comps-h">' + (a.primary ? 'Most-liked comps' : 'Comps they\'re on') + ' <small>' + esc(num(comps.length)) + '</small></h2>' +
        '<div class="ma-comp-grid" id="ma-comp-grid">' + comps.slice(0, 12).map(function (c) { return compCard(c, a.primary); }).join('') + '</div>' +
        (comps.length > 12 ? '<div class="ma-more"><button type="button" class="ma-pill-btn" data-act="comps">Show all ' + esc(num(comps.length)) + ' comps</button></div>' : '') +
      '</section>' : '');
    try { if (typeof currentTrack !== 'undefined' && currentTrack && currentTrack.id) markNow(currentTrack.id); } catch (_) {}
    if (hasAboutApi && !ab && _detail.about_pending) pollAbout(a, 0);
  }

  function pollAbout(a, n) {
    if (n >= 5) { var slot = document.getElementById('ma-about-slot'); if (slot) slot.innerHTML = _glance; return; }
    var t = setTimeout(async function () {
      if (!document.getElementById('ma-about-slot')) return;
      var d = null;
      try { d = await api('/music-artists/' + encodeURIComponent(a.artist_key) + '/about'); } catch (_) {}
      var slot = document.getElementById('ma-about-slot');
      if (!slot) return;
      if (d && d.about) {
        slot.innerHTML = aboutCard(a, d.about, true) || _glance;
        var desc = document.getElementById('ma-desc');
        if (desc && d.about.description) { desc.textContent = d.about.description; desc.hidden = false; }
        var chips = document.getElementById('ma-chips');
        if (chips) chips.insertAdjacentHTML('afterbegin', factChips(d.about, true));
        return;
      }
      if (d && !d.pending) { slot.innerHTML = _glance; return; }
      pollAbout(a, n + 1);
    }, n ? 3500 : 2500);
    window._pageCleanup.push(function () { clearTimeout(t); });
  }

  function bindDetail() {
    if (root._maBound) return;
    root._maBound = true;
    root.addEventListener('click', function (e) {
      var q = e.target.closest('[data-queue]');
      if (q) {
        e.stopPropagation();
        var t = _queue.find(function (x) { return x.id === q.getAttribute('data-queue'); });
        if (t && typeof window.addToQueue === 'function') window.addToQueue(trackItem(t));
        return;
      }
      var al = e.target.closest('[data-album]');
      if (al) { e.preventDefault(); e.stopPropagation(); go('/album?id=' + encodeURIComponent(al.getAttribute('data-album'))); return; }
      var act = e.target.closest('[data-act]');
      if (act) {
        var k = act.getAttribute('data-act');
        if (k === 'play') playFrom(null, false);
        else if (k === 'shuffle') playFrom(null, true);
        else if (k === 'share' && _detail) share(_detail.artist);
        else if (k === 'all') toggleAll(act);
        else if (k === 'allmore') moreAll(act);
        else if (k === 'comps') {
          var g = document.getElementById('ma-comp-grid');
          if (g && _detail) g.insertAdjacentHTML('beforeend', (_detail.comps || []).slice(12).map(function (c) { return compCard(c, _detail.artist.primary); }).join(''));
          act.parentNode.remove();
        }
        return;
      }
      var r = e.target.closest('.ma-row[role="button"]');
      if (r) { playFrom(r.getAttribute('data-tid'), false); return; }
      var h = e.target.closest('[data-href]');
      if (h) { e.preventDefault(); go(h.getAttribute('data-href')); }
    });
    root.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var r = e.target.closest('.ma-row[role="button"]');
      if (r && e.target === r) { e.preventDefault(); playFrom(r.getAttribute('data-tid'), false); }
    });
  }

  var _allShown = 0;
  function sortedAll() { return (_detail.tracks || []).slice().sort(function (x, y) { return (y.play_count || 0) - (x.play_count || 0); }); }
  function toggleAll(btn) {
    var box = document.getElementById('ma-all');
    if (!box) return;
    var open = box.hidden;
    box.hidden = !open;
    btn.setAttribute('aria-expanded', open);
    btn.textContent = open ? 'Hide full list' : 'See all ' + num((_detail.tracks || []).length) + ' songs';
    if (open && !_allShown) {
      box.innerHTML = '<h3 class="ma-h2" style="font-size:16px;margin-top:4px;">All songs <small>by plays</small></h3><div class="ma-list" id="ma-all-list"></div>';
      moreAll();
    }
  }
  function moreAll(btn) {
    var list = document.getElementById('ma-all-list');
    if (!list) return;
    var all = sortedAll(), next = all.slice(_allShown, _allShown + 50);
    list.insertAdjacentHTML('beforeend', next.map(function (t, i) { return row(t, _allShown + i); }).join(''));
    _allShown += next.length;
    if (btn) btn.remove();
    if (_allShown < all.length) list.insertAdjacentHTML('afterend', '<button type="button" class="ma-expander" data-act="allmore">Show ' + Math.min(50, all.length - _allShown) + ' more</button>');
    try { if (typeof currentTrack !== 'undefined' && currentTrack && currentTrack.id) markNow(currentTrack.id); } catch (_) {}
  }

  if (key) renderDetail(); else renderList();
})();
</script>
</body>
</html>
