<div id="view">
  <style>
    .rd-wrap { max-width:1180px; }
    .rd-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
    .rd-head .wv-page-title { margin:4px 0 6px; }
    .rd-lede { color:var(--text-2); font-size:14px; margin:0; max-width:560px; line-height:1.45; }
    .rd-stats { display:flex; gap:8px; flex-wrap:wrap; }
    .rd-stat { display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-pill); padding:7px 12px; font-size:12.5px; font-weight:700; color:var(--text-2); white-space:nowrap; }
    .rd-stat b { color:var(--text); font-weight:800; }
    .rd-dot { width:7px; height:7px; border-radius:50%; background:#e0245e; flex-shrink:0; box-shadow:0 0 0 0 rgba(224,36,94,.55); animation:rdPulse 1.8s var(--ease) infinite; }
    @keyframes rdPulse { 0% { box-shadow:0 0 0 0 rgba(224,36,94,.55); } 70% { box-shadow:0 0 0 7px rgba(224,36,94,0); } 100% { box-shadow:0 0 0 0 rgba(224,36,94,0); } }

    .rd-hero { position:relative; isolation:isolate; overflow:hidden; border-radius:var(--r-xl); border:1px solid var(--hair); background:var(--surface); margin-bottom:30px; }
    .rd-hero-bg { position:absolute; inset:-80px; z-index:-2; background-size:cover; background-position:center; filter:blur(56px) saturate(1.6); transform:scale(1.05); opacity:.95; transition:background-image .6s var(--ease); }
    .rd-hero-scrim { position:absolute; inset:0; z-index:-1; background:linear-gradient(100deg, rgba(18,18,18,.55) 0%, rgba(18,18,18,.78) 55%, rgba(18,18,18,.92) 100%); background:linear-gradient(100deg, color-mix(in srgb, var(--surface) 42%, transparent) 0%, color-mix(in srgb, var(--surface) 72%, transparent) 52%, color-mix(in srgb, var(--surface) 90%, transparent) 100%); }
    .rd-hero-in { display:grid; grid-template-columns:232px minmax(0,1fr); gap:28px; padding:28px; align-items:center; }
    .rd-hero.has-rail .rd-hero-in { grid-template-columns:232px minmax(0,1fr) 276px; }
    .rd-hero-art { position:relative; width:232px; aspect-ratio:1; border-radius:var(--r-lg); overflow:hidden; background:linear-gradient(135deg,#3b2a6e,#141420); box-shadow:0 18px 50px rgba(0,0,0,.45); border:0; padding:0; cursor:pointer; display:block; }
    .rd-hero-art img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s var(--ease); }
    .rd-hero-art:hover img { transform:scale(1.04); }
    .rd-hero-art .rd-art-ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.8); }
    .rd-chips { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .rd-chip { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; border-radius:var(--r-pill); background:var(--surface-2); color:var(--text-2); white-space:nowrap; }
    .rd-chip.live { background:#e0245e; color:#fff; }
    .rd-chip.live .rd-dot { background:#fff; box-shadow:0 0 0 0 rgba(255,255,255,.6); animation-name:rdPulseW; }
    @keyframes rdPulseW { 0% { box-shadow:0 0 0 0 rgba(255,255,255,.6); } 70% { box-shadow:0 0 0 6px rgba(255,255,255,0); } 100% { box-shadow:0 0 0 0 rgba(255,255,255,0); } }
    .rd-chip.tuned { background:var(--brand); color:var(--on-brand); }
    .rd-chip svg { flex-shrink:0; }
    .rd-hero-name { font-size:clamp(26px, 3.2vw, 40px); font-weight:900; letter-spacing:-.035em; line-height:1.04; margin:0; overflow-wrap:anywhere; }
    .rd-hero-desc { color:var(--text-2); font-size:14px; line-height:1.45; margin:8px 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .rd-hero-now { margin-top:16px; max-width:560px; }
    .rd-kicker { display:flex; align-items:center; gap:8px; font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:5px; }
    .rd-hero-track { font-size:17px; font-weight:800; letter-spacing:-.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-hero-artist { font-size:13.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .rd-prog { height:4px; border-radius:4px; background:var(--hair-strong); overflow:hidden; margin-top:12px; }
    .rd-prog i { display:block; height:100%; width:0; background:var(--text); border-radius:4px; transition:width 1s linear; }
    .rd-times { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-3); margin-top:6px; font-variant-numeric:tabular-nums; }
    .rd-hero-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px; }
    .rd-cta { display:inline-flex; align-items:center; gap:9px; min-height:44px; padding:0 22px 0 18px; border-radius:var(--r-pill); border:0; background:var(--brand); color:var(--on-brand); font:inherit; font-weight:800; font-size:15px; cursor:pointer; transition:transform .12s var(--ease), filter .15s; }
    .rd-cta:hover { filter:brightness(1.06); }
    .rd-cta:active { transform:scale(.97); }
    .rd-ghost { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 18px; border-radius:var(--r-pill); border:1px solid var(--hair-strong); background:color-mix(in srgb, var(--surface) 55%, transparent); color:var(--text); font:inherit; font-weight:700; font-size:14px; cursor:pointer; }
    .rd-ghost:hover { background:var(--surface-2); }
    .rd-by { font-size:13px; color:var(--text-2); display:inline-flex; align-items:center; gap:6px; margin-left:4px; }
    .rd-by a { color:var(--text); font-weight:700; text-decoration:none; }
    .rd-by a:hover { text-decoration:underline; }
    .rd-cta:focus-visible, .rd-ghost:focus-visible, .rd-card:focus-visible, .rd-hero-art:focus-visible, .rd-card-play:focus-visible, .rd-rrow:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

    .rd-rail { align-self:stretch; display:flex; flex-direction:column; gap:14px; border-left:1px solid var(--hair); padding-left:24px; min-width:0; }
    .rd-rail-h { font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
    .rd-rrow { display:flex; align-items:center; gap:10px; padding:6px; margin:0 -6px; border-radius:var(--r-md); color:inherit; text-decoration:none; min-width:0; }
    a.rd-rrow:hover { background:color-mix(in srgb, var(--text) 7%, transparent); }
    .rd-rrow img, .rd-rrow .ph { width:38px; height:38px; border-radius:var(--r-sm); object-fit:cover; flex-shrink:0; background:var(--surface-3); }
    .rd-rrow .tx { min-width:0; flex:1; }
    .rd-rrow .t { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-rrow .a { font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-rrow .w { font-size:11px; color:var(--text-3); white-space:nowrap; font-variant-numeric:tabular-nums; }

    .rd-eq { display:inline-flex; align-items:flex-end; gap:2px; height:12px; }
    .rd-eq i { width:3px; height:100%; background:currentColor; border-radius:1px; transform-origin:bottom; animation:rdEq 1s ease-in-out infinite; }
    .rd-eq i:nth-child(2) { animation-delay:-.45s; animation-duration:.8s; }
    .rd-eq i:nth-child(3) { animation-delay:-.2s; animation-duration:1.15s; }
    .rd-eq i:nth-child(4) { animation-delay:-.7s; animation-duration:.9s; }
    .rd-eq.idle i { animation:none; transform:scaleY(.3); }
    @keyframes rdEq { 0%,100% { transform:scaleY(.25); } 50% { transform:scaleY(1); } }

    .rd-sec-title { font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0 0 14px; }
    .rd-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:18px; }
    .rd-card { background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-lg); overflow:hidden; cursor:pointer; transition:transform .18s var(--ease), background .18s, border-color .18s; outline:none; min-width:0; }
    .rd-card:hover { transform:translateY(-3px); background:var(--surface-hover); border-color:var(--hair-strong); }
    .rd-card-art { aspect-ratio:16/10; position:relative; overflow:hidden; background:linear-gradient(135deg,#3b2a6e,#1a1a24); isolation:isolate; }
    .rd-card-bg { position:absolute; inset:-30px; background-size:cover; background-position:center; filter:blur(22px) saturate(1.5) brightness(.8); z-index:-1; }
    .rd-card-cover { position:absolute; top:50%; left:50%; height:68%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:var(--r-md); object-fit:cover; box-shadow:0 10px 30px rgba(0,0,0,.45); transition:transform .3s var(--ease); background:rgba(0,0,0,.2); }
    .rd-card:hover .rd-card-cover { transform:translate(-50%,-50%) scale(1.04); }
    .rd-card-art .rd-art-ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.75); }
    .rd-card-tl { position:absolute; top:10px; left:10px; display:flex; gap:6px; }
    .rd-card-tr { position:absolute; top:10px; right:10px; }
    .rd-badge { display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:800; letter-spacing:.07em; padding:4px 8px; border-radius:var(--r-pill); background:rgba(0,0,0,.62); color:#fff; text-transform:uppercase; }
    .rd-badge.live { background:#e0245e; }
    .rd-badge.live .rd-dot { width:6px; height:6px; background:#fff; animation-name:rdPulseW; }
    .rd-badge.off { background:rgba(0,0,0,.55); color:rgba(255,255,255,.8); }
    .rd-card-prog { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.18); }
    .rd-card-prog i { display:block; height:100%; width:0; background:#fff; transition:width 1s linear; }
    .rd-card-play { position:absolute; right:12px; bottom:14px; width:44px; height:44px; border-radius:50%; border:0; background:var(--brand); color:var(--on-brand); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.4); opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s var(--ease); }
    .rd-card:hover .rd-card-play, .rd-card:focus-within .rd-card-play, .rd-card-play.on { opacity:1; transform:none; }
    @media (hover:none) { .rd-card-play { opacity:1; transform:none; } }
    .rd-card-body { padding:13px 15px 15px; }
    .rd-card-name { font-weight:800; font-size:16px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-card-desc { font-size:12.5px; color:var(--text-2); margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .rd-card-now { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-2); margin-top:8px; min-width:0; }
    .rd-card-now span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .rd-card-now .rd-eq { color:var(--brand); height:10px; flex-shrink:0; }
    .rd-card-meta { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-3); margin-top:9px; }
    .rd-card-meta .m { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .rd-card-meta .own { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }

    .rd-skel-hero { display:grid; grid-template-columns:232px 1fr; gap:28px; padding:28px; align-items:center; }
    .rd-skel-hero .art { width:232px; aspect-ratio:1; border-radius:var(--r-lg); }
    .rd-skel-hero .ln { height:14px; border-radius:6px; margin-bottom:12px; }
    .rd-skel-card { background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-lg); overflow:hidden; }
    .rd-skel-card .art { aspect-ratio:16/10; border-radius:0; }
    .rd-skel-card .b { padding:14px; }
    .rd-skel-card .ln { height:12px; border-radius:6px; margin-bottom:9px; }
    .rd-empty { text-align:center; padding:56px 20px; background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-xl); color:var(--text-2); }
    .rd-empty svg { color:var(--text-3); margin-bottom:10px; }
    .rd-empty b { display:block; color:var(--text); font-size:17px; margin-bottom:4px; }

    @media (max-width: 1100px) {
      .rd-hero.has-rail .rd-hero-in { grid-template-columns:200px minmax(0,1fr); }
      .rd-hero.has-rail .rd-hero-art { width:200px; }
      .rd-hero.has-rail .rd-rail { grid-column:1 / -1; border-left:0; padding-left:0; border-top:1px solid var(--hair); padding-top:18px; flex-direction:row; gap:24px; }
      .rd-hero.has-rail .rd-rail > div { flex:1; min-width:0; }
    }
    @media (max-width: 700px) {
      .rd-head { margin-bottom:14px; }
      .rd-hero-in, .rd-hero.has-rail .rd-hero-in { grid-template-columns:104px minmax(0,1fr); gap:14px 16px; padding:16px; align-items:start; }
      .rd-hero-art, .rd-hero.has-rail .rd-hero-art { width:104px; }
      .rd-hero-body { display:contents; }
      .rd-hero-top { grid-column:2; align-self:center; min-width:0; }
      .rd-hero-name { font-size:24px; }
      .rd-chips { margin-bottom:7px; gap:6px; }
      .rd-chip { font-size:10px; padding:3px 8px; }
      .rd-chip.shuf { display:none; }
      .rd-hero-desc { font-size:13px; -webkit-line-clamp:2; margin-top:5px; }
      .rd-hero-now, .rd-hero-actions { grid-column:1 / -1; margin-top:0; }
      .rd-hero-actions { margin-top:2px; }
      .rd-hero-actions .rd-cta { flex:1; justify-content:center; }
      .rd-hero-actions .rd-ghost { flex:1; justify-content:center; }
      .rd-by { width:100%; margin:4px 0 0; }
      .rd-hero.has-rail .rd-rail { flex-direction:column; gap:14px; padding-top:14px; }
      .rd-grid { grid-template-columns:1fr; gap:14px; }
      .rd-skel-hero { grid-template-columns:104px 1fr; padding:16px; gap:16px; }
      .rd-skel-hero .art { width:104px; }
      .rd-stats { width:100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rd-dot, .rd-eq i, .rd-chip.live .rd-dot, .rd-badge.live .rd-dot { animation:none !important; }
      .rd-card, .rd-card-cover, .rd-hero-art img, .rd-prog i, .rd-card-prog i { transition:none !important; }
    }
  </style>
  <div class="rd-wrap" id="rd-root">
    <div class="rd-head"><div><h1 class="wv-page-title">Radio</h1><p class="rd-lede">stations play 24/7...tune in and everyone hears the same thing at the same time.</p></div></div>

<div id="rd-fs" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="rd-title" tabindex="-1">
  <style>
    #rd-fs:focus { outline:none; }

    .rd-top-mid { flex:1; min-width:0; text-align:center; }
    .rd-title { font-size:clamp(20px, 2.4vw, 30px); font-weight:900; letter-spacing:-.035em; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 14px rgba(0,0,0,.5); }
    .rd-top-meta { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px; font-size:12.5px; color:rgba(255,255,255,.72); flex-wrap:wrap; min-height:20px; }
