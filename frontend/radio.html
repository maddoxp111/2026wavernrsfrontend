<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — radio</title>
  <link rel="stylesheet" href="/css/style.css?v=202609072109">
</head>
<body>
<div id="view">
  <style>
    .rd-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
    .rd-card { background:var(--surface); border-radius:var(--r-lg); overflow:hidden; cursor:pointer; transition:transform .16s var(--ease); }
    .rd-card:hover { transform:translateY(-2px); }
    .rd-card-art { aspect-ratio:16/9; position:relative; background:linear-gradient(135deg,#3b2a6e,#1a1a24); }
    .rd-card-art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .rd-live { position:absolute; top:10px; left:10px; background:#e0245e; color:#fff; font-size:10px; font-weight:800; letter-spacing:.08em; padding:3px 8px; border-radius:6px; }
    .rd-card-body { padding:12px 14px 14px; }
    .rd-card-name { font-weight:800; font-size:16px; letter-spacing:-.02em; }
    .rd-card-sub { font-size:12.5px; color:var(--text-2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-card-likes { font-size:12px; color:var(--text-3); margin-top:6px; }

    /* station player */
    .rd-stage { position:relative; border-radius:var(--r-lg); overflow:hidden; background:#000; aspect-ratio:16/9; min-height:360px; color:#fff; }
    .rd-bg { position:absolute; inset:0; background-size:cover; background-position:center; filter:blur(28px) brightness(.45) saturate(1.2); transform:scale(1.15); }
    .rd-bg-tint { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.65)); }
    .rd-title { position:absolute; top:18px; left:0; right:0; text-align:center; font-size:clamp(20px, 3.2vw, 40px); font-weight:800; letter-spacing:-.03em; text-shadow:0 2px 12px rgba(0,0,0,.6); padding:0 90px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-left { position:absolute; left:4.5%; top:16%; width:26%; min-width:150px; }
    .rd-cover { width:100%; aspect-ratio:1; border-radius:12px; background:#222; box-shadow:0 10px 40px rgba(0,0,0,.6); overflow:hidden; border:3px solid rgba(255,255,255,.9); }
    .rd-cover img { width:100%; height:100%; object-fit:cover; display:block; }
    .rd-now-title { font-weight:800; font-size:clamp(13px, 1.5vw, 20px); margin-top:12px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 6px rgba(0,0,0,.6); }
    .rd-now-sub { font-size:clamp(10px, 1vw, 13px); color:rgba(255,255,255,.72); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-bar { height:3px; background:rgba(255,255,255,.25); border-radius:2px; margin:8px 0 8px; overflow:hidden; }
    .rd-bar i { display:block; height:100%; width:0; background:#fff; }
    .rd-upnext-label { font-size:9px; letter-spacing:.14em; font-weight:800; color:rgba(255,255,255,.55); margin-bottom:6px; }
    .rd-upnext { display:flex; flex-direction:column; gap:5px; }
    .rd-up { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.35); border-radius:8px; padding:4px 8px 4px 4px; backdrop-filter:blur(6px); }
    .rd-up img, .rd-up .ph { width:26px; height:26px; border-radius:5px; object-fit:cover; background:#444; flex-shrink:0; }
    .rd-up .t { font-size:clamp(9px, .95vw, 12px); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-up .a { font-size:clamp(8px, .8vw, 10px); color:rgba(255,255,255,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-lyrics { position:absolute; left:36%; right:6%; top:16%; bottom:12%; display:flex; flex-direction:column; justify-content:center; gap:10px; overflow:hidden; mask-image:linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); -webkit-mask-image:linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); }
    .rd-lyric { font-size:clamp(14px, 2vw, 26px); font-weight:700; color:rgba(255,255,255,.35); text-shadow:0 1px 8px rgba(0,0,0,.6); transition:color .3s, transform .3s; letter-spacing:-.01em; }
    .rd-lyric.on { color:#fff; transform:scale(1.02); }
    .rd-nolyrics { position:absolute; left:36%; right:6%; top:45%; text-align:center; color:rgba(255,255,255,.45); font-size:14px; }
    .rd-heart { position:absolute; right:18px; bottom:16px; display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.15); color:#fff; border-radius:999px; padding:8px 14px 8px 12px; font-weight:800; font-size:14px; cursor:pointer; user-select:none; -webkit-user-select:none; backdrop-filter:blur(8px); }
    .rd-heart:active { transform:scale(.92); }
    .rd-heart .h { font-size:18px; transition:transform .12s; }
    .rd-heart.pop .h { transform:scale(1.4); }
    .rd-listen { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff; color:#000; border:0; border-radius:999px; padding:14px 26px; font-weight:800; font-size:16px; cursor:pointer; box-shadow:0 8px 30px rgba(0,0,0,.5); }
    .rd-float { position:absolute; pointer-events:none; font-size:22px; animation:rdfloat 1.1s ease-out forwards; }
    @keyframes rdfloat { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-120px) scale(1.6); } }
    @media (max-width: 700px) {
      .rd-stage { aspect-ratio:auto; height:78vh; min-height:520px; }
      .rd-title { padding:0 16px; font-size:20px; top:14px; white-space:normal; }
      .rd-left { left:5%; right:5%; width:auto; top:60px; }
      .rd-cover { width:44%; }
      .rd-lyrics { left:5%; right:5%; top:auto; bottom:18%; height:34%; justify-content:flex-start; }
      .rd-nolyrics { display:none; }
      .rd-upnext { flex-direction:row; flex-wrap:wrap; }
      .rd-up { max-width:48%; }
    }
  </style>
<div class="wv-empty">Loading…</div></div>

<script src="/js/router.js?v=202609072109"></script>
<script src="/js/api.js?v=202609072109"></script>
<script src="/js/layout.js?v=202609072109"></script>
<script src="/js/player.js?v=202609072109"></script>
<script>
var _slug = new URLSearchParams(location.search).get('s');
var _st = null, _now = null, _up = [], _audio = null, _lyrics = null, _lyricTrack = null, _offset = 0, _poll = null, _tick = null, _likes = 0, _pendingLikes = 0, _likeTimer = null, _listening = false;

function fmtN(n) { n = Number(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'K' : String(n); }

async function init() {
  if (_slug) return initStation();
  document.title = 'wavernrs — radio';
  var view = document.getElementById('view');
  try {
    var d = await api('/radio/stations');
    if (!d.available) { view.innerHTML = '<h1 class="wv-page-title">Radio</h1><div class="wv-empty">Radio is not set up yet.</div>'; return; }
    var cards = (d.stations || []).map(function(s) {
      var now = s.now && s.now.track ? s.now.track : null;
      var art = s.cover_url || (now && now.cover_url) || '';
      return '<div class="rd-card" onclick="navigate(\'/radio.html?s=' + encodeURIComponent(s.slug) + '\')">' +
        '<div class="rd-card-art">' + (art ? '<img src="' + escHtml(art) + '" loading="lazy" onerror="this.remove()">' : '') + (s.is_live && now ? '<span class="rd-live">LIVE</span>' : '') + '</div>' +
        '<div class="rd-card-body"><div class="rd-card-name">' + escHtml(s.name) + '</div>' +
        '<div class="rd-card-sub">' + (now ? '▶ ' + escHtml(now.title) + ' · ' + escHtml(now.artist) : 'Off air') + '</div>' +
        '<div class="rd-card-likes">' + (s.owner ? 'by ' + escHtml(s.owner.name) + ' · ' : '') + '♥ ' + fmtN(s.likes) + '</div></div></div>';
    }).join('');
    view.innerHTML = '<h1 class="wv-page-title">Radio</h1><div style="color:var(--text-2);font-size:14px;margin:-6px 0 18px;">Stations run around the clock. Tune in and everyone hears the same thing at the same time.</div>' +
      (cards ? '<div class="rd-grid">' + cards + '</div>' : '<div class="wv-empty">No stations yet.</div>');
  } catch (e) { view.innerHTML = '<div class="wv-empty">Failed: ' + escHtml(e.message) + '</div>'; }
}

async function initStation() {
  var view = document.getElementById('view');
  try {
    var d = await api('/radio/stations/' + encodeURIComponent(_slug));
    _st = d.station; _now = d.now; _up = d.up_next || []; _likes = _st.likes || 0;
    _offset = Date.parse(d.server_time) - Date.now();
    document.title = _st.name + ' — wavernrs radio';
    view.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin:2px 0 10px;flex-wrap:wrap;">' +
        '<a href="/radio.html" onclick="navigate(\'/radio.html\');return false;" style="font-size:13px;color:var(--text-3);text-decoration:none;">← Radio</a>' +
        (d.can_control ? '<a href="/radiopanel.html?s=' + encodeURIComponent(_st.id) + '" class="wv-pill" style="font-size:12px;margin-left:auto;">Manage station</a>' : '') +
      '</div>' +
      '<div class="rd-stage" id="stage">' +
        '<div class="rd-bg" id="rd-bg"></div><div class="rd-bg-tint"></div>' +
        '<div class="rd-title" id="rd-title">' + escHtml(_st.name) + '</div>' +
        '<div class="rd-left">' +
          '<div class="rd-cover" id="rd-cover"></div>' +
          '<div class="rd-now-title" id="rd-now-title">—</div>' +
          '<div class="rd-now-sub" id="rd-now-sub"></div>' +
          '<div class="rd-bar"><i id="rd-bar"></i></div>' +
          '<div class="rd-upnext-label">UP NEXT</div>' +
          '<div class="rd-upnext" id="rd-upnext"></div>' +
        '</div>' +
        '<div class="rd-lyrics" id="rd-lyrics"></div>' +
        '<div class="rd-nolyrics" id="rd-nolyrics" style="display:none;"></div>' +
        '<button class="rd-listen" id="rd-listen" onclick="tuneIn()">▶ Tune in</button>' +
        '<div class="rd-heart" id="rd-heart" onclick="likeTap(event)"><span class="h">♥</span><span id="rd-likes">' + fmtN(_likes) + '</span></div>' +
      '</div>' +
      (_st.description ? '<div style="margin-top:14px;color:var(--text-2);font-size:14px;line-height:1.6;">' + escHtml(_st.description) + '</div>' : '') +
      (_st.owner ? '<div style="margin-top:8px;font-size:13px;color:var(--text-3);">Station by <a href="/artist.html?id=' + escHtml(_st.owner.artist_id) + '" style="color:var(--brand);font-weight:600;">' + escHtml(_st.owner.name) + '</a></div>' : '');
    renderNow();
    if (typeof window.radioSlug === 'function' && window.radioSlug() === _slug) { _listening = true; document.getElementById('rd-listen').style.display = 'none'; }
    _poll = setInterval(pollNow, 8000);
    _tick = setInterval(tickUI, 250);
  } catch (e) { view.innerHTML = '<div class="wv-empty">' + escHtml(e.message) + '</div>'; }
}

function serverNow() { return Date.now() + _offset; }
function posSec() { if (!_now) return 0; return Math.max(0, (serverNow() - Date.parse(_now.started_at)) / 1000); }
function durSec() { if (!_now) return 0; return Math.max(1, (Date.parse(_now.ends_at) - Date.parse(_now.started_at)) / 1000); }

function renderNow() {
  var t = _now && _now.track;
  var cover = document.getElementById('rd-cover');
  var art = (t && t.cover_url) || _st.cover_url || '';
  cover.innerHTML = art ? '<img src="' + escHtml(art) + '" onerror="this.remove()">' : '';
  document.getElementById('rd-bg').style.backgroundImage = art ? 'url("' + art.replace(/"/g, '%22') + '")' : '';
  document.getElementById('rd-now-title').textContent = t ? t.title : 'Off air';
  document.getElementById('rd-now-sub').textContent = t ? (t.artist + (t.album_title && t.album_title !== t.title ? ' — ' + t.album_title : '')) : (_st.name + ' has nothing scheduled right now');
  document.getElementById('rd-upnext').innerHTML = _up.slice(0, 5).map(function(u) {
    return '<div class="rd-up">' + (u.track.cover_url ? '<img src="' + escHtml(u.track.cover_url) + '" onerror="this.outerHTML=\'<span class=ph></span>\'">' : '<span class="ph"></span>') + '<div style="min-width:0;"><div class="t">' + escHtml(u.track.title) + '</div><div class="a">' + escHtml(u.track.artist) + '</div></div></div>';
  }).join('');
  if (t && t.id !== _lyricTrack) { _lyricTrack = t.id; loadLyrics(t.id); }
  if (!t) { document.getElementById('rd-lyrics').innerHTML = ''; }
  if (_listening) syncAudio(true);
}

async function loadLyrics(trackId) {
  _lyrics = null;
  var box = document.getElementById('rd-lyrics'), none = document.getElementById('rd-nolyrics');
  box.innerHTML = ''; none.style.display = 'none';
  try {
    var d = await api('/lyrics/' + trackId);
    if (_lyricTrack !== trackId) return;
    var lines = (d && (d.lines || (d.lyrics && d.lyrics.lines))) || [];
    if (!lines.length) { none.style.display = ''; none.textContent = ''; return; }
    _lyrics = lines;
    box.innerHTML = lines.map(function(l, i) { return '<div class="rd-lyric" data-i="' + i + '">' + escHtml(l.x || l.text || '') + '</div>'; }).join('');
  } catch (e) { none.style.display = 'none'; }
}

function tickUI() {
  if (!_now) return;
  var p = posSec(), d = durSec();
  document.getElementById('rd-bar').style.width = Math.min(100, p / d * 100) + '%';
  if (_lyrics) {
    var idx = -1;
    for (var i = 0; i < _lyrics.length; i++) { if (Number(_lyrics[i].t) <= p) idx = i; else break; }
    var box = document.getElementById('rd-lyrics');
    var cur = box.querySelector('.rd-lyric.on');
    var want = idx >= 0 ? box.querySelector('.rd-lyric[data-i="' + idx + '"]') : null;
    if (cur !== want) {
      if (cur) cur.classList.remove('on');
      if (want) { want.classList.add('on'); var off = want.offsetTop - box.clientHeight / 2 + want.offsetHeight / 2; box.scrollTo({ top: off, behavior: 'smooth' }); }
    }
  }
  if (p > d + 2) pollNow();
}

async function pollNow() {
  try {
    var d = await api('/radio/stations/' + encodeURIComponent(_slug) + '/now');
    _offset = Date.parse(d.server_time) - Date.now();
    var changed = !_now !== !d.now || (_now && d.now && (_now.track.id !== d.now.track.id || _now.started_at !== d.now.started_at));
    _now = d.now; _up = d.up_next || [];
    if (d.likes != null && !_pendingLikes) { _likes = d.likes; document.getElementById('rd-likes').textContent = fmtN(_likes); }
    if (d.name && d.name !== _st.name) { _st.name = d.name; document.getElementById('rd-title').textContent = d.name; document.title = d.name + ' — wavernrs radio'; }
    if (changed) renderNow(); else { document.getElementById('rd-upnext').innerHTML = document.getElementById('rd-upnext').innerHTML; }
  } catch (e) {}
}

function tuneIn() {
  _listening = true;
  document.getElementById('rd-listen').style.display = 'none';
  if (typeof window.radioTuneIn === 'function') window.radioTuneIn(_slug);
}

function syncAudio() {}

function likeTap(ev) {
  _likes++; _pendingLikes++;
  var el = document.getElementById('rd-likes'); el.textContent = fmtN(_likes);
  var h = document.getElementById('rd-heart'); h.classList.add('pop'); setTimeout(function() { h.classList.remove('pop'); }, 130);
  var f = document.createElement('div'); f.className = 'rd-float'; f.textContent = '♥';
  var st = document.getElementById('stage').getBoundingClientRect();
  f.style.left = (ev.clientX - st.left - 10 + (Math.random() * 30 - 15)) + 'px'; f.style.top = (ev.clientY - st.top - 12) + 'px';
  document.getElementById('stage').appendChild(f); setTimeout(function() { f.remove(); }, 1100);
  clearTimeout(_likeTimer);
  _likeTimer = setTimeout(flushLikes, 700);
}
async function flushLikes() {
  var n = _pendingLikes; if (!n) return; _pendingLikes = 0;
  try { var d = await api('/radio/stations/' + encodeURIComponent(_slug) + '/like', { method: 'POST', body: JSON.stringify({ n: n }) }); if (d.likes != null && !_pendingLikes) { _likes = d.likes; document.getElementById('rd-likes').textContent = fmtN(_likes); } } catch (e) {}
}

window.addEventListener('pagehide', function() { clearInterval(_poll); clearInterval(_tick); });
if (window._pageCleanup) window._pageCleanup.push(function() { clearInterval(_poll); clearInterval(_tick); });
init();
</script>
</body>
</html>
