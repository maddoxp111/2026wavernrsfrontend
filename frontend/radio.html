<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — radio</title>
  <link rel="stylesheet" href="/css/style.css?v=202609072132">
</head>
<body>
<div id="view">
  <style>
    .rd-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
    .rd-card { background:var(--surface); border-radius:var(--r-lg); overflow:hidden; cursor:pointer; transition:transform .16s var(--ease); }
    .rd-card:hover { transform:translateY(-2px); }
    .rd-card-art { aspect-ratio:16/9; position:relative; background:linear-gradient(135deg,#3b2a6e,#1a1a24); }
    .rd-card-art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .rd-live { position:absolute; top:10px; left:10px; background:#e0245e; color:#fff; font-size:10px; font-weight:800; letter-spacing:.08em; padding:3px 8px; border-radius:6px; }
    .rd-on { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.6); color:#fff; font-size:10px; font-weight:800; letter-spacing:.06em; padding:3px 8px; border-radius:6px; }
    .rd-card-body { padding:12px 14px 14px; }
    .rd-card-name { font-weight:800; font-size:16px; letter-spacing:-.02em; }
    .rd-card-sub { font-size:12.5px; color:var(--text-2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-card-likes { font-size:12px; color:var(--text-3); margin-top:6px; }
  </style>
  <div class="wv-empty">Loading…</div>
</div>

<div id="rd-fs" style="display:none;">
  <style>
    #rd-fs { position:fixed; inset:0; z-index:250; background:#000; color:#fff; overflow:hidden; font-family:inherit; }
    .rd-bg { position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(34px) brightness(.42) saturate(1.2); transform:scale(1.08); }
    .rd-bg-tint { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.7)); }
    .rd-top { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; padding:calc(14px + env(safe-area-inset-top)) 18px 0; z-index:3; }
    .rd-close { width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.12); color:#fff; font-size:22px; cursor:pointer; flex-shrink:0; }
    .rd-title { flex:1; text-align:center; font-size:clamp(20px, 3vw, 38px); font-weight:800; letter-spacing:-.03em; text-shadow:0 2px 12px rgba(0,0,0,.6); padding:0 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-tools { display:flex; gap:8px; flex-shrink:0; }
    .rd-pill { border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.4); color:#fff; border-radius:999px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; backdrop-filter:blur(8px); }
    .rd-pill.on { background:#fff; color:#000; }
    .rd-left { position:absolute; left:5%; top:14%; width:26%; min-width:170px; z-index:2; }
    .rd-cover { width:100%; aspect-ratio:1; border-radius:14px; background:#222; box-shadow:0 12px 44px rgba(0,0,0,.6); overflow:hidden; border:3px solid rgba(255,255,255,.9); }
    .rd-cover img { width:100%; height:100%; object-fit:cover; display:block; }
    .rd-now-title { font-weight:800; font-size:clamp(14px, 1.6vw, 22px); margin-top:14px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 6px rgba(0,0,0,.6); }
    .rd-now-sub { font-size:clamp(11px, 1.05vw, 14px); color:rgba(255,255,255,.72); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-bar { height:3px; background:rgba(255,255,255,.25); border-radius:2px; margin:10px 0; overflow:hidden; }
    .rd-bar i { display:block; height:100%; width:0; background:#fff; }
    .rd-upnext-label { font-size:9.5px; letter-spacing:.14em; font-weight:800; color:rgba(255,255,255,.55); margin-bottom:6px; }
    .rd-upnext { display:flex; flex-direction:column; gap:6px; }
    .rd-up { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.38); border-radius:9px; padding:5px 9px 5px 5px; backdrop-filter:blur(6px); }
    .rd-up img, .rd-up .ph { width:30px; height:30px; border-radius:6px; object-fit:cover; background:#444; flex-shrink:0; }
    .rd-up .t { font-size:clamp(10px, 1vw, 13px); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-up .a { font-size:clamp(9px, .85vw, 11px); color:rgba(255,255,255,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rd-lyrics { position:absolute; left:36%; right:6%; top:16%; bottom:14%; display:none; flex-direction:column; justify-content:center; gap:12px; overflow:hidden; z-index:2; mask-image:linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); -webkit-mask-image:linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); }
    .rd-lyrics.on { display:flex; }
    .rd-lyric { font-size:clamp(15px, 2.1vw, 28px); font-weight:700; color:rgba(255,255,255,.35); text-shadow:0 1px 8px rgba(0,0,0,.6); transition:color .3s, transform .3s; letter-spacing:-.01em; }
    .rd-lyric.on { color:#fff; transform:scale(1.02); }
    .rd-lyrics .rd-empty { color:rgba(255,255,255,.5); font-size:14px; text-align:center; }
    .rd-heart { position:absolute; right:22px; bottom:calc(22px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.15); color:#fff; border-radius:999px; padding:10px 16px 10px 14px; font-weight:800; font-size:15px; cursor:pointer; user-select:none; -webkit-user-select:none; backdrop-filter:blur(8px); z-index:3; }
    .rd-heart:active { transform:scale(.92); }
    .rd-heart .h { font-size:19px; transition:transform .12s; }
    .rd-heart.pop .h { transform:scale(1.4); }
    .rd-listen { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff; color:#000; border:0; border-radius:999px; padding:16px 30px; font-weight:800; font-size:17px; cursor:pointer; box-shadow:0 8px 30px rgba(0,0,0,.5); z-index:3; }
    .rd-float { position:absolute; pointer-events:none; font-size:24px; z-index:4; animation:rdfloat 1.1s ease-out forwards; }
    @keyframes rdfloat { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-140px) scale(1.6); } }
    .rd-foot { position:absolute; left:22px; bottom:calc(22px + env(safe-area-inset-bottom)); font-size:12.5px; color:rgba(255,255,255,.6); z-index:3; }
    .rd-foot a { color:#fff; font-weight:700; text-decoration:none; }
    @media (max-width: 700px) {
      .rd-title { font-size:18px; }
      .rd-left { left:6%; right:6%; width:auto; top:80px; }
      .rd-cover { width:52%; }
      .rd-lyrics { left:6%; right:6%; top:auto; bottom:22%; height:32%; justify-content:flex-start; }
      .rd-upnext { flex-direction:row; flex-wrap:wrap; }
      .rd-up { max-width:48%; }
      .rd-foot { display:none; }
    }
  </style>
  <div class="rd-bg" id="rd-bg"></div><div class="rd-bg-tint"></div>
  <div class="rd-top">
    <button class="rd-close" onclick="closeStation()" aria-label="Back to radio">⌄</button>
    <div class="rd-title" id="rd-title"></div>
    <div class="rd-tools"><button class="rd-pill" id="rd-lyr-btn" onclick="toggleRadioLyrics()">Lyrics</button><button class="rd-pill" onclick="shareStation()">Share</button></div>
  </div>
  <div class="rd-left">
    <div class="rd-cover" id="rd-cover"></div>
    <div class="rd-now-title" id="rd-now-title">—</div>
    <div class="rd-now-sub" id="rd-now-sub"></div>
    <div class="rd-bar"><i id="rd-bar"></i></div>
    <div class="rd-upnext-label">UP NEXT</div>
    <div class="rd-upnext" id="rd-upnext"></div>
  </div>
  <div class="rd-lyrics" id="rd-lyrics"></div>
  <button class="rd-listen" id="rd-listen" onclick="tuneIn()">▶ Tune in</button>
  <div class="rd-heart" id="rd-heart" onclick="likeTap(event)"><span class="h">♥</span><span id="rd-likes">0</span></div>
  <div class="rd-foot" id="rd-foot"></div>
</div>

<script src="/js/router.js?v=202609072132"></script>
<script src="/js/api.js?v=202609072132"></script>
<script src="/js/layout.js?v=202609072132"></script>
<script src="/js/player.js?v=202609072132"></script>
<script>
var _slug = null, _st = null, _now = null, _up = [], _lyrics = null, _lyricTrack = null, _lyricsOn = false, _offset = 0, _poll = null, _tick = null, _likes = 0, _pendingLikes = 0, _likeTimer = null, _listening = false, _stations = [];

function fmtN(n) { n = Number(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'K' : String(n); }
function setView(html) { var v = document.getElementById('view'); var st = v.querySelector('style'); v.innerHTML = (st ? st.outerHTML : '') + html; }
function fsEl() { return document.getElementById('rd-fs'); }

async function init() {
  document.title = 'wavernrs — radio';
  await loadList();
  var s = new URLSearchParams(location.search).get('s');
  if (s) openStation(s);
}

async function loadList() {
  try {
    var d = await api('/radio/stations');
    _stations = d.stations || [];
    if (!d.available) { setView('<h1 class="wv-page-title">Radio</h1><div class="wv-empty">Radio is not set up yet.</div>'); return; }
    var on = typeof window.radioSlug === 'function' ? window.radioSlug() : null;
    var cards = _stations.map(function(s) {
      var now = s.now && s.now.track ? s.now.track : null;
      var art = s.cover_url || (now && now.cover_url) || '';
      return '<div class="rd-card" onclick="openStation(\'' + encodeURIComponent(s.slug) + '\')">' +
        '<div class="rd-card-art">' + (art ? '<img src="' + escHtml(art) + '" loading="lazy" onerror="this.remove()">' : '') + (s.is_live && now ? '<span class="rd-live">LIVE</span>' : '') + (on === s.slug ? '<span class="rd-on">▶ LISTENING</span>' : '') + '</div>' +
        '<div class="rd-card-body"><div class="rd-card-name">' + escHtml(s.name) + '</div>' +
        '<div class="rd-card-sub">' + (now ? '▶ ' + escHtml(now.title) + ' · ' + escHtml(now.artist) : 'Off air') + '</div>' +
        '<div class="rd-card-likes">' + (s.owner ? 'by ' + escHtml(s.owner.name) + ' · ' : '') + '♥ ' + fmtN(s.likes) + '</div></div></div>';
    }).join('');
    setView('<h1 class="wv-page-title">Radio</h1><div style="color:var(--text-2);font-size:14px;margin:-6px 0 18px;">Stations run around the clock. Tune in and everyone hears the same thing at the same time.</div>' +
      (cards ? '<div class="rd-grid">' + cards + '</div>' : '<div class="wv-empty">No stations yet.</div>'));
  } catch (e) { setView('<div class="wv-empty">Failed: ' + escHtml(e.message) + '</div>'); }
}

async function openStation(slug) {
  slug = decodeURIComponent(slug);
  _slug = slug; _lyrics = null; _lyricTrack = null; _lyricsOn = false; _now = null; _up = [];
  var fs = fsEl(); fs.style.display = ''; document.body.style.overflow = 'hidden';
  document.getElementById('rd-lyrics').classList.remove('on'); document.getElementById('rd-lyr-btn').classList.remove('on');
  history.replaceState(null, '', '/radio.html?s=' + encodeURIComponent(slug));
  try {
    var d = await api('/radio/stations/' + encodeURIComponent(slug));
    if (_slug !== slug) return;
    _st = d.station; _now = d.now; _up = d.up_next || []; _likes = _st.likes || 0;
    _offset = Date.parse(d.server_time) - Date.now();
    document.title = _st.name + ' — wavernrs radio';
    document.getElementById('rd-title').textContent = _st.name;
    document.getElementById('rd-likes').textContent = fmtN(_likes);
    document.getElementById('rd-foot').innerHTML = (_st.owner ? 'Station by <a href="/artist.html?id=' + escHtml(_st.owner.artist_id) + '">' + escHtml(_st.owner.name) + '</a>' : '') + (d.can_control ? ' · <a href="/radiopanel.html?s=' + encodeURIComponent(_st.id) + '">Manage</a>' : '');
    _listening = typeof window.radioSlug === 'function' && window.radioSlug() === slug;
    document.getElementById('rd-listen').style.display = _listening ? 'none' : '';
    renderNow();
    clearInterval(_poll); clearInterval(_tick);
    _poll = setInterval(pollNow, 8000);
    _tick = setInterval(tickUI, 250);
  } catch (e) { document.getElementById('rd-title').textContent = e.message; }
}

function closeStation() {
  var fs = fsEl(); fs.style.display = 'none'; document.body.style.overflow = '';
  clearInterval(_poll); clearInterval(_tick); _poll = _tick = null;
  history.replaceState(null, '', '/radio.html');
  document.title = 'wavernrs — radio';
  loadList();
}
function shareStation() { var u = location.origin + '/radio.html?s=' + encodeURIComponent(_slug); if (navigator.share) navigator.share({ title: _st ? _st.name : 'wavernrs radio', url: u }).catch(function() {}); else { navigator.clipboard && navigator.clipboard.writeText(u); } }

function serverNow() { return Date.now() + _offset; }
function posSec() { if (!_now) return 0; return Math.max(0, (serverNow() - Date.parse(_now.started_at)) / 1000); }
function durSec() { if (!_now) return 0; return Math.max(1, (Date.parse(_now.ends_at) - Date.parse(_now.started_at)) / 1000); }

function renderNow() {
  var t = _now && _now.track;
  var art = (t && t.cover_url) || (_st && _st.cover_url) || '';
  document.getElementById('rd-cover').innerHTML = art ? '<img src="' + escHtml(art) + '" onerror="this.remove()">' : '';
  document.getElementById('rd-bg').style.backgroundImage = art ? 'url("' + art.replace(/"/g, '%22') + '")' : '';
  document.getElementById('rd-now-title').textContent = t ? t.title : 'Off air';
  document.getElementById('rd-now-sub').textContent = t ? (t.artist + (t.album_title && t.album_title !== t.title ? ' — ' + t.album_title : '')) : ((_st ? _st.name : 'This station') + ' has nothing scheduled right now');
  document.getElementById('rd-upnext').innerHTML = _up.slice(0, 5).map(function(u) {
    return '<div class="rd-up">' + (u.track.cover_url ? '<img src="' + escHtml(u.track.cover_url) + '" onerror="this.outerHTML=\'<span class=ph></span>\'">' : '<span class="ph"></span>') + '<div style="min-width:0;"><div class="t">' + escHtml(u.track.title) + '</div><div class="a">' + escHtml(u.track.artist) + '</div></div></div>';
  }).join('');
  if (t && t.id !== _lyricTrack) { _lyricTrack = t.id; _lyrics = null; document.getElementById('rd-lyrics').innerHTML = ''; if (_lyricsOn) loadLyrics(t.id); }
  if (!t) document.getElementById('rd-lyrics').innerHTML = '';
}

function toggleRadioLyrics() {
  _lyricsOn = !_lyricsOn;
  document.getElementById('rd-lyrics').classList.toggle('on', _lyricsOn);
  document.getElementById('rd-lyr-btn').classList.toggle('on', _lyricsOn);
  if (_lyricsOn && _lyricTrack && !_lyrics) loadLyrics(_lyricTrack);
}

async function loadLyrics(trackId) {
  var box = document.getElementById('rd-lyrics');
  box.innerHTML = '<div class="rd-empty">Loading lyrics…</div>';
  try {
    var d = await api('/lyrics/' + trackId);
    if (_lyricTrack !== trackId) return;
    var lines = (d && d.lines) || [];
    if (!lines.length) { box.innerHTML = '<div class="rd-empty">No lyrics for this one yet.</div>'; return; }
    _lyrics = lines;
    box.innerHTML = lines.map(function(l, i) { return '<div class="rd-lyric" data-i="' + i + '">' + escHtml(l.x || l.text || '') + '</div>'; }).join('');
  } catch (e) { box.innerHTML = ''; }
}

function tickUI() {
  if (!_now) return;
  var p = posSec(), d = durSec();
  document.getElementById('rd-bar').style.width = Math.min(100, p / d * 100) + '%';
  if (_lyrics && _lyricsOn) {
    var idx = -1;
    for (var i = 0; i < _lyrics.length; i++) { if (Number(_lyrics[i].t) <= p) idx = i; else break; }
    var box = document.getElementById('rd-lyrics');
    var cur = box.querySelector('.rd-lyric.on');
    var want = idx >= 0 ? box.querySelector('.rd-lyric[data-i="' + idx + '"]') : null;
    if (cur !== want) {
      if (cur) cur.classList.remove('on');
      if (want) { want.classList.add('on'); var off = want.offsetTop - box.clientHeight / 2 + want.offsetHeight / 2; box.scrollTo({ top: off, behavior: 'smooth' }); }
    }
  }
  if (p > d + 2) pollNow();
}

async function pollNow() {
  if (!_slug) return;
  try {
    var d = await api('/radio/stations/' + encodeURIComponent(_slug) + '/now');
    _offset = Date.parse(d.server_time) - Date.now();
    var changed = !_now !== !d.now || (_now && d.now && (_now.track.id !== d.now.track.id || _now.started_at !== d.now.started_at));
    _now = d.now; _up = d.up_next || [];
    if (d.likes != null && !_pendingLikes) { _likes = d.likes; document.getElementById('rd-likes').textContent = fmtN(_likes); }
    if (d.name && _st && d.name !== _st.name) { _st.name = d.name; document.getElementById('rd-title').textContent = d.name; }
    if (changed) renderNow();
    var on = typeof window.radioSlug === 'function' && window.radioSlug() === _slug;
    _listening = on; document.getElementById('rd-listen').style.display = on ? 'none' : '';
  } catch (e) {}
}

function tuneIn() {
  _listening = true;
  document.getElementById('rd-listen').style.display = 'none';
  if (typeof window.radioTuneIn === 'function') window.radioTuneIn(_slug);
}

function likeTap(ev) {
  _likes++; _pendingLikes++;
  document.getElementById('rd-likes').textContent = fmtN(_likes);
  var h = document.getElementById('rd-heart'); h.classList.add('pop'); setTimeout(function() { h.classList.remove('pop'); }, 130);
  var f = document.createElement('div'); f.className = 'rd-float'; f.textContent = '♥';
  f.style.left = (ev.clientX - 10 + (Math.random() * 30 - 15)) + 'px'; f.style.top = (ev.clientY - 12) + 'px';
  fsEl().appendChild(f); setTimeout(function() { f.remove(); }, 1100);
  clearTimeout(_likeTimer);
  _likeTimer = setTimeout(flushLikes, 700);
}
async function flushLikes() {
  var n = _pendingLikes; if (!n) return; _pendingLikes = 0;
  try { var d = await api('/radio/stations/' + encodeURIComponent(_slug) + '/like', { method: 'POST', body: JSON.stringify({ n: n }) }); if (d.likes != null && !_pendingLikes) { _likes = d.likes; document.getElementById('rd-likes').textContent = fmtN(_likes); } } catch (e) {}
}

if (window._pageCleanup) window._pageCleanup.push(function() { clearInterval(_poll); clearInterval(_tick); var fs = fsEl(); if (fs) fs.remove(); document.body.style.overflow = ''; });
init();
</script>
</body>
</html>
