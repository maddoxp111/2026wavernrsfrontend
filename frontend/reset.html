<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — reset password</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/x-icon" href="/icon.ico">
</head>
<body>
<div class="wv-auth-page theme-light" id="auth-root">
  <div class="wv-auth-card wv-card">
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.04em;color:var(--brand);margin-bottom:24px;">wavernrs</div>
    <div class="wv-auth-title">Set new password</div>
    <div class="wv-auth-sub" id="auth-sub">Choose a new password for your account</div>

    <div id="alert-container"></div>

    <div id="form-container">
      <div class="wv-form-field">
        <label class="wv-form-label" for="password">New password</label>
        <input class="wv-input" type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password">
      </div>
      <div class="wv-form-field">
        <label class="wv-form-label" for="password2">Confirm new password</label>
        <input class="wv-input" type="password" id="password2" placeholder="••••••••" autocomplete="new-password">
      </div>

      <button class="wv-pill brand" style="width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:8px;" id="submit-btn" onclick="doReset()">Set password</button>
    </div>

    <div id="success-container" style="display:none;text-align:center;padding:20px 0;">
      <div style="font-size:32px;margin-bottom:12px;">✅</div>
      <div style="font-weight:600;margin-bottom:6px;">Password updated!</div>
      <div style="font-size:13px;color:var(--text-2);">You can now log in with your new password.</div>
      <a href="/login.html" class="wv-pill brand" style="display:inline-flex;margin-top:20px;padding:10px 24px;">Log in</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  var _t = localStorage.getItem('wv-theme') || 'light';
  document.getElementById('auth-root').className = 'wv-auth-page theme-' + _t;

  var token = new URLSearchParams(location.search).get('token');
  if (!token) {
    document.getElementById('auth-sub').textContent = 'Invalid or expired reset link.';
    document.getElementById('form-container').style.display = 'none';
  }

  document.getElementById('password2').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doReset();
  });

  async function doReset() {
    var password = document.getElementById('password').value;
    var password2 = document.getElementById('password2').value;
    var alertEl = document.getElementById('alert-container');
    alertEl.innerHTML = '';

    if (!password || !password2) {
      alertEl.innerHTML = '<div class="wv-form-error">Please fill in both fields</div>';
      return;
    }
    if (password !== password2) {
      alertEl.innerHTML = '<div class="wv-form-error">Passwords do not match</div>';
      return;
    }
    if (password.length < 6) {
      alertEl.innerHTML = '<div class="wv-form-error">Password must be at least 6 characters</div>';
      return;
    }

    var btn = document.getElementById('submit-btn');
    btn.textContent = 'Saving…';
    btn.disabled = true;

    try {
      await api('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ token, password }),
      });
      document.getElementById('form-container').style.display = 'none';
      document.getElementById('success-container').style.display = 'block';
    } catch (err) {
      alertEl.innerHTML = '<div class="wv-form-error">' + (err.message || 'Reset failed. The link may have expired.') + '</div>';
      btn.textContent = 'Set password';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
