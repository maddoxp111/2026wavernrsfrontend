<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — playlists</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/discover.html">Discover</a>
    <a href="/charts.html">Charts</a>
    <a href="/playlists.html" class="active">Playlists</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();navSearch(q);}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="view">
<div class="container" style="max-width:900px;padding-top:32px;padding-bottom:48px;">

  <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap;">
    <h1 class="page-title" style="margin:0;">My Playlists</h1>
    <button class="btn btn-primary" onclick="toggleNewForm()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      New Playlist
    </button>
  </div>

  <!-- New playlist form -->
  <div id="new-pl-form" style="display:none;margin-bottom:28px;">
    <div class="card" style="padding:20px;max-width:480px;">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="new-pl-title" placeholder="Name your playlist…"
          onkeydown="if(event.key==='Enter')createPlaylist()">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="new-pl-desc" rows="2" placeholder="Optional…" style="min-height:42px;"></textarea>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="new-pl-public" checked> Public
        </label>
      </div>
      <div id="new-pl-alert" style="margin-top:8px;"></div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn-primary" onclick="createPlaylist()">Create</button>
        <button class="btn btn-secondary" onclick="toggleNewForm()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="playlists-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>

</div>
</div><!-- /view -->

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg></span>
    <span>Discover</span>
  </a>
  <a href="/charts.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></span>
    <span>Charts</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item">

    <span>Dashboard</span>
  </a>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script src="/js/playlists.js"></script>
<script>
  updateNav();
  initPlayer();

  var playlists = [];

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadPlaylists() {
    var el = document.getElementById('playlists-container');
    if (!isLoggedIn()) {
      el.innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon">🎵</div>' +
        '<div class="empty-title">Sign in to see your playlists</div>' +
        '<a href="/login.html" class="btn btn-primary" style="margin-top:16px;">Log in</a>' +
        '</div>';
      return;
    }
    try {
      playlists = await api('/playlists/mine');
      renderPlaylists();
    } catch (err) {
      el.innerHTML = '<div class="empty-state"><div class="empty-title">Could not load playlists</div></div>';
    }
  }

  function renderPlaylists() {
    var el = document.getElementById('playlists-container');
    if (!playlists.length) {
      el.innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon">🎵</div>' +
        '<div class="empty-title">No playlists yet</div>' +
        '<div class="empty-desc">Create your first playlist above.</div>' +
        '</div>';
      return;
    }

    el.innerHTML = '<div class="track-list">' +
      playlists.map(function(p, i) {
        var cnt = p.track_count || 0;
        var sub = cnt + ' track' + (cnt !== 1 ? 's' : '') + (p.is_public ? '' : ' · 🔒 Private');
        return '<div class="track-row" onclick="navigate(\'/playlist.html?id=' + p.id + '\')" style="cursor:pointer;">' +
          '<div class="track-row-cover" style="display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--purple-bg);">🎵</div>' +
          '<div class="track-row-info">' +
            '<div class="track-row-title">' + escHtml(p.title) + '</div>' +
            '<div class="track-row-artist">' + escHtml(sub) + '</div>' +
          '</div>' +
          '<a href="/playlist.html?id=' + p.id + '" onclick="event.stopPropagation()" class="btn btn-secondary btn-sm">Open</a>' +
          '<button onclick="event.stopPropagation();deletePlaylist(\'' + p.id + '\',' + i + ')" class="btn btn-danger btn-sm">Delete</button>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  function toggleNewForm() {
    var f = document.getElementById('new-pl-form');
    if (!f) return;
    var visible = f.style.display !== 'none';
    f.style.display = visible ? 'none' : '';
    if (!visible) setTimeout(function() {
      var inp = document.getElementById('new-pl-title');
      if (inp) inp.focus();
    }, 50);
  }

  async function createPlaylist() {
    var titleEl = document.getElementById('new-pl-title');
    var title = titleEl ? titleEl.value.trim() : '';
    if (!title) {
      var a = document.getElementById('new-pl-alert');
      if (a) a.innerHTML = '<span style="color:#f87171;">Name is required</span>';
      return;
    }
    var desc = document.getElementById('new-pl-desc') ? document.getElementById('new-pl-desc').value.trim() : '';
    var isPublic = document.getElementById('new-pl-public') ? document.getElementById('new-pl-public').checked : true;
    try {
      var pl = await api('/playlists', {
        method: 'POST',
        body: JSON.stringify({ title: title, description: desc || null, is_public: isPublic }),
      });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
      navigate('/playlist.html?id=' + pl.id);
    } catch (err) {
      var a = document.getElementById('new-pl-alert');
      if (a) a.innerHTML = '<span style="color:#f87171;">' + escHtml(err.message || 'Failed') + '</span>';
    }
  }

  async function deletePlaylist(id, index) {
    if (!confirm('Delete this playlist?')) return;
    try {
      await api('/playlists/' + id, { method: 'DELETE' });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
      playlists.splice(index, 1);
      renderPlaylists();
    } catch (err) {
      alert('Failed to delete: ' + (err.message || 'error'));
    }
  }

  loadPlaylists();
</script>
</body>
</html>
