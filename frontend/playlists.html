<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — playlists</title>
  <link rel="stylesheet" href="/css/style.css?v=202609051937">
</head>
<body>

<div id="view">

  <div style="display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap;">
    <h1 class="wv-page-title">My Playlists</h1>
    <button class="btn btn-primary" onclick="toggleNewForm()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      New Playlist
    </button>
  </div>

  <!-- New playlist form -->
  <div id="new-pl-form" style="display:none;margin-bottom:28px;">
    <div class="card" style="padding:20px;max-width:480px;">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="new-pl-title" placeholder="Name your playlist…"
          onkeydown="if(event.key==='Enter')createPlaylist()">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="new-pl-desc" rows="2" placeholder="Optional…" style="min-height:42px;"></textarea>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="new-pl-public" checked> Public
        </label>
      </div>
      <div id="new-pl-alert" style="margin-top:8px;"></div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn-primary" onclick="createPlaylist()">Create</button>
        <button class="btn btn-secondary" onclick="toggleNewForm()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="playlists-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>

</div><!-- /view -->

<script src="/js/api.js?v=202609051937"></script>
<script src="/js/layout.js?v=202609051937"></script>
<script src="/js/player.js?v=202609051937"></script>
<script src="/js/router.js?v=202609051937"></script>
<script src="/js/playlists.js?v=202609051937"></script>
<script>
  initPlayer();

  var playlists = [];

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadPlaylists() {
    var el = document.getElementById('playlists-container');
    if (!isLoggedIn()) {
      el.innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon">🎵</div>' +
        '<div class="empty-title">Sign in to see your playlists</div>' +
        '<a href="/login.html" class="btn btn-primary" style="margin-top:16px;">Log in</a>' +
        '</div>';
      return;
    }
    try {
      playlists = await api('/playlists/mine');
      // Background from logged-in user's profile picture.
      if (typeof window.setPageBgImage === 'function') {
        api('/auth/me').then(function(me) {
          var img = me && me.artist && (me.artist.profile_image_url || me.artist.banner_url);
          window.setPageBgImage(img || '');
        }).catch(function() {});
      }
      renderPlaylists();
    } catch (err) {
      el.innerHTML = '<div class="empty-state"><div class="empty-title">Could not load playlists</div></div>';
    }
  }

  function renderPlaylists() {
    var el = document.getElementById('playlists-container');
    if (!playlists.length) {
      el.innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon">🎵</div>' +
        '<div class="empty-title">No playlists yet</div>' +
        '<div class="empty-desc">Create your first playlist above.</div>' +
        '</div>';
      return;
    }

    el.innerHTML = '<div class="wv-pl-grid">' +
      playlists.map(function(p, i) {
        var cnt = p.track_count || 0;
        var meta = cnt + ' track' + (cnt !== 1 ? 's' : '') + (p.is_public ? '' : ' · 🔒 Private');
        return '<div class="wv-playlist-card" onclick="navigate(\'/playlist.html?id=' + p.id + '\')">' +
          '<div class="wv-playlist-cover" style="background:' + coverGradient(p.title || '') + ';"></div>' +
          '<div class="wv-playlist-name">' + escHtml(p.title) + '</div>' +
          '<div class="wv-playlist-meta">' + escHtml(meta) + '</div>' +
          '<div class="wv-pl-card-actions" onclick="event.stopPropagation()">' +
            '<a href="/playlist.html?id=' + p.id + '" class="btn btn-secondary btn-sm" onclick="event.stopPropagation();navigate(\'/playlist.html?id=' + p.id + '\');return false;">Open</a>' +
            '<button onclick="deletePlaylist(\'' + p.id + '\',' + i + ')" class="btn btn-danger btn-sm">Delete</button>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  function toggleNewForm() {
    var f = document.getElementById('new-pl-form');
    if (!f) return;
    var visible = f.style.display !== 'none';
    f.style.display = visible ? 'none' : '';
    if (!visible) setTimeout(function() {
      var inp = document.getElementById('new-pl-title');
      if (inp) inp.focus();
    }, 50);
  }

  async function createPlaylist() {
    var titleEl = document.getElementById('new-pl-title');
    var title = titleEl ? titleEl.value.trim() : '';
    if (!title) {
      var a = document.getElementById('new-pl-alert');
      if (a) a.innerHTML = '<span style="color:var(--red);">Name is required</span>';
      return;
    }
    var desc = document.getElementById('new-pl-desc') ? document.getElementById('new-pl-desc').value.trim() : '';
    var isPublic = document.getElementById('new-pl-public') ? document.getElementById('new-pl-public').checked : true;
    try {
      var pl = await api('/playlists', {
        method: 'POST',
        body: JSON.stringify({ title: title, description: desc || null, is_public: isPublic }),
      });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
      navigate('/playlist.html?id=' + pl.id);
    } catch (err) {
      var a = document.getElementById('new-pl-alert');
      if (a) a.innerHTML = '<span style="color:var(--red);">' + escHtml(err.message || 'Failed') + '</span>';
    }
  }

  async function deletePlaylist(id, index) {
    if (!confirm('Delete this playlist?')) return;
    try {
      await api('/playlists/' + id, { method: 'DELETE' });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
      playlists.splice(index, 1);
      renderPlaylists();
    } catch (err) {
      alert('Failed to delete: ' + (err.message || 'error'));
    }
  }

  loadPlaylists();
</script>
</body>
</html>
