<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — playlists</title>
  <link rel="stylesheet" href="/css/style.css?v=fe5854d9373a">
  <script src="/js/status-card.js?v=fe5854d9373a"></script>
  <script src="/js/down.js?v=fe5854d9373a"></script>
</head>
<body>

<div id="view">

  <div class="pls-head">
    <h1 class="wv-page-title">Playlists</h1>
    <button class="wv-btn-play" onclick="window.wvNewPlaylist()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      New playlist
    </button>
  </div>

  <div class="pls-tabs" role="tablist">
    <button class="wv-chip" data-tab="community" role="tab" onclick="plsTab('community')">Community</button>
    <button class="wv-chip" data-tab="mine" role="tab" onclick="plsTab('mine')">Yours</button>
    <span class="pls-sort" id="pls-sort">
      <button class="pls-sort-btn" data-sort="new" onclick="plsSort('new')">Newest</button>
      <button class="pls-sort-btn" data-sort="popular" onclick="plsSort('popular')">Most played</button>
    </span>
  </div>

  <div id="playlists-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>

</div><!-- /view -->

<script src="/js/api.js?v=fe5854d9373a"></script>
<script src="/js/layout.js?v=fe5854d9373a"></script>
<script src="/js/player.js?v=fe5854d9373a"></script>
<script src="/js/router.js?v=fe5854d9373a"></script>
<script src="/js/playlists.js?v=fe5854d9373a"></script>
<script>
(function () {
  if (typeof initPlayer === 'function') initPlayer();

  var params = new URLSearchParams(location.search);
  var tab = params.get('tab') === 'mine' ? 'mine' : 'community';
  var sort = params.get('sort') === 'popular' ? 'popular' : 'new';
  var community = [], offset = 0, more = false, mine = null, seq = 0;
  var PAGE = 24;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function el() { return document.getElementById('playlists-container'); }

  function syncControls() {
    document.querySelectorAll('.pls-tabs .wv-chip').forEach(function (b) {
      var on = b.getAttribute('data-tab') === tab;
      b.classList.toggle('acc', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var so = document.getElementById('pls-sort');
    if (so) so.style.display = tab === 'community' ? '' : 'none';
    document.querySelectorAll('.pls-sort-btn').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-sort') === sort);
    });
    var q = tab === 'mine' ? '?tab=mine' : (sort === 'popular' ? '?sort=popular' : '');
    if (location.search !== q) history.replaceState(null, '', '/playlists' + q);
  }

  window.plsTab = function (t) { if (t === tab) return; tab = t; syncControls(); load(); };
  window.plsSort = function (s) { if (s === sort) return; sort = s; community = []; offset = 0; syncControls(); load(); };

  async function load() {
    var my = ++seq;
    if (tab === 'mine') return loadMine(my);
    if (!community.length) el().innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      var d = await api('/playlists/published?sort=' + sort + '&limit=' + PAGE + '&offset=' + offset);
      if (my !== seq) return;
      var items = (d && d.items) || [];
      community = community.concat(items);
      more = items.length === PAGE;
      renderCommunity();
    } catch (e) {
      if (my !== seq) return;
      el().innerHTML = '<div class="empty-state"><div class="empty-title">Could not load playlists</div></div>';
    }
  }

  window.plsMore = function () { offset += PAGE; load(); };

  function renderCommunity() {
    if (!community.length) {
      el().innerHTML = '<div class="empty-state">' +
        '<div class="empty-title">No playlists published yet</div>' +
        '<div class="empty-desc">Build one from any comp or the archive and publish it. It will show up here for everyone.</div>' +
        '<button class="wv-btn-play" style="margin-top:16px;" onclick="window.wvNewPlaylist()">Build the first one</button>' +
        '</div>';
      return;
    }
    el().innerHTML = '<div class="wv-comp-grid pls-grid">' + community.map(window.wvPlaylistCardHTML).join('') + '</div>' +
      (more ? '<div style="text-align:center;margin:22px 0;"><button class="wv-btn-ghost" onclick="plsMore()">Show more</button></div>' : '');
  }

  async function loadMine(my) {
    if (!isLoggedIn()) {
      el().innerHTML = '<div class="empty-state">' +
        '<div class="empty-title">Log in to see your playlists</div>' +
        '<a href="/login?next=' + encodeURIComponent('/playlists?tab=mine') + '" class="btn btn-primary" style="margin-top:16px;">Log in</a>' +
        '</div>';
      return;
    }
    el().innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      mine = await api('/playlists/mine');
      if (my !== seq) return;
      renderMine();
    } catch (e) {
      if (my !== seq) return;
      el().innerHTML = '<div class="empty-state"><div class="empty-title">Could not load your playlists</div></div>';
    }
  }

  function renderMine() {
    if (!mine || !mine.length) {
      el().innerHTML = '<div class="empty-state">' +
        '<div class="empty-title">You haven\'t made one yet</div>' +
        '<div class="empty-desc">Search any song or comp, drag them into order, add a cover and publish.</div>' +
        '<button class="wv-btn-play" style="margin-top:16px;" onclick="window.wvNewPlaylist()">New playlist</button>' +
        '</div>';
      return;
    }
    el().innerHTML = '<div class="wv-comp-grid pls-grid">' + mine.map(function (p, i) {
      var state = p.published_at ? 'Published' : (p.is_public ? 'Link only' : 'Private');
      return '<div class="pls-mine-card">' +
        window.wvPlaylistCardHTML(Object.assign({}, p, { owner: null })) +
        '<div class="pls-mine-foot"><span class="pls-state' + (p.published_at ? ' is-pub' : '') + '">' + state + '</span>' +
          '<button class="pls-link" onclick="navigate(\'/playlist-builder?id=' + p.id + '\')">Edit</button>' +
          '<button class="pls-link pls-del" onclick="plsDelete(\'' + p.id + '\',' + i + ')">Delete</button>' +
        '</div></div>';
    }).join('') + '</div>';
  }

  window.plsDelete = async function (id, i) {
    var p = mine && mine[i];
    if (!p || !confirm('Delete "' + p.title + '"? This can\'t be undone.')) return;
    try {
      await api('/playlists/' + id, { method: 'DELETE' });
      if (typeof invalidatePlaylistCache === 'function') invalidatePlaylistCache();
      mine.splice(i, 1);
      renderMine();
    } catch (e) {
      if (typeof wvToast === 'function') wvToast((e && e.message) || 'Could not delete it', 'error');
    }
  };

  syncControls();
  load();
})();
</script>
</body>
</html>
