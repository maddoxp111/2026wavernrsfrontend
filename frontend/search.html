  <style>
    @media (min-width: 769px) { .wv-topbar .wv-topbar-search { visibility: hidden; } }
    .sx { max-width: 1240px; margin: 0 auto; }
    .sx-head { position: sticky; top: 0; z-index: 6; margin: -8px -28px 0; padding: 14px 28px 12px; background: var(--page-bg); transition: box-shadow 200ms var(--ease); }

    .sx-chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

    .sx-hero { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 0; min-height: 240px; padding: 22px; border-radius: 10px; background: var(--surface); overflow: hidden; isolation: isolate; transition: background 200ms var(--ease); cursor: pointer; }
    .sx-hero:hover, .sx-hero.kb, .sx-hero:focus-within { background: var(--surface-2); }
    .sx-hero-wash { position: absolute; inset: -30%; z-index: -1; background-size: cover; background-position: center; filter: blur(46px) saturate(1.5); opacity: 0.3; pointer-events: none; }

    .sx-hero-art { position: relative; width: 112px; height: 112px; border-radius: 8px; overflow: hidden; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.45); margin-bottom: auto; }

    .sx-hero:hover .sx-play, .sx-hero.kb .sx-play, .sx-play:focus-visible { opacity: 1; transform: none; }
    .sx-play:hover { filter: brightness(1.08); transform: scale(1.05) !important; }

    .sx-row { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 58px; padding: 6px 8px; border-radius: 6px; transition: background 120ms var(--ease); }

    .sx-art.round { border-radius: 50%; }
    .sx-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .sx-art-play { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: rgba(0,0,0,0.52); color: #fff; opacity: 0; cursor: pointer; transition: opacity 120ms var(--ease); }
    .sx-row:hover .sx-art-play, .sx-row.kb .sx-art-play, .sx-art-play:focus-visible { opacity: 1; }
    .sx-meta { min-width: 0; }
    .sx-t { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .sx-t a { color: inherit; text-decoration: none; }

    .sx-ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 120ms var(--ease), color 120ms var(--ease), background 120ms var(--ease); }
    .sx-ib:hover { color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
    .sx-row:hover .sx-ib, .sx-row.kb .sx-ib, .sx-ib:focus-visible { opacity: 1; }
    .sx-note { font-size: 12.5px; color: var(--text-3); white-space: nowrap; }

    .sx-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 4px 8px; margin: 0 -12px; }
    .sx-cards.one { grid-template-rows: auto; grid-auto-rows: 0; row-gap: 0; overflow: hidden; }
    .sx-card { position: relative; padding: 12px; border-radius: 8px; transition: background 180ms var(--ease); min-width: 0; }

    .sx-card-art { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.32); }
    .sx-card-art.round { border-radius: 50%; }
    .sx-card-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .sx-initial { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800; color: rgba(255,255,255,0.92); }
    .sx-card-badge { position: absolute; top: 8px; left: 8px; z-index: 1; padding: 3px 7px; border-radius: 4px; background: rgba(0,0,0,0.55); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; }
    .sx-card-artw { position: relative; margin-bottom: 12px; }
    .sx-card-artw .sx-card-art { margin-bottom: 0; }
    .sx-card-artw .sx-play { width: 46px; height: 46px; right: 8px; bottom: 8px; }
    .sx-card:hover .sx-play, .sx-card.kb .sx-play { opacity: 1; transform: none; }
    .sx-card-t { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .sx-card-t a { color: inherit; text-decoration: none; }
    .sx-card-t a::after { content: ''; position: absolute; inset: 0; z-index: 1; }
    .sx-card-s { margin-top: 4px; font-size: 13px; color: var(--text-2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sx-card.art .sx-card-t, .sx-card.art .sx-card-s { text-align: left; }

    .sx-trk { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .sx-trk a { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 10px; background: var(--surface); color: var(--text); text-decoration: none; transition: background 160ms var(--ease); }
    .sx-trk a:hover, .sx-trk a.kb { background: var(--surface-2); }
    .sx-trk .sx-art { width: 56px; height: 56px; border-radius: 6px; }

    .sx-skel-row { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 7px 8px; }
    .sx-skel-row .a { width: 44px; height: 44px; }
    .sx-skel-row .l1 { height: 13px; width: 58%; margin-bottom: 8px; }
    .sx-skel-row .l2 { height: 11px; width: 34%; }
    .sx-skel-hero { flex: 1; min-height: 240px; border-radius: 10px; padding: 22px; background: var(--surface); display: flex; flex-direction: column; justify-content: flex-end; }

    .sx-skel-card { padding: 12px; }

    .sx-skel-card .l1 { height: 13px; width: 72%; margin-bottom: 8px; }
    .sx-skel-card .l2 { height: 11px; width: 44%; }
    .sx-skel-h { height: 20px; width: 140px; margin-bottom: 14px; border-radius: 4px; }

    .sx-pills { display: flex; flex-wrap: wrap; gap: 8px; }

      .sx-row.num { grid-template-columns: 44px minmax(0, 1fr) auto; }

      .sx-plays { display: none; }
      .sx-ib { opacity: 1; }

      .sx-rp-x { width: 40px; height: 40px; margin-right: 0; }
      .sx-browse { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

      .sx-chip .dot { animation: none; }

    }
  </style>

      var slots = [];
      if (recent.length) {
        slots.push(['recent', '<div class="sx-sec">' + secHead('Recent searches', '', '<button type="button" class="sx-more" data-act="clear-recent">Clear all</button>') +
          '<div class="sx-pills">' + recent.map(function (r) {
            return '<span class="sx-rp-wrap sx-nav" data-nav><button type="button" class="sx-rp" data-act="search" data-id="' + esc(r) + '" data-primary>' + IC.clock + '<span>' + esc(r) + '</span></button>' +
              '<button type="button" class="sx-rp-x" data-act="rm-recent" data-id="' + esc(r) + '" aria-label="Remove ' + esc(r) + ' from recent searches">' + IC.xs + '</button></span>';
          }).join('') + '</div></div>']);
      }
      if (z.trending && z.trending.length) {
        slots.push(['trend', '<div class="sx-sec">' + secHead('Trending on wavernrs') + '<div class="sx-pills">' + z.trending.map(function (t) {
          return '<button type="button" class="sx-rp sx-nav" data-nav data-primary data-act="search" data-id="' + esc(t) + '">' + IC.trend + '<span>' + esc(t) + '</span></button>';
        }).join('') + '</div></div>']);
      } else if (!z.trending) {
        slots.push(['trend', '<div class="sx-sec"><div class="wv-skel sx-skel-h"></div><div class="sx-pills">' + [120, 90, 140, 100, 80, 130].map(function (w) { return '<div class="wv-skel" style="width:' + w + 'px;height:40px;border-radius:999px;"></div>'; }).join('') + '</div></div>']);
      }
      var covers = (z.covers || []).slice();
      slots.push(['browse', '<div class="sx-sec">' + secHead('Browse all') + '<div class="sx-browse">' + BROWSE.map(function (c, i) {
        var cov = covers[i];
        return '<a class="wv-browse-tile sx-nav' + (c.wide ? ' wide' : '') + '" data-nav data-primary href="' + esc(c.href) + '" style="background:' + tileBg(c.h) + ';"><span>' + esc(c.l) + '</span>' +
          (cov ? '<img src="' + esc(img(cov, 160)) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : '<div class="fake" style="background:' + tileBg((c.h + 180) % 360) + ';"></div>') + '</a>';
      }).join('') + '</div></div>']);
      if (z.eras && z.eras.length) {
        slots.push(['eras', '<div class="sx-sec">' + secHead('Browse by era', '', moreLink('/eras', 'All eras')) + '<div class="sx-browse">' + z.eras.slice(0, 12).map(function (e) {
          var hue = coverHues(e.name || '');
          return '<a class="wv-browse-tile sx-nav" data-nav data-primary href="/browse?era=' + encodeURIComponent(e.id) + '" style="background:' + tileBg(hue.h1) + ';"><span>' + esc(e.name) + '</span>' +
            (e.cover ? '<img src="' + esc(img(e.cover, 160)) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : '<div class="fake" style="background:' + tileBg(hue.h2) + ';"></div>') + '</a>';
        }).join('') + '</div></div>']);
      }
      paint(slots);
      updateSel();
    }

    function doSearchImpl(q, opts) {
      opts = opts || {};
      q = String(q || '').trim().slice(0, 80);
      if (q.length < 2) return;
      if (input.value.trim() !== q) input.value = q;
      bar.classList.add('has-q');
      var same = st.q === q && st.d && !opts.force;
      if (same) return;
      var my = ++st.seq;
      st.q = q; st.sel = -1; st.err = null; st.top = null; st.topLocked = false; st.washed = false; st.graceOver = false;
      if (opts.resetFilter) st.filter = 'all';
      var hadResults = !!st.lastQ && resultsEl.children.length > 0;
      st.lastQ = q;
      st.d = { site: null, ma: null, aa: null, res: null, ye: null, badges: null, arcTracks: null, trackers: window._sxTrackers || null };
      st.pending = { site: true, ma: true, aa: true, res: true, ye: true, arc: true };
      document.title = '“' + q + '” — wavernrs';
      setUrl(q, !!opts.push);
      clearTimeout(st.coreTimer);
      st.stale = hadResults;
      if (!hadResults) resetPaint();
      render();
      var enc = encodeURIComponent(q);
      var done = function (key, val) {
        if (my !== st.seq) return;
        st.d[key] = val;
        st.pending[key] = false;
        schedule();
      };
      var fail = function (key, fallback) { return function (e) { if (e && e.navAborted) return; done(key, fallback); }; };
      api('/search?q=' + enc).then(function (d) {
        if (my !== st.seq) return;
        d = d || {};
        if (!Array.isArray(d.archive_tracks)) {
          api('/archive?kind=edits&q=' + enc + '&limit=1').then(function (a) {
            if (my !== st.seq) return;
            st.d.arcTracks = (a && a.tracks) || [];
            st.pending.arc = false; schedule();
          }).catch(function (e) { if (e && e.navAborted) return; if (my !== st.seq) return; st.pending.arc = false; schedule(); });
        } else { st.pending.arc = false; }
        st.coreTimer = setTimeout(function () { if (my !== st.seq) return; st.graceOver = true; schedule(); }, 1200);
        done('site', d);
      }).catch(function (e) {
        if (e && e.navAborted) return;
        if (my !== st.seq) return;
        st.err = (e && e.message) || 'search didnt work';
        st.pending.arc = false;
        st.graceOver = true;
        done('site', {});
      });
      api('/music-artists?q=' + enc + '&limit=8').then(function (d) { done('ma', d); }).catch(fail('ma', null));
      api('/archive/artists?q=' + enc + '&limit=8').then(function (d) { done('aa', d); }).catch(fail('aa', null));
      api('/resources/search?q=' + enc).then(function (d) { done('res', d); }).catch(fail('res', null));
      api('/ye/search?q=' + enc).then(function (d) { done('ye', d); }).catch(fail('ye', null));
      if (typeof getBadgeData === 'function') getBadgeData().then(function (b) { if (my === st.seq) { st.d.badges = b || {}; schedule(); } }).catch(function () {});
      if (!window._sxTrackers) {
        api('/trackers').then(function (d) { window._sxTrackers = (d && d.trackers) || []; if (my === st.seq) { st.d.trackers = window._sxTrackers; schedule(); } }).catch(function () {});
      }
      if (opts.remember) addRecent(q);
    }

    window.doSearch = function (q) { doSearchImpl(q, { remember: true, resetFilter: true }); };

    function clearSearch() {
      clearTimeout(window._searchDebounce);
      clearTimeout(st.coreTimer);
      st.seq++;
      st.q = ''; st.d = null; st.pending = {}; st.sel = -1; st.filter = 'all'; st.lastQ = '';
      input.value = '';
      bar.classList.remove('has-q');
      document.title = 'wavernrs — search';
      setUrl('', false);
      if (typeof window.setPageBgImage === 'function') window.setPageBgImage('');
      resetPaint();
      render();
    }

    function navItems() {
      return Array.prototype.slice.call(resultsEl.querySelectorAll('.sx-nav')).filter(function (el) {
        if (el.offsetParent === null) return false;
        var p = el.parentElement;
        if (p && p.classList.contains('one') && getComputedStyle(p).display === 'grid') {
          return el.getBoundingClientRect().top < p.getBoundingClientRect().bottom - 2;
        }
        return true;
      });
    }
    function updateSel() {
      var items = navItems();
      resultsEl.querySelectorAll('.sx-nav.kb').forEach(function (el) { el.classList.remove('kb'); });
      if (st.sel >= items.length) st.sel = items.length - 1;
      if (st.sel >= 0 && items[st.sel]) {
        var el = items[st.sel];
        el.classList.add('kb');
        if (!el.id) el.id = 'sx-opt-' + st.sel;
        input.setAttribute('aria-activedescendant', el.id);
        input.setAttribute('aria-expanded', 'true');
      } else {
        input.removeAttribute('aria-activedescendant');
        input.setAttribute('aria-expanded', items.length ? 'true' : 'false');
      }
    }
    function moveSel(delta) {
      var items = navItems();
      if (!items.length) return;
      st.sel = Math.max(-1, Math.min(items.length - 1, st.sel + delta));
      updateSel();
      var el = items[st.sel];
      if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'auto' });
      else { var c = document.getElementById('wv-content'); if (c) c.scrollTop = 0; }
    }
    function activateSel() {
      var el = navItems()[st.sel];
      if (!el) return false;
      var p = el.matches('[data-primary]') ? el : el.querySelector('[data-primary]');
      if (!p) return false;
      if (st.q) addRecent(st.q);
      p.click();
      return true;
    }

    input.addEventListener('input', function () {
      var q = input.value.trim();
      bar.classList.toggle('has-q', !!input.value);
      clearTimeout(window._searchDebounce);
      st.sel = -1;
      if (q.length >= 2) {
        window._searchDebounce = setTimeout(function () { doSearchImpl(q, {}); }, 240);
      } else if (!q) {
        clearSearch();
      }
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
      else if (e.key === 'Enter') {
        if (e.isComposing) return;
        e.preventDefault();
        if (st.sel >= 0 && activateSel()) return;
        var q = input.value.trim();
        if (q.length >= 2) {
          clearTimeout(window._searchDebounce);
          if (st.q === q) { addRecent(q); setUrl(q, true); }
          else doSearchImpl(q, { remember: true, push: true });
          if (window.matchMedia && window.matchMedia('(hover: none)').matches) input.blur();
        }
      } else if (e.key === 'Escape') {
        if (st.sel >= 0) { st.sel = -1; updateSel(); }
        else if (input.value) { clearSearch(); }
        else input.blur();
      }
    });
    document.getElementById('sx-clear').addEventListener('click', function (e) { e.preventDefault(); clearSearch(); input.focus(); });

    function onClick(e) {
      var b = e.target.closest('[data-act]');
      if (!b) {
        if (e.target.closest('a[href]') && st.q) addRecent(st.q);
        return;
      }
      var act = b.getAttribute('data-act'), id = b.getAttribute('data-id') || '';
      e.preventDefault();
      e.stopPropagation();
      if (act === 'filter') { setFilter(id); return; }
      if (act === 'search') { doSearchImpl(id, { remember: true, push: true, resetFilter: true }); if (!window.matchMedia('(hover: none)').matches) input.focus(); return; }
      if (act === 'rm-recent') { removeRecent(id); render(); return; }
      if (act === 'clear-recent') { writeRecent([]); render(); return; }
      if (act === 'retry') { doSearchImpl(st.q, { force: true }); return; }
      if (st.q) addRecent(st.q);
      runPlay(act, id);
    }
    resultsEl.addEventListener('click', onClick);
    chipsEl.addEventListener('click', onClick);

    function setFilter(k) {
      if (!FILTERS.some(function (f) { return f.k === k; })) k = 'all';
      if (st.filter === k) return;
      st.filter = k; st.sel = -1;
      var c = document.getElementById('wv-content');
      if (c) {
        var delta = resultsEl.getBoundingClientRect().top - c.getBoundingClientRect().top - headEl.offsetHeight;
        if (delta < 0) c.scrollTop += delta;
      }
      render();
      var on = chipsEl.querySelector('.sx-chip.on');
      if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    function toQueueItem(t) {
      return { id: t.id, title: t.title, ia_url: t.ia_url, cover_url: t.cover_url || (t.albums && t.albums.cover_url) || t.album_cover_url || null, artist_name: (t.artists && t.artists.display_name) || (t.albums && t.albums.archive_artist_name) || t.archive_artist_name || '', album_id: t.album_id || null, artist_id: t.artist_id || null, _archive_artist: t.archive_artist_name || (t.albums && t.albums.archive_artist_name) || null };
    }
    function playList(list, startId) {
      var q = list.filter(function (t) { return t && t.ia_url; }).map(toQueueItem);
      if (!q.length) { if (typeof wvToast === 'function') wvToast('nothing here can play yet'); return; }
      var idx = 0;
      if (startId) { idx = q.findIndex(function (t) { return t.id === startId; }); if (idx < 0) idx = 0; }
      setPlayerQueue(q, idx);
      playQueueIndex(idx);
    }
    function findIn(list, id) { for (var i = 0; i < (list || []).length; i++) if (list[i] && String(list[i].id) === String(id)) return list[i]; return null; }
    function ensureAudio(t) {
      if (t.ia_url) return Promise.resolve(t);
      return api('/tracks/' + encodeURIComponent(t.id)).then(function (full) { if (full && full.ia_url) { t.ia_url = full.ia_url; t.artist_id = full.artist_id; } return t; });
    }

    function runPlay(act, id) {
      var S = st.S || sources();
      if (act === 'song' || act === 'songs-all') {
        var t = act === 'song' ? findIn(S.songs, id) : null;
        if (act === 'song' && (!t || !t.ia_url)) { if (typeof wvToast === 'function') wvToast('that edit has no audio yet'); return; }
        playList(S.songs, t && t.id);
      } else if (act === 'queue') {
        var qt = findIn(S.songs, id);
        if (qt && typeof addToQueue === 'function') addToQueue(toQueueItem(qt));
      } else if (act === 'atrack' || act === 'atrack-queue' || act === 'atracks-all') {
        if (act === 'atracks-all') {
          var have = S.aTracks.filter(function (x) { return x.ia_url; });
          if (have.length) return playList(have);
          var first = S.aTracks[0];
          if (!first) return;
          return ensureAudio(first).then(function (x) { playList([x]); }).catch(function () { if (typeof wvToast === 'function') wvToast('couldnt play that one', 'error'); });
        }
        var at = findIn(S.aTracks, id);
        if (!at) return;
        ensureAudio(at).then(function (x) {
          if (!x.ia_url) { if (typeof wvToast === 'function') wvToast('that one has no audio yet'); return; }
          if (act === 'atrack-queue') { if (typeof addToQueue === 'function') addToQueue(toQueueItem(x)); }
          else playList([x].concat(S.aTracks.filter(function (y) { return y.ia_url && y.id !== x.id; })), x.id);
        }).catch(function (e) { if (!(e && e.navAborted) && typeof wvToast === 'function') wvToast('couldnt load that track', 'error'); });
      } else if (act === 'comp') {
        var a = findIn(S.comps, id) || findIn(S.archived, id);
        if (typeof playCompById === 'function') playCompById(id, a ? { album: a } : {});
      } else if (act === 'artist') {
        if (typeof wvToast === 'function') wvToast('Loading…');
        api('/music-artists/' + encodeURIComponent(id)).then(function (d) {
          var ts = ((d && d.tracks) || []).filter(function (t) { return t.ia_url; }).sort(function (a, b) { return (b.play_count || 0) - (a.play_count || 0); }).slice(0, 100);
          playList(ts);
        }).catch(function (e) { if (!(e && e.navAborted) && typeof wvToast === 'function') wvToast('couldnt load that artist', 'error'); });
      } else if (act === 'creator') {
        if (typeof wvToast === 'function') wvToast('Loading…');
        api('/archive/artists/' + encodeURIComponent(id)).then(function (d) {
          var comps = ((d && d.comps) || []).filter(function (c) { return (c.track_count || 0) > 0; }).sort(function (a, b) { return ((b.play_count || 0) - (a.play_count || 0)) || ((b.track_count || 0) - (a.track_count || 0)); });
          if (!comps.length) { if (typeof wvToast === 'function') wvToast('nothing to play from them yet'); return; }
          playCompById(comps[0].id, { album: Object.assign({ is_archive: true }, comps[0]), quiet: true });
        }).catch(function (e) { if (!(e && e.navAborted) && typeof wvToast === 'function') wvToast('couldnt load that creator', 'error'); });
      }
    }

    function onKey(e) {
      if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (!document.body.contains(input)) return;
      e.preventDefault();
      input.focus();
      input.select();
    }
    document.addEventListener('keydown', onKey);
    cleanup.push(function () { document.removeEventListener('keydown', onKey); clearTimeout(window._searchDebounce); clearTimeout(st.coreTimer); if (st.raf) cancelAnimationFrame(st.raf); st.seq++; });

    var scroller = document.getElementById('wv-content');
    if (scroller) {
      var onScroll = function () { headEl.classList.toggle('stuck', scroller.scrollTop > 4); };
      scroller.addEventListener('scroll', onScroll, { passive: true });
      cleanup.push(function () { scroller.removeEventListener('scroll', onScroll); });
    }

    var initialQ = (new URLSearchParams(location.search).get('q') || '').trim();
    if (initialQ.length >= 2) doSearchImpl(initialQ, { remember: true, resetFilter: true });
    else render();
    setTimeout(function () {
      if (!document.body.contains(input) || (initialQ && window.matchMedia('(hover: none)').matches)) return;
      input.focus({ preventScroll: true });
      try { var n = input.value.length; input.setSelectionRange(n, n); } catch (_) {}
    }, 80);
  })();
</script>
</body>
</html>
