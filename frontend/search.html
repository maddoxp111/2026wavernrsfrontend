<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — search</title>
  <link rel="stylesheet" href="/css/style.css?v=202609051856">
</head>
<body>
<div id="view"></div>

<script src="/js/api.js?v=202609051856"></script>
<script src="/js/layout.js?v=202609051856"></script>
<script src="/js/player.js?v=202609051856"></script>
<script src="/js/router.js?v=202609051856"></script>
<script>
  initPlayer();

  var params = new URLSearchParams(location.search);
  var initialQ = params.get('q') || '';

  // Render the search input + results container
  document.getElementById('view').innerHTML =
    '<div style="max-width:860px;">' +
      '<div class="wv-input" style="display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:10px 18px;">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--text-3)"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>' +
        '<input id="search-q" placeholder="Search edits, artists, comps…" style="flex:1;background:transparent;border:none;outline:none;font-size:15px;color:var(--text);font-family:inherit;" autocomplete="off">' +
      '</div>' +
      '<div id="search-results"></div>' +
    '</div>';

  var searchInput = document.getElementById('search-q');
  searchInput.value = initialQ;

  searchInput.addEventListener('input', function() {
    var q = searchInput.value.trim();
    if (q.length >= 2) {
      clearTimeout(window._searchDebounce);
      window._searchDebounce = setTimeout(function() { doSearch(q); }, 280);
    } else if (!q) {
      document.getElementById('search-results').innerHTML = '';
    }
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var q = searchInput.value.trim();
      if (q.length >= 2) {
        clearTimeout(window._searchDebounce);
        var u = new URL(location.href);
        u.searchParams.set('q', q);
        history.pushState(null, '', u);
        doSearch(q);
      }
    }
  });

  async function doSearch(q) {
    if (!q || q.length < 2) return;
    document.title = '"' + q + '" — wavernrs';
    var el = document.getElementById('search-results');
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    try {
      var _results = await Promise.all([
        api('/search?q=' + encodeURIComponent(q)),
        getBadgeData().catch(function(){ return { verified_artists:[], highlighted_albums:[], exclusive_albums:[] }; }),
      ]);
      var results = _results[0];
      var badges = _results[1] || { verified_artists:[], highlighted_albums:[], exclusive_albums:[], highlighted_tracks:[], exclusive_tracks:[] };
      var tracks = results.tracks || [];
      var artists = results.artists || [];
      var albums = results.albums || [];
      var archived = results.archived || [];

      if (!tracks.length && !artists.length && !albums.length && !archived.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No results for "' + escHtml(q) + '"</div><div class="empty-desc">Try a different search term.</div></div>';
        return;
      }

      var html = '';

      // Artists — circular avatar scroll row
      if (artists.length) {
        html += '<div class="search-results-section">' +
          '<div class="search-results-title">Artists</div>' +
          '<div class="scroll-row">' +
          artists.map(function(a) {
            var bg = coverGradient(a.display_name || '');
            var inner = a.profile_image_url
              ? '<img src="' + escHtml(a.profile_image_url) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\'">'
              : '<span style="font-size:22px;font-weight:800;color:rgba(255,255,255,0.9);">' + escHtml((a.display_name || '?')[0].toUpperCase()) + '</span>';
            var isV = badges.verified_artists && badges.verified_artists.indexOf(a.id) !== -1;
            return '<div onclick="navigate(\'/artist.html?id=' + a.id + '\')" style="cursor:pointer;flex-shrink:0;text-align:center;width:88px;">' +
              '<div style="width:88px;height:88px;border-radius:50%;background:' + bg + ';overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:8px;box-shadow:0 4px 16px rgba(0,0,0,0.25);">' + inner + '</div>' +
              '<div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);display:flex;align-items:center;justify-content:center;gap:2px;">' + escHtml(a.display_name) + (isV ? '<span class="wv-verified-icon" title="Verified Artist">✓</span>' : '') + '</div>' +
              '<div style="font-size:11px;color:var(--text-3);margin-top:2px;">Artist</div>' +
            '</div>';
          }).join('') +
          '</div></div>';
      }

      // Comps — horizontal card scroll row
      if (albums.length) {
        html += '<div class="search-results-section">' +
          '<div class="search-results-title">Comps</div>' +
          '<div class="scroll-row">' +
          albums.map(function(a) {
            var bg = coverGradient(a.title || '');
            var artistName = escHtml((a.artists && a.artists.display_name) || 'Unknown');
            var isH = badges.highlighted_albums && badges.highlighted_albums.indexOf(a.id) !== -1;
            var isE = badges.exclusive_albums   && badges.exclusive_albums.indexOf(a.id) !== -1;
            var titleBadges = (isH ? '<span class="wv-badge-hl-icon" title="Highlighted by Wavernrs">★</span>' : '') +
                              (isE ? '<span class="wv-badge-ex-icon" title="Wavernrs Exclusive">◆</span>' : '');
            return '<div class="scroll-card" onclick="navigate(\'/album.html?id=' + a.id + '\')" style="flex-shrink:0;width:140px;">' +
              '<div class="scroll-card-cover" style="background:' + bg + ';">' +
                (a.cover_url ? '<img src="' + escHtml(a.cover_url) + '" onerror="this.style.display=\'none\'">' : '') +
                '<div class="scroll-card-overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg></div>' +
              '</div>' +
              '<div class="scroll-card-title" style="display:flex;align-items:center;gap:2px;">' + escHtml(a.title) + titleBadges + '</div>' +
              '<div class="scroll-card-sub">' + artistName + '</div>' +
            '</div>';
          }).join('') +
          '</div></div>';
      }

      // Edits — track row list
      if (tracks.length) {
        html += '<div class="search-results-section">' +
          '<div class="search-results-title">Edits</div>' +
          '<div style="display:flex;flex-direction:column;gap:2px;">' +
          tracks.map(function(t, i) {
            var bg = coverGradient(t.title || '');
            var artistName = escHtml((t.artists && t.artists.display_name) || 'Unknown');
            var coverUrl = t.cover_url || (t.albums && t.albums.cover_url) || '';
            var td = JSON.stringify({id:t.id,title:t.title,ia_url:t.ia_url||'',cover_url:coverUrl,artist_name:(t.artists&&t.artists.display_name)||''}).replace(/"/g,'&quot;');
            var isH = badges.highlighted_tracks && badges.highlighted_tracks.indexOf(t.id) !== -1;
            var isE = badges.exclusive_tracks   && badges.exclusive_tracks.indexOf(t.id) !== -1;
            var trackBadges = (isH ? '<span class="wv-badge-hl-icon" title="Highlighted by Wavernrs">★</span>' : '') +
                              (isE ? '<span class="wv-badge-ex-icon" title="Wavernrs Exclusive">◆</span>' : '');
            return '<div class="track-row" onclick="playThis(' + td + ')">' +
              '<div class="track-row-num">' + (i + 1) + '</div>' +
              '<div class="track-row-cover" style="background:' + bg + ';">' +
                (coverUrl ? '<img src="' + escHtml(coverUrl) + '" onerror="this.style.display=\'none\'">' : '') +
              '</div>' +
              '<div class="track-row-info">' +
                '<div class="track-row-title" style="display:flex;align-items:center;gap:3px;">' + escHtml(t.title) + trackBadges + '</div>' +
                '<div class="track-row-artist">' + artistName + '</div>' +
              '</div>' +
              '<button onclick="event.stopPropagation();playThis(' + td + ')" class="wv-icon-circle" title="Play" style="flex-shrink:0;">' +
                '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
              '</button>' +
            '</div>';
          }).join('') +
          '</div></div>';
      }

      // Archived comps — preserved by the team, surfaced only here and the Archive page
      if (archived.length) {
        html += '<div class="search-results-section">' +
          '<div class="search-results-title">Archived</div>' +
          '<div class="scroll-row">' +
          archived.map(function(a) {
            var bg = coverGradient(a.title || '');
            return '<div class="scroll-card" onclick="navigate(\'/album.html?id=' + a.id + '\')" style="flex-shrink:0;width:140px;">' +
              '<div class="scroll-card-cover" style="background:' + bg + ';position:relative;">' +
                (a.cover_url ? '<img src="' + escHtml(a.cover_url) + '" onerror="this.style.display=\'none\'">' : '') +
                '<div style="position:absolute;top:6px;left:6px;padding:2px 7px;background:rgba(255,255,255,0.2);color:rgba(255,255,255,0.96);font-size:8.5px;font-weight:700;letter-spacing:0.06em;border-radius:4px;text-transform:uppercase;">archived</div>' +
                '<div class="scroll-card-overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg></div>' +
              '</div>' +
              '<div class="scroll-card-title">' + escHtml(a.title) + '</div>' +
              '<div class="scroll-card-sub">' + escHtml(a.archive_artist_name || 'Unknown') + '</div>' +
            '</div>';
          }).join('') +
          '</div></div>';
      }

      el.innerHTML = html;
      // Background: first track/album cover, falling back to first artist pfp.
      if (typeof window.setPageBgImage === 'function') {
        var bgUrl = (tracks[0] && tracks[0].cover_url) ||
                    (albums[0] && albums[0].cover_url) ||
                    (artists[0] && artists[0].profile_image_url) || '';
        window.setPageBgImage(bgUrl);
      }
    } catch (err) {
      el.innerHTML = '<div class="empty-state"><div class="empty-title">Search failed</div><div class="empty-desc">' + escHtml(err.message) + '</div></div>';
    }
  }

  function playThis(track) {
    playTrack(track);
  }

  if (initialQ) {
    doSearch(initialQ);
    setTimeout(function() { searchInput.focus(); }, 100);
  } else {
    setTimeout(function() { searchInput.focus(); }, 100);
  }
</script>
</body>
</html>
