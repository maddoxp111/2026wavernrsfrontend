<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — search</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/discover.html">Discover</a>
    <a href="/charts.html">Charts</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" id="nav-search" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();navSearch(q);}">
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="view">
<div class="container" style="max-width:900px;padding-top:32px;">

  <div class="form-group" style="max-width:500px;margin-bottom:32px;">
    <input type="text" id="search-q" placeholder="Search edits, artists, comps…">
  </div>

  <div id="search-results">
    <!-- Populated by JS -->
  </div>

</div>
</div><!-- /view -->

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg></span>
    <span>Discover</span>
  </a>
  <a href="/charts.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></span>
    <span>Charts</span>
  </a>
  <a href="/search.html" class="mobile-nav-item active">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
    <span>Dashboard</span>
  </a>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  updateNav();
  initPlayer();

  var params = new URLSearchParams(location.search);
  var initialQ = params.get('q') || '';

  var searchInput = document.getElementById('search-q');
  searchInput.value = initialQ;

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = searchInput.value.trim();
      if (q.length >= 2) {
        const u = new URL(location.href);
        u.searchParams.set('q', q);
        history.pushState(null, '', u);
        doSearch(q);
      }
    }
  });

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function doSearch(q) {
    if (!q || q.length < 2) return;
    document.title = `"${q}" — wavernrs stream`;
    const el = document.getElementById('search-results');
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    try {
      const results = await api(`/search?q=${encodeURIComponent(q)}`);
      const tracks = results.tracks || [];
      const artists = results.artists || [];
      const albums = results.albums || [];

      if (!tracks.length && !artists.length && !albums.length) {
        el.innerHTML = `<div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-title">No results for "${escHtml(q)}"</div>
          <div class="empty-desc">Try a different search term.</div>
        </div>`;
        return;
      }

      var html = '';

      // ── Artists: horizontal avatar row (unchanged) ──
      if (artists.length) {
        html += '<div class="search-results-section">' +
          '<div class="search-results-title">Artists</div>' +
          '<div class="scroll-row">' +
          artists.map(function(a) {
            var avatar = a.profile_image_url
              ? '<img src="' + escHtml(a.profile_image_url) + '" alt="" onerror="this.style.display=\'none\'">'
              : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;color:var(--purple-light);background:var(--purple-bg);">' + escHtml((a.display_name||'?')[0].toUpperCase()) + '</div>';
            return '<div class="scroll-card" onclick="navigate(\'/artist.html?id=' + a.id + '\')">' +
              '<div class="scroll-card-cover" style="border-radius:50%;">' + avatar + '</div>' +
              '<div class="scroll-card-title" style="text-align:center;">' + escHtml(a.display_name) + '</div>' +
            '</div>';
          }).join('') +
          '</div></div>';
      }

      // ── Tracks + Comps: Spotify-style list rows ──
      var allResults = [];
      tracks.forEach(function(t) { allResults.push({ _type: 'track', item: t }); });
      albums.forEach(function(a) { allResults.push({ _type: 'album', item: a }); });

      if (allResults.length) {
        html += '<div class="search-results-section"><div class="search-results-list">' +
          allResults.map(function(r) {
            var item = r.item;
            var isAlbum = r._type === 'album';
            var coverSrc = item.cover_url || '';
            var coverEl = coverSrc
              ? '<img src="' + escHtml(coverSrc) + '" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.innerHTML=\'<span style=&quot;font-size:22px;&quot;>' + (isAlbum ? '💿' : '🎵') + '</span>\'">'
              : '<span style="font-size:22px;">' + (isAlbum ? '💿' : '🎵') + '</span>';
            var artistName = escHtml(item.artists?.display_name || item.artist_name || 'Unknown');
            var typeLabel = isAlbum ? 'Comp' : 'Edit';
            var subtitle = typeLabel + ' · ' + artistName;
            var clickAction = isAlbum
              ? 'navigate(\'/album.html?id=' + item.id + '\')'
              : 'playThis(' + JSON.stringify(item).replace(/"/g,'&quot;') + ')';
            var playStop = isAlbum ? '' :
              '<button onclick="event.stopPropagation();playThis(' + JSON.stringify(item).replace(/"/g,'&quot;') + ')" ' +
              'style="background:none;border:none;cursor:pointer;padding:0;margin-right:8px;flex-shrink:0;" title="Play">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--purple)"><path d="M8 5v14l11-7z"/></svg>' +
              '</button>';
            return '<div class="search-result-row" onclick="' + clickAction + '">' +
              '<div style="width:52px;height:52px;flex-shrink:0;border-radius:6px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">' + coverEl + '</div>' +
              '<div style="flex:1;min-width:0;">' +
                '<div style="font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(item.title) + '</div>' +
                '<div style="font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + subtitle + '</div>' +
              '</div>' +
              playStop +
              '<span style="flex-shrink:0;background:var(--surface-2);color:var(--text-secondary);font-size:12px;font-weight:500;padding:4px 12px;border-radius:4px;">' + typeLabel + '</span>' +
            '</div>';
          }).join('') +
        '</div></div>';
      }

      el.innerHTML = html;
    } catch (err) {
      el.innerHTML = `<div class="empty-state"><div class="empty-title">Search failed</div><div class="empty-desc">${escHtml(err.message)}</div></div>`;
    }
  }

  function playThis(track) {
    playTrack({ ...track, artist_name: track.artists?.display_name });
  }

  if (initialQ) doSearch(initialQ);
</script>
</body>
</html>
