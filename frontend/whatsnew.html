<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>what's new - wavernrs</title>
  <meta name="description" content="everything added to wavernrs lately">
  <link rel="stylesheet" href="/css/style.css?v=46e0883ab076">
  <script src="/js/status-card.js?v=46e0883ab076"></script>
  <script src="/js/down.js?v=46e0883ab076"></script>
  <style>
    .wn { max-width: 760px; }
    .wn h1 { font-size: 28px; font-weight: 800; margin: 8px 0 4px; }
    .wn > p { color: var(--text-3); font-size: 14px; margin: 0 0 24px; }
    .wn-day { margin: 0 0 22px; }
    .wn-day h2 { font-size: 13px; font-weight: 700; color: var(--text-3); text-transform: lowercase; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border, var(--hair)); }
    .wn-day ul { list-style: none; margin: 0; padding: 0; }
    .wn-day li { font-size: 14.5px; line-height: 1.5; color: var(--text-2); padding: 4px 0; }
    .wn-day li b { color: var(--text); font-weight: 700; }
    .wn-day li a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--text-3); }
    .wn-msg { color: var(--text-3); font-size: 14px; }
  </style>
</head>
<body>

<div id="view">
<div class="wn">
  <h1>what's new</h1>
  <p>everything we've added lately, newest first.</p>
  <div id="wn-feed"><div class="wn-msg">loading...</div></div>
</div>
</div>

<script src="/js/api.js?v=46e0883ab076"></script>
<script src="/js/layout.js?v=46e0883ab076"></script>
<script src="/js/player.js?v=46e0883ab076"></script>
<script src="/js/router.js?v=46e0883ab076"></script>
<script>
(function () {
  var feed = document.getElementById('wn-feed');
  if (!feed) { if (typeof initPlayer === 'function') initPlayer(); return; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function label(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toLowerCase(); }
  fetch('/whatsnew.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
    var list = (d.entries || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var html = '', cur = '';
    list.forEach(function (e) {
      if (e.date !== cur) { if (cur) html += '</ul></div>'; cur = e.date; html += '<div class="wn-day"><h2>' + esc(label(e.date)) + '</h2><ul>'; }
      var t = e.href && /^\/(?!\/)/.test(e.href) ? '<a href="' + esc(e.href) + '">' + esc(e.title) + '</a>' : '<b>' + esc(e.title) + '</b>';
      html += '<li>' + t + ' - ' + esc(e.body) + '</li>';
    });
    if (cur) html += '</ul></div>';
    feed.innerHTML = html || '<div class="wn-msg">nothing here yet</div>';
  }).catch(function () { feed.innerHTML = '<div class="wn-msg">couldnt load this rn, try again in a sec</div>'; });
  try { localStorage.setItem('wv_whatsnew_seen', new Date().toISOString().slice(0, 10)); } catch (_) {}
  if (typeof initPlayer === 'function') initPlayer();
})();
</script>
</body>
</html>
