<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — tracker</title>
  <link rel="stylesheet" href="/css/style.css?v=dcfa91b69b5b">
  <script src="/js/status-card.js?v=dcfa91b69b5b"></script>
  <script src="/js/down.js?v=dcfa91b69b5b"></script>
</head>
<body>

<div id="view">
  <style>
    #view .tk-top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
    #view .tk-top h1 { margin:0; font-size:30px; font-weight:800; letter-spacing:-.03em; }
    #view .tk-sub { font-size:12.5px; color:var(--text-3); margin-top:3px; }
    #view .tk-tabs { display:inline-flex; background:var(--surface-2); border-radius:99px; padding:4px; gap:2px; }
    #view .tk-tabs button { border:none; background:transparent; color:var(--text-2); font-size:14px; font-weight:700;
      padding:8px 24px; border-radius:99px; cursor:pointer; transition:background .15s,color .15s; }
    #view .tk-tabs button:hover { color:var(--text); }
    #view .tk-tabs button.on { background:var(--brand); color:#14121c; }
    .theme-light #view .tk-tabs button.on { color:#fff; }
    #view .tk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:20px 14px; }
    #view .tk-era { cursor:pointer; }
    #view .tk-era .cv { aspect-ratio:1; border-radius:10px; overflow:hidden; margin-bottom:8px;
      box-shadow:0 4px 14px rgba(0,0,0,.25); transition:transform .16s; }
    #view .tk-era:hover .cv { transform:translateY(-3px); }
    #view .tk-era .cv img { width:100%; height:100%; object-fit:cover; display:block; }
    #view .tk-era .nm { font-size:13.5px; font-weight:700; line-height:1.3; }
    #view .tk-era .mt { font-size:11.5px; color:var(--text-3); margin-top:2px; }
    #view .tk-group { font-size:11.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
      color:var(--text-3); margin:28px 0 12px; }
    #view .tk-back { font-size:13px; color:var(--text-2); cursor:pointer; display:inline-block; margin-bottom:12px; }
    #view .tk-back:hover { color:var(--text); }
    #view .tk-list { display:flex; flex-direction:column; gap:2px; }
    #view .tk-row { display:flex; gap:12px; padding:10px; border-radius:10px; align-items:center; }
    #view .tk-row.hit { cursor:pointer; }
    #view .tk-row.hit:hover { background:var(--surface-2); }
    #view .tk-row .cv { width:52px; height:52px; border-radius:7px; overflow:hidden; flex-shrink:0; }
    #view .tk-row .cv img { width:100%; height:100%; object-fit:cover; display:block; }
    #view .tk-row .nm { font-weight:700; font-size:14.5px; }
    #view .tk-row .by { font-size:12.5px; color:var(--text-2); margin-top:1px; }
    #view .tk-row .ds { font-size:12.5px; color:var(--text-3); line-height:1.45; margin-top:3px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    #view .tk-part { opacity:.9; }
    #view .tk-tag { font-size:10.5px; font-weight:700; color:var(--text-3); border:1px solid var(--border);
      border-radius:99px; padding:2px 8px; white-space:nowrap; }
    #view .tk-art { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:22px 16px; }
    #view .tk-art .pc { display:block; text-decoration:none; color:inherit; }
    #view .tk-art .cv { aspect-ratio:1; border-radius:10px; overflow:hidden; margin-bottom:8px;
      box-shadow:0 4px 14px rgba(0,0,0,.25); transition:transform .16s; background:var(--surface-2); }
    #view .tk-art .pc:hover .cv { transform:translateY(-3px); }
    #view .tk-art .cv img { width:100%; height:100%; object-fit:cover; display:block; }
    #view .tk-art .nm { font-size:13.5px; font-weight:700; line-height:1.3; }
    #view .tk-art .pl { font-size:11.5px; font-weight:700; color:var(--brand); margin-top:2px; }
    #view .tk-art .ds { font-size:11.5px; color:var(--text-3); margin-top:2px; line-height:1.4;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    #view .tk-hero { display:flex; gap:16px; align-items:center; margin-bottom:6px; }
    #view .tk-hero .art { width:96px; height:96px; border-radius:12px; overflow:hidden; flex-shrink:0;
      box-shadow:0 8px 24px rgba(0,0,0,.35); }
    #view .tk-hero .art img { width:100%; height:100%; object-fit:cover; display:block; }
    #view .fs-tabs { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0 10px; margin:4px 0 16px; border-bottom:1px solid var(--border); }
    #view .fs-tabs::-webkit-scrollbar { display:none; }
    #view .fs-tab { flex:none; border:0; background:var(--surface-2); color:var(--text-2); font:inherit; font-size:13px; font-weight:700; padding:8px 14px; border-radius:99px; cursor:pointer; white-space:nowrap; }
    #view .fs-tab:hover { color:var(--text); }
    #view .fs-tab.on { background:var(--text); color:var(--bg, #000); }
    #view .fs-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
    #view .fs-search { flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:99px; padding:9px 16px; color:var(--text-3); }
    #view .fs-search input { flex:1; min-width:0; background:transparent; border:0; outline:0; box-shadow:none; padding:0; margin:0; height:auto; font:inherit; font-size:14px; color:var(--text); }
    #view .fs-src { font-size:12.5px; color:var(--text-3); text-decoration:none; font-weight:700; white-space:nowrap; }
    #view .fs-src:hover { color:var(--text); }
    #view .fs-count { font-size:12.5px; color:var(--text-3); margin:0 0 14px; }
    #view .fs-h { font-size:19px; font-weight:800; letter-spacing:-.02em; margin:28px 0 8px; overflow-wrap:anywhere; }
    #view .fs-note { background:var(--surface); border-radius:12px; padding:12px 14px; margin:0 0 12px; font-size:13.5px; line-height:1.6; color:var(--text-2); white-space:pre-line; overflow-wrap:anywhere; }
    #view .fs-note.clamp { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
    #view .fs-list { display:flex; flex-direction:column; }
    #view .fs-row { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; padding:12px 10px; border-radius:12px; align-items:start; }
    #view .fs-row.img { grid-template-columns:72px minmax(0,1fr); }
    #view .fs-row + .fs-row { border-top:1px solid var(--border); }
    #view .fs-row:hover { background:var(--surface); }
    #view .fs-cv { width:72px; height:72px; border-radius:9px; overflow:hidden; background:var(--surface-2); display:block; }
    #view .fs-cv img { width:100%; height:100%; object-fit:cover; display:block; }
    #view .fs-t { font-weight:700; font-size:15px; line-height:1.3; overflow-wrap:anywhere; }
    #view .fs-f { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:4px; font-size:12.5px; color:var(--text-2); }
    #view .fs-f span b { color:var(--text-3); font-weight:600; margin-right:4px; }
    #view .fs-d { font-size:12.5px; color:var(--text-2); margin-top:6px; line-height:1.5; white-space:pre-line; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
    #view .fs-d.open { display:block; }
    #view .fs-ls { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    #view .fs-l { font-size:11.5px; font-weight:700; color:var(--text-2); background:var(--surface-2); border-radius:99px; padding:4px 10px; text-decoration:none; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #view .fs-l:hover { background:var(--brand); color:#14121c; }
    #view .fs-l.fs-here { background:color-mix(in srgb, var(--brand) 22%, var(--surface-2)); color:var(--text); }
    #view .fs-more { display:block; margin:18px auto 0; border:0; background:var(--surface-2); color:var(--text); font:inherit; font-weight:700; font-size:13.5px; padding:10px 22px; border-radius:99px; cursor:pointer; }
    #view .tk-tabs button { white-space:nowrap; flex:none; }
    #view .tk-tabs { max-width:100%; overflow-x:auto; scrollbar-width:none; }
    #view .tk-tabs::-webkit-scrollbar { display:none; }
    @media (max-width:480px) { #view .tk-tabs button { padding:8px 14px; font-size:13.5px; } }
    #view .tk-dl { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    #view .tk-dl a { font-size:11.5px; font-weight:700; color:var(--text-2); background:var(--surface-2); border-radius:99px; padding:3px 9px; text-decoration:none; }
    #view .tk-dl a:hover { background:var(--brand); color:#14121c; }
    #view .tk-new { background:var(--surface); border-radius:14px; padding:12px 16px; margin:0 0 22px; }
    #view .tk-new summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; font-weight:700; }
    #view .tk-new summary::-webkit-details-marker { display:none; }
    #view .tk-new summary .d { font-size:12px; color:var(--text-3); font-weight:600; }
    #view .tk-new summary .pl { color:#4ade80; font-size:12.5px; }
    #view .tk-new summary .mi { color:#f87171; font-size:12.5px; }
    #view .tk-new summary .ar { margin-left:auto; color:var(--text-3); font-size:12px; }
    #view .tk-new[open] summary .ar { transform:rotate(180deg); }
    #view .tk-new h4 { margin:14px 0 6px; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-3); }
    #view .tk-new ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:2px 16px; }
    #view .tk-new li { font-size:13px; padding:4px 0; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #view .tk-new li span { color:var(--text-3); }
    #view .tk-new li a { color:var(--text); text-decoration:none; font-weight:600; }
    #view .tk-new li a:hover { text-decoration:underline; }
    #view .tk-new .older { font-size:12px; color:var(--text-3); margin-top:12px; }
  </style>
  <div id="tk-body"><div class="loading"><div class="spinner"></div></div></div>
</div>

<script src="/js/api.js?v=dcfa91b69b5b"></script>
<script src="/js/layout.js?v=dcfa91b69b5b"></script>
<script src="/js/player.js?v=dcfa91b69b5b"></script>

<script>
  var TK_TAGS = { '\u2b50': 'every edit on it is amazing', '\ud83d\uddd1': 'only the leak is bad', '\ud83e\udd16': 'every edit on it used AI', '\ud83c\udfc6': 'Tracker pick', '\u2728': 'Highlighted', '\ud83d\udcab': 'Highlighted', '\ud83d\udc8e': 'Gem', '\u231b': 'Older comp', '\ud83d\udeae': 'Not recommended' };
  function tkTagHint(tag) { var out = []; for (var k in TK_TAGS) if (tag.indexOf(k) >= 0) out.push(TK_TAGS[k]); return out.join(' · ') || 'Tracker tag'; }

(function () {
  var esc = window.escHtml || function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); };
  function grad(seed) { return window.coverGradient ? window.coverGradient(seed || '') : 'linear-gradient(135deg,#2a2a34,#15151b)'; }
  function body() { return document.getElementById('tk-body'); }

  var _slug = null, _kind = 'comp', _cache = {};

  function kindWord(kind, n) {
    var one = kind === 'comp' ? 'comp' : kind === 'edit' ? 'edit' : 'piece of art';
    if (n === 1) return one;
    return kind === 'art' ? 'pieces of art' : one + 's';
  }

  function listNames(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }

  // Badges for the trackers that list an entry. Only the combined view sends them.
  function sourceBadges(x) {
    if (!x.sources || !x.sources.length) return '';
    return '<div class="tk-srcs">' + x.sources.map(function (src) {
      var cls = 'tk-src' + (src.starred ? ' star' : '') + (src.tier === 'additional' ? ' add' : '');
      var tip = src.short + (src.starred ? ' · starred' : '') + (src.tier === 'additional' ? ' · additional list' : '');
      return '<span class="' + cls + '" title="' + esc(tip) + '">' + (src.starred ? '⭐ ' : '') + esc(src.short) + '</span>';
    }).join('') + '</div>';
  }

  function kindLabel(kind) { return kind === 'comp' ? 'Comps' : kind === 'edit' ? 'Edits' : 'Art'; }

  function header(t, kind) {
    return '<div class="tk-back" onclick="navigate(\'/archive\')">← Archive</div>' +
      '<div class="tk-top">' +
        '<div style="flex:1;min-width:200px;">' +
          '<h1>' + esc(t.name) + '</h1>' +
          '<div class="tk-sub">' + t.comps.toLocaleString() + ' comps · ' + t.edits.toLocaleString() + ' edits' +
            (t.art ? ' · ' + t.art.toLocaleString() + ' pieces of art' : '') +
            (t.url ? ' · <a href="' + esc(t.url) + '" target="_blank" rel="noopener" style="color:var(--brand);font-weight:600;">source</a>' : '') + '</div>' +
          (t.combined && t.sources ? '<div class="tk-sub" style="margin-top:4px;">this mixes ' + esc(listNames(t.sources.map(function (x) { return x.short; }))) +
            ' together. if a comp is on more than one it only shows once, with a badge for each tracker that has it.</div>' : '') +
        '</div>' +
        '<div class="tk-tabs">' +
          '<button class="' + (kind === 'comp' ? 'on' : '') + '" onclick="tkKind(\'comp\')">Comps</button>' +
          '<button class="' + (kind === 'edit' ? 'on' : '') + '" onclick="tkKind(\'edit\')">Edits</button>' +
          (t.art ? '<button class="' + (kind === 'art' ? 'on' : '') + '" onclick="tkKind(\'art\')">Art</button>' : '') +
          (t.comps && !t.combined ? '<button class="' + (kind === 'missing' ? 'on' : '') + '" onclick="tkKind(\'missing\')" title="comps on this tracker that are not on wavernrs yet">Not here yet</button>' : '') +
          (hasSheet(t.slug) ? '<button data-sheet class="' + (kind === 'sheet' ? 'on' : '') + '" onclick="tkKind(\'sheet\')">Full tracker</button>' : '') +
        '</div>' +
      '</div>';
  }

  async function renderTracker(slug, kind) {
    if (kind === 'sheet') return renderSheet(slug);
    if (kind === 'missing') return renderMissing(slug);
    _slug = slug; _kind = kind;
    var b = body(); if (!b) return;
    var ck = slug + '|' + kind, d = _cache[ck];
    if (!d) {
      b.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try { d = await api('/trackers/' + encodeURIComponent(slug) + '?kind=' + kind); _cache[ck] = d; }
      catch (e) { b.innerHTML = '<div class="wv-empty">couldnt load this tracker</div>'; return; }
    }
    if (_slug !== slug || _kind !== kind) return;
    document.title = 'wavernrs — ' + d.tracker.name;
    var html = header(d.tracker, kind);
    if (!d.groups.length) html += '<div class="wv-empty">no ' + kindWord(kind, 2) + ' in this tracker</div>';
    (d.groups || []).forEach(function (g, gi) {
      if (d.groups.length > 1 || g.name !== 'Eras') html += '<div class="tk-group">' + esc(g.name) + '</div>';
      else if (gi === 0) html += '<div style="height:6px;"></div>';
      html += '<div class="tk-grid">' + g.eras.map(function (e) {
        return '<div class="tk-era" onclick="tkEra(\'' + esc(e.slug) + '\')">' +
          '<div class="cv" style="background:' + grad(e.name) + ';">' +
            (e.cover ? '<img src="' + esc(e.cover) + '" loading="lazy" onerror="this.style.opacity=0">' : '') + '</div>' +
          '<div class="nm">' + esc(e.name) + '</div>' +
          '<div class="mt">' + e.n + ' ' + kindWord(kind, e.n) + '</div></div>';
      }).join('') + '</div>';
    });
    b.innerHTML = html;
    history.replaceState(null, '', '/tracker?t=' + encodeURIComponent(slug) + (kind === 'comp' ? '' : '&kind=' + kind));
    if (kind === 'comp') paintChanges(slug);
    sheetInfo(slug).then(function (info) {
      if (!info || !info.kind || _slug !== slug || _kind !== kind) return;
      var tabs = document.querySelector('#view .tk-tabs');
      if (tabs && !tabs.querySelector('[data-sheet]')) tabs.insertAdjacentHTML('beforeend', '<button data-sheet onclick="tkKind(\'sheet\')">Full tracker</button>');
    });
  }

  var _sheetInfo = {}, _sheetGrid = {}, _fs = null;
  var FS_PAGE = 80;

  var _sheetOk = {};
  function sheetInfo(slug) {
    if (!_sheetInfo[slug]) _sheetInfo[slug] = api('/trackers/' + encodeURIComponent(slug) + '/sheet').then(function (i) { if (i && i.kind) _sheetOk[slug] = true; return i; }).catch(function () { delete _sheetInfo[slug]; return null; });
    return _sheetInfo[slug];
  }
  function hasSheet(slug) { return !!_sheetOk[slug]; }

  function sheetTabs(slug, info) {
    if (info.kind === 'gsheet') return Promise.resolve(info.tabs.map(function (t) { return { name: t.name, id: t.gid }; }));
    var k = 'static|' + info.url;
    if (!_sheetGrid[k]) _sheetGrid[k] = fetch(info.url).then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); }).catch(function (e) { delete _sheetGrid[k]; throw e; });
    return _sheetGrid[k].then(function (d) { return d.tabs.map(function (t, i) { return { name: t.name, id: String(i), grid: t }; }); });
  }

  function sheetGrid(slug, info, tab) {
    if (tab.grid) return Promise.resolve(tab.grid);
    var k = slug + '|' + tab.id;
    if (!_sheetGrid[k]) _sheetGrid[k] = api('/trackers/' + encodeURIComponent(slug) + '/sheet/' + encodeURIComponent(tab.id)).catch(function (e) { delete _sheetGrid[k]; throw e; });
    return _sheetGrid[k];
  }

  function fsHere(u) {
    try { var x = new URL(u); if (!/(^|\.)wavernrs\.com$/.test(x.hostname)) return null; if (!/^\/(album|track|artist|playlist|tracker|resources|archive)(\.html)?$/.test(x.pathname)) return null; return x.pathname.replace(/\.html$/, '') + x.search; } catch (_) { return null; }
  }
  function fsHost(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return 'link'; } }
  function fsLinkLabel(l) {
    var t = String(l.t || '').trim();
    if (!t || /^https?:\/\//i.test(t) || t.length > 40) return fsHost(l.u);
    return t;
  }

  function fsParse(grid) {
    var rows = grid.rows || [], hdr = -1;
    for (var i = 0; i < Math.min(rows.length, 12); i++) {
      var r = rows[i], txt = r.filter(function (c) { return c.t; });
      if (txt.length >= 3 && txt.every(function (c) { return c.t.length <= 40 && !(c.i && c.i.length); })) { hdr = i; break; }
    }
    var labels = {};
    if (hdr >= 0) rows[hdr].forEach(function (c) { if (c.t) labels[c.c] = c.t; });
    var titleCol = null;
    for (var c in labels) if (/^(title|name|comp|comp name|edit|edit name|song|album|project|alias|resource)s?$/i.test(labels[c].trim())) { titleCol = +c; break; }
    var blocks = [], section = '';
    rows.forEach(function (r, ri) {
      if (ri === hdr) return;
      var txt = r.filter(function (c) { return c.t; });
      var imgs = [], links = [];
      r.forEach(function (c) {
        (c.i || []).forEach(function (u) { imgs.push(u); });
        (c.l || []).forEach(function (l) { if (!links.some(function (x) { return x.u === l.u; })) links.push(l); });
      });
      if (txt.length === 1 && !imgs.length && r.length === 1) {
        var only = txt[0].t;
        if (only.length <= 80 && !links.length && hdr >= 0 && ri > hdr) { section = only; blocks.push({ k: 'h', t: only }); return; }
        blocks.push({ k: 'n', t: only, links: links, pre: hdr >= 0 && ri < hdr });
        return;
      }
      if (!txt.length && !imgs.length && !links.length) return;
      var title = null, fields = [], desc = [];
      var tc = titleCol != null ? r.find(function (x) { return x.c === titleCol && x.t; }) : null;
      if (!tc) tc = txt.find(function (x) { return x.t !== section && x.t.length <= 140 && !/^link/i.test(labels[x.c] || ''); });
      if (tc) title = tc.t;
      txt.forEach(function (x) {
        if (x === tc || x.t === section) return;
        var lab = labels[x.c] || '';
        if (x.l && x.l.length && x.t.length <= 40 && x.l.length === x.t.split('\n').length) return;
        if (x.t.length > 90 || /\n/.test(x.t)) desc.push(x.t);
        else fields.push([lab, x.t]);
      });
      blocks.push({ k: 'e', title: title || (links[0] ? fsLinkLabel(links[0]) : 'untitled'), img: imgs[0] || null, fields: fields, desc: desc.join('\n\n'), links: links,
        hay: (section + ' ' + txt.map(function (x) { return x.t; }).join(' ')).toLowerCase() });
    });
    return blocks;
  }

  function fsEntry(b) {
    return '<div class="fs-row' + (b.img ? ' img' : '') + '">' +
      (b.img ? '<a class="fs-cv" href="' + esc(b.img) + '" target="_blank" rel="noopener"><img data-nocdn src="' + esc(b.img) + '" loading="lazy" alt="" onerror="this.style.opacity=0"></a>' : '') +
      '<div style="min-width:0;">' +
        '<div class="fs-t">' + esc(b.title) + '</div>' +
        (b.fields.length ? '<div class="fs-f">' + b.fields.map(function (f) { return '<span>' + (f[0] ? '<b>' + esc(f[0]) + '</b>' : '') + esc(f[1]) + '</span>'; }).join('') + '</div>' : '') +
        (b.desc ? '<div class="fs-d" onclick="this.classList.toggle(\'open\')">' + esc(b.desc) + '</div>' : '') +
        (b.links.length ? '<div class="fs-ls">' + b.links.slice(0, 12).map(function (l) {
          var here = fsHere(l.u);
          if (here) return '<a class="fs-l fs-here" href="' + esc(here) + '" onclick="navigate(this.getAttribute(\'href\'));return false;" title="play it on wavernrs">▶ play here</a>';
          return '<a class="fs-l" href="' + esc(l.u) + '" target="_blank" rel="noopener" title="' + esc(l.u) + '">' + esc(fsLinkLabel(l)) + '</a>';
        }).join('') + (b.links.length > 12 ? '<span class="fs-l">+' + (b.links.length - 12) + ' more</span>' : '') + '</div>' : '') +
      '</div></div>';
  }

  function fsDraw() {
    var box = document.getElementById('fs-out'); if (!box || !_fs) return;
    var words = _fs.q.toLowerCase().split(/\s+/).filter(Boolean);
    var html = '', shown = 0, total = 0, list = '', pendingH = null;
    function flush() { if (list) { html += '<div class="fs-list">' + list + '</div>'; list = ''; } }
    _fs.blocks.forEach(function (b) {
      if (b.k === 'h') { pendingH = b; return; }
      if (b.k === 'n') {
        if (words.length) return;
        if (shown >= _fs.limit) return;
        flush();
        if (pendingH) { html += '<div class="fs-h">' + esc(pendingH.t) + '</div>'; pendingH = null; }
        html += '<div class="fs-note' + (b.t.length > 320 ? ' clamp' : '') + '" onclick="this.classList.remove(\'clamp\')">' + esc(b.t) + '</div>';
        if (b.links.length) html += '<div class="fs-ls" style="margin:-4px 0 12px;">' + b.links.map(function (l) { return '<a class="fs-l" href="' + esc(l.u) + '" target="_blank" rel="noopener">' + esc(fsLinkLabel(l)) + '</a>'; }).join('') + '</div>';
        return;
      }
      if (words.length && !words.every(function (w) { return b.hay.indexOf(w) >= 0; })) return;
      total++;
      if (shown >= _fs.limit) return;
      if (pendingH) { flush(); html += '<div class="fs-h">' + esc(pendingH.t) + '</div>'; pendingH = null; }
      list += fsEntry(b); shown++;
    });
    flush();
    if (!total && !html) html = '<div class="wv-empty">' + (words.length ? 'nothing on this tab matches that' : 'this tab is empty') + '</div>';
    if (total > shown) html += '<button class="fs-more" onclick="fsMore()">show more (' + (total - shown).toLocaleString() + ' left)</button>';
    box.innerHTML = html;
    var cnt = document.getElementById('fs-count');
    if (cnt) cnt.textContent = total.toLocaleString() + (total === 1 ? ' entry' : ' entries') + (words.length ? ' match' : ' on this tab');
  }

  window.fsMore = function () { if (_fs) { _fs.limit += FS_PAGE * 2; fsDraw(); } };
  window.fsSearch = function (v) { if (!_fs) return; _fs.q = v; _fs.limit = FS_PAGE; clearTimeout(_fs.tm); _fs.tm = setTimeout(fsDraw, 120); };

  window.fsTab = async function (id) {
    if (!_fs) return;
    var tab = _fs.tabs.find(function (t) { return t.id === String(id); }) || _fs.tabs[0];
    _fs.tab = tab;
    document.querySelectorAll('#view .fs-tab').forEach(function (el) { el.classList.toggle('on', el.getAttribute('data-id') === tab.id); });
    history.replaceState(null, '', '/tracker?t=' + encodeURIComponent(_slug) + '&kind=sheet' + (tab === _fs.tabs[0] ? '' : '&tab=' + encodeURIComponent(tab.id)));
    var box = document.getElementById('fs-out');
    box.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    document.getElementById('fs-count').textContent = '';
    var slug = _slug, g;
    try { g = await sheetGrid(slug, _fs.info, tab); }
    catch (e) { if (_fs && _fs.tab === tab) box.innerHTML = '<div class="wv-empty">couldnt load this tab right now, try again in a bit</div>'; return; }
    if (!_fs || _fs.tab !== tab || _slug !== slug) return;
    _fs.blocks = fsParse(g); _fs.limit = FS_PAGE;
    fsDraw();
  };

  async function renderSheet(slug, tabId) {
    _slug = slug; _kind = 'sheet';
    var b = body(); if (!b) return;
    b.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    var d = _cache[slug + '|comp'], info, tabs;
    try {
      var res = await Promise.all([d ? d : api('/trackers/' + encodeURIComponent(slug) + '?kind=comp'), sheetInfo(slug)]);
      d = _cache[slug + '|comp'] = res[0]; info = res[1];
      if (!info || !info.kind) { renderTracker(slug, 'comp'); return; }
      tabs = await sheetTabs(slug, info);
    } catch (e) { b.innerHTML = '<div class="wv-empty">couldnt load the full tracker</div>'; return; }
    if (_slug !== slug || _kind !== 'sheet') return;
    document.title = 'wavernrs — ' + d.tracker.name;
    _fs = { info: info, tabs: tabs, q: '', limit: FS_PAGE, blocks: [] };
    var src = info.kind === 'gsheet' ? info.url : info.source;
    b.innerHTML = header(d.tracker, 'sheet') +
      '<div class="fs-tabs">' + tabs.map(function (t) { return '<button class="fs-tab" data-id="' + esc(t.id) + '" onclick="fsTab(\'' + esc(t.id) + '\')">' + esc(t.name) + '</button>'; }).join('') + '</div>' +
      '<div class="fs-bar"><label class="fs-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
        '<input type="search" placeholder="search this tab" oninput="fsSearch(this.value)"></label>' +
        (src ? '<a class="fs-src" href="' + esc(src) + '" target="_blank" rel="noopener">' + (info.kind === 'gsheet' ? 'open the sheet ↗' : 'original ↗') + '</a>' : '') + '</div>' +
      '<div class="fs-count" id="fs-count"></div><div id="fs-out"></div>';
    fsTab(tabId || tabs[0].id);
  }

  var _changes = {};
  function tkWhen(iso) { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function tkItem(x) {
    var name = esc(x.n) + (x.c ? ' <span>by ' + esc(x.c) + '</span>' : '');
    return '<li title="' + esc(x.era + ' · ' + x.n + (x.c ? ' by ' + x.c : '')) + '">' + (x.a ? '<a href="/album?id=' + esc(x.a) + '" onclick="navigate(this.getAttribute(\'href\'));return false;">' + name + '</a>' : name) + ' <span>· ' + esc(x.era) + '</span></li>';
  }
  async function paintChanges(slug) {
    if (!_changes[slug]) _changes[slug] = api('/trackers/changes?slug=' + encodeURIComponent(slug)).catch(function () { delete _changes[slug]; return null; });
    var d = await _changes[slug];
    if (!d || !d.items || !d.items.length || _slug !== slug || _kind !== 'comp') return;
    var top = document.querySelector('#view .tk-top'); if (!top || document.querySelector('#view .tk-new')) return;
    var x = d.items[0];
    var html = '<details class="tk-new"><summary>What’s new <span class="d">updated ' + esc(tkWhen(x.at)) + '</span>' +
      (x.added_count ? '<span class="pl">+' + x.added_count + ' added</span>' : '') + (x.removed_count ? '<span class="mi">−' + x.removed_count + ' removed</span>' : '') + (x.renamed_count ? '<span class="d">' + x.renamed_count + ' renamed</span>' : '') + '<span class="ar">▾</span></summary>' +
      (x.added.length ? '<h4>added</h4><ul>' + x.added.map(tkItem).join('') + '</ul>' : '') +
      (x.removed.length ? '<h4>removed from the tracker</h4><ul>' + x.removed.map(tkItem).join('') + '</ul>' : '') +
      (x.renamed && x.renamed.length ? '<h4>renamed</h4><ul>' + x.renamed.map(function (r) { return tkItem({ era: r.era, n: r.n, c: '', a: r.a }).replace('<span>· ', '<span>was ' + esc(r.from) + ' · '); }).join('') + '</ul>' : '') +
      (x.added_count > x.added.length || x.removed_count > x.removed.length ? '<div class="older">showing the first ' + Math.max(x.added.length, x.removed.length) + '</div>' : '') +
      (d.items.length > 1 ? '<div class="older">earlier: ' + d.items.slice(1, 6).map(function (o) { return esc(tkWhen(o.at)) + ' (+' + o.added_count + ' / −' + o.removed_count + ')'; }).join(' · ') + '</div>' : '') +
      '</details>';
    top.insertAdjacentHTML('afterend', html);
  }

  async function renderMissing(slug) {
    _slug = slug; _kind = 'missing';
    var b = body(); if (!b) return;
    b.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    var d = _cache[slug + '|comp'], m;
    try {
      var r = await Promise.all([d ? d : api('/trackers/' + encodeURIComponent(slug) + '?kind=comp'), api('/trackers/' + encodeURIComponent(slug) + '/missing')]);
      d = _cache[slug + '|comp'] = r[0]; m = r[1];
    } catch (e) { if (_slug === slug && _kind === 'missing') b.innerHTML = '<div class="wv-empty">couldnt load this</div>'; return; }
    if (_slug !== slug || _kind !== 'missing') return;
    sheetInfo(slug).then(function (info) {
      if (!info || !info.kind || _slug !== slug || _kind !== 'missing') return;
      var tabs = document.querySelector('#view .tk-tabs');
      if (tabs && !tabs.querySelector('[data-sheet]')) tabs.insertAdjacentHTML('beforeend', '<button data-sheet onclick="tkKind(\'sheet\')">Full tracker</button>');
    });
    history.replaceState(null, '', '/tracker?t=' + encodeURIComponent(slug) + '&kind=missing');
    var html = header(d.tracker, 'missing') +
      '<div class="tk-sub" style="margin:-6px 0 14px;">' + m.total + ' comp' + (m.total === 1 ? '' : 's') + ' on this tracker are not on wavernrs yet. the links go to wherever the tracker has them</div>' +
      '<div class="fs-bar"><label class="fs-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="tk-mq" placeholder="search these"></label></div>' +
      '<div id="tk-miss"></div>';
    b.innerHTML = html;
    function paint(q) {
      var w = String(q || '').toLowerCase().split(/\s+/).filter(Boolean), out = '', era = null;
      m.items.forEach(function (x) {
        var h = (x.name + ' ' + (x.creator || '') + ' ' + x.era).toLowerCase();
        if (w.length && !w.every(function (k) { return h.indexOf(k) >= 0; })) return;
        if (x.era !== era) { out += (era === null ? '' : '</div>') + '<div class="tk-group">' + esc(x.era) + '</div><div class="tk-list">'; era = x.era; }
        out += '<div class="tk-row"><div style="flex:1;min-width:0;"><div class="nm">' + (x.starred ? '⭐ ' : '') + esc(x.name) + '</div>' + (x.creator ? '<div class="by">' + esc(x.creator) + (x.tier === 'additional' ? ' · additional' : '') + '</div>' : '') +
          (x.links.length ? '<div class="tk-dl">' + x.links.map(function (u) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener nofollow">' + esc(tkHost(u)) + ' ↗</a>'; }).join('') + '</div>' : '<div class="by" style="color:var(--text-3);">no link on the tracker</div>') +
          '</div></div>';
      });
      if (era !== null) out += '</div>';
      var el = document.getElementById('tk-miss'); if (el) el.innerHTML = out || '<div class="wv-empty">nothing matches</div>';
    }
    paint('');
    var qi = document.getElementById('tk-mq'), tm = null;
    if (qi) qi.oninput = function () { clearTimeout(tm); tm = setTimeout(function () { paint(qi.value); }, 120); };
  }

  window.tkKind = function (kind) { renderTracker(_slug, kind); window.scrollTo(0, 0); };

  window.tkEra = async function (eraSlug) {
    var b = body(); if (!b) return;
    var slug = _slug, kind = _kind;
    b.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    var d;
    try { d = await api('/trackers/' + encodeURIComponent(slug) + '/era/' + encodeURIComponent(eraSlug) + '?kind=' + kind); }
    catch (e) { b.innerHTML = '<div class="wv-empty">couldnt load this era</div>'; return; }
    var t = d.tracker, era = d.era;
    document.title = 'wavernrs — ' + era.name;
    history.pushState(null, '', '/tracker?t=' + encodeURIComponent(slug) + '&era=' + encodeURIComponent(eraSlug) + (kind === 'comp' ? '' : '&kind=' + kind));
    var extraCount = d.items.filter(function (x) { return x.tier === 'additional'; }).length;
    var html = '<div class="tk-back" onclick="tkBack()">← ' + esc(t.name) + '</div>' +
      '<div class="tk-hero">' +
        '<div class="art" style="background:' + grad(era.name) + ';">' +
          (era.cover ? '<img src="' + esc(era.cover) + '" onerror="this.style.opacity=0">' : '') + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);">' +
            esc(t.name) + ' · ' + kindLabel(kind) + '</div>' +
          '<h1 style="margin:3px 0 4px;font-size:30px;font-weight:800;letter-spacing:-.03em;">' + esc(era.name) + '</h1>' +
          '<div class="tk-sub">' + d.items.length + ' ' + kindWord(kind, d.items.length) +
            (extraCount ? ' · ' + extraCount + ' additional' : '') + '</div>' +
        '</div></div>' +
      '<div style="height:14px;"></div>';

    // The tracker keeps a curated main list and a separate additional list of
    // comps that did not make the cut, so show them apart rather than merged.
    if (kind === 'art') {
      var placed = d.items.filter(function (x) { return x.group; });
      var rest = d.items.filter(function (x) { return !x.group; });
      if (placed.length) {
        html += '<div class="tk-sec-head">Best art<span>' + placed.length + '</span></div>' +
          '<div class="tk-art">' + placed.map(tkArtCard).join('') + '</div>';
      }
      if (rest.length) {
        if (placed.length) html += '<div class="tk-sec-head" style="margin-top:26px;">Everyone else<span>' + rest.length + '</span></div>';
        html += '<div class="tk-art">' + rest.map(tkArtCard).join('') + '</div>';
      }
      b.innerHTML = html;
      window.scrollTo(0, 0);
      return;
    }

    var mainItems = d.items.filter(function (x) { return x.tier !== 'additional'; });
    var extraItems = d.items.filter(function (x) { return x.tier === 'additional'; });
    html += '<div class="tk-list">' + mainItems.map(tkRow).join('') + '</div>';
    if (extraItems.length) {
      html += '<div class="tk-sec-head">Additional comps<span>' + extraItems.length + '</span></div>' +
        '<div class="tk-sec-note">these are on the trackers second list...they didnt make the main one.</div>' +
        '<div class="tk-list">' + extraItems.map(tkRow).join('') + '</div>';
    }
    b.innerHTML = html;
    window.scrollTo(0, 0);
  };

  function tkArtCard(x) {
    var link = (x.links && x.links.length) ? x.links[0] : '';
    var open = link ? '<a class="pc" href="' + esc(link) + '" target="_blank" rel="noopener">' : '<div class="pc">';
    return open +
        '<div class="cv" style="background:' + grad(x.name) + ';">' +
          (x.image ? '<img src="' + esc(x.image) + '" loading="lazy" onerror="this.style.opacity=0">' : '') + '</div>' +
        '<div class="nm">' + esc(x.name) + '</div>' +
        (x.group ? '<div class="pl">' + esc(x.group) + '</div>' : '') +
        (x.note ? '<div class="ds">' + esc(x.note) + '</div>' : '') +
        (link ? '</a>' : '</div>');
  }

  function tkHost(u) {
    try {
      var h = new URL(u).hostname.replace(/^www\./, '');
      var known = { 'drive.google.com': 'drive', 'mega.nz': 'mega', 'pixeldrain.com': 'pixeldrain', 'samply.app': 'samply', 'untitled.stream': 'untitled', 'youtube.com': 'youtube', 'youtu.be': 'youtube', 'soundcloud.com': 'soundcloud', 'bandlab.com': 'bandlab', 'krakenfiles.com': 'kraken', 'mediafire.com': 'mediafire', 'dropbox.com': 'dropbox' };
      return known[h] || h.split('.').slice(-2, -1)[0] || h;
    } catch (_) { return 'link'; }
  }
  function tkRow(x) {
    var a = x.album;
    var searchUrl = '/archive?q=' + encodeURIComponent(x.name);
    var go = a ? 'navigate(\'/album?id=' + a.id + '\')' : 'navigate(\'' + searchUrl + '\')';
    return '<div class="tk-row ' + (a ? 'hit' : 'hit tk-part') + '"' +
          (go ? ' onclick="' + go + '"' : '') + '>' +
        '<div class="cv" style="background:' + grad(x.name) + ';">' +
          (a && a.cover_url ? '<img src="' + esc(a.cover_url) + '" loading="lazy" onerror="this.style.opacity=0">' : '') + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="nm">' + (x.starred ? '⭐ ' : '') + (x.tag ? '<span title="' + esc(tkTagHint(x.tag)) + '" style="cursor:help;">' + esc(x.tag) + '</span> ' : '') + esc(x.name) + '</div>' +
          (x.creator ? '<div class="by">' + esc(x.creator) + '</div>' : '') +
          (x.description ? '<div class="ds">' + esc(x.description) + '</div>' : '') +
          sourceBadges(x) +
          (!a && x.links && x.links.length ? '<div class="tk-dl" onclick="event.stopPropagation()">' + x.links.slice(0, 6).map(function (u) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener nofollow">' + esc(tkHost(u)) + ' ↗</a>'; }).join('') + '</div>' : '') +
        '</div>' +
        (a ? '<span class="tk-tag">' + (a.track_count || 0) + ' track' + (a.track_count === 1 ? '' : 's') + '</span>'
           : '<span class="tk-tag" title="not on wavernrs yet, tap to search">search →</span>') +
        '</div>';
  }

  window.tkBack = function () { renderTracker(_slug, _kind); window.scrollTo(0, 0); };

  (function boot() {
    var p = new URLSearchParams(location.search);
    var slug = p.get('t'), era = p.get('era');
    var qk = p.get('kind');
    var kind = (qk === 'edit' || qk === 'art' || qk === 'sheet' || qk === 'missing') ? qk : 'comp';
    if (!slug) { navigate('/archive'); return; }
    if (typeof initPlayer === 'function') initPlayer();
    _slug = slug; _kind = kind;
    if (era && (kind === 'sheet' || kind === 'missing')) { kind = 'comp'; _kind = 'comp'; }
    if (era) window.tkEra(era); else if (kind === 'sheet') renderSheet(slug, p.get('tab')); else renderTracker(slug, kind);
  })();
})();
</script>
</body>
</html>
