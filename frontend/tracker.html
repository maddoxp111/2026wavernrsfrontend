<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — tracker</title>
  <link rel="stylesheet" href="/css/style.css?v=202609072220">
</head>
<body>

<div id="view">
  <style>
    #view .tk-hero { display:flex; gap:18px; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; }
    #view .tk-hero .art { width:120px; height:120px; border-radius:16px; overflow:hidden; flex-shrink:0; box-shadow:0 8px 26px rgba(0,0,0,.35); }
    #view .tk-hero .art img { width:100%; height:100%; object-fit:cover; }
    #view .tk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px 14px; }
    #view .tk-era { cursor:pointer; }
    #view .tk-era .cv { aspect-ratio:1; border-radius:12px; overflow:hidden; margin-bottom:8px; box-shadow:0 4px 14px rgba(0,0,0,.2); position:relative; }
    #view .tk-era .cv img { width:100%; height:100%; object-fit:cover; }
    #view .tk-era:hover .cv { transform:translateY(-2px); transition:transform .18s; }
    #view .tk-era .nm { font-size:13.5px; font-weight:700; line-height:1.3; }
    #view .tk-era .mt { font-size:11.5px; color:var(--text-3); margin-top:2px; }
    #view .tk-sec { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin:26px 0 12px; }
    #view .tk-row { display:flex; gap:12px; padding:10px; border-radius:12px; align-items:flex-start; }
    #view .tk-row:hover { background:var(--surface-2); }
    #view .tk-row .cv { width:56px; height:56px; border-radius:8px; overflow:hidden; flex-shrink:0; }
    #view .tk-row .cv img { width:100%; height:100%; object-fit:cover; }
    #view .tk-row .nm { font-weight:700; font-size:14.5px; }
    #view .tk-row .by { font-size:12.5px; color:var(--text-2); }
    #view .tk-row .ds { font-size:12.5px; color:var(--text-3); line-height:1.5; margin-top:3px; }
    #view .tk-miss { opacity:.62; }
    #view .tk-back { font-size:13px; color:var(--text-2); cursor:pointer; display:inline-block; margin-bottom:14px; }
    #view .tk-back:hover { color:var(--text); }
  </style>
  <div id="tk-body"><div class="loading"><div class="spinner"></div></div></div>
</div>

<script src="/js/api.js?v=202609072220"></script>
<script src="/js/layout.js?v=202609072220"></script>
<script src="/js/player.js?v=202609072220"></script>
<script src="/js/router.js?v=202609072220"></script>
<script>
(function () {
  var esc = window.escHtml || function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  function grad(seed) { return (window.coverGradient ? window.coverGradient(seed || '') : 'linear-gradient(135deg,#2a2a34,#15151b)'); }
  function el() { return document.getElementById('tk-body'); }

  async function renderTracker(slug) {
    var b = el(); if (!b) return;
    b.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    var d;
    try { d = await api('/trackers/' + encodeURIComponent(slug)); }
    catch (e) { b.innerHTML = '<div class="wv-empty">Could not load this tracker.</div>'; return; }
    var t = d.tracker;
    document.title = 'wavernrs — ' + t.name;
    var html = '<div class="tk-back" onclick="navigate(\'/archive.html\')">← Archive</div>' +
      '<div class="tk-hero">' +
        '<div class="art" style="background:' + grad(t.name) + ';">' + (t.cover ? '<img src="' + esc(t.cover) + '" onerror="this.style.opacity=0">' : '') + '</div>' +
        '<div style="flex:1;min-width:220px;">' +
          '<div style="font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);">Yedits tracker</div>' +
          '<h1 style="margin:4px 0 6px;font-size:32px;font-weight:800;letter-spacing:-.03em;">' + esc(t.name) + '</h1>' +
          '<div style="font-size:13.5px;color:var(--text-2);max-width:560px;line-height:1.55;">' + esc(t.blurb || '') + '</div>' +
          '<div style="font-size:12.5px;color:var(--text-3);margin-top:8px;">' + t.eras + ' eras · ' + t.entries.toLocaleString() + ' picks · ' + t.have.toLocaleString() + ' already on wavernrs' +
            (t.url ? ' · <a href="' + esc(t.url) + '" target="_blank" rel="noopener" style="color:var(--brand);font-weight:600;">source</a>' : '') + '</div>' +
        '</div>' +
      '</div>';
    (d.sections || []).forEach(function (sec) {
      html += '<div class="tk-sec">' + esc(sec.name) + ' · ' + sec.eras.length + ' eras</div><div class="tk-grid">';
      html += sec.eras.map(function (e) {
        var n = e.comps + e.edits;
        return '<div class="tk-era" onclick="tkEra(\'' + esc(t.slug) + '\',\'' + esc(e.slug) + '\')">' +
          '<div class="cv" style="background:' + grad(e.name) + ';">' + (e.cover ? '<img src="' + esc(e.cover) + '" loading="lazy" onerror="this.style.opacity=0">' : '') + '</div>' +
          '<div class="nm">' + esc(e.name) + '</div>' +
          '<div class="mt">' + n + ' pick' + (n !== 1 ? 's' : '') + ' · ' + e.have + ' here</div></div>';
      }).join('');
      html += '</div>';
    });
    b.innerHTML = html;
  }

  window.tkEra = async function (slug, eraSlug) {
    var b = el(); if (!b) return;
    history.pushState(null, '', '/tracker.html?t=' + encodeURIComponent(slug) + '&era=' + encodeURIComponent(eraSlug));
    b.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    var d;
    try { d = await api('/trackers/' + encodeURIComponent(slug) + '/era/' + encodeURIComponent(eraSlug)); }
    catch (e) { b.innerHTML = '<div class="wv-empty">Could not load this era.</div>'; return; }
    var t = d.tracker, era = d.era;
    document.title = 'wavernrs — ' + era.name;
    var comps = d.items.filter(function (x) { return x.kind === 'comp'; });
    var edits = d.items.filter(function (x) { return x.kind !== 'comp'; });
    var html = '<div class="tk-back" onclick="tkOpen(\'' + esc(slug) + '\')">← ' + esc(t.name) + '</div>' +
      '<div class="tk-hero">' +
        '<div class="art" style="background:' + grad(era.name) + ';">' + (era.cover ? '<img src="' + esc(era.cover) + '" onerror="this.style.opacity=0">' : '') + '</div>' +
        '<div style="flex:1;min-width:220px;">' +
          '<div style="font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);">' + esc(t.name) + '</div>' +
          '<h1 style="margin:4px 0 6px;font-size:32px;font-weight:800;letter-spacing:-.03em;">' + esc(era.name) + '</h1>' +
          '<div style="font-size:12.5px;color:var(--text-3);">' + d.items.length + ' picks · ' + era.have + ' on wavernrs' + (era.missing ? ' · ' + era.missing + ' not here yet' : '') + '</div>' +
        '</div>' +
      '</div>';

    function rows(list, label) {
      if (!list.length) return '';
      var out = '<div class="tk-sec">' + label + ' · ' + list.length + '</div>';
      out += list.map(function (x) {
        var a = x.album;
        var click = a ? ' onclick="navigate(\'/album.html?id=' + a.id + '\')" style="cursor:pointer;"' : '';
        return '<div class="tk-row' + (a ? '' : ' tk-miss') + '"' + click + '>' +
          '<div class="cv" style="background:' + grad(x.name) + ';">' + (a && a.cover_url ? '<img src="' + esc(a.cover_url) + '" loading="lazy" onerror="this.style.opacity=0">' : '') + '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="nm">' + (x.starred ? '<span title="Standout pick">⭐ </span>' : '') + esc(x.name) +
              (a ? '' : ' <span style="font-size:11px;color:var(--text-3);font-weight:600;">not on wavernrs yet</span>') + '</div>' +
            (x.creator ? '<div class="by">' + esc(x.creator) + '</div>' : '') +
            (x.description ? '<div class="ds">' + esc(x.description) + '</div>' : '') +
            (a ? '<div style="font-size:11.5px;color:var(--text-3);margin-top:3px;">' + (a.track_count || 0) + ' track' + (a.track_count === 1 ? '' : 's') + '</div>' : '') +
          '</div></div>';
      }).join('');
      return out;
    }
    html += rows(comps, 'Comps') + rows(edits, 'Edits');
    b.innerHTML = html;
    window.scrollTo(0, 0);
  };

  window.tkOpen = function (slug) {
    history.pushState(null, '', '/tracker.html?t=' + encodeURIComponent(slug));
    renderTracker(slug);
  };

  function boot() {
    var p = new URLSearchParams(location.search);
    var slug = p.get('t'), era = p.get('era');
    if (!slug) { navigate('/archive.html'); return; }
    if (era) window.tkEra(slug, era); else renderTracker(slug);
  }
  if (typeof initPlayer === 'function') initPlayer();
  boot();
})();
</script>
</body>
</html>
