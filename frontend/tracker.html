    _slug = slug; _kind = 'sheet';
    var b = body(); if (!b) return;
    b.innerHTML = loadingHtml(skHead() + skList(6));
    var d = _cache[slug + '|comp'], info, tabs;
    try {
      var res = await Promise.all([d ? d : api('/trackers/' + encodeURIComponent(slug) + '?kind=comp'), sheetInfo(slug)]);
      d = _cache[slug + '|comp'] = res[0]; info = res[1];
      if (!info || !info.kind) { renderTracker(slug, 'comp'); return; }
      tabs = await sheetTabs(slug, info);
    } catch (e) { if (_slug === slug && _kind === 'sheet') b.innerHTML = errorHtml('couldnt load the full tracker', function () { renderSheet(slug, tabId); }, e); return; }
    if (_slug !== slug || _kind !== 'sheet') return;
    document.title = 'wavernrs — ' + d.tracker.name;
    _fs = { info: info, tabs: tabs, q: '', limit: FS_PAGE, blocks: [] };
    var src = info.kind === 'gsheet' ? info.url : info.source;
    b.innerHTML = header(d.tracker, 'sheet', d) +
      '<div class="fs-tabs">' + tabs.map(function (t) { return '<button type="button" class="fs-tab" data-act="fstab" data-id="' + esc(t.id) + '">' + esc(t.name) + '</button>'; }).join('') + '</div>' +
      '<div class="fs-bar"><label class="fs-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
        '<input type="search" placeholder="search this tab" oninput="fsSearch(this.value)"></label>' +
        (src ? '<a class="fs-src" href="' + esc(src) + '" target="_blank" rel="noopener">' + (info.kind === 'gsheet' ? 'open the sheet ↗' : 'original ↗') + '</a>' : '') + '</div>' +
      '<div class="fs-count" id="fs-count"></div><div id="fs-out"></div>';
    fsTab(tabId || tabs[0].id);
  }

  var _changes = {};
  function tkWhen(iso) { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function tkItem(x) {
    var name = esc(x.n) + (x.c ? ' <span>by ' + esc(x.c) + '</span>' : '');
    return '<li title="' + esc(x.era + ' · ' + x.n + (x.c ? ' by ' + x.c : '')) + '">' + (x.a ? '<a href="/album?id=' + esc(x.a) + '" onclick="navigate(this.getAttribute(\'href\'));return false;">' + name + '</a>' : name) + ' <span>· ' + esc(x.era) + '</span></li>';
  }
  async function paintChanges(slug) {
    if (!_changes[slug]) _changes[slug] = api('/trackers/changes?slug=' + encodeURIComponent(slug)).catch(function () { delete _changes[slug]; return null; });
    var d = await _changes[slug];
    if (!d || !d.items || !d.items.length || _slug !== slug || _kind !== 'comp') return;
    var top = document.querySelector('#view .tk-top'); if (!top || document.querySelector('#view .tk-new')) return;
    var x = d.items[0];
    var html = '<details class="tk-new"><summary>What’s new <span class="d">updated ' + esc(tkWhen(x.at)) + '</span>' +
      (x.added_count ? '<span class="pl">+' + x.added_count + ' added</span>' : '') + (x.removed_count ? '<span class="mi">−' + x.removed_count + ' removed</span>' : '') + (x.renamed_count ? '<span class="d">' + x.renamed_count + ' renamed</span>' : '') + '<span class="ar">▾</span></summary>' +
      (x.added.length ? '<h4>added</h4><ul>' + x.added.map(tkItem).join('') + '</ul>' : '') +
      (x.removed.length ? '<h4>removed from the tracker</h4><ul>' + x.removed.map(tkItem).join('') + '</ul>' : '') +
      (x.renamed && x.renamed.length ? '<h4>renamed</h4><ul>' + x.renamed.map(function (r) { return tkItem({ era: r.era, n: r.n, c: '', a: r.a }).replace('<span>· ', '<span>was ' + esc(r.from) + ' · '); }).join('') + '</ul>' : '') +
      (x.added_count > x.added.length || x.removed_count > x.removed.length ? '<div class="older">showing the first ' + Math.max(x.added.length, x.removed.length) + '</div>' : '') +
      (d.items.length > 1 ? '<div class="older">earlier: ' + d.items.slice(1, 6).map(function (o) { return esc(tkWhen(o.at)) + ' (+' + o.added_count + ' / −' + o.removed_count + ')'; }).join(' · ') + '</div>' : '') +
      '</details>';
    top.insertAdjacentHTML('afterend', html);
  }

  async function renderMissing(slug) {
    _slug = slug; _kind = 'missing';
    var b = body(); if (!b) return;
    b.innerHTML = loadingHtml(skHead() + skList(8));
    var d = _cache[slug + '|comp'], m;
    try {
      var r = await Promise.all([d ? d : api('/trackers/' + encodeURIComponent(slug) + '?kind=comp'), api('/trackers/' + encodeURIComponent(slug) + '/missing')]);
      d = _cache[slug + '|comp'] = r[0]; m = r[1];
    } catch (e) { if (_slug === slug && _kind === 'missing') b.innerHTML = errorHtml('couldnt load the missing list', function () { renderMissing(slug); }, e); return; }
    if (_slug !== slug || _kind !== 'missing') return;
    addSheetTab(slug, 'missing');
    history.replaceState(null, '', '/tracker?t=' + encodeURIComponent(slug) + '&kind=missing');
    var html = header(d.tracker, 'missing', d) +
      '<div class="tk-sub" style="margin:-6px 0 14px;">' + m.total + ' comp' + (m.total === 1 ? '' : 's') + ' from this tracker that arent available on wavernrs. the links go to wherever the tracker has them</div>' +
      '<label class="tk-find">' + ICON_SEARCH + '<input type="search" id="tk-mq" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="search these" aria-label="search the comps that are not available"></label>' +
      '<div id="tk-miss"></div>';
    b.innerHTML = html;
    function paint(q) {
      var w = String(q || '').toLowerCase().split(/\s+/).filter(Boolean), out = '', era = null;
      m.items.forEach(function (x) {
        var h = (x.name + ' ' + (x.creator || '') + ' ' + x.era).toLowerCase();
        if (w.length && !w.every(function (k) { return h.indexOf(k) >= 0; })) return;
        if (x.era !== era) { out += (era === null ? '' : '</div>') + '<div class="tk-group">' + esc(x.era) + '</div><div class="tk-list">'; era = x.era; }
        out += '<div class="tk-row"><div style="flex:1;min-width:0;"><div class="nm">' + (x.starred ? '⭐ ' : '') + esc(x.name) + '</div>' + (x.creator ? '<div class="by">' + esc(x.creator) + (x.tier === 'additional' ? ' · additional' : '') + '</div>' : '') +
          ((x.links || []).filter(okUrl).length ? '<div class="tk-dl">' + x.links.filter(okUrl).map(function (u) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener nofollow">' + esc(tkHost(u)) + ' ↗</a>'; }).join('') + '</div>' : '<div class="by" style="color:var(--text-3);">no link on the tracker</div>') +
          '</div></div>';
      });
      if (era !== null) out += '</div>';
      var el = document.getElementById('tk-miss'); if (el) el.innerHTML = out || '<div class="wv-empty">nothing matches</div>';
    }
    paint('');
    var qi = document.getElementById('tk-mq'), tm = null;
    if (qi) qi.oninput = function () { clearTimeout(tm); tm = setTimeout(function () { paint(qi.value); }, 120); };
  }

  window.tkKind = function (kind) { renderTracker(_slug, kind); toTop(); };

  var _era = null, _eraF = 'all', _eraSeq = 0;

  function eraList(slug, kind) {
    var ck = slug + '|' + kind;
    if (_cache[ck]) return Promise.resolve(_cache[ck]);
    return api('/trackers/' + encodeURIComponent(slug) + '?kind=' + kind).then(function (d) { _cache[ck] = d; return d; }).catch(function () { return null; });
  }

  function flatEras(d) {
    var out = [];
    ((d && d.groups) || []).forEach(function (g) { g.eras.forEach(function (e) { out.push(e); }); });
    return out;
  }

  window.tkEra = async function (eraSlug, opts) {
    opts = opts || {};
    var b = body(); if (!b) return;
    var slug = _slug, kind = (_kind === 'edit' || _kind === 'art') ? _kind : 'comp';
    _kind = kind;
    var seq = ++_eraSeq;
    var url = eraUrl(slug, eraSlug, kind);
    if (opts.replace) history.replaceState(history.state, '', url); else history.pushState(null, '', url);
    b.innerHTML = loadingHtml(skHero() + skList(8));
    toTop();
    var d, list;
    try {
      var r = await Promise.all([
        api('/trackers/' + encodeURIComponent(slug) + '/era/' + encodeURIComponent(eraSlug) + '?kind=' + kind),
        eraList(slug, kind),
      ]);
      d = r[0]; list = r[1];
    } catch (e) {
      if (seq === _eraSeq) b.innerHTML = errorHtml('couldnt load this era', function () { window.tkEra(eraSlug, { replace: true }); }, e);
      return;
    }
    if (seq !== _eraSeq || _slug !== slug) return;
    var eras = flatEras(list), idx = -1;
    for (var i = 0; i < eras.length; i++) if (eras[i].slug === d.era.slug || eras[i].slug === eraSlug) { idx = i; break; }
    _era = { d: d, slug: slug, kind: kind, prev: idx > 0 ? eras[idx - 1] : null, next: idx >= 0 && idx < eras.length - 1 ? eras[idx + 1] : null };
    _eraF = 'all';
    paintEra();
  };

  function eraFilterFn(f) {
    if (f === 'here') return function (x) { return !!x.album; };
    if (f === 'missing') return function (x) { return !x.album; };
    if (f === 'star') return function (x) { return !!x.starred; };
    return function () { return true; };
  }

  function pnLink(e, dir, slug, kind) {
    if (!e) return '';
    return '<a class="' + dir + '" href="' + esc(eraUrl(slug, e.slug, kind)) + '" data-act="era" data-era="' + esc(e.slug) + '">' +
      '<div class="cv" style="background:' + grad(e.name) + ';">' + (e.cover ? '<img src="' + esc(e.cover) + '" loading="lazy" alt="" onerror="this.style.opacity=0">' : '') + '</div>' +
      '<div><small>' + (dir === 'pv' ? '← previous era' : 'next era →') + '</small><b>' + esc(e.name) + '</b></div></a>';
  }

  function paintEra() {
    var b = body(); if (!b || !_era) return;
    var d = _era.d, slug = _era.slug, kind = _era.kind, t = d.tracker, era = d.era;
    document.title = 'wavernrs — ' + era.name;
    var items = d.items || [];
    var haveN = items.filter(function (x) { return x.album; }).length;
    var starN = items.filter(function (x) { return x.starred; }).length;
    var extraCount = items.filter(function (x) { return x.tier === 'additional'; }).length;
    var pv = _era.prev, nx = _era.next;
    var html = '<div class="tk-eh"><a class="tk-back" href="' + esc(trackerUrl(slug, kind, _q.trim())) + '" data-act="back">← ' + esc(t.name) + '</a>' +
        '<a class="tk-ib' + (pv ? '' : ' off') + '" href="' + (pv ? esc(eraUrl(slug, pv.slug, kind)) : '#') + '"' + (pv ? ' data-act="era" data-era="' + esc(pv.slug) + '" title="' + esc(pv.name) + '"' : ' tabindex="-1" aria-disabled="true"') + ' aria-label="previous era">' + ICON_L + '</a>' +
        '<a class="tk-ib' + (nx ? '' : ' off') + '" href="' + (nx ? esc(eraUrl(slug, nx.slug, kind)) : '#') + '"' + (nx ? ' data-act="era" data-era="' + esc(nx.slug) + '" title="' + esc(nx.name) + '"' : ' tabindex="-1" aria-disabled="true"') + ' aria-label="next era">' + ICON_R + '</a></div>' +
      '<div class="tk-hero">' +
        '<div class="art" style="background:' + grad(era.name) + ';">' +
          (era.cover ? '<img src="' + esc(era.cover) + '" alt="" onerror="this.style.opacity=0">' : '') + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);">' +
            esc(t.name) + ' · ' + kindLabel(kind) + '</div>' +
          '<h1 style="margin:3px 0 4px;font-size:clamp(24px,5vw,30px);font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere;">' + esc(era.name) + '</h1>' +
          '<div class="tk-sub">' + items.length + ' ' + kindWord(kind, items.length) +
            (extraCount ? ' · ' + extraCount + ' additional' : '') +
            '</div>' +
        '</div></div>';

    if (kind === 'art') {
      var placed = items.filter(function (x) { return x.group; });
      var rest = items.filter(function (x) { return !x.group; });
      html += '<div style="height:14px;"></div>';
      if (placed.length) {
        html += '<div class="tk-sec-head">Best art<span>' + placed.length + '</span></div>' +
          '<div class="tk-art">' + placed.map(tkArtCard).join('') + '</div>';
      }
      if (rest.length) {
        if (placed.length) html += '<div class="tk-sec-head" style="margin-top:26px;">Everyone else<span>' + rest.length + '</span></div>';
        html += '<div class="tk-art">' + rest.map(tkArtCard).join('') + '</div>';
      }
      if (!items.length) html += '<div class="wv-empty">nothing in this era yet</div>';
    } else {
      var chips = [['all', 'all', items.length], ['here', 'on wavernrs', haveN], ['missing', 'not available', items.length - haveN]];
      if (starN) chips.push(['star', 'starred', starN]);
      html += '<div class="tk-chips" role="group" aria-label="filter">' + chips.map(function (c) {
        return '<button type="button" class="tk-chip' + (_eraF === c[0] ? ' on' : '') + '" data-act="filter" data-f="' + c[0] + '" aria-pressed="' + (_eraF === c[0]) + '"' + (c[2] || c[0] === 'all' ? '' : ' disabled') + '>' + c[1] + '<span>' + c[2] + '</span></button>';
      }).join('') + '</div><div id="tk-elist"></div>';
    }
    html += (pv || nx ? '<nav class="tk-pn" aria-label="other eras">' + pnLink(pv, 'pv', slug, kind) + pnLink(nx, 'nx', slug, kind) + '</nav>' : '');
    b.innerHTML = html;
    if (kind !== 'art') paintEraList();
  }

  function paintEraList() {
    var box = document.getElementById('tk-elist'); if (!box || !_era) return;
    var ok = eraFilterFn(_eraF), items = (_era.d.items || []).filter(ok);
    var mainItems = items.filter(function (x) { return x.tier !== 'additional'; });
    var extraItems = items.filter(function (x) { return x.tier === 'additional'; });
    var html = mainItems.length ? '<div class="tk-list">' + mainItems.map(function (x) { return tkRow(x); }).join('') + '</div>' : '';
    if (extraItems.length) {
      html += '<div class="tk-sec-head">Additional comps<span>' + extraItems.length + '</span></div>' +
        '<div class="tk-sec-note">these are on the trackers second list...they didnt make the main one.</div>' +
        '<div class="tk-list">' + extraItems.map(function (x) { return tkRow(x); }).join('') + '</div>';
    }
    if (!items.length) html = '<div class="tk-none">' + (_eraF === 'here' ? 'none of these are on wavernrs' : _eraF === 'missing' ? 'nothing unavailable here' : 'nothing here') + '</div>';
    box.innerHTML = html;
  }

  function tkArtCard(x) {
    var link = (x.links || []).filter(okUrl)[0] || '';
    var open = link ? '<a class="pc" href="' + esc(link) + '" target="_blank" rel="noopener">' : '<div class="pc">';
    return open +
        '<div class="cv" style="background:' + grad(x.name) + ';">' +
          (x.image ? '<img src="' + esc(x.image) + '" loading="lazy" alt="" onerror="this.style.opacity=0">' : '') + '</div>' +
        '<div class="nm">' + esc(x.name) + '</div>' +
        (x.group ? '<div class="pl">' + esc(x.group) + '</div>' : '') +
        (x.note ? '<div class="ds">' + esc(x.note) + '</div>' : '') +
        (link ? '</a>' : '</div>');
  }

  function tkHost(u) {
    try {
      var h = new URL(u).hostname.replace(/^www\./, '');
      var known = { 'drive.google.com': 'drive', 'mega.nz': 'mega', 'pixeldrain.com': 'pixeldrain', 'samply.app': 'samply', 'untitled.stream': 'untitled', 'youtube.com': 'youtube', 'youtu.be': 'youtube', 'soundcloud.com': 'soundcloud', 'bandlab.com': 'bandlab', 'krakenfiles.com': 'kraken', 'mediafire.com': 'mediafire', 'dropbox.com': 'dropbox' };
      return known[h] || h.split('.').slice(-2, -1)[0] || h;
    } catch (_) { return 'link'; }
  }
  function tkRow(x, opt) {
    opt = opt || {};
    var a = x.album, words = opt.words || null, links = (x.links || []).filter(okUrl);
    var inner =
        '<div class="cv" style="background:' + grad(x.name) + ';">' +
          (a && a.cover_url ? '<img src="' + esc(a.cover_url) + '" loading="lazy" alt="" onerror="this.style.opacity=0">' : '') + '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="nm">' + (x.starred ? '⭐ ' : '') + (x.tag ? '<span title="' + esc(tkTagHint(x.tag)) + '" style="cursor:help;">' + esc(x.tag) + '</span> ' : '') + (words ? hl(x.name, words) : esc(x.name)) + '</div>' +
          (x.creator || (opt.era && x.era) ? '<div class="by">' + (x.creator ? (words ? hl(x.creator, words) : esc(x.creator)) : '') +
            (opt.era && x.era ? '<span class="er">' + (x.creator ? ' · ' : '') + esc(x.era) + '</span>' : '') + '</div>' : '') +
          (x.description ? '<div class="ds">' + esc(x.description) + '</div>' : '') +
          sourceBadges(x) +
          (!a && links.length ? '<div class="tk-dl">' + links.slice(0, 6).map(function (u) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener nofollow">' + esc(tkHost(u)) + ' ↗</a>'; }).join('') + '</div>' : '') +
        '</div>';
    if (a) {
      return '<a class="tk-row hit" href="/album?id=' + encodeURIComponent(a.id) + '">' + inner +
        '<span class="tk-tag">' + (a.track_count || 0) + ' track' + (a.track_count === 1 ? '' : 's') + '</span></a>';
    }
    var searchUrl = '/archive?q=' + encodeURIComponent(x.name);
    return '<div class="tk-row hit tk-part" data-href="' + esc(searchUrl) + '">' + inner +
      '<a class="tk-tag" href="' + esc(searchUrl) + '" title="search the archive for it">search →</a></div>';
  }

  window.tkBack = function () { renderTracker(_slug, _kind); toTop(); };

  function onClick(e) {
    var b = body(); if (!b) return;
    var t = e.target;
    if (!t || !t.closest) return;
    var el = t.closest('[data-act]');
    if (el && b.contains(el)) {
      var act = el.getAttribute('data-act');
      if (el.tagName === 'A' && (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey)) return;
      if (act === 'era') { e.preventDefault(); window.tkEra(el.getAttribute('data-era')); return; }
      if (act === 'back') { e.preventDefault(); history.pushState(null, '', el.getAttribute('href')); window.tkBack(); return; }
      if (act === 'kind') { e.preventDefault(); window.tkKind(el.getAttribute('data-kind')); return; }
      if (act === 'fstab') { window.fsTab(el.getAttribute('data-id')); return; }
      if (act === 'clear') { e.preventDefault(); clearSearch(); return; }
      if (act === 'retry') { var fn = _retry; _retry = null; if (fn) fn(); return; }
      if (act === 'filter') {
        if (el.disabled) return;
        _eraF = el.getAttribute('data-f') || 'all';
        b.querySelectorAll('.tk-chip').forEach(function (c) { var on = c === el; c.classList.toggle('on', on); c.setAttribute('aria-pressed', String(on)); });
        paintEraList();
        return;
      }
    }
    if (t.closest('a, button, input, label')) return;
    var row = t.closest('.tk-row[data-href]');
    if (row && b.contains(row)) { if (window.getSelection && String(window.getSelection())) return; navigate(row.getAttribute('data-href')); }
  }

  (function bind() {
    var b = body(); if (!b || b._tkBound) return;
    b._tkBound = true;
    b.addEventListener('click', onClick);
    window._pageCleanup = window._pageCleanup || [];
    window._pageCleanup.push(function () { clearTimeout(_stm); _eraSeq++; _sseq++; });
  })();

  (function boot() {
    var p = new URLSearchParams(location.search);
    var slug = p.get('t'), era = p.get('era');
    var qk = p.get('kind');
    var kind = (qk === 'edit' || qk === 'art' || qk === 'sheet' || qk === 'missing') ? qk : 'comp';
    if (!slug) { navigate('/archive'); return; }
    if (typeof initPlayer === 'function') initPlayer();
    _slug = slug; _kind = kind;
    _q = String(p.get('q') || '').slice(0, 120);
    if (era && (kind === 'sheet' || kind === 'missing')) { kind = 'comp'; _kind = 'comp'; }
    if (era) window.tkEra(era, { replace: true }); else if (kind === 'sheet') renderSheet(slug, p.get('tab')); else renderTracker(slug, kind);
  })();
})();
</script>
