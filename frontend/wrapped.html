  function setRangeUI() {
    var bs = document.querySelectorAll('#wr-seg button');
    for (var k = 0; k < bs.length; k++) { var on = bs[k].getAttribute('data-range') === S.range; bs[k].classList.toggle('on', on); bs[k].setAttribute('aria-selected', on ? 'true' : 'false'); }
    var bt = $('wr-brandtxt'); if (bt) bt.textContent = 'wavernrs recap · ' + RANGE_SHORT[S.range];
  }

  function load(range) {
    S.range = range;
    try { localStorage.setItem('wv_recap_range', range); } catch (_) {}
    setRangeUI();
    try { var u = new URL(location.href); if (u.searchParams.get('range') !== range) { u.searchParams.set('range', range); history.replaceState(history.state, '', u.pathname + u.search); } } catch (_) {}
    var token = ++S.loadGen;
    var ld = $('wr-loading');
    var L = S.local = localData(range);
    var isIn = typeof isLoggedIn === 'function' && isLoggedIn();
    if (ld && isIn && !S.cache[range]) ld.style.display = '';
    var topCover = (L.top[0] && L.top[0].cover_url) || '';
    var hueP = new Promise(function (res) {
      if (!topCover || typeof extractCoverHues !== 'function') return res(null);
      var done = false;
      setTimeout(function () { if (!done) { done = true; res(null); } }, 2500);
      extractCoverHues(topCover, L.top[0].title || '', function (c) { if (!done) { done = true; res(c); } });
    });
    var timeout = new Promise(function (res) { setTimeout(function () { res('__timeout'); }, 12000); });
    Promise.all([Promise.race([serverData(range), timeout]), hueP, isIn ? fetchEras() : Promise.resolve([])]).then(function (res) {
      if (!S.alive || token !== S.loadGen) return;
      var D = res[0] === '__timeout' ? null : res[0];
      S.server = D;
      S.hue = harmonize(res[1]);
      var eras = res[2] || [];
      var eCover = '';
      if (D && D.top_eras && D.top_eras[0]) {
        var e0 = D.top_eras[0];
        eCover = e0.cover || ((eras.filter(function (x) { return x.id === e0.id; })[0] || {}).cover) || '';
      }
      var after = function () {
        if (!S.alive || token !== S.loadGen) return;
        if (!S.hue && D && D.likes && D.likes.recent && D.likes.recent[0] && typeof extractCoverHues === 'function' && !S._hueTried) {
          S._hueTried = true;
          extractCoverHues(D.likes.recent[0].cover_url, D.likes.recent[0].title || '', function (c) { S.hue = harmonize(c); finish(); });
          return;
        }
        finish();
      };
      var finish = function () {
        if (!S.alive || token !== S.loadGen) return;
        var model = build(L, D, eras);
        render(model);
        var bg = model.topCover;
        if (bg && typeof window.setPageBgImage === 'function') window.setPageBgImage(bg, 'recap');
        fitStory();
      };
      if (eCover && typeof extractCoverHues === 'function') {
        var fired = false;
        setTimeout(function () { if (!fired) { fired = true; after(); } }, 2000);
        extractCoverHues(eCover, D.top_eras[0].name, function (c) { if (fired) return; fired = true; S.eraHue = harmonize(c); after(); });
      } else { S.eraHue = null; after(); }
    }).catch(function (e) {
      if (e && e.navAborted) return;
      if (!S.alive || token !== S.loadGen) return;
      S.server = null;
      render(build(L, null, []));
      fitStory();
    });
  }

  function onKey(e) {
    if (!document.getElementById('wr-story')) return;
    var tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.shiftKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) return;
    if (document.querySelector('.wv-sheet, [aria-modal="true"], #player-fullscreen.open, #wv-queue-panel.open')) return;
    var st = $('wr-stage');
    var full = !!(st && st.classList.contains('full'));
    if (!full && tg && tg.closest && tg.closest('.player-bar, [role="slider"]')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); prev(); }
    else if (e.key === ' ' || e.key === 'k') {
      if (tg && (tg.tagName === 'BUTTON' || tg.tagName === 'A') && e.key === ' ') return;
      e.preventDefault(); e.stopPropagation(); S.paused = !S.paused; paintPause();
    }
    else if (e.key === 'Escape') { if (full) { e.preventDefault(); e.stopPropagation(); setFull(false); } }
  }

  function wire() {
    var story = $('wr-story');
    var holdTO = null, downX = 0, downAt = 0, downOnInt = false, pid = null;
    function release() { clearTimeout(holdTO); if (S.hold) { S.hold = false; story.classList.remove('held'); } }
    story.addEventListener('pointerdown', function (e) {
      if (e.button != null && e.button !== 0) return;
      var t = e.target;
      downOnInt = !!(t.closest && (t.closest('[data-wr-int]') || t.closest('.wr-top')));
      if (downOnInt) return;
      pid = e.pointerId; downX = e.clientX; downAt = Date.now();
      clearTimeout(holdTO);
      holdTO = setTimeout(function () { S.hold = true; story.classList.add('held'); }, 220);
    });
    story.addEventListener('pointerup', function (e) {
      if (downOnInt || pid !== e.pointerId) { downOnInt = false; return; }
      pid = null;
      var wasHold = S.hold || Date.now() - downAt > 260;
      release();
      if (wasHold) return;
      var r = story.getBoundingClientRect();
      if (e.clientY - r.top < 60) return;
      if (e.clientX - r.left < r.width * 0.3) prev(); else next();
    });
    story.addEventListener('pointercancel', function () { pid = null; release(); });
    story.addEventListener('pointerleave', function () { if (pid != null) { pid = null; release(); } });
    story.addEventListener('contextmenu', function (e) { if (S.hold) e.preventDefault(); });
    story.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-go],[data-play],[data-range-go],#wr-save,#wr-share,#wr-replay') : null;
      if (!t) return;
      e.stopPropagation();
      if (t.id === 'wr-save') return saveCard();
      if (t.id === 'wr-share') return shareCard();
      if (t.id === 'wr-replay') { S.paused = false; paintPause(); return go(0); }
      if (t.hasAttribute('data-play')) { playTop(); S.paused = true; paintPause(); return; }
      if (t.hasAttribute('data-range-go')) return load(t.getAttribute('data-range-go'));
      var href = t.getAttribute('data-go');
      if (href) { setFull(false); if (typeof navigate === 'function') navigate(href); else location.href = href; }
    });
    $('wr-pause').addEventListener('click', function () { S.paused = !S.paused; paintPause(); });
    $('wr-full').addEventListener('click', function () { var st = $('wr-stage'); setFull(!(st && st.classList.contains('full'))); });
    $('wr-prev').addEventListener('click', prev);
    $('wr-next').addEventListener('click', next);
    $('wr-seg').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button[data-range]') : null;
      if (!b) return;
      var r = b.getAttribute('data-range');
      if (r !== S.range) load(r);
    });
    $('wr-chaps').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.wr-chap') : null;
      if (b) go(Number(b.getAttribute('data-i')) || 0);
    });
    $('wr-side-save').addEventListener('click', function () { if (S.cardURL) saveCard(); else if (typeof wvToast === 'function') wvToast('your card is still drawing...'); });
    $('wr-side-link').addEventListener('click', copyLink);
    $('wr-full').innerHTML = I_EXPAND;
    paintPause();

    window.addEventListener('keydown', onKey, true);
    var onResize = function () { fitStory(); };
    window.addEventListener('resize', onResize);
    var ro = null;
    try {
      if (window.ResizeObserver) {
        ro = new ResizeObserver(onResize);
        ['wv-content', 'wv-banners'].forEach(function (id) { var el = document.getElementById(id); if (el) ro.observe(el); });
        var hd = document.querySelector('.wr-head'); if (hd) ro.observe(hd);
      }
    } catch (_) {}
    var fitTimers = [300, 1200, 3000].map(function (ms) { return setTimeout(onResize, ms); });
    S.teardown = function () {
      if (!S.alive) return;
      S.alive = false;
      cancelAnimationFrame(S.raf);
      window.removeEventListener('keydown', onKey, true);
      window.removeEventListener('resize', onResize);
      if (ro) try { ro.disconnect(); } catch (_) {}
      fitTimers.forEach(clearTimeout);
      document.documentElement.style.overflow = '';
      if (S.ph) { var stg = document.getElementById('wr-stage'); if (stg && stg.parentNode === document.body) stg.remove(); S.ph = null; }
      if (S.cardURL) { var u = S.cardURL; setTimeout(function () { try { URL.revokeObjectURL(u); } catch (_) {} }, 1000); }
    };
    window._pageCleanup.push(S.teardown);
  }

  wire();
  S.go = go;
  var qr = null;
  try { qr = new URL(location.href).searchParams.get('range'); } catch (_) {}
  var stored = null;
  try { stored = localStorage.getItem('wv_recap_range'); } catch (_) {}
  var start = ['year', '30d', 'all'].indexOf(qr) >= 0 ? qr : (['year', '30d', 'all'].indexOf(stored) >= 0 ? stored : 'year');
  setRangeUI();
  fitStory();
  load(start);
  S.raf = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
