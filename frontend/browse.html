  function fillTileCovers() {

      })).then(function (lists) {

  var F = { i: 0, n: 0, t: 0, hover: false, focus: false, iv: null };
  var DWELL = 7000, TICK = 100;
  function loadFeatured() {
    api('/discover/highlighted').then(function (items) {
      if (!S.alive) return;
      S.hl = (Array.isArray(items) ? items : []).filter(function (x) { return x && x.id && x.title; });

  function renderFeatured() {

    var dots = list.map(function (it, i) { return '<button type="button" class="br-dot' + (i === 0 ? ' on' : '') + '" data-dot="' + i + '" aria-label="Show ' + esc(it.title) + '"' + (i === 0 ? ' aria-current="true"' : '') + '><i><b></b></i></button>'; }).join('');
    box.innerHTML =

      '<div class="br-feat-ui' + (reduced() ? ' still' : '') + '" id="br-feat-ui"><div class="br-dots" role="group" aria-label="Featured slides">' + (list.length > 1 ? dots : '') + '</div>' +
        (list.length > 1 ? '<div class="br-arrows"><button type="button" data-feat-step="-1" aria-label="Previous featured">' + ICON.left + '</button><button type="button" data-feat-step="1" aria-label="Next featured">' + ICON.right + '</button></div>' : '') +
      '</div>';
    list.forEach(function (it, i) {

  function featGo(i, fromTimer) {
    if (!F.n) return;
    F.i = (i + F.n) % F.n;
    F.t = 0;
    document.querySelectorAll('#br-feat .br-slide').forEach(function (s, k) {
      var on = k === F.i;
      s.classList.toggle('on', on);
      if (on) s.removeAttribute('aria-hidden'); else s.setAttribute('aria-hidden', 'true');
      s.querySelectorAll('button, a.op').forEach(function (b) { if (on) b.removeAttribute('tabindex'); else b.setAttribute('tabindex', '-1'); });
    });
    document.querySelectorAll('#br-feat-ui .br-dot').forEach(function (d, k) {
      var on = k === F.i;
      d.classList.toggle('on', on);
      if (on) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current');
      var b = d.querySelector('b'); if (b) { b.style.transition = 'none'; b.style.transform = 'scaleX(0)'; }
    });
    if (!fromTimer) setProg();
  }
  function setProg() {
    var b = document.querySelector('#br-feat-ui .br-dot.on i b');
    if (!b) return;
    if (reduced()) { b.style.transform = 'scaleX(1)'; return; }
    b.style.transition = '';
    b.style.transform = 'scaleX(' + Math.min(1, F.t / DWELL) + ')';
  }
  function wireFeatured() {
    var feat = document.getElementById('br-feat');
    if (!feat) return;
    if (F.iv) { clearInterval(F.iv); F.iv = null; }
    feat.addEventListener('mouseenter', function () { F.hover = true; });
    feat.addEventListener('mouseleave', function () { F.hover = false; });
    var ui = document.getElementById('br-feat-ui');
    [feat, ui].forEach(function (el) {
      if (!el) return;
      el.addEventListener('focusin', function () { F.focus = true; });
      el.addEventListener('focusout', function (ev) { if (!ev.relatedTarget || !(feat.contains(ev.relatedTarget) || (ui && ui.contains(ev.relatedTarget)))) F.focus = false; });
    });
    feat.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { ev.preventDefault(); ev.stopPropagation(); featGo(F.i + (ev.key === 'ArrowRight' ? 1 : -1)); }
    });
    var x0 = null, y0 = 0;
    feat.addEventListener('touchstart', function (ev) { if (ev.touches.length !== 1) return; x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; F.hover = true; }, { passive: true });
    feat.addEventListener('touchend', function (ev) {

      if (x0 == null) return;
      var t = ev.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;

    }, { passive: true });
    if (F.n < 2 || reduced()) { setProg(); return; }
    F.iv = setInterval(function () {
      if (!S.alive || !document.getElementById('br-feat')) { clearInterval(F.iv); F.iv = null; return; }
      if (F.hover || F.focus || document.hidden) return;
      F.t += TICK;
      if (F.t >= DWELL) featGo(F.i + 1, true);
      setProg();
    }, TICK);
    onGone(function () { if (F.iv) clearInterval(F.iv); F.iv = null; });
  }
  function playFeatured(i) {

  function playTracks(list, it) {

    var idx = Math.max(0, playable.indexOf(it));

  function trackQ(x) {

      artist_id: x.artist_id || (x.artists && x.artists.id) || null };

    }).catch(function (err) { if (!(err && err.navAborted)) toast('couldnt pick one rn', 'error'); })

  function card(item, o) {
    o = o || {};
    var isAlbum = item._type === 'album';
    var single = isAlbum && item.is_archive && item.track_count === 1;
    var artist = item.archive_artist_name || (item.artists ? item.artists.display_name : '') || 'Unknown';
    var href = (isAlbum ? '/album?id=' : '/track?id=') + encodeURIComponent(item.id);
    var b = S.badges || {};
    var hl = isAlbum ? (b.highlighted_albums || []).indexOf(item.id) !== -1 : (b.highlighted_tracks || []).indexOf(item.id) !== -1;
    var ex = isAlbum ? (b.exclusive_albums || []).indexOf(item.id) !== -1 : (b.exclusive_tracks || []).indexOf(item.id) !== -1;
    var ver = item.artists && item.artists.id && (b.verified_artists || []).indexOf(item.artists.id) !== -1;
    var tail = '';
    if (o.plays && typeof item.play_count === 'number') tail = ' · ' + plural(item.play_count, 'play');
    else if (o.rank && item.external_likes) tail = ' · ♥ ' + num(item.external_likes);
    return '<div class="wv-comp-card br-card" data-href="' + esc(href) + '">' +
      '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + grad(item.title || '') + ';">' +
        '<a class="br-cl" href="' + esc(href) + '" tabindex="-1" aria-hidden="true">' + img(item.cover_url, 184) + '</a>' +
        (o.rank ? '<span class="br-rank">' + o.rank + '</span>' : '') +
        '<button type="button" class="wv-cover-play-btn" data-play="' + esc(item.id) + '" data-src="' + esc(o.src || 'list') + '" aria-label="Play ' + esc(item.title || '') + '">' + ICON.play + '</button>' +
      '</div></div>' +
      '<a class="wv-comp-card-title" href="' + esc(href) + '">' + esc(item.title || 'untitled') + (hl ? '<span class="wv-badge-hl-icon">★</span>' : '') + (ex ? '<span class="wv-badge-ex-icon">◆</span>' : '') + '</a>' +
      '<div class="wv-comp-card-artist">' + (isAlbum ? (single ? 'Edit' : 'Comp') : 'Edit') + ' · ' + esc(artist) + (ver ? '<span class="wv-verified-icon">✓</span>' : '') + tail + '</div>' +
    '</div>';
  }

  function eraList() { return String(S.era || '').split(',').filter(Boolean); }
  window.toggleEra = function (id) {
    var list = eraList();
    var i = list.indexOf(String(id));
    if (i >= 0) list.splice(i, 1); else list.push(String(id));
    if (!list.length) return window.go('tab', S.tab || 'recent');
    var u = new URL(location.href);
    u.searchParams.delete('tab');
    u.searchParams.set('era', list.join(','));
    history.replaceState(null, '', u);
    S.tab = ''; S.era = list.join(',');
    renderList();
  };
  window.go = function (kind, v) {
    var u = new URL(location.href);
    u.searchParams.delete('tab'); u.searchParams.delete('era');
    u.searchParams.set(kind, v);
    history.pushState(null, '', u);
    S.tab = kind === 'tab' ? v : ''; S.era = kind === 'era' ? v : '';
    if (!S.eras.length) {
      api('/eratags').then(function (t) { S.eras = Array.isArray(t) ? t : []; }).catch(function () {}).then(function () { if (S.alive) renderList(); });
      return;
    }
    renderList();
    var c = document.getElementById('wv-content');
    if (c) c.scrollTop = 0;
  };

  var L = null;
  var PAGE = 48, ARC_PAGE = 60;
  var SORT_SERVER = { newest: 'newest', oldest: 'oldest', title: 'title', artist: 'artist', plays: 'plays' };
  function when(x) { var t = new Date(x.original_date || x.created_at || 0).getTime(); return isNaN(t) ? 0 : t; }
  function who(x) { return String(x.archive_artist_name || (x.artists && x.artists.display_name) || ''); }
  function str(x) { return String(x || ''); }
  function cmpFor(sort) {
    if (sort === 'oldest') return function (a, b) { var ta = when(a), tb = when(b); if (!ta && !tb) return 0; if (!ta) return 1; if (!tb) return -1; return ta - tb; };
    if (sort === 'title') return function (a, b) { return str(a.title).localeCompare(str(b.title)); };
    if (sort === 'artist') return function (a, b) { return who(a).localeCompare(who(b)) || str(a.title).localeCompare(str(b.title)); };
    if (sort === 'plays') return function (a, b) { return (b.play_count || 0) - (a.play_count || 0); };
    return function (a, b) { return when(b) - when(a); };
  }
  function keyOf(it) { return (it._type || '') + ':' + it.id; }

  function newState(seq) {
    return { seq: seq, streams: [], out: [], seen: {}, rr: 0, shown: 0, busy: false, fail: false, io: null, numericPlays: false };
  }
  function pullSync(target) {
    var cmp = cmpFor(S.sort);
    while (L.out.length < target) {
      var heads = [], need = null;
      for (var i = 0; i < L.streams.length; i++) {
        var s = L.streams[i];
        if (s.i < s.items.length) heads.push(s);
        else if (!s.done) { need = s; break; }
      }
      if (need) return need;
      if (!heads.length) return null;
      var pick;
      if (S.sort === 'plays' && !L.numericPlays && heads.length > 1) { pick = heads[L.rr % heads.length]; L.rr++; }
      else { pick = heads[0]; for (var k = 1; k < heads.length; k++) if (cmp(heads[k].items[heads[k].i], pick.items[pick.i]) < 0) pick = heads[k]; }
      var it = pick.items[pick.i++];
      var key = keyOf(it);
      if (L.seen[key]) continue;
      L.seen[key] = 1;
      L.out.push(it);
    }
    return null;
  }
  function fetchArc(s) {
    var seq = L.seq;
    return api('/archive?limit=' + ARC_PAGE + '&offset=' + s.offset + '&sort=' + SORT_SERVER[S.sort] + '&kind=all&era=' + encodeURIComponent(s.era)).then(function (d) {
      if (!L || L.seq !== seq) return;
      var items = ((d && d.items) || (Array.isArray(d) ? d : [])).map(function (a) { return Object.assign({}, a, { _type: 'album', is_archive: true, era_tag_id: s.era }); });
      if (s.offset === 0 && typeof (d && d.total) === 'number') s.total = d.total;
      var enrich = S.sort === 'plays' ? withPlays(items) : Promise.resolve(items);
      return enrich.then(function (items) {
        if (!L || L.seq !== seq) return;
        if (items.length && items.every(function (x) { return typeof x.play_count === 'number'; })) L.numericPlays = true;
        s.items = s.items.concat(items);
        s.offset += items.length;
        if (items.length < ARC_PAGE) s.done = true;
      });
    });
  }
  function withPlays(items) {
    var missing = items.filter(function (x) { return typeof x.play_count !== 'number'; });
    if (!missing.length) return Promise.resolve(items);
    var chunks = [];
    for (var i = 0; i < missing.length; i += 40) chunks.push(missing.slice(i, i + 40));
    return Promise.all(chunks.map(function (c) {
      return api('/albums/batch/by-ids?ids=' + c.map(function (x) { return encodeURIComponent(x.id); }).join(',')).then(function (r) { return (r && r.items) || []; }).catch(function (e) { if (e && e.navAborted) throw e; return []; });
    })).then(function (parts) {
      var byId = {};
      parts.forEach(function (p) { p.forEach(function (r) { if (r && r.id) byId[r.id] = r; }); });
      return items.map(function (x) { var r = byId[x.id]; return r && typeof r.play_count === 'number' && typeof x.play_count !== 'number' ? Object.assign({}, x, { play_count: r.play_count }) : x; });
    });
  }
  function pull(target) {
    var seq = L.seq;
    var need = pullSync(target);
    if (!need) return Promise.resolve();
    return fetchArc(need).then(function () { if (L && L.seq === seq) return pull(target); });
  }
  function allDone() { return L.streams.every(function (s) { return s.done && s.i >= s.items.length; }); }

  function renderList() {
    var view = document.getElementById('view');
    if (!view) return;
    if (L && L.io) { try { L.io.disconnect(); } catch (_) {} }
    var seq = ++S.seq;
    L = newState(seq);
    var picked = eraList();
    var pickedObjs = picked.map(function (id) { return S.eras.filter(function (t) { return String(t.id) === id; })[0]; }).filter(Boolean);
    var eraObj = pickedObjs.length === 1 ? pickedObjs[0] : null;
    var title = pickedObjs.length ? pickedObjs.map(function (t) { return t.name; }).join(' + ') : ({ recent: 'New releases', trending: 'Trending', highlighted: 'Highlighted', comps: 'Comps', edits: 'Edits' }[S.tab] || 'Browse');
    var sorts = [['newest', 'Newest first'], ['oldest', 'Oldest first'], ['title', 'Title A–Z'], ['artist', 'Creator A–Z'], ['plays', 'Most played']];
    view.innerHTML =
      '<a class="br-back" href="/browse">' + ICON.left + 'Browse</a>' +
      '<div class="br-lhead">' +
        (eraObj ? '<div class="br-lart" style="background:' + grad(eraObj.name) + ';">' + img(eraObj.cover, 84) + '</div>' : '') +
        '<div style="min-width:0;"><h1 class="wv-page-title" style="margin:0;">' + esc(title) + '</h1>' +
        (eraObj ? '<div class="br-lmeta" id="br-lmeta"><a href="/eras?era=' + encodeURIComponent(eraObj.id) + '">Era details</a></div>' : '') + '</div>' +
      '</div>' +
      '<div class="br-hint"><span class="br-count br-count-m" id="br-count2"></span>' + (S.eras.length ? '<span>' + (picked.length ? 'tap more eras to add them...tap one again to take it off' : 'tap an era to pick it...you can pick more than one') + '</span>' : '') + '</div>' +
      '<div class="br-sentinel-top" id="br-top"></div>' +
      '<div class="br-sticky" id="br-sticky">' +
        (S.eras.length ? '<div class="br-chips" id="era-chips" role="group" aria-label="Eras"></div>' : '') +
        '<div class="br-ctrl">' +
          '<button type="button" class="br-go pl" data-act="playall">' + ICON.play + 'Play all</button>' +
          '<button type="button" class="br-go sh" data-act="shuffle">' + ICON.shuffle + 'Shuffle</button>' +
          '<select id="br-sort" class="wv-input" aria-label="Sort">' + sorts.map(function (s) { return '<option value="' + s[0] + '"' + (S.sort === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select>' +
          '<span class="br-count" id="br-count" aria-live="polite"></span>' +
        '</div>' +
      '</div>' +
      '<div class="wv-tile-grid" id="grid">' + gridSkel(10).replace(/^<div class="wv-tile-grid">|<\/div>$/g, '') + '</div>' +
      '<div class="br-more" id="br-more"></div>';
    if (S.eras.length) {
      var chips = document.getElementById('era-chips');
      chips.innerHTML =
        '<button type="button" class="wv-chip' + (!picked.length ? ' acc' : '') + '" data-chip-all="1" aria-pressed="' + (!picked.length) + '">All</button>' +
        S.eras.map(function (t) { var on = picked.indexOf(String(t.id)) >= 0; return '<button type="button" class="wv-chip' + (on ? ' acc' : '') + '" data-chip="' + esc(t.id) + '" aria-pressed="' + on + '">' + (on && picked.length > 1 ? '✓ ' : '') + esc(t.name) + '</button>'; }).join('');
      var firstOn = chips.querySelector('.wv-chip.acc');
      if (firstOn && firstOn.offsetLeft > chips.clientWidth - 80) chips.scrollLeft = firstOn.offsetLeft - 24;
    }
    wireSticky();
    if (eraObj) {
      eraStats().then(function () {
        var st = statFor(eraObj.id), m = document.getElementById('br-lmeta');
        if (!st || !m || S.seq !== seq) return;
        var bits = [];
        if (st.comps) bits.push(plural(st.comps, 'comp'));
        if (st.edits) bits.push(plural(st.edits, 'edit'));
        m.innerHTML = bits.join(' · ') + (bits.length ? ' · ' : '') + '<a href="/eras?era=' + encodeURIComponent(eraObj.id) + '">Era details</a>';
      }).catch(function () {});
    }
    var discP;
    if (picked.length) {
      discP = Promise.all(picked.map(function (id) { return api('/discover/era/' + encodeURIComponent(id)).catch(function (e) { if (e && e.navAborted) throw e; return []; }); }))
        .then(function (lists) { var all = []; lists.forEach(function (l) { if (Array.isArray(l)) all = all.concat(l); }); return all; });
    } else if (S.tab === 'trending') discP = api('/discover/trending');
    else if (S.tab === 'highlighted') discP = api('/discover/highlighted');
    else discP = api('/discover').then(function (d) { return (d && d.recent) || []; });
    L.discP = discP;
    loadInitial(seq, title, eraObj);
  }

  function loadInitial(seq, title, eraObj) {
    var picked = eraList();
    L.streams = [];
    L.discP.then(function (items) {
      if (!L || L.seq !== seq) return;
      items = Array.isArray(items) ? items : [];
      if (S.tab === 'comps') items = items.filter(function (i) { return i._type === 'album'; });
      if (S.tab === 'edits') items = items.filter(function (i) { return i._type !== 'album'; });
      var local = { items: items.slice().sort(cmpFor(S.sort)), i: 0, done: true, local: true };
      L.streams = [local].concat(picked.map(function (id) { return { era: id, items: [], i: 0, offset: 0, done: false, total: null }; }));
      var first = Promise.all(L.streams.filter(function (s) { return !s.local; }).map(fetchArc));
      return first.then(function () {
        if (!L || L.seq !== seq) return;
        var withCover = items.filter(function (i) { return i.cover_url; })[0];
        if (typeof window.setPageBgImage === 'function') window.setPageBgImage((eraObj && eraObj.cover) || (withCover ? withCover.cover_url : ''), title);
        return pull(PAGE).then(function () { if (L && L.seq === seq) paint(true); });
      });
    }).catch(function (err) {
      if (err && err.navAborted) return;
      if (!L || L.seq !== seq) return;
      var g = document.getElementById('grid');
      if (g && window.wvErrorHTML) g.innerHTML = window.wvErrorHTML(err, 'brRetry()');
      else if (g) g.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">couldnt load this<br><button class="wv-pill brand" onclick="brRetry()">Try again</button></div>';
    });
  }
  window.brRetry = function () { renderList(); };

  function paint(full) {
    var grid = document.getElementById('grid');
    if (!grid) return;
    var from = full ? 0 : L.shown;
    var chunk = L.out.slice(from);
    var o = { plays: S.sort === 'plays' };
    if (full) {
      grid.innerHTML = L.out.length ? chunk.map(function (it) { return card(it, o); }).join('') : '<div class="wv-empty" style="grid-column:1/-1;">nothing here yet</div>';
    } else if (chunk.length) {
      grid.insertAdjacentHTML('beforeend', chunk.map(function (it) { return card(it, o); }).join(''));
    }
    L.shown = L.out.length;
    paintCount();
    paintMore();
    watchMore();
  }
  function paintCount() {
    var c = document.getElementById('br-count'), c2 = document.getElementById('br-count2');
    if (!c) return;
    var local = L.streams.filter(function (s) { return s.local; })[0];
    var arcs = L.streams.filter(function (s) { return !s.local; });
    var exact = arcs.every(function (s) { return typeof s.total === 'number' || s.done; });
    var n = (local ? local.items.length : 0) + arcs.reduce(function (t, s) { return t + (typeof s.total === 'number' ? s.total : s.items.length); }, 0);
    var txt = L.out.length ? num(n) + (exact ? '' : '+') + (n === 1 ? ' release' : ' releases') : '';
    c.textContent = txt;
    if (c2) c2.textContent = txt;
  }
  function paintMore() {
    var m = document.getElementById('br-more');
    if (!m) return;
    if (L.fail) { m.innerHTML = '<span>couldnt load more</span><button type="button" class="wv-pill brand" data-act="more">Try again</button>'; return; }
    if (L.busy) { m.innerHTML = '<div class="br-spin" aria-label="Loading"></div>'; return; }
    if (allDone()) { m.innerHTML = L.out.length > PAGE ? '<div class="br-end">that is everything</div>' : ''; return; }
    m.innerHTML = '<button type="button" class="wv-pill" data-act="more">Show more</button>';
  }
  function loadMore() {
    if (!L || L.busy || allDone()) return;
    var seq = L.seq;
    L.busy = true; L.fail = false;
    paintMore();
    pull(L.out.length + PAGE).then(function () {
      if (!L || L.seq !== seq) return;
      L.busy = false;
      paint(false);
    }).catch(function (err) {
      if (err && err.navAborted) return;
      if (!L || L.seq !== seq) return;
      L.busy = false; L.fail = true;
      paintMore();
    });
  }
  function watchMore() {
    if (!('IntersectionObserver' in window)) return;
    var m = document.getElementById('br-more');
    if (!m) return;
    if (L.io) { try { L.io.disconnect(); } catch (_) {} }
    var seq = L.seq;
    L.io = new IntersectionObserver(function (entries) {
      if (!L || L.seq !== seq) return;
      if (entries.some(function (e) { return e.isIntersecting; }) && !L.fail) loadMore();
    }, { rootMargin: '700px 0px' });
    L.io.observe(m);
  }
  onGone(function () { if (L && L.io) try { L.io.disconnect(); } catch (_) {} });
  var stickyIO = null;
  function wireSticky() {
    if (stickyIO) { try { stickyIO.disconnect(); } catch (_) {} stickyIO = null; }
    var top = document.getElementById('br-top'), bar = document.getElementById('br-sticky');
    if (!top || !bar || !('IntersectionObserver' in window)) return;
    stickyIO = new IntersectionObserver(function (en) { bar.classList.toggle('stuck', !en[0].isIntersecting); }, { threshold: 0 });
    stickyIO.observe(top);
  }
  onGone(function () { if (stickyIO) try { stickyIO.disconnect(); } catch (_) {} stickyIO = null; });

  function setSort(v) {
    if (!SORT_SERVER[v]) v = 'newest';
    S.sort = v;
    try { localStorage.setItem('wv_browse_sort', v); } catch (_) {}
    if (!L) return;
    var seq = ++S.seq;
    var disc = L.discP;
    if (L.io) try { L.io.disconnect(); } catch (_) {}
    L = newState(seq);
    L.discP = disc;
    var g = document.getElementById('grid');
    if (g) g.innerHTML = gridSkel(10).replace(/^<div class="wv-tile-grid">|<\/div>$/g, '');
    var m = document.getElementById('br-more'); if (m) m.innerHTML = '';
    var picked = eraList();
    var pickedObjs = picked.map(function (id) { return S.eras.filter(function (t) { return String(t.id) === id; })[0]; }).filter(Boolean);
    loadInitial(seq, pickedObjs.map(function (t) { return t.name; }).join(' + '), pickedObjs.length === 1 ? pickedObjs[0] : null);
  }
  window.setBrowseSort = setSort;

  function findItem(id, src) {
    var pool = [];
    if (src && src.indexOf('shelf:') === 0) pool = _shelf[src.slice(6)] || [];
    else if (L) pool = L.out;
    return pool.filter(function (x) { return String(x.id) === String(id); })[0] || null;
  }
  function playCard(id, src) {
    var it = findItem(id, src);
    if (!it) return;
    if (it._type === 'album') { if (window.playCompById) window.playCompById(it.id, { album: it }); return; }
    playTracks(L ? L.out : [it], it);
  }

  function albumTracks(a) {
    return api('/albums/' + encodeURIComponent(a.id) + '/tracks').then(function (rows) {
      var who = (a.is_archive && a.archive_artist_name) || (a.artists && a.artists.display_name) || '';
      var tracks = (rows || []).map(function (r) { return r.tracks || r; }).filter(function (t) { return t && t.ia_url; });
      var credits = (typeof window.wvEditCredits === 'function' && window.wvEditCredits(tracks.map(function (t) { return t.title; }), who)) || [];
      return tracks.map(function (t, i) {
        return { id: t.id, title: credits[i] ? credits[i].title : t.title, ia_url: t.ia_url, cover_url: t.cover_url || a.cover_url || null,
          artist_name: credits[i] ? credits[i].credit : (who || (t.artists && t.artists.display_name) || ''),
          album_id: a.id, artist_id: t.artist_id || null, _album_id: a.id, _album_title: a.title || null, _album_cover: a.cover_url || null,
          _archive_artist: a.is_archive ? (a.archive_artist_name || null) : null };
      });
    }).catch(function (e) { if (e && e.navAborted) throw e; return []; });
  }
  function shuffleArr(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function playAll(btn, shuffled) {
    if (!L || !L.out.length) { toast('nothing to play yet'); return; }
    if (btn.classList.contains('busy')) return;
    var list = L.out.slice();
    if (shuffled) shuffleArr(list);
    var picked = [], albums = 0, tracks = 0;
    for (var i = 0; i < list.length && (albums < 6 || tracks < 60); i++) {
      var it = list[i];
      if (it._type === 'album') { if (albums < 6) { picked.push(it); albums++; } }
      else if (it.ia_url && tracks < 60) { picked.push(it); tracks++; }
    }
    if (!picked.length) { toast('nothing here can play yet'); return; }
    btn.classList.add('busy');
    Promise.all(picked.map(function (it) { return it._type === 'album' ? albumTracks(it) : Promise.resolve([trackQ(it)]); })).then(function (parts) {
      btn.classList.remove('busy');
      var q = [];
      parts.forEach(function (p) { q = q.concat(p); });
      q = q.slice(0, 200);
      if (shuffled) shuffleArr(q);
      if (!q.length) { toast('nothing here can play yet', 'error'); return; }
      window.setPlayerQueue(q, 0);
      window.playQueueIndex(0);
      toast((shuffled ? 'shuffling ' : 'playing ') + plural(q.length, 'track'));
    }).catch(function (err) { btn.classList.remove('busy'); if (!(err && err.navAborted)) toast('couldnt start playback', 'error'); });
  }

  var view = document.getElementById('view');
  if (view && !view._brWired) {
    view._brWired = true;
    view.addEventListener('click', function (ev) {
      var t = ev.target;
      var el;
      if ((el = t.closest('[data-feat-play]'))) { ev.preventDefault(); playFeatured(parseInt(el.getAttribute('data-feat-play'), 10)); return; }
      if ((el = t.closest('[data-feat-step]'))) { featGo(F.i + parseInt(el.getAttribute('data-feat-step'), 10)); return; }
      if ((el = t.closest('[data-dot]'))) { featGo(parseInt(el.getAttribute('data-dot'), 10)); return; }
      if ((el = t.closest('[data-play]'))) { ev.preventDefault(); ev.stopPropagation(); playCard(el.getAttribute('data-play'), el.getAttribute('data-src')); return; }
      if ((el = t.closest('[data-chip]'))) { window.toggleEra(el.getAttribute('data-chip')); return; }
      if ((el = t.closest('[data-chip-all]'))) { window.go('tab', S.tab || 'recent'); return; }
      if ((el = t.closest('[data-act]'))) {
        var act = el.getAttribute('data-act');
        if (act === 'surprise') return surprise(el, false);
        if (act === 'surprise-play') return surprise(el, true);
        if (act === 'playall') return playAll(el, false);
        if (act === 'shuffle') return playAll(el, true);
        if (act === 'more') { if (L) L.fail = false; return loadMore(); }
        return;
      }
      var plain = ev.button === 0 && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey && !ev.altKey;
      if ((el = t.closest('a[data-tab]')) && plain) { ev.preventDefault(); window.go('tab', el.getAttribute('data-tab')); return; }
      if ((el = t.closest('#br-eras a[data-era]')) && plain) { ev.preventDefault(); window.go('era', el.getAttribute('data-era')); return; }
      if (!t.closest('a,button,select') && (el = t.closest('.br-card[data-href]')) && plain) { if (window.navigate) window.navigate(el.getAttribute('data-href')); }
    });
    view.addEventListener('change', function (ev) { if (ev.target && ev.target.id === 'br-sort') setSort(ev.target.value); });
  }

  init();
})();
</script>
