<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — browse</title>
  <link rel="stylesheet" href="/css/style.css?v=db844f40ba53">
</head>
<body>
<div id="view"><div class="loading"><div class="spinner"></div></div></div>
<script src="/js/api.js?v=db844f40ba53"></script>
<script src="/js/layout.js?v=db844f40ba53"></script>
<script src="/js/player.js?v=db844f40ba53"></script>
<script src="/js/router.js?v=db844f40ba53"></script>
<script src="/js/playlists.js?v=db844f40ba53"></script>
<script>
initPlayer();
var _p = new URLSearchParams(location.search);
var _tab = _p.get('tab') || '';          // '' | recent | trending | highlighted | comps | edits
var _era = _p.get('era') || '';
var _eras = [];
var _items = [];
var _badges = {};
getBadgeData().then(function(b) { _badges = b || {}; }).catch(function() {});

// Fixed categories, each with a colour and a destination or in-page tab.
var CATS = [
  { k: 'recent',      l: 'New releases', h: 262 },
  { k: 'trending',    l: 'Trending',     h: 16 },
  { k: 'highlighted', l: 'Highlighted',  h: 42 },
  { k: 'comps',       l: 'Comps',        h: 200 },
  { k: 'edits',       l: 'Edits',        h: 330 },
  { href: '/charts.html',    l: 'Charts',    h: 150 },
  { href: '/artists.html',   l: 'Artists',   h: 275 },
  { href: '/stats.html',     l: 'Stats',     h: 190 },
  { href: '/archive.html',   l: 'Archive',   h: 220 },
  { href: '/community.html', l: 'Community', h: 95 },
  { href: '/resources.html', l: 'Tracker',   h: 300 },
];

function tileBg(h) { return 'linear-gradient(135deg, hsl(' + h + ',55%,42%), hsl(' + ((h + 40) % 360) + ',60%,26%))'; }

async function init() {
  if (typeof window.setPageWash === 'function') window.setPageWash('browse');
  try { _eras = await api('/eratags'); } catch (e) { _eras = []; }
  if (_tab || _era) return renderList();
  renderIndex();
}

function renderIndex() {
  var view = document.getElementById('view');
  var html = '<h1 class="wv-page-title">Browse all</h1>';
  html += '<div class="wv-browse-grid">';
  CATS.forEach(function(c, i) {
    var go = c.href ? "navigate('" + c.href + "')" : "go('tab','" + c.k + "')";
    html += '<div class="wv-browse-tile' + (i === 0 ? ' wide' : '') + '" data-tile="' + (c.k || c.href) + '" style="background:' + tileBg(c.h) + ';" onclick="' + go + '"><span>' + escHtml(c.l) + '</span><div class="fake" style="background:' + tileBg((c.h + 180) % 360) + ';"></div></div>';
  });
  html += '</div>';
  if (_eras.length) {
    html += '<div class="wv-sec-head"><h2 class="wv-sec-title">Eras</h2></div>';
    html += '<div class="wv-browse-grid">' + _eras.map(function(t) {
      var c = coverHues(t.name || '');
      return '<div class="wv-browse-tile" data-tile="era:' + escHtml(t.id) + '" style="background:' + tileBg(c.h1) + ';" onclick="go(\'era\',\'' + escHtml(t.id) + '\')"><span>' + escHtml(t.name) + '</span><div class="fake" style="background:' + tileBg(c.h2) + ';"></div></div>';
    }).join('') + '</div>';
  }
  view.innerHTML = html;
  // Each era has its own album art now; only fall back to a comp cover when
  // the wiki has nothing for that era (Turbo Grafx 16, Other).
  _eras.forEach(function(t) { if (t.cover) setTileCover('era:' + t.id, t.cover); });
  fillTileCovers();
}

function setTileCover(key, url) {
  if (!url) return;
  var tile = document.querySelector('.wv-browse-tile[data-tile="' + key + '"]');
  if (!tile || tile.querySelector('img')) return;
  var fake = tile.querySelector('.fake');
  var img = document.createElement('img');
  img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
  img.onerror = function() { img.remove(); };
  img.src = url;
  if (fake) fake.replaceWith(img); else tile.appendChild(img);
}

async function fillTileCovers() {
  var d;
  try { d = await api('/discover'); } catch (e) { return; }
  var recent = (d && d.recent) || [], trending = (d && d.trending) || [];
  var withCover = function(list, pred) { var it = list.find(function(x) { return x && x.cover_url && (!pred || pred(x)); }); return it ? it.cover_url : ''; };
  var used = {};
  var pick = function(list, pred) { var it = list.find(function(x) { return x && x.cover_url && !used[x.cover_url] && (!pred || pred(x)); }); if (it) { used[it.cover_url] = 1; return it.cover_url; } return withCover(list, pred); };
  setTileCover('recent', pick(recent));
  setTileCover('trending', pick(trending));
  setTileCover('comps', pick(recent, function(x) { return x._type === 'album'; }));
  setTileCover('edits', pick(recent, function(x) { return x._type === 'track'; }));
  setTileCover('/charts.html', pick(trending));
  setTileCover('/artists.html', pick(recent));
  setTileCover('/stats.html', pick(recent));
  _eras.forEach(function(t) { if (!t.cover) setTileCover('era:' + t.id, pick(recent, function(x) { return String(x.era_tag_id) === String(t.id); })); });
  try { var hl = await api('/discover/highlighted'); setTileCover('highlighted', pick(hl || [])); } catch (e) {}
  var missing = _eras.filter(function(t) { return !t.cover && !document.querySelector('.wv-browse-tile[data-tile="era:' + t.id + '"] img'); }).slice(0, 12);
  for (var i = 0; i < missing.length; i++) {
    try { var items = await api('/discover/era/' + encodeURIComponent(missing[i].id)); setTileCover('era:' + missing[i].id, pick(items || [])); } catch (e) {}
  }
}

window.go = function(kind, v) {
  var u = new URL(location.href);
  u.searchParams.delete('tab'); u.searchParams.delete('era');
  u.searchParams.set(kind, v);
  history.pushState(null, '', u);
  _tab = kind === 'tab' ? v : ''; _era = kind === 'era' ? v : '';
  renderList();
};

async function renderList() {
  var view = document.getElementById('view');
  var eraObj = _era ? _eras.find(function(t) { return String(t.id) === String(_era); }) : null;
  var title = eraObj ? eraObj.name : ({ recent: 'New releases', trending: 'Trending', highlighted: 'Highlighted', comps: 'Comps', edits: 'Edits' }[_tab] || 'Browse');
  view.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;margin:4px 0 6px;"><button class="wv-see-all" onclick="navigate(\'/browse.html\')">‹ Browse</button></div>' +
    '<h1 class="wv-page-title">' + escHtml(title) + '</h1>' +
    '<div class="wv-filters" id="era-chips"></div>' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;">' +
      '<select id="br-sort" class="wv-input" style="padding:8px 12px;font-size:13px;width:auto;" onchange="setBrowseSort(this.value)">' +
        '<option value="newest">Newest first</option>' +
        '<option value="oldest">Oldest first</option>' +
        '<option value="title">Title A–Z</option>' +
        '<option value="artist">Creator A–Z</option>' +
        '<option value="plays">Most played</option>' +
      '</select>' +
      '<span id="br-count" style="font-size:12px;color:var(--text-3);"></span>' +
    '</div>' +
    '<div class="wv-tile-grid" id="grid">' + '<div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>'.repeat(8) + '</div>';
  if (_eras.length) {
    document.getElementById('era-chips').innerHTML =
      '<span class="wv-chip' + (!_era ? ' acc' : '') + '" onclick="go(\'tab\',\'' + (_tab || 'recent') + '\')">All</span>' +
      _eras.map(function(t) { return '<span class="wv-chip' + (String(t.id) === String(_era) ? ' acc' : '') + '" onclick="go(\'era\',\'' + escHtml(t.id) + '\')">' + escHtml(t.name) + '</span>'; }).join('');
  }
  try {
    var items = [];
    if (_era) { items = await api('/discover/era/' + encodeURIComponent(_era)); }
    else if (_tab === 'trending') items = await api('/discover/trending');
    else if (_tab === 'highlighted') items = await api('/discover/highlighted');
    else { var d = await api('/discover'); items = d.recent || []; }
    if (_tab === 'comps') items = items.filter(function(i) { return i._type === 'album'; });
    if (_tab === 'edits') items = items.filter(function(i) { return i._type !== 'album'; });
    _items = Array.isArray(items) ? items : [];
    var eraArt = eraObj && eraObj.cover;
    var withCover = _items.find(function(i) { return i.cover_url; });
    if (typeof window.setPageBgImage === 'function') window.setPageBgImage(eraArt || (withCover ? withCover.cover_url : ''), title);
    var sel = document.getElementById('br-sort');
    if (sel) sel.value = _sort;
    paintGrid();
  } catch (err) {
    document.getElementById('grid').innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">Failed: ' + escHtml(err.message) + '</div>';
  }
}

var _sort = (function () { try { return localStorage.getItem('wv_browse_sort') || 'newest'; } catch (_) { return 'newest'; } })();
var _shown = 60;

window.setBrowseSort = function (v) {
  _sort = v;
  try { localStorage.setItem('wv_browse_sort', v); } catch (_) {}
  _shown = 60;
  paintGrid();
};

window.showMoreBrowse = function () { _shown += 60; paintGrid(); };

function _sorted(list) {
  var str = function (x) { return String(x || ''); };
  var when = function (x) { return new Date(x.original_date || x.created_at || 0).getTime(); };
  var who = function (x) { return x.archive_artist_name || (x.artists && x.artists.display_name) || ''; };
  var out = list.slice();
  if (_sort === 'oldest') out.sort(function (a, b) { return when(a) - when(b); });
  else if (_sort === 'title') out.sort(function (a, b) { return str(a.title).localeCompare(str(b.title)); });
  else if (_sort === 'artist') out.sort(function (a, b) { return who(a).localeCompare(who(b)) || str(a.title).localeCompare(str(b.title)); });
  else if (_sort === 'plays') out.sort(function (a, b) { return (b.play_count || 0) - (a.play_count || 0); });
  else out.sort(function (a, b) { return when(b) - when(a); });
  return out;
}

// A few hundred cards in one go is slow to paint and impossible to scan, so
// the list grows on demand.
function paintGrid() {
  var grid = document.getElementById('grid');
  if (!grid) return;
  var all = _sorted(_items);
  var page = all.slice(0, _shown);
  grid.innerHTML = page.length
    ? page.map(card).join('') +
      (all.length > page.length
        ? '<div style="grid-column:1/-1;display:flex;justify-content:center;padding:12px 0;">' +
          '<button class="wv-pill" style="padding:9px 20px;font-weight:700;" onclick="showMoreBrowse()">Show more (' + (all.length - page.length) + ' left)</button></div>'
        : '')
    : '<div class="wv-empty" style="grid-column:1/-1;">Nothing here yet</div>';
  var c = document.getElementById('br-count');
  if (c) c.textContent = all.length ? all.length.toLocaleString() + (all.length === 1 ? ' release' : ' releases') : '';
}

function card(item) {
  var isAlbum = item._type === 'album';
  var artist = item.archive_artist_name || (item.artists ? item.artists.display_name : '') || 'Unknown';
  var href = isAlbum ? '/album.html?id=' + item.id : '/track.html?id=' + item.id;
  var b = _badges || {};
  var hl = isAlbum ? (b.highlighted_albums || []).indexOf(item.id) !== -1 : (b.highlighted_tracks || []).indexOf(item.id) !== -1;
  var ex = isAlbum ? (b.exclusive_albums || []).indexOf(item.id) !== -1 : (b.exclusive_tracks || []).indexOf(item.id) !== -1;
  var ver = item.artists && (b.verified_artists || []).indexOf(item.artists.id) !== -1;
  return '<div class="wv-comp-card" onclick="navigate(\'' + href + '\')">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + coverGradient(item.title || '') + ';">' +
      (item.cover_url ? '<img src="' + escHtml(item.cover_url) + '" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">' : '') +
      '<button class="wv-cover-play-btn" aria-label="Play" onclick="event.stopPropagation();play(\'' + item.id + '\')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg></button>' +
    '</div></div>' +
    '<div class="wv-comp-card-title">' + escHtml(item.title || '') + (hl ? '<span class="wv-badge-hl-icon">★</span>' : '') + (ex ? '<span class="wv-badge-ex-icon">◆</span>' : '') + '</div>' +
    '<div class="wv-comp-card-artist">' + (isAlbum ? 'Comp' : 'Edit') + ' · ' + escHtml(artist) + (ver ? '<span class="wv-verified-icon">✓</span>' : '') + '</div>' +
  '</div>';
}
window.play = function(id) {
  var it = _items.find(function(i) { return i.id === id; }); if (!it) return;
  if (it._type === 'album') return playCompById(id, { album: it });
  if (!it.ia_url) { if (typeof wvToast === 'function') wvToast('That edit has no audio yet'); return; }
  var playable = _sorted(_items).filter(function (x) { return x._type !== 'album' && x.ia_url; });
  var idx = playable.findIndex(function (x) { return x.id === id; });
  var queue = playable.map(function (x) {
    return { id: x.id, title: x.title, ia_url: x.ia_url, cover_url: x.cover_url || null,
      artist_name: x.archive_artist_name || (x.artists && x.artists.display_name) || '', album_id: x.album_id || null };
  });
  setPlayerQueue(queue, Math.max(0, idx));
  playQueueIndex(Math.max(0, idx));
};
init();
</script>
</body>
</html>
