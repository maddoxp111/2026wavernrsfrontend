<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — edit</title>
  <link rel="stylesheet" href="/css/style.css?v=2d4aca45e0bb">
  <script src="/js/status-card.js?v=2d4aca45e0bb"></script>
  <script src="/js/down.js?v=2d4aca45e0bb"></script>
  <style>
    .trk-page { padding-bottom: 56px; }
    .trk-sk { background: var(--surface-2); border-radius: 8px; position: relative; overflow: hidden; }
    .trk-sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--hair-strong), transparent); animation: trk-shine 1.4s ease-in-out infinite; }
    @keyframes trk-shine { to { transform: translateX(100%); } }

    .trk-top { position: relative; isolation: isolate; }
    .trk-glow { position: absolute; z-index: -1; inset: -30px -16px -40px; pointer-events: none; opacity: 1; transition: opacity .6s ease;
      background:
        radial-gradient(46% 62% at 16% 38%, hsla(var(--trk-h, 262), 72%, 56%, .34), transparent 72%),
        radial-gradient(38% 52% at 62% 12%, hsla(var(--trk-h2, 300), 72%, 52%, .16), transparent 72%); }
    .theme-light .trk-glow { opacity: .6; }
    .trk-hero { display: flex; gap: 32px; align-items: flex-end; padding: 40px 0 22px; }
    .trk-cover { width: 240px; height: 240px; flex-shrink: 0; border-radius: 12px; overflow: hidden; position: relative; background: var(--surface-2);
      box-shadow: 0 30px 60px -20px hsla(var(--trk-h, 262), 65%, 32%, .75), 0 12px 28px rgba(0,0,0,.34); }
    .theme-light .trk-cover { box-shadow: 0 28px 54px -20px hsla(var(--trk-h, 262), 60%, 42%, .5), 0 8px 22px rgba(0,0,0,.12); }
    .trk-cover > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .trk-cover-play { position: absolute; right: 12px; bottom: 12px; width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
      background: var(--brand); color: var(--on-brand, #fff); box-shadow: 0 10px 24px rgba(0,0,0,.4); opacity: 0; transform: translateY(8px) scale(.94); transition: opacity .2s ease, transform .25s cubic-bezier(.16,1,.3,1); }
    .trk-cover-play svg { width: 22px; height: 22px; }
    .trk-cover:hover .trk-cover-play, .trk-cover-play:focus-visible, .trk-cover.is-cur .trk-cover-play { opacity: 1; transform: none; }
    .trk-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
    .trk-eyebrow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--text-2); }
    .trk-eyebrow .badge { text-transform: none; letter-spacing: .01em; }
    .trk-eq { display: none; align-items: flex-end; gap: 2px; height: 12px; color: var(--brand); }
    .trk-eq i { width: 3px; border-radius: 1px; background: currentColor; animation: trk-eq 1s ease-in-out infinite; }
    .trk-eq i:nth-child(1) { height: 60%; } .trk-eq i:nth-child(2) { height: 100%; animation-delay: -.35s; } .trk-eq i:nth-child(3) { height: 45%; animation-delay: -.7s; }
    @keyframes trk-eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .trk-eq i { transform-origin: bottom; }
    .trk-top.is-playing .trk-eq { display: inline-flex; }
    .trk-now { display: none; color: var(--brand); }
    .trk-top.is-playing .trk-now { display: inline; }
    .trk-title { margin: 0; font-size: clamp(30px, 4.6vw, 60px); font-weight: 900; letter-spacing: -.045em; line-height: 1.02; color: var(--text); text-wrap: balance; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding-bottom: .04em; }
    .trk-byline { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 14.5px; color: var(--text-2); }
    .trk-byline a { color: var(--text); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .trk-byline a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .trk-byline .trk-comp-a { color: var(--text-2); font-weight: 600; }
    .trk-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: rgba(255,255,255,.92); }
    .trk-dot { color: var(--text-3); }
    .trk-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; font-size: 13.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .trk-stats > span + span::before { content: "•"; margin: 0 9px; color: var(--text-3); opacity: .7; }
    .trk-stats b { color: var(--text-2); font-weight: 700; }
    .trk-rate { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 32px; }
    .trk-rate #rating-widget button { min-width: 32px; min-height: 32px; }
    .trk-deep { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--brand) 55%, transparent); background: var(--brand-bg); color: var(--brand); font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; transition: transform .15s ease, background .15s ease; }
    .trk-deep:hover { transform: translateY(-1px); }
    .trk-deep svg { width: 18px; height: 18px; }
    .trk-deep small { font-weight: 600; color: var(--text-2); font-size: 12.5px; }

    .trk-sentinel { height: 1px; margin-bottom: -1px; }
    .trk-bar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 10px; margin: 0 -16px; padding: 12px 16px; transition: background .2s ease, box-shadow .2s ease; }
    .trk-bar.is-stuck { background: var(--page-bg); background: color-mix(in srgb, var(--page-bg) 86%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); box-shadow: 0 1px 0 var(--hair), 0 10px 30px -18px rgba(0,0,0,.5); }
    .trk-play { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 48px; min-width: 116px; padding: 0 24px 0 18px; border-radius: 999px; border: 0; cursor: pointer; flex-shrink: 0;
      background: var(--brand); color: var(--on-brand, #fff); font: inherit; font-size: 15px; font-weight: 800; letter-spacing: -.01em;
      box-shadow: 0 10px 26px -10px color-mix(in srgb, var(--brand) 80%, transparent); transition: transform .18s cubic-bezier(.16,1,.3,1), filter .15s ease; }
    .trk-play:hover { filter: brightness(1.07); transform: scale(1.03); }
    .trk-play:active { transform: scale(.97); }
    .trk-play svg { width: 20px; height: 20px; flex-shrink: 0; }
    .trk-mini { display: none; align-items: center; gap: 10px; min-width: 0; flex: 1; opacity: 0; transition: opacity .2s ease; }
    .trk-bar.is-stuck .trk-mini { display: flex; opacity: 1; }
    .trk-mini img, .trk-mini .trk-mini-c { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .trk-mini span { font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
    .trk-ib { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--hair-strong); background: transparent; color: var(--text); display: inline-grid; place-items: center; cursor: pointer; text-decoration: none; transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    .trk-ib:hover { background: var(--glass-pill-bg-hover, var(--surface-hover)); border-color: transparent; }
    .trk-ib:active { transform: scale(.94); }
    .trk-ib svg { width: 19px; height: 19px; }
    .trk-pill { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; flex-shrink: 0; border-radius: 999px; border: 1px solid var(--hair-strong); background: transparent; color: var(--text); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: background .15s ease, border-color .15s ease, transform .15s ease; font-variant-numeric: tabular-nums; }
    .trk-pill:hover { background: var(--glass-pill-bg-hover, var(--surface-hover)); border-color: transparent; }
    .trk-pill:active { transform: scale(.97); }
    .trk-pill svg { width: 17px; height: 17px; }
    .trk-like.on { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); background: var(--brand-bg); }
    .trk-like.on svg { animation: trk-pop .4s cubic-bezier(.16,1,.3,1); }
    @keyframes trk-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .trk-bar.is-stuck .trk-hide-stuck { display: none; }
    .trk-more-wrap { position: relative; flex-shrink: 0; }
    .trk-menu { position: absolute; z-index: 40; top: calc(100% + 8px); left: 0; min-width: 240px; padding: 6px; border-radius: 14px; background: var(--elevated, var(--surface-2)); border: 1px solid var(--hair-strong);
      box-shadow: 0 22px 60px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.18); animation: trk-menu-in .16s ease-out; }
    .trk-menu.right { left: auto; right: 0; }
    .trk-menu.up { top: auto; bottom: calc(100% + 8px); }
    @keyframes trk-menu-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
    .trk-menu button, .trk-menu a { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .trk-menu button:hover, .trk-menu a:hover, .trk-menu button:focus-visible, .trk-menu a:focus-visible { background: var(--surface-hover, var(--hair)); outline: none; }
    .trk-menu svg { width: 18px; height: 18px; color: var(--text-2); flex-shrink: 0; }
    .trk-menu hr { border: 0; border-top: 1px solid var(--hair); margin: 5px 8px; }
    .trk-menu-ov { position: fixed; inset: 0; z-index: 9398; background: rgba(0,0,0,.5); animation: trk-fade .2s ease; }
    @keyframes trk-fade { from { opacity: 0; } }
    .trk-menu.sheet { position: fixed; z-index: 9399; left: 8px; right: 8px; top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); min-width: 0; max-height: calc(100dvh - 80px); overflow-y: auto; padding: 8px; border-radius: 20px; animation: trk-sheet-in .28s cubic-bezier(.16,1,.3,1); }
    @keyframes trk-sheet-in { from { transform: translateY(40px); opacity: 0; } }
    .trk-menu.sheet button, .trk-menu.sheet a { min-height: 48px; font-size: 15px; }
    .trk-menu-head { display: flex; align-items: center; gap: 12px; padding: 8px 10px 12px; margin-bottom: 4px; border-bottom: 1px solid var(--hair); }
    .trk-menu-head img, .trk-menu-head span { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .trk-menu-head div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .trk-menu-head b { font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trk-menu-head small { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .trk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; margin-top: 18px; align-items: start; }
    .trk-main { display: flex; flex-direction: column; gap: 36px; min-width: 0; }
    .trk-aside { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 84px; min-width: 0; }
    .trk-h2 { font-size: 20px; font-weight: 800; letter-spacing: -.025em; margin: 0; color: var(--text); display: flex; align-items: baseline; gap: 8px; }
    .trk-h2 .trk-count { font-size: 14px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }

    .trk-lyr { position: relative; border-radius: 18px; padding: 20px 22px 8px; overflow: hidden; isolation: isolate; border: 1px solid var(--hair);
      background: linear-gradient(165deg, hsla(var(--trk-h, 262), 48%, 34%, .5), hsla(var(--trk-h2, 300), 40%, 16%, .28) 70%), var(--surface); }
    .theme-light .trk-lyr { background: linear-gradient(165deg, hsla(var(--trk-h, 262), 70%, 88%, .9), hsla(var(--trk-h2, 300), 60%, 94%, .6) 70%), var(--surface); }
    .trk-lyr-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .trk-lyr-src { font-size: 12px; font-weight: 700; color: var(--text-2); padding: 3px 9px; border-radius: 999px; background: var(--hair); }
    .trk-lyr-tools { margin-left: auto; display: flex; gap: 6px; }
    .trk-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--hair-strong); background: transparent; color: var(--text); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background .15s ease; white-space: nowrap; }
    .trk-chip:hover { background: var(--hair); }
    .trk-chip[aria-pressed="true"] { background: var(--text); color: var(--page-bg); border-color: transparent; }
    .trk-chip svg { width: 15px; height: 15px; }
    .trk-lyr-hint { font-size: 12.5px; color: var(--text-2); margin: -2px 0 8px; display: none; }
    .trk-lyr.is-sharing .trk-lyr-hint { display: block; }
    .trk-lyr-scroll { position: relative; max-height: 440px; overflow-y: auto; overscroll-behavior: contain; margin: 0 -22px; padding: 18px 22px 150px; scrollbar-width: none;
      -webkit-mask-image: linear-gradient(transparent, #000 28px, #000 calc(100% - 90px), transparent); mask-image: linear-gradient(transparent, #000 28px, #000 calc(100% - 90px), transparent); }
    .trk-lyr-scroll::-webkit-scrollbar { display: none; }
    .trk-lyr-scroll.static { padding-bottom: 60px; }
    .trk-ll { display: block; width: calc(100% + 20px); margin: 0 -10px; padding: 7px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer;
      font: inherit; font-size: 23px; font-weight: 800; letter-spacing: -.022em; line-height: 1.3; color: var(--text); opacity: .82; transition: opacity .3s ease, transform .3s ease, background .15s ease; overflow-wrap: anywhere; }
    .trk-ll:hover { background: var(--hair); }
    .trk-lyr.is-live .trk-ll { opacity: .38; }
    .trk-lyr.is-live .trk-ll.is-past { opacity: .55; }
    .trk-lyr.is-live .trk-ll.is-on { opacity: 1; }
    .trk-lyr.is-live .trk-ll.is-on .trk-w { opacity: .5; transition: opacity .18s ease; }
    .trk-lyr.is-live .trk-ll.is-on .trk-w.on { opacity: 1; }
    .trk-ll.is-target { background: var(--brand-bg); }
    .trk-lyr.is-sharing .trk-ll { opacity: 1; }
    .trk-lyr.is-sharing .trk-ll:hover { background: var(--brand-bg); }
    .trk-lyr-static .trk-ll { cursor: default; }
    .trk-lyr-static .trk-ll:hover { background: transparent; }
    .trk-lyr-empty { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px 0 18px; }
    .trk-lyr-empty b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
    .trk-lyr-empty span { font-size: 14px; color: var(--text-2); line-height: 1.5; max-width: 420px; }
    .trk-lyr-empty .trk-pill { margin-top: 8px; }
    .trk-lyr-sk { display: flex; flex-direction: column; gap: 14px; padding: 12px 0 26px; }

    .trk-tl { margin: 4px 0 20px; padding: 14px 16px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--hair); }
    .trk-tl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--text-3); margin-bottom: 12px; }
    .trk-tl-top b { color: var(--text-2); font-weight: 700; }
    .trk-tl-rel { position: relative; }
    .trk-tl-bar { position: relative; height: 26px; cursor: pointer; touch-action: manipulation; }
    .trk-tl-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--hair-strong); }
    .trk-tl-fill { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--brand); width: 0; pointer-events: none; }
    .trk-tl-knob { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.4); pointer-events: none; display: none; }
    .trk-tl.is-cur .trk-tl-knob { display: block; }
    .trk-tl-dot { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; padding: 0; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; z-index: 2; }
    .trk-tl-dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--surface); transition: transform .15s ease; }
    .trk-tl-dot:hover::after, .trk-tl-dot:focus-visible::after { transform: scale(1.5); }
    .trk-tl-times { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .trk-bubble { display: none; position: absolute; bottom: 30px; transform: translateX(-50%); max-width: 240px; z-index: 5; pointer-events: none;
      background: var(--elevated, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--brand) 60%, transparent); border-radius: 12px; padding: 8px 11px; box-shadow: 0 10px 28px rgba(0,0,0,.35); }

    .trk-card { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 16px; }
    .trk-comp { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; transition: background .15s ease, transform .15s ease; }
    .trk-comp:hover { background: var(--surface-hover, var(--surface-2)); }
    .trk-comp-cover { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
    .trk-k { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .trk-comp-t { font-size: 15.5px; font-weight: 800; color: var(--text); letter-spacing: -.01em; line-height: 1.25; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .trk-comp-s { font-size: 13px; color: var(--text-2); margin-top: 2px; }
    .trk-chev { margin-left: auto; color: var(--text-3); flex-shrink: 0; }
    .trk-about { display: flex; flex-direction: column; gap: 14px; }
    .trk-creator { display: flex; align-items: center; gap: 12px; }
    .trk-creator .trk-avatar { width: 48px; height: 48px; font-size: 18px; }
    .trk-creator-n { font-size: 15.5px; font-weight: 800; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trk-desc { font-size: 14px; color: var(--text-2); line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; margin: 0; }
    .trk-facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13.5px; margin: 0; }
    .trk-facts dt { color: var(--text-3); }
    .trk-facts dd { margin: 0; color: var(--text); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trk-below { margin-top: 12px; }

    .trk-err { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 80px 16px; }
    .trk-err-ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); margin-bottom: 6px; }
    .trk-err b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
    .trk-err span { font-size: 14.5px; color: var(--text-2); max-width: 380px; line-height: 1.5; }
    .trk-err .trk-err-a { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }

    .trk-page :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .trk-page [hidden] { display: none !important; }
    .trk-mob-only { display: none !important; }
    .trk-desc.trk-clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .trk-desc.trk-clamp.is-open { display: block; -webkit-line-clamp: unset; overflow: visible; }

    @media (max-width: 960px) {
      .trk-grid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .trk-aside { position: static; order: -1; }
      .trk-about .trk-creator, .trk-about .trk-facts { display: none; }
      .trk-about.trk-about-nodesc { display: none; }
    }
    @media (max-width: 768px) {
      .trk-page.container { padding: 0; }
      .trk-glow { inset: -40px -16px -20px; }
      .trk-hero { flex-direction: column; align-items: stretch; gap: 20px; padding: 16px 0 10px; }
      .trk-cover { width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 10px; }
      .trk-cover-play { opacity: 1; transform: none; width: 56px; height: 56px; }
      .trk-title { font-size: clamp(26px, 8vw, 36px); }
      .trk-bar { gap: 8px; padding: 10px 16px; }
      .trk-desk-only { display: none !important; }

    e.preventDefault();
    e.stopPropagation();
    var t = _trkIsCur() ? audio.currentTime : 0;
    if (e.key === 'ArrowRight') t += 5; else if (e.key === 'ArrowLeft') t -= 5; else if (e.key === 'Home') t = 0; else t = dur - 1;
    trkSeekTo(Math.min(dur - 0.5, Math.max(0, t)));
  }

  // ── Live surfacing: pop a comment up when playback reaches its moment ──────
  var _tsLastTime = 0;
  var _tsBubbleUntil = 0;

  function _tsShowBubble(c) {
    var bub = document.getElementById('ts-bubble');
    if (!bub) return;
    var dur = _trkDur();
    if (!dur) return;
    var pct = Math.min(90, Math.max(10, (c.track_time / dur) * 100));
    document.getElementById('ts-bubble-user').textContent = (c.users && c.users.username) || 'unknown';
    document.getElementById('ts-bubble-time').textContent = '@ ' + fmtT(c.track_time);
    document.getElementById('ts-bubble-text').textContent = c.content || '';
    bub.style.left = pct + '%';
    bub.style.display = 'block';
    _tsBubbleUntil = Date.now() + 4500;
  }

  function _tsCheckCrossing() {
    if (!_isThisTrackLoaded() || audio.paused) { _tsLastTime = _isThisTrackLoaded() ? audio.currentTime : _tsLastTime; return; }
    var now = audio.currentTime;
    // Comments whose moment we just passed (forward) since the last check.
    // If several were crossed at once (e.g. a seek), surface the latest.
    var crossed = null;
    for (var i = 0; i < _tsComments.length; i++) {
      var t = Number(_tsComments[i].track_time);
      if (t > _tsLastTime && t <= now && now - t < 2) {
        if (!crossed || t > Number(crossed.track_time)) crossed = _tsComments[i];
      }
    }
    if (crossed) _tsShowBubble(crossed);
    _tsLastTime = now;
  }

  // The same song often sits on a dozen different comps under slightly
  // different spellings. Show where else it turns up.
  // The original song on the Ye tracker, when the title lines up with one.
  function _yeBase(t) {
    return String(t || '')
      .replace(/^\s*\d{1,3}\s*[-._)]\s*/, '')
      .replace(/^\s*\d{1,2}\s+(?=[A-Za-z])/, '')
      .replace(/\s*[\(\[][^\)\]]*[\)\]]/g, ' ')
      .replace(/\s+(feat|ft|prod|with)\.?\s.*$/i, '')
      .replace(/\s+-\s+.*$/, '')
      .replace(/\b(edit|remix|rework|fix|extended|version|remaster(ed)?|mix|cdq|hq|og|v\d+|demo|leak|final|full)\b/ig, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function _yeNorm(t) { return String(t || '').toLowerCase().replace(/[\[\(][^\]\)]*[\]\)]/g, ' ').replace(/[^a-z0-9]+/g, ''); }
  async function loadYeOriginals() {
    var el = document.getElementById('ye-originals');
    if (!el || !track) return;
    var base = _yeBase(track.title);
    if (base.length < 3) return;
    var d;
    try { d = await api('/resources/search?q=' + encodeURIComponent(base)); } catch (_) { return; }
    var nb = _yeNorm(base);
    var rows = ((d && d.results) || []).filter(function (r) { var n = _yeNorm(r.title); return n === nb || (nb.length >= 6 && n.indexOf(nb) === 0 && n.length - nb.length <= 6); }).slice(0, 5);
    if (!rows.length || !document.getElementById('ye-originals')) return;
    el.innerHTML = '<h2 class="section-title" style="margin-top:0;">On the Ye tracker</h2>' +
      '<div style="font-size:12.5px;color:var(--text-3);margin:-6px 0 10px;">the original ' + (rows.length === 1 ? 'song' : 'versions') + ' from the tracker</div>' +
      '<div class="track-list">' + rows.map(function (r) {
        var href = '/resources?tab=' + encodeURIComponent(r.tab) + '&era=' + encodeURIComponent(r.era) + '&q=' + encodeURIComponent(r.title);
        var art = r.art ? (typeof wvImg === 'function' ? wvImg(r.art, 96) : r.art) : '';
        return '<div class="track-row" style="cursor:pointer;" onclick="navigate(\'' + href.replace(/'/g, "\\'") + '\')">' +
          '<div style="width:44px;height:44px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden;background:' + coverGradient(r.era || '') + ';">' + (art ? '<img src="' + escHtml(art) + '" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">' : '') + '</div>' +
          '<div class="track-row-info"><div class="track-row-title">' + escHtml(r.title) + '</div>' +
          '<div class="track-row-artist">' + escHtml(r.era) + ' · ' + escHtml(String(r.tab).toLowerCase()) + (r.leak ? ' · ' + (/^released$/i.test(r.tab) ? 'released ' : 'leaked ') + escHtml(r.leak) : '') + '</div></div>' +
          (r.avail || r.quality ? '<span class="track-row-plays" style="white-space:nowrap;">' + escHtml([r.avail, r.quality].filter(Boolean).join(' · ')) + '</span>' : '') +
        '</div>';
      }).join('') + '</div>';
  }

  // The released song, with its credits from the discography.
  async function loadYeOfficial() {
    var el = document.getElementById('ye-official');
    if (!el || !track) return;
    var base = _yeBase(track.title);
    if (base.length < 2) return;
    var d;
    try { d = await api('/ye/disco/song?title=' + encodeURIComponent(base)); } catch (_) { return; }
    var rows = (d && d.items) || [];
    if (!rows.length || !document.getElementById('ye-official')) return;
    el.innerHTML = '<h2 class="section-title" style="margin-top:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;">The released song<a href="/resources?view=song&t=' + encodeURIComponent(rows[0].title) + '" onclick="navigate(this.getAttribute(\'href\'));return false;" style="font-size:12.5px;font-weight:700;color:var(--brand);text-decoration:none;">every version ›</a></h2>' +
      rows.map(function (r) {
        var href = '/resources?view=disco&album=' + encodeURIComponent(r.slug);
        var art = r.cover ? (typeof wvImg === 'function' ? wvImg(r.cover, 120) : r.cover) : '';
        var sub = [r.album, r.year].filter(Boolean).join(' · ') + (r.feat && r.feat.length ? ' · with ' + r.feat.join(', ') : '');
        return '<div class="track-row" style="cursor:pointer;align-items:flex-start;" onclick="navigate(\'' + href.replace(/'/g, "\\'") + '\')">' +
          '<div style="width:56px;height:56px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden;background:' + coverGradient(r.album || '') + ';">' + (art ? '<img src="' + escHtml(art) + '" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">' : '') + '</div>' +
          '<div class="track-row-info"><div class="track-row-title">' + escHtml(r.title) + '</div>' +
          '<div class="track-row-artist">' + escHtml(sub) + '</div>' +
          (r.producers && r.producers.length ? '<div style="font-size:12px;color:var(--text-3);margin-top:3px;">prod. ' + escHtml(r.producers.join(', ')) + '</div>' : '') +
          (r.samples && r.samples.length ? '<div style="font-size:12px;color:var(--text-3);margin-top:2px;">samples ' + r.samples.map(function (x) { return escHtml(x.t) + (x.a ? ' by ' + escHtml(x.a) : ''); }).join(' · ') + '</div>' : '') +
          ((r.preview || (r.links && (r.links.spotify || r.links.apple))) ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;" onclick="event.stopPropagation()">' +
            (r.preview ? '<button class="wv-pill" style="font-size:12px;padding:5px 12px;font-weight:700;" data-ypv="' + escHtml(r.preview) + '">▶ 30s preview</button>' : '') +
            (r.links && r.links.spotify ? '<a class="wv-pill" style="font-size:12px;padding:5px 12px;font-weight:700;text-decoration:none;" href="' + escHtml(r.links.spotify) + '" target="_blank" rel="noopener">spotify ↗</a>' : '') +
            (r.links && r.links.apple ? '<a class="wv-pill" style="font-size:12px;padding:5px 12px;font-weight:700;text-decoration:none;" href="' + escHtml(r.links.apple) + '" target="_blank" rel="noopener">apple music ↗</a>' : '') + '</div>' : '') +
          '</div><span class="track-row-plays" style="white-space:nowrap;">credits ›</span></div>';
      }).join('');
    var pv = null, pvBtn = null;
    var stopPv = function () { if (pv) pv.pause(); };
    if (typeof audio !== 'undefined' && audio && audio.addEventListener) audio.addEventListener('play', stopPv);
    if (window._pageCleanup) window._pageCleanup.push(function () { stopPv(); if (typeof audio !== 'undefined' && audio && audio.removeEventListener) audio.removeEventListener('play', stopPv); });
    el.querySelectorAll('[data-ypv]').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        if (pv && pvBtn === b) { if (pv.paused) pv.play().catch(function () {}); else pv.pause(); return; }
        stopPv();
        pv = new Audio(b.getAttribute('data-ypv')); pvBtn = b;
        pv.onplay = function () { b.textContent = '❚❚ 30s preview'; };
        pv.onpause = pv.onended = function () { b.textContent = '▶ 30s preview'; };
        pv.onerror = function () { b.textContent = 'cant play this'; };
        if (typeof pausePlayer === 'function') { try { pausePlayer(); } catch (_) {} }
        pv.play().catch(function () {});
      };
    });
  }

  async function loadAlsoOn() {
    var el = document.getElementById('also-on');
    if (!el || !track || !track.id) return;
    try {
      var d = await api('/tracks/' + track.id + '/also-on');
      var list = (d && d.albums) || [];
      if (!list.length) { el.remove(); return; }
      var more = d.total > list.length ? ' · showing ' + list.length : '';
      el.innerHTML =
        '<h2 class="section-title" style="margin-top:0;">Also on</h2>' +
        '<p style="margin:-6px 0 14px;font-size:12.5px;color:var(--text-3);">' +
          'this song is also on ' + d.total + (d.total === 1 ? ' other comp' : ' other comps') +
          (d.capped ? ' or more' : '') + more +
        '</p>' +
        '<div class="wv-comp-grid wv-comp-grid-4" id="trk-also-grid">' +
          list.map(function(a, i) {
            return renderMoreCard(Object.assign({}, a, {
              _type: 'album',
              artists: { display_name: a.creator },
            })).replace('<div class="wv-comp-card"', '<div class="wv-comp-card"' + (i >= 8 ? ' hidden' : ''));
          }).join('') +
        '</div>' +
        (list.length > 8 ? '<button type="button" class="trk-pill" style="margin-top:14px;" onclick="trkAlsoAll(this)">Show all ' + list.length + '</button>' : '');
    } catch (_) {
      if (el) el.remove();
    }
  }

  function trkAlsoAll(btn) {
    document.querySelectorAll('#trk-also-grid > [hidden]').forEach(function (el) { el.hidden = false; });
    if (btn) btn.remove();
  }

  async function loadMoreLikeThis() {
    if (!track) return;
    var el = document.getElementById('more-like-this');
    if (!el) return;
    try {
      var artist = track.artists || {};
      var artistId = artist.id;
      var eraTagId = track.era_tag ? track.era_tag.id : track.era_tag_id;
      var creator = trackCreator();

      // Fetch more by same artist + same era tag in parallel
      var results = await Promise.all([
        artistId ? api('/artists/' + artistId + '/tracks').catch(function() { return []; }) : Promise.resolve([]),
        artistId ? api('/albums/by-artist/' + artistId).catch(function() { return []; }) : Promise.resolve([]),
        eraTagId ? api('/discover/era/' + eraTagId).catch(function() { return []; }) : Promise.resolve([]),
      ]);
      var artistTracks = Array.isArray(results[0]) ? results[0] : [];
      var artistAlbums = Array.isArray(results[1]) ? results[1] : [];
      var eraTracks = Array.isArray(results[2]) ? results[2] : [];
      var byName = creator.archive ? '' : (artist.display_name || '');

      // Filter out current track, limit to 4 each
      var byArtist = [].concat(
        artistTracks.filter(function(t) { return t.id !== track.id; }).slice(0, 2).map(function(t) { return Object.assign({ artists: { display_name: byName } }, t, {_type:'track'}); }),
        artistAlbums.slice(0, 2).map(function(a) { return Object.assign({ artists: { display_name: byName } }, a, {_type:'album'}); })
      ).slice(0, 4);

      var byEra = eraTagId
        ? eraTracks.filter(function(t) { return t.id !== track.id && !byArtist.find(function(x) { return x.id === t.id; }); })
            .slice(0, 4)
            .map(function(t) { return Object.assign({}, t, {_type: t.album_tracks ? 'album' : 'track'}); })
        : [];

      var html = '';

      if (byArtist.length) {
        html += '<h2 class="section-title" style="margin-top:0;">' + (creator.archive ? 'More from the archive' : 'More by ' + escHtml(artist.display_name || 'this artist')) + '</h2>';
        html += '<div class="wv-comp-grid wv-comp-grid-4">' + byArtist.map(function(item) { return renderMoreCard(item); }).join('') + '</div>';
      }

      if (byEra.length) {
        var eraName = track.era_tag ? track.era_tag.name : '';
        html += '<h2 class="section-title" style="margin-top:32px;">More' + (eraName ? ' from ' + escHtml(eraName) : ' like this') + '</h2>';
        html += '<div class="wv-comp-grid wv-comp-grid-4">' + byEra.map(function(item) { return renderMoreCard(item); }).join('') + '</div>';
      }

      if (document.getElementById('more-like-this')) el.innerHTML = html;
    } catch (_) {}
  }

  function renderMoreCard(item) {
    var isAlbum = item._type === 'album';
    var bg = (typeof coverGradient === 'function') ? coverGradient(item.title || '') : '#333';
    var src = item.cover_url ? _trkImg(item.cover_url, 320) : '';
    var coverImg = src
      ? '<img src="' + escHtml(src) + '" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">'
      : '';
    var safeId = String(item.id || '').replace(/[^A-Za-z0-9_-]/g, '');
    if (!isAlbum) _trk.cards[safeId] = item;
    var clickAction = isAlbum
      ? "navigate('/album?id=" + safeId + "')"
      : "navigate('/track?id=" + safeId + "')";
    var artistName = item.artists ? (item.artists.display_name || '') : '';

    return '<div class="wv-comp-card" onclick="' + clickAction + '">' +
      '<div class="wv-comp-card-cover">' +
        '<div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
          coverImg +
          (!isAlbum ? '<button class="wv-cover-play-btn" aria-label="Play ' + _te(item.title || '') + '" onclick="event.stopPropagation();trkPlayCard(\'' + safeId + '\')">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
          '</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="wv-comp-card-title">' + escHtml(item.title || 'Untitled') + '</div>' +
      '<div class="wv-comp-card-artist">' + escHtml(artistName) + '</div>' +
    '</div>';
  }

  // The round play button on a card plays the edit in place; the card
  // itself still opens its page.
  function trkPlayCard(id) {
    var it = _trk.cards[id];
    var go = function (t) {
      if (!t || !t.ia_url || typeof playTrack !== 'function') { navigate('/track?id=' + id); return; }
      var archive = t.is_archive || (t.albums && t.albums.is_archive);
      var name = t.display_artist || (archive && (t.archive_artist_name || (t.albums && t.albums.archive_artist_name))) || (t.artists && t.artists.display_name) || (it && it.artists && it.artists.display_name) || '';
      var alb = t.albums && t.albums.id ? t.albums : null;
      playTrack(Object.assign({}, t, {
        artist_name: name,
        _archive_artist: archive && name ? name : null,
        _album_id: alb ? alb.id : null,
        _album_title: alb ? alb.title : null,
        _album_cover: alb ? alb.cover_url : null,
      }));
    };
    if (it && it.ia_url && it.artists && it.artists.display_name) { go(it); return; }
    api('/tracks/' + encodeURIComponent(id)).then(go).catch(function (e) { if (!e || !e.navAborted) navigate('/track?id=' + id); });
  }

  if (!_missingId) loadTrack();
</script>
