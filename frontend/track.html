<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">wavernrs stream</a>
  <div class="nav-links">
    <a href="/index.html">Home</a>

    <a href="/charts.html">Charts</a>
  </div>
  <div style="flex:1;max-width:260px;" class="nav-search-wrap">
    <input type="text" placeholder="Search edits, artists…"
      onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q.length>=2)navigate('/search.html?q='+encodeURIComponent(q));}">
  </div>
  <div class="nav-right" id="nav-right"></div>

<div id="view">
<div class="container" style="max-width:760px;">
  <div id="track-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>
</div><!-- /view -->

<!-- Mobile bottom nav -->
<div class="mobile-bottom-nav">
  <a href="/index.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/discover.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg></span>
    <span>Discover</span>
  </a>
  <a href="/charts.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></span>
    <span>Charts</span>
  </a>
  <a href="/search.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    <span>Search</span>
  </a>
  <a href="/dashboard.html" class="mobile-nav-item">
    <span class="mobile-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
    <span>Dashboard</span>
  </a>
</div>

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  updateNav();
  initPlayer();

  var trackId = new URLSearchParams(location.search).get('id');
  var track = null;
  var liked = false;
  // Map commentId -> user's vote (1 or -1 or 0)
  var myVotes = {};

  if (!trackId) navigate('/index.html');

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadTrack() {
    try {
      track = await api(`/tracks/${trackId}`);
      liked = track.user_liked;
      document.title = `${track.title} — wavernrs stream`;
      renderTrack();
      playTrack({ ...track, artist_name: track.artists?.display_name });
      loadComments();
    } catch (err) {
      document.getElementById('track-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">Edit not found</div><a href="/index.html" class="btn btn-primary" style="margin-top:16px">Go home</a></div>`;
    }
  }

  function renderTrack() {
    const artist = track.artists || {};
    const cover = track.cover_url
      ? `<img src="${track.cover_url}" alt="cover" style="width:100%;height:100%;object-fit:cover;">`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;">🎵</div>`;

    const eraName = track.era_tag?.name || track.genre || '';

    document.getElementById('track-container').innerHTML = `
      <div style="padding:32px 0;">
        <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;">
          <div style="width:200px;height:200px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1a0a2e,#2d1b6e);flex-shrink:0;">
            ${cover}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;">${escHtml(track.title)}</div>
            <a href="/artist.html?id=${artist.id}" style="font-size:16px;color:var(--text-secondary);font-weight:500;">${escHtml(artist.display_name || 'Unknown')}</a>
            ${eraName ? `<div style="margin-top:10px;"><span class="badge">${escHtml(eraName)}</span></div>` : ''}
            ${track.description ? `<p style="margin-top:12px;font-size:14px;color:var(--text-secondary);line-height:1.6;">${escHtml(track.description)}</p>` : ''}
            <div style="display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="togglePlay()" id="main-play-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Play
              </button>
              <button class="btn btn-secondary" id="like-btn" onclick="toggleLike()">
                ${liked ? '♥' : '♡'} ${fmtNum(track.like_count)}
              </button>
              <a href="${API_BASE}/tracks/${track.id}/download" class="btn btn-secondary" download>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 8h14v2H5z"/></svg>
                Download
              </a>
              <span style="font-size:13px;color:var(--text-tertiary);">${fmtNum(track.play_count)} plays</span>
            </div>
          </div>
        </div>

        <div style="margin-top:40px;">
          <h2 class="section-title">Comments</h2>
          <div id="comment-form" style="margin-bottom:20px;">
            ${isLoggedIn() ? `
              <div style="display:flex;gap:10px;align-items:flex-start;">
                <textarea id="comment-input" placeholder="Add a comment…" style="flex:1;min-height:60px;"></textarea>
                <button class="btn btn-primary" onclick="postComment()">Post</button>
              </div>
            ` : `<p style="font-size:14px;color:var(--text-secondary);">
              <a href="/login.html" style="color:var(--purple-light);font-weight:500;">Log in</a> to leave a comment.
            </p>`}
          </div>
          <div id="comments-list"><div class="loading"><div class="spinner"></div></div></div>
        </div>
      </div>`;
  }

  async function toggleLike() {
    if (!isLoggedIn()) return navigate('/login.html');
    try {
      const res = await api(`/tracks/${trackId}/like`, { method: 'POST' });
      liked = res.liked;
      const count = liked ? track.like_count + 1 : track.like_count - 1;
      track.like_count = count;
      document.getElementById('like-btn').innerHTML = `${liked ? '♥' : '♡'} ${fmtNum(count)}`;
    } catch (_) {}
  }

  async function loadComments() {
    try {
      const comments = await api(`/tracks/${trackId}/comments`);
      const el = document.getElementById('comments-list');
      if (!el) return;
      if (!comments.length) {
        el.innerHTML = `<p style="color:var(--text-tertiary);font-size:14px;">No comments yet.</p>`;
        return;
      }
      el.innerHTML = comments.map(c => {
        const net = (c.upvotes || 0) - (c.downvotes || 0);
        const myVote = myVotes[c.id] || 0;
        return `
          <div class="comment-item" id="comment-${c.id}">
            <div class="comment-avatar">${escHtml((c.users?.username || '?')[0].toUpperCase())}</div>
            <div style="flex:1;min-width:0;">
              <span class="comment-username">${escHtml(c.users?.username || 'unknown')}</span>
              <span class="comment-time">${timeAgo(c.created_at)}</span>
              <div class="comment-content">${escHtml(c.content)}</div>
              <div class="comment-votes">
                <button class="vote-btn ${myVote === 1 ? 'active-up' : ''}" onclick="voteComment('${c.id}', 1)">
                  ▲ <span id="vote-up-${c.id}">${c.upvotes || 0}</span>
                </button>
                <button class="vote-btn ${myVote === -1 ? 'active-down' : ''}" onclick="voteComment('${c.id}', -1)">
                  ▼ <span id="vote-down-${c.id}">${c.downvotes || 0}</span>
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    } catch (_) {}
  }

  async function voteComment(commentId, vote) {
    if (!isLoggedIn()) return navigate('/login.html');
    try {
      const res = await api(`/tracks/${trackId}/comments/${commentId}/vote`, {
        method: 'POST',
        body: JSON.stringify({ vote }),
      });
      // Toggle: if same vote, remove it
      if (myVotes[commentId] === vote) {
        myVotes[commentId] = 0;
      } else {
        myVotes[commentId] = vote;
      }
      // Update displayed counts
      if (res.upvotes !== undefined) {
        const upEl = document.getElementById(`vote-up-${commentId}`);
        const downEl = document.getElementById(`vote-down-${commentId}`);
        if (upEl) upEl.textContent = res.upvotes || 0;
        if (downEl) downEl.textContent = res.downvotes || 0;
      }
      // Update button active state
      const commentEl = document.getElementById(`comment-${commentId}`);
      if (commentEl) {
        commentEl.querySelectorAll('.vote-btn').forEach((btn, i) => {
          const v = i === 0 ? 1 : -1;
          btn.classList.toggle('active-up', myVotes[commentId] === 1 && v === 1);
          btn.classList.toggle('active-down', myVotes[commentId] === -1 && v === -1);
        });
      }
    } catch (_) {}
  }

  async function postComment() {
    const input = document.getElementById('comment-input');
    const content = input?.value.trim();
    if (!content) return;
    try {
      await api(`/tracks/${trackId}/comments`, {
        method: 'POST',
        body: JSON.stringify({ content }),
      });
      input.value = '';
      loadComments();
    } catch (err) {
      alert(err.message);
    }
  }

  loadTrack();
</script>
</body>
</html>
