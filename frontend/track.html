<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs stream — edit</title>
  <link rel="stylesheet" href="/css/style.css?v=202609060628">
</head>
<body>

<div id="view">
<div class="container" style="max-width:1100px;">
  <div id="track-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>
</div><!-- /view -->

<script src="/js/api.js?v=202609060628"></script>
<script src="/js/layout.js?v=202609060628"></script>
<script src="/js/player.js?v=202609060628"></script>
<script src="/js/router.js?v=202609060628"></script>
<script src="/js/playlists.js?v=202609060628"></script>
<script src="/js/ratings.js?v=202609060628"></script>
<script>
  initPlayer();

  var trackId = new URLSearchParams(location.search).get('id');
  var track = null;
  var liked = false;
  // Map commentId -> user's vote (1 or -1 or 0)
  var myVotes = {};

  if (!trackId) navigate('/index.html');

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadTrack() {
    // Only a failed fetch should show "not found". Everything after is
    // best-effort so a hiccup in a secondary call can't blank the page.
    try {
      track = await api(`/tracks/${trackId}`);
    } catch (err) {
      document.getElementById('track-container').innerHTML =
        `<div class="empty-state"><div class="empty-title">Edit not found</div><a href="/index.html" class="btn btn-primary" style="margin-top:16px">Go home</a></div>`;
      return;
    }
    try {
      liked = track.user_liked;
      document.title = `${track.title} — wavernrs stream`;
      if (typeof window.setPageBgImage === 'function') window.setPageBgImage(track.cover_url || '');
      await renderTrack();
      renderTracklist();
      loadComments();
      loadMoreLikeThis();
      if (typeof loadRatings === 'function') loadRatings('track', track.id);
    } catch (err) {
      console.error('track render error', err);
    }
  }

  function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(function() {
      var btn = document.getElementById('share-btn');
      if (!btn) return;
      var orig = btn.innerHTML;
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.innerHTML = orig; }, 2000);
    }).catch(function() {});
  }

  function playThisTrack() {
    if (!track) return;
    playTrack(Object.assign({}, track, { artist_name: track.artists ? track.artists.display_name : '' }));
  }

  async function renderTrack() {
    const artist = track.artists || {};

    const starEmpty = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.6"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
    const starPlaceholder = [1,2,3,4,5].map(i =>
      `<button type="button" data-s="${i}" style="background:none;border:none;cursor:pointer;padding:2px;line-height:0;">${starEmpty}</button>`
    ).join('');
    const ratingPlaceholder = `<div style="display:flex;align-items:center;gap:6px;"><div id="wv-stars" style="display:flex;align-items:center;">${starPlaceholder}</div><span style="font-size:13px;color:var(--text-3);">No ratings yet</span></div>`;

    const coverSrc = track.cover_url || (track.albums && track.albums.cover_url) || '';
    const cover = coverSrc
      ? `<img src="${escHtml(coverSrc)}" alt="cover" style="width:100%;height:100%;object-fit:cover;">`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;">🎵</div>`;

    const eraName = track.era_tag?.name || track.genre || '';
    const coverBg = (typeof coverGradient === 'function') ? coverGradient(track.title || '') : 'linear-gradient(135deg,#1a0a2e,#2d1b6e)';
    const gloss = '';

    let badgePills = '';
    try {
      const b = await (typeof getBadgeData === 'function' ? getBadgeData() : Promise.resolve({ highlighted_tracks: [], exclusive_tracks: [], verified_artists: [] }));
      if (b.highlighted_tracks && b.highlighted_tracks.indexOf(track.id) !== -1)
        badgePills += '<span class="wv-badge-highlight">★ Highlighted by Wavernrs</span>';
      if (b.exclusive_tracks && b.exclusive_tracks.indexOf(track.id) !== -1)
        badgePills += '<span class="wv-badge-exclusive">◆ Wavernrs Exclusive</span>';
    } catch (e) {}

    document.getElementById('track-container').innerHTML = `
      <div style="padding:32px 0;">
        <div class="wv-media-header" style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;">
          <div class="wv-media-header-cover" style="width:200px;height:200px;border-radius:16px;overflow:hidden;background:${coverBg};flex-shrink:0;position:relative;box-shadow:0 8px 32px rgba(0,0,0,0.22);">
            ${gloss}
            ${cover}
          </div>
          <div class="wv-media-header-info" style="flex:1;min-width:0;">
            ${badgePills ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">${badgePills}</div>` : ''}
            <div class="wv-title" style="font-size:28px;font-weight:800;letter-spacing:-0.04em;margin-bottom:6px;line-height:1.15;color:var(--text);">${escHtml(track.title)}</div>
            <a href="/artist.html?id=${artist.id}" style="font-size:15px;color:var(--text-2);font-weight:500;text-decoration:none;">${escHtml(artist.display_name || 'Unknown')}</a>
            ${eraName ? `<div style="margin-top:10px;"><span class="badge">${escHtml(eraName)}</span></div>` : ''}
            ${track.description ? `<p style="margin-top:12px;font-size:14px;color:var(--text-2);line-height:1.65;">${escHtml(track.description)}</p>` : ''}
            <div style="display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap;">
              <button class="btn btn-secondary" id="like-btn" onclick="toggleLike()">
                ${liked ? '♥' : '♡'} ${fmtNum(track.like_count)}
              </button>
            </div>
            <div id="rating-widget" style="margin-top:10px;">${ratingPlaceholder}</div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="playThisTrack()" id="main-play-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Play
              </button>
              <a href="${API_BASE}/tracks/${track.id}/download" class="btn btn-secondary" download>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 8h14v2H5z"/></svg>
                Download
              </a>
              <button class="btn btn-secondary" id="share-btn" onclick="copyLink()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z"/></svg>
                Share
              </button>
              <span style="font-size:13px;color:var(--text-3);">${fmtNum(track.play_count)} plays</span>
            </div>
          </div>
        </div>

        <div style="margin-top:32px;">
          <h2 class="section-title">Tracklist</h2>
          <div class="track-list" id="track-tracklist"></div>
        </div>

        <div style="margin-top:40px;">
          <h2 class="section-title">Comments</h2>
          <div id="ts-timeline-wrap" style="display:none;margin-bottom:18px;">
            <div style="font-size:11.5px;color:var(--text-3);margin-bottom:6px;">Comments on the timeline — tap a dot to jump there</div>
            <div style="position:relative;">
              <div id="ts-bubble" style="display:none;position:absolute;bottom:30px;transform:translateX(-50%);max-width:240px;z-index:5;background:var(--surface-2,#1a1a1a);border:1px solid var(--brand);border-radius:12px;padding:8px 11px;box-shadow:0 6px 24px rgba(0,0,0,0.4);pointer-events:none;">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
                  <span id="ts-bubble-user" style="font-size:11.5px;font-weight:700;color:var(--brand);"></span>
                  <span id="ts-bubble-time" style="font-size:10.5px;color:var(--text-3);"></span>
                </div>
                <div id="ts-bubble-text" style="font-size:12.5px;color:var(--text);line-height:1.4;word-break:break-word;"></div>
              </div>
              <div id="ts-timeline" style="position:relative;height:22px;background:var(--hair);border-radius:11px;"></div>
            </div>
          </div>
          <div id="comment-form" style="margin-bottom:24px;">
            ${isLoggedIn() ? `
              <div style="display:flex;flex-direction:column;gap:10px;">
                <textarea id="comment-input" class="wv-input" placeholder="Add a comment…"
                  style="min-height:72px;resize:vertical;line-height:1.5;"
                  onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))postComment()"></textarea>
                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
                  <button id="ts-toggle" onclick="toggleTsComment()" title="Pin this comment to the current moment in the track"
                    style="display:none;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1px solid var(--hair-strong);background:transparent;color:var(--text-3);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;">⏱ at 0:00</button>
                  <button class="btn btn-primary btn-sm" onclick="postComment()" style="margin-left:auto;">Post</button>
                </div>
              </div>
            ` : `<p style="font-size:14px;color:var(--text-2);">
              <a href="/login.html" style="color:var(--brand);font-weight:500;">Log in</a> to leave a comment.
            </p>`}
          </div>
          <div id="comments-list"><div class="loading"><div class="spinner"></div></div></div>
        </div>

        <div id="more-like-this" style="margin-top:48px;"></div>
      </div>`;

    // Wire IA CDN retry on cover images
    if (typeof wireIACoverRetry === 'function') {
      document.querySelectorAll('#track-container img').forEach(wireIACoverRetry);
    }
  }

  function renderTracklist() {
    var el = document.getElementById('track-tracklist');
    if (!el || !track) return;
    var cover = track.cover_url
      ? '<img src="' + escHtml(track.cover_url) + '" alt="">'
      : '🎵';
    var trackObjStr = JSON.stringify({
      id: track.id,
      title: track.title,
      cover_url: track.cover_url || '',
      ia_url: track.ia_url || '',
      artist_name: track.artists ? track.artists.display_name : '',
    }).replace(/"/g, '&quot;');
    el.innerHTML =
      '<div class="track-row playing" onclick="playTrack({...track, artist_name: track.artists && track.artists.display_name})">' +
        '<div class="track-row-num">1</div>' +
        '<div class="track-row-cover">' + cover + '</div>' +
        '<div class="track-row-info">' +
          '<div class="track-row-title">' + escHtml(track.title) + '</div>' +
          '<div class="track-row-artist">' + escHtml(track.artists ? track.artists.display_name : 'Unknown') + '</div>' +
        '</div>' +
        '<span class="track-row-plays">' + fmtNum(track.play_count) + ' plays</span>' +
        '<button onclick="event.stopPropagation();openAddToPlaylist(' + trackObjStr + ')" ' +
          'style="background:none;border:none;cursor:pointer;padding:4px 8px;font-size:16px;color:var(--text-2);flex-shrink:0;" title="Save to playlist">＋</button>' +
      '</div>';
  }

  async function toggleLike() {
    if (!isLoggedIn()) return navigate('/login.html');
    try {
      const res = await api(`/tracks/${trackId}/like`, { method: 'POST' });
      liked = res.liked;
      const count = liked ? track.like_count + 1 : track.like_count - 1;
      track.like_count = count;
      document.getElementById('like-btn').innerHTML = `${liked ? '♥' : '♡'} ${fmtNum(count)}`;
    } catch (_) {}
  }

  function _avatarGrad(name) {
    // simple deterministic gradient from coverGradient if available, else fallback
    return (typeof coverGradient === 'function') ? coverGradient(name) : 'linear-gradient(135deg,#6c47ff,var(--purple))';
  }

  async function loadComments() {
    try {
      const comments = await api(`/tracks/${trackId}/comments`);
      const el = document.getElementById('comments-list');
      if (!el) return;
      _tsComments = comments.filter(c => c.track_time != null);
      renderTsTimeline();
      if (!comments.length) {
        el.innerHTML = `<div class="empty-state" style="padding:24px 0;"><div class="empty-icon">💬</div><div class="empty-title" style="font-size:14px;">No comments yet. Be the first!</div></div>`;
        return;
      }
      el.innerHTML = '<div style="display:flex;flex-direction:column;gap:2px;">' +
        comments.map(c => {
          const upvotes = c.upvotes || 0;
          const downvotes = c.downvotes || 0;
          const myVote = myVotes[c.id] || 0;
          const username = c.users?.username || 'unknown';
          const initial = username[0].toUpperCase();
          const avatarBg = _avatarGrad(username);

          const upActive = myVote === 1;
          const downActive = myVote === -1;

          return `<div id="comment-${escHtml(c.id)}" style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;transition:background 0.12s;" onmouseenter="this.style.background='var(--hair)'" onmouseleave="this.style.background='transparent'">
            <div style="width:34px;height:34px;border-radius:50%;background:${avatarBg};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:rgba(255,255,255,0.9);">${escHtml(initial)}</div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
                <span style="font-size:13px;font-weight:600;color:var(--text);">${escHtml(username)}</span>
                <span style="font-size:11.5px;color:var(--text-3);">${timeAgo(c.created_at)}</span>
              </div>
              <div style="font-size:14px;color:var(--text);line-height:1.55;word-break:break-word;">${c.track_time != null ? `<button onclick="seekToComment(${Number(c.track_time)})" title="Jump to this moment" style="display:inline-flex;align-items:center;padding:1px 8px;margin-right:6px;border-radius:12px;border:1px solid var(--brand);background:var(--brand-bg);color:var(--brand);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;vertical-align:middle;">@ ${fmtT(c.track_time)}</button>` : ''}${escHtml(c.content)}</div>
              <div style="display:flex;align-items:center;gap:4px;margin-top:8px;">
                <button id="vote-up-btn-${escHtml(c.id)}" onclick="voteComment('${escHtml(c.id)}', 1)"
                  style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;border:1px solid ${upActive ? 'var(--brand)' : 'var(--hair-strong)'};background:${upActive ? 'var(--brand-bg)' : 'transparent'};color:${upActive ? 'var(--brand)' : 'var(--text-3)'};font-size:12px;font-weight:500;cursor:pointer;transition:all 0.12s;font-family:inherit;">
                  ▲ <span id="vote-up-${escHtml(c.id)}">${upvotes}</span>
                </button>
                <button id="vote-down-btn-${escHtml(c.id)}" onclick="voteComment('${escHtml(c.id)}', -1)"
                  style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;border:1px solid ${downActive ? 'var(--red)' : 'var(--hair-strong)'};background:${downActive ? 'rgba(248,113,113,0.12)' : 'transparent'};color:${downActive ? 'var(--red)' : 'var(--text-3)'};font-size:12px;font-weight:500;cursor:pointer;transition:all 0.12s;font-family:inherit;">
                  ▼ <span id="vote-down-${escHtml(c.id)}">${downvotes}</span>
                </button>
              </div>
            </div>
          </div>`;
        }).join('') +
      '</div>';
    } catch (_) {}
  }

  function _applyVoteStyle(btn, active, isUp) {
    if (!btn) return;
    if (active && isUp) {
      btn.style.border = '1px solid var(--brand)';
      btn.style.background = 'var(--brand-bg)';
      btn.style.color = 'var(--brand)';
    } else if (active && !isUp) {
      btn.style.border = '1px solid var(--red)';
      btn.style.background = 'rgba(248,113,113,0.12)';
      btn.style.color = 'var(--red)';
    } else {
      btn.style.border = '1px solid var(--hair-strong)';
      btn.style.background = 'transparent';
      btn.style.color = 'var(--text-3)';
    }
  }

  async function voteComment(commentId, vote) {
    if (!isLoggedIn()) return navigate('/login.html');
    try {
      const res = await api(`/tracks/${trackId}/comments/${commentId}/vote`, {
        method: 'POST',
        body: JSON.stringify({ vote }),
      });
      // Toggle: if same vote, remove it
      myVotes[commentId] = myVotes[commentId] === vote ? 0 : vote;

      // Update displayed counts
      if (res.upvotes !== undefined) {
        const upEl = document.getElementById(`vote-up-${commentId}`);
        const downEl = document.getElementById(`vote-down-${commentId}`);
        if (upEl) upEl.textContent = res.upvotes || 0;
        if (downEl) downEl.textContent = res.downvotes || 0;
      }
      // Update button visual state
      const upBtn = document.getElementById(`vote-up-btn-${commentId}`);
      const downBtn = document.getElementById(`vote-down-btn-${commentId}`);
      _applyVoteStyle(upBtn, myVotes[commentId] === 1, true);
      _applyVoteStyle(downBtn, myVotes[commentId] === -1, false);
    } catch (_) {}
  }

  async function postComment() {
    const input = document.getElementById('comment-input');
    const content = input?.value.trim();
    if (!content) return;
    try {
      const body = { content };
      if (tsEnabled && tsCapturedTime != null) body.track_time = tsCapturedTime;
      await api(`/tracks/${trackId}/comments`, {
        method: 'POST',
        body: JSON.stringify(body),
      });
      input.value = '';
      tsEnabled = false;
      tsCapturedTime = null;
      loadComments();
    } catch (err) {
      alert(err.message);
    }
  }

  // ── Timestamped comments ──────────────────────────────────────────────────
  var _tsComments = [];
  var tsEnabled = false;
  var tsCapturedTime = null;

  function fmtT(s) {
    s = Math.max(0, Math.floor(Number(s) || 0));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // Is THIS track the one loaded in the global player?
  function _isThisTrackLoaded() {
    return typeof currentTrack !== 'undefined' && currentTrack && currentTrack.id === trackId &&
      typeof audio !== 'undefined' && audio && audio.src;
  }

  function toggleTsComment() {
    var chip = document.getElementById('ts-toggle');
    if (!chip) return;
    tsEnabled = !tsEnabled;
    if (tsEnabled && _isThisTrackLoaded()) {
      tsCapturedTime = Math.round(audio.currentTime * 10) / 10;
    } else {
      tsEnabled = false;
      tsCapturedTime = null;
    }
    _updateTsChip();
  }

  function _updateTsChip() {
    var chip = document.getElementById('ts-toggle');
    if (!chip) return;
    if (!_isThisTrackLoaded()) {
      chip.style.display = 'none';
      tsEnabled = false;
      tsCapturedTime = null;
      return;
    }
    chip.style.display = 'inline-flex';
    if (tsEnabled && tsCapturedTime != null) {
      chip.textContent = '⏱ at ' + fmtT(tsCapturedTime) + ' ✓';
      chip.style.borderColor = 'var(--brand)';
      chip.style.background = 'var(--brand-bg)';
      chip.style.color = 'var(--brand)';
    } else {
      chip.textContent = '⏱ at ' + fmtT(audio.currentTime);
      chip.style.borderColor = 'var(--hair-strong)';
      chip.style.background = 'transparent';
      chip.style.color = 'var(--text-3)';
    }
  }

  function seekToComment(t) {
    if (_isThisTrackLoaded()) {
      audio.currentTime = t;
      audio.play().catch(function(){});
    } else {
      playThisTrack();
      var onCan = function() {
        audio.removeEventListener('canplay', onCan);
        audio.currentTime = t;
      };
      audio.addEventListener('canplay', onCan);
    }
  }

  function renderTsTimeline() {
    var wrap = document.getElementById('ts-timeline-wrap');
    var bar = document.getElementById('ts-timeline');
    if (!wrap || !bar) return;
    // Need the track loaded so we know the duration to position markers.
    var dur = _isThisTrackLoaded() && audio.duration && isFinite(audio.duration) ? audio.duration : 0;
    if (!_tsComments.length || !dur) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    bar.innerHTML = _tsComments.map(function(c) {
      var pct = Math.min(98, Math.max(1, (c.track_time / dur) * 100));
      var who = (c.users && c.users.username) || 'unknown';
      var snippet = String(c.content || '').slice(0, 60);
      return '<button onclick="seekToComment(' + Number(c.track_time) + ')" ' +
        'title="' + escHtml(who + ' @ ' + fmtT(c.track_time) + ': ' + snippet) + '" ' +
        'style="position:absolute;left:' + pct + '%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--page-bg-base,#000);cursor:pointer;padding:0;"></button>';
    }).join('');
  }

  // ── Live surfacing: pop a comment up when playback reaches its moment ──────
  var _tsLastTime = 0;
  var _tsBubbleUntil = 0;

  function _tsShowBubble(c) {
    var bub = document.getElementById('ts-bubble');
    if (!bub) return;
    var dur = (_isThisTrackLoaded() && audio.duration && isFinite(audio.duration)) ? audio.duration : 0;
    if (!dur) return;
    var pct = Math.min(96, Math.max(2, (c.track_time / dur) * 100));
    document.getElementById('ts-bubble-user').textContent = (c.users && c.users.username) || 'unknown';
    document.getElementById('ts-bubble-time').textContent = '@ ' + fmtT(c.track_time);
    document.getElementById('ts-bubble-text').textContent = c.content || '';
    bub.style.left = pct + '%';
    bub.style.display = 'block';
    _tsBubbleUntil = Date.now() + 4500;
  }

  function _tsCheckCrossing() {
    if (!_isThisTrackLoaded() || audio.paused) { _tsLastTime = _isThisTrackLoaded() ? audio.currentTime : _tsLastTime; return; }
    var now = audio.currentTime;
    // Comments whose moment we just passed (forward) since the last check.
    // If several were crossed at once (e.g. a seek), surface the latest.
    var crossed = null;
    for (var i = 0; i < _tsComments.length; i++) {
      var t = Number(_tsComments[i].track_time);
      if (t > _tsLastTime && t <= now) {
        if (!crossed || t > Number(crossed.track_time)) crossed = _tsComments[i];
      }
    }
    if (crossed) _tsShowBubble(crossed);
    _tsLastTime = now;
  }

  // Keep the chip label and timeline fresh while this page is open. The
  // interval kills itself once the SPA swaps the page (elements disappear).
  var _tsTimer = setInterval(function() {
    var chip = document.getElementById('ts-toggle');
    var wrap = document.getElementById('ts-timeline-wrap');
    if (!chip && !wrap) { clearInterval(_tsTimer); return; }
    _updateTsChip();
    // Re-render markers when duration becomes known (first play)
    if (wrap && wrap.style.display === 'none' && _tsComments.length) renderTsTimeline();
    _tsCheckCrossing();
    // Auto-hide the bubble after its window elapses.
    var bub = document.getElementById('ts-bubble');
    if (bub && bub.style.display !== 'none' && Date.now() > _tsBubbleUntil) bub.style.display = 'none';
  }, 300);

  async function loadMoreLikeThis() {
    if (!track) return;
    var el = document.getElementById('more-like-this');
    if (!el) return;
    try {
      var artist = track.artists || {};
      var artistId = artist.id;
      var eraTagId = track.era_tag ? track.era_tag.id : track.era_tag_id;

      // Fetch more by same artist + same era tag in parallel
      var results = await Promise.all([
        artistId ? api('/artists/' + artistId + '/tracks').catch(function() { return []; }) : Promise.resolve([]),
        artistId ? api('/albums/by-artist/' + artistId).catch(function() { return []; }) : Promise.resolve([]),
        eraTagId ? api('/discover/era/' + eraTagId).catch(function() { return []; }) : Promise.resolve([]),
      ]);
      var artistTracks = results[0];
      var artistAlbums = results[1];
      var eraTracks = results[2];

      // Filter out current track, limit to 4 each
      var byArtist = [].concat(
        artistTracks.filter(function(t) { return t.id !== track.id; }).slice(0, 2).map(function(t) { return Object.assign({}, t, {_type:'track'}); }),
        artistAlbums.slice(0, 2).map(function(a) { return Object.assign({}, a, {_type:'album'}); })
      ).slice(0, 4);

      var byEra = eraTagId
        ? eraTracks.filter(function(t) { return t.id !== track.id && !byArtist.find(function(x) { return x.id === t.id; }); })
            .slice(0, 4)
            .map(function(t) { return Object.assign({}, t, {_type: t.album_tracks ? 'album' : 'track'}); })
        : [];

      var html = '';

      if (byArtist.length) {
        html += '<h2 class="section-title" style="margin-top:0;">More by ' + escHtml(artist.display_name || 'this artist') + '</h2>';
        html += '<div class="wv-comp-grid wv-comp-grid-4">' + byArtist.map(function(item) { return renderMoreCard(item); }).join('') + '</div>';
      }

      if (byEra.length) {
        var eraName = track.era_tag ? track.era_tag.name : '';
        html += '<h2 class="section-title" style="margin-top:32px;">More' + (eraName ? ' from ' + escHtml(eraName) : ' like this') + '</h2>';
        html += '<div class="wv-comp-grid wv-comp-grid-4">' + byEra.map(function(item) { return renderMoreCard(item); }).join('') + '</div>';
      }

      el.innerHTML = html;
    } catch (_) {}
  }

  function renderMoreCard(item) {
    var isAlbum = item._type === 'album';
    var bg = (typeof coverGradient === 'function') ? coverGradient(item.title || '') : '#333';
    var coverImg = item.cover_url
      ? '<img src="' + escHtml(item.cover_url) + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">'
      : '';
    var clickAction = isAlbum
      ? "navigate('/album.html?id=" + item.id + "')"
      : "navigate('/track.html?id=" + item.id + "')";
    var artistName = item.artists ? (item.artists.display_name || '') : '';

    return '<div class="wv-comp-card" onclick="' + clickAction + '">' +
      '<div class="wv-comp-card-cover">' +
        '<div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
          '' +
          (isAlbum ? '' : '') +
          coverImg +
          (!isAlbum ? '<button class="wv-cover-play-btn" onclick="event.stopPropagation();navigate(\'/track.html?id=' + item.id + '\')">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
          '</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="wv-comp-card-title">' + escHtml(item.title || 'Untitled') + '</div>' +
      '<div class="wv-comp-card-artist">' + escHtml(artistName) + '</div>' +
    '</div>';
  }

  loadTrack();
</script>
</body>
</html>
