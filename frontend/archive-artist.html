<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — archive artist</title>
  <link rel="stylesheet" href="/css/style.css?v=a69fc684857b">
  <script src="/js/status-card.js?v=a69fc684857b"></script>
  <script src="/js/down.js?v=a69fc684857b"></script>
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>
<script src="/js/api.js?v=a69fc684857b"></script>
<script src="/js/layout.js?v=a69fc684857b"></script>
<script src="/js/player.js?v=a69fc684857b"></script>
<script src="/js/router.js?v=a69fc684857b"></script>
<script>
initPlayer();

var _aaComps = [];
var _aaSort = 'newest';

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function initArchiveArtist() {
  var view = document.getElementById('view');
  var slug = new URLSearchParams(location.search).get('a');
  if (!slug) {
    view.innerHTML = '<div class="wv-empty">No artist specified.</div>';
    return;
  }

  var data;
  try {
    data = await api('/archive/artists/' + encodeURIComponent(slug));
  } catch (err) {
    view.innerHTML = '<div style="padding:48px 0;text-align:center;">' +
      '<div style="font-size:17px;font-weight:700;margin-bottom:6px;">Artist not found</div>' +
      '<div style="font-size:13.5px;color:var(--text-3);margin-bottom:16px;">' + escHtml(err.message || '') + '</div>' +
      '<a href="/archive" class="btn btn-secondary" onclick="navigate(\'/archive\');return false;">Back to Archive</a></div>';
    return;
  }

  _aaComps = data.comps || [];
  document.title = data.name + ' — wavernrs archive';

  if (typeof window.setPageBgImage === 'function') {
    var withCover = _aaComps.filter(function(c) { return c.cover_url; });
    window.setPageBgImage(withCover.length ? withCover[0].cover_url : '');
  }

  var totalPlays = data.play_count || 0;
  // Alternate spellings folded into this artist — shown so it's obvious why
  // comps typed slightly differently all landed on one page.
  var aliasNote = (data.aliases && data.aliases.length)
    ? '<div class="wv-hero-meta">Also credited as ' + data.aliases.slice(0, 6).map(escHtml).join(' · ') + '</div>'
    : '';

  view.innerHTML =
    '<div style="padding:8px 0 4px;">' +
      '<a href="/archive" onclick="navigate(\'/archive\');return false;" ' +
        'style="font-size:13px;color:var(--text-3);text-decoration:none;">← Archive</a>' +
    '</div>' +
    '<div class="wv-hero">' +
      '<div class="wv-hero-art round" style="background:' + coverGradient(data.name || '') + ';">' +
        (_aaComps.length && _aaComps[0].cover_url
          ? '<img src="' + escHtml(_aaComps[0].cover_url) + '" onerror="this.style.opacity=0">' : '') +
      '</div>' +
      '<div class="wv-hero-body">' +
        '<div class="wv-kind">Archived artist</div>' +
        '<h1 class="wv-hero-title">' + escHtml(data.name) + '</h1>' +
        '<div class="wv-hero-sub">' + data.comp_count + ' release' + (data.comp_count !== 1 ? 's' : '') +
          (data.edit_count ? ' · ' + data.edit_count.toLocaleString() + ' single edit' + (data.edit_count !== 1 ? 's' : '') : '') +
          (totalPlays ? ' · ' + totalPlays.toLocaleString() + ' plays' : '') +
          (data.external_likes ? ' · ♥ ' + Number(data.external_likes).toLocaleString() : '') + '</div>' +
        ((data.top_eras && data.top_eras.length)
          ? '<div class="wv-hero-meta">Mostly ' + data.top_eras.slice(0, 3).map(function (e) { return escHtml(e.name) + ' (' + e.comps + ')'; }).join(' · ') + '</div>'
          : '') +
        aliasNote +
        '<div class="wv-hero-actions" style="margin-top:12px;">' +
          '<button class="wv-btn-play" onclick="aaPlay(false)">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9 19 12 7.5 19.1Z"/></svg>Play newest' +
          '</button>' +
          '<button class="wv-btn-ghost" onclick="aaPlay(true)">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px;"><path d="M17.2 4.4 21 8.2l-3.8 3.8V9.4h-2.1c-1 0-1.6.4-2.3 1.4l-.9 1.3-1.5-2.1.7-1c1.1-1.6 2.4-2.4 4-2.4h2.1Zm0 8.1 3.8 3.8-3.8 3.8v-2.6h-2.1c-1.6 0-2.9-.8-4-2.4l-3-4.3c-.7-1-1.3-1.4-2.3-1.4H3.2V9.4h2.6c1.6 0 2.9.8 4 2.4l3 4.3c.7 1 1.3 1.4 2.3 1.4h2.1Zm-11.4 2.1c.6 0 1.1-.15 1.55-.5l1.45 2.05c-.85.6-1.85.9-3 .9H3.2v-2.45Z"/></svg>Shuffle a comp' +
          '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;">' +
      '<select id="aa-sort" class="wv-input" style="padding:9px 12px;font-size:13px;width:auto;" onchange="aaSort(this.value)">' +
        '<option value="newest">Newest first</option>' +
        '<option value="oldest">Oldest first</option>' +
        '<option value="title">Title A–Z</option>' +
        '<option value="plays">Most played</option>' +
      '</select>' +
    '</div>' +
    '<div id="aa-comps" style="display:none;"><h2 class="wv-sec-title" style="margin:4px 0 12px;">Comps</h2><div class="wv-tile-grid" id="aa-grid"></div></div>' +
    '<div id="aa-edits" style="display:none;margin-top:8px;"><h2 class="wv-sec-title" style="margin:4px 0 12px;">Edits</h2><div class="wv-tile-grid" id="aa-grid-edits"></div></div>' +
    '<div id="aa-empty"></div>';

  renderComps();
}

function aaSort(v) { _aaSort = v; renderComps(); }

function renderComps() {
  var isEdit = function(c) { return Number(c.track_count) === 1; };
  var comps = _aaComps.filter(function(c) { return !isEdit(c); }), edits = _aaComps.filter(isEdit);
  var cs = document.getElementById('aa-comps'), es = document.getElementById('aa-edits'), em = document.getElementById('aa-empty');
  if (cs) cs.style.display = comps.length ? '' : 'none';
  if (es) es.style.display = edits.length ? '' : 'none';
  if (em) em.innerHTML = _aaComps.length ? '' : '<div class="wv-empty">No comps.</div>';
  renderGrid('aa-grid', comps);
  renderGrid('aa-grid-edits', edits);
}

// Play this creator's newest comp, or a random one of theirs.
function aaPlay(random) {
  var comps = _aaComps.filter(function (c) { return (c.track_count || 0) > 1; });
  var pool = comps.length ? comps : _aaComps;
  if (!pool.length) { if (typeof wvToast === 'function') wvToast('Nothing to play here yet'); return; }
  var pick;
  if (random) pick = pool[Math.floor(Math.random() * pool.length)];
  else pick = pool.slice().sort(function (a, b) {
    return new Date(b.original_date || b.created_at) - new Date(a.original_date || a.created_at);
  })[0];
  if (typeof wvToast === 'function') wvToast('Playing ' + pick.title);
  playCompById(pick.id, { album: pick, quiet: true, shuffle: !!random });
}

function renderGrid(gridId, items) {
  var grid = document.getElementById(gridId);
  if (!grid) return;
  var list = items.slice();
  var _d = function(x) { return x.original_date ? new Date(x.original_date).getTime() : 0; };
  if (_aaSort === 'newest')      list.sort(function(a, b) { return _d(b) - _d(a) || new Date(b.created_at) - new Date(a.created_at); });
  else if (_aaSort === 'oldest') list.sort(function(a, b) { return (_d(a) || 9e15) - (_d(b) || 9e15) || new Date(a.created_at) - new Date(b.created_at); });
  else if (_aaSort === 'title')  list.sort(function(a, b) { return (a.title || '').localeCompare(b.title || ''); });
  else if (_aaSort === 'plays')  list.sort(function(a, b) { return (b.play_count || 0) - (a.play_count || 0); });

  grid.innerHTML = list.map(function(item) {
    var bg = coverGradient(item.title || '');
    var eraName = item.era_tags ? item.era_tags.name : null;
    return '<div class="wv-comp-card" onclick="navigate(\'/album?id=' + escHtml(item.id) + '\')">' +
      '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18);">' +
      '' +
      '<div style="position:absolute;top:8px;left:8px;padding:2px 8px;background:rgba(255,255,255,0.2);color:rgba(255,255,255,0.96);font-size:9px;font-weight:700;letter-spacing:0.06em;border-radius:4px;text-transform:uppercase;">archived</div>' +
      (item.cover_url ? '<img src="' + escHtml(item.cover_url) + '" loading="lazy" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">' : '') +
      '<button class="wv-cover-play-btn" title="Play" aria-label="Play ' + escHtml(item.title || '') + '" onclick="event.stopPropagation();playCompById(\'' + escHtml(item.id) + '\')">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
      '</button>' +
      '</div></div>' +
      '<div class="wv-comp-card-title">' + escHtml(item.title) + '</div>' +
      '<div class="wv-comp-card-artist">' + (eraName ? escHtml(eraName) : '') + '</div></div>';
  }).join('');
}

initArchiveArtist();
</script>
</body>
</html>
