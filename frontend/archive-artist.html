function aaReadUrl() {
  var p = new URLSearchParams(location.search);
  AA.slug = p.get('a') || '';
  var s = p.get('sort');
  AA.sort = AA_SORTS.indexOf(s) >= 0 ? s : 'newest';
  var k = p.get('kind');
  AA.kind = (k === 'comps' || k === 'edits') ? k : 'all';
  AA.era = (p.get('era') || '').slice(0, 80);
  AA.q = (p.get('q') || '').trim().slice(0, 80);
}
function aaWriteUrl() {
  try {
    var u = new URL(location.href);
    var set = function (k, v) { if (v) u.searchParams.set(k, v); else u.searchParams.delete(k); };
    set('sort', AA.sort !== 'newest' ? AA.sort : '');
    set('kind', AA.kind !== 'all' ? AA.kind : '');
    set('era', AA.era);
    set('q', AA.q);
    history.replaceState(history.state, '', u.pathname + u.search);
  } catch (_) {}
}

function aaQueryString(offset, limit) {
  return '?limit=' + limit + '&offset=' + offset + '&sort=' + encodeURIComponent(AA.sort) +
    (AA.kind !== 'all' ? '&kind=' + AA.kind : '') +
    (AA.era ? '&era=' + encodeURIComponent(AA.era) : '') +
    (AA.q ? '&q=' + encodeURIComponent(AA.q) : '');
}

function aaSkeleton() {
  var view = document.getElementById('view');
  if (!view) return;
  var cards = '';
  for (var i = 0; i < 10; i++) cards += '<div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>';
  view.innerHTML =
    '<div class="aa-skel-hero"><div class="wv-skel av"></div><div class="aa-skel-lines">' +
      '<div class="wv-skel" style="height:12px;width:120px;"></div><div class="wv-skel" style="height:54px;width:min(420px,80%);"></div><div class="wv-skel" style="height:14px;width:min(300px,70%);"></div>' +
    '</div></div>' +
    '<div class="aa-stats">' + '<div class="aa-stat"><div class="wv-skel" style="height:10px;width:60%;"></div><div class="wv-skel" style="height:28px;width:70%;margin-top:12px;"></div></div>'.repeat(5) + '</div>' +
    '<div class="wv-tile-grid">' + cards + '</div>';
}

async function initArchiveArtist() {
  var view = document.getElementById('view');
  aaReadUrl();
  if (!AA.slug) {
    view.innerHTML = '<div class="aa-empty"><b>no artist picked</b>go back to the archive and choose one<br><button class="wv-pill" onclick="navigate(\'/archive?view=artists\')">Browse creators</button></div>';
    return;
  }
  aaSkeleton();
  var navGen = window._wvNavGen;
  var data;
  try {
    data = await api('/archive/artists/' + encodeURIComponent(AA.slug) + aaQueryString(0, AA_PAGE));
  } catch (err) {
    if (err && err.navAborted) return;
    if (window._wvNavGen !== navGen) return;
    var v = document.getElementById('view');
    if (!v) return;
    var notFound = err && err.status === 404;
    v.innerHTML = '<div class="aa-empty" style="padding:70px 16px;"><b>' + (notFound ? 'couldnt find that creator' : 'couldnt load this creator') + '</b>' +
      escHtml(notFound ? 'they may have been merged or renamed' : (err && err.message) || '') + '<br>' +
      (notFound ? '' : '<button class="wv-pill" onclick="initArchiveArtist()">Try again</button> ') +
      '<button class="wv-pill" onclick="navigate(\'/archive?view=artists\')">Back to the archive</button></div>';
    return;
  }
  if (window._wvNavGen !== navGen || !document.getElementById('view')) return;
  AA.data = data;
  AA.mode = Array.isArray(data.timeline) ? 'server' : 'client';
  document.title = (data.name || 'creator') + ' — wavernrs archive';

  if (AA.mode === 'server') {
    AA.items = data.comps || [];
    AA.total = typeof data.total === 'number' ? data.total : data.comp_count;
    AA.hasMore = !!data.has_more;
    AA.stats = {
      counts: data.counts || { all: data.comp_count, comps: data.comp_count - (data.edit_count || 0), edits: data.edit_count || 0 },
      timeline: data.timeline, first: data.first, newest: data.newest,
      eras: data.eras || data.top_eras || [], untagged: data.untagged || 0,
      favorites: data.fan_favorites || [], similar: data.similar || [],
    };
  } else {
    AA.all = (data.comps || []).slice();
    AA.allDone = !data.has_more;
    AA.stats = aaDerive(AA.all, data);
  }
  aaRender();
  if (AA.mode === 'client') {
    aaApplyClientView(true);
    if (!AA.allDone) aaLoadAllClient(navGen);
  } else {
    aaRenderGrid(true);
  }
}

function aaDerive(list, data) {
  var months = {}, eras = {}, comps = 0, edits = 0, first = null, untagged = 0;
  list.forEach(function (c) {
    if (aaIsEdit(c)) edits++; else comps++;
    var d = aaDateOf(c);
    if (d) {
      var m = String(d).slice(0, 7);
      if (/^\d{4}-\d{2}$/.test(m)) months[m] = (months[m] || 0) + 1;
      if (!first || new Date(d) < new Date(first)) first = d;
    }
    var e = c.era_tags && c.era_tags.name;
    if (e) eras[e] = (eras[e] || 0) + 1; else untagged++;
  });
  var complete = AA.allDone;
  var favs = list.filter(function (c) { return (Number(c.external_likes) || 0) > 0; })
    .sort(function (a, b) { return (b.external_likes || 0) - (a.external_likes || 0) || (b.play_count || 0) - (a.play_count || 0); }).slice(0, 6);
  return {
    counts: complete ? { all: list.length, comps: comps, edits: edits }
      : { all: data.comp_count, comps: Math.max(0, data.comp_count - (data.edit_count || 0)), edits: data.edit_count || 0 },
    timeline: complete ? Object.keys(months).sort().map(function (m) { return { m: m, n: months[m] }; }) : null,
    first: complete ? first : null,
    newest: data.newest,
    eras: complete ? Object.keys(eras).map(function (n) { return { name: n, comps: eras[n] }; }).sort(function (a, b) { return b.comps - a.comps; }) : (data.top_eras || []),
    untagged: complete ? untagged : 0,
    favorites: complete ? favs : [],
    similar: [],
  };
}

async function aaLoadAllClient(navGen) {
  var gen = AA.gen;
  var slug = AA.slug;
  try {
    while (AA.all.length < AA_CLIENT_CAP) {
      var d = await api('/archive/artists/' + encodeURIComponent(slug) + '?limit=1000&offset=' + AA.all.length);
      if (window._wvNavGen !== navGen || AA.slug !== slug) return;
      var got = (d && d.comps) || [];
      AA.all = AA.all.concat(got);
      if (!d.has_more || !got.length) break;
    }
  } catch (e) {
    if (e && e.navAborted) return;
  }
  if (window._wvNavGen !== navGen || !document.getElementById('aa-grid')) return;
  AA.allDone = true;
  AA.stats = aaDerive(AA.all, AA.data);
  aaRenderInsights();
  aaRenderToolbar();
  var plain = AA.sort === 'newest' && AA.kind === 'all' && !AA.era && !AA.q;
  aaApplyClientView(!plain || gen !== AA.gen);
}

  var tiles = [

    { k: 'Edits', icon: AA_ICON.wave, v: counts.edits, d: 'single-track releases' },

    { k: 'Active since', icon: AA_ICON.cal, text: first ? aaShortDate(first) : (AA.mode === 'client' && !AA.allDone ? '…' : '—'), d: first ? aaSpan(first) + ' of releases' : (AA.mode === 'client' && !AA.allDone ? 'counting...' : '') },
  ];

  }).join('');

      '<div class="aa-row">' + sim.map(aaSimHTML).join('') + '</div></section>';

}

function aaCountUp(root) {
  var els = root.querySelectorAll('[data-count]');
  var reduce = aaReduced();
  els.forEach(function (el) {
    var to = Number(el.getAttribute('data-count')) || 0;
    el.removeAttribute('data-count');
    if (reduce || to < 10) { el.textContent = aaNum(to); return; }
    var t0 = null, dur = 900 + Math.min(600, Math.log10(to) * 120);
    function step(ts) {
      if (!el.isConnected) return;
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - p, 4);
      el.textContent = aaNum(Math.round(to * e));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function aaHeatmapHTML() {
  var s = AA.stats;
  var tl = s.timeline;
  var head = '<div class="aa-card"><div class="aa-card-h"><h2>Activity</h2></div>';
  if (!tl) {
    return head + '<div class="aa-card-sub">counting every release...</div><div class="wv-skel" style="height:120px;border-radius:8px;"></div></div>';
  }
  if (!tl.length) return head + '<div class="aa-card-sub">no dated releases yet</div></div>';
  var byM = {}, max = 0, total = 0, peak = tl[0];
  tl.forEach(function (x) { byM[x.m] = x.n; total += x.n; if (x.n > max) max = x.n; if (x.n > peak.n) peak = x; });
  var y0 = +tl[0].m.slice(0, 4), y1 = +tl[tl.length - 1].m.slice(0, 4);
  var now = new Date();
  var nowM = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  var years = [];
  for (var y = y1; y >= y0 && years.length < 12; y--) years.push(y);
  var monthNames = [];
  for (var mi = 0; mi < 12; mi++) monthNames.push(new Date(Date.UTC(2020, mi, 15)).toLocaleDateString(undefined, { month: 'narrow', timeZone: 'UTC' }));
  var lg = Math.log(1 + max);
  var level = function (n) { return n ? Math.max(1, Math.min(4, Math.ceil(4 * Math.log(1 + n) / lg))) : 0; };
  var cellH = Math.round(Math.max(20, Math.min(34, 150 / years.length)));
  var grid = '<div class="aa-heat" role="grid" aria-label="Releases per month" style="--aa-cell-h:' + cellH + 'px"><span></span>' +
    monthNames.map(function (n) { return '<span class="mo" aria-hidden="true">' + escHtml(n) + '</span>'; }).join('') + '<span class="mo" style="text-align:right" aria-hidden="true">year</span>';
  years.forEach(function (yy) {
    var yTotal = 0;
    grid += '<span class="yr">' + yy + '</span>';
    for (var m = 1; m <= 12; m++) {
      var key = yy + '-' + String(m).padStart(2, '0');
      var n = byM[key] || 0;
      yTotal += n;
      var future = key > nowM;
      var label = aaMonthLabel(key, true) + ': ' + (n ? aaNum(n) + ' release' + (n === 1 ? '' : 's') : 'nothing');
      grid += future ? '<span class="aa-cell out" aria-hidden="true"></span>'
        : '<span class="aa-cell l' + level(n) + '" tabindex="' + (n ? '0' : '-1') + '" role="gridcell" data-n="' + n + '" data-m="' + key + '" aria-label="' + escHtml(label) + '"></span>';
    }
    grid += '<span class="tot">' + (yTotal ? aaNum(yTotal) : '–') + '</span>';
  });
  grid += '</div>';
  var active = tl.length;
  var legend = '<span class="aa-legend" aria-hidden="true">less <i class="aa-cell"></i><i class="aa-cell l1"></i><i class="aa-cell l2"></i><i class="aa-cell l3"></i><i class="aa-cell l4"></i> more</span>';
  var older = (y1 - y0 + 1) > years.length ? '<span>showing the last ' + years.length + ' years</span>' : '<span>' + (y0 === y1 ? y0 : y0 + '–' + y1) + '</span>';
  return head +
    '<div class="aa-card-sub"><b>' + aaNum(total) + '</b> release' + (total === 1 ? '' : 's') + ' across <b>' + active + '</b> active month' + (active === 1 ? '' : 's') +
      ' · busiest was <b>' + escHtml(aaMonthLabel(peak.m, true)) + '</b> with ' + aaNum(peak.n) + '</div>' +
    grid + '<div class="aa-heat-foot">' + older + legend + '</div></div>';
}

function aaBindHeat() {
  var heat = document.querySelector('.aa-heat');
  var tip = document.getElementById('aa-tip');
  if (!heat || !tip) return;
  var show = function (cell) {
    if (!cell || !cell.hasAttribute('data-n')) { tip.classList.remove('on'); return; }
    var n = +cell.getAttribute('data-n');
    tip.innerHTML = escHtml(n ? aaNum(n) + ' release' + (n === 1 ? '' : 's') : 'no releases') + ' <span>' + escHtml(aaMonthLabel(cell.getAttribute('data-m'), true)) + '</span>';
    var r = cell.getBoundingClientRect();
    tip.classList.add('on');
    var tw = tip.offsetWidth;
    var left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width / 2 - tw / 2));
    tip.style.left = left + 'px';
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
  };
  heat.addEventListener('mouseover', function (e) { show(e.target.closest('.aa-cell')); });
  heat.addEventListener('mouseleave', function () { tip.classList.remove('on'); });
  heat.addEventListener('focusin', function (e) { show(e.target.closest('.aa-cell')); });
  heat.addEventListener('focusout', function () { tip.classList.remove('on'); });
}

function aaErasHTML() {
  var s = AA.stats;
  var eras = (s.eras || []).slice(0, 6);
  var head = '<div class="aa-card"><div class="aa-card-h"><h2>Eras</h2></div>';
  if (!eras.length) return head + '<div class="aa-card-sub">none of these releases are tagged with an era yet</div></div>';
  var tagged = (s.eras || []).reduce(function (n, e) { return n + e.comps; }, 0);
  var max = eras[0].comps || 1;
  return head + '<div class="aa-card-sub"><b>' + aaNum(tagged) + '</b> tagged release' + (tagged === 1 ? '' : 's') + ' · tap one to filter</div>' +
    '<div class="aa-eras">' + eras.map(function (e) {
      var pct = Math.max(4, Math.round(e.comps / max * 100));
      return '<button class="aa-era-row' + (AA.era === e.name ? ' on' : '') + '" data-act="era" data-era="' + escHtml(e.name) + '" aria-pressed="' + (AA.era === e.name) + '">' +
        '<span class="n">' + escHtml(e.name) + '</span><span class="c">' + aaNum(e.comps) + '</span>' +
        '<span class="bar"><span style="width:' + pct + '%"></span></span></button>';
    }).join('') + '</div></div>';
}

function aaSimHTML(a) {
  var sub = a.shared && a.shared.length ? a.shared.join(', ') : aaNum(a.comp_count) + ' release' + (a.comp_count === 1 ? '' : 's');
  return '<a class="aa-sim" href="/archive-artist?a=' + encodeURIComponent(a.slug) + '">' +
    '<div class="aa-sim-av" style="background:' + coverGradient(a.name || '') + ';">' +
      (a.cover_url ? '<img src="' + escHtml(aaImg(a.cover_url, 240)) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
    '</div>' +
    '<div class="aa-sim-n">' + escHtml(a.name) + '</div>' +
    '<div class="aa-sim-s" title="' + escHtml(sub) + '">' + escHtml(sub) + '</div></a>';
}

function aaRenderToolbar() {
  var bar = document.getElementById('aa-bar');
  if (!bar) return;
  var s = AA.stats, c = s.counts || {};
  var focused = document.activeElement && document.activeElement.id === 'aa-q';
  var kinds = [['all', 'All', c.all], ['comps', 'Comps', c.comps], ['edits', 'Edits', c.edits]];
  var sortLabels = { newest: 'Newest first', oldest: 'Oldest first', likes: 'Most liked', plays: 'Most played', title: 'Title A–Z' };
  var eras = (s.eras || []).slice(0, 12);
  if (AA.era && AA.era !== '__none' && !eras.some(function (e) { return e.name === AA.era; })) eras = [{ name: AA.era, comps: null }].concat(eras);
  var chips = '';
  if (eras.length) {
    chips = '<div class="aa-chips" role="group" aria-label="Filter by era">' +
      '<button class="aa-chip' + (!AA.era ? ' on' : '') + '" data-act="era" data-era="">All eras</button>' +
      eras.map(function (e) {
        return '<button class="aa-chip' + (AA.era === e.name ? ' on' : '') + '" data-act="era" data-era="' + escHtml(e.name) + '">' + escHtml(e.name) + (e.comps != null ? '<span class="ct">' + aaNum(e.comps) + '</span>' : '') + '</button>';
      }).join('') +
      (s.untagged > 0 ? '<button class="aa-chip' + (AA.era === '__none' ? ' on' : '') + '" data-act="era" data-era="__none">No era<span class="ct">' + aaNum(s.untagged) + '</span></button>' : '') +
      '</div>';
  }
  bar.innerHTML =
    '<div class="aa-bar-top">' +
      '<div class="aa-seg" role="group" aria-label="Release type">' + kinds.map(function (k) {
        return '<button class="' + (AA.kind === k[0] ? 'on' : '') + '" data-act="kind" data-kind="' + k[0] + '" aria-pressed="' + (AA.kind === k[0]) + '"' + (k[2] === 0 && AA.kind !== k[0] ? ' disabled style="opacity:.45;cursor:default"' : '') + '>' + k[1] + (k[2] != null ? '<span class="ct">' + aaNum(k[2]) + '</span>' : '') + '</button>';
      }).join('') + '</div>' +
      '<label class="aa-search' + (AA.q ? ' has' : '') + '" id="aa-search-wrap">' + AA_ICON.search +
        '<input type="search" id="aa-q" class="wv-input" placeholder="search their releases" autocomplete="off" aria-label="Search this creator\'s releases" value="' + escHtml(AA.q) + '">' +
        '<button type="button" class="x" data-act="clearq" aria-label="Clear search">' + AA_ICON.x + '</button></label>' +
      '<select id="aa-sort" class="wv-input aa-sort" aria-label="Sort releases">' + AA_SORTS.map(function (k) {
        return '<option value="' + k + '"' + (AA.sort === k ? ' selected' : '') + '>' + sortLabels[k] + '</option>';
      }).join('') + '</select>' +
      '<span class="aa-count" id="aa-count" aria-live="polite"></span>' +
    '</div>' + chips;
  var input = document.getElementById('aa-q');
  if (input) {
    input.addEventListener('input', aaSearchInput);
    if (focused) { input.focus(); try { input.setSelectionRange(input.value.length, input.value.length); } catch (_) {} }
  }
  var sel = document.getElementById('aa-sort');
  if (sel) sel.addEventListener('change', function () { AA.sort = sel.value; aaFilterChanged(); });
  aaUpdateCount();
}

function aaSearchInput(e) {
  clearTimeout(AA.searchTimer);
  var wrap = document.getElementById('aa-search-wrap');
  if (wrap) wrap.classList.toggle('has', !!e.target.value);
  AA.searchTimer = setTimeout(function () {
    var v = (e.target.value || '').trim().slice(0, 80);
    if (v === AA.q) return;
    AA.q = v;
    aaFilterChanged(true);
  }, 260);
}

function aaFilterChanged(keepToolbar) {
  aaWriteUrl();
  if (!keepToolbar) aaRenderToolbar();
  document.querySelectorAll('.aa-era-row').forEach(function (b) {
    var on = b.getAttribute('data-era') === AA.era;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
  });
  if (AA.mode === 'client') aaApplyClientView(true);
  else aaRenderGrid(true);
}

function aaCardHTML(item) {
  var era = item.era_tags && item.era_tags.name;
  var bits = [];
  if (era) bits.push(escHtml(era));
  var when = aaShortDate(aaDateOf(item));
  if (when) bits.push(escHtml(when));
  if (item.external_likes) bits.push('<span class="aa-heart">♥</span> ' + aaNum(item.external_likes));
  var tc = Number(item.track_count);
  var tag = tc === 1 ? 'edit' : tc > 1 ? tc + ' tracks' : '';
  return '<div class="wv-comp-card" data-act="open" data-id="' + escHtml(item.id) + '" role="link" tabindex="0" aria-label="' + escHtml(item.title || 'Untitled') + '">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + coverGradient(item.title || '') + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18);">' +
      (tag ? '<span class="aa-tag">' + escHtml(tag) + '</span>' : '') +
      (item.cover_url ? '<img src="' + escHtml(item.cover_url) + '" loading="lazy" decoding="async" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">' : '') +
      (tc === 0 ? '' : aaPlayBtn(item.id, item.title)) +
    '</div></div>' +
    '<div class="wv-comp-card-title">' + escHtml(item.title || 'Untitled') + '</div>' +
    '<div class="wv-comp-card-artist">' + (bits.join(' · ') || '&nbsp;') + '</div></div>';
}

function aaSkelCards(n) {
  var out = '';
  for (var i = 0; i < n; i++) out += '<div class="wv-skel-card"><div class="wv-skel art"></div><div class="wv-skel l1"></div><div class="wv-skel l2"></div></div>';
  return out;
}

function aaEmptyHTML() {
  var filtered = AA.q || AA.era || AA.kind !== 'all';
  return '<div class="aa-empty"><b>' + (filtered ? 'nothing matches' + (AA.q ? ' “' + escHtml(AA.q) + '”' : ' those filters') : 'no releases yet') + '</b>' +
    (filtered ? 'try a different search or clear the filters<br><button class="wv-pill" data-act="clearall">Clear filters</button>' : '') + '</div>';
}

async function aaRenderGrid(reset) {
  var grid = document.getElementById('aa-grid');
  if (!grid) return;
  if (reset) {
    AA.gen++;
    AA.loading = false;
    if (AA.data && AA.gen === 1) {
      grid.innerHTML = AA.items.length ? AA.items.map(aaCardHTML).join('') : aaEmptyHTML();
      aaUpdateCount();
      aaMaybeMore();
      return;
    }
    AA.items = []; AA.hasMore = true;
    grid.innerHTML = aaSkelCards(12);
  }
  if (AA.loading || !AA.hasMore) return;
  AA.loading = true;
  var gen = AA.gen;
  var more = document.getElementById('aa-more');
  if (more && AA.items.length) more.textContent = 'loading more...';
  try {
    var d = await api('/archive/artists/' + encodeURIComponent(AA.slug) + aaQueryString(AA.items.length, AA_PAGE));
    if (gen !== AA.gen) return;
    var got = (d && d.comps) || [];
    var first = AA.items.length === 0;
    AA.items = AA.items.concat(got);
    AA.hasMore = !!d.has_more && got.length > 0;
    AA.total = typeof d.total === 'number' ? d.total : AA.items.length;
    grid = document.getElementById('aa-grid');
    if (!grid) return;
    if (first) grid.innerHTML = got.length ? got.map(aaCardHTML).join('') : aaEmptyHTML();
    else grid.insertAdjacentHTML('beforeend', got.map(aaCardHTML).join(''));
  } catch (e) {
    if (e && e.navAborted) return;
    if (gen !== AA.gen) return;
    AA.hasMore = false;
    var g = document.getElementById('aa-grid');
    if (g && !AA.items.length) g.innerHTML = '<div class="aa-empty"><b>couldnt load these</b>' + escHtml((e && e.message) || '') + '<br><button class="wv-pill" data-act="retry">Try again</button></div>';
    else if (more) { more.innerHTML = 'couldnt load more · <button class="wv-pill" data-act="retrymore">Retry</button>'; return; }
  } finally {
    if (gen === AA.gen) AA.loading = false;
  }
  aaUpdateCount();
  aaMaybeMore();
}

function aaClientList() {
  var list = AA.all || [];
  if (AA.kind === 'comps') list = list.filter(function (c) { return !aaIsEdit(c); });
  else if (AA.kind === 'edits') list = list.filter(aaIsEdit);
  if (AA.era) list = list.filter(function (c) { var n = c.era_tags && c.era_tags.name; return AA.era === '__none' ? !n : n === AA.era; });
  if (AA.q) { var q = AA.q.toLowerCase(); list = list.filter(function (c) { return String(c.title || '').toLowerCase().indexOf(q) >= 0; }); }
  var t = function (c) { var x = new Date(aaDateOf(c) || 0).getTime(); return isNaN(x) ? 0 : x; };
  var n = function (v) { return Number(v) || 0; };
  if (AA.sort === 'oldest') list = list.slice().sort(function (a, b) { return t(a) - t(b); });
  else if (AA.sort === 'likes') list = list.slice().sort(function (a, b) { return n(b.external_likes) - n(a.external_likes) || n(b.play_count) - n(a.play_count) || t(b) - t(a); });
  else if (AA.sort === 'plays') list = list.slice().sort(function (a, b) { return n(b.play_count) - n(a.play_count) || n(b.external_likes) - n(a.external_likes) || t(b) - t(a); });
  else if (AA.sort === 'title') list = list.slice().sort(function (a, b) { return String(a.title || '').localeCompare(String(b.title || ''), undefined, { sensitivity: 'base', numeric: true }); });
  return list;
}

function aaApplyClientView(reset) {
  var grid = document.getElementById('aa-grid');
  if (!grid) return;
  AA.view = aaClientList();
  AA.total = AA.view.length;
  if (reset) {
    AA.gen++;
    AA.shown = 0;
    grid.innerHTML = '';
  }
  if (!AA.view.length) {
    grid.innerHTML = AA.allDone || !(AA.q || AA.era || AA.kind !== 'all') ? aaEmptyHTML() : aaSkelCards(12);
    AA.shown = 0;
  } else {
    aaClientMore();
  }
  aaUpdateCount();
}

function aaClientMore() {
  var grid = document.getElementById('aa-grid');
  if (!grid || !AA.view) return;
  if (AA.shown >= AA.view.length) return;
  var next = AA.view.slice(AA.shown, AA.shown + AA_PAGE);
  AA.shown += next.length;
  grid.insertAdjacentHTML('beforeend', next.map(aaCardHTML).join(''));
  AA.items = AA.view.slice(0, AA.shown);
  aaUpdateCount();
  aaMaybeMore();
}

function aaUpdateCount() {
  var el = document.getElementById('aa-count');
  var more = document.getElementById('aa-more');
  var shown = AA.mode === 'client' ? AA.shown : AA.items.length;
  var total = AA.total || 0;
  var partial = AA.mode === 'client' && !AA.allDone;
  var capped = AA.mode === 'client' && AA.allDone && AA.all && AA.data && AA.all.length < AA.data.comp_count;
  var filtered = AA.q || AA.era || AA.kind !== 'all';
  if (el) {
    el.textContent = !total ? '' : (filtered ? aaNum(total) + (partial ? '+' : '') + ' match' + (total === 1 && !partial ? '' : 'es') : 'showing ' + aaNum(Math.min(shown, total)) + ' of ' + aaNum(partial || capped ? AA.data.comp_count : total));
  }
  if (more) {
    var left = AA.mode === 'client' ? AA.shown < (AA.view || []).length : AA.hasMore;
    if (!left && !AA.loading) more.textContent = shown > AA_PAGE ? 'that’s all ' + aaNum(shown) : '';
  }
  var btn = document.getElementById('aa-top');
  if (btn) btn.setAttribute('data-deep', shown > AA_PAGE * 2 ? '1' : '');
}

function aaMaybeMore() {
  var s = document.getElementById('aa-sentinel');
  var sc = document.getElementById('wv-content');
  if (!s) return;
  var r = s.getBoundingClientRect();
  var bottom = sc ? sc.getBoundingClientRect().bottom : window.innerHeight;
  if (r.top < bottom + 900) setTimeout(aaNext, 30);
}

function aaNext() {
  if (!document.getElementById('aa-grid')) return;
  if (AA.mode === 'client') { if (AA.view && AA.shown < AA.view.length) aaClientMore(); }
  else if (AA.hasMore && !AA.loading) aaRenderGrid(false);
}

function aaWatch() {
  if (AA.obs) { try { AA.obs.disconnect(); } catch (_) {} }
  var s = document.getElementById('aa-sentinel');
  if (s && 'IntersectionObserver' in window) {
    AA.obs = new IntersectionObserver(function (entries) {
      if (entries.some(function (e) { return e.isIntersecting; })) aaNext();
    }, { root: document.getElementById('wv-content') || null, rootMargin: '900px 0px' });
    AA.obs.observe(s);
  }
  var sc = document.getElementById('wv-content') || window;
  var onScroll = function () {
    var top = sc === window ? window.scrollY : sc.scrollTop;
    var btn = document.getElementById('aa-top');
    if (btn) btn.classList.toggle('on', top > 1400 && btn.getAttribute('data-deep') === '1');
    var bar = document.getElementById('aa-bar');
    if (bar) {
      var br = bar.getBoundingClientRect();
      var ref = sc === window ? 0 : sc.getBoundingClientRect().top;
      bar.classList.toggle('stuck', br.top <= ref + 1 && top > 200);
    }
  };
  sc.addEventListener('scroll', onScroll, { passive: true });
  var onKey = function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(input|textarea|select)$/i.test(t.tagName))) return;
    var input = document.getElementById('aa-q');
    if (!input) return;
    e.preventDefault();
    input.focus();
    input.scrollIntoView({ block: 'nearest' });
  };
  document.addEventListener('keydown', onKey);
  window._pageCleanup.push(function () {
    try { if (AA.obs) AA.obs.disconnect(); } catch (_) {}
    AA.obs = null;
    sc.removeEventListener('scroll', onScroll);
    document.removeEventListener('keydown', onKey);
    clearTimeout(AA.searchTimer);
    AA.gen++;
  });
}

function aaOnKey(e) {
  if (e.key === 'Escape' && e.target && e.target.id === 'aa-q' && e.target.value) {
    e.preventDefault();
    e.target.value = '';
    AA.q = '';
    aaFilterChanged();
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('data-act') === 'open') {
    e.preventDefault();
    navigate('/album?id=' + encodeURIComponent(e.target.getAttribute('data-id')));
  }
}

function aaOnClick(e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'play') { e.stopPropagation(); playCompById(el.getAttribute('data-id')); return; }
  if (act === 'open') { navigate('/album?id=' + encodeURIComponent(el.getAttribute('data-id'))); return; }
  if (act === 'playall') { aaPlayAll(); return; }
  if (act === 'shuffle') { aaShuffle(); return; }
  if (act === 'share') { aaShare(); return; }
  if (act === 'top') { var sc = document.getElementById('wv-content'); (sc || window).scrollTo({ top: 0, behavior: aaReduced() ? 'auto' : 'smooth' }); return; }
  if (act === 'kind') { var k = el.getAttribute('data-kind'); if (k === AA.kind) return; AA.kind = k; aaFilterChanged(); return; }
  if (act === 'era') {
    var era = el.getAttribute('data-era') || '';
    AA.era = AA.era === era ? '' : era;
    aaFilterChanged();
    if (el.classList.contains('aa-era-row')) {
      var bar = document.getElementById('aa-releases');
      if (bar) bar.scrollIntoView({ behavior: aaReduced() ? 'auto' : 'smooth', block: 'start' });
    }
    return;
  }
  if (act === 'clearq') { e.preventDefault(); AA.q = ''; aaFilterChanged(); var i = document.getElementById('aa-q'); if (i) i.focus(); return; }
  if (act === 'clearall') { AA.q = ''; AA.era = ''; AA.kind = 'all'; aaFilterChanged(); return; }
  if (act === 'retry') { if (AA.mode === 'client') aaApplyClientView(true); else aaRenderGrid(true); return; }
  if (act === 'retrymore') { AA.hasMore = true; aaRenderGrid(false); return; }
}

async function aaFetchTracks(list) {
  var out = new Array(list.length), next = 0;
  async function worker() {
    while (next < list.length) {
      var i = next++;
      try {
        var rows = await api('/albums/' + list[i].id + '/tracks');
        out[i] = (rows || []).map(function (r) { return r.tracks || r; }).filter(function (t) { return t && t.ia_url; });
      } catch (_) { out[i] = []; }
    }
  }
  var workers = [];
  for (var w = 0; w < Math.min(6, list.length); w++) workers.push(worker());
  await Promise.all(workers);
  return out;
}

async function aaPlayAll() {
  var btn = document.getElementById('aa-playall');
  var source = (AA.mode === 'client' ? (AA.view || AA.all || []) : AA.items).filter(function (c) { return Number(c.track_count) !== 0; });
  var picks = source.slice(0, 15);
  if (!picks.length) { if (typeof wvToast === 'function') wvToast('nothing to play here yet'); return; }
  if (btn) btn.disabled = true;
  if (typeof wvToast === 'function') wvToast('queueing ' + picks.length + ' release' + (picks.length === 1 ? '' : 's') + '...');
  try {
    var lists = await aaFetchTracks(picks);
    var queue = [];
    lists.forEach(function (tracks, i) {
      var c = picks[i];
      (tracks || []).forEach(function (t) {
        if (queue.length >= 200) return;
        queue.push({
          id: t.id, title: t.title, ia_url: t.ia_url,
          cover_url: t.cover_url || c.cover_url || null,
          artist_name: c.archive_artist_name || AA.data.name || '',
          album_id: c.id, _album_id: c.id, _album_title: c.title, _album_cover: c.cover_url || null,
          _archive_artist: c.archive_artist_name || AA.data.name || null,
        });
      });
    });
    if (!queue.length) { if (typeof wvToast === 'function') wvToast('none of those have audio that plays', 'error'); return; }
    setPlayerQueue(queue, 0);
    playQueueIndex(0);
    if (typeof wvToast === 'function') wvToast('playing ' + queue.length + ' track' + (queue.length === 1 ? '' : 's') + ' from ' + (AA.data.name || 'this creator'));
  } finally {
    if (btn) btn.disabled = false;
  }
}

function aaShuffle() {
  var pool = (AA.mode === 'client' ? (AA.all || []) : AA.items.concat(AA.stats.favorites || [])).filter(function (c) { return Number(c.track_count) !== 0; });
  var comps = pool.filter(function (c) { return (Number(c.track_count) || 0) > 1; });
  var use = comps.length ? comps : pool;
  if (!use.length) { if (typeof wvToast === 'function') wvToast('nothing to play here yet'); return; }
  var pick = use[Math.floor(Math.random() * use.length)];
  if (typeof wvToast === 'function') wvToast('playing ' + (pick.title || 'something'));
  playCompById(pick.id, { album: Object.assign({ is_archive: true }, pick), quiet: true, shuffle: true });
}

function aaShare() {
  var url = location.origin + '/archive-artist?a=' + encodeURIComponent(AA.slug);
  var title = (AA.data && AA.data.name ? AA.data.name : 'this creator') + ' on the wavernrs archive';
  if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || '')) {
    navigator.share({ title: title, url: url }).catch(function () {});
    return;
  }
  var done = function () { if (typeof wvToast === 'function') wvToast('link copied'); };
  var fallback = function () {
    try {
      var ta = document.createElement('textarea');
      ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
    } catch (_) { if (typeof wvToast === 'function') wvToast(url); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fallback);
  else fallback();
}

initArchiveArtist();
</script>
