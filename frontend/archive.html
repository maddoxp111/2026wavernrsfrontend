var _wvBadges = null;

<script>
initPlayer();

// The archive is thousands of comps. The grid asks the server for one page at
// a time (sorted and searched there) and pulls the next page as the reader
// scrolls, so a phone never downloads or draws more than it is looking at.
var _archiveArtists = []; // grouped artist index (one request, drawn in chunks)
var _archiveTotal = 0;
var _arcQuery = '';
var _arcSort = 'likes';   // opens on most liked
var _arcView = 'all';     // 'all' | 'comps' | 'edits' | 'artists' — the flat grid opens first
var _arcKind = 'all';
var _arcSearchTimer = null;
var _ARC_PAGE = 60;
var _arcItems = [];       // comps fetched so far for the current query/sort
var _arcLoading = false;
var _arcDone = false;
var _arcGen = 0;          // bumps when the query/sort changes so stale pages are dropped
var _arcShownArtists = 0;
var _arcObserver = null;

async function initArchive() {
  var view = document.getElementById('view');
  view.innerHTML =
    '<div style="display:flex;flex-direction:column;gap:20px;">' +
    '<div>' +
      '<h1 style="margin:0 0 8px;font-size:38px;font-weight:800;letter-spacing:-0.035em;">Archive</h1>' +
      '<p style="margin:0;font-size:14px;color:var(--text-2);max-width:560px;line-height:1.55;">Comps preserved by the wavernrs team — not by artists on the site, but too good to be lost.</p>' +
    '</div>' +
    '<div class="wv-card" style="padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">' +
      '<div style="font-size:13.5px;color:var(--text-2);line-height:1.5;"><b style="color:var(--text);">Made one of these?</b> Get your comps under your name or on your account, or report one that someone else posted as theirs.</div>' +
      '<button class="wv-pill brand" style="font-size:13px;padding:8px 16px;font-weight:700;white-space:nowrap;" onclick="navigate(\'/claim.html\')">Claim your comps</button>' +
      '<button class="wv-pill" style="font-size:13px;padding:8px 16px;font-weight:700;white-space:nowrap;margin-left:8px;" onclick="navigate(\'/claim.html?type=remove\')">Takedown request</button>' +
    '</div>' +
    '<div class="wv-seg" style="align-self:flex-start;">' +
      '<button class="on" id="arc-view-all" onclick="arcSetView(\'all\')">All Releases</button>' +
      '<button id="arc-view-comps" onclick="arcSetView(\'comps\')">Comps</button>' +
      '<button id="arc-view-edits" onclick="arcSetView(\'edits\')">Edits</button>' +
      '<button id="arc-view-artists" onclick="arcSetView(\'artists\')">Artists</button>' +
    '</div>' +
    '<div class="wv-seg" style="align-self:flex-start;">' +
      '<button id="arc-view-top" onclick="arcSetView(\'top\')">Top 150</button>' +
      '<button id="arc-view-trackers" onclick="arcSetView(\'trackers\')">Trackers</button>' +
    '</div>' +
    '<div id="arc-filters" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">' +
      '<input type="text" id="arc-search" class="wv-input" placeholder="Search title or artist…" ' +
        'style="flex:1;min-width:200px;max-width:340px;padding:9px 14px;font-size:14px;" oninput="arcSearchInput()">' +
      '<select id="arc-sort" class="wv-input" style="padding:9px 12px;font-size:13px;width:auto;" onchange="arcSortChange()">' +
        '<option value="likes">Most liked</option>' +
        '<option value="newest">Newest first</option>' +
        '<option value="oldest">Oldest first</option>' +
        '<option value="title">Title A–Z</option>' +
        '<option value="artist">Artist A–Z</option>' +
        '<option value="plays">Most played</option>' +
      '</select>' +
      '<select id="arc-era" class="wv-input" style="padding:9px 12px;font-size:13px;width:auto;display:none;" onchange="arcEraChange()">' +
        '<option value="">Every era</option>' +
      '</select>' +
      '<button class="wv-pill" style="font-size:13px;padding:8px 14px;font-weight:700;" onclick="arcSurprise()" title="Play a comp at random">Surprise me</button>' +
      '<button class="wv-pill" style="font-size:13px;padding:8px 14px;font-weight:700;" onclick="arcShuffleResults()" title="Queue a track from each comp shown">Shuffle these</button>' +
      '<span id="arc-count" style="font-size:12px;color:var(--text-3);"></span>' +
    '</div>' +
    '<div id="archive-grid" class="wv-tile-grid"><div class="loading"><div class="spinner"></div></div></div>' +
    '<div id="archive-sentinel" style="height:1px;"></div>' +
    '<div id="archive-loading-more" style="display:none;font-size:12px;color:var(--text-3);text-align:center;padding:6px 0;">Loading more…</div>' +
    '</div>';
  var _q0 = new URLSearchParams(location.search).get('q');
  if (_q0) {
    _arcQuery = _q0.trim();
    var si = document.getElementById('arc-search');
    if (si) si.value = _arcQuery;
  }
  arcApplyView();
  _arcWatchSentinel();
  arcReload();
  loadTrackerTabs();
  loadArcEras();
  setTimeout(function () {
    var g = document.getElementById('archive-grid');
    if (g && !_arcItems.length && g.querySelector('.spinner')) {
      g.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">The archive is taking too long to load. <button class="wv-pill" style="margin-left:8px;" onclick="arcReload()">Try again</button></div>';
    }
  }, 20000);
}

// ── Comps: paged from the server ─────────────────────────────────────────────
function _arcNoun(n) { var w = _arcKind === 'edits' ? 'edit' : _arcKind === 'comps' ? 'comp' : 'release'; return w + (n === 1 ? '' : 's'); }
function arcReload() {
  _arcGen++;
  _arcItems = []; _arcDone = false; _arcLoading = false; _archiveTotal = 0;
  var grid = document.getElementById('archive-grid');
  if (grid && _arcView !== 'artists') grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  arcLoadMore();
}

async function arcLoadMore() {
  if (_arcView === 'artists' || _arcLoading || _arcDone) return;
  _arcLoading = true;
  var gen = _arcGen;
  var more = document.getElementById('archive-loading-more');
  if (more && _arcItems.length) more.style.display = '';
  try {
    var url = '/archive?limit=' + _ARC_PAGE + '&offset=' + _arcItems.length + '&sort=' + encodeURIComponent(_arcSort) + '&kind=' + _arcKind +
      (_arcQuery ? '&q=' + encodeURIComponent(_arcQuery) : '') +
      (_arcEra ? '&era=' + encodeURIComponent(_arcEra) : '');
    var page = null;
    try { page = await api(url); }
    catch (e) {
      if (e && e.navAborted) return;
      if (gen !== _arcGen) return;
      throw e;
    }
    if (gen !== _arcGen) return; // the query changed while this was in flight
    var items = Array.isArray(page) ? page : (page.items || []);
    var knownTotal = Array.isArray(page) ? items.length
      : (page.total_known || typeof page.total === 'number' && page.total > 0) ? page.total : null;
    if (typeof knownTotal === 'number') _archiveTotal = knownTotal;
    var first = _arcItems.length === 0;
    _arcItems = _arcItems.concat(items);
    // A short page means the end. Only trust a total the server actually knows;
    // it counts in the background and reports null until that lands.
    _arcDone = !items.length || items.length < _ARC_PAGE ||
      (typeof knownTotal === 'number' && _arcItems.length >= knownTotal);
    var grid = document.getElementById('archive-grid');
    if (!grid) return;
    grid.className = 'wv-tile-grid';
    var trackCards = (first && Array.isArray(page.tracks) && page.tracks.length) ? page.tracks.map(archiveTrackCardHTML).join('') : '';
    if (first) {
      if (!_arcItems.length && trackCards) { grid.innerHTML = trackCards; return; }
      if (!_arcItems.length) {
        grid.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">' + (_arcQuery ? 'Nothing matches your search.' : 'No archived comps yet.') + '</div>';
      } else {
        grid.innerHTML = items.map(archiveCardHTML).join('') + trackCards;
        if (typeof window.setPageBgImage === 'function') {
          var withCover = items.filter(function(i) { return i.cover_url; });
          window.setPageBgImage(withCover.length ? withCover[Math.floor(Math.random() * withCover.length)].cover_url : '');
        }
      }
    } else if (items.length) {
      grid.insertAdjacentHTML('beforeend', items.map(archiveCardHTML).join(''));
    }
    var countEl = document.getElementById('arc-count');
    if (countEl) {
      countEl.textContent = _archiveTotal
        ? _archiveTotal.toLocaleString() + ' ' + _arcNoun(_archiveTotal) + (_arcQuery ? ' match' : '')
        : _arcItems.length.toLocaleString() + '+ ' + _arcNoun(2) + (_arcDone ? '' : ' so far');
    }
  } catch (err) {
    if (gen !== _arcGen) return;
    var g = document.getElementById('archive-grid');
    if (g && g.querySelector('.spinner')) wvShowError(g, err, 'arcReload()');
  } finally {
    if (gen === _arcGen) { _arcLoading = false; if (more) more.style.display = 'none'; }
  }
}

function arcSearchInput() {
  clearTimeout(_arcSearchTimer);
  _arcSearchTimer = setTimeout(function() {
    _arcQuery = ((document.getElementById('arc-search') || {}).value || '').trim();
    if (_arcView !== 'artists') arcReload(); else loadArtists(true);
  }, 250);
}

var _arcEra = '';
var _arcEras = [];
async function loadArcEras() {
  try {
    var r = await api('/archive/eras');
    var sel = document.getElementById('arc-era');
    if (!sel || !r || !r.items || r.items.length < 2) return;
    _arcEras = r.items;
    sel.innerHTML = '<option value="">Every era</option>' +
      r.items.map(function (e) { return '<option value="' + escHtml(e.id) + '">' + escHtml(e.name) + ' (' + e.comps.toLocaleString() + ')</option>'; }).join('');
    sel.value = _arcEra;
    sel.style.display = '';
  } catch (_) {}
}

function arcEraChange() {
  var sel = document.getElementById('arc-era');
  _arcEra = sel ? sel.value : '';
  // Wash the page in the era's own cover while you are filtered to it.
  var era = _arcEras.find(function (e) { return e.id === _arcEra; });
  if (typeof window.setPageBgImage === 'function' && era && era.cover) window.setPageBgImage(era.cover, era.name);
  arcReload();
}

// Build a mixtape out of whatever the grid is currently showing: one track
// from each comp, shuffled.
async function arcShuffleResults() {
  var comps = _arcItems.filter(function (i) { return (i.track_count || 0) > 1 || i.track_count === undefined; }).slice(0, 25);
  if (!comps.length) { if (typeof wvToast === 'function') wvToast('Nothing to shuffle yet'); return; }
  if (typeof wvToast === 'function') wvToast('Building a mix from ' + comps.length + ' comps…');
  var batches = await Promise.all(comps.map(function (c) {
    return api('/albums/' + c.id + '/tracks').catch(function () { return []; });
  }));
  var queue = [];
  batches.forEach(function (rows, i) {
    var c = comps[i];
    var tracks = (rows || []).map(function (r) { return r.tracks || r; }).filter(function (t) { return t && t.ia_url; });
    if (!tracks.length) return;
    var t = tracks[Math.floor(Math.random() * tracks.length)];
    queue.push({
      id: t.id, title: t.title, ia_url: t.ia_url,
      cover_url: t.cover_url || c.cover_url || null,
      artist_name: c.archive_artist_name || 'Unknown',
      album_id: c.id, _album_id: c.id, _album_title: c.title, _album_cover: c.cover_url || null,
      _archive_artist: c.archive_artist_name || null,
    });
  });
  if (!queue.length) { if (typeof wvToast === 'function') wvToast('None of those had playable audio', 'error'); return; }
  for (var i = queue.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = queue[i]; queue[i] = queue[j]; queue[j] = tmp; }
  setPlayerQueue(queue, 0);
  playQueueIndex(0);
  if (typeof wvToast === 'function') wvToast('Playing a mix of ' + queue.length + ' tracks');
}

async function arcSurprise() {
  try {
    if (typeof wvToast === 'function') wvToast('Finding something…');
    var r = await api('/archive/random?n=1');
    var pick = r && r.items && r.items[0];
    if (!pick) { if (typeof wvToast === 'function') wvToast('Could not pick one right now', 'error'); return; }
    if (typeof wvToast === 'function') wvToast('Playing ' + pick.title);
    playCompById(pick.id, { album: pick, quiet: true });
  } catch (_) { if (typeof wvToast === 'function') wvToast('Could not pick one right now', 'error'); }
}

function arcSortChange() {
  _arcSort = (document.getElementById('arc-sort') || {}).value || 'newest';
  arcReload();
}

// ── Artist index ─────────────────────────────────────────────────────────────
var _artistsLoaded = false, _artistsLoading = false, _artistsTotal = 0, _artistsGen = 0;
async function loadArtists(reset) {
  if (_artistsLoading) return;
  if (reset) { _archiveArtists = []; _artistsLoaded = false; _artistsTotal = 0; }
  if (_artistsLoaded && _archiveArtists.length >= _artistsTotal) return;
  _artistsLoading = true;
  var gen = ++_artistsGen;
  var grid = document.getElementById('archive-grid');
  if (grid && !_archiveArtists.length) grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    var url = '/archive/artists?sort=comps&limit=120&offset=' + _archiveArtists.length + (_arcQuery ? '&q=' + encodeURIComponent(_arcQuery) : '');
    var d = await api(url);
    if (gen !== _artistsGen) return;
    _archiveArtists = _archiveArtists.concat((d && d.artists) || []);
    _artistsTotal = (d && d.total) || _archiveArtists.length;
    _artistsLoaded = true;
  } catch (e) {
    if (gen !== _artistsGen) return;
    if (!_archiveArtists.length && grid) grid.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">Could not load artists. <button class="wv-pill" style="margin-left:8px;" onclick="loadArtists(true)">Try again</button></div>';
  } finally {
    _artistsLoading = false;
  }
  if (_arcView === 'artists') renderArtists();
}

var _arcArtistList = [];
function renderArtists() {
  var g0 = document.getElementById('archive-grid');
  if (g0) g0.className = 'wv-tile-grid';
  var grid = document.getElementById('archive-grid');
  if (!grid) return;
  var artists = _archiveArtists;
  var cEl = document.getElementById('arc-count');
  if (cEl) cEl.textContent = (_artistsTotal || artists.length).toLocaleString() + ' artist' + ((_artistsTotal || artists.length) !== 1 ? 's' : '');
  if (!artists.length) { grid.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">' + (_arcQuery ? 'No artists match your search.' : 'No archived comps yet.') + '</div>'; return; }
  _arcArtistList = artists;
  _arcShownArtists = artists.length;
  grid.innerHTML = artists.map(artistCardHTML).join('');
}
function _arcMoreArtists() {
  if (_archiveArtists.length < _artistsTotal) loadArtists();
}

// ── View toggle ──────────────────────────────────────────────────────────────
function arcSetView(view) {
  if (view === _arcView) return;
  _arcView = view;
  arcApplyView();
  if (view === 'artists') { if (!_artistsLoaded) loadArtists(true); else renderArtists(); return; }
  if (view === 'top') return loadTopComps();
  if (view === 'trackers') return renderTrackerCards();
  _arcKind = view;
  arcReload();
}

var ARC_VIEWS = ['all', 'comps', 'edits', 'artists', 'top', 'trackers'];

function arcApplyView() {
  ARC_VIEWS.forEach(function(v) { var b = document.getElementById('arc-view-' + v); if (b) b.classList.toggle('on', _arcView === v); });
  // The Top 150 and Trackers views are their own thing: the filter bar and the
  // endless grid do not apply to either.
  var curated = _arcView === 'top' || _arcView === 'trackers';
  var listView = _arcView !== 'artists' && !curated;
  var sortEl = document.getElementById('arc-sort');
  if (sortEl) sortEl.style.display = listView ? '' : 'none';
  var eraEl = document.getElementById('arc-era');
  if (eraEl && curated) eraEl.style.display = 'none';
  else if (eraEl && _arcEras.length > 1) eraEl.style.display = '';
  var filters = document.getElementById('arc-filters');
  if (filters) filters.style.display = curated ? 'none' : 'flex';
  var search = document.getElementById('arc-search');
  if (search) search.placeholder = _arcView === 'artists' ? 'Search artists…' : 'Search title or artist…';
  var sentinel = document.getElementById('archive-sentinel');
  if (sentinel) sentinel.style.display = curated ? 'none' : '';
}

// Near the bottom: next server page for comps, next chunk of tiles for artists.
function _arcWatchSentinel() {
  var el = document.getElementById('archive-sentinel');
  if (!el || !('IntersectionObserver' in window)) return;
  if (_arcObserver) _arcObserver.disconnect();
  _arcObserver = new IntersectionObserver(function(entries) {
    if (!entries.some(function(e) { return e.isIntersecting; })) return;
    if (_arcView !== 'artists') arcLoadMore(); else _arcMoreArtists();
  }, { rootMargin: '900px 0px' });
  _arcObserver.observe(el);
}
(window._pageCleanup || []).push(function() { if (_arcObserver) _arcObserver.disconnect(); });

// ── Tracker tabs (second row) ────────────────────────────────────────────────
var _trackers = null;
async function loadTrackerTabs() {
  try {
    var d = await api('/trackers');
    _trackers = (d && d.trackers) || [];
  } catch (e) { _trackers = []; }
  if (_arcView === 'trackers') renderTrackerCards();
}

function renderTrackerCards() {
  var grid = document.getElementById('archive-grid');
  if (!grid) return;
  if (!_trackers.length) {
    grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    return;
  }
  grid.className = 'wv-tracker-grid';
  grid.innerHTML = _trackers.map(function (t) {
    var total = t.entries || 0;
    return '<div class="wv-tracker-card" onclick="navigate(\'/tracker.html?t=' + encodeURIComponent(t.slug) + '\')">' +
      '<div class="wv-tracker-art" style="background:' + coverGradient(t.name || '') + ';">' +
        (t.cover ? '<img src="' + escHtml(t.cover) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      '</div>' +
      '<div class="wv-tracker-body">' +
        '<div class="wv-tracker-name">' + escHtml(t.name) + '</div>' +
        (t.blurb ? '<div class="wv-tracker-blurb">' + escHtml(t.blurb) + '</div>' : '') +
        '<div class="wv-tracker-stats">' + total.toLocaleString() + ' comps and edits · ' + (t.eras || 0) + ' eras</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// The community ranking. Emphasis drops off in steps, so the very top of the
// list reads as a shortlist rather than one long undifferentiated grid.
var _topComps = null;
// Only the top 3 and the top 10 stand apart; the rest of the ranking shares
// one size so the list stays scannable.
var TOP_TIERS = [
  { to: 3,   cls: 'tier1' },
  { to: 10,  cls: 'tier2' },
  { to: 150, cls: 'tier4' },
];

async function loadTopComps() {
  var grid = document.getElementById('archive-grid');
  if (!grid) return;
  grid.className = 'wv-top150';
  if (!_topComps) {
    grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try { _topComps = await api('/archive/top'); }
    catch (err) { wvShowError(grid, err, "arcSetView('top')"); return; }
  }
  renderTopComps();
}

function renderTopComps() {
  var grid = document.getElementById('archive-grid');
  if (!grid || !_topComps) return;
  var items = _topComps.items || [];
  var head = '<div class="wv-top150-head">' +
    '<h2>The 150 best comps</h2>' +
    '<p>Yedits Top 100 Comps…made by 100greenmen and mp.</p>' +
    '<div class="wv-top150-actions">' +
      '<button class="wv-pill" onclick="playTop(3)">Play Top 3</button>' +
      '<button class="wv-pill" onclick="playTop(10)">Play Top 10</button>' +
      '<button class="wv-pill" onclick="playTop(100)">Play Top 100</button>' +
      '<button class="wv-pill" onclick="playTop(150)">Play Full Ranking</button>' +
    '</div></div>';
  var html = head;
  var from = 1;
  TOP_TIERS.forEach(function (tier) {
    var slice = items.filter(function (i) { return i.rank >= from && i.rank <= tier.to; });
    from = tier.to + 1;
    if (!slice.length) return;
    html += '<div class="wv-top150-grid ' + tier.cls + '">' + slice.map(topCard).join('') + '</div>';
  });
  grid.innerHTML = html;
  var lead = items.find(function (i) { return i.cover_url; });
  if (lead && typeof window.setPageBgImage === 'function') window.setPageBgImage(lead.cover_url, lead.title);
}

function topCard(i) {
  var bg = coverGradient(i.title || '');
  var missing = !i.on_site;
  var sub = [i.creator, i.era, i.track_count ? i.track_count + ' tracks' : ''].filter(Boolean).join(' · ');
  // A comp we have not archived yet still opens a search for it, rather than
  // sitting there dimmed and dead.
  var click = missing
    ? ' onclick="navigate(\'/archive.html?q=' + encodeURIComponent(i.listed_as || i.title || '') + '\')"'
    : ' onclick="navigate(\'/album.html?id=' + i.album_id + '\')"';
  return '<div class="wv-top-card"' + click + '>' +
    '<div class="wv-top-rank">' + i.rank + '</div>' +
    '<div class="wv-top-art" style="background:' + bg + ';">' +
      (i.cover_url ? '<img src="' + escHtml(i.cover_url) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      (missing ? '' : '<button class="wv-cover-play-btn" title="Play" aria-label="Play ' + escHtml(i.title || '') + '" onclick="event.stopPropagation();playCompById(\'' + i.album_id + '\')">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg></button>') +
    '</div>' +
    '<div class="wv-top-meta">' +
      '<div class="wv-top-title">' + escHtml(i.title || 'Untitled') + '</div>' +
      '<div class="wv-top-sub">' + escHtml(sub) + '</div>' +
    '</div>' +
  '</div>';
}

// Play down the ranking in order. A short range plays every comp in full; the
// long ones would be thousands of tracks and a request per comp, so those take
// one track from each. The toast says which you got.
async function playTop(n) {
  if (!_topComps) return;
  var picks = (_topComps.items || []).filter(function (i) { return i.on_site && i.rank <= n; });
  if (!picks.length) { if (typeof wvToast === 'function') wvToast('None of those are on the site yet'); return; }
  var whole = picks.length <= 10;
  if (typeof wvToast === 'function') {
    wvToast('Loading ' + (whole ? 'the top ' + picks.length : 'one track from each of the top ' + picks.length) + '…');
  }

  // Eight at a time, so the long ranges do not hit the API all at once.
  var lists = new Array(picks.length);
  var next = 0;
  async function worker() {
    while (next < picks.length) {
      var i = next++;
      try {
        var rows = await api('/albums/' + picks[i].album_id + '/tracks');
        lists[i] = (rows || []).map(function (r) { return r.tracks || r; }).filter(function (t) { return t && t.ia_url; });
      } catch (e) { lists[i] = []; }
    }
  }
  await Promise.all(Array.from({ length: Math.min(8, picks.length) }, worker));

  var queue = [];
  lists.forEach(function (tracks, i) {
    if (!tracks || !tracks.length) return;
    var p = picks[i];
    var take = whole ? tracks : [tracks[Math.floor(Math.random() * tracks.length)]];
    take.forEach(function (t) {
      queue.push({
        id: t.id, title: t.title, ia_url: t.ia_url,
        cover_url: t.cover_url || p.cover_url || null,
        artist_name: p.creator || '',
        album_id: p.album_id, _album_id: p.album_id, _album_title: p.title,
        _album_cover: p.cover_url || null, _archive_artist: p.creator || null,
      });
    });
  });
  if (!queue.length) { if (typeof wvToast === 'function') wvToast('Nothing playable in that range', 'error'); return; }
  setPlayerQueue(queue, 0);
  playQueueIndex(0);
  if (typeof wvToast === 'function') {
    wvToast(whole
      ? 'Playing ' + queue.length + ' tracks from the top ' + picks.length
      : 'Playing one track from each of ' + queue.length + ' comps');
  }
}

function artistCardHTML(a) {
  var bg = coverGradient(a.name || '');
  return '<div class="wv-artist-tile" onclick="navigate(\'/archive-artist.html?a=' + encodeURIComponent(a.slug) + '\')">' +
    '<div class="av" style="background:' + bg + ';">' +
      (a.cover_url ? '<img src="' + escHtml(a.cover_url) + '" loading="lazy" decoding="async" onerror="this.style.opacity=0">' : '') +
    '</div>' +
    '<div class="wv-artist-name">' + escHtml(a.name) + '</div>' +
    '<div class="wv-artist-meta">' + a.comp_count + ' comp' + (a.comp_count !== 1 ? 's' : '') + '</div></div>';
}

function archiveCardHTML(item) {
  var bg = coverGradient(item.title || '');
  var artistName = item.archive_artist_name || (item.artists && item.artists.display_name) || 'Unknown';
  return '<div class="wv-comp-card" onclick="navigate(\'/album.html?id=' + item.id + '\')">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
    (item.is_archive === false ? '' : '<div style="position:absolute;top:8px;left:8px;padding:2px 8px;background:rgba(255,255,255,0.2);color:rgba(255,255,255,0.96);font-size:9px;font-weight:700;letter-spacing:0.06em;border-radius:4px;text-transform:uppercase;">archived</div>') +
    (item.cover_url ? '<img src="' + escHtml(item.cover_url) + '" loading="lazy" decoding="async" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">' : '') +
    '<button class="wv-cover-play-btn" title="Play" aria-label="Play ' + escHtml(item.title || '') + '" onclick="event.stopPropagation();playCompById(\'' + item.id + '\')">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v15.78a1.5 1.5 0 0 0 2.3 1.27l12.5-7.89a1.5 1.5 0 0 0 0-2.54L6.3 2.84Z"/></svg>' +
    '</button>' +
    '</div></div>' +
    '<div class="wv-comp-card-title">' + escHtml(item.title) + _onyxIcon(item.id) + '</div>' +
    '<div class="wv-comp-card-artist">' + escHtml(artistName) +
      (item.era_tag && item.era_tag.name ? ' · ' + escHtml(item.era_tag.name) : '') +
      (item.original_date ? ' · ' + new Date(item.original_date).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : '') +
      (item.external_likes ? ' · ♥ ' + Number(item.external_likes).toLocaleString() : '') + '</div></div>';
}

function archiveTrackCardHTML(t) {
  var bg = coverGradient(t.title || '');
  return '<div class="wv-comp-card" onclick="navigate(\'/album.html?id=' + t.album_id + '&t=' + t.id + '\')">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
    '<div style="position:absolute;top:8px;left:8px;padding:2px 8px;background:rgba(167,139,250,0.35);color:#fff;font-size:9px;font-weight:700;letter-spacing:0.06em;border-radius:4px;text-transform:uppercase;">track in a comp</div>' +
    (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">' : '') +
    '</div></div>' +
    '<div class="wv-comp-card-title">' + escHtml(t.title) + '</div>' +
    '<div class="wv-comp-card-artist">' + escHtml(t.archive_artist_name || 'Unknown') + (t.album_title ? ' · from ' + escHtml(t.album_title) : '') + '</div></div>';
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initArchive();
</script>
