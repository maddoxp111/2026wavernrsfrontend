<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — archive</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
initPlayer();

var _archiveItems = [];

async function initArchive() {
  var view = document.getElementById('view');
  view.innerHTML =
    '<div style="display:flex;flex-direction:column;gap:22px;">' +
    '<div>' +
      '<h1 style="margin:0 0 8px;font-size:38px;font-weight:800;letter-spacing:-0.035em;">Archive</h1>' +
      '<p style="margin:0;font-size:14px;color:var(--text-2);max-width:560px;line-height:1.55;">Comps preserved by the wavernrs and yzyplayer&#39;s team — not by artists on the site, but too good to be lost.</p>' +
    '</div>' +
    '<div id="archive-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px;"><div class="loading"><div class="spinner"></div></div></div>' +
    '</div>';
  loadArchive();
}

async function loadArchive() {
  var grid = document.getElementById('archive-grid');
  if (!grid) return;
  try {
    var items = await api('/archive');
    _archiveItems = items || [];
    if (typeof window.setPageBgImage === 'function') {
      var withCover = _archiveItems.filter(function(i){ return i.cover_url; });
      window.setPageBgImage(withCover.length ? withCover[Math.floor(Math.random() * withCover.length)].cover_url : '');
    }
    if (!_archiveItems.length) {
      grid.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">No archived comps yet.</div>';
      return;
    }
    grid.innerHTML = _archiveItems.map(archiveCardHTML).join('');
  } catch (err) {
    grid.innerHTML = '<div class="wv-empty" style="grid-column:1/-1;">Failed: ' + escHtml(err.message) + '</div>';
  }
}

function archiveCardHTML(item) {
  var bg = coverGradient(item.title || '');
  var artistName = item.archive_artist_name || 'Unknown';
  var eraName = item.era_tags ? item.era_tags.name : null;
  return '<div class="wv-comp-card" onclick="navigate(\'/album.html?id=' + item.id + '\')">' +
    '<div class="wv-comp-card-cover"><div class="wv-comp-card-cover-inner" style="background:' + bg + ';border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,0.18),inset 0 0 0 0.5px rgba(255,255,255,0.15);">' +
    '<div aria-hidden style="position:absolute;inset:0;background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0) 45%),radial-gradient(80% 80% at 80% 90%,rgba(0,0,0,0.28) 0%,rgba(0,0,0,0) 60%);pointer-events:none;border-radius:14px;"></div>' +
    '<div style="position:absolute;top:8px;left:8px;padding:2px 8px;background:rgba(255,255,255,0.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:rgba(255,255,255,0.96);font-size:9px;font-weight:700;letter-spacing:0.06em;border-radius:4px;text-transform:uppercase;">archived</div>' +
    (item.cover_url ? '<img src="' + escHtml(item.cover_url) + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;" onerror="this.style.opacity=0">' : '') +
    '</div></div>' +
    '<div class="wv-comp-card-title">' + escHtml(item.title) + '</div>' +
    '<div class="wv-comp-card-artist">' + escHtml(artistName) + (eraName ? ' · ' + escHtml(eraName) : '') + '</div></div>';
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initArchive();
</script>
</body>
</html>
