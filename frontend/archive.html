  <style>
    .arc-top { display: flex; flex-direction: column; gap: 10px; }

    .arc-claim { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    .arc-search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }

    .arc-search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    .arc-search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 700 11px var(--font-mono, monospace); color: var(--text-3); border: 1px solid var(--hair-strong); border-radius: 5px; padding: 1px 6px; pointer-events: none; }
    .arc-search input:focus + kbd, .arc-search input:not(:placeholder-shown) + kbd { display: none; }
    .arc-surprise { display: inline-flex; align-items: center; gap: 7px; }
    .arc-surprise svg { flex: none; }
    .arc-top-btn { position: fixed; right: 24px; bottom: 104px; z-index: 30; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--hair-strong); background: var(--elevated, var(--surface)); color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,.35); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(12px) scale(.9); pointer-events: none; transition: opacity .2s, transform .2s var(--ease); }
    .arc-top-btn.on { opacity: 1; transform: none; pointer-events: auto; }

    .arc-rl { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }

    .arc-rl.in .arc-rl-back { opacity: 1; }
    .arc-rl-panel { position: relative; width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--elevated, var(--surface)); color: var(--text); border: 1px solid var(--hair-strong); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.55); padding: 22px 0 22px; opacity: 0; transform: translateY(16px) scale(.97); transition: opacity .25s, transform .3s var(--ease); }
    .arc-rl.in .arc-rl-panel { opacity: 1; transform: none; }
    .arc-rl-head { padding: 0 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .arc-rl-kicker { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); display: flex; align-items: center; gap: 6px; }

    .arc-rl-x:hover { background: var(--surface-3); }
    .arc-rl-win { position: relative; margin: 18px 0 6px; height: 176px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); }
    .arc-rl-reel { position: absolute; left: 0; top: 14px; display: flex; gap: 12px; will-change: transform; }
    .arc-rl-tile { flex: 0 0 148px; height: 148px; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 8px 22px rgba(0,0,0,.35); transition: opacity .35s, transform .45s var(--ease), box-shadow .45s; }
    .arc-rl-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .arc-rl-tile .wv-skel { position: absolute; inset: 0; border-radius: 0; }
    .arc-rl.landed .arc-rl-tile { opacity: .28; }
    .arc-rl.landed .arc-rl-tile.win { opacity: 1; transform: scale(1.09); box-shadow: 0 0 0 3px var(--brand), 0 18px 44px rgba(0,0,0,.5); }
    .arc-rl-mark { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 164px; transform: translateX(-50%); border-radius: 16px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--brand) 70%, transparent); pointer-events: none; transition: opacity .3s; }
    .arc-rl-mark::before, .arc-rl-mark::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); border: 8px solid transparent; }
    .arc-rl-mark::before { top: -4px; border-top-color: var(--brand); }
    .arc-rl-mark::after { bottom: -4px; border-bottom-color: var(--brand); }

    .arc-rl-status { font-size: 13px; color: var(--text-3); padding-top: 18px; }
    .arc-rl-t { font-size: 20px; font-weight: 900; letter-spacing: -.025em; line-height: 1.2; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .arc-rl-a { font-size: 13.5px; color: var(--text-2); margin-top: 4px; }
    .arc-rl-a a { color: var(--text); font-weight: 700; text-decoration: none; }
    .arc-rl-a a:hover { text-decoration: underline; }
    .arc-rl-m { font-size: 12px; color: var(--text-3); margin-top: 3px; }
    .arc-rl-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .arc-rl-btns button { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; padding: 0 20px; }
    .arc-rl-play { border: 0; background: var(--brand); color: var(--on-brand, #14121c); }
    .arc-rl-play:hover { filter: brightness(1.07); }
    .arc-rl-ghost { background: transparent; color: var(--text); border: 1px solid var(--hair-strong); }
    .arc-rl-ghost:hover { border-color: var(--text); }
    .arc-rl-res > * { animation: arcRlIn .4s var(--ease) both; }

    .arc-podium { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr) !important; align-items: end; gap: 22px !important; margin-bottom: 8px; }

    .arc-podium .wv-top-rank { display: none; }
    .arc-podium .wv-top-art { border-radius: 14px; }
    .arc-podium .p1 .wv-top-art { box-shadow: 0 0 0 3px #f4c542, 0 22px 50px rgba(244,197,66,.22), 0 10px 30px rgba(0,0,0,.35); }
    .arc-podium .p2 .wv-top-art { box-shadow: 0 0 0 3px #cbd5e1, 0 18px 40px rgba(0,0,0,.3); }
    .arc-podium .p3 .wv-top-art { box-shadow: 0 0 0 3px #d08a4f, 0 18px 40px rgba(0,0,0,.3); }
    .arc-medal { position: absolute; left: 12px; top: 12px; z-index: 2; width: 46px; height: 46px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; line-height: 1; box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.18); }

    .arc-medal.m1 { background: radial-gradient(circle at 32% 28%, #fff6cf, #f4c542 46%, #b8860b); color: #3b2a00; width: 56px; height: 56px; font-size: 23px; }
    .arc-medal.m2 { background: radial-gradient(circle at 32% 28%, #ffffff, #cbd5e1 46%, #7c8799); color: #1f2937; }
    .arc-medal.m3 { background: radial-gradient(circle at 32% 28%, #ffe4cc, #d08a4f 46%, #8c4f22); color: #3a1d08; }
    .arc-podium .wv-top-title { font-size: 17px !important; margin-top: 12px; }
    .arc-podium .p1 .wv-top-title { font-size: 21px !important; }
    .arc-podium .arc-pod-stats { font-size: 12px; color: var(--text-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .arc-top-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--text-3); margin: -4px 0 12px; }
    .arc-top-meta a { color: var(--text); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
    .arc-top-meta a:hover { text-decoration: underline; }

    /* archive home */
    #arc-home { display: flex; flex-direction: column; gap: 0; }
    .ah-hero { position: relative; overflow: hidden; border-radius: 20px; background: var(--surface); border: 1px solid var(--hair); padding: 36px 36px 32px; min-height: 340px; display: flex; align-items: flex-end; isolation: isolate; }
    .ah-wall { position: absolute; z-index: -1; top: -24px; right: -18px; width: 54%; height: calc(100% + 48px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: min-content; gap: 10px; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 34%); mask-image: linear-gradient(90deg, transparent 0%, #000 34%); pointer-events: none; }
    .ah-wall i { display: block; aspect-ratio: 1; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
    .ah-wall img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .5s var(--ease); }
    .ah-wall img.on { opacity: 1; }
    .ah-wall i:nth-child(4n+2) { transform: translateY(-38px); } .ah-wall i:nth-child(4n+3) { transform: translateY(14px); } .ah-wall i:nth-child(4n) { transform: translateY(-16px); }
    .ah-hero-in { position: relative; max-width: 540px; min-width: 0; }
    .ah-kick { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--text-3); text-transform: uppercase; }
    .ah-title { font-size: clamp(36px, 5.4vw, 60px); font-weight: 850; letter-spacing: -.045em; line-height: .98; margin: 10px 0 12px; color: var(--text); }
    .ah-lede { font-size: 15px; line-height: 1.55; color: var(--text-2); margin: 0 0 22px; max-width: 460px; }
    .ah-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 18px; margin: 0 0 22px; }
    .ah-stat { display: block; border: 0; background: none; color: var(--text); font: inherit; text-align: left; padding: 6px 0; cursor: pointer; min-height: 44px; text-decoration: none; min-width: 0; }
    .ah-stat b { display: block; font-size: clamp(22px, 2.5vw, 29px); font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
    .ah-stat span { display: block; font-size: 12px; color: var(--text-3); font-weight: 650; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ah-stat:hover span { color: var(--text); }
    .ah-stat .wv-skel { height: 26px; width: 72%; margin-bottom: 6px; }
    .ah-acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .ah-acts .wv-btn-play { min-height: 44px; }
    .ah-q { position: relative; flex: 1 1 220px; max-width: 300px; margin: 0; }
    .ah-q svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
    .ah-q input { width: 100%; box-sizing: border-box; min-height: 44px; border-radius: 999px; border: 1px solid var(--hair-strong); background: var(--page-bg); color: var(--text); font: inherit; font-size: 14px; padding: 0 16px 0 38px; outline: none; }
    .ah-q input:focus-visible { border-color: var(--text-3); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent); }
    .ah-q input::placeholder { color: var(--text-3); }
    .ah-q input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    .ah-sec { margin-top: 36px; min-width: 0; }
    .ah-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
    .ah-h h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.025em; color: var(--text); }
    .ah-h p { margin: 3px 0 0; font-size: 12.5px; color: var(--text-3); }
    .ah-more { color: var(--text-2); font-size: 13px; font-weight: 750; padding: 10px 0; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; min-height: 40px; box-sizing: border-box; }
    .ah-more:hover { color: var(--text); text-decoration: underline; }
    .ah-two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
    .ah-card { background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 18px 20px 16px; min-width: 0; display: flex; flex-direction: column; }
    .ah-card .ah-h h3 { font-size: 17px; }
    .ah-feat { display: grid; grid-template-columns: 188px minmax(0, 1fr); gap: 20px; align-items: center; margin-bottom: 16px; }
    .ah-feat-art { position: relative; width: 188px; aspect-ratio: 1; border-radius: 12px; overflow: hidden; display: block; box-shadow: 0 10px 26px rgba(0,0,0,.28); }
    .ah-feat-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ah-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
    .ah-feat-t { display: block; font-size: 22px; font-weight: 850; letter-spacing: -.03em; line-height: 1.15; margin: 6px 0 4px; color: var(--text); text-decoration: none; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ah-feat-t:hover { text-decoration: underline; }
    .ah-feat-by { font-size: 13.5px; color: var(--text-2); }
    .ah-feat-by a { color: var(--text); font-weight: 700; text-decoration: none; }
    .ah-feat-by a:hover { text-decoration: underline; }
    .ah-feat-m { font-size: 12px; color: var(--text-3); margin-top: 3px; }
    .ah-feat-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .ah-feat-btns .wv-btn-play { min-height: 40px; padding: 0 18px; }
    .ah-ghost { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--hair-strong); background: transparent; color: var(--text); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; text-decoration: none; box-sizing: border-box; }
    .ah-ghost:hover { border-color: var(--text-3); background: var(--surface-2); }
    .ah-prev { display: flex; gap: 8px; margin-top: auto; overflow: hidden; padding-top: 14px; border-top: 1px solid var(--hair); align-items: center; }
    .ah-prev .ah-lbl { margin-right: 4px; flex: none; }
    .ah-prev a { flex: none; width: 44px; height: 44px; border-radius: 7px; overflow: hidden; position: relative; display: block; }
    .ah-prev a img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ah-prev a:hover { outline: 2px solid var(--text-3); outline-offset: 1px; }
    .ah-rank { display: grid; grid-template-columns: 20px 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 7px 8px; margin: 0 -8px; border-radius: 10px; text-decoration: none; color: var(--text); min-height: 44px; }
    .ah-rank:hover { background: var(--surface-2); }
    .ah-rank .n { font-size: 13px; font-weight: 800; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; }
    .ah-rank .c { width: 44px; height: 44px; border-radius: 6px; overflow: hidden; position: relative; }
    .ah-rank .c img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ah-rank b { display: block; font-size: 14px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ah-rank i { display: block; font-style: normal; font-size: 12px; color: var(--text-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ah-rank-ft { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .ah-rail { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; padding: 2px 2px 6px; margin: 0 -2px; }
    .ah-rail::-webkit-scrollbar { display: none; }
    .ah-rc { --rc: 164px; position: relative; flex: none; width: var(--rc); scroll-snap-align: start; min-width: 0; }
    .ah-rc > a { display: block; color: var(--text); text-decoration: none; border-radius: 12px; }
    .ah-cv { position: relative; width: var(--rc); height: var(--rc); border-radius: 10px; overflow: hidden; transition: transform .18s var(--ease); }
    .ah-cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ah-rc > a:hover .ah-cv { transform: translateY(-3px); }
    .ah-rc-t { font-size: 13.5px; font-weight: 750; margin-top: 9px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .ah-rc-s { font-size: 12px; color: var(--text-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ah-play { position: absolute; right: 8px; top: calc(var(--rc) - 52px); width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--brand); color: var(--on-brand, #14121c); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,.35); opacity: 0; transform: translateY(6px); transition: opacity .18s var(--ease), transform .18s var(--ease); }
    .ah-rc:hover .ah-play, .ah-play:focus-visible { opacity: 1; transform: none; }
    .ah-tag { position: absolute; top: 8px; left: 8px; z-index: 1; font-size: 10px; font-weight: 800; letter-spacing: .04em; background: rgba(0,0,0,.62); color: #fff; border-radius: 5px; padding: 2px 7px; }
    .ah-era .ah-cv { border-radius: 10px; }
    .ah-era .ah-cv::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.72)); }
    .ah-era-n { position: absolute; left: 10px; right: 10px; bottom: 9px; z-index: 1; color: #fff; font-size: 15px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ah-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 12px; padding: 1px; }
    .ah-chips::-webkit-scrollbar { display: none; }
    .ah-chip { flex: none; border: 1px solid var(--hair); background: var(--surface); color: var(--text-2); font: inherit; font-size: 13px; font-weight: 700; padding: 0 14px; min-height: 36px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .ah-chip:hover { color: var(--text); border-color: var(--hair-strong); }

// Play down the ranking in order. A short range plays every comp in full; the
// long ones would be thousands of tracks and a request per comp, so those take
// one track from each. The toast says which you got.
async function playTop(n) {
  if (!_topComps) return;
  var picks = (_topComps.items || []).filter(function (i) { return i.on_site && i.rank <= n; });
  if (!picks.length) { if (typeof wvToast === 'function') wvToast('nothing to play there yet'); return; }
  var whole = picks.length <= 10;
  if (typeof wvToast === 'function') {
    wvToast('loading ' + (whole ? 'the top ' + picks.length : 'one track from each of the top ' + picks.length) + '...');
  }

  // Eight at a time, so the long ranges do not hit the API all at once.
  var lists = new Array(picks.length);
  var next = 0;
  async function worker() {
    while (next < picks.length) {
      var i = next++;
      try {
        var rows = await api('/albums/' + picks[i].album_id + '/tracks');
        lists[i] = (rows || []).map(function (r) { return r.tracks || r; }).filter(function (t) { return t && t.ia_url; });
      } catch (e) { lists[i] = []; }
    }
  }
  await Promise.all(Array.from({ length: Math.min(8, picks.length) }, worker));

  var queue = [];
  lists.forEach(function (tracks, i) {
    if (!tracks || !tracks.length) return;
    var p = picks[i];
    var take = whole ? tracks : [tracks[Math.floor(Math.random() * tracks.length)]];
    take.forEach(function (t) {
      queue.push({
        id: t.id, title: t.title, ia_url: t.ia_url,
        cover_url: t.cover_url || p.cover_url || null,
        artist_name: p.creator || '',
        album_id: p.album_id, _album_id: p.album_id, _album_title: p.title,
        _album_cover: p.cover_url || null, _archive_artist: p.creator || null,
      });
    });
  });
  if (!queue.length) { if (typeof wvToast === 'function') wvToast('nothing in that range can play', 'error'); return; }
  setPlayerQueue(queue, 0);
  playQueueIndex(0);
  if (typeof wvToast === 'function') {
    wvToast(whole
      ? 'playing ' + queue.length + ' tracks from the top ' + picks.length
      : 'playing one track from each of ' + queue.length + ' comps');
  }
}

// The latest Yedits Edit of the Week, or this week's staff picks when there are any.
function ahParseDesc(desc) {
  var d = String(desc || ''), out = {};
  if (!d) return out;
  var w = d.match(/Edit\s+Of\s+The\s+Week\s*[:\-]?\s*`?\s*(Week\s*\d+|\d+|Finale)?/i);
  if (w && w[1]) out.w = /finale/i.test(w[1]) ? 'the finale' : 'week ' + parseInt(w[1].match(/\d+/)[0], 10);
  var v = d.match(/\*{0,2}(\d{1,3})%\*{0,2}\s*of\s*(?:the\s*)?votes/i);
  if (v && +v[1] > 0 && +v[1] <= 100) out.v = +v[1];
  var e = d.match(/\*\*Edit\*\*\s*-\s*\[(.+?)\]\(/i) || d.match(/\*\*Edit\*\*\s*-\s*([^\n]+)/i);
  if (e) out.s = e[1].replace(/[`*]/g, '').replace(/\s{2,}/g, ' ').trim();
  else {
    var lines = d.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i].replace(/^\s*(>|-#)\s*/, '').trim();
      if (!ln || /<@|Edit\s+Of\s+The|Editor|votes|https?:|Restored|^\*\*|^#/i.test(ln)) continue;
      var m = ln.match(/^(.+?)\s+-\s+(.+)$/) || ln.match(/^([^:]{2,80}):\s+(.+)$/);
      if (m) { out.o = m[1].replace(/[`*]/g, '').trim(); out.s = m[2].replace(/[`*]/g, '').replace(/\s{2,}/g, ' ').trim(); break; }
    }
  }
  return out;
}
function ahEotwTitle(t) {
  var s = ahT(t);
  if (/Edit\s+Of\s+The\s+(Week|Life)/i.test(s)) {
    s = s.replace(/^.*?Edit\s+Of\s+The\s+(Week|Life)\s*[:\-]?\s*/i, '');
    if (/^`?\s*(Week\s*\d+|\d+|Finale)?\s*`?\s*$/i.test(s)) s = '';
  }
  return s.replace(/^[\s<>*`]+|[\s<>*`]+$/g, '');
}
function ahEotw(h, live) {

      var lead = picks[0], a = lead.album;

      h.items[a.id] = a;
      ahEotwRender(h, {
        title: 'This week\'s picks', sub: wk ? 'week of ' + wk : 'picked by the wavernrs team',
        kick: lead.label || 'pick of the week', id: a.id, name: ahT(a.title), cover: a.cover_url, by: creator,
        meta: lead.note || '', prev: picks.slice(1).map(function (p) { return p.album; })
      });

    }

    var ids = (src === 'yedits' ? b.yedits_eotw_albums : b.onyx_week_albums) || [];
    if (!ids.length) return drop();

    Promise.all(chunks.map(function (c) {
      return api('/albums/batch/by-ids?ids=' + c.map(encodeURIComponent).join(',')).then(function (x) { return (x && x.items) || []; }).catch(function () { return []; });
    })).then(function (lists) {

      if (!all.length) return drop();

}
