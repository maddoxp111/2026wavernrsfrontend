<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — charts</title>
  <link rel="stylesheet" href="/css/style.css?v=202609060641">
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>
<script src="/js/api.js?v=202609060641"></script>
<script src="/js/layout.js?v=202609060641"></script>
<script src="/js/player.js?v=202609060641"></script>
<script src="/js/router.js?v=202609060641"></script>
<script src="/js/playlists.js?v=202609060641"></script>
<script>
var _chartsData = null;
var _minRatings = 5;
// Independent state per section.
var _sortAllTime = 'plays';   // plays | liked | ratings | score
var _sortWeekly  = 'plays';   // plays | liked
var _typeAllTime = 'edits';   // edits | comps
var _typeWeekly  = 'edits';   // edits | comps
initPlayer();

async function initCharts() {
  var view = document.getElementById('view');
  var seg =
    '.wv-seg{background:none;border:none;cursor:pointer;padding:5px 14px;border-radius:999px;' +
    'font-size:12.5px;font-weight:600;color:var(--text-2);transition:background 0.15s,color 0.15s;}' +
    '.wv-seg.is-active{background:var(--text);color:var(--page-bg-base);}';
  view.innerHTML =
    '<style>' + seg + '</style>' +
    '<div style="display:flex;flex-direction:column;gap:34px;">' +
      '<div>' +
        '<h1 class="wv-page-title">Charts</h1>' +
        '<div style="font-size:15px;font-weight:600;color:var(--text-2);margin-top:4px;">The best of Wavernrs, ranked.</div>' +
      '</div>' +

      // ── All Time ──
      '<div>' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;">' +
          '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
            '<h2 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em;">All Time</h2>' +
            '<div style="display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px;" id="alltime-types">' +
              '<button class="wv-seg is-active" onclick="setType(\'alltime\',\'edits\')">Edits</button>' +
              '<button class="wv-seg" onclick="setType(\'alltime\',\'comps\')">Comps</button>' +
              '<button class="wv-seg" onclick="setType(\'alltime\',\'archive\')">Archive</button>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;" id="alltime-sorts">' +
            '<button class="wv-pill is-active" style="padding:6px 14px;font-size:12.5px;" onclick="setSort(\'alltime\',\'plays\')">Most Streams</button>' +
            '<button class="wv-pill" style="padding:6px 14px;font-size:12.5px;" onclick="setSort(\'alltime\',\'liked\')">Most Liked</button>' +
            '<button class="wv-pill" style="padding:6px 14px;font-size:12.5px;" onclick="setSort(\'alltime\',\'ratings\')">Top Rated</button>' +
            '<button class="wv-pill" style="padding:6px 14px;font-size:12.5px;" onclick="setSort(\'alltime\',\'score\')">Wavernrs Score</button>' +
          '</div>' +
        '</div>' +
        '<div id="alltime-body"><div class="loading"><div class="spinner"></div></div></div>' +
      '</div>' +

      // ── This Week ──
      '<div>' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;">' +
          '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
            '<h2 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em;">This Week</h2>' +
            '<div style="display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px;" id="weekly-types">' +
              '<button class="wv-seg is-active" onclick="setType(\'weekly\',\'edits\')">Edits</button>' +
              '<button class="wv-seg" onclick="setType(\'weekly\',\'comps\')">Comps</button>' +
              '<button class="wv-seg" onclick="setType(\'weekly\',\'archive\')">Archive</button>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;" id="weekly-sorts">' +
            '<button class="wv-pill is-active" style="padding:6px 14px;font-size:12.5px;" onclick="setSort(\'weekly\',\'plays\')">Most Streams</button>' +
            '<button class="wv-pill" style="padding:6px 14px;font-size:12.5px;" onclick="setSort(\'weekly\',\'liked\')">Most Liked</button>' +
          '</div>' +
        '</div>' +
        '<div id="weekly-body"><div class="loading"><div class="spinner"></div></div></div>' +
      '</div>' +
    '</div>';
  loadCharts();
}

function setType(section, type) {
  if (section === 'alltime') _typeAllTime = type; else _typeWeekly = type;
  var container = document.getElementById(section + '-types');
  if (container) {
    container.querySelectorAll('.wv-seg').forEach(function(btn) {
      btn.classList.toggle('is-active', btn.getAttribute('onclick').indexOf("'" + type + "'") !== -1);
    });
  }
  renderSection(section);
}

function setSort(section, sort) {
  if (section === 'alltime') _sortAllTime = sort; else _sortWeekly = sort;
  var container = document.getElementById(section + '-sorts');
  if (container) {
    container.querySelectorAll('.wv-pill').forEach(function(btn) {
      btn.classList.toggle('is-active', btn.getAttribute('onclick').indexOf("'" + sort + "'") !== -1);
    });
  }
  renderSection(section);
}

async function loadCharts() {
  try {
    _chartsData = await api('/charts');
    if (typeof _chartsData.min_ratings === 'number') _minRatings = _chartsData.min_ratings;
    renderSection('alltime');
    renderSection('weekly');
  } catch (err) {
    document.getElementById('alltime-body').innerHTML = '<div class="wv-empty">Failed: ' + escHtml(err.message) + '</div>';
    document.getElementById('weekly-body').innerHTML = '';
  }
}

// Sort + filter a list per section/sort, returning the top 20.
function _rankList(list, sort) {
  var arr = (list || []).slice();
  if (sort === 'liked') {
    arr.sort(function(a, b) { return (b.like_count||0) - (a.like_count||0); });
  } else if (sort === 'ratings') {
    // Only tracks with at least the minimum number of ratings qualify.
    arr = arr.filter(function(t) { return (t.rating_count||0) >= _minRatings; });
    arr.sort(function(a, b) {
      if ((b.rating_avg||0) !== (a.rating_avg||0)) return (b.rating_avg||0) - (a.rating_avg||0);
      return (b.rating_count||0) - (a.rating_count||0);
    });
  } else if (sort === 'score') {
    arr.sort(function(a, b) { return (b.wavernrs_score||0) - (a.wavernrs_score||0); });
  } else {
    arr.sort(function(a, b) { return (b.play_count||0) - (a.play_count||0); });
  }
  return arr.slice(0, 20);
}

function _metricCell(t, sort) {
  if (sort === 'liked') return (t.like_count||0).toLocaleString();
  if (sort === 'ratings') {
    return '<span style="color:var(--orange);">★</span> ' + (t.rating_avg!=null ? t.rating_avg : '–') +
      ' <span style="color:var(--text-3);font-size:12px;">(' + (t.rating_count||0) + ')</span>';
  }
  if (sort === 'score') {
    return '<span style="font-weight:700;color:var(--text);">' + (t.wavernrs_score||0) + '</span>' +
      '<span style="color:var(--text-3);font-size:11px;"> /100</span>';
  }
  return (t.play_count||0).toLocaleString();
}

function _metricLabel(sort) {
  if (sort === 'liked') return 'Likes';
  if (sort === 'ratings') return 'Rating';
  if (sort === 'score') return 'Score';
  return 'Streams';
}

function renderSection(section) {
  if (!_chartsData) return;
  var body = document.getElementById(section + '-body');
  if (!body) return;

  var sort = section === 'alltime' ? _sortAllTime : _sortWeekly;
  var type = section === 'alltime' ? _typeAllTime : _typeWeekly;
  var universe = _chartsData[type] || { alltime: [], weekly: [] };
  var src  = section === 'alltime' ? universe.alltime : universe.weekly;
  var list = _rankList(src, sort);
  var noun = type === 'comps' ? 'comps' : type === 'archive' ? 'archive comps' : 'edits';
  var destPage = (type === 'comps' || type === 'archive') ? '/album.html?id=' : '/track.html?id=';

  // The page background mirrors the #1 all-time release on the selected tab
  // (edits/comps). The weekly section never drives the background.
  if (section === 'alltime' && typeof window.setPageBgImage === 'function') {
    window.setPageBgImage(list.length && list[0].cover_url ? list[0].cover_url : '');
  }

  if (!list.length) {
    if (sort === 'ratings') {
      body.innerHTML = '<div class="wv-empty">No ' + noun + ' with at least ' + _minRatings + ' ratings yet.</div>';
    } else {
      body.innerHTML = '<div class="wv-empty">No ' + noun + ' yet</div>';
    }
    return;
  }

  var header = '<div style="display:grid;grid-template-columns:30px 1fr 150px;gap:16px;padding:10px 16px;font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:0.04em;">' +
    '<div>#</div><div>Title</div><div style="text-align:right;">' + _metricLabel(sort) + '</div>' +
    '</div>';

  var rows = list.map(function(t, i) {
    var seed = t.title || '', artist = t.artists ? t.artists.display_name : 'Unknown';
    var bg = coverGradient(seed);
    return '<div class="wv-chart-row" style="grid-template-columns:30px 1fr 150px;" onclick="navigate(\'' + destPage + t.id + '\')">' +
      '<div style="font-size:14px;color:var(--text-3);">' + (i+1) + '</div>' +
      '<div style="display:flex;align-items:center;gap:14px;min-width:0;">' +
        '<div style="width:44px;height:44px;border-radius:8px;background:' + bg + ';position:relative;overflow:hidden;flex-shrink:0;">' +
          '' +
          (t.cover_url ? '<img src="' + escHtml(t.cover_url) + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.style.opacity=0">' : '') +
        '</div>' +
        '<div style="min-width:0;">' +
          '<div style="font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.01em;">' + escHtml(t.title) + '</div>' +
          '<div style="font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(artist) + '</div>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:13.5px;color:var(--text-2);text-align:right;">' + _metricCell(t, sort) + '</div>' +
    '</div>';
  }).join('');

  body.innerHTML = '<div style="display:flex;flex-direction:column;gap:2px;margin-top:4px;">' + header + rows + '</div>';
}

initCharts();
</script>
</body>
</html>
