<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — charts</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="view">
  <div class="scroll-section-title" style="margin-bottom:4px;">Charts</div>
  <div style="color:var(--text-2);font-size:13px;margin-bottom:20px;">Top tracks on Wavernrs</div>

  <div class="wv-tabs">
    <button class="wv-tab active" id="tab-alltime" onclick="setTab('alltime')">All Time</button>
    <button class="wv-tab" id="tab-weekly" onclick="setTab('weekly')">This Week</button>
    <button class="wv-tab" id="tab-liked" onclick="setTab('liked')">Most Liked</button>
  </div>

  <div id="charts-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  initPlayer();
  var activeTab = 'alltime';
  var chartData = null;
  function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function setTab(tab) {
    activeTab = tab;
    ['alltime','weekly','liked'].forEach(t => document.getElementById('tab-'+t).classList.toggle('active', t===tab));
    if (chartData) renderChart();
  }
  async function loadCharts() {
    const el = document.getElementById('charts-container');
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      chartData = await api('/charts');
      renderChart();
    } catch (err) {
      el.innerHTML = '<div class="wv-empty">Failed to load: '+escHtml(err.message)+'</div>';
    }
  }
  function renderChart() {
    const el = document.getElementById('charts-container');
    const tracks = chartData[activeTab] || [];
    if (!tracks.length) { el.innerHTML = '<div class="wv-empty">&#x1F4CA;<br><br>No chart data yet</div>'; return; }
    const statLabel = activeTab === 'liked' ? t => fmtNum(t.like_count||0)+' likes' : t => fmtNum(t.play_count||0)+' plays';
    el.innerHTML = tracks.map((t,i) => {
      const cover = t.cover_url ? '<img src="'+t.cover_url+'" alt="" style="width:100%;height:100%;object-fit:cover;">' : '<span style="font-size:18px;">&#x1F3B5;</span>';
      return '<div class="wv-track-row" onclick="navigate(\'/track.html?id='+t.id+'\')">'+
        '<div class="wv-rank-num'+(i<3?' top3':'')+'">'+( i+1)+'</div>'+
        '<div class="wv-track-cover" style="display:flex;align-items:center;justify-content:center;">'+cover+'</div>'+
        '<div class="wv-track-info"><div class="wv-track-title">'+escHtml(t.title)+'</div><div class="wv-track-artist">'+escHtml(t.artists?.display_name||'Unknown')+'</div></div>'+
        '<div class="wv-track-stat">'+statLabel(t)+'</div>'+
        '<button class="wv-pill" style="padding:6px 12px;font-size:12px;" onclick="event.stopPropagation();playThis('+JSON.stringify(t).replace(/"/g,'&quot;')+')">&#x25B6; Play</button>'+
        '</div>';
    }).join('');
  }
  function playThis(track) { playTrack({...track, artist_name: track.artists?.display_name}); }
  loadCharts();
</script>
</body>
</html>
