<div id="view">

  <div class="page-header" style="padding-bottom:20px;">
    <h1 class="page-title">Charts</h1>
  </div>

  <div class="tabs" style="margin-bottom:28px;">
    <button class="tab active" id="tab-alltime" onclick="setTab('alltime')">All Time</button>
    <button class="tab" id="tab-weekly" onclick="setTab('weekly')">This Week</button>
    <button class="tab" id="tab-liked" onclick="setTab('liked')">Most Liked</button>
  </div>

  <div id="charts-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>

</div>
</div><!-- /view -->

<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  updateNav();
  initPlayer();

  var activeTab = 'alltime';
  var chartData = null;

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setTab(tab) {
    activeTab = tab;
    document.getElementById('tab-alltime').classList.toggle('active', tab === 'alltime');
    document.getElementById('tab-weekly').classList.toggle('active', tab === 'weekly');
    document.getElementById('tab-liked').classList.toggle('active', tab === 'liked');
    if (chartData) renderChart();
  }

  async function loadCharts() {
    const el = document.getElementById('charts-container');
    el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      chartData = await api('/charts');
      renderChart();
    } catch (err) {
      el.innerHTML = `<div class="empty-state"><div class="empty-title">Failed to load</div><div class="empty-desc">${escHtml(err.message)}</div></div>`;
    }
  }

  function renderChart() {
    const el = document.getElementById('charts-container');
    const tracks = chartData[activeTab] || [];

    if (!tracks.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No data yet</div><div class="empty-desc">Play some tracks to build the charts.</div></div>`;
      return;
    }

    const statLabel = activeTab === 'liked'
      ? t => `${fmtNum(t.like_count || 0)} likes`
      : t => `${fmtNum(t.play_count || 0)} plays`;

    el.innerHTML = `<div class="track-list">` + tracks.map((t, i) => {
      const cover = t.cover_url ? `<img src="${t.cover_url}" alt="">` : '🎵';
      return `
        <div class="track-row" onclick="navigate('/track.html?id=${t.id}')" style="cursor:pointer;">
          <div class="track-row-num" style="font-size:15px;font-weight:700;min-width:28px;color:${i < 3 ? 'var(--purple-light)' : 'var(--text-tertiary)'};">${i + 1}</div>
          <div class="track-row-cover">${cover}</div>
          <div class="track-row-info">
            <div class="track-row-title">${escHtml(t.title)}</div>
            <div class="track-row-artist">${escHtml(t.artists?.display_name || 'Unknown')}</div>
          </div>
          <span class="track-row-plays">${statLabel(t)}</span>
          <button class="play-btn-overlay" style="position:relative;transform:none;opacity:1;background:var(--purple-bg);border-radius:50%;width:36px;height:36px;"
            onclick="event.stopPropagation();playThis(${JSON.stringify(t).replace(/"/g,'&quot;')})">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--purple)"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>`;
    }).join('') + `</div>`;
  }

  function playThis(track) {
    playTrack({ ...track, artist_name: track.artists?.display_name });
  }

  loadCharts();
</script>
</body>
</html>
