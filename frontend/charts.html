<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — charts</title>
  <link rel="stylesheet" href="/css/style.css?v=7e15436c9bbe">
  <script src="/js/status-card.js?v=7e15436c9bbe"></script>
  <script src="/js/down.js?v=7e15436c9bbe"></script>
  <style>
    .ch-wrap { container-type: inline-size; container-name: ch; display: flex; flex-direction: column; min-width: 0; }
    .ch-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .ch-head .wv-page-title { margin: 6px 0 4px; }
    .ch-sub { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--text-2); }
    .ch-share {
      display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px;
      border-radius: var(--r-pill); border: 1px solid var(--hair-strong); background: transparent;
      color: var(--text); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0;
      transition: border-color 140ms var(--ease), background 140ms var(--ease), transform 100ms var(--ease);
    }
    .ch-share:hover { border-color: var(--text); }
    .ch-share:active { transform: scale(.97); }
    .ch-share.is-done { border-color: var(--green); color: var(--green); }

    .ch-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hair); margin-bottom: 22px; overflow-x: auto; scrollbar-width: none; }
    .ch-tabs::-webkit-scrollbar { display: none; }
    .ch-tab {
      position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px;
      background: none; border: 0; color: var(--text-3); font: inherit; font-size: 15px; font-weight: 700;
      letter-spacing: -.01em; cursor: pointer; white-space: nowrap; transition: color 140ms var(--ease);
    }
    .ch-tab:hover { color: var(--text-2); }
    .ch-tab[aria-selected="true"] { color: var(--text); }
    .ch-tab[aria-selected="true"]::after {
      content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px;
      border-radius: 3px 3px 0 0; background: var(--brand);
    }
    .ch-tab svg { flex-shrink: 0; }
    .ch-tab[data-tab="hot"][aria-selected="true"] svg { color: var(--brand); }
    .ch-tab[hidden] { display: none; }

    .ch-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 8px; }
    .ch-seg { display: inline-flex; background: var(--glass-pill-bg); border-radius: var(--r-pill); padding: 3px; }
    .ch-seg button {
      font: inherit; font-size: 12.5px; font-weight: 700; border: 0; cursor: pointer; min-height: 34px;
      padding: 0 15px; border-radius: var(--r-pill); background: transparent; color: var(--text-2);
      transition: background 140ms var(--ease), color 140ms var(--ease);
    }
    .ch-seg button[aria-pressed="true"] { background: var(--text); color: var(--page-bg-base); }
    .ch-sorts { display: flex; gap: 6px; flex-wrap: wrap; }
    .ch-sorts .wv-pill { padding: 0 14px; min-height: 34px; font-size: 12.5px; }
    .ch-note { font-size: 12px; color: var(--text-3); margin: 2px 0 6px; min-height: 16px; }

    .ch-hero {
      position: relative; display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 26px; align-items: center;
      padding: 24px; border-radius: 12px; border: 1px solid var(--hair);
      background: linear-gradient(125deg, color-mix(in srgb, var(--wv-wash) 78%, var(--surface)) 0%, var(--surface) 72%);
      overflow: hidden; transition: background 500ms var(--ease);
    }
    .ch-hero-art {
      position: relative; width: 196px; aspect-ratio: 1; border-radius: 8px; overflow: hidden; display: block;
      box-shadow: 0 18px 40px rgba(0,0,0,.38); flex-shrink: 0;
    }
    .theme-light .ch-hero-art { box-shadow: 0 14px 34px rgba(0,0,0,.18); }
    .ch-hero-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ch-hero-body { min-width: 0; display: flex; flex-direction: column; }
    .ch-kicker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--text-2); }
    .ch-no1 { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 7px; border-radius: var(--r-pill); background: var(--brand); color: var(--on-brand); letter-spacing: .06em; }
    .ch-hero-title { margin: 10px 0 6px; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.04; font-weight: 850; letter-spacing: -.035em; text-wrap: balance; overflow-wrap: anywhere; }
    .ch-hero-title a { color: inherit; text-decoration: none; }
    .ch-hero-title a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .ch-hero-by { font-size: 14px; color: var(--text-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-hero-by a { color: var(--text); text-decoration: none; }
    .ch-hero-by a:hover { text-decoration: underline; }
    .ch-stats { display: flex; gap: 28px; margin-top: 18px; flex-wrap: wrap; }
    .ch-stat b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .ch-stat span { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-3); margin-top: 3px; }
    .ch-stat .up { color: var(--green); }
    .ch-stat .down { color: var(--red); }
    .ch-hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .ch-hero-actions button { min-height: 42px; }
    .ch-hero-actions button[disabled] { opacity: .65; cursor: progress; }
    .ch-graph { grid-column: 1 / -1; min-width: 0; }
    .ch-graph-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
    .ch-graph svg { display: block; width: 100%; height: 72px; overflow: visible; }
    .ch-graph-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
    .ch-legend { display: inline-flex; gap: 12px; align-items: center; }
    .ch-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -0px; }
    .ch-bar-prev { fill: var(--text-3); opacity: .38; }
    .ch-bar-cur { fill: var(--brand); }
    .ch-bar-today { fill: var(--brand); opacity: .55; }

    @container ch (min-width: 900px) {
      .ch-hero { grid-template-columns: 208px minmax(0, 1fr) minmax(220px, 280px); gap: 28px; padding: 26px 28px; }
      .ch-hero-art { width: 208px; }
      .ch-graph { grid-column: auto; align-self: end; padding-bottom: 4px; }
      .ch-graph svg { height: 96px; }
    }

    .ch-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--text-3); margin: 14px 2px 18px; }
    .ch-meta b { color: var(--text-2); font-weight: 700; font-variant-numeric: tabular-nums; }
    .ch-live { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; color: var(--text-2); }
    .ch-live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }

    .ch-list { display: flex; flex-direction: column; gap: 2px; }
    .ch-colhead {
      display: grid; gap: 16px; padding: 0 16px 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--hair); margin-bottom: 4px;
    }
    .ch-colhead .r { text-align: right; }
    .ch-grid-hot { grid-template-columns: 52px minmax(0, 1fr) 132px 96px; }
    .ch-lw { display: none; text-align: center; font-size: 13px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }
    @container ch (min-width: 900px) {
      .ch-grid-hot { grid-template-columns: 52px minmax(0, 1fr) 64px 132px 96px; }
      .ch-lw { display: block; }
    }
    .ch-grid-std { grid-template-columns: 44px minmax(0, 1fr) 150px; }
    .ch-row { padding: 8px 16px; min-height: 64px; outline-offset: -2px; }
    .ch-row:focus-visible { outline: 2px solid var(--text); }
    .ch-rank { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
    .ch-num { font-size: 17px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; }
    .ch-grid-std .ch-num { font-size: 15px; font-weight: 700; color: var(--text-2); }
    .ch-grid-std .ch-row.top .ch-num, .ch-grid-std.top .ch-num { color: var(--text); }
    .ch-move { display: inline-flex; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ch-move.up { color: var(--green); }
    .ch-move.down { color: var(--red); }
    .ch-move.same { color: var(--text-3); }
    .ch-move.new { padding: 3px 6px; border-radius: var(--r-pill); background: var(--brand-bg); color: var(--brand); letter-spacing: .05em; font-size: 9.5px; }
    .theme-light .ch-move.new { color: var(--brand-text); }
    .ch-move svg { width: 8px; height: 8px; }
    .ch-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .ch-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .ch-cover { width: 48px; height: 48px; border-radius: 6px; position: relative; overflow: hidden; flex-shrink: 0; }
    .ch-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ch-cover .wv-chart-play { width: 100%; height: 100%; }
    .ch-text { min-width: 0; }
    .ch-t { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .ch-s { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .ch-s a { color: inherit; text-decoration: none; }
    .ch-s a:hover { color: var(--text); text-decoration: underline; }
    .ch-tag { display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); border: 1px solid var(--hair-strong); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
    .ch-spark svg { display: block; width: 100%; height: 34px; overflow: visible; }
    .ch-metric { text-align: right; min-width: 0; font-variant-numeric: tabular-nums; }
    .ch-metric b { display: block; font-size: 14.5px; font-weight: 750; color: var(--text); letter-spacing: -.01em; white-space: nowrap; }
    .ch-metric span { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-metric b span { display: inline; margin: 0; font-size: inherit; color: inherit; }
    .ch-metric b .star { color: var(--orange); }
    .ch-metric b .of { font-size: 11px; color: var(--text-3); font-weight: 600; }
    .ch-line-prev { fill: none; stroke: var(--text-3); stroke-width: 1.5; opacity: .5; stroke-linejoin: round; stroke-linecap: round; }
    .ch-line-cur { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .ch-area { fill: var(--brand); opacity: .14; }
    .ch-dot { fill: var(--brand); }

    .ch-more-wrap { display: flex; justify-content: center; margin-top: 14px; }
    .ch-more {
      display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 22px; border-radius: var(--r-pill);
      border: 1px solid var(--hair-strong); background: transparent; color: var(--text); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .ch-more:hover { border-color: var(--text); }
    .ch-more svg { transition: transform 200ms var(--ease); }
    .ch-more[aria-expanded="true"] svg { transform: rotate(180deg); }

    .ch-skel-hero { display: grid; grid-template-columns: 196px 1fr; gap: 26px; padding: 24px; border-radius: 12px; border: 1px solid var(--hair); background: var(--surface); }
    .ch-skel-hero .art { width: 196px; aspect-ratio: 1; border-radius: 8px; }
    .ch-skel-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 90px; gap: 16px; align-items: center; padding: 8px 16px; min-height: 64px; }
    .ch-skel-row .n { width: 18px; height: 16px; margin: 0 auto; }
    .ch-skel-row .c { display: flex; gap: 14px; align-items: center; }
    .ch-skel-row .a { width: 48px; height: 48px; border-radius: 6px; flex-shrink: 0; }
    .ch-skel-row .l { height: 12px; border-radius: 4px; }
    .ch-empty { padding: 56px 20px; text-align: center; color: var(--text-3); font-size: 14.5px; }
    .ch-empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

    .ch-anim .ch-row { animation: ch-in 360ms var(--ease) both; }
    @keyframes ch-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .ch-anim .ch-row { animation: none; }
      .ch-hero, .ch-more svg, .ch-tab, .ch-seg button { transition: none; }
    }

    @media (max-width: 640px) {
      .ch-head { align-items: center; margin-bottom: 12px; }
      .ch-sub { font-size: 13.5px; }
      .ch-share { width: 40px; padding: 0; justify-content: center; }
      .ch-share .lbl { display: none; }
      .ch-tabs { margin: 0 -16px 18px; padding: 0 8px; }
      .ch-tab { font-size: 14px; padding: 0 11px; }
      .ch-seg button, .ch-sorts .wv-pill { min-height: 40px; }
      .ch-controls { gap: 10px; }
      .ch-sorts { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; width: calc(100% + 32px); }
      .ch-sorts::-webkit-scrollbar { display: none; }
      .ch-sorts { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); padding-right: 36px; }
    }
    @container ch (max-width: 600px) {
      .ch-hero { grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
      .ch-hero-art { width: 112px; }
      .ch-hero-title { font-size: 24px; margin: 8px 0 4px; }
      .ch-hero-by { font-size: 13px; }
      .ch-stats, .ch-hero-actions { grid-column: 1 / -1; }
      .ch-stats { gap: 0; margin-top: 2px; justify-content: space-between; }
      .ch-stat b { font-size: 19px; }
      .ch-hero-actions { margin-top: 0; }
      .ch-hero-actions button { flex: 1; justify-content: center; padding-left: 12px; padding-right: 12px; }
      .ch-hero-body { display: contents; }
      .ch-hero-id { min-width: 0; align-self: center; }
      .ch-graph svg { height: 64px; }
      .ch-grid-hot, .ch-grid-std { grid-template-columns: 34px minmax(0, 1fr) 64px; gap: 10px; }
      .ch-spark, .ch-colhead .sp { display: none; }
      .ch-row, .ch-colhead { padding-left: 6px; padding-right: 6px; }
      .ch-main { gap: 11px; }
      .ch-cover { width: 44px; height: 44px; }
      .ch-t { font-size: 14px; }
      .ch-metric b { font-size: 13.5px; }
      .ch-metric span { font-size: 10.5px; }
      .ch-skel-hero { grid-template-columns: 112px 1fr; padding: 16px; gap: 16px; }
      .ch-skel-hero .art { width: 112px; }
      .ch-skel-row { grid-template-columns: 34px minmax(0, 1fr) 56px; gap: 10px; padding: 8px 6px; }
    }
    @container ch (min-width: 440px) and (max-width: 600px) {
      .ch-hero { grid-template-columns: 144px minmax(0, 1fr); gap: 20px; padding: 20px; }
      .ch-hero-art, .ch-skel-hero .art { width: 144px; }
      .ch-hero-title { font-size: 28px; }
      .ch-hero-actions button { flex: 0 1 auto; }
    }
  </style>
</head>
<body>
<div id="view">
  <div class="loading"><div class="spinner"></div></div>
</div>
<script src="/js/api.js?v=7e15436c9bbe"></script>
<script src="/js/layout.js?v=7e15436c9bbe"></script>
<script src="/js/player.js?v=7e15436c9bbe"></script>
<script src="/js/router.js?v=7e15436c9bbe"></script>
<script src="/js/playlists.js?v=7e15436c9bbe"></script>
<script>
var CH_TABS = ['hot', 'alltime', 'new'];
var CH_TYPES = ['edits', 'comps', 'archive'];
var CH_SORTS = { alltime: ['plays', 'liked', 'ratings', 'score'], 'new': ['plays', 'liked'] };
var CH_SORT_LABELS = { plays: 'Most streams', liked: 'Most liked', ratings: 'Top rated', score: 'Wavernrs score' };
var CH_TYPE_LABELS = { edits: 'Edits', comps: 'Comps', archive: 'Archive' };
var CH_PAGE = 20, CH_MAX = 50;
var _ch = window._ch = {
  tab: 'hot', hot: null, hotState: 'loading', charts: null, chartsState: 'idle', chartsWait: null,
  minRatings: 5, type: { alltime: 'edits', 'new': 'edits' }, sort: { alltime: 'plays', 'new': 'plays' },
  expanded: { hot: false, alltime: false, 'new': false }, queues: { alltime: [], 'new': [] }, lists: {}, animate: true
};
initPlayer();

function chEsc(s) { return typeof escHtml === 'function' ? escHtml(s == null ? '' : String(s)) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function chNum(n) { return (Number(n) || 0).toLocaleString('en-US'); }
function chIcon(name, size) {
  var s = size || 16;
  var p = {
    flame: '<path d="M12 2.5c.6 3.1-1 5-2.6 6.8C7.9 11 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-1-3.9-2.2-5.2-.2 1.3-.9 2.3-1.9 2.8.4-3.4-.4-7.2-1.4-10.1Z" fill="currentColor"/>',
    play: '<path d="M7.5 4.9 19 12 7.5 19.1Z" fill="currentColor"/>',
    list: '<path d="M4 6h11M4 12h11M4 18h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M17 13.5v7l5-3.5z" fill="currentColor"/>',
    link: '<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4L12 18.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>',
    check: '<path d="m5 12.5 4.2 4.2L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
    chev: '<path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
    up: '<path d="M12 5 21 19H3Z" fill="currentColor"/>',
    down: '<path d="M12 19 3 5h18Z" fill="currentColor"/>',
    crown: '<path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 11H5Z" fill="currentColor"/>'
  }[name] || '';
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
}

function chReadUrl() {
  var q = new URLSearchParams(location.search);
  var tab = (q.get('tab') || '').toLowerCase();
  if (tab === 'week' || tab === 'weekly') tab = 'new';
  if (tab === 'all' || tab === 'all-time') tab = 'alltime';
  _ch.tab = CH_TABS.indexOf(tab) >= 0 ? tab : 'hot';
  _ch.urlTab = CH_TABS.indexOf(tab) >= 0;
  if (_ch.tab !== 'hot') {
    var type = (q.get('type') || '').toLowerCase();
    var sort = (q.get('sort') || '').toLowerCase();
    if (sort === 'streams') sort = 'plays';
    if (sort === 'rated' || sort === 'rating') sort = 'ratings';
    if (CH_TYPES.indexOf(type) >= 0) _ch.type[_ch.tab] = type;
    if (CH_SORTS[_ch.tab].indexOf(sort) >= 0) _ch.sort[_ch.tab] = sort;
  }
}

function chUrl() {
  var q = new URLSearchParams();
  q.set('tab', _ch.tab);
  if (_ch.tab !== 'hot') {
    q.set('type', _ch.type[_ch.tab]);
    q.set('sort', _ch.sort[_ch.tab]);
  }
  return '/charts?' + q.toString();
}

function chWriteUrl() {
  try {
    var next = chUrl();
    if (location.pathname + location.search !== next) history.replaceState(history.state, '', next);
  } catch (_) {}
}

function initCharts() {
  var view = document.getElementById('view');
  if (!view) return;
  chReadUrl();
  view.innerHTML =
    '<div class="ch-wrap" id="ch-root">' +
      '<div class="ch-head">' +
        '<div style="min-width:0;">' +
          '<h1 class="wv-page-title">Charts</h1>' +
          '<p class="ch-sub">what wavernrs is actually listening to, ranked</p>' +
        '</div>' +
        '<button class="ch-share" id="ch-share" type="button" data-act="share" aria-label="Copy a link to this chart">' + chIcon('link', 16) + '<span class="lbl">Copy link</span></button>' +
      '</div>' +
      '<div class="ch-tabs" role="tablist" aria-label="Chart" id="ch-tabs">' +
        '<button class="ch-tab" role="tab" type="button" id="ch-tab-hot" data-tab="hot" aria-controls="ch-panel">' + chIcon('flame', 16) + 'Hot 50</button>' +
        '<button class="ch-tab" role="tab" type="button" id="ch-tab-alltime" data-tab="alltime" aria-controls="ch-panel">All time</button>' +
        '<button class="ch-tab" role="tab" type="button" id="ch-tab-new" data-tab="new" aria-controls="ch-panel">New this week</button>' +
      '</div>' +

    if ((window._wvNavGen || 0) !== gen) return;
    var queue = results.filter(Boolean);
    if (!queue.length) { if (typeof wvToast === 'function') wvToast('nothing on the chart can play right now', 'error'); return; }
    setPlayerQueue(queue, 0);
    playQueueIndex(0);
    if (typeof wvToast === 'function') wvToast('playing the top track from ' + queue.length + ' releases on the chart');
  });
}

function chRankList(list, sort) {
  var arr = (list || []).slice();
  if (sort === 'liked') {
    arr.sort(function (a, b) { return (b.like_count || 0) - (a.like_count || 0) || (b.play_count || 0) - (a.play_count || 0); });
  } else if (sort === 'ratings') {
    arr = arr.filter(function (t) { return (t.rating_count || 0) >= _ch.minRatings; });
    arr.sort(function (a, b) {
      var wa = a.rating_weighted != null ? a.rating_weighted : (a.rating_avg || 0);
      var wb = b.rating_weighted != null ? b.rating_weighted : (b.rating_avg || 0);
      return (wb - wa) || ((b.rating_avg || 0) - (a.rating_avg || 0)) || ((b.rating_count || 0) - (a.rating_count || 0));
    });
  } else if (sort === 'score') {
    arr.sort(function (a, b) { return (b.wavernrs_score || 0) - (a.wavernrs_score || 0) || (b.play_count || 0) - (a.play_count || 0); });
  } else {
    arr.sort(function (a, b) { return (b.play_count || 0) - (a.play_count || 0); });
  }
  return arr.slice(0, CH_MAX);
}

function chMetric(t, sort) {
  if (sort === 'liked') return '<b>' + chNum(t.like_count) + '</b><span>' + chNum(t.play_count) + ' streams</span>';
  if (sort === 'ratings') return '<b><span class="star">★</span> ' + (t.rating_avg != null ? Number(t.rating_avg).toFixed(1) : '–') + '</b><span>' + chNum(t.rating_count) + ' ratings</span>';
  if (sort === 'score') return '<b>' + chNum(t.wavernrs_score) + '<span class="of"> /100</span></b><span>' + chNum(t.play_count) + ' streams</span>';
  return '<b>' + chNum(t.play_count) + '</b><span>' + (t.like_count ? chNum(t.like_count) + (t.like_count === 1 ? ' like' : ' likes') : '&nbsp;') + '</span>';
}

function chMetricLabel(sort) {
  if (sort === 'liked') return 'Likes';
  if (sort === 'ratings') return 'Rating';
  if (sort === 'score') return 'Score';
  return 'Streams';
}

function chNote(tab, sort, list) {
  if (tab === 'new') return 'released in the last 7 days';
  if (sort === 'ratings') {
    var weighted = (list || []).some(function (t) { return t.rating_weighted != null; });
    return (weighted ? 'weighted average so a couple of 5s cant jump the queue · ' : '') + 'min ' + _ch.minRatings + ' ratings';
  }
  if (sort === 'score') return 'blend of rating (50%), streams (30%) and like rate (20%)';
  return '';
}

function chRenderStd(panel, tab) {
  var type = _ch.type[tab], sort = _ch.sort[tab];
  var universe = (_ch.charts && _ch.charts[type]) || { alltime: [], weekly: [] };
  var src = (tab === 'alltime' ? universe.alltime : universe.weekly) || [];
  var controls =
    '<div class="ch-controls">' +
      '<div class="ch-seg" role="group" aria-label="Type">' +
        CH_TYPES.map(function (t) { return '<button type="button" data-act="type" data-v="' + t + '" aria-pressed="' + (t === type ? 'true' : 'false') + '">' + CH_TYPE_LABELS[t] + '</button>'; }).join('') +
      '</div>' +
      '<div class="ch-sorts" role="group" aria-label="Sort">' +
        CH_SORTS[tab].map(function (s) { return '<button type="button" class="wv-pill' + (s === sort ? ' is-active' : '') + '" data-act="sort" data-v="' + s + '" aria-pressed="' + (s === sort ? 'true' : 'false') + '">' + CH_SORT_LABELS[s] + '</button>'; }).join('') +
      '</div>' +
    '</div>' +
    '<div class="ch-note">' + chEsc(chNote(tab, sort, src)) + '</div>';

  if (_ch.chartsState !== 'ok') {
    if (_ch.chartsState === 'error') {
      panel.innerHTML = controls + '<div id="ch-std-err"></div>';
      if (typeof wvShowError === 'function') wvShowError('ch-std-err', _ch.chartsErr, "_ch.chartsState='idle';chLoadCharts()");
      else document.getElementById('ch-std-err').innerHTML = '<div class="ch-empty">couldnt load the charts</div>';
      return;
    }
    panel.innerHTML = controls + '<div class="ch-list">' + chSkelRows(10) + '</div>';
    return;
  }

  var list = chRankList(src, sort);
  var noun = type === 'comps' ? 'comps' : type === 'archive' ? 'archive comps' : 'edits';
  var isComp = type !== 'edits';
  var dest = isComp ? '/album?id=' : '/track?id=';

  if (typeof window.setPageBgImage === 'function') {
    window.setPageBgImage(list.length && list[0].cover_url ? list[0].cover_url : '', list.length ? list[0].title : '');
  }

  if (!list.length) {
    var msg = sort === 'ratings'
      ? '<b>no ' + noun + ' with ' + _ch.minRatings + '+ ratings yet</b>rate the stuff you love and it lands here'
      : (tab === 'new' ? '<b>nothing new this week yet</b>fresh ' + noun + ' from the last 7 days show up here' : '<b>no ' + noun + ' yet</b>');
    panel.innerHTML = controls + '<div class="ch-empty">' + msg + '</div>';
    return;
  }

  _ch.queues[tab] = isComp ? [] : list.filter(function (t) { return t.ia_url; });
  var limit = _ch.expanded[tab] ? CH_MAX : CH_PAGE;
  var rows = list.slice(0, limit).map(function (t, i) {
    var artist = (t.archive_artist_name || (t.artists ? t.artists.display_name : '')) || 'Unknown';
    var cr = isComp
      ? chCreator({ is_archive: type === 'archive', archive_artist_name: t.archive_artist_name || artist, artists: t.artists })
      : { name: artist, href: t.artists && t.artists.id ? '/artist?id=' + encodeURIComponent(t.artists.id) : '' };
    var act = isComp ? 'data-act="play-comp" data-id="' + chEsc(t.id) + '"' : 'data-act="play-edit" data-sec="' + tab + '" data-id="' + chEsc(t.id) + '"';
    return '<div class="wv-chart-row ch-row ch-grid-std' + (i < 3 ? ' top' : '') + '" role="link" tabindex="0" data-href="' + chEsc(dest + encodeURIComponent(t.id)) + '" aria-label="#' + (i + 1) + ' ' + chEsc(t.title || '') + ' by ' + chEsc(cr.name) + '"' + (_ch.animate ? ' style="animation-delay:' + Math.min(i * 22, 400) + 'ms"' : '') + '>' +
      '<div class="ch-rank"><span class="ch-num">' + (i + 1) + '</span></div>' +
      '<div class="ch-main">' +
        '<div class="ch-cover wv-chart-cover" style="background:' + coverGradient(t.title || '') + ';">' +
          (t.cover_url ? '<img src="' + chEsc(t.cover_url) + '" alt="" loading="lazy" width="48" height="48" onerror="this.style.opacity=0">' : '') +
          '<button class="wv-chart-play" type="button" ' + act + ' aria-label="Play ' + chEsc(t.title || '') + '">' + chIcon('play', 16) + '</button>' +
        '</div>' +
        '<div class="ch-text"><div class="ch-t">' + chEsc(t.title || 'Untitled') + '</div><div class="ch-s">' + chCreatorLink(cr) + '</div></div>' +
      '</div>' +
      '<div class="ch-metric">' + chMetric(t, sort) + '</div>' +
    '</div>';
  }).join('');

  var more = list.length > CH_PAGE
    ? '<div class="ch-more-wrap"><button class="ch-more" type="button" data-act="more" aria-expanded="' + (_ch.expanded[tab] ? 'true' : 'false') + '">' + (_ch.expanded[tab] ? 'Show top 20' : 'Show all ' + list.length) + chIcon('chev', 16) + '</button></div>'
    : '';

  panel.innerHTML = controls +
    '<div class="ch-list' + (_ch.animate ? ' ch-anim' : '') + '">' +
      '<div class="ch-colhead ch-grid-std" aria-hidden="true"><div style="text-align:center;">#</div><div>Title</div><div class="r">' + chMetricLabel(sort) + '</div></div>' +
      rows +
    '</div>' + more;
  _ch.animate = false;
}

function chartPlay(section, id) {
  var list = _ch.queues[section] || [];
  var idx = -1;
  for (var i = 0; i < list.length; i++) if (list[i].id === id) { idx = i; break; }
  if (idx < 0) { if (typeof wvToast === 'function') wvToast('that one has no audio yet'); return; }
  var queue = list.map(function (t) {
    return {
      id: t.id, title: t.title, ia_url: t.ia_url, cover_url: t.cover_url || null,
      artist_name: t.archive_artist_name || (t.artists ? t.artists.display_name : '') || '',
      album_id: t.album_id || null, artist_id: t.artist_id || (t.artists && t.artists.id) || null
    };
  });
  setPlayerQueue(queue, idx);
  playQueueIndex(idx);
}

initCharts();
</script>
</body>
</html>
