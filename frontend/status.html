<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — status</title>
  <link rel="icon" type="image/x-icon" href="/icon.ico">
  <style>
    html, body { margin:0; padding:0; background:#000; color:#f2f2f4;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:22px; padding:40px 20px; box-sizing:border-box; }
    .brand { font-size:22px; font-weight:800; letter-spacing:-.02em; }
    .foot { font-size:13.5px; color:#8b8b93; text-align:center; line-height:1.7; }
    .foot a { color:#d6d6dc; }
    #st { width:100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">wavernrs status</div>
    <div id="st"></div>
    <div class="foot">
      Updates are also posted in the Discord:
      <a href="https://discord.gg/j2jGmw5CZH" target="_blank" rel="noopener">https://discord.gg/j2jGmw5CZH</a><br>
      <a href="/index">Back to wavernrs</a>
    </div>
  </div>
  <script src="/js/status-card.js?v=c6e1b1639bb8"></script>
  <script>
    (function () {
      var box = document.getElementById('st');
      wvStatus.styleOnce();
      wvStatus.load().then(function (d) {
        box.innerHTML = wvStatus.render(d);
      }).catch(function () {
        box.innerHTML = wvStatus.render({ state: 'operational', updates: [] });
      });
    })();
  </script>
</body>
</html>
