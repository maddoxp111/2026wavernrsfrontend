<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavernrs — eras</title>

<body>

<div id="view">
  <style>
    #view .er-wrap { max-width: 1240px; }
    #view .er-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    #view .er-kick { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); }
    #view .er-head h1 { margin:6px 0 8px; font-size:clamp(34px,5vw,52px); font-weight:900; letter-spacing:-.045em; line-height:1; }
    #view .er-sub { font-size:13.5px; color:var(--text-2); min-height:18px; }
    #view .er-sub b { color:var(--text); font-weight:800; font-variant-numeric:tabular-nums; }

    #view .er-tools { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:20px 0 22px; }
    #view .er-seg { display:inline-flex; background:var(--surface-2); border-radius:99px; padding:4px; gap:2px; }
    #view .er-seg button { border:none; background:transparent; color:var(--text-2); font:inherit; font-size:13.5px; font-weight:700;
      padding:0 16px; height:36px; border-radius:99px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
      transition:background .15s,color .15s; white-space:nowrap; }
    #view .er-seg button svg { width:15px; height:15px; flex:none; }
    #view .er-seg button:hover { color:var(--text); }
    #view .er-seg button.on { background:var(--brand); color:var(--on-brand); }
    #view .er-seg button:focus-visible, #view .er-yrs button:focus-visible, #view .er-nav:focus-visible,
    #view .er-card:focus-visible, #view .er-ti-card:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
    #view .er-filter { margin-left:auto; display:flex; align-items:center; gap:8px; height:44px; padding:0 8px 0 14px; min-width:240px;
      background:var(--surface-2); border-radius:99px; border:1px solid transparent; transition:border-color .15s, background .15s; }
    #view .er-filter:focus-within { border-color:var(--brand); background:var(--surface); }
    #view .er-filter svg { width:16px; height:16px; color:var(--text-3); flex:none; }
    #view .er-filter input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font:inherit; font-size:14px; }
    #view .er-filter input::placeholder { color:var(--text-3); }
    #view .er-filter input::-webkit-search-cancel-button { display:none; }
    #view .er-filter .er-x { width:32px; height:32px; border-radius:50%; border:0; background:transparent; color:var(--text-3); cursor:pointer; display:none; place-items:center; }
    #view .er-filter .er-x:hover { color:var(--text); background:var(--surface-3); }
    #view .er-filter.has .er-x { display:grid; }

    /* timeline */
    #view .er-yrs { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:0 0 12px; margin:0 0 4px; }
    #view .er-yrs::-webkit-scrollbar { display:none; }
    #view .er-yrs button { flex:none; border:0; background:transparent; color:var(--text-3); font:inherit; font-size:12.5px; font-weight:800;
      height:32px; padding:0 11px; border-radius:99px; cursor:pointer; font-variant-numeric:tabular-nums; transition:background .15s,color .15s; }
    #view .er-yrs button:hover { color:var(--text); background:var(--surface-2); }
    #view .er-yrs button.on { color:var(--brand); background:var(--brand-bg); }
    #view .er-railwrap { position:relative; margin:0 -8px; }
    #view .er-rail { overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity; scrollbar-width:none; overscroll-behavior-x:contain;
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
              mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%); }
    #view .er-rail::-webkit-scrollbar { display:none; }
    #view .er-track { position:relative; display:flex; gap:20px; padding:4px 32px 18px; width:max-content; }
    #view .er-track::before { content:''; position:absolute; left:16px; right:16px; top:39px; height:2px; border-radius:2px;
      background:linear-gradient(90deg,transparent,var(--hair-strong) 48px,var(--hair-strong) calc(100% - 48px),transparent); }
    #view .er-ti { width:200px; flex:none; scroll-snap-align:start; scroll-margin-left:32px; position:relative; }
    #view .er-ti-yr { height:24px; font-size:17px; font-weight:900; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--text); white-space:nowrap; }
    #view .er-ti-yr.un { font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); padding-top:6px; }
    #view .er-ti-node { height:24px; display:flex; align-items:center; }
    #view .er-ti-node i { display:block; width:12px; height:12px; border-radius:50%; background:hsl(var(--h1,262) 72% 62%);
      box-shadow:0 0 0 4px var(--page-bg-base), 0 0 18px hsla(var(--h1,262),80%,60%,.75); transition:background .4s, box-shadow .4s; }
    #view .er-ti-node i.un { background:var(--page-bg-base); border:2px solid var(--text-3); box-shadow:0 0 0 4px var(--page-bg-base); }
    #view .er-ti-stem { position:absolute; left:5px; top:52px; width:2px; height:12px; background:var(--hair-strong); border-radius:2px; }
    #view .er-ti-card { display:block; margin-top:14px; color:inherit; text-decoration:none; border-radius:14px; }
    #view .er-ti-cv { aspect-ratio:1; border-radius:14px; overflow:hidden; position:relative;
      box-shadow:0 18px 34px -16px hsla(var(--h1,262),75%,35%,.85), 0 2px 8px rgba(0,0,0,.22);
      transition:transform .22s var(--ease), box-shadow .22s var(--ease); }
    #view .er-ti-cv img, #view .er-card .cv img { width:100%; height:100%; object-fit:cover; display:block; }
    #view .er-ti-card:hover .er-ti-cv { transform:translateY(-5px) scale(1.015); box-shadow:0 26px 44px -16px hsla(var(--h1,262),85%,45%,.9), 0 2px 8px rgba(0,0,0,.22); }
    #view .er-ti-nm { font-size:15px; font-weight:800; letter-spacing:-.01em; line-height:1.25; margin-top:12px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    #view .er-ti-mt { font-size:12px; color:var(--text-3); margin-top:4px; font-variant-numeric:tabular-nums; }
    #view .er-nav { position:absolute; top:144px; z-index:2; width:44px; height:44px; border-radius:50%; border:1px solid var(--hair-strong);
      background:var(--surface); color:var(--text); display:grid; place-items:center; cursor:pointer;
      box-shadow:0 8px 24px rgba(0,0,0,.3); transition:opacity .2s, transform .15s; }
    #view .er-nav:hover { transform:scale(1.06); }
    #view .er-nav[disabled] { opacity:0; pointer-events:none; }
    #view .er-nav.prev { left:0; } #view .er-nav.next { right:0; }
    #view .er-nav svg { width:18px; height:18px; }
    #view .er-legend { display:flex; gap:18px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--text-3); margin:6px 0 0; }
    #view .er-legend span { display:inline-flex; align-items:center; gap:7px; }
    #view .er-legend i { width:9px; height:9px; border-radius:50%; background:var(--brand); display:inline-block; }
    #view .er-legend i.un { background:transparent; border:2px solid var(--text-3); width:9px; height:9px; }

    /* grid */
    #view .er-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:14px; }
    #view .er-card { position:relative; display:block; padding:10px 10px 13px; border-radius:16px; color:inherit; text-decoration:none;
      background:linear-gradient(180deg,hsla(var(--h1,262),70%,55%,.20),hsla(var(--h2,300),70%,45%,.04) 72%);
      border:1px solid hsla(var(--h1,262),70%,62%,.14);
      transition:transform .22s var(--ease), box-shadow .22s var(--ease), background .5s, border-color .5s; }
    .theme-light #view .er-card { background:linear-gradient(180deg,hsla(var(--h1,262),75%,55%,.17),hsla(var(--h2,300),70%,50%,.03) 72%); border-color:hsla(var(--h1,262),60%,45%,.14); }
    #view .er-card:hover { transform:translateY(-4px); box-shadow:0 20px 40px -20px hsla(var(--h1,262),80%,40%,.85); }
    #view .er-card .cv { aspect-ratio:1; border-radius:10px; overflow:hidden; position:relative; box-shadow:0 10px 24px -10px rgba(0,0,0,.55); }
    #view .er-card .nm { font-size:14.5px; font-weight:800; letter-spacing:-.01em; line-height:1.25; margin-top:11px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #view .er-card .mt { font-size:12px; color:var(--text-3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
    #view .er-yr { color:var(--text-2); font-weight:800; }
    #view .er-rank { position:absolute; top:8px; left:8px; z-index:1; font-size:11px; font-weight:900; padding:3px 8px; border-radius:99px;
      background:rgba(10,8,16,.62); color:#fff; font-variant-numeric:tabular-nums; }
    #view .er-bar { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(0,0,0,.35); }
    #view .er-bar i { display:block; height:100%; background:hsl(var(--h1,262) 80% 64%); transition:background .5s; }

    #view .er-skel-cv { aspect-ratio:1; border-radius:14px; }
    #view .er-skel-l { height:12px; border-radius:6px; margin-top:12px; width:70%; }
    #view .er-skel-l.s { width:45%; margin-top:8px; height:10px; }
    #view .er-none { grid-column:1/-1; text-align:center; padding:48px 16px; color:var(--text-3); font-size:14px; }
    #view .er-none button { margin-top:12px; }

    @media (hover:none), (max-width:640px) { #view .er-nav { display:none; } }
    @media (max-width:640px) {
      #view .er-tools { gap:10px; margin:16px 0 18px; }
      #view .er-seg { width:100%; }
      #view .er-seg button { flex:1; justify-content:center; padding:0 8px; font-size:13px; height:38px; }
      #view .er-seg button svg { display:none; }
      #view .er-filter { width:100%; min-width:0; margin-left:0; }
      #view .er-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      #view .er-card { padding:8px 8px 11px; border-radius:14px; }
      #view .er-card .nm { font-size:13.5px; }
      #view .er-card .er-ed { display:none; }
      #view .er-railwrap { margin:0 -16px; }
      #view .er-track { gap:14px; padding:4px 20px 14px; }
      #view .er-ti { width:156px; scroll-margin-left:20px; }
      #view .er-ti-nm { font-size:14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #view .er-card, #view .er-ti-cv, #view .er-nav { transition:none; }
      #view .er-card:hover, #view .er-ti-card:hover .er-ti-cv { transform:none; }
      #view .er-rail { scroll-behavior:auto; }
    }

    /* detail sheet (appended to body) */
    .ers-ov { position:fixed; inset:0; z-index:3000; display:flex; align-items:center; justify-content:center; padding:24px;
      background:rgba(6,4,12,.62); animation:ers-fade .2s var(--ease); }
    .theme-light .ers-ov { background:rgba(20,16,32,.42); }
    .ers-sheet { position:relative; width:min(920px,100%); max-height:min(88vh,960px); display:flex; flex-direction:column;
      background:var(--surface); color:var(--text); border-radius:20px; overflow:hidden;
      box-shadow:0 40px 120px -24px rgba(0,0,0,.75), 0 0 0 1px var(--hair); animation:ers-pop .28s var(--ease); }
    .ers-scroll { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
    .ers-grab { display:none; }
    .ers-bar { position:absolute; top:0; left:0; right:0; z-index:5; height:68px; display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:0 14px 0 30px; pointer-events:none; transition:background .2s, box-shadow .2s; }
    .ers-bar.solid { background:var(--surface); box-shadow:0 1px 0 var(--hair), 0 12px 24px -18px rgba(0,0,0,.6); }
    .ers-bar-t { min-width:0; font-size:16px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      opacity:0; transform:translateY(4px); transition:opacity .2s, transform .2s; }
    .ers-bar.solid .ers-bar-t { opacity:1; transform:none; }
    .ers-btns { display:flex; gap:8px; flex:none; pointer-events:auto; }
    .ers-mono { position:absolute; inset:0; display:flex; align-items:flex-end; padding:12px; font-size:19px; font-weight:900; letter-spacing:-.03em;
      line-height:1.02; color:rgba(255,255,255,.96); text-shadow:0 2px 8px rgba(0,0,0,.35); text-transform:uppercase; overflow-wrap:anywhere;
      background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 45%); }
    .ers-mono + img, .ers-mono ~ img { position:absolute; inset:0; }
    .ers-ib { width:40px; height:40px; border-radius:50%; border:0; cursor:pointer; display:grid; place-items:center; color:var(--text);
      background:color-mix(in srgb, var(--surface) 72%, transparent); box-shadow:0 0 0 1px var(--hair); transition:background .15s, transform .12s; }
    .ers-ib:hover { background:var(--surface-2); }
    .ers-ib:active { transform:scale(.94); }
    .ers-ib[disabled] { opacity:.35; pointer-events:none; }
    .ers-ib svg { width:18px; height:18px; }
    .ers-hero { position:relative; isolation:isolate; overflow:hidden; display:flex; align-items:flex-end; gap:26px; padding:34px 30px 26px; }
    .ers-hero-bg { position:absolute; inset:-60px; z-index:-2; background-size:cover; background-position:center; filter:blur(50px) saturate(1.35); opacity:.5; }
    .theme-light .ers-hero-bg { opacity:.32; }
    .ers-hero::after { content:''; position:absolute; inset:0; z-index:-1;
      background:linear-gradient(180deg,hsla(var(--h1,262),72%,52%,.30) 0%,hsla(var(--h2,300),70%,45%,.10) 55%,var(--surface) 100%); }
    .ers-art { width:220px; height:220px; flex:none; border-radius:14px; overflow:hidden; position:relative;
      box-shadow:0 26px 60px -18px hsla(var(--h1,262),80%,30%,.9), 0 4px 14px rgba(0,0,0,.3); }
    .ers-art img { width:100%; height:100%; object-fit:cover; display:block; }
    .ers-id { flex:1; min-width:0; padding-bottom:2px; }
    .ers-kick { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-2); display:flex; align-items:center; gap:8px; }
    .ers-kick i { width:8px; height:8px; border-radius:50%; background:hsl(var(--h1,262) 75% 60%); display:inline-block; }
    .ers-title { font-size:clamp(28px,4.2vw,48px); font-weight:900; letter-spacing:-.045em; line-height:1.02; margin:8px 0 14px; overflow-wrap:anywhere; }
    .ers-stats { display:flex; gap:26px; flex-wrap:wrap; }
    .ers-stat b { display:block; font-size:22px; font-weight:900; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.1; }
    .ers-stat span { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
    .ers-acts { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
    .ers-btn { height:44px; padding:0 20px; border-radius:99px; font:inherit; font-size:14px; font-weight:800; cursor:pointer;
      display:inline-flex; align-items:center; gap:8px; text-decoration:none; white-space:nowrap; transition:transform .12s, filter .15s, border-color .15s, background .15s; }
    .ers-btn svg { width:17px; height:17px; flex:none; }
    .ers-btn.pri { background:var(--brand); color:var(--on-brand); border:0; }
    .ers-btn.pri:hover { filter:brightness(1.08); transform:scale(1.02); }
    .ers-btn.gho { background:transparent; color:var(--text); border:1px solid var(--hair-strong); }
    .ers-btn.gho:hover { border-color:var(--text); }
    .ers-btn:active { transform:scale(.97); }
    .ers-btn.busy { opacity:.7; pointer-events:none; }
    .ers-btn:focus-visible, .ers-ib:focus-visible, .ers-cc a:focus-visible, .ers-cc-play:focus-visible, .ers-row a:focus-visible,
    .ers-row-play:focus-visible, .ers-more:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    .ers-sec { padding:10px 30px 26px; }
    .ers-sh { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 14px; }
    .ers-sh h3 { margin:0; font-size:19px; font-weight:800; letter-spacing:-.02em; }
    .ers-sh span { font-size:12.5px; color:var(--text-3); }
    .ers-comps { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px 14px; }
    @media (min-width:960px) { .ers-comps { grid-template-columns:repeat(6,minmax(0,1fr)); } }
    .ers-cc { min-width:0; }
    .ers-cc-cv { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; box-shadow:0 10px 22px -12px rgba(0,0,0,.6); }
    .ers-cc-cv a { position:absolute; inset:0; display:block; }
    .ers-cc-cv img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s var(--ease); }
    .ers-cc:hover .ers-cc-cv img { transform:scale(1.05); }
    .ers-rk { position:absolute; top:7px; left:7px; z-index:1; pointer-events:none; font-size:11px; font-weight:900; padding:3px 8px; border-radius:99px;
      background:rgba(10,8,16,.62); color:#fff; font-variant-numeric:tabular-nums; }
    .ers-cc-play { position:absolute; right:8px; bottom:8px; z-index:2; width:42px; height:42px; border-radius:50%; border:0; cursor:pointer;
      background:var(--brand); color:var(--on-brand); display:grid; place-items:center; box-shadow:0 8px 18px rgba(0,0,0,.45);
      opacity:0; transform:translateY(6px); transition:opacity .18s var(--ease), transform .18s var(--ease); }

    .ers-cc:hover .ers-cc-play, .ers-cc-play:focus-visible { opacity:1; transform:none; }
    .ers-cc-t { display:block; font-size:13.5px; font-weight:700; margin-top:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:inherit; text-decoration:none; }
    .ers-cc-t:hover { text-decoration:underline; }
    .ers-cc-s { font-size:12px; color:var(--text-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ers-rows { display:flex; flex-direction:column; gap:2px; }
    .ers-row { display:flex; align-items:center; gap:12px; padding:6px 8px; margin:0 -8px; border-radius:10px; transition:background .15s; }
    .ers-row:hover { background:var(--surface-hover); }
    .ers-row-play { position:relative; width:48px; height:48px; flex:none; border-radius:8px; overflow:hidden; border:0; padding:0; cursor:pointer; background:var(--surface-2); }
    .ers-row-play img { width:100%; height:100%; object-fit:cover; display:block; }
    .ers-row-play span { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.45); color:#fff; opacity:0; transition:opacity .15s; }
    .ers-row-play span svg { width:18px; height:18px; }
    .ers-row:hover .ers-row-play span, .ers-row-play:focus-visible span { opacity:1; }
    .ers-row a { flex:1; min-width:0; color:inherit; text-decoration:none; }
    .ers-row-t { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ers-row-s { font-size:12px; color:var(--text-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ers-kind { display:inline-block; font-size:9.5px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border-radius:4px;
      background:var(--surface-2); color:var(--text-2); margin-right:6px; vertical-align:1px; }
    .ers-kind.c { background:var(--brand-bg); color:var(--brand); }
    .ers-row-n { font-size:12px; color:var(--text-3); white-space:nowrap; font-variant-numeric:tabular-nums; }

    .ers-more:hover { background:var(--surface-3); }
    .ers-more svg { width:16px; height:16px; }
    .ers-err { text-align:center; padding:22px 12px; color:var(--text-3); font-size:13.5px; }
    .ers-err button { margin-top:10px; }
    .ers-empty { padding:18px 0; color:var(--text-3); font-size:13.5px; }
    .ers-sk-cv { aspect-ratio:1; border-radius:10px; }
    .ers-sk-l { height:11px; border-radius:6px; margin-top:10px; width:80%; }
    .ers-sk-l.s { width:50%; margin-top:7px; height:9px; }
    .ers-sk-row { display:flex; gap:12px; align-items:center; padding:6px 0; }
    .ers-sk-row .a { width:48px; height:48px; border-radius:8px; flex:none; }
    .ers-sk-row .b { flex:1; }
    @keyframes ers-fade { from { opacity:0; } to { opacity:1; } }
    @keyframes ers-pop { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
    @keyframes ers-up { from { transform:translateY(100%); } to { transform:none; } }

    sc.innerHTML =
      '<div class="ers-hero">' +
        (e.cover ? '<div class="ers-hero-bg" style="background-image:' + cssUrl(window.wvImg ? window.wvImg(e.cover, 64) : e.cover) + '"></div>' : '') +
        '<div class="ers-art" style="background:' + grad(e.name) + ';">' + mono(e) + img(e.cover, 240, e.name + ' cover') + '</div>' +
        '<div class="ers-id">' +
          '<div class="ers-kick"><i></i>era' + (y ? ' · ' + esc(y) : (isOther(e) ? '' : ' · unreleased')) + '</div>' +
          '<h2 class="ers-title" id="ers-title">' + esc(e.name) + '</h2>' +
          '<div class="ers-stats">' + stats + '</div>' +
          '<div class="ers-acts">' +
            '<button type="button" class="ers-btn pri" data-act="random"' + (e.comps ? '' : ' disabled') + '>' + ICON.shuffle + 'Play a random comp</button>' +
            '<a class="ers-btn gho" href="/archive?era=' + encodeURIComponent(e.id) + '">' + ICON.arch + 'Open in archive</a>' +
            '<a class="ers-btn gho" href="/browse?era=' + encodeURIComponent(e.id) + '">' + ICON.compass + 'Browse this era</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<section class="ers-sec"><div class="ers-sh"><h3>Top comps</h3><span>most liked in the archive</span></div><div id="ers-comps"></div></section>' +
      '<section class="ers-sec"><div class="ers-sh"><h3>Latest on wavernrs</h3><span>new edits and comps</span></div><div id="ers-latest"></div></section>';
    loadComps(e, seq);
    loadLatest(e, seq);
  }

  function skelComps() {
    var c = '';
    for (var i = 0; i < 8; i++) c += '<div class="ers-cc"><div class="wv-skel ers-sk-cv"></div><div class="wv-skel ers-sk-l"></div><div class="wv-skel ers-sk-l s"></div></div>';
    return '<div class="ers-comps">' + c + '</div>';
  }
  function skelRows() {
    var c = '';
    for (var i = 0; i < 5; i++) c += '<div class="ers-sk-row"><div class="wv-skel a"></div><div class="b"><div class="wv-skel ers-sk-l" style="margin-top:0;width:55%;"></div><div class="wv-skel ers-sk-l s"></div></div></div>';
    return c;
  }
  function errBlock(err, act) {
    var busy = typeof window.wvIsBusyError === 'function' && window.wvIsBusyError(err);
    return '<div class="ers-err">' + (busy ? 'wavernrs is having problems rn' : 'couldnt load this') + '<br><button type="button" class="wv-pill brand" data-act="' + act + '">Try again</button></div>';
  }

  function loadComps(e, seq) {
    var box = document.getElementById('ers-comps');
    if (!box) return;
    box.innerHTML = skelComps();
    fetchPart(e.id, 'comps').then(function (items) {
      if (seq !== _sheetSeq || !document.getElementById('ers-comps')) return;
      if (!items.length) { box.innerHTML = '<div class="ers-empty">no comps in the archive for this era yet</div>'; return; }
      box.innerHTML = '<div class="ers-comps">' + items.map(function (a, i) {
        var who = a.archive_artist_name || (a.artists && a.artists.display_name) || '';
        var sub = [];
        if (who) sub.push(esc(who));
        if (a.external_likes) sub.push('♥ ' + num(a.external_likes));
        else if (a.track_count) sub.push(plural(a.track_count, 'track'));
        var href = '/album?id=' + encodeURIComponent(a.id);
        return '<div class="ers-cc">' +
          '<div class="ers-cc-cv" style="background:' + grad(a.title) + ';">' +
            '<a href="' + href + '" tabindex="-1" aria-hidden="true">' + img(a.cover_url, 170, '') + '</a>' +
            '<span class="ers-rk">' + (i + 1) + '</span>' +
            '<button type="button" class="ers-cc-play" data-play-comp="' + esc(a.id) + '" aria-label="Play ' + esc(a.title) + '">' + ICON.play + '</button>' +
          '</div>' +
          '<a class="ers-cc-t" href="' + href + '">' + esc(a.title || 'untitled') + '</a>' +
          '<div class="ers-cc-s">' + sub.join(' · ') + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }).catch(function (err) {
      if (err && err.navAborted) return;
      if (seq !== _sheetSeq) return;
      var b = document.getElementById('ers-comps');
      if (b) b.innerHTML = errBlock(err, 'retry-comps');
    });
  }

  function loadLatest(e, seq) {
    var box = document.getElementById('ers-latest');
    if (!box) return;
    box.innerHTML = skelRows();
    fetchPart(e.id, 'latest').then(function (items) {
      if (seq !== _sheetSeq || !document.getElementById('ers-latest')) return;
      var list = items.slice(0, 10);
      if (!list.length) { box.innerHTML = '<div class="ers-empty">nobody has uploaded to this era yet</div>'; return; }
      var ago = typeof window.timeAgo === 'function' ? window.timeAgo : function () { return ''; };
      box.innerHTML = '<div class="ers-rows">' + list.map(function (it, i) {
        var isAlbum = it._type === 'album';
        var who = it.archive_artist_name || (it.artists && it.artists.display_name) || '';
        var href = (isAlbum ? '/album?id=' : '/track?id=') + encodeURIComponent(it.id);
        var sub = [];
        if (who) sub.push(esc(who));
        if (it.created_at) sub.push(esc(ago(it.created_at)));
        return '<div class="ers-row">' +
          '<button type="button" class="ers-row-play" data-play-latest="' + i + '" aria-label="Play ' + esc(it.title) + '" style="background:' + grad(it.title) + ';">' + img(it.cover_url, 48, '') + '<span>' + ICON.play + '</span></button>' +
          '<a href="' + href + '"><div class="ers-row-t">' + esc(it.title || 'untitled') + '</div>' +
            '<div class="ers-row-s"><span class="ers-kind' + (isAlbum ? ' c' : '') + '">' + (isAlbum ? 'comp' : 'edit') + '</span>' + sub.join(' · ') + '</div></a>' +
          (it.play_count ? '<div class="ers-row-n">' + plural(it.play_count, 'play') + '</div>' : '') +
        '</div>';
      }).join('') + '</div>' +
      '<a class="ers-more" href="/browse?era=' + encodeURIComponent(e.id) + '">See everything from ' + esc(e.name) + ICON.arrow + '</a>';
    }).catch(function (err) {
      if (err && err.navAborted) return;
      if (seq !== _sheetSeq) return;
      var b = document.getElementById('ers-latest');
      if (b) b.innerHTML = errBlock(err, 'retry-latest');
    });
  }

  function playLatest(i) {
    var c = _cache[_sheetId];
    if (!c || !c.latest) return;
    c.latest.then(function (items) {
      var list = items.slice(0, 10);
      var it = list[i];
      if (!it) return;
      if (it._type === 'album') return window.playCompById && window.playCompById(it.id, { album: it });
      if (!it.ia_url) { if (window.wvToast) window.wvToast('that edit has no audio yet'); return; }
      var playable = list.filter(function (x) { return x._type !== 'album' && x.ia_url; });
      var idx = playable.indexOf(it);
      var q = playable.map(function (x) {
        return { id: x.id, title: x.title, ia_url: x.ia_url, cover_url: x.cover_url || null,
          artist_name: x.archive_artist_name || (x.artists && x.artists.display_name) || '', album_id: x.album_id || null, artist_id: x.artists ? x.artists.id : null };
      });
      window.setPlayerQueue(q, Math.max(0, idx));
      window.playQueueIndex(Math.max(0, idx));
    }).catch(function () {});
  }

  function playRandom(btn) {
    var id = _sheetId;
    if (!id) return;
    if (btn) btn.classList.add('busy');
    var done = function () { if (btn) btn.classList.remove('busy'); };
    Promise.all([
      fetchPart(id, 'comps').catch(function () { return []; }),
      fetchPart(id, 'latest').catch(function () { return []; })
    ]).then(function (r) {
      var pool = r[0].slice();
      r[1].forEach(function (x) { if (x._type === 'album' && !pool.some(function (p) { return p.id === x.id; })) pool.push(x); });
      if (!pool.length) { done(); if (window.wvToast) window.wvToast('no comps in this era yet'); return; }
      var pick = pool[Math.floor(Math.random() * pool.length)];
      if (window.wvToast) window.wvToast('playing ' + (pick.title || 'a comp'));
      var p = window.playCompById ? window.playCompById(pick.id, { album: pick, quiet: true }) : null;
      if (p && p.then) p.then(done, done); else done();
    });
  }

  function onSheetClick(ev) {
    if (ev.target === _sheet) { closeSheet(); return; }
    var t = ev.target.closest('[data-act],[data-play-comp],[data-play-latest]');
    if (!t) return;
    if (t.hasAttribute('data-play-comp')) {
      ev.preventDefault();
      var c = _cache[_sheetId];
      var id = t.getAttribute('data-play-comp');
      var p = c && c.comps ? c.comps : Promise.resolve([]);
      p.then(function (items) {
        var a = items.filter(function (x) { return String(x.id) === id; })[0];
        if (window.playCompById) window.playCompById(id, a ? { album: a } : {});
      }).catch(function () { if (window.playCompById) window.playCompById(id); });
      return;
    }
    if (t.hasAttribute('data-play-latest')) { ev.preventDefault(); playLatest(parseInt(t.getAttribute('data-play-latest'), 10)); return; }
    var act = t.getAttribute('data-act');
    var e = eraById(_sheetId);
    if (act === 'close') closeSheet();
    else if (act === 'prev') stepSheet(-1);
    else if (act === 'next') stepSheet(1);
    else if (act === 'random') playRandom(t);
    else if (act === 'retry-comps' && e) loadComps(e, _sheetSeq);
    else if (act === 'retry-latest' && e) loadLatest(e, _sheetSeq);
  }

  function onKey(ev) {
    if (!_sheet) return;
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); closeSheet(); return; }
    var tag = (ev.target && ev.target.tagName) || '';
    if ((ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && !/INPUT|TEXTAREA|SELECT/.test(tag) && !ev.altKey && !ev.metaKey && !ev.ctrlKey) {
      if (ev.target && ev.target.closest && ev.target.closest('.ers-comps')) return;
      ev.preventDefault();
      ev.stopPropagation();
      stepSheet(ev.key === 'ArrowRight' ? 1 : -1);
      return;
    }
    if (ev.key === 'Tab') {
      var f = Array.prototype.filter.call(_sheet.querySelectorAll('a[href],button:not([disabled]),[tabindex]:not([tabindex="-1"])'), function (x) { return x.tabIndex >= 0 && x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (!_sheet.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
      else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  }

  function wireSwipe(sheet) {
    var y0 = null, dy = 0, dragging = false;
    var sc = function () { return document.getElementById('ers-scroll'); };
    sheet.addEventListener('touchstart', function (ev) {
      if (window.innerWidth > 640 || ev.touches.length !== 1) return;
      var s = sc();
      var onGrab = ev.target.closest && ev.target.closest('.ers-grab');
      if (!onGrab && s && s.scrollTop > 0) return;
      if (ev.target.closest && ev.target.closest('.ers-comps')) return;
      y0 = ev.touches[0].clientY; dy = 0; dragging = false;
    }, { passive: true });
    sheet.addEventListener('touchmove', function (ev) {
      if (y0 == null) return;
      dy = ev.touches[0].clientY - y0;
      if (dy > 6) { dragging = true; sheet.style.transition = 'none'; sheet.style.transform = 'translateY(' + dy + 'px)'; }
      else if (dy < -4 && !dragging) y0 = null;
    }, { passive: true });
    sheet.addEventListener('touchend', function () {
      if (y0 == null) return;
      y0 = null;
      if (!dragging) return;
      if (dy > 110) { closeSheet(); return; }
      sheet.style.transition = 'transform .22s var(--ease)';
      sheet.style.transform = '';
    });
  }

  var root = document.getElementById('er-root');
  if (root) {
    root.addEventListener('click', function (ev) {
      var seg = ev.target.closest('[data-view]');
      if (seg) { setView(seg.getAttribute('data-view')); return; }
      var j = ev.target.closest('[data-jump]');
      if (j) { jumpYear(j.getAttribute('data-jump')); return; }
      if (ev.target.closest('#er-prev')) { page(-1); return; }
      if (ev.target.closest('#er-next')) { page(1); return; }
      if (ev.target.closest('[data-act="clear"]') || ev.target.closest('#er-x')) { ev.preventDefault(); setQuery(''); var qi = document.getElementById('er-q'); if (qi) qi.focus(); return; }
      var a = ev.target.closest('a[data-era]');
      if (a && !ev.defaultPrevented && ev.button === 0 && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey && !ev.altKey) {
        ev.preventDefault();
        openSheet(a.getAttribute('data-era'));
      }
    });
  }
  function setQuery(v) {
    _q = String(v || '');
    var qi = document.getElementById('er-q');
    if (qi && qi.value !== _q) qi.value = _q;
    var fl = document.getElementById('er-filter');
    if (fl) fl.classList.toggle('has', !!_q);
    render();
  }
  var qi = document.getElementById('er-q');
  if (qi) {
    var qt = 0;
    qi.addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(function () { if (_alive) setQuery(qi.value); }, 90); });
    qi.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && qi.value) { ev.preventDefault(); ev.stopPropagation(); setQuery(''); } });
  }

  function subline() {
    var sub = document.getElementById('er-sub');
    if (!sub) return;
    var comps = _eras.reduce(function (s, e) { return s + (e.comps || 0); }, 0);
    var edits = _eras.reduce(function (s, e) { return s + (e.edits || 0); }, 0);
    sub.innerHTML = '<b>' + num(_eras.length) + '</b> eras · <b>' + num(comps) + '</b> comps · <b>' + num(edits) + '</b> edits';
  }

  function boot() {
    setView(_view);
    skeleton();
    var disco = api('/ye/disco').then(function (d) {
      var y = {};
      ((d && d.albums) || []).forEach(function (a) { if (!a.year) return; if (!y[norm(a.era)]) y[norm(a.era)] = a.year; if (!y[norm(a.title)]) y[norm(a.title)] = a.year; });
      if (y.vultures1 && !y.vultures) y.vultures = y.vultures1;
      _years = y;
      return true;
    }).catch(function () { return false; });
    var soon = new Promise(function (res) { setTimeout(res, 1500); });
    api('/archive/eras').then(function (d) {
      if (!_alive) return;
      _eras = ((d && d.items) || []).filter(function (e) { return e && e.id; });
      bySize(_eras).forEach(function (e, i) { _sizeRank[e.id] = i + 1; });
      subline();
      if (!_eras.length) {
        var box = document.getElementById('er-body');
        if (box) box.innerHTML = '<div class="er-none">no eras yet</div>';
        return;
      }
      var first = true;
      Promise.race([disco, soon]).then(function () {
        if (!_alive) return;
        render();
        first = false;
        extractHues();
        var want = new URLSearchParams(location.search).get('era');
        if (want && eraById(want)) openSheet(want);
      });
      disco.then(function (ok) { if (ok && _alive && !first) { render(); if (_sheet && _sheetId) { var e = eraById(_sheetId); if (e) { var k = _sheet.querySelector('.ers-kick'); var y = yearOf(e); if (k && y) k.innerHTML = '<i></i>era · ' + esc(y); } } } });
    }).catch(function (err) {
      if (!_alive || (err && err.navAborted)) return;
      var box = document.getElementById('er-body');
      if (box && window.wvErrorHTML) box.innerHTML = window.wvErrorHTML(err, 'erRetry()');
      else if (box) box.innerHTML = '<div class="er-none">couldnt load the eras<br><button class="wv-pill brand" onclick="erRetry()">Try again</button></div>';
      var sub = document.getElementById('er-sub');
      if (sub) sub.textContent = '';
    });
  }
  window.erRetry = function () { boot(); };

  if (typeof initPlayer === 'function') initPlayer();
  if (typeof window.setPageWash === 'function') window.setPageWash('eras');
  boot();
})();
</script>
</body>
